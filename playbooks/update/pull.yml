---
- name: "📥 Pull every image the deploy of the host runs"
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: "🧮 Derive the images the deploy of the host runs"
      ansible.builtin.set_fact:
        update_pull_plan: "{{ lookup('applications') | update_pull_images(lookup('application_closure', group_names)) }}"

    - name: "📥 Pull the images"
      block:
        - name: "📥 Pull the image"
          ansible.builtin.script:
            cmd: "pull.sh {{ item | quote }}"
          loop: "{{ update_pull_plan.pull }}"
          register: update_pull_runs
          changed_when: update_pull_runs.stdout | trim == 'pulled'
          retries: 3
          delay: 10
          until: update_pull_runs is succeeded
          timeout: "{{ lookup('timeout', 3600) | int }}"
      always:
        - name: "📊 Show what the pull did"
          ansible.builtin.debug:
            msg: "{{ update_pull_runs.results | update_pull_summary(update_pull_plan.built) }}"
