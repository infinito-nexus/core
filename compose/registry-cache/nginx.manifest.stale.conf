# Replaces the file of the same name in rpardini/docker-registry-proxy 0.6.5, which omits http_503: a registry in maintenance answers 503, and without it nginx never serves the cached copy.
include "/etc/nginx/nginx.manifest.common.conf";
proxy_cache_use_stale  error timeout http_500 http_502 http_503 http_504 http_429;
