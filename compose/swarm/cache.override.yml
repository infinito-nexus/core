# Optional swarm-node package-cache wiring; 01_bootstrap.sh passes it only when a
# package-cache-frontend is running (local/act), so CI without a cache is unaffected.
---
x-cache: &cache
  extra_hosts:
    - "deb.debian.org:${INFINITO_CACHE_PACKAGE_FRONTEND_IP}"
    - "archive.ubuntu.com:${INFINITO_CACHE_PACKAGE_FRONTEND_IP}"
    - "security.ubuntu.com:${INFINITO_CACHE_PACKAGE_FRONTEND_IP}"
    - "infinito-registry-cache:${INFINITO_CACHE_REGISTRY_IP:?Run 'make dotenv' to generate the .env single source of truth}"
  volumes:
    - ../package-cache/apt.list:/etc/apt/sources.list.d/package-cache.list:ro
    - ${INFINITO_CACHE_REGISTRY_CA_HOST_PATH:?Run 'make dotenv' to generate the .env single source of truth}:/opt/registry-cache-ca:ro
    - ../../scripts/docker/cache/registry-ca.sh:/usr/local/bin/registry-cache-ca.sh:ro

services:
  nfs-server:
    <<: *cache
  swarm-mgr-01:
    <<: *cache
  swarm-wrk-01:
    <<: *cache
  swarm-wrk-02:
    <<: *cache
  backup-host:
    <<: *cache
