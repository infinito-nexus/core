---
name: infinito-infra

services:
  runner:
    image: "${INFINITO_IMAGE:?Resolved by make infra-up}"
    pull_policy: "${INFINITO_PULL_POLICY:?Run 'make dotenv' to generate the .env single source of truth}"
    container_name: ${INFINITO_INFRA_RUNNER_CONTAINER:?Run 'make dotenv' to generate the .env single source of truth}
    command:
      - /sbin/init
      - systemd.log_target=console
    stop_signal: SIGRTMIN+3
    privileged: true
    cgroup: host
    restart: unless-stopped
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/systemd/private && systemctl is-system-running --wait | grep -Eqx 'running|degraded'"]
    tmpfs:
      - /run
      - /run/lock
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      ANSIBLE_HOME: /var/lib/infinito-infra/ansible
      ANSIBLE_LOCAL_TEMP: /var/lib/infinito-infra/ansible/tmp
      ANSIBLE_REMOTE_TEMP: /var/lib/infinito-infra/ansible/remote
      XDG_CACHE_HOME: /var/lib/infinito-infra/cache
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - docker:${INFINITO_DOCKER_MOUNT:?Run 'make dotenv' to generate the .env single source of truth}
      - var-lib:${INFINITO_DIR_VAR_LIB:?Run 'make dotenv' to generate the .env single source of truth}/
      - state:/var/lib/infinito-infra
      - type: bind
        source: ${INFINITO_INFRA_CACHE_DIR:?Resolved by make infra-up}
        target: ${INFINITO_INFRA_CACHE_DIR}
        bind:
          create_host_path: true
      - type: bind
        source: ${INFINITO_CACHE_PIN_ROOT:?Run 'make dotenv' to generate the .env single source of truth}
        target: ${INFINITO_CACHE_PIN_ROOT}
        read_only: true
        bind:
          create_host_path: true
    ports:
      - "127.0.0.1:${INFINITO_TOOLS_TRANSLATE_PORT:?Run 'make dotenv' to generate the .env single source of truth}:${INFINITO_TOOLS_TRANSLATE_PORT}"
      - "127.0.0.1:${INFINITO_CACHE_PACKAGE_PORT:?Run 'make dotenv' to generate the .env single source of truth}:${INFINITO_CACHE_PACKAGE_PORT}"
    networks:
      infra:
        ipv4_address: ${INFINITO_INFRA_RUNNER_IP:?Resolved by make infra-up}
        aliases:
          - infinito-registry-cache
          - infinito-package-cache
          - infinito-package-cache-frontend
          - infinito-translate

networks:
  infra:
    name: infinito-infra
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "${INFINITO_OUTER_NETWORK_MTU:?Run 'make dotenv' to generate the .env single source of truth}"
    ipam:
      config:
        - subnet: ${INFINITO_INFRA_SUBNET:?Run 'make dotenv' to generate the .env single source of truth}

volumes:
  docker:
  var-lib:
  state:
