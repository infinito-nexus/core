}

server {
	listen 443 ssl;
	server_name registry.npmjs.org;
	ssl_certificate     /etc/nginx/certs/registry.npmjs.org.crt;
	ssl_certificate_key /etc/nginx/certs/registry.npmjs.org.key;
	# Tarball URLs Nexus emits already carry /repository/npm-proxy/; pass them
	# through as-is (no path on proxy_pass) so they aren't double-prefixed → 404.
	location /repository/npm-proxy/ {
		proxy_pass http://package-cache:8081;
	}
	location / {
		proxy_pass http://package-cache:8081/repository/npm-proxy/;
	}
}

