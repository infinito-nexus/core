proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Accept-Encoding   "";
proxy_buffering on;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_connect_timeout 30s;

# Docker embedded DNS, pinned to bypass image-specific resolv.conf order.
resolver 127.0.0.11 ipv6=off valid=30s;

# Nexus answers 502 when a proxy's remote is unreachable (measured) and has no
# group repository type for apt, so the mirror failover sits here rather than in
# the repo layout. 5xx only: a 404 means the file genuinely is not in the suite,
# and apt probes for missing files often enough that retrying those would double
# the request rate.
#
# These stay prefix locations. A regex location forfeits nginx's implicit
# `/debian` -> `/debian/` redirect, and the URL-reachability test probes exactly
# that slash-less form through the runner's DNS hijack, so it turns into a 404.
server {
	listen 80;
	server_name deb.debian.org;
	location /debian/ {
		rewrite ^/debian/(.*)$ /repository/apt-debian/$1 break;
		proxy_intercept_errors on;
		error_page 502 503 504 = @debian_mirror;
		proxy_pass http://package-cache:8081;
	}
	location @debian_mirror {
		rewrite ^/repository/apt-debian/(.*)$ /repository/apt-debian-mirror/$1 break;
		proxy_pass http://package-cache:8081;
	}
	location /debian-security/ {
		rewrite ^/debian-security/(.*)$ /repository/apt-debian-security/$1 break;
		proxy_intercept_errors on;
		error_page 502 503 504 = @debian_security_mirror;
		proxy_pass http://package-cache:8081;
	}
	location @debian_security_mirror {
		rewrite ^/repository/apt-debian-security/(.*)$ /repository/apt-debian-security-mirror/$1 break;
		proxy_pass http://package-cache:8081;
	}
}

