---
default_install_hook_types:
  - pre-commit
  - prepare-commit-msg
  - pre-push
  - post-checkout

repos:
  - repo: local
    hooks:
      - id: make-test
        name: Run make test
        entry: make test
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: make-test-merge-signed
        name: Run make test-merge-signed (merge gate)
        entry: make test-merge-signed
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - prepare-commit-msg
      - id: make-lint
        name: Run make lint (pre-push gate)
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: make-test-main-merged
        name: Run make test-main-merged (pre-push gate)
        entry: make test-main-merged
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: make-test-signed
        name: Run make test-signed (pre-push gate)
        entry: make test-signed
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: clean-pycache-dirs
        name: Prune orphan __pycache__-only dirs (post-checkout)
        entry: make clean-pycache-dirs
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - post-checkout
