---
default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push
  - post-checkout

repos:
  - repo: local
    hooks:
      - id: make-test
        name: Run make test
        entry: make test
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: make-test-merge-signed
        name: Run make test-merge-signed (merge gate)
        entry: make test-merge-signed
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - commit-msg
      - id: make-lint
        name: Run make lint (pre-push gate)
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: make-test-main-merged
        name: Run make test-main-merged (pre-push gate)
        entry: make test-main-merged
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: make-test-signed
        name: Run make test-signed (pre-push gate)
        entry: make test-signed
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - pre-push
      - id: clean-pycache-dirs
        name: Prune orphan __pycache__-only dirs (post-checkout)
        entry: make clean-pycache-dirs
        language: system
        pass_filenames: false
        always_run: true
        stages:
          - post-checkout
  - repo: https://github.com/digitalpulp/pre-commit-php
    rev: 1.4.0
    hooks:
      - id: php-lint-all
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: RuboCop
      - id: shellcheck
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.8.0
    hooks:
      - id: eslint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
