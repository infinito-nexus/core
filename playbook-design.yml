---
- name: "Sync the corporate design of one deployed application"
  hosts: all
  any_errors_fatal: true
  become: true
  vars:
    design_application_id: "{{ APPLICATIONS_WHITELIST | first }}"
  tasks:
    - name: ✅ Assert exactly one application is targeted
      ansible.builtin.assert:
        that:
          - APPLICATIONS_WHITELIST | length == 1
        fail_msg: "Pass exactly one application id in APPLICATIONS_WHITELIST, got {{ APPLICATIONS_WHITELIST }}"
        quiet: true

    - name: 🔀 Merge variables
      ansible.builtin.include_tasks: tasks/utils/constructor/variables.yml

    - name: 🧊 Render the applications SPOT once and carry it into every task's worker
      applications_carrier: {}

    - name: "📦 Load the role variables of '{{ design_application_id }}'"
      ansible.builtin.include_vars:
        file: "{{ lookup('path_absolute', 'roles', design_application_id, 'vars', 'main.yml') }}"

    - name: "🎨 Re-render the design files of '{{ design_application_id }}'"
      ansible.builtin.include_role:
        name: sys-front-inj-design
      vars:
        application_id: "{{ design_application_id }}"
