wine-gecko:
  Archlinux:
    - wine-gecko
  Debian: [] # nocheck: empty - the Debian and Ubuntu wine packages pull their own gecko build, there is no separate name
  RedHat: [] # nocheck: empty - the Fedora wine packages pull their own gecko build, there is no separate name

wine-mono:
  Archlinux:
    - wine-mono
  Debian: [] # nocheck: empty - the Debian and Ubuntu wine packages pull their own mono build, there is no separate name
  centos: [] # nocheck: empty - the wine id resolves to the org.winehq.Wine flatpak here, which carries its own mono inside the sandbox
  fedora:
    - wine-mono

winetricks:
  Archlinux:
    - winetricks
  Debian:
    - winetricks
  centos: [] # nocheck: empty - winetricks drives a host wine, and the wine id resolves to a sandboxed flatpak here
  fedora:
    - winetricks

