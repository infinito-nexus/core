mangohud-lib32:
  Archlinux:
    names:
      - lib32-mangohud
    repo:
      pacman_section: multilib
  Debian: [] # nocheck: empty - Debian and Ubuntu ship the 32-bit overlay through multiarch on the mangohud package, not as a separate name; TODO: install the i386 multiarch variant once the plan can request an architecture
  RedHat: [] # nocheck: empty - Fedora ships the 32-bit overlay as mangohud.i686 of the same package, and CentOS Stream carries neither; TODO: install the i686 variant once the plan can request an architecture

mari0:
  Archlinux:
    - mari0
  Debian: [] # nocheck: empty - mari0 is carried by neither the Debian nor the Ubuntu archives; TODO: package the upstream LOVE bundle through a build source
  RedHat: [] # nocheck: empty - mari0 is carried by neither Fedora nor CentOS Stream 10 nor EPEL 10; TODO: package the upstream LOVE bundle through a build source

