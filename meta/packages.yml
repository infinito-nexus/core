mangohud:
  Archlinux:
    - mangohud
  Debian:
    - mangohud
  centos: [] # nocheck: empty - no source carries it: CentOS Stream 10 ships no Vulkan overlay, and RPM Fusion's el/updates/10 tree holds none either, in free or nonfree
  fedora:
    - mangohud

mangohud-lib32:
  Archlinux:
    names:
      - lib32-mangohud
    repo:
      pacman_section: multilib
  Debian: [] # nocheck: empty - nothing separate exists to install: Debian and Ubuntu carry the 32-bit overlay as the i386 multiarch build of the mangohud package above, under that same name
  RedHat: [] # nocheck: empty - nothing separate exists to install: Fedora carries the 32-bit overlay as the i686 build of the mangohud package above, under that same name, and CentOS Stream carries no mangohud at all

mari0:
  Archlinux:
    - mari0
  Debian: [] # nocheck: empty - nothing installable exists: neither Debian nor Ubuntu carries mari0, and upstream tags no release asset and declares no licence, so there is no artefact to pin and none this project may redistribute
  RedHat: [] # nocheck: empty - nothing installable exists: neither Fedora nor CentOS Stream 10 nor EPEL 10 carries mari0, and upstream tags no release asset and declares no licence, so there is no artefact to pin and none this project may redistribute

