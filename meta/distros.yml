---
# Distribution SPOT.
#
# Every distribution Infinito.Nexus builds, tests and deploys on is declared
# here exactly once. Consumers read it through utils/distros.py; nothing may
# re-spell a distro list or an image reference locally.
#
# images: reference templates rendered by utils/distros.py.
#   {slug}                     comes from this file
#   {owner} {repository} {tag} come from default.env, which stays the SPOT
#                              for registry owner and tags
#
# distros: the id used as INFINITO_DISTRO, carrying
#   slug               path segment inside the image reference
#   family             ansible_facts['os_family'] the distribution reports,
#                      consumed by the meta/packages.yml registry
#   dev_runtime_image  upstream base image the development-environment test
#                      matrix boots the distribution from. Not one of ours,
#                      so it carries its own registry and tag.
#   galaxy_platform    platform name Ansible Galaxy knows the distribution by,
#                      used to build the canonical galaxy_info.platforms list
#                      every role's meta/main.yml must carry. The versions
#                      qualifier attached to every such entry is
#                      galaxy_platform_versions below.

images:
  pkgmgr: "ghcr.io/{owner}/pkgmgr-{slug}:{tag}"
  pkgmgr_virgin: "ghcr.io/{owner}/pkgmgr-{slug}-virgin:{tag}"
  environment: "ghcr.io/{owner}/{repository}/{slug}:{tag}"

galaxy_platform_versions:
  - all

distros:
  arch:
    slug: arch
    family: Archlinux
    dev_runtime_image: manjarolinux/base
    galaxy_platform: ArchLinux
  debian:
    slug: debian
    family: Debian
    dev_runtime_image: debian:bookworm
    galaxy_platform: Debian
  ubuntu:
    slug: ubuntu
    family: Debian
    dev_runtime_image: ubuntu:latest
    galaxy_platform: Ubuntu
  fedora:
    slug: fedora
    family: RedHat
    dev_runtime_image: fedora:latest
    galaxy_platform: Fedora
  centos:
    slug: centos
    family: RedHat
    dev_runtime_image: quay.io/centos/centos:latest
    galaxy_platform: EL
