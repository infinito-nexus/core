---
- name: "🔧 Setup '{{ application_id }}' network"
  include_tasks: stack_host/01_network.yml
  when: lookup('database', application_id, 'shared')

- name: "🔑 Apply the credentials the bootstrap must not carry"
  include_tasks: stack_host/02_credentials.yml

- name: "🎨 Apply the corporate design inside Discourse"
  include_tasks: stack_host/03_design.yml

- name: "🛂 Reconcile the staff flags with the RBAC role groups"
  include_tasks: stack_host/04_rbac.yml

- name: "🤖 Bind the native AI surface to the platform gateway"
  include_tasks: addons/discourse-ai.yml
  when: DISCOURSE_LITELLM_ENABLED | bool

- name: "🌍 Bind the post translator to the translation gateway"
  include_tasks: addons/discourse-translator.yml
  when: DISCOURSE_TRANSLATE_ENABLED | bool

- name: "📈 Render Mermaid fences as diagrams"
  include_tasks: addons/discourse-mermaid.yml
  when: DISCOURSE_MERMAID_ENABLED | bool
