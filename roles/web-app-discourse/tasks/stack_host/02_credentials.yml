---
- name: "🛑 Refuse a 2fa login method Discourse cannot honour"
  ansible.builtin.assert:
    that:
      - "DISCOURSE_LOGIN_2FA | bool == DISCOURSE_LOCAL_LOGIN_ENABLED | bool"
    fail_msg: >-
      Discourse offers its own second factor exactly when enable_local_logins is on
      and has no switch of its own, so services.discourse.login.method.2fa.enabled
      must equal native or ldap (2fa={{ DISCOURSE_LOGIN_2FA }},
      local logins={{ DISCOURSE_LOCAL_LOGIN_ENABLED }}).

- name: "⚙️ Apply and read back the site settings and the administrator password"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  the launcher names the container itself, so the bare name resolves in both modes
      IFS= read -r DISCOURSE_OIDC_CLIENT_SECRET && IFS= read -r DISCOURSE_ADMIN_PASSWORD &&
      IFS= read -r DISCOURSE_SITE_SETTINGS{% if DISCOURSE_OIDC_ENABLED | bool %} && : "${DISCOURSE_OIDC_CLIENT_SECRET:?arrived empty on stdin}" {% endif %}&&
      : "${DISCOURSE_ADMIN_PASSWORD:?arrived empty on stdin}" && : "${DISCOURSE_SITE_SETTINGS:?arrived empty on stdin}" &&
      export DISCOURSE_OIDC_CLIENT_SECRET DISCOURSE_ADMIN_PASSWORD DISCOURSE_SITE_SETTINGS && container exec -i
      -e DISCOURSE_FORCE_HTTPS={{ DISCOURSE_TLS_ENABLED | bool | string | lower }}
      -e DISCOURSE_LOCAL_LOGINS={{ DISCOURSE_LOCAL_LOGIN_ENABLED | bool | string | lower }}
      -e DISCOURSE_LOGIN_SSO={{ DISCOURSE_LOGIN_SSO | bool | string | lower }}
      -e DISCOURSE_LOGIN_EMAIL={{ DISCOURSE_LOGIN_EMAIL | bool | string | lower }}
      -e DISCOURSE_LOGIN_PASSKEY
      -e DISCOURSE_ALLOW_NEW_REGISTRATIONS={{ (DISCOURSE_LOGIN_REGISTRATION | bool or DISCOURSE_LOGIN_SSO | bool) | string | lower }}
      -e DISCOURSE_ENFORCE_SECOND_FACTOR={{ 'all' if DISCOURSE_LOGIN_2FA_ENFORCED | bool else 'no' }}
      -e DISCOURSE_SITE_SETTINGS
      -e DISCOURSE_OIDC_ENABLED={{ DISCOURSE_OIDC_ENABLED | bool | string | lower }}
      -e DISCOURSE_OIDC_VERBOSE={{ lookup('debug') | bool | string | lower }}
      -e DISCOURSE_OIDC_DISCOVERY_DOCUMENT={{ (OIDC.CLIENT.DISCOVERY_DOCUMENT if DISCOURSE_OIDC_ENABLED | bool else '') | quote }}
      -e DISCOURSE_OIDC_CLIENT_ID={{ (OIDC.CLIENT.ID if DISCOURSE_OIDC_ENABLED | bool else '') | quote }}
      -e DISCOURSE_OIDC_GROUPS_CLAIM={{ (RBAC.GROUP.CLAIM if DISCOURSE_OIDC_ENABLED | bool else '') | quote }}
      -e DISCOURSE_OIDC_CLIENT_SECRET
      -e DISCOURSE_OIDC_LOGOUT_REDIRECT={{ (DISCOURSE_OIDC_LOGOUT_REDIRECT_URL if DISCOURSE_OIDC_ENABLED | bool else '') | quote }}
      -e DISCOURSE_ADMIN_EMAIL={{ lookup('users', 'platform_administrator').email | quote }}
      -e DISCOURSE_ADMIN_USERNAME={{ lookup('users', 'platform_administrator').username | quote }}
      -e DISCOURSE_ADMIN_PASSWORD
      {{ DISCOURSE_CONTAINER | quote }}
      rails r -
    stdin: |-
      {{ OIDC.CLIENT.SECRET if DISCOURSE_OIDC_ENABLED | bool else '' }}
      {{ lookup('users', 'platform_administrator').password }}
      {{ DISCOURSE_SITE_SETTINGS | to_json }}
      {{ lookup('file', 'ruby/apply_settings.rb') }}
      {{ lookup('file', 'ruby/ensure_admin_user.rb') }}
      {{ lookup('file', 'ruby/verify_settings.rb') }}
  environment:
    DISCOURSE_LOGIN_PASSKEY: "{{ DISCOURSE_LOGIN_PASSKEY | bool | string | lower }}"
  register: discourse_settings_readback
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🛑 Refuse an instance the rotated credentials did not reach"
  ansible.builtin.assert:
    that:
      - "'administrator_present=true' in discourse_settings_readback.stdout_lines"
      - "'administrator_admin=true' in discourse_settings_readback.stdout_lines"
      - "'administrator_active=true' in discourse_settings_readback.stdout_lines"
      - "'administrator_password_matches=true' in discourse_settings_readback.stdout_lines"
      - "'login_methods_applied=true' in discourse_settings_readback.stdout_lines"
      - "'second_factor_enforcement_applied=true' in discourse_settings_readback.stdout_lines"
      - "not DISCOURSE_OIDC_ENABLED | bool or 'oidc_secret_matches=true' in discourse_settings_readback.stdout_lines"
      - "not DISCOURSE_OIDC_ENABLED | bool or 'oidc_enabled=true' in discourse_settings_readback.stdout_lines"
      - "not DISCOURSE_OIDC_ENABLED | bool or 'oidc_host_allowed=true' in discourse_settings_readback.stdout_lines"
      - "not DISCOURSE_OIDC_ENABLED | bool or 'oidc_profile_overridden=true' in discourse_settings_readback.stdout_lines"
      - "not DISCOURSE_OIDC_ENABLED | bool or ('oidc_groups_claim=' ~ RBAC.GROUP.CLAIM) in discourse_settings_readback.stdout_lines"
    fail_msg: >-
      The administrator account, the login methods, the OIDC client secret, the internal-host allowlist,
      the IdP profile overrides or the groups claim of the running Discourse does not
      match the inventory, so a rotated credential or a site setting never reached it.
