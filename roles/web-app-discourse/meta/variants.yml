    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    css:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    tor:
      enabled: true
    bigbluebutton:
      enabled: false
      shared: false
    jitsi:
      enabled: false
      shared: false
    mastodon:
      enabled: true
      shared: true
    matrix:
