---
# Matrix-deploy variant overrides for web-app-discourse.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — variant 2 exists so bigbluebutton and jitsi, both
# clearnet-only, have a round of their own. It carries nothing else; the mastodon,
# matrix and mattermost couplings moved to variant 1, which keeps the onion, and
# variant 0 pairs the onion with SSO.

- services:
    container_backup:
      enabled: true
    asset:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    litellm:
      enabled: true
    sso:
      enabled: true
      shared: true
    postgres:
      shared: true
    redis:
      shared: true
    prometheus:
      enabled: true
      shared: true
    css:
      enabled: true
      shared: true
    tor:
      enabled: true
    bigbluebutton:
      enabled: false
      shared: false
    jitsi:
      enabled: false
      shared: false
    mastodon:
      enabled: false
      shared: false
    matrix:
      enabled: false
      shared: false
    mattermost:
      enabled: false
      shared: false
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    asset:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
