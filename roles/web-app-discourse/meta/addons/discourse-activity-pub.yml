---
# nocheck: addons-variant-pinning: compiled into the image from the addon's ref, so an addon-level disable saves no deploy time and only silences the spec
# nocheck: addon-partner-gate  ActivityPub federates with every fediverse server, Mastodon is one partner of many; gating on it would also drop the spec, which runs in the SSO variant that carries no Mastodon
enabled: true
required: false
mechanism: plugin
source: upstream
bridges:
  - mastodon
update:
  monitored: true
  catalog: discourse-meta
  upstream_id: discourse-activity-pub
config:
  repository: https://github.com/discourse/discourse-activity-pub.git
  ref: bc08202aa94cdb74159c0aec1e3d2c47b88a8f66
