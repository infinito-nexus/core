---
# nocheck: playwright-service-flag - internal extraction engine without a browser surface
tika:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  image: apache/tika
  version: 4.0.0-full
  name: tika
  healthcheck:
    flavor: http_status
    path: tika
  min_storage: 1GB
  cpus: "1.0"
  mem_reservation: 512m
  mem_limit: 2g
  pids_limit: 512
  ports:
    internal:
      http: 9998
  lifecycle: alpha

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
