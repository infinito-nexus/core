---
# Remove/stop/disable systemd units that belong to this SOFTWARE_NAME,
# but are not for the current version.

- name: "📊 sys-service | Collect {{ SOFTWARE_NAME }} timers (all versions)"
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - "*.{{ SOFTWARE_DOMAIN }}*.timer"
      - --no-legend
      - --no-pager
  register: sys_service_all_timers
  changed_when: false
  failed_when: false

- name: "📊 sys-service | Collect {{ SOFTWARE_NAME }} services (all versions)"
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - "*.{{ SOFTWARE_DOMAIN }}*.service"
      - --no-legend
      - --no-pager
  register: sys_service_all_services
  changed_when: false
  failed_when: false

- name: "🔨 sys-service | Build old-version unit lists (exclude current version)"
  ansible.builtin.set_fact:
    sys_service_old_units_timers: >-
      {{
        (sys_service_all_timers.stdout_lines | default([]))
        | map('split', ' ')
        | map('first')
        | select('search', ('.' ~ SOFTWARE_DOMAIN) | regex_escape ~ '@?[.]timer$')
        | reject('search', SYS_SERVICE_VERSION_SUFFIX | regex_escape)
        | list
      }}
    sys_service_old_units_services: >-
      {{
        (sys_service_all_services.stdout_lines | default([]))
        | map('split', ' ')
        | map('first')
        | select('search', ('.' ~ SOFTWARE_DOMAIN) | regex_escape ~ '@?[.]service$')
        | reject('search', SYS_SERVICE_VERSION_SUFFIX | regex_escape)
        | list
      }}

- name: "🗑️ sys-service | Remove the old-version units"
  when: (sys_service_old_units_services | length > 0) or (sys_service_old_units_timers | length > 0)
  block:
    - name: "⏹️ sys-service | Stop and disable the old-version units (best-effort)"
      become: true
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'disable', '--now'] + sys_service_old_units_timers + sys_service_old_units_services }}"
      changed_when: true
      failed_when: false

    - name: "🗑️ sys-service | Delete old-version unit files"
      become: true
      ansible.builtin.command:
        argv: "{{ ['rm', '-f', '--'] + ((sys_service_old_units_services + sys_service_old_units_timers) | unique | map('regex_replace', '^', DIR_SYSTEM_SERVICE ~
          '/') | list) }}"
      changed_when: true

    - name: "🔄 sys-service | systemd daemon-reload after pruning"
      become: true
      ansible.builtin.systemd:
        daemon_reload: true
