---
- name: "🚀 DEPLOY | Collect {{ SOFTWARE_DOMAIN }} timers"
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - "*.{{ SOFTWARE_DOMAIN }}.timer"
      - --no-legend
      - --no-pager
  register: deploy_timer_units
  changed_when: false
  failed_when: false

- name: "🚀 DEPLOY | Collect {{ SOFTWARE_DOMAIN }} services"
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - "*.{{ SOFTWARE_DOMAIN }}.service"
      - --no-legend
      - --no-pager
  register: deploy_service_units
  changed_when: false
  failed_when: false

- name: "🚀 DEPLOY | Build unit lists"
  ansible.builtin.set_fact:
    deploy_timers: >-
      {{
        deploy_timer_units.stdout_lines | default([])
        | reject('search', ' masked')
        | map('split', ' ')
        | map('first')
        | list
      }}
    deploy_services: >-
      {{
        deploy_service_units.stdout_lines | default([])
        | map('split', ' ')
        | map('first')
        | list
      }}

- name: "🚀 DEPLOY | Stop all {{ SOFTWARE_DOMAIN }} services"
  become: true
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'stop'] + deploy_services }}"
  register: deploy_stop_service
  retries: 5
  delay: 3
  until: deploy_stop_service is success
  changed_when: true
  when: deploy_services | length > 0

- name: "🚀 DEPLOY | Stop and disable all {{ SOFTWARE_DOMAIN }} timers (keep unit files)"
  become: true
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'disable', '--now'] + deploy_timers }}"
  changed_when: true
  when: deploy_timers | length > 0
