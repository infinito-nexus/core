---
- name: 🛑 Fail if the timer of '{{ system_service_id }}' cannot drive its service
  assert:
    that:
      - system_service_scope == 'system'
      - not (MODE_ASSERT | bool) or '@' not in system_service_id
    fail_msg: "{{ system_service_timer_scope_msg if system_service_scope != 'system' else system_service_timer_id_msg }}"
  vars:
    system_service_timer_scope_msg: >-
      '{{ system_service_id }}' asks for a timer in the '{{ system_service_scope }}'
      scope, but sys-timer writes into {{ DIR_SYSTEM_SERVICE }} and drives the unit
      in the system scope, so the timer would look for a service that only exists
      for the user.
    system_service_timer_id_msg: "Invalid system_service_id '{{ system_service_id }}' → must not contain '@'."

- name: "📂 include role for sys-timer for {{ system_service_id }}"
  include_role:
    name: sys-timer
  vars:
    system_service_timer_service: "{{ system_service_id }}"
