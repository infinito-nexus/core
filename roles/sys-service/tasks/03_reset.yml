---
- name: 📦 Install unit-suffix-remover system-wide via pip
  include_role:
    name: sys-pip-install
  vars:
    package_name: unit-suffix-remover
    global_install: true

- name: "🧹 Remove '{{ SYS_SERVICE_SUFFIX }}' files"
  command: "{{ UNIT_SUFFIX_REMOVER_PACKAGE }} -s '{{ SOFTWARE_NAME }}'"
  notify: "reload-system-daemon"
