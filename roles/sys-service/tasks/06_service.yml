---
- name: "🔧 setup systemctl '{{ system_service_id }}'"
  template: # nocheck: stack-host-template (per-host systemd service unit)
    src: "{{ system_service_template_src }}"
    dest: "{{ [ system_service_unit_dir, system_service_name ] | path_join }}"
    owner: "{{ system_service_unit_owner }}"
    group: "{{ system_service_unit_owner }}"
    mode: "0644"
  become: "{{ system_service_unit_become }}"
  notify: "{{ 'reload-system-daemon' if system_service_is_template | bool else 'refresh-systemctl-service' }}"

- name: "🔄 Force the handlers of '{{ system_service_id }}' to run"
  ansible.builtin.debug:
    msg: "system_service_force_flush_instant runs the handlers of {{ system_service_name }}."
  changed_when: true
  notify: "{{ ['reload-system-daemon'] + ([] if system_service_is_template | bool else ['refresh-systemctl-service']) }}"
  when: system_service_force_flush_instant | bool
