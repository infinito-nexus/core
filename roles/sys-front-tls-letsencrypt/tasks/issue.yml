---
- name: "📌 TLS | (letsencrypt) resolve the certificate domain before the include"
  ansible.builtin.set_fact:
    _le_cert_domain: "{{ _tls_domain }}"

- name: "📜 TLS | (letsencrypt) issue the certificate"
  ansible.builtin.include_role:
    name: sys-svc-certs
  vars:
    domain: "{{ _le_cert_domain }}"

- name: "🔎 TLS | (letsencrypt) re-check cert files exist"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _le_stat2
  loop:
    - "{{ _cert_file }}"
    - "{{ _cert_key }}"
  changed_when: false

- name: "🛑 TLS | (letsencrypt) fail if still missing"
  ansible.builtin.fail:
    msg: >-
      Let's Encrypt certificate files not found after issuance:
      cert={{ _cert_file }} key={{ _cert_key }}
  when: >
    (not _le_stat2.results[0].stat.exists | default(false)) or
    (not _le_stat2.results[1].stat.exists | default(false))
