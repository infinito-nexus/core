---
# nocheck: run-once
- name: "🔴 Disable the self-signed environment once per host"
  when: tls_selfsigned_env_disabled is not defined or not tls_selfsigned_env_disabled
  block:
    - name: "🔴 Disable self-signed environment"
      include_tasks: "{{ lookup('path_absolute', 'roles/sys-ca-selfsigned/tasks/disable_env.yml') }}"

    - name: "📌 Remember that the self-signed environment is disabled"
      ansible.builtin.set_fact:
        tls_selfsigned_env_disabled: true

- name: "✅ TLS | (letsencrypt) assert mode is letsencrypt"
  ansible.builtin.assert:
    that:
      - _tls_enabled | bool
      - _tls_mode == 'letsencrypt'
    fail_msg: >-
      sys-front-tls-letsencrypt called for '{{ application_id }}'
      but resolver returned enabled={{ _tls_enabled }}, mode={{ _tls_mode }}.
  changed_when: false

- name: "🔎 TLS | (letsencrypt) check cert files exist"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _le_stat
  loop:
    - "{{ _cert_file }}"
    - "{{ _cert_key }}"
  changed_when: false

- name: "📜 TLS | (letsencrypt) issue cert if missing"
  include_tasks: issue.yml
  when: >
    (not _le_stat.results[0].stat.exists | default(false)) or
    (not _le_stat.results[1].stat.exists | default(false))
