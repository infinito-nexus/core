---
# Matrix-deploy variant overrides for web-svc-assistant.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# Variant 1 drops the model service, so the role's skip without svc-ai-ollama
# has a round of its own.

- services:
    docs:
      enabled: false
      shared: false
    ollama:
      enabled: true
      shared: true
    litellm:
      enabled: true
      shared: true
    postgres:
      shared: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    docs:
      enabled: true
      shared: true
    ollama:
      enabled: false
      shared: false
    litellm:
      enabled: false
      shared: false
    postgres:
      shared: false
    prometheus:
      enabled: false
      shared: false
    tor:
      enabled: true
