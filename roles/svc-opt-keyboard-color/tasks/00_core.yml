---
- include_role:
    name: sys-ctl-alm-compose

- name: 📦 Install MSI packages
  package_install:
    id: msi-perkeyrgb
  register: msi_perkeyrgb_package

- name: 📦 Install msi-perkeyrgb via pip (system-wide)
  include_role:
    name: sys-pip-install
  vars:
    package_name: msi-perkeyrgb
    global_install: true
  when: msi_perkeyrgb_package is skipped

- include_role:
    name: sys-service
  vars:
    system_service_on_calendar: "{{ SYS_SCHEDULE_ANIMATION_KEYBOARD_COLOR }}"
    system_service_timer_enabled: true
    system_service_timer_persistent: true

- include_tasks: utils/once/flag.yml
