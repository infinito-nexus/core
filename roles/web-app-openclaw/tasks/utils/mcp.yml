---
- name: "🔎 Read the managed gateway settings the render overwrites"
  ansible.builtin.command:
    argv:
      - python3
      - -I
      - -c
      - "{{ lookup('file', 'python/config_fields.py') }}"
      - "{{ OPENCLAW_CONFIG_PATH_HOST }}"
    stdin: "{{ OPENCLAW_CONFIG_FORM_PATHS | dict2items | selectattr('key', 'in', OPENCLAW_CONFIG) | items2dict | to_json }}"
  register: openclaw_config_held
  changed_when: false

- name: "📣 Report the managed gateway settings the render reverts"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    openclaw_config_current: "{{ openclaw_config_held.stdout | from_json }}"
    forms_drift_current: "{{ {'config': openclaw_config_current | combine({'servers': OPENCLAW_CONFIG.servers | mcp_held(openclaw_config_current.servers, '-')} if
      'servers' in openclaw_config_current else {})} }}"

- name: "📄 Render the OpenClaw gateway config from the current discovery"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "openclaw.json.j2"
        dest: "{{ OPENCLAW_CONFIG_PATH_HOST }}"

- name: "🔄 Start the stack so the gateway reads the config"
  ansible.builtin.meta: flush_handlers
