---
# nocheck: playwright-service-flag
openclaw:
  mcp_consumer: true
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  replicas: 1 # nocheck: single-replica  single-writer SQLite state on swarm-shared NFS; concurrent multi-node writers corrupt the agent's state directory
  bond: 1
  enabled: true
  shared: true
  backup:
    no_stop_required: true
  image: ghcr.io/openclaw/openclaw
  version: "2026.7.1"
  name: openclaw
  min_storage: 562MB
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 2048
  ports:
    local:
      http: 8090
      sso: 16511
    internal:
      http: 18789
  lifecycle: beta
  proxy:
    service_key: openclaw

# nocheck: playwright-service-flag, dynamic-flag
kata:
  bond: 1
  enabled: true
  shared: true

sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oauth2:
    origin:
      host: openclaw
      port: 18789
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-openclaw', role='administrator') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-openclaw', role='mcp') }}"

# nocheck: playwright-service-flag
litellm:
  bond: 1
  enabled: "{{ ('svc-ai-litellm' in group_names) and (LITELLM_CHAT_MODEL_SERVED | bool) }}"
  shared: "{{ 'svc-ai-litellm' in group_names }}"

logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
css:
  bond: 1
  enabled: "{{ 'web-svc-css' in group_names }}"
  shared: "{{ 'web-svc-css' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

# nocheck: playwright-service-flag, dynamic-flag
container_backup: # nocheck: bond-baseline
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
