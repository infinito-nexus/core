---
# nocheck: run-once
- name: "🔍 Discover ordered shared services"
  ansible.builtin.set_fact:
    _ordered_services: >-
      {{
        query(
          'service_registry',
          'ordered',
          roles_dir=(lookup('path_absolute', 'roles'))
        ) | first
      }}

- name: "🔍 Precompute required shared services (single applications load)"
  ansible.builtin.set_fact:
    _required_service_ids: >-
      {{
        query(
          'service',
          (_ordered_services | map(attribute='id') | list),
          roles_dir=(lookup('path_absolute', 'roles'))
        )
        | selectattr('required')
        | map(attribute='id')
        | list
      }}

- name: "🔍 Scope the preload to the whitelist's dependency closure"
  ansible.builtin.set_fact:
    _preload_closure: "{{ lookup('application_closure', lookup('deployment').whitelist) }}"

- name: "🔌 Load shared service"
  include_tasks: load_service.yml
  vars:
    service_key: "{{ service_item.id }}"
    service_role: "{{ service_item.role }}"
    service_run_once_var: "{{ 'run_once_' ~ (service_item.role | replace('-', '_')) }}"
  loop: "{{ _ordered_services }}"
  loop_control:
    loop_var: service_item
    label: "{{ service_item.id }}"

- name: "▶️ Drain the post-load roles the preload queued"
  ansible.builtin.include_tasks: drain.yml
