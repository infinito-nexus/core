---
# nocheck: run-once
- name: "🔍 Discover ordered shared services"
  ansible.builtin.set_fact:
    _ordered_services: >-
      {{
        query(
          'service_registry',
          'ordered',
          roles_dir=(lookup('path_absolute', 'roles'))
        ) | first
      }}

- name: "🔍 Precompute required shared services (single applications load)"
  ansible.builtin.set_fact:
    _required_service_ids: >-
      {{
        query(
          'service',
          (_ordered_services | map(attribute='id') | list),
          roles_dir=(lookup('path_absolute', 'roles'))
        )
        | selectattr('required')
        | map(attribute='id')
        | list
      }}

- name: "🔍 Scope the preload to the whitelist's dependency closure"
  ansible.builtin.set_fact:
    _preload_closure: "{{ lookup('application_closure', lookup('deployment').whitelist) }}"

- name: "🔌 Load shared service"
  include_tasks: load_service.yml
  vars:
    service_key: "{{ service_item.id }}"
    service_role: "{{ service_item.role }}"
    service_run_once_var: "{{ 'run_once_' ~ (service_item.role | replace('-', '_')) }}"
  loop: "{{ _ordered_services }}"
  loop_control:
    loop_var: service_item
    label: "{{ service_item.id }}"

- name: "📂 Close the preload context before the post-load flush"
  ansible.builtin.set_fact:
    service_loader_preloading: false
  changed_when: false

- name: "🛑 Refuse a post-load role whose stack backend never ran"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/load/entry.yml') }}"
  loop: "{{ service_loader_post_run | unique }}"
  loop_control:
    loop_var: post_run_role
  vars:
    entry_role: "{{ post_run_role }}"
    entry_application_id: "{{ post_run_role }}"
    entry_domain: false
    entry_post_run: true
  when: STACK_ENTRY_PENDING | bool

- name: "▶️ Run service-loader post-load roles"
  ansible.builtin.include_role:
    name: "{{ post_run_role }}"
  loop: "{{ service_loader_post_run | unique }}"
  loop_control:
    loop_var: post_run_role
