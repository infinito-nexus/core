---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-required - object storage not implemented for this role
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 280
      height: 80
# nocheck: dynamic-flag
# nocheck: playwright-service-flag
javascript:
  bond: 1
  enabled: true
  shared: true
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
mariadb:
  bond: 1
  enabled: true
  shared: "{{ 'svc-db-mariadb' in group_names }}"
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - cache/queue/socketio buses, covered by role-local integration tests
redis:
  bond: 1
  enabled: true
  shared: "{{ 'svc-db-redis' in group_names }}"
# nocheck: playwright-service-flag - self-provider
erpnext:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  image: frappe/erpnext
  custom: true
  version: "v16.61.0"
  name: erpnext
  min_storage: 1017MB
  ports:
    local:
      http: 8079
      websocket: 4004
    internal:
      http: 8080
      websocket: 9000
  proxy:
    service_key: frontend
  company:
    abbr: "{{ service_provider.company.titel.split() | map('first') | join | upper }}"
  title: "{{ lookup('design', 'web-app-erpnext').title }}"
  server_scripts: false
  rounding:
    method: "Banker's Rounding"
    row_wise_tax: false
  api_bot:
    enabled: true
    extra_roles: []
  group_roles: []
  run_after:
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-erpnext', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-erpnext', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-erpnext', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-erpnext', '2fa') }}"
        enforced: true
      email:
        enabled: "{{ lookup('login_method', 'web-app-erpnext', 'email') }}"
      registration:
        enabled: "{{ lookup('login_method', 'web-app-erpnext', 'registration') }}"
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 2048
backend:
  name: erpnext-backend
  healthcheck:
    flavor: tcp
  ports:
    internal:
      http: 8000
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 2048
frontend:
  name: erpnext-frontend
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 512m
  pids_limit: 512
websocket:
  # nocheck: single-replica
  replicas: 1
  name: erpnext-websocket
  ports:
    internal:
      socketio: 9000
  cpus: "0.5"
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512
scheduler:
  # nocheck: single-replica
  replicas: 1
  name: erpnext-scheduler
  cpus: "0.5"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 512
queue-short:
  name: erpnext-queue-short
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 512
queue-long:
  name: erpnext-queue-long
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 2g
  pids_limit: 512
configurator:
  # nocheck: single-replica
  replicas: 1
  name: erpnext-configurator
  cpus: "0.5"
  mem_reservation: 128m
  mem_limit: 1g
  pids_limit: 512
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
