---
# Param erpnext_design_mode: read prints the branding fields ERPNext holds as one JSON line; converge writes the branding sink, the logo and the theme file.
# Output erpnext_design_result: the registered run of design_settings.py.

- name: "🎨 {{ erpnext_design_mode | capitalize }} corporate branding and theme file"
  ansible.builtin.shell:
    cmd: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      container exec -i
      -e SITE_NAME -e DESIGN_MODE -e BRANDING -e DESIGN_LOGO_URL -e DESIGN_FAVICON_URL -e DESIGN_THEME_CSS
      {{ ERPNEXT_BACKEND_LOCAL_CID | quote }}
      {{ ERPNEXT_BENCH_PYTHON }}
    stdin: "{{ lookup('ansible.builtin.file', role_path ~ '/files/python/apply/design_settings.py') }}"
  delegate_to: "{{ ERPNEXT_BACKEND_HOST_NODE }}"
  environment:
    SITE_NAME: "{{ ERPNEXT_SITE_NAME }}"
    DESIGN_MODE: "{{ erpnext_design_mode }}"
    BRANDING: "{{ ERPNEXT_BRANDING | to_json }}"
    DESIGN_LOGO_URL: "{{ ERPNEXT_DESIGN_LOGO_URL }}"
    DESIGN_FAVICON_URL: "{{ ERPNEXT_DESIGN_FAVICON_URL }}"
    DESIGN_THEME_CSS: "{{ lookup('ansible.builtin.file', 'theme.css', rstrip=False) if ERPNEXT_DESIGN_ENABLED | bool else '' }}"
  register: erpnext_design_result
  changed_when: "'DESIGN_CHANGED' in erpnext_design_result.stdout_lines"
  timeout: "{{ lookup('timeout', 60) | int }}"
