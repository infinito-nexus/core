---
- name: "📌 apply outbound Email Account (Mailu SMTP; inbound IMAP deferred)"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  ansible.builtin.shell:
    cmd: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      IFS= read -r SMTP_PASS && export SMTP_PASS && container exec -i
      -e SITE_NAME -e MAIL_FROM_NAME -e MAIL_FROM_ADDRESS
      -e SMTP_HOST -e SMTP_PORT -e SMTP_TLS -e SMTP_START_TLS -e SMTP_AUTH -e SMTP_USER -e SMTP_PASS
      {{ ERPNEXT_BACKEND_LOCAL_CID | quote }}
      {{ ERPNEXT_BENCH_PYTHON }}
    stdin: |-
      {{ ERPNEXT_MAIL.password | default('') }}
      {{ lookup('ansible.builtin.file', role_path ~ '/files/python/apply/email_account.py') }}
  delegate_to: "{{ ERPNEXT_BACKEND_HOST_NODE }}"
  environment:
    SITE_NAME: "{{ ERPNEXT_SITE_NAME }}"
    MAIL_FROM_NAME: "{{ ORGANIZATION }} ERPNext"
    MAIL_FROM_ADDRESS: "{{ ERPNEXT_MAIL.username | default('') }}"
    SMTP_HOST: "{{ ERPNEXT_MAIL.host | default('') }}"
    SMTP_PORT: "{{ ERPNEXT_MAIL.port | default(587) }}"
    SMTP_TLS: "{{ ERPNEXT_MAIL.tls | bool | string | lower }}"
    SMTP_START_TLS: "{{ ERPNEXT_MAIL.start_tls | bool | string | lower }}"
    SMTP_AUTH: "{{ ERPNEXT_MAIL.auth | bool | string | lower }}"
    SMTP_USER: "{{ ERPNEXT_MAIL.username | default('') }}"
  when: ERPNEXT_MAIL.host is defined and (ERPNEXT_MAIL.host | length > 0)
  register: erpnext_email_apply
  changed_when: false
  timeout: "{{ lookup('timeout', 60) | int }}"
