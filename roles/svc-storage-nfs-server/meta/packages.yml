---
e2fsprogs:
  Archlinux:
    - e2fsprogs
  Debian:
    - e2fsprogs
  RedHat:
    - e2fsprogs

libntirpc:
  Archlinux: [] # nocheck: empty - the AUR build compiles its own ntirpc submodule
  Debian: [] # nocheck: empty - the packaged nfs-ganesha links against a matching libntirpc, only Fedora ships a broken pair
  RedHat: [] # nocheck: empty - only the Fedora override needs the upgrade, the CentOS SIG build is self-consistent
  fedora:
    names:
      - libntirpc
    repo:
      enable_existing: updates-testing
      state: latest

nfs-ganesha:
  Archlinux:
    source: aur
    names:
      - nfs-ganesha
  Debian:
    - nfs-ganesha
    - nfs-ganesha-vfs
  RedHat:
    - nfs-ganesha
    - nfs-ganesha-vfs
  centos:
    names:
      - nfs-ganesha
      - nfs-ganesha-vfs
    repo:
      bootstrap_package: centos-release-nfs-ganesha11

nfs-kernel-server:
  Archlinux: [] # nocheck: empty - the kernel server ships inside nfs-utils, installed through the nfs-client id
  Debian:
    - nfs-kernel-server
  RedHat: [] # nocheck: empty - the kernel server ships inside nfs-utils, installed through the nfs-client id

selinux-python-binding:
  Archlinux: [] # nocheck: empty - SELinux is not the mandatory access control on this family
  Debian: [] # nocheck: empty - SELinux is not the mandatory access control on this family
  RedHat:
    - python3-libselinux
