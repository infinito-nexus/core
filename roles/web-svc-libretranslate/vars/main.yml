---
application_id: web-svc-libretranslate # ID of the application

entity_name: "{{ application_id | get_entity_name }}"

LIBRETRANSLATE_SERVICE: "{{ entity_name }}"
LIBRETRANSLATE_IMAGE: "{{ lookup('config', application_id, 'services.libretranslate.image') }}"
LIBRETRANSLATE_VERSION: "{{ lookup('config', application_id, 'services.libretranslate.version') }}"
LIBRETRANSLATE_LOAD_ONLY: "{{ lookup('config', application_id, 'services.libretranslate.load_only') | join(',') }}"
LIBRETRANSLATE_MCP_ENABLED: "{{ lookup('config', application_id, 'services.libretranslatemcp.enabled') | bool }}"
LIBRETRANSLATE_MCP_SERVICE_KEY: "libretranslatemcp"
LIBRETRANSLATE_MCP_CONTAINER: "{{ lookup('config', application_id, 'services.libretranslatemcp.name') }}"
LIBRETRANSLATE_MCP_PORT: "{{ lookup('config', application_id, 'services.libretranslatemcp.ports.internal.http') }}"
LIBRETRANSLATE_MCP_BEARER: "{{ lookup('config', application_id, 'secrets.credentials.mcp_bearer') }}"
LIBRETRANSLATE_MCP_INSTANCE_DIR: "{{ [lookup('container', application_id, 'directories.instance'), 'mcp'] | path_join }}"
LIBRETRANSLATE_MCP_UPSTREAM_HOST: "{{ entity_name }}"
LIBRETRANSLATE_MCP_UPSTREAM_PORT: "{{ lookup('config', application_id, 'services.libretranslate.ports.internal.http') }}"
LIBRETRANSLATE_MCP_UPSTREAM_URL: "http://{{ LIBRETRANSLATE_MCP_UPSTREAM_HOST }}:{{ LIBRETRANSLATE_MCP_UPSTREAM_PORT }}"
LIBRETRANSLATE_MCP_CONTRACT:
  provider: "{{ application_id }}"
  upstream_url: "{{ LIBRETRANSLATE_MCP_UPSTREAM_URL }}"
  auth_subject: "{{ lookup('config', application_id, 'mcp.auth_subject') }}"
  mutating_tools_enabled: "{{ lookup('config', application_id, 'mcp.tools.mutating_tools_enabled') | bool }}"
  tools: "{{ lookup('file', 'mcp/tools.json') | from_json }}"
  limits: "{{ lookup('config', application_id, 'mcp.limits') }}"
  schema_sha256: "{{ lookup('config', application_id, 'mcp.tools.schema_sha256') }}"
LIBRETRANSLATE_MCP_UPSTREAM_KEY: ""
