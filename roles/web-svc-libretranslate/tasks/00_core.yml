---
- include_tasks: utils/once/flag.yml

- name: "📁 Create the volumes directory of {{ application_id }}"
  ansible.builtin.file:
    path: "{{ lookup('container', application_id, 'directories.volumes') }}"
    state: directory
    mode: "0755"

- name: "📄 Render the engine forwarder of {{ application_id }}"
  stack_host_template:
    src: nginx.conf.j2
    dest: "{{ LIBRETRANSLATE_NGINX_CONF_PATH }}"
  notify: compose-up

- name: "🧱 Rebuild the MCP adapter of {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-mcp-adapter/tasks/rebuild.yml') }}"
  when: LIBRETRANSLATE_MCP_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers
