limits:
  request_bytes: 65536
  response_bytes: 1048576
  timeout_seconds: 15
  concurrent_requests: 4
  page_size: 100
  result_items: 100
  stream_seconds: 300
tools:
  read_probe:
    tool: libretranslate_list_languages
    arguments: {}
  allowlist:
    - libretranslate_get_frontend_settings
