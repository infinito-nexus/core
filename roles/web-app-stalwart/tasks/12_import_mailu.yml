---
# include-gated: when: STALWART_IMPORT_MAILU and 'web-app-mailu' in group_names
#                and STALWART_ACTIVE_PROVIDER and DEPLOYMENT_MODE == 'compose'
- name: "🔍 List the container volumes on the stack host"
  ansible.builtin.command: >-
    container volume ls --format "{{ '{{' }} .Name {{ '}}' }}"
  register: stalwart_volume_names
  changed_when: false

- name: "ℹ️ Report that Mailu has no maildir volume to import yet"
  ansible.builtin.debug:
    msg: "Mailu's maildir volume {{ STALWART_MAILU_MAILDIR_VOLUME }} does not exist on this host yet; there is nothing to import."
  when: STALWART_MAILU_MAILDIR_VOLUME not in stalwart_volume_names.stdout_lines

- name: "📥 Import every Mailu mailbox into Stalwart"
  when: STALWART_MAILU_MAILDIR_VOLUME in stalwart_volume_names.stdout_lines
  block:
    - name: "🔍 Resolve the legacy Mailu maildir volume mountpoint"
      ansible.builtin.command: >-
        container volume inspect --format "{{ '{{' }} .Mountpoint {{ '}}' }}"
        {{ STALWART_MAILU_MAILDIR_VOLUME | quote }}
      register: stalwart_mailu_maildir
      changed_when: false

    - name: "📥 Stage and run the import"
      include_tasks: 12_import_mailu/run.yml
  always:
    - name: "🧹 Remove the import working directory and its credentials"
      ansible.builtin.file:
        path: "{{ STALWART_IMPORT_DIR }}"
        state: absent
