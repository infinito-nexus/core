---
- name: "🗑️ Destroy the retired app passwords per bot account"
  include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
  vars:
    stalwart_jmap_act_as: "{{ stalwart_app_password_owner.key }}"
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:AppPassword/set', {'destroy': stalwart_app_password_owner.value}, 'c0']]} | to_json }}
  loop: "{{ stalwart_app_password_stale | dict2items }}"
  loop_control:
    loop_var: stalwart_app_password_owner

- name: "🧹 Clear the dropped app passwords"
  ansible.builtin.set_fact:
    stalwart_app_password_stale: {}
