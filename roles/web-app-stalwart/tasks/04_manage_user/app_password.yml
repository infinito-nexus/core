---
# Param: stalwart_jmap_act_as - address of the bot account, every call below runs as that account.
- name: "📖 List the app passwords of '{{ stalwart_user_name }}'"
  include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
  vars:
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:AppPassword/get', {'ids': none}, 'c0']]} | to_json }}

- name: "🔍 Decide whether '{{ stalwart_user_name }}' needs a new app password"
  ansible.builtin.set_fact:
    stalwart_app_password_ids: "{{ stalwart_app_password_owned }}"
    stalwart_app_password_mint: "{{ stalwart_app_password_renew }}"
    stalwart_app_password_drop: "{{ stalwart_app_password_retired + (stalwart_app_password_owned if stalwart_app_password_renew | bool else []) }}"
  vars:
    stalwart_app_password_owned: >-
      {{ stalwart_jmap.methodResponses[0][1].list
         | selectattr('description', 'equalto', STALWART_BOT_APP_PASSWORD_DESCRIPTION)
         | map(attribute='id') | list }}
    stalwart_app_password_retired: >-
      {{ stalwart_jmap.methodResponses[0][1].list
         | selectattr('description', 'equalto', STALWART_BOT_APP_PASSWORD_RETIRED_DESCRIPTION)
         | map(attribute='id') | list }}
    stalwart_app_password_stored: "{{ lookup('users', stalwart_user_key, {}).get('tokens', {}).get(application_id, '') }}"
    stalwart_app_password_renew: >-
      {{ (stalwart_app_password_owned | length != 1)
         or (stalwart_app_password_stored | length == 0)
         or (stalwart_app_password_stored == stalwart_user_secret) }}

- name: "🔑 Replace the app password of '{{ stalwart_user_name }}'"
  when: stalwart_app_password_mint | bool
  block:
    - name: "🔑 Mint the app password of '{{ stalwart_user_name }}'"
      include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
      vars:
        stalwart_jmap_body: >-
          {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
              'methodCalls': [['x:AppPassword/set', {'create': {'p': {
                'description': STALWART_BOT_APP_PASSWORD_DESCRIPTION
              }}}, 'c0']]} | to_json }}

    - name: "💾 Persist the app password of '{{ stalwart_user_name }}'"
      ansible.builtin.include_role:
        name: sys-token-store
        tasks_from: write.yml
      vars:
        sys_token_store_user_key: "{{ stalwart_user_key }}"
        sys_token_store_app: "{{ application_id }}"
        sys_token_store_token: "{{ stalwart_jmap.methodResponses[0][1].created.p.secret }}"

    - name: "🏷️ Retire the replaced app passwords of '{{ stalwart_user_name }}'"
      include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
      vars:
        stalwart_jmap_body: >-
          {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
              'methodCalls': [['x:AppPassword/set', {'update': dict(stalwart_app_password_ids
                | zip([{'description': STALWART_BOT_APP_PASSWORD_RETIRED_DESCRIPTION}] * (stalwart_app_password_ids | length)))},
                'c0']]} | to_json }}
      when: stalwart_app_password_ids | length > 0

- name: "📥 Defer dropping the retired app passwords of '{{ stalwart_user_name }}'"
  when: stalwart_app_password_drop | length > 0
  block:
    - name: "📥 Record the retired app passwords of '{{ stalwart_user_name }}'"
      ansible.builtin.set_fact:
        stalwart_app_password_stale: "{{ stalwart_app_password_stale | combine({stalwart_jmap_act_as: stalwart_app_password_drop}) }}"

    - name: "📥 Queue the drop for the service-loader post-load flush"
      include_role:
        name: sys-service-loader
        tasks_from: list_or_shoot.yml
      vars:
        list_or_shoot_roles:
          - web-app-stalwart
