---
# Param: stalwart_jmap_act_as - address of the bot account, every call below runs as that account.
- name: "📖 List the app passwords of '{{ stalwart_user_name }}'"
  include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
  vars:
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:AppPassword/get', {'ids': none}, 'c0']]} | to_json }}

- name: "🔍 Decide whether '{{ stalwart_user_name }}' needs a new app password"
  ansible.builtin.set_fact:
    stalwart_app_password_ids: "{{ stalwart_app_password_owned }}"
    stalwart_app_password_mint: >-
      {{ (stalwart_app_password_owned | length != 1)
         or (stalwart_app_password_stored | length == 0)
         or (stalwart_app_password_stored == stalwart_user_secret) }}
  vars:
    stalwart_app_password_owned: >-
      {{ stalwart_jmap.methodResponses[0][1].list
         | selectattr('description', 'equalto', STALWART_BOT_APP_PASSWORD_DESCRIPTION)
         | map(attribute='id') | list }}
    stalwart_app_password_stored: "{{ lookup('users', stalwart_user_key, {}).get('tokens', {}).get(application_id, '') }}"

- name: "🗑️ Drop the stale app passwords of '{{ stalwart_user_name }}'"
  include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
  vars:
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:AppPassword/set', {'destroy': stalwart_app_password_ids}, 'c0']]} | to_json }}
  when:
    - stalwart_app_password_mint | bool
    - stalwart_app_password_ids | length > 0

- name: "🔑 Mint the app password of '{{ stalwart_user_name }}'"
  include_tasks: "{{ role_path }}/tasks/jmap_call.yml"
  vars:
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:AppPassword/set', {'create': {'p': {
            'description': STALWART_BOT_APP_PASSWORD_DESCRIPTION
          }}}, 'c0']]} | to_json }}
  when: stalwart_app_password_mint | bool

- name: "💾 Persist the app password of '{{ stalwart_user_name }}'"
  ansible.builtin.include_role:
    name: sys-token-store
    tasks_from: write.yml
  vars:
    sys_token_store_user_key: "{{ stalwart_user_key }}"
    sys_token_store_app: "{{ application_id }}"
    sys_token_store_token: "{{ stalwart_jmap.methodResponses[0][1].created.p.secret }}"
  when: stalwart_app_password_mint | bool
