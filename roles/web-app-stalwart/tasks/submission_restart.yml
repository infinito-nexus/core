---
- name: "🔄 Restart Stalwart so it binds the submission listener (compose)"
  ansible.builtin.command: "container restart {{ STALWART_CONTAINER }}"
  changed_when: true
  when: IS_COMPOSE_MODE

- name: "🔄 Restart Stalwart so it binds the submission listener (swarm)"
  ansible.builtin.command: "container service update --force {{ lookup('container_service', application_id, 'stalwart') }}"
  changed_when: true
  timeout: "{{ lookup('timeout', 600) | int }}"
  when: IS_SWARM_MODE

- name: "⏳ Wait for Stalwart API after the submission restart"
  include_tasks: 01_wait_for_api.yml
