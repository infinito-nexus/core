---
- name: "⏳ Wait for the stalwart task to converge (swarm; no-op in compose)"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/wait_converged.yml') }}"
  vars:
    wait_service_key: stalwart

- name: "⏳ Wait until Stalwart management API is ready"
  block:
    - name: "🔍 Probe Stalwart readiness endpoint"
      ansible.builtin.shell: >-
        container exec -i {{ STALWART_CONTAINER_ADDRESS }}
        {{ 30 | curl }} -fsS -o /dev/null {{ STALWART_LOCAL_BASE_URL }}/healthz/ready
      register: stalwart_api_check
      retries: 30
      delay: 5
      until: stalwart_api_check.rc == 0
      changed_when: false

  rescue:
    - name: "🧾 Collect Stalwart container logs (compose, last 300 lines)" # nocheck: rescue-diagnostics container logs vanish with the failed round's teardown; capture in-play, re-raise below
      ansible.builtin.command: "container logs --tail 300 {{ STALWART_CONTAINER }}"
      register: stalwart_api_logs_compose
      changed_when: false
      when: DEPLOYMENT_MODE == 'compose'

    - name: "🧾 Collect Stalwart service logs (swarm, last 300 lines)" # nocheck: rescue-diagnostics container logs vanish with the failed round's teardown; capture in-play, re-raise below
      ansible.builtin.command: "container service logs --tail 300 {{ lookup('container_service', application_id, 'stalwart') }}"
      register: stalwart_api_logs_swarm
      changed_when: false
      when: DEPLOYMENT_MODE == 'swarm'

    - name: "🛑 Fail: Stalwart management API not ready"
      ansible.builtin.fail:
        msg: |
          Stalwart management API was not ready in time.

          Last stderr:
          {{ stalwart_api_check.stderr | default('') }}

          --- Stalwart logs (last 300 lines) ---
          {{ stalwart_api_logs_compose.stdout
             | default(stalwart_api_logs_swarm.stdout | default('No logs available')) }}
