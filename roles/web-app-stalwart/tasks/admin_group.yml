---
- name: "📁 Create the group that carries System Administrator to its OIDC members"
  include_tasks: jmap_call.yml
  vars:
    stalwart_jmap_tolerate_rejected: true
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:Account/set', {'create': {'g': {
            '@type': 'Group',
            'name': STALWART_ADMIN_GROUP_PATH,
            'domainId': stalwart_domain_id,
            'description': 'Keycloak ' ~ STALWART_ADMIN_GROUP_PATH,
            'externalId': STALWART_ADMIN_GROUP_PATH,
            'roles': {'@type': 'Custom', 'roleIds': {stalwart_role_admin: true}}
          }}}, 'c0']]} | to_json }}

- name: "🔍 Resolve the group id, created now or on an earlier run"
  ansible.builtin.set_fact:
    stalwart_admin_group_id: >-
      {{ (stalwart_jmap.methodResponses[0][1].created | default({})).get('g', {}).get('id', '')
         or ((stalwart_jmap.methodResponses[0][1].notCreated | default({}))
             .get('g', {}).get('objectId', {}) or {}).get('id', '') }}

- name: "✅ Ensure Stalwart returned the admin group id"
  ansible.builtin.assert:
    that: stalwart_admin_group_id | length > 0
    fail_msg: "Stalwart neither created nor returned the id of {{ STALWART_ADMIN_GROUP_PATH }}; the System Administrator grant would be missing."

- name: "🔄 Keep the group's external id and role in step"
  include_tasks: jmap_call.yml
  vars:
    stalwart_jmap_body: >-
      {{ {'using': ['urn:ietf:params:jmap:core', 'urn:stalwart:jmap'],
          'methodCalls': [['x:Account/set', {'update': {stalwart_admin_group_id: {
            'externalId': STALWART_ADMIN_GROUP_PATH,
            'roles': {'@type': 'Custom', 'roleIds': {stalwart_role_admin: true}}
          }}}, 'c0']]} | to_json }}
