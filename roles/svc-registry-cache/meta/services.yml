---
# nocheck: garbage-collector-required  pull-through blobs are cache, but no registry garbage collection is configured yet
# nocheck: dynamic-flag
node:
  enabled: true
  shared: true
  bond: 1
cache:
  flavor: registry
  healthcheck: "{{ lookup('config', 'svc-registry-cache', 'services.cache.healthchecks')[lookup('config', 'svc-registry-cache', 'services.cache.flavor')] }}"
  healthchecks:
    registry:
      flavor: wget
      port_key: registry
      path: v2/
    multi-proxy:
      flavor: http
      port_key: proxy
      path: ca.crt
  modes:
    compose:
      enabled: true
    swarm:
      enabled: false
  # nocheck: default-placement-manager  pull-through cache backs docker stack deploy; chicken-and-egg if scheduled on a worker that still needs to pull custom images from it
  placement: manager
  enabled: true
  shared: true
  bond: 1
  image: registry
  version: "3"
  name: cache-registry
  min_storage: 221MB
  backup:
    disabled: true
  cpus: "0.5"
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 256
  ports:
    local:
      registry: 5001
      proxy: 3128
    internal:
      registry: 5000
      proxy: 3128
    onion:
      # nocheck: onion-flag  the pull-through mirror exists to serve this node's own image pulls; publishing it would relay Docker Hub for strangers
      registry: false
      # nocheck: onion-flag  the multi-registry proxy SSL-bumps this node's own pulls; publishing it would relay every registry for strangers
      proxy: false
  proxy:
    remote_url: "https://registry-1.docker.io" # nocheck: url
  max_idle_days: 30
  multi_proxy:
    image: rpardini/docker-registry-proxy
    version: 0.6.5
    registries: []
    max_size: 32g
    auth: ""
    mirror_path: "{{ [lookup('container', 'svc-registry-cache', 'directories.volumes'), 'mirror'] | path_join }}"
    ca_path: "{{ [lookup('container', 'svc-registry-cache', 'directories.volumes'), 'ca'] | path_join }}"
  lifecycle: beta
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "3"
        until: 2026-11-30
# nocheck: dynamic-flag  the vendor caches have no group of their own; one runs per vendor registry exactly when the cache they extend does
vendor:
  healthcheck:
    flavor: wget
    port_key: registry
    path: v2/
  modes:
    compose:
      enabled: true
    swarm:
      enabled: false
  placement: manager # nocheck: default-placement-manager  it extends the cache beside it
  enabled: true
  shared: true
  bond: 1
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 512m
  pids_limit: 256
  ports:
    internal:
      registry: 5000
  lifecycle: beta
# nocheck: dynamic-flag  the front has no group of its own; it is up exactly when the vendor caches it fronts are
front:
  healthcheck:
    flavor: nc
    port_key: registry
  modes:
    compose:
      enabled: true
    swarm:
      enabled: false
  placement: manager # nocheck: default-placement-manager  it fronts the vendor caches beside it
  enabled: true
  shared: true
  bond: 1
  image: nginx
  version: 1.31-alpine
  name: cache-registry-front
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 256m
  pids_limit: 256
  ports:
    local:
      registry: 5002
    internal:
      registry: 443
    onion:
      # nocheck: onion-flag  the vendor front serves this node's own docker daemon; publishing it would relay every vendor registry for strangers
      registry: false
  lifecycle: beta
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "1.31-alpine"
        until: 2026-11-30
# nocheck: dynamic-flag - pull-through cache content is re-fetchable, the backup consumer stays permanently off
container_backup:
  enabled: false
  shared: true

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started
