---
- name: "🔐 Verify the gateway contract for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-litellm/tasks/utils/consumer_contract.yml') }}"

- name: "🤖 Point the Moodle AI subsystem at the platform gateway"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - --user
      - "{{ MOODLE_RUNTIME_USER }}"
      - "{{ MOODLE_CONTAINER_ADDRESS }}" # nocheck: container-exec-resolver
      - php
      - "{{ [MOODLE_CLI_DIR, 'cfg.php'] | path_join }}"
      - "--component={{ item.component }}"
      - "--name={{ item.name }}"
      - "--set={{ item.value }}"
  loop: "{{ MOODLE_LITELLM_SETTINGS }}"
  loop_control:
    label: "{{ item.component }}/{{ item.name }}"
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🧹 Purge Moodle caches so the provider picks up its endpoint"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - --user
      - "{{ MOODLE_RUNTIME_USER }}"
      - "{{ MOODLE_CONTAINER_ADDRESS }}" # nocheck: container-exec-resolver
      - php
      - "{{ [MOODLE_CLI_DIR, 'purge_caches.php'] | path_join }}"
  changed_when: false

- name: "🔎 Read back the configured chat endpoint"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - --user
      - "{{ MOODLE_RUNTIME_USER }}"
      - "{{ MOODLE_CONTAINER_ADDRESS }}" # nocheck: container-exec-resolver
      - php
      - "{{ [MOODLE_CLI_DIR, 'cfg.php'] | path_join }}"
      - "--component=aiprovider_openai"
      - "--name=action_generate_text_endpoint"
  register: moodle_ai_endpoint
  changed_when: false

- name: "🛑 Refuse a Moodle AI provider that does not answer through the gateway"
  ansible.builtin.assert:
    that:
      - (moodle_ai_endpoint.stdout | trim) == MOODLE_LITELLM_CHAT_ENDPOINT
    fail_msg: >-
      aiprovider_openai still resolves generate_text to
      '{{ moodle_ai_endpoint.stdout | trim }}' instead of
      {{ MOODLE_LITELLM_CHAT_ENDPOINT }}, so prompts would leave the deployment.
