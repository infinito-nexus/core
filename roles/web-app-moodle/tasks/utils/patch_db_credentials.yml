---
- name: "🔑 Realign the password moodle persisted in its config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "moodle_code"
    patch_config_rel: "config.php"
    patch_expression: "s|^\\$CFG->dbpass *=.*|\\$CFG->dbpass = '@PASSWORD@';|"
