---
- name: "🧭 Resolve the moodle_code mountpoint, empty while the volume is absent"
  ansible.builtin.shell:
    cmd: >-
      container volume ls -q -f name=^moodle_code$ | grep -q . &&
      container volume inspect --format '{{ "{{" }}.Mountpoint{{ "}}" }}' moodle_code || true
  register: moodle_code_mountpoint
  changed_when: false

- name: "🔎 Check whether the persisted config exists"
  ansible.builtin.stat:
    path: "{{ [moodle_code_mountpoint.stdout | trim, 'config.php'] | path_join }}"
  register: moodle_config_stat
  when: (moodle_code_mountpoint.stdout | trim) != ""

- name: "🔄 Update the database password in the persisted config"
  ansible.builtin.shell:
    cmd: >-
      sed -i "s|^\$CFG->dbpass *=.*|\$CFG->dbpass = '${PATCH_PASSWORD}';|"
      {{ ([moodle_code_mountpoint.stdout | trim, 'config.php'] | path_join) | quote }}
  environment:
    PATCH_PASSWORD: "{{ lookup('database', application_id, 'password') | sed_escape('|') }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: true
  when: moodle_config_stat.stat.exists | default(false)
