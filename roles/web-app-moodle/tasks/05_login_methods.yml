---
- name: "🚪 Converge Moodle's auth plugins, login page and self-registration"
  loop: "{{ MOODLE_CORE_LOGIN_SETTINGS }}"
  loop_control:
    loop_var: moodle_login_setting
    label: "{{ moodle_login_setting.name }}"
  ansible.builtin.shell: >
    container exec --user {{ MOODLE_RUNTIME_USER }} {{ MOODLE_CONTAINER_ADDRESS }}
    php {{ [MOODLE_CLI_DIR, 'cfg.php'] | path_join }}
    --name={{ moodle_login_setting.name | quote }}
    --set={{ moodle_login_setting.value | quote }}
  changed_when: false

- name: "🔐 Offer or withdraw Moodle's own multi-factor authentication"
  include_tasks: utils/plugin/config.yml
  vars:
    moodle_plugin_config_component: tool_mfa
    moodle_plugin_config_settings:
      enabled: "{{ MOODLE_MFA_ENABLED }}"

- name: "🔐 Offer or withdraw the TOTP factor"
  include_tasks: utils/plugin/config.yml
  vars:
    moodle_plugin_config_component: factor_totp
    moodle_plugin_config_settings:
      enabled: "{{ MOODLE_MFA_ENABLED }}"

- name: "🔐 Let accounts without an enrolled factor pass while MFA is only offered"
  include_tasks: utils/plugin/config.yml
  vars:
    moodle_plugin_config_component: factor_nosetup
    moodle_plugin_config_settings:
      enabled: "{{ MOODLE_MFA_NOSETUP_ENABLED }}"

- name: "🔐 Send factorless accounts to setup under enforced MFA, clearing only own grace"
  ansible.builtin.shell: >
    container exec -i --user {{ MOODLE_RUNTIME_USER }}
    -e MOODLE_CONFIG={{ MOODLE_CONFIG | quote }}
    -e MOODLE_MFA_GRACE_MODE={{ MOODLE_MFA_GRACE_MODE | quote }}
    {{ MOODLE_CONTAINER_ADDRESS }} php
  args:
    stdin: "{{ lookup('file', 'php/provision/mfa_grace.php') }}"
  register: moodle_mfa_grace
  changed_when: moodle_mfa_grace.stdout is search('^CHANGED [1-9]', multiline=True)

- name: "🔐 Start the grace period as expired at every sign-in while MFA is enforced"
  include_tasks: utils/plugin/config.yml
  vars:
    moodle_plugin_config_component: local_mfaenforce
    moodle_plugin_config_settings:
      enabled: "{{ MOODLE_MFA_GRACE_ENABLED }}"
