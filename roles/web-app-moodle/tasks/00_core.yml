---
- include_tasks: utils/once/flag.yml

- name: "🚦 Declare the MCP edge limits before the vhost references them"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-webserver-core/tasks/utils/mcp_edge_limits.yml') }}"
  when: MOODLE_MCP_ENABLED | bool

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "👔 Moodle manager-side operations (build context, file deploys, container exec)"
  include_tasks: 01_manager_ops.yml
  when: IS_STACK_HOST | bool

- name: "👥 Converge the system roles and site administrators on the RBAC groups"
  include_tasks: 07_rbac.yml
