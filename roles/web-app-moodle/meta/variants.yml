---
# Matrix-deploy variant overrides for web-app-moodle.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — variant 3 exists so mod_bigbluebuttonbn and mod_jitsi,
# whose partners pin tor.enabled to a literal false, have a round of their own. It
# carries nothing else; every other round keeps the onion on.
#
# nocheck: variant-limit — folding the media round into an existing variant was
# measured and does not fit: variant 2 already carries matrix, lam, ldap and
# litellm, and adding the AI and cloud partners there puts the round at 69 GB
# against the 64 GB cap. A fourth round is the only way repository_owncloud,
# aiprovider_openwebui, hermes and openclaw reach the onion.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-moodle.
- services:
    container_backup:
      enabled: true
    css:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    ldap:
      enabled: true
      shared: true
    lam: # nocheck: variants-services-match
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    mariadb:
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    litellm:
      enabled: false
    tor:
      enabled: true
    bigbluebutton:
      enabled: false
      shared: false
    jitsi:
      enabled: false
      shared: false
    matrix:
      enabled: false
      shared: false
    nextcloud:
      enabled: false
      shared: false

    openwebui:
      enabled: false
      shared: false
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
