---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: dynamic-flag - the gateway is a single shared instance, never deployed per consumer
litellm:
  bond: 0.5
  enabled: "{{ LITELLM_USABLE }}"
  shared: "{{ LITELLM_SHARED }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
moodle:
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  app_version: 5.3.1
  transit_version: 4.5.16
  update:
    - key: app_version
      type: git_tags
      repository: https://github.com/moodle/moodle.git
      match: "v"
      strip: true
    - key: transit_version
      type: http_regex
      url: https://raw.githubusercontent.com/moodle/moodle/MOODLE_405_STABLE/version.php
      pattern: "\\$release\\s*=\\s*'(4\\.5\\.[0-9]+)"
  image: php
  # nocheck: docker-version
  version: "8.3-fpm"
  custom: true
  name: moodle
  min_storage: 448MB
  cpus: 1.0
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 512
  performance:
    php:
      upload_max_filesize: 256M
      post_max_size: 256M
  ports:
    local:
      http: 8026
    internal:
      http: 80
      fpm: 9000
  healthcheck:
    flavor:
      - msmtp
      - connect
    port_key: fpm
  proxy:
    service_key: nginx
  run_after:
    - web-app-keycloak
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-moodle', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-moodle', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-moodle', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-moodle', '2fa') }}"
        enforced: true
      registration:
        enabled: "{{ lookup('login_method', 'web-app-moodle', 'registration') }}"
  auth_oidc:
    idptype: 3
    clientauthmethod: 1
    clientid: "{{ OIDC.CLIENT.ID }}"
    authendpoint: "{{ OIDC.CLIENT.AUTHORIZE_URL }}"
    exchange_endpoint: "{{ OIDC.CLIENT.TOKEN_URL }}"
    username_claim: "{{ OIDC.ATTRIBUTES.USERNAME }}"
    single_sign_off: 1
    logouturi: "{{ OIDC.CLIENT.LOGOUT_URL }}"
    opname: "{{ OIDC.BUTTON_TEXT }}"
    icon: "moodle:t/lock"
    lock: locked
    update: always
    claims:
      firstname: givenName
      lastname: surname
      middlename: moodle_middle_name
      alternatename: moodle_nickname
      email: mail
      phone1: moodle_phone_number
      phone2: phone_number_alt
      address: street
      city: locality
      country: moodle_country
      institution: institution
      department: moodle_department
      description: description
      idnumber: id_number
      url: moodle_website
      lang: moodle_locale
      timezone: moodle_zoneinfo
      firstnamephonetic: name_phonetic_given
      lastnamephonetic: name_phonetic_family
  auth_ldap:
    host_url: "{{ LDAP.SERVER.URI }}"
    ldap_version: 3
    start_tls: 0
    admin_dn: "{{ LDAP.DN.ADMINISTRATOR.DATA }}"
    user_type: rfc2307
    contexts: "{{ LDAP.DN.OU.USERS }}"
    search_sub: 1
    user_attribute: "{{ LDAP.USER.ATTRIBUTES.ID }}"
    memberattribute: "{{ LDAP.RBAC.MEMBER_ATTRIBUTE }}"
    memberattribute_isdn: 1
    objectclass: "{{ LDAP.FILTERS.USERS.ALL }}"
    creators: "*"
    managercontext: "cn=web-app-moodle-manager,{{ LDAP.DN.OU.ROLES }}"
    coursecreatorcontext: "cn=web-app-moodle-coursecreator,{{ LDAP.DN.OU.ROLES }}"
    removeuser: 1
    sync_suspended: 1
    lock: locked
    update: onlogin
    attributes:
      firstname: "{{ LDAP.USER.ATTRIBUTES.FIRSTNAME }}"
      lastname: "{{ LDAP.USER.ATTRIBUTES.SURNAME }}"
      middlename: "{{ LDAP.USER.ATTRIBUTES.INITIALS }}"
      alternatename: "{{ LDAP.USER.ATTRIBUTES.DISPLAY_NAME }}"
      email: "{{ LDAP.USER.ATTRIBUTES.MAIL }}"
      phone1: "{{ LDAP.USER.ATTRIBUTES.PHONE }}"
      phone2: "{{ LDAP.USER.ATTRIBUTES.MOBILE }}"
      address: "{{ LDAP.USER.ATTRIBUTES.STREET }}"
      city: "{{ LDAP.USER.ATTRIBUTES.LOCALITY }}"
      country: "{{ LDAP.USER.ATTRIBUTES.COUNTRY }}"
      institution: "{{ LDAP.USER.ATTRIBUTES.ORGANIZATION }}"
      department: "{{ LDAP.USER.ATTRIBUTES.DEPARTMENT }}"
      description: "{{ LDAP.USER.ATTRIBUTES.DESCRIPTION }}"
      idnumber: "{{ LDAP.USER.ATTRIBUTES.EMPLOYEE_NUMBER }}"
      url: "{{ LDAP.USER.ATTRIBUTES.WEBSITE }}"
      lang: "{{ LDAP.USER.ATTRIBUTES.LOCALE }}"
      firstnamephonetic: "{{ LDAP.USER.ATTRIBUTES.PHONETIC_GIVEN }}"
      lastnamephonetic: "{{ LDAP.USER.ATTRIBUTES.PHONETIC_FAMILY }}"
      timezone: "{{ LDAP.USER.ATTRIBUTES.TIMEZONE }}"
nginx:
  backup:
    stop_required: false
  image: nginx
  version: 1.31-alpine
  name: moodle-nginx
  min_storage: 227MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
  ports:
    internal:
      http: 80
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "1.31-alpine"
        until: 2026-11-30
cron:
  name: moodle-cron
  min_storage: 1GB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
  # nocheck: single-replica moodle cron.php scheduler; concurrent replicas double-run scheduled tasks
  replicas: 1
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
# nocheck: playwright-service-flag — verified by web-svc-design provider spec
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: Academy on {{ DOMAIN_PRIMARY }}
  bootstrap: true
  slots:
    favicon:
      width: 64
      height: 64
    logo:
      width: 480
      height: 120
    logo-compact:
      width: 300
      height: 55
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag: bridged bigbluebutton partner, covered by the mod_bigbluebuttonbn addon spec
bigbluebutton:
  bond: 0.5
  enabled: "{{ 'web-app-bigbluebutton' in group_names }}"
  shared: "{{ 'web-app-bigbluebutton' in group_names }}"
# nocheck: playwright-service-flag: bridged jitsi partner, covered by the mod_jitsi addon spec
jitsi:
  bond: 0.5
  enabled: "{{ 'web-app-jitsi' in group_names }}"
  shared: "{{ 'web-app-jitsi' in group_names }}"
# nocheck: playwright-service-flag: bridged matrix partner, covered by the communication_matrix addon spec
matrix:
  bond: 0.5
  enabled: "{{ 'web-app-matrix' in group_names }}"
  shared: "{{ 'web-app-matrix' in group_names }}"
# nocheck: playwright-service-flag: bridged nextcloud partner, covered by the repository_owncloud addon spec
nextcloud:
  bond: 0.5
  enabled: "{{ 'web-app-nextcloud' in group_names }}"
  shared: "{{ 'web-app-nextcloud' in group_names }}"

# nocheck: playwright-service-flag
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
