---
- name: "🔄 restart wireguard"
  listen: restart-wireguard
  systemd:
    name: wg-quick@wg0.service
    state: restarted
    enabled: true
    daemon_reload: true

- name: "♻️ reload sysctl configuration"
  listen: reload-sysctl-configuration
  shell: "sysctl --load='/etc/sysctl.d/wireguard-ip.conf'"
