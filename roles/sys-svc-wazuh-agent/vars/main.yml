---
WAZUH_AGENT_MANAGER_ROLE: "web-app-wazuh"
WAZUH_AGENT_MANAGER_DEPLOYED: "{{ WAZUH_AGENT_MANAGER_ROLE in groups and groups[WAZUH_AGENT_MANAGER_ROLE] | length > 0 }}"

WAZUH_AGENT_VERSION: "{{ lookup('config', WAZUH_AGENT_MANAGER_ROLE, 'services.manager.version') }}"
WAZUH_AGENT_PACKAGE: "wazuh-agent"
WAZUH_AGENT_SERVICE: "wazuh-agent.service"
WAZUH_AGENT_REPO_URL: "https://packages.wazuh.com/{{ WAZUH_AGENT_VERSION.split('.')[0] }}.x"
WAZUH_AGENT_GPG_KEY_URL: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
WAZUH_AGENT_APT_KEY: "/etc/apt/keyrings/wazuh.asc"
WAZUH_AGENT_APT_SOURCE: "/etc/apt/sources.list.d/wazuh.list"
WAZUH_AGENT_YUM_REPO: "wazuh"

WAZUH_AGENT_DIR: "/var/ossec"
WAZUH_AGENT_CLOCK_SYNC_RETRIES: 6
WAZUH_AGENT_VERSION_FILE: "{{ [ WAZUH_AGENT_DIR, 'VERSION.json' ] | path_join }}"

WAZUH_AGENT_SOURCE_URL: "https://github.com/wazuh/wazuh/archive/v{{ WAZUH_AGENT_VERSION }}.tar.gz"
# Param WAZUH_AGENT_SOURCE_PINS: version -> {source: SHA-256 of the release tarball, deps: SHA-256 of the make deps manifest}; computed as in the README.
WAZUH_AGENT_SOURCE_PINS:
  "4.14.6":
    source: "1de971b9d0663a020a4d55ea713cae07b5c4188e67da896b779bc439029e7ee3"
    deps: "494cd89ae64526e5bbe277c7d5035dc659ef1ddbb1f1c9b7f9c2ad8202269485"
  "4.14.9":
    source: "9d58c1c3cc42b4a0ccfc9424a4fe2b3d6fc88731380e97b4c687374dd5012fdc"
    deps: "4fa922aea19e0837c724949d3f063013accca4d747b1e805edc13e0563cdb6eb"
# Exception: Wazuh recommends GCC 14, which Arch no longer ships; gcc15 (meta/packages.yml) is the closest, with no fallback to Arch's default gcc.
WAZUH_AGENT_ARCH_CC: "gcc-15"
WAZUH_AGENT_ARCH_CXX: "g++-15"
WAZUH_AGENT_BUILD_USER: "wazuh-build"
WAZUH_AGENT_CONFIG: "{{ [ WAZUH_AGENT_DIR, 'etc', 'ossec.conf' ] | path_join }}"
WAZUH_AGENT_CLIENT_KEYS: "{{ [ WAZUH_AGENT_DIR, 'etc', 'client.keys' ] | path_join }}"

WAZUH_AGENT_ENTRY: "{{ lookup('wazuh_agent') }}"
WAZUH_AGENT_MANAGER_ADDRESS: "{{ DOCKER_REACH_HOST }}"
WAZUH_AGENT_MANAGER_PORT: "{{ lookup('config', WAZUH_AGENT_MANAGER_ROLE, 'services.manager.ports.local.agent') }}"

WAZUH_AGENT_DOCKER_LISTENER_SCRIPT: "wodles/docker/DockerListener"
WAZUH_AGENT_DOCKER_LISTENER_INTERVAL: 60
WAZUH_AGENT_DOCKER_LISTENER_VENV: "/opt/wazuh-agent/docker-listener-venv"
WAZUH_AGENT_DOCKER_LISTENER_PYTHON: "{{ [ WAZUH_AGENT_DOCKER_LISTENER_VENV, 'bin', 'python3' ] | path_join }}"
WAZUH_AGENT_DOCKER_LISTENER_DROPIN: "/etc/systemd/system/wazuh-agent.service.d/docker-listener-venv.conf"
WAZUH_AGENT_DOCKER_LISTENER_PIP: "pip==26.2.1"
# Exception: newer than Wazuh's documented pins (urllib3 1.26.20, requests 2.32.2) to clear pip-audit advisories; re-run pip-audit on every Wazuh version bump.
WAZUH_AGENT_DOCKER_LISTENER_PIP_PACKAGES:
  - docker==7.1.0
  - urllib3==2.8.0
  - requests==2.33.1

WAZUH_AGENT_RULESET: "{{ lookup('wazuh_ruleset', scope='host') }}"
WAZUH_AGENT_JOURNALD_SYSTEM_TAGS: "{{ WAZUH_AGENT_RULESET.system_tags }}"
WAZUH_AGENT_JOURNALD_ROOT_TAGS: "{{ (WAZUH_AGENT_RULESET.own | map(attribute='program') | list) + WAZUH_AGENT_JOURNALD_SYSTEM_TAGS }}"
WAZUH_AGENT_JOURNALD_CONTAINER_TAGS: "{{ WAZUH_AGENT_RULESET.entities | map(attribute='program') | list }}"
WAZUH_AGENT_JOURNALD_CONTAINER_COMM: "{{ WAZUH_AGENT_RULESET.container_comm }}"

WAZUH_AGENT_FIM_FREQUENCY: 43200
WAZUH_AGENT_FIM_SCHEDULED_DIRS: ["/etc", "/usr/bin", "/usr/sbin", "/boot"]
WAZUH_AGENT_FIM_SCHEDULED_IGNORE: ["/etc/mtab", "/etc/resolv.conf", "/etc/hosts", "/etc/hostname", "/etc/adjtime"]
WAZUH_AGENT_FIM_DOCKER_UNITS_RESTRICT: "docker.service$|docker.socket$|containerd.service$"
WAZUH_AGENT_FIM_SYSTEMD_LIB_DIR: "/usr/lib/systemd/system"
WAZUH_AGENT_FIM_NGINX_DIR: "{{ lookup('nginx', 'files.configuration') | dirname if 'svc-prx-openresty' in group_names else '' }}"
WAZUH_AGENT_FIM_COMPOSE_VOLUMES: "{{ group_names | map('get_entity_name') | unique | map('regex_replace', '^(.+)$', DIR_COMPOSITIONS ~ '\\1/volumes') | list }}"
# Exception: report_changes keeps a plain copy of each file on the agent, so it is limited to files that cannot hold credentials; nodiff guards the private keys inside those directories.
WAZUH_AGENT_FIM_DIFF_DIRS:
  - { path: "/etc/ssh", restrict: "" }
  - { path: "/etc/sudoers.d", restrict: "" }
  - { path: "/root/.ssh", restrict: "authorized_keys$" }
  - { path: "/home/*/.ssh", restrict: "authorized_keys$" }
WAZUH_AGENT_FIM_NODIFF: "ssh_host_"
WAZUH_AGENT_FIM_HASH_DIRS: >-
  {{
    [
      {'path': '/etc/docker', 'restrict': ''},
      {'path': WAZUH_AGENT_FIM_SYSTEMD_LIB_DIR, 'restrict': WAZUH_AGENT_FIM_DOCKER_UNITS_RESTRICT},
      {'path': [DIR_SYSTEM_SERVICE, 'docker.service.d'] | path_join, 'restrict': ''},
      {'path': DIR_COMPOSITIONS | regex_replace('/$', ''), 'restrict': ''},
    ]
    + ([{'path': WAZUH_AGENT_FIM_NGINX_DIR | regex_replace('/$', ''), 'restrict': ''}] if WAZUH_AGENT_FIM_NGINX_DIR else [])
  }}
WAZUH_AGENT_FIM_REALTIME_DIRS: ["{{ [ WAZUH_AGENT_DIR, 'etc' ] | path_join }}"]
WAZUH_AGENT_FIM_WHODATA_PROVIDER: "ebpf"
WAZUH_AGENT_FIM_LOG: "{{ [ WAZUH_AGENT_DIR, 'logs', 'ossec.log' ] | path_join }}"
WAZUH_AGENT_FIM_STATE_RETRIES: 12
WAZUH_AGENT_AUDITD_SERVICE: "auditd.service"

# Starting values until Kevin sets the tolerated event loss (criterion K); these are Wazuh's own defaults, stated explicitly.
WAZUH_AGENT_BUFFER_QUEUE_SIZE: 5000
WAZUH_AGENT_BUFFER_EVENTS_PER_SECOND: 500
