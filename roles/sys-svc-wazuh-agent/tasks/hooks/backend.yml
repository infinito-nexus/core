---
# Exception: an app that opts in to Wazuh pulls in its host's agent here, because sys-* roles cannot be shared-service providers the service loader would deploy. On the manager's own host the manager role loads the agent after its manager and the agent pre-registration instead, so an app deployed before it cannot install an agent that has no manager yet.
- name: "🛡️ For '{{ application_id }}': Load the host's Wazuh agent"
  include_tasks: "{{ role_path }}/tasks/main.yml"
  when:
    - lookup('config', application_id, 'services.wazuh.enabled', False) | bool
    - WAZUH_AGENT_MANAGER_ROLE not in group_names
