---
# Exception: syscheckd writes its who-data verdict only to ossec.log, so the lines since its last start are read newest first.
- name: "🔍 Read the who-data verdict since syscheckd last started"
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      tac {{ WAZUH_AGENT_FIM_LOG | quote }}
      | sed {{ ('/' ~ WAZUH_AGENT_SYSCHECK_STARTED ~ ' (pid/q') | quote }}
      | grep -oE {{ (WAZUH_AGENT_SYSCHECK_CODES_PATTERN ~ '|' ~ WAZUH_AGENT_SYSCHECK_STARTED) | quote }}
      || true
    executable: /bin/bash
  register: wazuh_agent_whodata_log
  changed_when: false
  # Exception: a verdict that never appears is reported as whodata=unknown, which alerts, instead of failing the deploy.
  ignore_errors: true
  retries: "{{ WAZUH_AGENT_FIM_STATE_RETRIES }}"
  delay: "{{ WAZUH_AGENT_FIM_STATE_DELAY }}"
  until: >-
    WAZUH_AGENT_SYSCHECK_STARTED not in wazuh_agent_whodata_log.stdout
    or (('(' ~ WAZUH_AGENT_SYSCHECK_READY_CODE ~ ')') in wazuh_agent_whodata_log.stdout
        and (not (WAZUH_AGENT_FIM_WHODATA_ENABLED | bool)
             or wazuh_agent_whodata_log.stdout is search(WAZUH_AGENT_WHODATA_CODES_PATTERN)))

- name: "🧭 Resolve the who-data state"
  ansible.builtin.set_fact:
    wazuh_agent_whodata_state: >-
      {%- set log = wazuh_agent_whodata_log.stdout -%}
      {%- set verdicts = WAZUH_AGENT_WHODATA_CODES | dict2items | selectattr('key', 'in', log | regex_findall('[(]([0-9]+)[)]')) | map(attribute='value') | list -%}
      {%- if not (WAZUH_AGENT_FIM_WHODATA_ENABLED | bool) -%}whodata=unavailable reason=switched-off
      {%- elif WAZUH_AGENT_SYSCHECK_STARTED not in log -%}whodata=unknown reason=no-syscheckd-start-in-log
      {%- elif verdicts -%}{{ verdicts | first }}
      {%- else -%}whodata=unknown reason=no-verdict-in-log
      {%- endif -%}

- name: "🚩 Log the who-data state for the manager"
  ansible.builtin.command:
    argv: [logger, -t, "{{ WAZUH_AGENT_RULESET.fim.program }}", "{{ wazuh_agent_whodata_state }}"]
  changed_when: false
