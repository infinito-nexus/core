---
- name: "🔑 Fetch the Wazuh package signing key"
  get_url_retry:
    url: "{{ WAZUH_AGENT_GPG_KEY_URL }}"
    dest: "{{ WAZUH_AGENT_APT_KEY }}"
    owner: root
    group: root
    mode: "0644"

- name: "🔧 Configure the Wazuh apt repository"
  ansible.builtin.copy:
    dest: "{{ WAZUH_AGENT_APT_SOURCE }}"
    content: "deb [signed-by={{ WAZUH_AGENT_APT_KEY }}] {{ WAZUH_AGENT_REPO_URL }}/apt/ stable main\n"
    owner: root
    group: root
    mode: "0644"
  register: wazuh_agent_apt_source

- name: "🔄 Update the apt cache after the Wazuh repository change"
  ansible.builtin.apt: # nocheck: dynamic-package - apt repository and cache setup, not a package install
    update_cache: true
  when: wazuh_agent_apt_source is changed
  register: wazuh_agent_apt_cache
  retries: 5
  delay: 15
  until: wazuh_agent_apt_cache is succeeded

- name: "📦 Install {{ WAZUH_AGENT_PACKAGE }}={{ WAZUH_AGENT_PACKAGE_VERSION }}"
  ansible.builtin.apt: # nocheck: dynamic-package - exact manager-derived version; see README: registry version/build schema follow-up
    name: "{{ WAZUH_AGENT_PACKAGE }}={{ WAZUH_AGENT_PACKAGE_VERSION }}"
    state: present
    allow_change_held_packages: true
  register: wazuh_agent_install
  retries: 5
  delay: 15
  until: wazuh_agent_install is succeeded
  notify: wazuh-agent-restart

- name: "📌 Hold {{ WAZUH_AGENT_PACKAGE }} against upgrades"
  ansible.builtin.dpkg_selections:
    name: "{{ WAZUH_AGENT_PACKAGE }}"
    selection: hold
