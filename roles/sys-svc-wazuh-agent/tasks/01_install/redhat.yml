---
- name: "🔧 Configure the Wazuh repository with the agent excluded"
  ansible.builtin.yum_repository:
    name: "{{ WAZUH_AGENT_YUM_REPO }}"
    description: Wazuh
    baseurl: "{{ WAZUH_AGENT_REPO_URL }}/yum/"
    gpgcheck: true
    gpgkey: "{{ WAZUH_AGENT_GPG_KEY_URL }}"
    exclude: "{{ WAZUH_AGENT_PACKAGE }}"

- name: "📦 Install {{ WAZUH_AGENT_PACKAGE }}-{{ WAZUH_AGENT_PACKAGE_VERSION }}"
  ansible.builtin.dnf: # nocheck: dynamic-package - exact manager-derived version; see README: registry version/build schema follow-up
    name: "{{ WAZUH_AGENT_PACKAGE }}-{{ WAZUH_AGENT_PACKAGE_VERSION }}"
    state: present
    disable_excludes: "{{ WAZUH_AGENT_YUM_REPO }}"
  register: wazuh_agent_install
  retries: 5
  delay: 15
  until: wazuh_agent_install is succeeded
  notify: wazuh-agent-restart
