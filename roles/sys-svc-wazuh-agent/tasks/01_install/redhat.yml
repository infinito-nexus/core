---
- name: "🔧 Configure the Wazuh repository with the agent excluded"
  ansible.builtin.yum_repository:
    name: "{{ WAZUH_AGENT_YUM_REPO }}"
    description: Wazuh
    baseurl: "{{ WAZUH_AGENT_REPO_URL }}/yum/"
    gpgcheck: true
    gpgkey: "{{ WAZUH_AGENT_GPG_KEY_URL }}"
    exclude: "{{ WAZUH_AGENT_PACKAGE }}"

- name: "📦 Install {{ WAZUH_AGENT_PACKAGE }} {{ WAZUH_AGENT_VERSION }} past the exclude"
  package_install:
    id: wazuh-agent
    disable_excludes: "{{ WAZUH_AGENT_YUM_REPO }}"
  notify: wazuh-agent-restart
