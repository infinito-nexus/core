---
- name: "🔎 Check if Snipe-IT admin user already exists (by username)"
  ansible.builtin.shell: |
    container exec -i \
      -e APP_KEY \
      {{ SNIPE_IT_CONTAINER_ADDRESS }} \
      php -r '
        require "vendor/autoload.php";
        $app = require "bootstrap/app.php";
        $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
        $exists = \App\Models\User::where("username", "{{ lookup('users', 'platform_administrator').username }}")
          ->whereNull("deleted_at")
          ->exists();
        exit($exists ? 0 : 1);
      '
  environment:
    APP_KEY: "{{ SNIPE_IT_APP_KEY }}"
  register: snipe_it_admin_exists
  changed_when: false
  failed_when: false

- name: "📁 Create Snipe-IT administrator account"
  ansible.builtin.shell: |
    container exec -i -e APP_KEY -e SNIPE_IT_REALIGN_PASSWORD \
      {{ SNIPE_IT_CONTAINER_ADDRESS }} sh -lc '
        php artisan snipeit:create-admin \
          --first_name "{{ lookup('users', 'platform_administrator').firstname }}" \
          --last_name "{{ lookup('users', 'platform_administrator').lastname }}" \
          --username "{{ lookup('users', 'platform_administrator').username }}" \
          --email "{{ lookup('users', 'platform_administrator').email }}" \
          --password "$SNIPE_IT_REALIGN_PASSWORD" \
          --no-interaction
      '
  environment:
    APP_KEY: "{{ SNIPE_IT_APP_KEY }}"
    SNIPE_IT_REALIGN_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
  when: snipe_it_admin_exists.rc != 0
  register: snipe_it_admin_create
  changed_when: "'New user created' in snipe_it_admin_create.stdout"
  failed_when: >
    snipe_it_admin_create.rc != 0
    and not (
      'Duplicate entry' in (snipe_it_admin_create.stderr | default(''))
      and 'users_groups' in (snipe_it_admin_create.stderr | default(''))
    )
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔑 Realign the administrator password Snipe-IT persisted at install"
  ansible.builtin.shell:
    cmd: >
      container exec -i
      -e APP_KEY -e SNIPE_IT_REALIGN_USERNAME -e SNIPE_IT_REALIGN_PASSWORD
      {{ SNIPE_IT_CONTAINER_ADDRESS }} php
    stdin: "{{ lookup('file', 'php/realign_admin_password.php') }}"
  environment:
    APP_KEY: "{{ SNIPE_IT_APP_KEY }}"
    SNIPE_IT_REALIGN_USERNAME: "{{ lookup('users', 'platform_administrator').username }}"
    SNIPE_IT_REALIGN_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
  when: snipe_it_admin_exists.rc == 0
  register: snipe_it_admin_realign
  changed_when: snipe_it_admin_realign.stdout is search('\[CHANGED\]')
  failed_when: snipe_it_admin_realign.rc != 0 or snipe_it_admin_realign.stderr is search('\[FAIL\]')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
