---
- name: "⏳ snipe-it: wait until settings table is seeded"
  ansible.builtin.shell:
    cmd: "container exec -i {{ SNIPE_IT_CONTAINER_ADDRESS }} php"
    stdin: "{{ lookup('file', 'php/wait_settings.php') }}"
  register: snipe_settings_ready
  retries: 60
  delay: 5
  until: snipe_settings_ready.rc == 0
  changed_when: false
  failed_when: snipe_settings_ready.rc != 0

- name: "🔎 snipe-it: read the stored LDAP settings meta/forms.yml manages"
  ansible.builtin.shell:
    cmd: >-
      container exec -i
      -e SNIPE_IT_SETTINGS_MODE=read
      -e SNIPE_IT_SETTINGS={{ SNIPE_IT_LDAP_SETTINGS | to_json | b64encode | quote }}
      {{ SNIPE_IT_CONTAINER_ADDRESS }} php
    stdin: "{{ lookup('file', 'php/apply/settings.php') }}"
  register: snipe_it_ldap_stored
  changed_when: false

- name: "📣 snipe-it: report the managed LDAP settings the write reverts"
  include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    forms_drift_current: "{{ {'ldap': snipe_it_ldap_stored.stdout | from_json} }}"

- name: "📌 snipe-it: write the managed LDAP settings that differ via Setting model"
  ansible.builtin.shell:
    cmd: >-
      container exec -i
      -e SNIPE_IT_SETTINGS_MODE=write
      -e SNIPE_IT_SETTINGS={{ SNIPE_IT_LDAP_SETTINGS | to_json | b64encode | quote }}
      {{ SNIPE_IT_CONTAINER_ADDRESS }} php
    stdin: "{{ lookup('file', 'php/apply/settings.php') }}"
  register: snipe_it_ldap_written
  changed_when: snipe_it_ldap_written.stdout | trim == 'changed'
  when: snipe_it_ldap_stored.stdout | from_json | length > 0

- name: "🔑 snipe-it: apply the LDAP port and bind credential via Setting model"
  ansible.builtin.shell:
    cmd: >-
      IFS= read -r APP_KEY && IFS= read -r LDAP_BIND_PASSWORD_B64 && : "${APP_KEY:?arrived empty on stdin}" && : "${LDAP_BIND_PASSWORD_B64:?arrived empty on stdin}"
      && export APP_KEY LDAP_BIND_PASSWORD_B64 && container exec -i
      -e APP_KEY
      -e LDAP_SERVER_PORT={{ LDAP.SERVER.PORT | quote }}
      -e LDAP_BIND_PASSWORD_B64
      {{ SNIPE_IT_CONTAINER_ADDRESS }} php
    stdin: |-
      {{ SNIPE_IT_APP_KEY }}
      {{ LDAP.BIND_CREDENTIAL | b64encode }}
      {{ lookup('file', 'php/apply/ldap_config.php') }}
  register: snipe_it_ldap_credential
  changed_when: snipe_it_ldap_credential.stdout | trim == 'changed'
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🧹 snipe-it: clear Laravel caches after an LDAP settings change"
  ansible.builtin.shell:
    cmd: "container exec -i {{ SNIPE_IT_CONTAINER_ADDRESS }} php artisan optimize:clear"
  when: snipe_it_ldap_written is changed or snipe_it_ldap_credential is changed
  changed_when: true
