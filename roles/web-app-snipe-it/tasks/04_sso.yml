---
- name: "⏳ snipe-it: wait until settings table is seeded"
  ansible.builtin.shell:
    cmd: "container exec -i {{ SNIPE_IT_CONTAINER_ADDRESS }} php"
    stdin: "{{ lookup('file', 'php/wait_settings.php') }}"
  register: snipe_sso_settings_ready
  retries: 60
  delay: 5
  until: snipe_sso_settings_ready.rc == 0
  changed_when: false
  failed_when: snipe_sso_settings_ready.rc != 0

- name: "🔎 snipe-it: read the stored remote user settings meta/forms.yml manages"
  ansible.builtin.shell:
    cmd: >-
      container exec -i
      -e SNIPE_IT_SETTINGS_MODE=read
      -e SNIPE_IT_SETTINGS={{ SNIPE_IT_REMOTE_USER_SETTINGS | to_json | b64encode | quote }}
      {{ SNIPE_IT_CONTAINER_ADDRESS }} php
    stdin: "{{ lookup('file', 'php/apply/settings.php') }}"
  register: snipe_it_remote_user_stored
  changed_when: false

- name: "📣 snipe-it: report the managed remote user settings the write reverts"
  include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    forms_drift_current: "{{ {'remote_user': snipe_it_remote_user_stored.stdout | from_json} }}"

- name: "📌 snipe-it: write the managed remote user settings that differ via Setting model"
  ansible.builtin.shell:
    cmd: >-
      container exec -i
      -e SNIPE_IT_SETTINGS_MODE=write
      -e SNIPE_IT_SETTINGS={{ SNIPE_IT_REMOTE_USER_SETTINGS | to_json | b64encode | quote }}
      {{ SNIPE_IT_CONTAINER_ADDRESS }} php
    stdin: "{{ lookup('file', 'php/apply/settings.php') }}"
  register: snipe_it_remote_user_written
  changed_when: snipe_it_remote_user_written.stdout | trim == 'changed'
  when: snipe_it_remote_user_stored.stdout | from_json | length > 0

- name: "🧹 snipe-it: clear Laravel caches after a remote user settings change"
  ansible.builtin.shell:
    cmd: "container exec {{ SNIPE_IT_CONTAINER_ADDRESS }} php artisan optimize:clear"
  when: snipe_it_remote_user_written is changed
  changed_when: true

- name: "🔒 snipe-it: the SSO header bridge logs in only proxy-secret requests"
  ansible.builtin.shell:
    cmd: >-
      container exec {{ SNIPE_IT_CONTAINER_ADDRESS }} sh -c
      '{{ 30 | curl }} -s -o /dev/null -w "%{http_code}" -H "Host: $2" -H "X-Forwarded-Preferred-Username: $1" {{ item.proxy_header }} http://localhost/login'
      _ {{ lookup('users', IAM_PLATFORM_ADMIN_USER_KEY).username | quote }} {{ SNIPE_IT_DOMAIN | quote }}
  loop:
    - { label: "forged header without the proxy secret", proxy_header: "", expected: "200" }
    - { label: "header with the proxy secret", proxy_header: '-H "{{ SNIPE_IT_SSO_PROXY_HEADER }}: $INFINITO_SSO_PROXY_SECRET"', expected: "302" }
  loop_control:
    label: "{{ item.label }}"
  register: snipe_it_sso_bridge_probe
  changed_when: false
  failed_when: snipe_it_sso_bridge_probe.stdout != item.expected
