---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-playwright — the role's persona Playwright flow exercises no SeaweedFS storage surface (no object-browser/upload UI to assert against)
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
  from_name: "{{ service_provider.company.titel }} - Snipe-IT"
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — cache engine, no Playwright surface
redis:
  bond: 1
  backup:
    disabled: true
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-redis' in group_names }}"
  cpus: "0.5"
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
# nocheck: playwright-service-flag — object store, no Playwright surface
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
  public: true
# nocheck: playwright-service-flag  self-provider
snipe-it:
  backup:
    stop_required: false
  healthcheck:
    test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
    retries: 12
  enabled: true
  shared: true
  bond: 1
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  version: v8.8.3-alpine
  custom: true
  name: snipe-it
  image: snipe/snipe-it
  min_storage: 349MB
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 2g
  pids_limit: 512
  ports:
    local:
      sso: 16489
      sso_onion: 16545
      http: 8035
    internal:
      http: 80
  proxy:
    service_key: snipe-it
  ldap:
    is_ad: 0
    ldap_pw_sync: 0
    ad_domain: ""
    ldap_server: "{{ LDAP.SERVER.URI }}"
    ldap_uname: "{{ LDAP.DN.ADMINISTRATOR.DATA }}"
    ldap_basedn: "{{ LDAP.DN.OU.USERS }}"
    ldap_filter: >-
      &(objectClass=inetOrgPerson)(|({{ LDAP.USER.ATTRIBUTES.MEMBER_OF }}=cn=web-app-snipe-it-administrator,{{ LDAP.DN.OU.ROLES
      }})({{ LDAP.USER.ATTRIBUTES.MEMBER_OF }}=cn=web-app-snipe-it-user,{{ LDAP.DN.OU.ROLES
      }}))(!({{ LDAP.USER.ATTRIBUTES.ID }}={{ lookup('users', 'platform_administrator').username }}))
    ldap_auth_filter_query: "{{ LDAP.USER.ATTRIBUTES.ID }}="
    ldap_username_field: "{{ LDAP.USER.ATTRIBUTES.ID }}"
    ldap_lname_field: "{{ LDAP.USER.ATTRIBUTES.SURNAME }}"
    ldap_fname_field: "{{ LDAP.USER.ATTRIBUTES.FIRSTNAME | lower }}"
    ldap_display_name: "{{ LDAP.USER.ATTRIBUTES.DISPLAY_NAME | lower }}"
    ldap_emp_num: "{{ LDAP.USER.ATTRIBUTES.EMPLOYEE_NUMBER | lower }}"
    ldap_dept: "{{ LDAP.USER.ATTRIBUTES.DEPARTMENT | lower }}"
    ldap_email: "{{ LDAP.USER.ATTRIBUTES.MAIL }}"
    ldap_phone_field: "{{ LDAP.USER.ATTRIBUTES.PHONE | lower }}"
    ldap_mobile: "{{ LDAP.USER.ATTRIBUTES.MOBILE | lower }}"
    ldap_jobtitle: "{{ LDAP.USER.ATTRIBUTES.TITLE | lower }}"
    ldap_address: "{{ LDAP.USER.ATTRIBUTES.STREET | lower }}"
    ldap_city: "{{ LDAP.USER.ATTRIBUTES.LOCALITY | lower }}"
    ldap_state: "{{ LDAP.USER.ATTRIBUTES.REGION | lower }}"
    ldap_zip: "{{ LDAP.USER.ATTRIBUTES.POSTAL_CODE | lower }}"
    ldap_country: "{{ LDAP.USER.ATTRIBUTES.COUNTRY | lower }}"
    reset_url: "{{ OIDC.CLIENT.RESET_CREDENTIALS }}"
  remote_user:
    login_remote_user_header_name: INFINITO_SSO_USER
    login_remote_user_custom_logout_url: "{{ OIDC.CLIENT.LOGOUT_URL }}"
    login_common_disabled: 0
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "v8.8.3-alpine"
        until: 2026-11-30
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  header_trust:
    proxy_secret: sso_proxy_secret
    switch: "lookup('sso', application_id, 'is_proxy_gated')"
    files: [files/Dockerfile]
  oauth2:
    origin:
      host: snipe-it
      port: "80"
    acl:
      blacklist:
        - /login
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-snipe-it', role='administrator') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-snipe-it', role='user') }}"
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "Snipe-IT"
  slots:
    logo:
      width: 320
      height: 80
      frame: true
    favicon:
      width: 96
      height: 96
# nocheck: dynamic-flag
# nocheck: playwright-service-flag  carries the managed-field lock of meta/forms.yml on every page; no spec gates on it
javascript:
  bond: 1
  enabled: true
  shared: true
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: playwright-service-flag  internal adapter sidecar, covered by the role's MCP guest spec
# nocheck: dockerfile-custom  the Dockerfile is owned by svc-ai-mcp-adapter and staged per instance, so every adapter-backed provider shares one audited build
# nocheck: dynamic-flag  the sidecar tracks this role's own mcp flag, not another role's presence; a group_names expression would decide its exposure from an unrelated deployment
snipeitmcp:
  enabled: "{{ lookup('config', 'web-app-snipe-it', 'mcp.enabled') | bool }}"
  shared: false
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  name: snipeitmcp
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 24m
  pids_limit: 64
  ports:
    internal:
      http: 8080
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
