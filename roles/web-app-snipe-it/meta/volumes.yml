---
data:
  type: volume
  name: snipe-it_data
  mounts:
    - service: snipe-it
      target: /var/lib/snipeit

env:
  type: config
  source: "{{ lookup('container', 'web-app-snipe-it', 'files.env') }}"
  mode: "0444"
  mounts:
    - service: snipe-it
      target: /var/www/html/.env

php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: snipe-it
      target: /etc/php84/conf.d/zz-infinito-hardening.ini
