---
- include_tasks: utils/once/flag.yml

- name: "📂 Include the front proxy for every {{ application_id }} domain"
  include_role:
    name: sys-stk-front-proxy
  loop: "{{ lookup('domains', 'web-app-mastodon') }}"
  loop_control:
    loop_var: front_proxy_vhost
  vars:
    domain: "{{ front_proxy_vhost }}"
    http_port: "{{ lookup('config', application_id, 'services.mastodon.ports.local.http') }}"
    webserver_websocket_location: "/api/v1/streaming"
    websocket_port: "{{ lookup('config', application_id, 'services.mastodon.ports.local.websocket') }}"
    webserver_client_max_body_size: "80m"
    webserver_vhost_flavour: "ws_generic"

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: sys-stk-backend
  vars:
    compose_handlers_flush: false

- name: "🧹 Register the garbage collector of {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-ctl-cln-apps/tasks/utils/install.yml') }}"
  vars:
    garbage_collector_service_key: mastodon
    garbage_collector_environment:
      MASTODON_GARBAGE_COLLECTOR_DAYS_ROUTINE: "{{ lookup('config', application_id, 'services.mastodon.garbage_collector.days.routine') }}"
      MASTODON_GARBAGE_COLLECTOR_DAYS_PRESSURE: "{{ lookup('config', application_id, 'services.mastodon.garbage_collector.days.pressure') }}"

- name: "📌 MASTODON | Apply overrides"
  include_tasks: 01_overrides.yml

- name: 🚿 Flush handlers to start the Mastodon stack
  meta: flush_handlers

- name: "▶️ start setup procedures for mastodon"
  include_tasks: 02_setup.yml
  when: IS_STACK_HOST | bool

- name: "⏳ Wait for Mastodon"
  include_tasks: 03_wait.yml

- name: "🖥️ Mastodon stack-host post-deploy"
  include_tasks: stack_host.yml
  when: IS_STACK_HOST | bool
