---
- name: "🧹 Cleanup Mastodon caches when CLEANUP is true"
  include_tasks: 04_cleanup.yml
  when: CLEANUP | bool

- name: "📂 Include administrator routines for '{{ application_id }}'"
  include_tasks:
    file: 05_administrator.yml
    apply:
      delegate_to: "{{ MASTODON_HOST_NODE }}"

- name: "🎨 Include the design carriers of '{{ application_id }}'"
  include_tasks:
    file: 06_design.yml
    apply:
      delegate_to: "{{ MASTODON_HOST_NODE }}"

- name: "🚪 Include the sign-in methods of '{{ application_id }}'"
  include_tasks:
    file: 07_login_methods.yml
    apply:
      delegate_to: "{{ MASTODON_HOST_NODE }}"
