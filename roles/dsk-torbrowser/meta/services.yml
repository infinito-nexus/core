---
# nocheck: dynamic-flag  the desktop base is the premise of every dsk role, not a per-host option
desktop-base:
  bond: 1
  enabled: true
  shared: true
torbrowser:
  modes:
    host:
      enabled: true
  lifecycle: pre-alpha
  min_storage: "500MB"
  cpus: "0.5"
  mem_reservation: "256m"
  mem_limit: "1g"
  pids_limit: 512
