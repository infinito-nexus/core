---
enabled: true
shared: true
classification: native_server
direction: server
source_url: https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server/
minimum_version: "18.0"
transport: streamable_http
exposure: public
auth: bearer_token
auth_subject: service_account
implementation: native
credential:
  owner: mcp-web-app-gitlab
  source: token_store
  key: web-app-gitlab
allowed_consumers:
  - web-app-openwebui
  - web-app-hermes
  - web-app-openclaw
endpoint:
  service_key: gitlab
  path: /api/v4/mcp
  port_key: http
limits:
  request_bytes: 65536
  response_bytes: 1048576
  timeout_seconds: 15
  concurrent_requests: 4
  page_size: 100
  result_items: 500
  stream_seconds: 300
tools:
  allowlist:
    - create_issue
    - create_merge_request
    - create_workitem_note
    - get_issue
    - get_job_log
    - get_mcp_server_version
    - get_merge_request
    - get_merge_request_commits
    - get_merge_request_conflicts
    - get_merge_request_diffs
    - get_merge_request_pipelines
    - get_pipeline_jobs
    - get_saved_view_work_items
    - get_work_item_types
    - get_workitem_notes
    - link_work_items
    - manage_pipeline
    - search
    - search_labels
  upstream_serves:
    - create_issue
    - create_merge_request
    - create_merge_request_note
    - create_workitem_note
    - get_issue
    - get_job_log
    - get_mcp_server_version
    - get_merge_request
    - get_merge_request_commits
    - get_merge_request_conflicts
    - get_merge_request_diffs
    - get_merge_request_notes
    - get_merge_request_pipelines
    - get_pipeline_jobs
    - get_saved_view_work_items
    - get_work_item_types
    - get_workitem_notes
    - link_work_items
    - manage_pipeline
    - search
    - search_labels
  read_only_default: true
  mutating_tools_enabled: false
