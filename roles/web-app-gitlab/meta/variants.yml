    tor: # nocheck: variant-tor-off, variant-tor-collateral web-app-matrix#1 is the only homeserver round that switches gitlab back on and it refuses the onion for jitsi, so this round's partners ride clearnet with the matrix pairing; variant 3 carries the same partners without matrix over the onion
