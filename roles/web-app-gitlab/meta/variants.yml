---
# Matrix-deploy variant overrides for web-app-gitlab.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — variant 1 alone drops the onion: it carries the
# matrix pairing, whose reciprocating web-app-matrix#1 refuses the onion for
# jitsi, so its SSO runs on clearnet. Variant 3 repeats it without matrix over
# the onion, and every other variant keeps tor on.
# nocheck: variant-limit — variant 3 exists so the SSO and AI partners of
# variant 1 keep their onion coverage while variant 1 carries the matrix pairing.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-gitlab.
- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    postgres:
      shared: true
    redis:
      shared: true
    prometheus:
      enabled: true
      shared: true
    design:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    tor:
      enabled: true
    openwebui:
      enabled: false
      shared: false
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
    jenkins:
      enabled: false
      shared: false
    matrix:
      enabled: false
      shared: false
    mattermost:
      enabled: true
      shared: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
