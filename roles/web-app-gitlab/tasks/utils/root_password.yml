---
- name: "🔍 Resolve the node and container id running the GitLab Rails app"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ GITLAB_WEBSERVICE_SERVICE_NAME }}"
    resolve_output_prefix: GITLAB_RAILS
    resolve_compose_cid: "{{ lookup('container_address', application_id, GITLAB_WEBSERVICE_SERVICE_NAME) }}"

- name: "🔑 Realign the root password GitLab seeded on the empty database"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, run_once delegated to the hosting node
      IFS= read -r GITLAB_ROOT_PASSWORD && export GITLAB_ROOT_PASSWORD && container exec -i
      -e GITLAB_ROOT_USERNAME -e GITLAB_ROOT_PASSWORD
      {{ GITLAB_RAILS_LOCAL_CID | quote }}
      {{ GITLAB_RAILS_BIN | quote }} runner -
    stdin: |-
      {{ GITLAB_INIT_ROOT_PASSWORD }}
      {{ lookup('file', 'ruby/realign_root_password.rb') }}
  environment:
    GITLAB_ROOT_USERNAME: "{{ GITLAB_ROOT_USERNAME }}"
  register: gitlab_root_realign
  changed_when: gitlab_root_realign.stdout is search('\[CHANGED\]')
  failed_when: >-
    gitlab_root_realign.rc != 0
    or gitlab_root_realign.stdout is search('\[FAIL\]')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ GITLAB_RAILS_HOST_NODE }}"
  run_once: true
