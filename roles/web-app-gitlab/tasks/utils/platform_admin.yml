---
- name: "🔍 Resolve the node and container id running the GitLab Rails app"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ GITLAB_WEBSERVICE_SERVICE_NAME }}"
    resolve_output_prefix: GITLAB_RAILS
    resolve_compose_cid: "{{ lookup('container_address', application_id, GITLAB_WEBSERVICE_SERVICE_NAME) }}"

- name: "💎 Realign root, ensure the platform administrator, converge the appearance"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - -e
      - GITLAB_ROOT_USERNAME
      - -e
      - GITLAB_ROOT_PASSWORD
      - -e
      - GITLAB_DESIGN_TITLE
      - -e
      - GITLAB_ADMIN_USERNAME
      - -e
      - GITLAB_ADMIN_EMAIL
      - -e
      - GITLAB_ADMIN_NAME
      - -e
      - GITLAB_ADMIN_PASSWORD
      - "{{ GITLAB_RAILS_LOCAL_CID }}" # nocheck: container-exec-resolver
      - "{{ GITLAB_RAILS_BIN }}"
      - runner
      - "-"
    stdin: |-
      {{ lookup('file', 'ruby/run_steps.rb') }}
      InfinitoSteps.run('realign_root_password') do
      {{ lookup('file', 'ruby/realign_root_password.rb') }}
      end
      InfinitoSteps.run('ensure_platform_admin') do
      {{ lookup('file', 'ruby/ensure_platform_admin.rb') }}
      end
      InfinitoSteps.run('appearance') do
      uploads = {
      {% if GITLAB_DESIGN_ENABLED | bool %}
      {% for upload in gitlab_design_files.results | selectattr('content', 'defined') %}
        {{ upload.item.field }}: [{{ upload.item.ext | to_json }}, {{ upload.content | to_json }}],
      {% endfor %}
      {% endif %}
      }
      {{ lookup('file', 'ruby/appearance.rb') }}
      end
      InfinitoSteps.finish
  environment:
    GITLAB_ROOT_USERNAME: "{{ GITLAB_ROOT_USERNAME }}"
    GITLAB_ROOT_PASSWORD: "{{ GITLAB_INIT_ROOT_PASSWORD }}"
    GITLAB_DESIGN_TITLE: "{{ lookup('design', application_id).label if GITLAB_DESIGN_ENABLED | bool else '' }}"
    GITLAB_ADMIN_USERNAME: "{{ GITLAB_ADMIN_USERNAME }}"
    GITLAB_ADMIN_EMAIL: "{{ GITLAB_ADMIN_EMAIL }}"
    GITLAB_ADMIN_NAME: "{{ GITLAB_ADMIN_NAME }}"
    GITLAB_ADMIN_PASSWORD: "{{ GITLAB_ADMIN_PASSWORD }}"
  register: gitlab_platform_admin
  changed_when: gitlab_platform_admin.stdout is search('\[CHANGED\]')
  failed_when: >-
    gitlab_platform_admin.rc != 0
    or gitlab_platform_admin.stdout is search('\[FAIL\]')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ GITLAB_RAILS_HOST_NODE }}"
  run_once: true
