---
- name: "🛑 Refuse a 2fa login method GitLab cannot honour"
  ansible.builtin.assert:
    that:
      - "GITLAB_LOGIN_2FA | bool or GITLAB_LOGIN_SSO | bool"
    fail_msg: >-
      GitLab CE offers its own second factor to every account and has no switch to withdraw it;
      only the OmniAuth sign-in can skip it (omniauth.allow_bypass_two_factor), so
      services.gitlab.login.method.2fa.enabled can be false only while sso is on.

- name: "🔍 Resolve the node and container id running the GitLab Rails app"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ GITLAB_WEBSERVICE_SERVICE_NAME }}"
    resolve_output_prefix: GITLAB_RAILS
    resolve_compose_cid: "{{ lookup('container_address', application_id, GITLAB_WEBSERVICE_SERVICE_NAME) }}"

- name: "⬇️ Read the managed application settings GitLab holds"
  database_query:
    config: "{{ lookup('database', application_id) }}"
    query_file: "{{ [role_path, 'files/sql/select/application-settings.sql'] | path_join }}"
    named_args:
      fields: "{{ GITLAB_APPLICATION_SETTINGS | list | to_json }}"
    expect_rows: true
  register: gitlab_application_settings_stored
  changed_when: false
  run_once: true

- name: "📣 Report the managed application settings the write reverts"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    forms_drift_current:
      general: "{{ gitlab_application_settings_stored.rows[0][0] | default('{}', true) | from_json }}"

- name: "🚪 Converge the sign-in methods GitLab keeps as application settings"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - -e
      - GITLAB_APPLICATION_SETTINGS
      - -e
      - GITLAB_LOGIN_2FA
      - -e
      - GITLAB_LOGIN_2FA_ENFORCED
      - -e
      - GITLAB_OBJSTORE_ENABLED
      - "{{ GITLAB_RAILS_LOCAL_CID }}" # nocheck: container-exec-resolver
      - "{{ GITLAB_RAILS_BIN }}"
      - runner
      - "-"
    stdin: "{{ lookup('file', 'ruby/apply_login_methods.rb') }}"
  environment:
    GITLAB_APPLICATION_SETTINGS: "{{ GITLAB_APPLICATION_SETTINGS | to_json }}"
    GITLAB_LOGIN_2FA: "{{ GITLAB_LOGIN_2FA | bool | string | lower }}"
    GITLAB_LOGIN_2FA_ENFORCED: "{{ GITLAB_LOGIN_2FA_ENFORCED | bool | string | lower }}"
    GITLAB_OBJSTORE_ENABLED: "{{ GITLAB_OBJSTORE_ENABLED | bool | string | lower }}"
  register: gitlab_login_methods
  changed_when: gitlab_login_methods.stdout is search('\[CHANGED\]')
  failed_when: >-
    gitlab_login_methods.rc != 0
    or gitlab_login_methods.stdout is search('\[FAIL\]')
  delegate_to: "{{ GITLAB_RAILS_HOST_NODE }}"
  run_once: true
