---
- include_tasks: utils/once/flag.yml

- name: "🔌 Stage the MCP adapter instance for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-mcp-adapter/tasks/instance.yml') }}"
  vars:
    mcp_adapter_instance_dir: "{{ GITLAB_MCP_INSTANCE_DIR }}"
    mcp_adapter_upstream_key: true
  when: GITLAB_MCP_ENABLED | bool

- name: "📂 Include setup for domain '{{ lookup('domain', application_id) }}'"
  include_role:
    name: sys-stk-front-proxy
  vars:
    domain: "{{ lookup('domain', application_id) }}"
    http_port: "{{ lookup('config', application_id, 'services.gitlab.ports.local.http') }}"

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: sys-stk-backend
  vars:
    compose_handlers_flush: false

- name: "📄 Render GitLab CNG configuration"
  include_tasks: 01_config.yml

- name: 🚿 Flush handlers to start the GitLab stack
  meta: flush_handlers

- name: "⏳ Wait for GitLab services"
  include_tasks: 02_wait.yml

- name: "🔌 Provision the MCP server surface"
  include_tasks: utils/mcp.yml
  when: GITLAB_MCP_ENABLED | bool
