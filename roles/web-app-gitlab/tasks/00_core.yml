---
- include_tasks: utils/once/flag.yml

- name: "📂 Include setup for domain '{{ lookup('domain', application_id) }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: "📄 Render GitLab CNG configuration"
  include_tasks: 01_config.yml

- name: 🚿 Flush handlers to start the GitLab stack
  meta: flush_handlers

- name: "⏳ Wait for GitLab services"
  include_tasks: 02_wait.yml

- name: "🎨 Read the corporate design for the GitLab appearance"
  include_tasks: utils/design.yml
  when: GITLAB_DESIGN_ENABLED | bool

- name: "💎 Converge root, the platform administrator and the appearance"
  include_tasks: utils/platform_admin.yml

- name: "🚪 Converge the sign-in methods of GitLab"
  include_tasks: utils/login_methods.yml

- name: "🛂 Reconcile GitLab administrators and external users with the role groups"
  include_tasks: utils/rbac.yml

- name: "🔌 Provision the MCP server surface"
  include_tasks: utils/mcp.yml
  when: GITLAB_MCP_ENABLED | bool

- name: "🔎 Wait for the GitLab services the MCP flush recreated"
  include_tasks: 02_wait.yml
