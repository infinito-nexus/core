---
- name: "🔎 Wait until '{{ wait_container }}' container is healthy"
  ansible.builtin.include_tasks: 02_wait/wait_one.yml
  loop_control:
    loop_var: wait_container
  loop:
    - "{{ GITLAB_WEBSERVICE_SERVICE_NAME }}"
    - "{{ GITLAB_WORKHORSE_SERVICE_NAME }}"
    - "{{ GITLAB_SIDEKIQ_SERVICE_NAME }}"
    - "{{ GITLAB_GITALY_SERVICE_NAME }}"
    - "{{ GITLAB_SHELL_SERVICE_NAME }}"
