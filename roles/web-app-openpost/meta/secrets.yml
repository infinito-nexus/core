---
credentials:
  jwt_secret:
    description: Secret OpenPost signs its session and API JWTs with (OPENPOST_JWT_SECRET); upstream requires at least 32 characters.
    algorithm: alphanumeric
  encryption_key:
    description: Key OpenPost encrypts stored provider tokens and provider-app secrets with (OPENPOST_ENCRYPTION_KEY); OpenPost refuses to start once stored rows no longer decrypt, so rotating it requires the upstream previous-keys procedure.
    algorithm: alphanumeric
    rotatable: false
  media_signing_key:
    description: Key OpenPost signs short-lived media URLs with (OPENPOST_MEDIA_SIGNING_KEY), pinned apart from the encryption key so a key rotation keeps media links valid.
    algorithm: alphanumeric
