---
- name: "🔍 List the workspaces the crossposter may publish into"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
  vars:
    netns_request_argv: "{{ OPENPOST_NETNS_PYTHON }}"
    netns_request_host: "{{ OPENPOST_HOST_NODE }}"
    netns_request_method: GET
    netns_request_url: "{{ OPENPOST_NETNS_URL }}/api/v1/workspaces"
    netns_request_headers: "{{ openpost_breakglass_headers }}"
    netns_request_status: [200]
    netns_request_retries: 30
    netns_request_delay: 2
    netns_request_timeout: "{{ lookup('timeout', 30) | int }}"
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: openpost_crossposter_workspaces

- name: "🏢 Pick the organisation workspace for the crossposter"
  ansible.builtin.set_fact:
    openpost_crossposter_target_workspace: >-
      {{ (openpost_crossposter_workspaces.content | from_json
          | selectattr('name', 'equalto', OPENPOST_ORGANISATION_WORKSPACE) | first).id }}

- name: "🔎 Check the stored crossposter API token"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
  vars:
    netns_request_argv: "{{ OPENPOST_NETNS_PYTHON }}"
    netns_request_host: "{{ OPENPOST_HOST_NODE }}"
    netns_request_method: GET
    netns_request_url: "{{ OPENPOST_NETNS_URL }}/api/v1/workspaces"
    netns_request_headers: "{{ OPENPOST_API_HEADERS | combine({'Authorization': 'Bearer ' ~ openpost_crossposter_token}) }}"
    netns_request_status: [200, 401, 403]
    netns_request_retries: 30
    netns_request_delay: 2
    netns_request_timeout: "{{ lookup('timeout', 30) | int }}"
    netns_request_skip: "{{ openpost_crossposter_token | length == 0 }}"
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: openpost_crossposter_token_check

- name: "🔑 Issue a workspace API token for the crossposter"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
  vars:
    netns_request_argv: "{{ OPENPOST_NETNS_PYTHON }}"
    netns_request_host: "{{ OPENPOST_HOST_NODE }}"
    netns_request_method: POST
    netns_request_url: "{{ OPENPOST_NETNS_URL }}/api/v1/api-tokens"
    netns_request_headers: "{{ openpost_breakglass_headers }}"
    netns_request_body: >-
      {{ {'name': OPENPOST_CROSSPOSTER_TOKEN_NAME, 'scope': 'api:write', 'workspace_id': openpost_crossposter_target_workspace} | to_json }}
    netns_request_status: [200, 201]
    netns_request_retries: 30
    netns_request_delay: 2
    netns_request_timeout: "{{ lookup('timeout', 30) | int }}"
    netns_request_changed: [200, 201]
    netns_request_skip: >-
      {{ not (openpost_crossposter_token | length == 0
              or openpost_crossposter_token_check.status != 200
              or openpost_crossposter_workspace != openpost_crossposter_target_workspace) }}
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: openpost_crossposter_issued

- name: "🧭 Adopt the newly issued crossposter API token"
  ansible.builtin.set_fact:
    openpost_crossposter_workspace: "{{ openpost_crossposter_target_workspace }}"
    openpost_crossposter_token: "{{ (openpost_crossposter_issued.content | from_json).token }}"
  when: openpost_crossposter_issued is changed
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🌱 Seed the CI source tokens and social sets"
  ansible.builtin.include_tasks: crossposter/seed.yml
  when: OPENPOST_SIMULATOR_ENABLED | bool

- name: "💾 Persist the crossposter workspace, API token and CI source tokens"
  ansible.builtin.copy:
    content: >-
      {{ {'workspace': openpost_crossposter_workspace, 'token': openpost_crossposter_token,
          'sources': openpost_crossposter_sources} | to_json }}
    dest: "{{ OPENPOST_CROSSPOSTER_STATE_FILE }}"
    mode: "0600"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
