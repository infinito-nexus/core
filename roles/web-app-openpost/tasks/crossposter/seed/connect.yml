---
- name: "📌 Pick the pinned Mastodon server OpenPost connects through"
  ansible.builtin.set_fact:
    openpost_crossposter_mastodon_server: "{{ OPENPOST_PINNED_INSTANCES | selectattr('platform', 'equalto', 'mastodon') | map(attribute='name') | first }}"

- name: "🔍 Resolve the Mastodon container that grants the OpenPost app"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: mastodon
    resolve_service_name: "{{ lookup('container_service', 'web-app-mastodon', 'mastodon') if DEPLOYMENT_MODE == 'swarm' else '' }}"
    resolve_output_prefix: OPENPOST_SEED_MASTODON
    resolve_compose_cid: "{{ lookup('container_address', 'web-app-mastodon', 'mastodon') }}"

- name: "🧭 Ask OpenPost for the Mastodon authorization it would start"
  uri_retry:
    url: "{{ OPENPOST_LOCAL_URL }}/api/v1/accounts/mastodon/auth-url?workspace_id={{ openpost_crossposter_target_workspace }}&server_name={{ openpost_crossposter_mastodon_server | urlencode }}"
    headers: "{{ openpost_breakglass_headers }}"
    status_code: 200
  register: openpost_crossposter_mastodon_authorize
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🎫 Grant OpenPost's pinned app the code that authorization asks for"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -e
      - "CROSSPOSTER_ACCOUNT={{ openpost_crossposter_mastodon_route.source.account }}"
      - -e
      - "CROSSPOSTER_AUTHORIZE={{ openpost_crossposter_mastodon_authorize.json.url }}"
      - "{{ OPENPOST_SEED_MASTODON_LOCAL_CID }}" # nocheck: container-exec-resolver  OPENPOST_SEED_MASTODON_LOCAL_CID resolved at delegate_to runtime
      - bin/rails
      - runner
      - |
        query = Rack::Utils.parse_query(URI.parse(ENV.fetch("CROSSPOSTER_AUTHORIZE")).query)
        account = Account.find_local!(ENV.fetch("CROSSPOSTER_ACCOUNT"))
        application = Doorkeeper::Application.find_by!(uid: query.fetch("client_id"))
        grant = Doorkeeper::AccessGrant.create!(
          application: application,
          resource_owner_id: account.user.id,
          redirect_uri: query.fetch("redirect_uri"),
          scopes: query.fetch("scope", application.scopes.to_s),
          code_challenge: query["code_challenge"],
          code_challenge_method: query["code_challenge_method"],
          expires_in: 600
        )
        puts "CROSSPOSTER_GRANT=#{grant.plaintext_token}"
  register: openpost_crossposter_mastodon_grant
  changed_when: true
  delegate_to: "{{ OPENPOST_SEED_MASTODON_HOST_NODE }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔁 Exchange the code through OpenPost"
  uri_retry:
    url: "{{ OPENPOST_LOCAL_URL }}/api/v1/accounts/mastodon/exchange"
    method: POST
    headers: "{{ openpost_breakglass_headers }}"
    body_format: json
    body:
      code: "{{ (openpost_crossposter_mastodon_grant.stdout_lines | select('match', 'CROSSPOSTER_GRANT=') | first) | replace('CROSSPOSTER_GRANT=', '') | trim }}"
      instance_url: ""
      server_name: "{{ openpost_crossposter_mastodon_server }}"
      workspace_id: "{{ openpost_crossposter_target_workspace }}"
    status_code: [200, 201]
  retries: 0
  changed_when: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
