---
- name: "📌 Pick the pinned Mastodon server OpenPost connects through"
  ansible.builtin.set_fact:
    openpost_crossposter_mastodon_server: "{{ OPENPOST_PINNED_INSTANCES | selectattr('platform', 'equalto', 'mastodon') | map(attribute='name') | first }}"

- name: "🔍 Resolve the Mastodon container that grants the OpenPost app"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: mastodon
    resolve_service_name: "{{ lookup('container_service', 'web-app-mastodon', 'mastodon') if IS_SWARM_MODE else '' }}"
    resolve_output_prefix: OPENPOST_SEED_MASTODON
    resolve_compose_cid: "{{ lookup('container_address', 'web-app-mastodon', 'mastodon') }}"

- name: "🧭 Ask OpenPost for the Mastodon authorization it would start"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
  vars:
    netns_request_argv: "{{ OPENPOST_NETNS_PYTHON }}"
    netns_request_host: "{{ OPENPOST_HOST_NODE }}"
    netns_request_method: GET
    netns_request_url: "{{ OPENPOST_NETNS_URL }}/api/v1/accounts/mastodon/auth-url?workspace_id={{ openpost_crossposter_target_workspace }}&server_name={{ openpost_crossposter_mastodon_server
      | urlencode }}"
    netns_request_headers: "{{ openpost_breakglass_headers }}"
    netns_request_status: [200]
    netns_request_retries: 30
    netns_request_delay: 2
    netns_request_timeout: "{{ lookup('timeout', 30) | int }}"
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: openpost_crossposter_mastodon_authorize

- name: "🎫 Grant OpenPost's pinned app the code that authorization asks for"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - -e
      - "CROSSPOSTER_ACCOUNT={{ openpost_crossposter_mastodon_route.source.account }}"
      - -e
      - "CROSSPOSTER_AUTHORIZE={{ (openpost_crossposter_mastodon_authorize.content | from_json).url }}"
      - "{{ OPENPOST_SEED_MASTODON_LOCAL_CID }}" # nocheck: container-exec-resolver
      - bin/rails
      - runner
      - "-"
    stdin: "{{ lookup('file', 'ruby/mastodon/grant_authorization.rb') }}"
  register: openpost_crossposter_mastodon_grant
  changed_when: true
  delegate_to: "{{ OPENPOST_SEED_MASTODON_HOST_NODE }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔁 Exchange the code through OpenPost"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
  vars:
    openpost_crossposter_mastodon_exchange:
      code: "{{ (openpost_crossposter_mastodon_grant.stdout_lines | select('match', 'CROSSPOSTER_GRANT=') | first) | replace('CROSSPOSTER_GRANT=', '') | trim }}"
      instance_url: ""
      server_name: "{{ openpost_crossposter_mastodon_server }}"
      workspace_id: "{{ openpost_crossposter_target_workspace }}"
    netns_request_argv: "{{ OPENPOST_NETNS_PYTHON }}"
    netns_request_host: "{{ OPENPOST_HOST_NODE }}"
    netns_request_method: POST
    netns_request_url: "{{ OPENPOST_NETNS_URL }}/api/v1/accounts/mastodon/exchange"
    netns_request_headers: "{{ openpost_breakglass_headers }}"
    netns_request_body: "{{ openpost_crossposter_mastodon_exchange | to_json }}"
    netns_request_status: [200, 201]
    netns_request_retries: 0
    netns_request_delay: 0
    netns_request_timeout: "{{ lookup('timeout', 30) | int }}"
    netns_request_changed: [200, 201]
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: openpost_crossposter_mastodon_exchanged
