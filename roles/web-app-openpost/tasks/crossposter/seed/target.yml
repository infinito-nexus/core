---
- name: "🔎 List the accounts connected in the organisation workspace"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
  vars:
    netns_request_argv: "{{ OPENPOST_NETNS_PYTHON }}"
    netns_request_host: "{{ OPENPOST_HOST_NODE }}"
    netns_request_method: GET
    netns_request_url: "{{ OPENPOST_NETNS_URL }}/api/v1/accounts?workspace_id={{ openpost_crossposter_target_workspace }}"
    netns_request_headers: "{{ openpost_breakglass_headers }}"
    netns_request_status: [200]
    netns_request_retries: 30
    netns_request_delay: 2
    netns_request_timeout: "{{ lookup('timeout', 30) | int }}"
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: openpost_crossposter_connected

- name: "🔗 Connect the CI Mastodon account as a crossposting target"
  ansible.builtin.include_tasks: crossposter/seed/connect.yml
  when: openpost_crossposter_connected.content | from_json | selectattr('platform', 'equalto', 'mastodon') | list | length == 0
  vars:
    openpost_crossposter_mastodon_route: "{{ OPENPOST_CROSSPOSTER_ROUTES | selectattr('source.platform', 'equalto', 'mastodon') | first }}"
