---
- name: "🛑 Refuse an architecture the pinned build does not carry"
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == "x86_64"
    fail_msg: "dsk-laya pins the amd64 AppImage; this host reports {{ ansible_facts['architecture'] }}."
    quiet: true

- name: 📁 Ensure the application directory exists
  ansible.builtin.file:
    path: "{{ laya_appimage_path | dirname }}"
    state: directory
    mode: "0755"

- name: ⬇️ Fetch the pinned Laya AppImage
  get_url_retry:
    url: "{{ laya_appimage_url }}"
    dest: "{{ laya_appimage_path }}"
    checksum: "{{ laya_appimage_checksum }}"
    mode: "0755"

- name: 🔗 Put the pinned build on PATH
  ansible.builtin.file:
    src: "{{ laya_appimage_path }}"
    dest: "{{ laya_binary_path }}"
    state: link

- include_tasks: utils/once/flag.yml
