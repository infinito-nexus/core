---
- name: 🛡️ Install the Code - OSS protection
  when: code_protect | bool
  block:
    - name: 🛡️ Install the Code - OSS protection script
      ansible.builtin.copy:
        src: shell/protect-code-oss.sh
        dest: "{{ code_protect_script }}"
        owner: root
        group: root
        mode: "0755"

    - name: 🛡️ Install the Code - OSS protection units
      ansible.builtin.copy:
        src: "systemd/{{ item }}"
        dest: "{{ [DIR_SYSTEM_SERVICE, item] | path_join }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ code_protect_units }}"
      register: code_protect_installed

    - name: ⏱️ Re-apply the Code - OSS protection every 30 seconds
      ansible.builtin.systemd:
        name: protect-code-oss.timer
        enabled: true
        state: "{{ 'restarted' if code_protect_installed is changed else 'started' }}"
        daemon_reload: "{{ code_protect_installed is changed }}"

- name: 🧹 Retire the Code - OSS protection from a host without Code - OSS
  when: not (code_protect | bool)
  block:
    - name: 🔍 Look for an installed Code - OSS protection timer
      ansible.builtin.stat:
        path: "{{ [DIR_SYSTEM_SERVICE, 'protect-code-oss.timer'] | path_join }}"
      register: code_protect_timer

    - name: 🛑 Stop and disable the Code - OSS protection timer
      ansible.builtin.systemd:
        name: protect-code-oss.timer
        state: stopped
        enabled: false
      when: code_protect_timer.stat.exists

    - name: 🗑️ Remove the Code - OSS protection script and units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ [code_protect_script] + ([DIR_SYSTEM_SERVICE] | product(code_protect_units) | map('path_join') | list) }}"
      register: code_protect_removed

    - name: 🔄 Reload systemd after removing the Code - OSS protection units
      ansible.builtin.systemd:
        daemon_reload: true
      when: code_protect_removed is changed
