---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-required — open-source pretix has no S3/object-store backend: src/pretix/settings.py hardcodes MEDIA_ROOT=DATA_DIR/media (local disk), ships no django-storages/boto3, and the upstream config reference (https://docs.pretix.eu/self-hosting/config/) documents no storage/S3/bucket section
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — Redis cache, no Playwright surface
redis:
  bond: 1
  backup:
    disabled: true
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-redis' in group_names }}"
  cpus: "0.5"
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512
# nocheck: playwright-service-flag — DB engine, no Playwright surface (role-local integration tests)
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"
# nocheck: playwright-service-flag  self-provider
pretix:
  enabled: true
  shared: true
  bond: 1
  healthcheck:
    flavor: curl
    hostname: localhost
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: python
  # nocheck: docker-version  runtime base of the source build, not the served application
  version: "3.13"
  source_repository: https://github.com/pretix/pretix.git
  source_version: v2026.9.1
  ref_kind: tag
  update:
    - key: source_version
      type: git_tags
      repository: https://github.com/pretix/pretix.git
      match: "v"
  custom: true
  name: pretix
  min_storage: 1003MB
  backup:
    stop_required: false
  cpus: "2.0"
  mem_reservation: 1.5g
  mem_limit: 3g
  pids_limit: 1024
  ports:
    local:
      http: 8046
    internal:
      http: 80
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-pretix', 'sso') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-pretix', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-pretix', '2fa') }}"
        enforced: true
      registration:
        enabled: "{{ lookup('login_method', 'web-app-pretix', 'registration') }}"
  teams:
    organizers:
      names: ["Organizers (SSO)"]
      all_events: true
      all_event_permissions: true
      limit_event_permissions: {}
      all_organizer_permissions: true
      limit_organizer_permissions: {}
    checkin:
      names: ["Check-in (SSO)"]
      all_events: true
      all_event_permissions: false
      limit_event_permissions:
        "event.orders:checkin": true
      all_organizer_permissions: false
      limit_organizer_permissions: {}
    mcp:
      names: [mcp-readonly]
      all_events: true
      all_event_permissions: false
      limit_event_permissions:
        "event.orders:read": true
      all_organizer_permissions: false
      limit_organizer_permissions: {}
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "{{ DOMAIN_PRIMARY | upper }} Tickets"
  slots:
    logo:
      width: 128
      height: 128
      frame: true
    logo-wide:
      width: 320
      height: 80
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: dynamic-flag
# nocheck: playwright-service-flag  runtime DOM patch of the sign-in and account pages, asserted by test-login-methods.js
javascript:
  bond: 1
  enabled: true
  shared: true

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: playwright-service-flag  internal adapter sidecar, covered by the role's MCP guest spec
# nocheck: dockerfile-custom  the Dockerfile is owned by svc-ai-mcp-adapter and staged per instance, so every adapter-backed provider shares one audited build
# nocheck: dynamic-flag  the sidecar tracks this role's own mcp flag, not another role's presence; a group_names expression would decide its exposure from an unrelated deployment
pretixmcp:
  enabled: "{{ lookup('config', 'web-app-pretix', 'mcp.enabled') | bool }}"
  shared: false
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  name: pretixmcp
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 24m
  pids_limit: 64
  ports:
    internal:
      http: 8080
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  checkout:
    ref: "{{ lookup('config', 'web-app-pretix', 'services.pretix.source_version') }}"
    url: "{{ lookup('config', 'web-app-pretix', 'services.pretix.source_repository') }}"
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
