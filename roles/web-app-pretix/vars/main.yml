---
application_id: "web-app-pretix"
container_hostname: "{{ lookup('container_hostname', application_id) }}"

PRETIX_URL: "{{ lookup('tls', application_id, 'url.base') }}"
PRETIX_HOSTNAME: "{{ container_hostname }}"

PRETIX_NATIVE_ADMIN: "{{ lookup('users', 'web-app-pretix-breakglass' if PRETIX_OIDC_ENABLED | bool else 'platform_administrator') }}"

PRETIX_LOGIN_SSO: "{{ lookup('config', application_id, 'services.pretix.login.method.sso.enabled') | bool }}"
PRETIX_LOGIN_NATIVE: "{{ lookup('config', application_id, 'services.pretix.login.method.native.enabled') | bool }}"
PRETIX_LOGIN_2FA: "{{ lookup('config', application_id, 'services.pretix.login.method.2fa.enabled') | bool }}"
PRETIX_LOGIN_2FA_ENFORCED: "{{ PRETIX_LOGIN_2FA | bool and lookup('config', application_id, 'services.pretix.login.method.2fa.enforced') | bool }}"
PRETIX_LOGIN_REGISTRATION: "{{ lookup('config', application_id, 'services.pretix.login.method.registration.enabled') | bool }}"

PRETIX_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
PRETIX_DESIGN_PALETTE: "{{ lookup('design_palette', lookup('config', 'web-svc-design', 'services.design.colors.base')).light }}"
PRETIX_DESIGN_COLORS:
  primary_color: "{{ PRETIX_DESIGN_PALETTE['--design-primary'] }}"
  theme_color_success: "{{ PRETIX_DESIGN_PALETTE['--design-success'] }}"
  theme_color_danger: "{{ PRETIX_DESIGN_PALETTE['--design-danger'] }}"
  theme_color_background: "{{ PRETIX_DESIGN_PALETTE['--design-surface-1'] }}"

PRETIX_OIDC_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') }}"
PRETIX_OIDC_LABEL: "{{ OIDC.BUTTON_TEXT }}"
PRETIX_OIDC_CLIENT_ID: "{{ OIDC.CLIENT.ID }}"
PRETIX_OIDC_CLIENT_SECRET: "{{ OIDC.CLIENT.SECRET }}"
PRETIX_OIDC_ISSUER: "{{ OIDC.CLIENT.ISSUER_URL }}"
PRETIX_OIDC_AUTH_URL: "{{ OIDC.CLIENT.AUTHORIZE_URL }}"
PRETIX_OIDC_TOKEN_URL: "{{ OIDC.CLIENT.TOKEN_URL }}"
PRETIX_OIDC_USERINFO_URL: "{{ OIDC.CLIENT.USER_INFO_URL }}"
PRETIX_OIDC_LOGOUT_URL: "{{ OIDC.CLIENT.LOGOUT_URL }}"
PRETIX_OIDC_JWKS_URL: "{{ OIDC.CLIENT.CERTS }}"
PRETIX_OIDC_SCOPES: "openid,email,profile"
PRETIX_OIDC_UNIQUE_ATTRIBUTE: "{{ OIDC.ATTRIBUTES.USERNAME }}"
PRETIX_OIDC_STAFF_SCOPE: "{{ RBAC.GROUP.CLAIM }}"
PRETIX_OIDC_STAFF_VALUE: "/{{ lookup('rbac_group_path', application_id=application_id, role='administrator') }}"
PRETIX_OIDC_PLUGIN_VERSION: "{{ lookup('config', application_id, 'addons.pretix-oidc.version') }}"
PRETIX_ORGANIZER_NAME: "{{ lookup('design', application_id).label }}"
PRETIX_ORGANIZER_SLUG: "{{ application_id | entity_name }}"
PRETIX_TEAM_ORGANIZERS: "{{ lookup('form_values', application_id, 'team_organizers') }}"
PRETIX_TEAM_CHECKIN: "{{ lookup('form_values', application_id, 'team_checkin') }}"
PRETIX_TEAM_MCP: "{{ lookup('form_values', application_id, 'team_mcp') }}"
PRETIX_TEAM_NAMES:
  team_organizers: "{{ lookup('config', application_id, 'services.pretix.teams.organizers.names') | first }}"
  team_checkin: "{{ lookup('config', application_id, 'services.pretix.teams.checkin.names') | first }}"
PRETIX_RBAC_TEAMS:
  - >-
    {{ PRETIX_TEAM_ORGANIZERS | combine({'name': PRETIX_TEAM_NAMES.team_organizers,
    'group': '/' ~ lookup('rbac_group_path', application_id=application_id, role='organizer')}) }}
  - >-
    {{ PRETIX_TEAM_CHECKIN | combine({'name': PRETIX_TEAM_NAMES.team_checkin,
    'group': '/' ~ lookup('rbac_group_path', application_id=application_id, role='checkin')}) }}
PRETIX_OIDC_ONION_ISSUER: "{{ (lookup('tls', 'web-app-keycloak', 'domain') | network_of) == 'tor' }}"
PRETIX_OIDC_SOCKS_PROXY: "{{ lookup('tor_socks_proxy') if PRETIX_OIDC_ONION_ISSUER | bool else '' }}"
PRETIX_OIDC_PROXY_EXCLUDED_HOSTS: "{{ lookup('proxy_excluded_hosts', application_id) + [PRETIX_MCP_UPSTREAM_HOST] }}"
PRETIX_ALLOW_PRIVATE_NETWORKS: "{{ (ENVIRONMENT | lower) == 'development' }}"

PRETIX_REDIS_ENABLED: "{{ lookup('config', application_id, 'services.redis.enabled') }}"
PRETIX_REDIS_CACHE_DB: 1
PRETIX_REDIS_BROKER_DB: 0
PRETIX_REDIS_RESULT_DB: 2

PRETIX_SOURCE_VERSION: "{{ lookup('config', 'web-app-pretix', 'services.pretix.source_version') }}"
PRETIX_SOURCE_DOCKERFILE_NAME: "Dockerfile.infinito"
PRETIX_BASE_IMAGE: "{{ lookup('config', application_id, 'services.pretix.image') }}"
PRETIX_BASE_VERSION: "{{ lookup('config', application_id, 'services.pretix.version') }}"
PRETIX_CONTAINER: "{{ lookup('config', application_id, 'services.pretix.name') }}"
PRETIX_MCP_ENABLED: "{{ lookup('config', application_id, 'services.pretixmcp.enabled') | bool }}"
PRETIX_MCP_SERVICE_KEY: "pretixmcp"
PRETIX_MCP_CONTAINER: "{{ lookup('config', application_id, 'services.pretixmcp.name') }}"
PRETIX_MCP_PORT: "{{ lookup('config', application_id, 'services.pretixmcp.ports.internal.http') }}"
PRETIX_MCP_BEARER: "{{ lookup('config', application_id, 'secrets.credentials.mcp_bearer') }}"
PRETIX_MCP_INSTANCE_DIR: "{{ [lookup('container', application_id, 'directories.instance'), 'mcp'] | path_join }}"
PRETIX_MCP_UPSTREAM_HOST: "{{ lookup('config', application_id, 'services.pretix.name') }}"
PRETIX_MCP_UPSTREAM_PORT: "{{ lookup('config', application_id, 'services.pretix.ports.internal.http') }}"
PRETIX_MCP_UPSTREAM_URL: "http://{{ PRETIX_MCP_UPSTREAM_HOST }}:{{ PRETIX_MCP_UPSTREAM_PORT }}"
PRETIX_MCP_CONTRACT:
  provider: "{{ application_id }}"
  upstream_url: "{{ PRETIX_MCP_UPSTREAM_URL }}"
  auth_subject: "{{ lookup('config', application_id, 'mcp.auth_subject') }}"
  mutating_tools_enabled: "{{ lookup('config', application_id, 'mcp.tools.mutating_tools_enabled') | bool }}"
  tools: "{{ lookup('file', 'mcp/tools.json') | from_json }}"
  limits: "{{ lookup('config', application_id, 'mcp.limits') }}"
  schema_sha256: "{{ lookup('config', application_id, 'mcp.tools.schema_sha256') }}"
PRETIX_MCP_UPSTREAM_KEY: "{{ lookup('config', application_id, 'secrets.credentials.mcp_upstream_token') }}"
PRETIX_MCP_UPSTREAM_TEAM: "{{ lookup('config', application_id, 'services.pretix.teams.mcp.names') | first }}"
PRETIX_MCP_UPSTREAM_AUTH_HEADER: "Authorization"
PRETIX_MCP_UPSTREAM_AUTH_FORMAT: "Token {key}"
