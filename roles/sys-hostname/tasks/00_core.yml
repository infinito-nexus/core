---
- name: ✅ Ensure hostname package is installed
  become: true
  package_install:
    id: hostname-tool
  when: not DOCKER_IN_CONTAINER | bool

- block:
    - name: 🔧 Set system hostname to inventory_hostname (FQDN recommended)
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: ✅ Ensure /etc/hosts contains FQDN + shortname mapping
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1\\s+"
        line: "127.0.1.1 {{ inventory_hostname }}.localdomain {{ inventory_hostname }}"
        create: true
  when: not DOCKER_IN_CONTAINER | bool

- name: ✅ Ensure nss-myhostname is installed so *.localhost resolves to loopback
  become: true
  package_install:
    id: nss-myhostname

- name: ✅ Ensure nsswitch resolves hosts via myhostname
  become: true
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: "^(hosts:(?!.*\\bmyhostname\\b).*)$"
    line: "\\1 myhostname"
    backrefs: true

- include_tasks: utils/once/flag.yml
