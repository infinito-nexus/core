---
credentials:
  webhook_secret:
    description: "Secret GitHub signs every webhook delivery with (X-Hub-Signature-256). Paste the same value into the webhook's 'Secret' field on GitHub."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{40,}$"
    length: 48
  github_webhook_token:
    description: "Fine-grained GitHub token of a dedicated bot account, with an expiry date and read-only Contents, Metadata and Pull requests, that the receiver uses to
      look up whether a commit pushed to a default branch came through a merged pull request. Provided by the organization owner; empty or expired, every lookup raises
      rule 101114."
    algorithm: plain
    validation: "^.*$"
  github_settings_token:
    description: "Fine-grained GitHub token of a dedicated bot account, with an expiry date and read-only Administration, Metadata, Contents, Secret scanning alerts,
      Dependabot alerts and Organization members, that sys-ctl-hlth-github-settings uses to compare the organization and repository settings with their expected
      state. Provided by the organization owner; empty, expired or lacking a permission, the check raises rule 100163 instead of reporting no drift."
    algorithm: plain
    validation: "^.*$"
