---
# Matrix-deploy variant overrides for web-svc-github-webhook.
# See docs/contributing/artefact/files/role/variants.md for the file format.

- services:
    container_backup:
      enabled: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false
    tor:
      enabled: true
