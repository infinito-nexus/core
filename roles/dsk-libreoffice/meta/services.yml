---
# nocheck: dynamic-flag  the desktop base is the premise of every dsk role, not a per-host option
desktop-base:
  bond: 1
  enabled: true
  shared: true
libreoffice:
  modes:
    host:
      enabled: true
  flavor: fresh
  languages:
    - "{{ HOST_LL_CC | lower | replace('_', '-') }}"
  lifecycle: pre-alpha
  min_storage: "1GB"
  cpus: "1.0"
  mem_reservation: "256m"
  mem_limit: "1g"
  pids_limit: 512
