---
- name: ✅ Ensure npm is installed
  package_install:
    id: npm

- name: 📦 install the pi coding agent
  ansible.builtin.command:
    cmd: npm install -g --ignore-scripts {{ agnt_pi_package }}
  register: agnt_pi_install
  changed_when: "'added' in agnt_pi_install.stdout or 'changed' in agnt_pi_install.stdout"

- name: 🔑 Point the agent at the model gateway
  ansible.builtin.include_tasks: 01_gateway.yml
  when: agnt_pi_configured | bool

- include_tasks: utils/once/flag.yml
