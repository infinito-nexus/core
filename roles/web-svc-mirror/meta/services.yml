---
# nocheck: playwright-service-flag — mirror does not appear as a dashboard tile
# nocheck: dynamic-flag
dashboard:
  enabled: false
# nocheck: playwright-service-flag — self-provider
mirror:
  modes:
    host:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  cpus: "0.2"
  mem_reservation: 64m
  mem_limit: 128m
  pids_limit: 64
  min_storage: "1GB"
  lifecycle: alpha
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
# nocheck: dynamic-flag
# nocheck: design-off  Reason: proxies whitelisted third-party assets under '/<origin host>/'; '/' answers 404 (templates/proxy.conf.j2)
design:
  enabled: false
  shared: false
# nocheck: playwright-service-flag — /metrics endpoint covered by web-app-prometheus's own spec
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  # nocheck: prometheus-scrape
  scrape: false
# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
