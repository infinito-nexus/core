---
- name: "🔎 Report the live checks of the cloudflare DNS flavor and the zone pool needed"
  ansible.builtin.debug:
    msg: "{{ SEMAPHORE_DNS_LIVE.message }}"
  run_once: true

- name: "🔐 Hand the zone token of every zone of the pool to OpenBao"
  ansible.builtin.include_tasks: utils/dns_credentials.yml
  when: SEMAPHORE_DNS_LIVE.run | bool
