---
- include_tasks: utils/once/flag.yml

- name: "🧹 Remove the runner images of {{ application_id }} this deploy replaced"
  include_tasks:
    file: utils/runner/prune.yml
    apply:
      delegate_to: "{{ STACK_HOST }}"
      run_once: true

- name: "🗂️ Check and write the provision catalogs of this deployment"
  include_tasks:
    file: utils/catalog.yml
    apply:
      delegate_to: "{{ STACK_HOST }}"
      run_once: true

- name: "🌐 Run the tasks of the deployment's DNS flavor"
  include_tasks: "flavors/dns/{{ SEMAPHORE_DNS_FLAVOR }}.yml"

- name: "🔐 Hand the zone token and the workspace export logins to OpenBao"
  include_tasks: utils/workspaces/openbao.yml
  when: SEMAPHORE_WORKSPACES_ENABLED | bool

- name: "🧑‍💼 Run the Semaphore account operations on the stack host"
  when: IS_STACK_HOST | bool
  block:
    - name: "👤 Provision the external OIDC administrator in Semaphore"
      include_tasks: 01_oidc.yml
      when: SEMAPHORE_OIDC_ENABLED | bool

    - name: "🔑 Carry the break-glass password into Semaphore on every deploy"
      include_tasks: 02_breakglass.yml

    - name: "🗂️ Provision the project whose templates pause and resume the applications"
      include_tasks: utils/project.yml

- name: "🛂 Converge the Semaphore accounts with the role groups"
  include_tasks: 03_rbac.yml
