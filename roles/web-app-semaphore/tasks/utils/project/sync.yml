---
# Param: semaphore_project_token  the admin API token of tasks/utils/admin.yml
- name: "🗂️ Converge the stop and start templates and the foreign deploy"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - "{{ SEMAPHORE_LOCAL_CID }}" # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      - python3
      - -c
      - "{{ lookup('file', 'python/project.py') }}"
    stdin: >-
      {{ (semaphore_project_spec
          | combine({'deploy': semaphore_project_deploy} if SEMAPHORE_DEPLOY_ENABLED | bool else {})
          | combine({'workspaces': semaphore_project_workspaces} if SEMAPHORE_WORKSPACES_ENABLED | bool else {})
          | combine({'pool': semaphore_project_pool} if SEMAPHORE_POOL_ENABLED | bool else {}))
         | to_json }}
  vars:
    semaphore_project_pool:
      project: "{{ SEMAPHORE_POOL_PROJECT_NAME }}"
      runner_tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.pool }}"
      inventory: "{{ SEMAPHORE_POOL_NAME }}"
      repository:
        name: "{{ SEMAPHORE_POOL_NAME }}"
        path: "{{ SEMAPHORE_POOL_CHECKOUT }}"
      environment: "{{ SEMAPHORE_POOL_NAME }}"
      task_template:
        name: "{{ SEMAPHORE_POOL_NAME }}"
        playbook: "{{ SEMAPHORE_POOL_SCRIPT }}"
    semaphore_project_workspaces:
      project: "{{ SEMAPHORE_WORKSPACES_PROJECT_NAME }}"
      runner_tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.workspaces }}"
      key:
        name: "{{ SEMAPHORE_WORKSPACES_KEY_NAME }}"
        prefix: "{{ SEMAPHORE_DEPLOY_KEY_PREFIX }}"
        login: "{{ SEMAPHORE_DEPLOY_LOGIN }}"
        private_key: "{{ SEMAPHORE_WORKSPACES_PRIVATE_KEY }}"
      known_hosts: "{{ SEMAPHORE_WORKSPACES_KNOWN_HOSTS }}"
      scripts:
        name: "{{ SEMAPHORE_WORKSPACES_SCRIPTS_NAME }}"
        path: "{{ SEMAPHORE_RUNNER_REPOSITORY }}"
        script_app: "{{ SEMAPHORE_SCRIPT_APP_ID }}"
        deploy_script: "{{ SEMAPHORE_DEPLOY_SCRIPT }}"
        deploy_app: "{{ SEMAPHORE_DEPLOY_APP_ID }}"
        inventory_file: "{{ SEMAPHORE_DEPLOY_INVENTORY_FILE }}"
      variables: "{{ SEMAPHORE_WORKSPACES_VARIABLES }}"
      secrets: "{{ SEMAPHORE_WORKSPACES_SECRETS }}"
      store: "{{ SEMAPHORE_STORE_ACCOUNT }}"
      provision:
        project: "{{ SEMAPHORE_PROVISION_PROJECT_NAME }}"
      export:
        project: "{{ SEMAPHORE_EXPORT_PROJECT_NAME }}"
        runner_tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.export }}"
        environment: "{{ SEMAPHORE_EXPORT_VARIABLES }}"
    semaphore_project_deploy:
      project: "{{ SEMAPHORE_DEPLOY_PROJECT_NAME }}"
      runner_tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.deploy }}"
      key:
        name: "{{ SEMAPHORE_DEPLOY_KEY_NAME }}"
        prefix: "{{ SEMAPHORE_DEPLOY_KEY_PREFIX }}"
        login: "{{ SEMAPHORE_DEPLOY_LOGIN }}"
        private_key: "{{ SEMAPHORE_DEPLOY_PRIVATE_KEY }}"
      repository:
        name: "{{ SEMAPHORE_DEPLOY_REPOSITORY_NAME }}"
        url: "{{ SEMAPHORE_DEPLOY_REPOSITORY_URL }}"
        branch: "{{ SEMAPHORE_DEPLOY_REPOSITORY_BRANCH }}"
        key:
          name: "{{ SEMAPHORE_DEPLOY_REPOSITORY_KEY_NAME }}"
          prefix: "{{ SEMAPHORE_DEPLOY_REPOSITORY_KEY_PREFIX }}"
          login: ""
          private_key: "{{ SEMAPHORE_DEPLOY_REPOSITORY_KEY }}"
      inventory: "{{ SEMAPHORE_DEPLOY_NAME }}"
      environment:
        prefix: "{{ SEMAPHORE_DEPLOY_ENVIRONMENT_PREFIX }}"
        login: "{{ SEMAPHORE_DEPLOY_LOGIN }}"
        known_hosts: "{{ semaphore_deploy_fixture_known_hosts if SEMAPHORE_DEPLOY_FIXTURE_ENABLED | bool else [] }}"
        vault_password: "{{ SEMAPHORE_DEPLOY_VAULT_PASSWORD }}"
      task_template:
        name: "{{ SEMAPHORE_DEPLOY_NAME }}"
        app: "{{ SEMAPHORE_DEPLOY_APP_ID }}"
        playbook: "{{ SEMAPHORE_DEPLOY_INVENTORY_FILE }}"
    semaphore_project_spec:
      url: "{{ SEMAPHORE_API_URL }}"
      token: "{{ semaphore_project_token }}"
      project: "{{ SEMAPHORE_PROJECT_NAME }}"
      runner_tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.app_control }}"
      key:
        name: "{{ SEMAPHORE_APP_CONTROL_KEY_NAME }}"
        prefix: "{{ SEMAPHORE_APP_CONTROL_KEY_PREFIX }}"
        login: "{{ APP_CONTROL_USER }}"
        private_key: "{{ SEMAPHORE_APP_CONTROL_PRIVATE_KEY }}"
      hosts:
        - "{{ SEMAPHORE_APP_CONTROL_HOST }}"
      known_hosts:
        - "{{ SEMAPHORE_PLATFORM_HOST_KEY_LINE }}"
      inventory: "{{ SEMAPHORE_APP_CONTROL_NAME }}"
      repository:
        name: "{{ SEMAPHORE_APP_CONTROL_NAME }}"
        path: "{{ SEMAPHORE_RUNNER_REPOSITORY }}"
      environment: "{{ SEMAPHORE_APP_CONTROL_NAME }}"
      playbook: "{{ SEMAPHORE_APP_CONTROL_PLAYBOOK }}"
      applications: >-
        {{
          semaphore_project_record_contents.results
          | map(attribute='content') | map('b64decode') | map('from_json')
          | selectattr('control', 'sameas', true)
          | map(attribute='application_id') | sort | list
        }}
  register: semaphore_project_sync
  changed_when: semaphore_project_sync.stdout is search('(?<![A-Z])CHANGED')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ SEMAPHORE_HOST_NODE }}"

- name: "🪪 Publish the identity of the Workspaces project"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/utils/workspaces/identity.yml"
  when: SEMAPHORE_WORKSPACES_ENABLED | bool
