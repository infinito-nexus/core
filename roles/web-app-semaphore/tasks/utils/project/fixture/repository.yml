---
- name: "🗑️ Drop the inventory repository an earlier key or target left behind"
  ansible.builtin.command:
    argv: "{{ SEMAPHORE_GITEA_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', '', headers=SEMAPHORE_DEPLOY_FIXTURE_GITEA_HEADERS) }}"
  environment:
    HTTP_METHOD: DELETE
    HTTP_URL: "{{ SEMAPHORE_DEPLOY_FIXTURE_GITEA_API }}/repos/{{ SEMAPHORE_DEPLOY_FIXTURE_REPOSITORY_PATH }}"
  register: semaphore_deploy_fixture_drop
  retries: 30
  delay: 2
  until: semaphore_deploy_fixture_drop.rc == 0 and (semaphore_deploy_fixture_drop.stdout | from_json).status in [204, 404]
  changed_when: semaphore_deploy_fixture_drop.rc == 0 and (semaphore_deploy_fixture_drop.stdout | from_json).status == 204
  delegate_to: "{{ SEMAPHORE_GITEA_HOST_NODE }}"
  become: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "📦 Create the private inventory repository"
  ansible.builtin.command:
    argv: "{{ SEMAPHORE_GITEA_NETNS_PYTHON }}"
    stdin: >-
      {{ lookup('http_request_program', {
        'name': SEMAPHORE_DEPLOY_FIXTURE_REPOSITORY_PATH.split('/')[1],
        'private': true,
        'auto_init': true,
        'readme': 'Default',
        'default_branch': SEMAPHORE_DEPLOY_REPOSITORY_BRANCH,
      } | to_json, headers=SEMAPHORE_DEPLOY_FIXTURE_GITEA_HEADERS) }}
  environment:
    HTTP_METHOD: POST
    HTTP_URL: "{{ SEMAPHORE_DEPLOY_FIXTURE_GITEA_API }}/admin/users/{{ SEMAPHORE_DEPLOY_FIXTURE_REPOSITORY_PATH.split('/')[0] }}/repos"
  register: semaphore_deploy_fixture_create
  retries: 30
  delay: 2
  until: semaphore_deploy_fixture_create.rc == 0 and (semaphore_deploy_fixture_create.stdout | from_json).status == 201
  changed_when: true
  delegate_to: "{{ SEMAPHORE_GITEA_HOST_NODE }}"
  become: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "📁 Stage a scratch directory for the inventory on the controller"
  ansible.builtin.tempfile:
    state: directory
    suffix: -semaphore-inventory
  register: semaphore_deploy_fixture_scratch
  delegate_to: localhost
  become: false

- name: "🗂️ Provision the inventory of the shared target and commit it"
  block:
    - name: "🗂️ Provision and commit the inventory from the scratch directory"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/utils/project/fixture/commit.yml"
      vars:
        semaphore_deploy_fixture_inventory: "{{ [semaphore_deploy_fixture_scratch.path, 'inventory'] | path_join }}"
        semaphore_deploy_fixture_password_file: "{{ [semaphore_deploy_fixture_scratch.path, 'vault-password'] | path_join }}"
  always:
    - name: "🧹 Remove the scratch directory of the inventory"
      ansible.builtin.file:
        path: "{{ semaphore_deploy_fixture_scratch.path }}"
        state: absent
      delegate_to: localhost
      become: false
