---
- name: "🔐 Hand OpenBao the platform user passwords the fixture references"
  ansible.builtin.include_role:
    name: web-app-openbao
    tasks_from: utils/kv.yml
  vars:
    openbao_kv_state: present
    openbao_kv_mount: "{{ SEMAPHORE_DEPLOY_FIXTURE_BAO_MOUNT }}"
    openbao_kv_path: "{{ semaphore_fixture_secret.path }}"
    openbao_kv_data:
      password: "{{ lookup('users', semaphore_fixture_secret.name).password }}"
  loop: "{{ SEMAPHORE_DEPLOY_FIXTURE_PLATFORM_SECRETS | selectattr('kind', 'equalto', 'users') | list }}"
  loop_control:
    loop_var: semaphore_fixture_secret
    label: "{{ semaphore_fixture_secret.path }}"

- name: "🔐 Hand OpenBao the platform app credentials the fixture references"
  ansible.builtin.include_role:
    name: web-app-openbao
    tasks_from: utils/kv.yml
  vars:
    openbao_kv_state: present
    openbao_kv_mount: "{{ SEMAPHORE_DEPLOY_FIXTURE_BAO_MOUNT }}"
    openbao_kv_path: "{{ semaphore_fixture_secret.path }}"
    openbao_kv_data: >-
      {{ lookup('config', semaphore_fixture_secret.name, 'secrets.credentials')
         | semaphore_fixture_fields(semaphore_fixture_secret) }}
  loop: "{{ SEMAPHORE_DEPLOY_FIXTURE_PLATFORM_SECRETS | selectattr('kind', 'equalto', 'apps') | list }}"
  loop_control:
    loop_var: semaphore_fixture_secret
    label: "{{ semaphore_fixture_secret.path }}"

- name: "🔐 Hand OpenBao the workspace fixture key the workspace deploy specs stage"
  ansible.builtin.include_role:
    name: web-app-openbao
    tasks_from: utils/kv.yml
  vars:
    openbao_kv_state: present
    openbao_kv_mount: "{{ SEMAPHORE_DEPLOY_FIXTURE_BAO_MOUNT }}"
    openbao_kv_path: "{{ SEMAPHORE_DEPLOY_FIXTURE_WORKSPACE_KEY_PATH }}"
    openbao_kv_data:
      private_key: "{{ SEMAPHORE_DEPLOY_FIXTURE_WORKSPACE_PRIVATE_KEY }}"
