---
- name: "🔐 Write the {{ SEMAPHORE_DNS_FLAVOR }} DNS credentials into OpenBao"
  ansible.builtin.include_role:
    name: web-app-openbao
    tasks_from: utils/kv.yml
  vars:
    openbao_kv_state: present
    openbao_kv_mount: "{{ semaphore_dns_write.mount }}"
    openbao_kv_path: "{{ semaphore_dns_write.path }}"
    openbao_kv_data: "{{ semaphore_dns_write.data }}"
  loop: "{{ SEMAPHORE_DNS_WRITES }}"
  loop_control:
    loop_var: semaphore_dns_write
    label: "{{ semaphore_dns_write.mount }}/{{ semaphore_dns_write.path }}"
