---
# Param: semaphore_workspace_alias  ws-<id>, whose runner row and placed zone the query reads
- name: "🔎 Find the runner project and zone of {{ semaphore_workspace_alias }}"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - "{{ SEMAPHORE_DATABASE_LOCAL_CID }}" # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
      - psql
      - -U
      - "{{ lookup('database', application_id, 'username') }}"
      - -d
      - "{{ lookup('database', application_id, 'name') }}"
      - -v
      - ON_ERROR_STOP=1
      - -qtA
    stdin: "{{ lookup('template', 'sql/workspace/runner.sql.j2') }}"
  vars:
    semaphore_workspace_runner_action: hint
  register: semaphore_workspace_hint_query
  changed_when: false
  delegate_to: "{{ SEMAPHORE_DATABASE_HOST_NODE }}"

- name: "🌐 Settle the DNS zone of {{ semaphore_workspace_alias }} under its DNS flavor"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/utils/workspace/dns.yml"
  when: WORKSPACE_ACTION == 'apply'
