      + (query('node_hosts') | map('extract', hostvars, ['ansible_facts', 'all_ipv6_addresses']) | flatten))
     | unique }}
SEMAPHORE_WORKSPACE_CLOSED:
  - "127.0.0.0/8"
  - "::1"
  - "169.254.0.0/16"
  - "fe80::/10"
  - "0.0.0.0/8"
