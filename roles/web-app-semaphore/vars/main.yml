  - host: "{{ SEMAPHORE_DOMAIN }}"
    port: 443
  - host: "{{ lookup('domain', 'web-app-gitea') }}"
    port: 443
  - host: "{{ lookup('domain', 'web-app-gitea') }}"
    port: "{{ lookup('config', 'web-app-gitea', 'services.gitea.ports.public.ssh') }}" # nocheck: lookup-config-path  read only when SEMAPHORE_WORKSPACES_ENABLED, which needs Gitea for the workspace repositories
  - host: "{{ lookup('domain', 'web-app-openbao') }}"
    port: 443

