     and SEMAPHORE_DEPLOY_ENABLED | bool }}
SEMAPHORE_DEPLOY_FIXTURE_SRC_DIR: "{{ lookup('path_absolute') }}"
SEMAPHORE_DEPLOY_FIXTURE_HOST: "target"
