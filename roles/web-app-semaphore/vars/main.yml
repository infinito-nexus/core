---
application_id: "web-app-semaphore"
container_port: "{{ lookup('config', application_id, 'services.semaphore.ports.internal.http') }}"

SEMAPHORE_SERVICE: "semaphore"
SEMAPHORE_NAME: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_SERVICE ~ '.name') }}"
SEMAPHORE_SERVER_IMAGE: >-
  {{ lookup('config', application_id, 'services.' ~ SEMAPHORE_SERVICE ~ '.image') }}:{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_SERVICE ~ '.version')
  }}
SEMAPHORE_DOMAIN: "{{ lookup('domain', application_id) }}"
SEMAPHORE_WEB_ROOT: "{{ lookup('tls', SEMAPHORE_DOMAIN, 'url.origin') }}"
SEMAPHORE_ONION_DOMAIN: "{{ lookup('network_siblings', SEMAPHORE_DOMAIN) | in_network('tor') | reject('equalto', SEMAPHORE_DOMAIN) | first | default('') }}"
SEMAPHORE_ONION_WEB_ROOT: "{{ lookup('tls', SEMAPHORE_ONION_DOMAIN, 'url.origin') }}"
SEMAPHORE_VHOST_IS_SIBLING: "{{ domain != SEMAPHORE_DOMAIN }}"
SEMAPHORE_SIBLING_BASE_REWRITE: >-
  sub_filter '<base href="{{ SEMAPHORE_WEB_ROOT }}/">' '<base href="/">';
SEMAPHORE_SIBLING_PROXY: |-
  proxy_redirect {{ SEMAPHORE_WEB_ROOT }}/ /;
  proxy_cookie_flags semaphore nosecure;
SEMAPHORE_SIBLING_LOCATION: |-
  {{ SEMAPHORE_SIBLING_BASE_REWRITE }}
  {{ SEMAPHORE_SIBLING_PROXY }}
SEMAPHORE_LOCATION_CONFIGURATION: "{{ SEMAPHORE_SIBLING_LOCATION if SEMAPHORE_VHOST_IS_SIBLING | bool else '' }}"

SEMAPHORE_OIDC_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') }}"
SEMAPHORE_LDAP_ENABLED: "{{ lookup('config', application_id, 'services.ldap.enabled') }}"

SEMAPHORE_LOGIN_SSO: "{{ lookup('config', application_id, 'services.semaphore.login.method.sso.enabled') | bool }}"
SEMAPHORE_LOGIN_LDAP: "{{ lookup('config', application_id, 'services.semaphore.login.method.ldap.enabled') | bool }}"
SEMAPHORE_LOGIN_NATIVE: "{{ lookup('config', application_id, 'services.semaphore.login.method.native.enabled') | bool }}"
SEMAPHORE_LOGIN_2FA: "{{ lookup('config', application_id, 'services.semaphore.login.method.2fa.enabled') | bool }}"
SEMAPHORE_LOGIN_FORM: "{{ SEMAPHORE_LOGIN_NATIVE | bool or SEMAPHORE_LOGIN_LDAP | bool }}"

SEMAPHORE_ACCESS_KEY_ENCRYPTION: "{{ lookup('config', application_id, 'secrets.credentials.access_key_encryption') | regex_replace('^base64:', '') }}"
SEMAPHORE_COOKIE_HASH: "{{ lookup('config', application_id, 'secrets.credentials.cookie_hash') | regex_replace('^base64:', '') }}"
SEMAPHORE_COOKIE_ENCRYPTION: "{{ lookup('config', application_id, 'secrets.credentials.cookie_encryption') | regex_replace('^base64:', '') }}"

SEMAPHORE_ADMIN_USERNAME: "{{ lookup('users', 'web-app-semaphore-breakglass').username }}"
SEMAPHORE_ADMIN_PASSWORD: "{{ lookup('users', 'web-app-semaphore-breakglass').password }}"
SEMAPHORE_ADMIN_EMAIL: "{{ lookup('users', 'web-app-semaphore-breakglass').email }}"
SEMAPHORE_ADMIN_NAME: "Semaphore Break-glass Admin"

SEMAPHORE_OIDC_ADMIN_LOGIN: "{{ lookup('users', 'platform_administrator').username }}"
SEMAPHORE_OIDC_ADMIN_EMAIL: "{{ lookup('users', 'platform_administrator').email }}"
SEMAPHORE_OIDC_ADMIN_NAME: "{{ lookup('users', 'platform_administrator').username }}"

SEMAPHORE_OIDC_PROVIDER_ID: "keycloak"
SEMAPHORE_OIDC_CLIENT_ID: "{{ lookup('config', application_id, 'services.sso.oidc.clients.web') }}"
SEMAPHORE_OIDC_CLIENT_SECRET: "{{ lookup('config', application_id, 'secrets.credentials.oidc_client_secret') }}"
SEMAPHORE_OIDC_ONION_PROVIDER_ID: "keycloak_onion"
SEMAPHORE_OIDC_ONION_ENABLED: "{{ (SEMAPHORE_OIDC_ENABLED | bool) and SEMAPHORE_ONION_DOMAIN != '' }}"
SEMAPHORE_OIDC_PROVIDER: >-
  {{ {
       "display_name":   "Sign in with Keycloak",
       "provider_url":   OIDC.CLIENT.ISSUER_URL,
       "client_id":      SEMAPHORE_OIDC_CLIENT_ID,
       "client_secret":  SEMAPHORE_OIDC_CLIENT_SECRET,
       "redirect_url":   SEMAPHORE_WEB_ROOT ~ "/api/auth/oidc/" ~ SEMAPHORE_OIDC_PROVIDER_ID ~ "/redirect",
       "username_claim": OIDC.ATTRIBUTES.USERNAME,
       "email_claim":    lookup('template', lookup('path_absolute', 'roles', application_id, 'templates/oidc/email_claim.j2')) | trim,
       "name_claim":     OIDC.ATTRIBUTES.NAME,
       "scopes":         ["openid", "profile", "email"]
     } }}
SEMAPHORE_OIDC_PROVIDERS: >-
  {{ {SEMAPHORE_OIDC_PROVIDER_ID: SEMAPHORE_OIDC_PROVIDER}
     | combine({SEMAPHORE_OIDC_ONION_PROVIDER_ID: SEMAPHORE_OIDC_PROVIDER | combine({
         "redirect_url": SEMAPHORE_ONION_WEB_ROOT ~ "/api/auth/oidc/" ~ SEMAPHORE_OIDC_ONION_PROVIDER_ID ~ "/redirect"
       })} if SEMAPHORE_OIDC_ONION_ENABLED | bool else {}) }}
SEMAPHORE_OIDC_PROVIDERS_JSON: "{{ SEMAPHORE_OIDC_PROVIDERS | to_json }}"
SEMAPHORE_OIDC_VHOST_PROVIDER_ID: "{{ SEMAPHORE_OIDC_ONION_PROVIDER_ID if domain == SEMAPHORE_ONION_DOMAIN else SEMAPHORE_OIDC_PROVIDER_ID }}"
SEMAPHORE_OIDC_LOGIN_CONFIGURATION: |-
  {% for id, provider in SEMAPHORE_OIDC_PROVIDERS.items() if id != SEMAPHORE_OIDC_VHOST_PROVIDER_ID %}
  {% set listed = {"id": id, "name": provider.display_name, "color": "", "icon": ""} | to_json(separators=(",", ":")) %}
  sub_filter ',{{ listed }}' '';
  sub_filter '{{ listed }},' '';
  {% endfor %}
  sub_filter_types application/json;
  {% if SEMAPHORE_VHOST_IS_SIBLING | bool %}
  {{ SEMAPHORE_SIBLING_PROXY }}
  {% endif %}
SEMAPHORE_OIDC_LOGIN_LOCATION: >-
  {{ lookup('ansible.builtin.template',
            lookup('path_absolute', 'roles/sys-svc-proxy/templates/location/html.conf.j2'),
            template_vars={
              'location': '= /api/auth/login',
              'sso_proxy_enabled': false,
              'webserver_location_extra_configuration': SEMAPHORE_OIDC_LOGIN_CONFIGURATION
            }) | trim
     if SEMAPHORE_OIDC_ONION_ENABLED | bool else '' }}

SEMAPHORE_RBAC_LOGIN_ROLES:
  - administrator
  - operator
  - user
SEMAPHORE_RBAC_KEPT_ADMINISTRATORS:
  - "{{ SEMAPHORE_ADMIN_USERNAME }}"
  - "{{ SEMAPHORE_OIDC_ADMIN_LOGIN }}"
SEMAPHORE_LDAP_SEARCH_FILTER: >-
  (&(objectClass=inetOrgPerson)({{ LDAP.USER.ATTRIBUTES.ID }}=%s)(|{% for semaphore_login_role in SEMAPHORE_RBAC_LOGIN_ROLES %}({{ LDAP.USER.ATTRIBUTES.MEMBER_OF
  }}=cn={{ application_id }}-{{ semaphore_login_role }},{{ LDAP.DN.OU.ROLES }}){% endfor %}))

SEMAPHORE_PROJECT_NAME: "{{ SOFTWARE_NAME }}"
SEMAPHORE_API_URL: "http://127.0.0.1:{{ container_port }}/api"
SEMAPHORE_API_TOKEN_NAME: "{{ SOFTWARE_DOMAIN }}-deploy"
SEMAPHORE_API_TOKEN_MINUTES: 30
SEMAPHORE_PLATFORM_RUNNER_TAGS:
  app_control: "app-control"
  deploy: "deploy"
  workspaces: "workspaces"
  provision: "provision"
  export: "export"
  pool: "pool"

SEMAPHORE_RUNNER_SERVICE: "task-runner"
SEMAPHORE_RUNNER_NAME: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.name') }}"
SEMAPHORE_RUNNER_USER: "{{ SEMAPHORE_RUNNER_NAME }}"
SEMAPHORE_RUNNER_TOKEN_FILE: "{{ lookup('volume', application_id, 'semaphore_runner_token').target }}"
SEMAPHORE_RUNNER_ENV_FILE: "{{ lookup('container', application_id, 'directories.env') }}{{ SEMAPHORE_RUNNER_SERVICE }}.env"
SEMAPHORE_PLATFORM_RUNNERS:
  - key: app_control
    service: "{{ SEMAPHORE_RUNNER_SERVICE }}"
    volume: semaphore_runner_token
    enabled: "{{ lookup('config', application_id, 'services.task-runner.enabled') | bool }}"
    name: "{{ SEMAPHORE_RUNNER_NAME }}"
    project: "{{ SEMAPHORE_PROJECT_NAME }}"
    tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.app_control }}"
    max_parallel_tasks: 0
    token: "{{ lookup('config', application_id, 'secrets.credentials.runner_token') }}"
    token_file_host: "{{ [ lookup('container', application_id, 'directories.instance'), 'runner.token' ] | path_join }}"
  - key: deploy
    service: deploy-runner
    volume: semaphore_deploy_runner_token
    enabled: "{{ lookup('config', application_id, 'services.deploy-runner.enabled') | bool }}"
    name: "{{ lookup('config', application_id, 'services.deploy-runner.name') }}"
    project: "{{ SEMAPHORE_DEPLOY_PROJECT_NAME }}"
    tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.deploy }}"
    max_parallel_tasks: 0
    token: "{{ lookup('config', application_id, 'secrets.credentials.deploy_runner_token') }}"
    token_file_host: "{{ [ lookup('container', application_id, 'directories.instance'), 'deploy-runner.token' ] | path_join }}"
  - key: workspaces
    service: workspaces-runner
    volume: semaphore_workspaces_runner_token
    enabled: "{{ lookup('config', application_id, 'services.workspaces-runner.enabled') | bool }}"
    name: "{{ lookup('config', application_id, 'services.workspaces-runner.name') }}"
    project: "{{ SEMAPHORE_WORKSPACES_PROJECT_NAME }}"
    tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.workspaces }}"
    max_parallel_tasks: 2
    token: "{{ lookup('config', application_id, 'secrets.credentials.workspaces_runner_token') }}"
    token_file_host: "{{ [ lookup('container', application_id, 'directories.instance'), 'workspaces-runner.token' ] | path_join }}"
  - key: provision
    service: provision-runner
    volume: semaphore_provision_runner_token
    enabled: "{{ lookup('config', application_id, 'services.provision-runner.enabled') | bool }}"
    name: "{{ lookup('config', application_id, 'services.provision-runner.name') }}"
    project: "{{ SEMAPHORE_PROVISION_PROJECT_NAME }}"
    tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.provision }}"
    max_parallel_tasks: 0
    token: "{{ lookup('config', application_id, 'secrets.credentials.provision_runner_token') }}"
    token_file_host: "{{ [ lookup('container', application_id, 'directories.instance'), 'provision-runner.token' ] | path_join }}"
  - key: export
    service: export-runner
    volume: semaphore_export_runner_token
    enabled: "{{ lookup('config', application_id, 'services.export-runner.enabled') | bool }}"
    name: "{{ lookup('config', application_id, 'services.export-runner.name') }}"
    project: "{{ SEMAPHORE_EXPORT_PROJECT_NAME }}"
    tag: "{{ SEMAPHORE_PLATFORM_RUNNER_TAGS.export }}"
    max_parallel_tasks: 1
    token: "{{ lookup('config', application_id, 'secrets.credentials.export_runner_token') }}"
    token_file_host: "{{ [ lookup('container', application_id, 'directories.instance'), 'export-runner.token' ] | path_join }}"
SEMAPHORE_PLATFORM_RUNNERS_ACTIVE: "{{ SEMAPHORE_PLATFORM_RUNNERS | selectattr('enabled') | list }}"
SEMAPHORE_POOL_ENABLED: "{{ 'pool' in lookup('config', application_id, 'services.semaphore') }}"
SEMAPHORE_POOL_PROJECT_NAME: "{{ SOFTWARE_NAME }} Pool"
SEMAPHORE_POOL_NAME: "deploy"
SEMAPHORE_POOL_SCRIPT: "scripts/tests/deploy/job/semaphore.sh"
SEMAPHORE_POOL_RUNNER_COUNT: "{{ lookup('config', application_id, 'services.semaphore.pool.runners') }}" # nocheck: lookup-config-path  inventory-only block, read only when SEMAPHORE_POOL_ENABLED
SEMAPHORE_POOL_CHECKOUT: "{{ lookup('config', application_id, 'services.semaphore.pool.checkout') }}" # nocheck: lookup-config-path  inventory-only block, read only when SEMAPHORE_POOL_ENABLED
SEMAPHORE_POOL_RUNNERS: >-
  {{ (SEMAPHORE_POOL_RUNNER_COUNT | semaphore_pool_runners(lookup('config', 'svc-runner', 'services.runner.project_prefix'),
      lookup('config', application_id, 'secrets.credentials.pool_runner_token'), SEMAPHORE_POOL_PROJECT_NAME, SEMAPHORE_PLATFORM_RUNNER_TAGS.pool))
     if SEMAPHORE_POOL_ENABLED | bool else [] }}
SEMAPHORE_RUNNER_ROWS: "{{ SEMAPHORE_PLATFORM_RUNNERS_ACTIVE + SEMAPHORE_POOL_RUNNERS }}"
SEMAPHORE_PROVISION_RUNNER_SERVICE: "{{ (SEMAPHORE_PLATFORM_RUNNERS | selectattr('key', 'equalto', 'provision') | first).service }}"
SEMAPHORE_PROVISION_RUNNER_ENV_FILE: "{{ lookup('container', application_id, 'directories.env') }}{{ SEMAPHORE_PROVISION_RUNNER_SERVICE }}.env"
SEMAPHORE_EXPORT_RUNNER_SERVICE: "export-runner"
SEMAPHORE_EXPORT_RUNNER_ENABLED: "{{ lookup('config', application_id, 'services.export-runner.enabled') | bool }}"
SEMAPHORE_EXPORT_RUNNER_ENV_FILE: "{{ lookup('container', application_id, 'directories.env') }}{{ SEMAPHORE_EXPORT_RUNNER_SERVICE }}.env"
SEMAPHORE_EXPORT_NETWORK: "export"
SEMAPHORE_EXPORT_NETWORKS: "{{ [SEMAPHORE_EXPORT_NETWORK] if SEMAPHORE_EXPORT_RUNNER_ENABLED | bool else [] }}"
SEMAPHORE_EXPORT_EGRESS_DIR: "{{ [ lookup('container', application_id, 'directories.instance'), 'export-egress' ] | path_join }}"
SEMAPHORE_RUNNER_UID: "{{ lookup('volume', application_id, 'semaphore_runner_token').uid }}"
SEMAPHORE_RUNNER_GID: "{{ lookup('volume', application_id, 'semaphore_runner_token').gid }}"
SEMAPHORE_RUNNER_BUILD_DIR: "{{ [ lookup('container', application_id, 'directories.instance'), 'runner' ] | path_join }}"
SEMAPHORE_RUNNER_DOCKERFILE: "{{ lookup('path_absolute', 'roles/web-app-semaphore/files/runner/Dockerfile') }}"
SEMAPHORE_RUNNER_SOURCE_DIR: "{{ lookup('path_absolute', 'roles/web-app-semaphore/files') }}"
SEMAPHORE_RUNNER_SOURCE_GLOBS:
  - "shell/repository/*"
  - "shell/opentofu/*"
  - "python/*"
  - "python/bao/*"
  - "python/provision/*"
  - "python/prune/*"
  - "python/sandbox/*"
  - "opentofu/*"
  - "opentofu/records/*"
  - "opentofu/records/.*"
  - "opentofu/zone/*"
  - "opentofu/zone/.*"
  - "opentofu/modules/*/*"
  - "opentofu/roots/*/*"
  - "opentofu/roots/*/.*"
SEMAPHORE_RUNNER_SOURCES: >-
  {{ query('fileglob', *(SEMAPHORE_RUNNER_SOURCE_GLOBS | map('regex_replace', '^', SEMAPHORE_RUNNER_SOURCE_DIR ~ '/') | list))
     | sort }}
SEMAPHORE_RUNNER_SERVER_URL: "http://{{ SEMAPHORE_SERVICE }}:{{ container_port }}"
SEMAPHORE_RUNNER_TMP: "{{ lookup('volume', application_id, 'semaphore_runner_work').target }}"
SEMAPHORE_RUNNER_REPOSITORY: "/opt/app-control"
SEMAPHORE_RUNNER_BASE_ARG: "SEMAPHORE_RUNNER_BASE_IMAGE"
SEMAPHORE_RUNNER_INPUTS_ARG: "SEMAPHORE_RUNNER_INPUTS_DIGEST"
SEMAPHORE_RUNNER_INPUTS_LABEL: "nexus.infinito.semaphore.runner.inputs"
SEMAPHORE_RUNNER_ARCHITECTURE: "{{ HOST_ARCHITECTURE_BY_KERNEL[hostvars[STACK_HOST].ansible_facts['architecture']] }}"
SEMAPHORE_OPENTOFU_VERSION: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.opentofu_version') }}"
SEMAPHORE_OPENTOFU_URL: >-
  {{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.opentofu_url_' ~ SEMAPHORE_RUNNER_ARCHITECTURE)
     | replace('{version}', SEMAPHORE_OPENTOFU_VERSION) }}
SEMAPHORE_OPENTOFU_SHA256: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.opentofu_sha256_' ~ SEMAPHORE_RUNNER_ARCHITECTURE) }}"
SEMAPHORE_OPENTOFU_PLATFORM: "linux_{{ SEMAPHORE_RUNNER_ARCHITECTURE }}"
SEMAPHORE_AGE_VERSION: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.age_version') }}"
SEMAPHORE_AGE_URL: >-
  {{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.age_url_' ~ SEMAPHORE_RUNNER_ARCHITECTURE)
     | replace('{version}', SEMAPHORE_AGE_VERSION) }}
SEMAPHORE_AGE_SHA256: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.age_sha256_' ~ SEMAPHORE_RUNNER_ARCHITECTURE) }}"
SEMAPHORE_KEEPASSXC_VERSION: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.keepassxc_version') }}"
SEMAPHORE_KEEPASSXC_URL: >-
  {{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.keepassxc_url_' ~ SEMAPHORE_RUNNER_ARCHITECTURE)
     | replace('{version}', SEMAPHORE_KEEPASSXC_VERSION) }}
SEMAPHORE_KEEPASSXC_SHA256: "{{ lookup('config', application_id, 'services.' ~ SEMAPHORE_RUNNER_SERVICE ~ '.keepassxc_sha256_' ~ SEMAPHORE_RUNNER_ARCHITECTURE) }}"
SEMAPHORE_RUNNER_INPUTS:
  SEMAPHORE_SERVER_IMAGE: "{{ SEMAPHORE_SERVER_IMAGE }}"
  SEMAPHORE_OPENTOFU_URL: "{{ SEMAPHORE_OPENTOFU_URL }}"
  SEMAPHORE_OPENTOFU_SHA256: "{{ SEMAPHORE_OPENTOFU_SHA256 }}"
  SEMAPHORE_OPENTOFU_PLATFORM: "{{ SEMAPHORE_OPENTOFU_PLATFORM }}"
  SEMAPHORE_AGE_URL: "{{ SEMAPHORE_AGE_URL }}"
  SEMAPHORE_AGE_SHA256: "{{ SEMAPHORE_AGE_SHA256 }}"
  SEMAPHORE_KEEPASSXC_URL: "{{ SEMAPHORE_KEEPASSXC_URL }}"
  SEMAPHORE_KEEPASSXC_SHA256: "{{ SEMAPHORE_KEEPASSXC_SHA256 }}"
  SEMAPHORE_RUNNER_DOCKERFILE_DIGEST: "{{ lookup('file', SEMAPHORE_RUNNER_DOCKERFILE) | hash('sha256') }}"
  SEMAPHORE_RUNNER_REPOSITORY_DIGEST: >-
    {{ SEMAPHORE_RUNNER_SOURCES | map('relpath', SEMAPHORE_RUNNER_SOURCE_DIR) | zip(query('file', *SEMAPHORE_RUNNER_SOURCES)) | list | to_json | hash('sha256') }}
  SEMAPHORE_RUNNER_USER: "{{ SEMAPHORE_RUNNER_USER }}"
  SEMAPHORE_RUNNER_UID: "{{ SEMAPHORE_RUNNER_UID }}"
  SEMAPHORE_RUNNER_GID: "{{ SEMAPHORE_RUNNER_GID }}"
  SEMAPHORE_RUNNER_REPOSITORY: "{{ SEMAPHORE_RUNNER_REPOSITORY }}"
  SEMAPHORE_RUNNER_TMP: "{{ SEMAPHORE_RUNNER_TMP }}"
  SEMAPHORE_SANDBOX_ENTRYPOINT: "{{ SEMAPHORE_SANDBOX_ENTRYPOINT }}"
SEMAPHORE_RUNNER_INPUTS_DIGEST: "{{ SEMAPHORE_RUNNER_INPUTS | semaphore_runner_digest }}"
SEMAPHORE_RUNNER_INPUTS_FORMAT: >-
  {{ '{{ json (index .Config.Labels "' ~ SEMAPHORE_RUNNER_INPUTS_LABEL ~ '") }}' }}
SEMAPHORE_RUNNER_OWN_ROUND: "{{ application_id in lookup('deployment').primary }}"
# A compose file rendered before the runner existed has no task-runner service, which reads as no runner deployed.
SEMAPHORE_RUNNER_DEPLOYED: >-
  {{ {} if semaphore_runner_compose is skipped
     else (semaphore_runner_compose.content | b64decode | from_yaml).services.get(SEMAPHORE_RUNNER_SERVICE, {}) }}
SEMAPHORE_RUNNER_HELD: "{{ semaphore_runner_held is not skipped and semaphore_runner_held.rc == 0 }}"
SEMAPHORE_RUNNER_BASE_IMAGE: >-
  {{ SEMAPHORE_RUNNER_INPUTS_DIGEST | semaphore_runner_base(
       SOFTWARE_IMAGE ~ ':' ~ SOFTWARE_IMAGE_TAG,
       SEMAPHORE_RUNNER_DEPLOYED.build.args[SEMAPHORE_RUNNER_BASE_ARG] if SEMAPHORE_RUNNER_HELD | bool else '',
       semaphore_runner_held.stdout_lines | first | from_json if SEMAPHORE_RUNNER_HELD | bool else '',
       SEMAPHORE_RUNNER_OWN_ROUND | bool) }}
SEMAPHORE_RUNNER_IMAGE_TAG: "{{ SEMAPHORE_RUNNER_BASE_IMAGE | regex_replace('^.*:', '') }}"
SEMAPHORE_RUNNER_IMAGE: "{{ lookup('image', application_id, SEMAPHORE_RUNNER_SERVICE, version=SEMAPHORE_RUNNER_IMAGE_TAG) }}"
SEMAPHORE_RUNNER_BUILD_ARGS: >-
  {{ SEMAPHORE_RUNNER_INPUTS
     | combine({SEMAPHORE_RUNNER_BASE_ARG: SEMAPHORE_RUNNER_BASE_IMAGE, SEMAPHORE_RUNNER_INPUTS_ARG: SEMAPHORE_RUNNER_INPUTS_DIGEST}) }}
SEMAPHORE_RUNNER_LIST_FORMAT: "{{ '{{.Repository}}:{{.Tag}}' }}"
SEMAPHORE_RUNNER_PRUNE_FILTERS: >-
  {{ ([SEMAPHORE_RUNNER_IMAGE | regex_replace(':[^:/]+$', '')] + ([SOFTWARE_IMAGE] if SOFTWARE_IMAGE_BUILD | bool else []))
     | map('regex_replace', '^', '--filter=reference=') | list }}
SEMAPHORE_RUNNER_WORKSPACE_TAG_PATTERN: ":ws-[0-9a-f-]{36}-"
SEMAPHORE_RUNNER_WORKSPACE_IMAGES: >-
  {{ semaphore_runner_images.stdout_lines | select('search', SEMAPHORE_RUNNER_WORKSPACE_TAG_PATTERN ~ '[^:/]+$') | list }}
SEMAPHORE_RUNNER_WORKSPACE_BASES: >-
  {{ SEMAPHORE_RUNNER_WORKSPACE_IMAGES | map('regex_replace', '^.*' ~ SEMAPHORE_RUNNER_WORKSPACE_TAG_PATTERN, SOFTWARE_IMAGE ~ ':') | list }}
SEMAPHORE_RUNNER_PRUNED_IMAGES: >-
  {{ semaphore_runner_images.stdout_lines
     | reject('in', [SEMAPHORE_RUNNER_IMAGE, SEMAPHORE_RUNNER_BASE_IMAGE] + SEMAPHORE_RUNNER_WORKSPACE_IMAGES + SEMAPHORE_RUNNER_WORKSPACE_BASES)
     | list }}

SEMAPHORE_DNS: "{{ lookup('config', application_id, 'services.semaphore.workspaces.dns') }}"
SEMAPHORE_DNS_FLAVOR: "{{ SEMAPHORE_DNS.flavor | semaphore_dns_flavor }}"
SEMAPHORE_DNS_CREDENTIALS:
  route53_access_key_id: "{{ lookup('config', application_id, 'secrets.credentials.route53_access_key_id') }}"
  route53_secret_access_key: "{{ lookup('config', application_id, 'secrets.credentials.route53_secret_access_key') }}"
  cloudflare_zone_tokens: "{{ lookup('config', application_id, 'secrets.credentials.cloudflare_zone_tokens') }}"
SEMAPHORE_DNS_LIVE: "{{ SEMAPHORE_DNS | semaphore_dns_live(SEMAPHORE_DNS_CREDENTIALS) }}"
SEMAPHORE_DNS_WRITES: "{{ SEMAPHORE_DNS_CREDENTIALS | semaphore_dns_writes(SEMAPHORE_DNS) }}"
SEMAPHORE_CLOUDFLARE_ZONES_URL: "{{ ('zone' | semaphore_opentofu_credentials).api }}"
SEMAPHORE_CLOUDFLARE_ZONES_CREDENTIALS:
  cloudflare_zones_token: "{{ lookup('config', application_id, 'secrets.credentials.cloudflare_zones_token') }}"
  cloudflare_zones_account_id: "{{ lookup('config', application_id, 'secrets.credentials.cloudflare_zones_account_id') }}"
SEMAPHORE_CLOUDFLARE_ZONES_WRITE: "{{ SEMAPHORE_CLOUDFLARE_ZONES_CREDENTIALS | semaphore_cloudflare_zones_write }}"
SEMAPHORE_CLOUDFLARE_ZONES_LIVE: "{{ SEMAPHORE_CLOUDFLARE_ZONES_WRITE.state == 'present' }}"
SEMAPHORE_CLOUDFLARE_ZONES_PROBE: "{{ lookup('config', application_id, 'services.semaphore.workspaces.dns.zone_probe') }}"
SEMAPHORE_WORKSPACE_CATALOGS: >-
  {{ lookup('config', application_id, 'services.semaphore.workspaces.catalog')
     | semaphore_catalogs(applications, application_id) }}
SEMAPHORE_WORKSPACE_CATALOG_DIR_HOST: "{{ [ lookup('container', application_id, 'directories.instance'), 'catalogs' ] | path_join }}"
SEMAPHORE_WORKSPACE_CATALOG_DIR: "{{ lookup('volume', application_id, 'semaphore_provision_catalogs').target }}"

SEMAPHORE_APP_CONTROL_NAME: "{{ APP_CONTROL_USER }}"
