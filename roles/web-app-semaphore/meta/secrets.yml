---
credentials:
  access_key_encryption:
    description: Base64-encoded 32-byte key Semaphore uses to encrypt access keys stored in the database (SEMAPHORE_ACCESS_KEY_ENCRYPTION); the 'base64:' prefix
      is stripped at render time.
    algorithm: base64_prefixed_32
  cookie_hash:
    description: Base64-encoded 32-byte key used to sign session cookies (SEMAPHORE_COOKIE_HASH); the 'base64:' prefix is stripped at render time.
    algorithm: base64_prefixed_32
  cookie_encryption:
    description: Base64-encoded 32-byte key used to encrypt session cookies (SEMAPHORE_COOKIE_ENCRYPTION); the 'base64:' prefix is stripped at render time.
    algorithm: base64_prefixed_32
  app_control_ssh_key:
    description: OpenSSH ed25519 private key the Semaphore runner signs in with as the app-control host account; its public half is that account's only
      authorized key, pinned by a forced command to 'app-control stop|start'.
    algorithm: ssh_ed25519
  deploy_ssh_key:
    description: OpenSSH ed25519 private key the deploy template signs in to the foreign servers with; authorize its public half for root on every host the
      inventory repository lists. Used only when services.semaphore.deploy is declared.
    algorithm: ssh_ed25519
  fixture_ssh_key:
    description: OpenSSH ed25519 private key the Workspaces project signs in to the platform host as root with while the deploy fixture is on (the dev, act and
      github runtimes with Gitea and services.semaphore.deploy); only then is its public half the one key root may sign in with. A production deploy never reads
      it, and it differs from deploy_ssh_key, app_control_ssh_key and the target key.
    algorithm: ssh_ed25519
  fixture_workspace_ssh_key:
    description: OpenSSH ed25519 private key the workspace deploy specs sign in to the shared target as root with while the deploy fixture is on; the fixture
      writes it to platform/data/fixture/<host>/workspace-ssh in OpenBao, where the Playwright AppRole reads it, and authorizes its public half on the shared
      target. A production deploy never reads it, and it differs from fixture_ssh_key, deploy_ssh_key and the target key.
    algorithm: ssh_ed25519
  runner_token:
    description: Token the app-control runner (task-runner) authenticates to the server with; the deploy seeds its runner row in the app-control project with it
      and mounts it into the runner as a 0400 secret file.
    algorithm: random_hex_32
  deploy_runner_token:
    description: Token the runner of the deploy project (deploy-runner) authenticates to the server with; the deploy seeds its runner row in that project with
      it and mounts it into the runner as a 0400 secret file. Used only when services.semaphore.deploy is declared.
    algorithm: random_hex_32
  workspaces_runner_token:
    description: Token the runner of the Workspaces project (workspaces-runner) authenticates to the server with; the deploy seeds its runner row in that
      project with it and mounts it into the runner as a 0400 secret file. Used only when services.semaphore.workspaces is declared.
    algorithm: random_hex_32
  provision_runner_token:
    description: Token the runner of the Provision project (provision-runner) authenticates to the server with; the deploy seeds its runner row in that project
      with it and mounts it into the runner as a 0400 secret file. Used only when services.semaphore.workspaces is declared.
    algorithm: random_hex_32
  export_runner_token:
    description: Token the runner of the Export project (export-runner) authenticates to the server with; the deploy seeds its runner row in that project with
      it and mounts it into the runner as a 0400 secret file. Used only when services.semaphore.workspaces is declared.
    algorithm: random_hex_32
  pool_runner_token:
    description: Secret the token of every pool runner's Semaphore runner derives from as the HMAC-SHA256 of the runner's queue name; the deploy seeds one
      runner row per pool runner in the pool project with its derived token, and svc-runner writes the same token into a 0400 file of that runner's instance
      directory. Used only when services.semaphore.pool is declared.
    algorithm: random_hex_32
  export_s3_access_key:
    description: Access key of the SeaweedFS identity export, which holds Read, Write and List on the bucket exports only; web-svc-seaweedfs renders it into
      s3.json and the deploy writes it with its secret to platform/data/export/s3 in OpenBao. Used only when services.semaphore.workspaces is declared.
    algorithm: random_hex_16
  export_s3_secret_key:
    description: Secret key of the SeaweedFS identity export, written beside its access key to platform/data/export/s3, where only the policy export-shared
      reads it. Used only when services.semaphore.workspaces is declared.
    algorithm: alphanumeric
  oidc_client_secret:
    description: Client secret of Semaphore's own confidential Keycloak client semaphore-web, rendered into the realm import and into Semaphore's OIDC provider.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  route53_access_key_id:
    description: Access key id of the AWS identity that creates the per-workspace IAM users of the route53 DNS flavor. The deploy writes it with its secret to
      platform/data/workspaces/route53 in OpenBao. Empty means the live route53 checks do not run.
    algorithm: plain
    validation: ^.*$
  route53_secret_access_key:
    description: Secret access key of that AWS identity, written beside its id to platform/data/workspaces/route53. Empty means the live route53 checks do not
      run.
    algorithm: plain
    validation: ^.*$
  cloudflare_zone_tokens:
    description: JSON object from each Cloudflare zone of the cloudflare DNS flavor to its zone-scoped API token, its keys the zone pool in placement order; no
      two zones may share a token. The deploy writes each token to platform/data/provision/cloudflare/<zone> in OpenBao. Empty means the live cloudflare checks
      do not run.
    algorithm: plain
    validation: ^.*$
  cloudflare_zones_token:
    description: Cloudflare API token of the zone ws-<id> templates, with the right to create, read and delete zones in the one account of
      cloudflare_zones_account_id and nothing else. The deploy writes it with that account id from stdin to platform/data/provision/cloudflare-zones in OpenBao,
      which only the provision role of a workspace reads; the store never holds it. Empty means the deploy writes nothing there and the live zone checks do not
      run.
    algorithm: plain
    validation: ^.*$
  cloudflare_zones_account_id:
    description: Id of the Cloudflare account the zone ws-<id> templates create the customer zones in, written beside cloudflare_zones_token. Empty means the
      deploy writes nothing to platform/data/provision/cloudflare-zones and the live zone checks do not run.
    algorithm: plain
    validation: ^([0-9a-f]{32})?$
  scs_test_application_credential_id:
    description: Id of a restricted OpenStack application credential of a disposable SCS test project, in the region the scs catalog offers. The Playwright spec
      writes it as a customer's credential to tenant/data/ws-<id>-provision/providers/scs. Empty means the live scs customer-credential check does not run.
    algorithm: plain
    validation: ^.*$
  scs_test_application_credential_secret:
    description: Secret of that application credential, written beside its id. Empty means the live scs customer-credential check does not run.
    algorithm: plain
    validation: ^.*$
