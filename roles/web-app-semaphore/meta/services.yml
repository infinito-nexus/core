---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-required - Semaphore stores all state in PostgreSQL and clones repos to ephemeral tmp; it has no uploads/media/attachment surface that needs object storage.
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
  oidc:
    clients:
      web: semaphore-web
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 240
      height: 240
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"
# nocheck: playwright-service-flag, semaphore-contract  self-provider: this entry is the Semaphore container itself, so enabled stays its container flag and Semaphore never pauses itself
semaphore:
  # nocheck: single-replica OSS semaphore is single-instance (HA node registry, schedule dedup and orphan cleaner are pro_impl stubs returning nil); every replica also re-runs `semaphore setup` + db.Migrate on start, and the migration loser deletes the winner's ledger row, poisoning the schema permanently
  replicas: 1
  healthcheck:
    flavor: wget
    path: api/ping
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  control: false
  status: started
  cpus: 1.0
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 1024
  min_storage: 530MB
  image: semaphoreui/semaphore
  version: "v2.20.24"
  backup:
    stop_required: false
  name: semaphore
  ports:
    internal:
      http: 3000
    local:
      http: 8086
  run_after:
    - svc-db-postgres
    - svc-db-openldap
    - web-app-keycloak
    - web-app-matomo
    - web-app-gitea
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-semaphore', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-semaphore', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-semaphore', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-semaphore', '2fa') }}"
        enforced: true
  workspaces:
    private_targets: []
    invite_client_id: ""
    export:
      owner_min_age_days: 7
    dns:
      flavor: knot
      zone: "ws.{{ DOMAIN_PRIMARY }}" # nocheck: domain-spot  delegated subzone with no vhost
      record_limit: 0
      zone_probe: ""
    catalog:
      hetzner: {}
      ionos: {}
      scs: {}
      proxmox:
        cloud:
          sizes:
            demo: { vcpus: 1, memory_mib: 2048, disk_gib: 20 }
          regions:
            pve:
              host: "{{ groups.get('web-app-proxmox', []) | first | default('') }}"
              node: pve
              storage: local-lvm
              bridge: vmbr0
              kvm: true
              templates: { kvm: 9000, emulated: 9001 }
            pve-emulated:
              host: "{{ groups.get('web-app-proxmox', []) | first | default('') }}"
              node: pve
              storage: local-lvm
              bridge: vmbr0
              kvm: false
              templates: { kvm: 9000, emulated: 9001 }
      incus:
        demo:
          image: "images:debian/13/cloud"
          sizes:
            demo: { vcpus: 1, memory_mib: 2048, disk_gib: 20 }
          regions:
            default: { host: "{{ groups.get('svc-virt-incus', []) | first | default('') }}", pool: agents }
        cloud:
          image: "images:debian/13/cloud"
          sizes:
            demo: { vcpus: 1, memory_mib: 2048, disk_gib: 20 }
          regions:
            default: { host: "{{ groups.get('svc-virt-incus', []) | first | default('') }}", pool: agents }

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: playwright-service-flag  Gitea only hosts the inventory repository the deploy template clones; Semaphore renders nothing differently with it
gitea:
  bond: 0.5
  enabled: "{{ 'web-app-gitea' in group_names }}"
  shared: "{{ 'web-app-gitea' in group_names }}"

# nocheck: playwright-service-flag  OpenBao holds the secrets of the Workspaces, Provision and Export projects; the workspace specs gate on SEMAPHORE_WORKSPACES_ENABLED and read the OpenBao values the env renders beside it
openbao:
  bond: 0.5
  enabled: "{{ 'web-app-openbao' in group_names }}"
  shared: "{{ 'web-app-openbao' in group_names }}"

# nocheck: shared, dynamic-flag  the runner is this role's own container, always on beside Semaphore and never a provider of other roles
# nocheck: playwright-service-flag, image-healthcheck  the runner opens no port; it polls the server, which records each poll as the runner's touch time
task-runner:
  # nocheck: single-replica  the runner signs in with the one runner token the deploy seeds; a second replica would poll under the same identity
  replicas: 1
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  custom: true
  name: semaphore-runner
  opentofu_version: "1.13.9"
  opentofu_sha256_amd64: b34b327cc1ef07178207b6f2cd1f5276537d3e5b7be316500f6dac50d4c0a857
  opentofu_url_amd64: &semaphore_opentofu_url_amd64 "https://github.com/opentofu/opentofu/releases/download/v{version}/tofu_{version}_linux_amd64.tar.gz"
  opentofu_sha256_arm64: 5dc196dde75b667e4806d358310ec96742774cd0993c54c1237efee5644b69b8
  opentofu_url_arm64: &semaphore_opentofu_url_arm64 "https://github.com/opentofu/opentofu/releases/download/v{version}/tofu_{version}_linux_arm64.tar.gz"
  opentofu_platforms:
    - linux_amd64
    - linux_arm64
  age_version: "1.3.2"
  age_sha256_amd64: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  age_url_amd64: &semaphore_age_url_amd64 "https://github.com/FiloSottile/age/releases/download/v{version}/age-v{version}-linux-amd64.tar.gz"
  age_sha256_arm64: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
  age_url_arm64: &semaphore_age_url_arm64 "https://github.com/FiloSottile/age/releases/download/v{version}/age-v{version}-linux-arm64.tar.gz"
  keepassxc_version: "2.8.0"
  keepassxc_sha256_amd64: b52889fd627ae7a1c609b91b2526ccd5d847ec6707ac6eb634553186dee4f705
  keepassxc_url_amd64: &semaphore_keepassxc_url_amd64 "https://github.com/keepassxreboot/keepassxc/releases/download/{version}/KeePassXC-{version}-x86_64.AppImage"
  keepassxc_sha256_arm64: fec5bb7cd0a5da240018014e6377fc47b711d99e00efba310cec1d210c01c940
  keepassxc_url_arm64: &semaphore_keepassxc_url_arm64 "https://github.com/keepassxreboot/keepassxc/releases/download/{version}/KeePassXC-{version}-aarch64.AppImage"
  update:
    - key: opentofu_version
      type: git_tags
      repository: https://github.com/opentofu/opentofu.git
      match: "v"
      strip: true
      checksum_key: opentofu_sha256_amd64
      checksum_url: *semaphore_opentofu_url_amd64
    - key: opentofu_version
      type: git_tags
      repository: https://github.com/opentofu/opentofu.git
      match: "v"
      strip: true
      checksum_key: opentofu_sha256_arm64
      checksum_url: *semaphore_opentofu_url_arm64
    - key: age_version
      type: git_tags
      repository: https://github.com/FiloSottile/age.git
      match: "v"
      strip: true
      checksum_key: age_sha256_amd64
      checksum_url: *semaphore_age_url_amd64
    - key: age_version
      type: git_tags
      repository: https://github.com/FiloSottile/age.git
      match: "v"
      strip: true
      checksum_key: age_sha256_arm64
      checksum_url: *semaphore_age_url_arm64
    - key: keepassxc_version
      type: git_tags
      repository: https://github.com/keepassxreboot/keepassxc.git
      checksum_key: keepassxc_sha256_amd64
      checksum_url: *semaphore_keepassxc_url_amd64
    - key: keepassxc_version
      type: git_tags
      repository: https://github.com/keepassxreboot/keepassxc.git
      checksum_key: keepassxc_sha256_arm64
      checksum_url: *semaphore_keepassxc_url_arm64
  min_storage: 6GB
  cpus: 0.5
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512

# nocheck: shared, dynamic-flag  the runner of the deploy project, on whenever services.semaphore.deploy is declared; never a provider of other roles
# nocheck: playwright-service-flag, image-healthcheck  the runner opens no port and shares the image of task-runner
deploy-runner:
  # nocheck: single-replica  the runner signs in with the one runner token the deploy seeds for the deploy project
  replicas: 1
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: "{{ 'deploy' in lookup('config', 'web-app-semaphore', 'services.semaphore') }}"
  custom: true
  name: semaphore-runner-deploy
  min_storage: 1GB
  cpus: 0.5
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512

# nocheck: shared, dynamic-flag  the runner of the Workspaces project, on whenever services.semaphore.workspaces is declared beside deploy; never a provider of other roles
# nocheck: playwright-service-flag, image-healthcheck  the runner opens no port and shares the image of task-runner
workspaces-runner:
  # nocheck: single-replica  the runner signs in with the one runner token the deploy seeds for the Workspaces project
  replicas: 1
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: "{{ 'deploy' in lookup('config', 'web-app-semaphore', 'services.semaphore') and 'workspaces' in lookup('config', 'web-app-semaphore', 'services.semaphore')
    }}"
  custom: true
  name: semaphore-runner-workspaces
  min_storage: 1GB
  cpus: 0.5
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512

# nocheck: shared, dynamic-flag  the runner of the Provision project, on whenever services.semaphore.workspaces is declared beside deploy; never a provider of other roles
# nocheck: playwright-service-flag, image-healthcheck  the runner opens no port and shares the image of task-runner
provision-runner:
  # nocheck: single-replica  the runner signs in with the one runner token the deploy seeds for the Provision project
  replicas: 1
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: "{{ 'deploy' in lookup('config', 'web-app-semaphore', 'services.semaphore') and 'workspaces' in lookup('config', 'web-app-semaphore', 'services.semaphore')
    }}"
  custom: true
  name: semaphore-runner-provision
  min_storage: 1GB
  cpus: 0.5
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512

# nocheck: shared, dynamic-flag  the runner of the Export project, on whenever services.semaphore.workspaces is declared beside deploy; never a provider of other roles
# nocheck: playwright-service-flag, image-healthcheck  the runner opens no port and shares the image of task-runner
export-runner:
  # nocheck: single-replica  the runner signs in with the one runner token the deploy seeds for the Export project
  replicas: 1
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: "{{ 'deploy' in lookup('config', 'web-app-semaphore', 'services.semaphore') and 'workspaces' in lookup('config', 'web-app-semaphore', 'services.semaphore')
    }}"
  custom: true
  name: semaphore-runner-export
  min_storage: 1GB
  cpus: 0.5
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512

egress:
  image: ubuntu/squid
  version: "6.6-24.04_beta"
  name: semaphore-egress
  ports:
    internal:
      http: 3128
  healthcheck:
    test:
      - "CMD"
      - "squid"
      - "-k"
      - "check"
  min_storage: 200MB
  cpus: 0.25
  mem_reservation: 64m
  mem_limit: 256m
  pids_limit: 256

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  flush: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
