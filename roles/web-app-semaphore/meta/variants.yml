---
- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: true
    design:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    ldap:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    postgres:
      shared: true
    prometheus:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    tor:
      enabled: true
    gitea:
      enabled: true
      shared: true
    openbao:
      enabled: true
      shared: true
    lam: # nocheck: variants-services-match
      enabled: true
      shared: true
    semaphore:
      deploy:
        repository:
          url: >-
            ssh://git@{{ lookup('domain', 'web-app-gitea') }}:{{ lookup('config', 'web-app-gitea', 'services.gitea.ports.public.ssh')
            }}/{{ lookup('users', 'platform_administrator').username }}/target-inventory.git
          branch: main
          key: "{{ lookup('config', 'web-app-semaphore', 'secrets.credentials.deploy_ssh_key') }}"
        vault_password: "VeryUnsafeTargetInventoryPassword!1"
      workspaces:
        private_targets:
          - "172.30.0.0/16"
        invite_client_id: workspace-store-fixture

- services:
    semaphore:
