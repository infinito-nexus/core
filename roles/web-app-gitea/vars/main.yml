---
application_id: "web-app-gitea"
entity_name: "{{ application_id | entity_name }}"

GITEA_LDAP_SOURCE: "{{ lookup('form_values', application_id, 'ldap_source') }}"
GITEA_LDAP_SOURCE_NAME: "LDAP"
GITEA_LDAP_SOURCE_TYPE: "LDAP (via BindDN)"
GITEA_LDAP_AUTH_ARGS:
  - '--name "{{ GITEA_LDAP_SOURCE_NAME }}"'
  - '--host "{{ GITEA_LDAP_SOURCE.host }}"'
  - "--port {{ GITEA_LDAP_SOURCE.port }}"
  - '--security-protocol "{{ GITEA_LDAP_SOURCE.security_protocol }}"'
  - '--bind-dn "{{ GITEA_LDAP_SOURCE.bind_dn }}"'
  - '--user-search-base "{{ GITEA_LDAP_SOURCE.user_base }}"'
  - '--user-filter "{{ GITEA_LDAP_SOURCE.filter }}"'
  - '--admin-filter "{{ GITEA_LDAP_SOURCE.admin_filter }}"'
  - '--restricted-filter "{{ GITEA_LDAP_SOURCE.restricted_filter }}"'
  - '--username-attribute "{{ GITEA_LDAP_SOURCE.attribute_username }}"'
  - '--firstname-attribute "{{ GITEA_LDAP_SOURCE.attribute_name }}"'
  - '--surname-attribute "{{ GITEA_LDAP_SOURCE.attribute_surname }}"'
  - '--email-attribute "{{ GITEA_LDAP_SOURCE.attribute_mail }}"'
  - '--public-ssh-key-attribute "{{ GITEA_LDAP_SOURCE.attribute_ssh_public_key }}"'
  - '--avatar-attribute "{{ GITEA_LDAP_SOURCE.attribute_avatar }}"'
  - '{{ "--synchronize-users" if GITEA_LDAP_SOURCE.is_sync_enabled | bool else "--synchronize-users=false" }}'
GITEA_OAUTH_SOURCE: "{{ lookup('form_values', application_id, 'oauth_source') }}"
GITEA_OIDC_SOURCE_NAME: "SSO Login"
GITEA_OIDC_CLIENT_SECRET: "{{ lookup('config', application_id, 'secrets.credentials.oidc_client_secret') }}"
GITEA_OIDC_AUTH_ARGS:
  - "--provider {{ GITEA_OAUTH_SOURCE.oauth2_provider }}"
  - '--name "{{ GITEA_OIDC_SOURCE_NAME }}"'
  - '--key "{{ GITEA_OAUTH_SOURCE.oauth2_key }}"'
  - '--secret "$GITEA_OIDC_CLIENT_SECRET"'
  - '--auto-discover-url "{{ GITEA_OAUTH_SOURCE.open_id_connect_auto_discovery_url }}"'
  - '--scopes "{{ GITEA_OAUTH_SOURCE.oauth2_scopes }}"'
  - '--group-claim-name "{{ GITEA_OAUTH_SOURCE.oauth2_group_claim_name }}"'
  - '--admin-group "{{ GITEA_OAUTH_SOURCE.oauth2_admin_group }}"'
  - '--restricted-group "{{ GITEA_OAUTH_SOURCE.oauth2_restricted_group }}"'
GITEA_CONTAINER: "{{ lookup('config', application_id, 'services.gitea.name') }}"
GITEA_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, entity_name) }}"
GITEA_USER: "git"
GITEA_CONFIG: "/data/gitea/conf/app.ini"
GITEA_LOOPBACK_VERSION_URL: "http://127.0.0.1:{{ lookup('config', application_id, 'services.gitea.ports.internal.http') }}/api/v1/version"

GITEA_IMAGE: "{{ lookup('config', application_id, 'services.gitea.image') }}"
GITEA_VERSION: "{{ lookup('config', application_id, 'services.gitea.version') }}"
GITEA_BUILDER_IMAGE: "{{ lookup('config', application_id, 'services.gitea.builder_image') }}"
GITEA_BUILDER_VERSION: "{{ lookup('config', application_id, 'services.gitea.builder_version') }}"
GITEA_SOURCE_URL: "{{ lookup('config', application_id, 'services.gitea.source_url') | replace('{version}', GITEA_VERSION) }}"
GITEA_SOURCE_SHA256: "{{ lookup('config', application_id, 'services.gitea.source_sha256') }}"
GITEA_BUILD_TAGS: "bindata timetzdata"
GITEA_BINARY: "/app/gitea/gitea"
GITEA_PATCH_DIR: "patch"
GITEA_PATCH_FILES:
  - "oauth2/redirect-uri-public-url.patch"
  - "oauth2/account-linking-by-name.patch"
GITEA_PATCH_DIR_HOST_ABS: "{{ [lookup('container', application_id, 'directories.instance'), GITEA_PATCH_DIR] | path_join }}"

GITEA_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
GITEA_DESIGN_DIR: "{{ [lookup('container', application_id, 'directories.config'), 'design'] | path_join }}"
GITEA_THEME_DIR: "/data/gitea/public/assets/css"
GITEA_THEMES:
  auto: corporate-auto
  light: corporate-light
  dark: corporate-dark
GITEA_THEMES_COLORBLIND:
  - gitea-auto-protanopia-deuteranopia
  - gitea-auto-tritanopia
  - gitea-light-protanopia-deuteranopia
  - gitea-light-tritanopia
  - gitea-dark-protanopia-deuteranopia
  - gitea-dark-tritanopia
GITEA_THEMES_OFFERED: "{{ GITEA_THEMES.values() | list + GITEA_THEMES_COLORBLIND }}"

GITEA_REDIS_ENABLED: "{{ lookup('config', application_id, 'services.redis.enabled') }}"
GITEA_REDIS_ADDRESS: "{{ lookup('engine', 'redis', application_id, 'host') }}:{{ lookup('engine', 'redis', application_id, 'port') }}"
GITEA_REDIS_PASSWORD: "{{ lookup('engine', 'redis', application_id, 'password') }}"

GITEA_INTERNAL_API_URL: "{{ lookup('container_url', application_id, 'gitea') }}/api/v1"
GITEA_ADMIN_BASIC_AUTH: "{{ lookup('users', 'platform_administrator').username ~ ':' ~ lookup('users', 'platform_administrator').password }}"

GITEA_WORKSPACES_ENABLED: "{{ lookup('config', application_id, 'services.gitea.workspaces.enabled') | bool }}"
GITEA_WORKSPACES_ORGANIZATION: "{{ lookup('config', application_id, 'services.gitea.workspaces.organization') }}"
GITEA_WORKSPACES_STORE_USERNAME: "{{ lookup('config', application_id, 'services.gitea.workspaces.store.username') }}"
GITEA_WORKSPACES_STORE_EMAIL: "{{ lookup('config', application_id, 'services.gitea.workspaces.store.email') }}"
GITEA_WORKSPACES_STORE_SCOPES: "{{ lookup('config', application_id, 'services.gitea.workspaces.store.scopes') }}"
GITEA_WORKSPACES_STORE_TOKEN_PREFIX: "{{ lookup('config', application_id, 'services.gitea.workspaces.store.token_prefix') }}"
GITEA_WORKSPACES_ORGANIZATION_BODY:
  username: "{{ GITEA_WORKSPACES_ORGANIZATION }}"
  visibility: private
  repo_admin_change_team_access: false
GITEA_WORKSPACES_STORE_BODY:
  login_name: "{{ GITEA_WORKSPACES_STORE_USERNAME }}"
  source_id: 0
  admin: false
  max_repo_creation: 0

GITEA_MCP_ENABLED: "{{ lookup('config', application_id, 'services.giteamcp.enabled') | bool }}"
GITEA_MCP_SERVICE_KEY: "{{ lookup('config', application_id, 'mcp.endpoint.service_key') }}"
GITEA_MCP_CONTAINER: "{{ lookup('config', application_id, 'services.giteamcp.name') }}"
GITEA_MCP_PORT: "{{ lookup('config', application_id, 'services.giteamcp.ports.internal.http') }}"
GITEA_MCP_SIDECAR_SERVICE_KEY: giteamcpupstream
GITEA_MCP_UPSTREAM_NETWORK: "{{ lookup('config', application_id, 'mcp.adapter.upstream_network') }}"
GITEA_MCP_SIDECAR_CONTAINER: "{{ lookup('config', application_id, 'services.giteamcpupstream.name') }}"
GITEA_MCP_SIDECAR_PORT: "{{ lookup('config', application_id, 'services.giteamcpupstream.ports.internal.http') }}"
GITEA_MCP_SIDECAR_URL: "http://{{ GITEA_MCP_SIDECAR_SERVICE_KEY }}:{{ GITEA_MCP_SIDECAR_PORT }}/mcp"
GITEA_MCP_INSTANCE_DIR: "{{ [lookup('container', application_id, 'directories.instance'), 'mcp'] | path_join }}"
GITEA_MCP_BEARER: "{{ lookup('config', application_id, 'secrets.credentials.mcp_bearer') }}"
GITEA_MCP_CONTRACT:
  upstream_kind: mcp
  provider: "{{ application_id }}"
  upstream_url: "{{ GITEA_MCP_SIDECAR_URL }}"
  auth_subject: "{{ lookup('config', application_id, 'mcp.auth_subject') }}"
  mutating_tools_enabled: "{{ lookup('config', application_id, 'mcp.tools.mutating_tools_enabled') | bool }}"
  tools: "{{ lookup('file', 'mcp/tools.json') | from_json }}"
  limits: "{{ lookup('config', application_id, 'mcp.limits') }}"
  schema_sha256: "{{ lookup('config', application_id, 'mcp.tools.schema_sha256') }}"
GITEA_MCP_UPSTREAM_URL: "{{ lookup('container_url', application_id, 'gitea') }}"
GITEA_MCP_TOKEN_NAME: "gitea-mcp"
GITEA_MCP_TOKEN_SCOPES: "read:repository,read:issue,read:user,read:organization,read:notification"
GITEA_MCP_ACCOUNT: "{{ lookup('users', 'mcp-web-app-gitea') }}"
GITEA_MCP_USERNAME: "{{ GITEA_MCP_ACCOUNT.username }}"
GITEA_MCP_USER_EMAIL: "{{ GITEA_MCP_ACCOUNT.email }}"
GITEA_MCP_USER_PASSWORD: "{{ GITEA_MCP_ACCOUNT.password }}"
GITEA_MCP_TOOL_SCOPES: "user,repository,issue,pull_request,search,file,branch,tag,commit,release"
GITEA_MCP_COMMAND:
  - "/app/gitea-mcp" # nocheck: literal-path  image ships no ENTRYPOINT, so command must carry the binary
  - "-t"
  - "http"
  - "--port"
  - "{{ GITEA_MCP_SIDECAR_PORT | string }}"
  - "-r"
GITEA_MCP_INITIALIZE_PAYLOAD:
  jsonrpc: "2.0"
  id: 1
  method: initialize
  params:
    protocolVersion: "2025-03-26"
    capabilities: {}
    clientInfo:
      name: infinito-nexus
      version: "1"

GITEA_OIDC_ENABLED: "{{ lookup('config', application_id, 'services.gitea.login.method.sso.enabled') | bool }}"
GITEA_OAUTH2_USERNAME_SOURCES:
  sub: userid
  nickname: nickname
  preferred_username: preferred_username # nocheck: oidc-claim-name-spot
  email: email
GITEA_LDAP_ENABLED: "{{ lookup('config', application_id, 'services.ldap.enabled') }}"
GITEA_IAM_ENABLED: "{{ (GITEA_OIDC_ENABLED | bool) or ( GITEA_LDAP_ENABLED | bool ) }}"

GITEA_LOGIN_LDAP: "{{ lookup('config', application_id, 'services.gitea.login.method.ldap.enabled') | bool }}"
GITEA_LOGIN_NATIVE: "{{ lookup('config', application_id, 'services.gitea.login.method.native.enabled') | bool }}"
GITEA_LOGIN_2FA: "{{ lookup('config', application_id, 'services.gitea.login.method.2fa.enabled') | bool }}"
GITEA_LOGIN_2FA_ENFORCED: "{{ GITEA_LOGIN_2FA | bool and lookup('config', application_id, 'services.gitea.login.method.2fa.enforced') | bool }}"
GITEA_LOGIN_PASSKEY: "{{ lookup('config', application_id, 'services.gitea.login.method.passkey.enabled') | bool }}"
GITEA_LOGIN_OPENID2: "{{ lookup('config', application_id, 'services.gitea.login.method.openid2.enabled') | bool }}"
GITEA_LOGIN_REGISTRATION: "{{ lookup('config', application_id, 'services.gitea.login.method.registration.enabled') | bool }}"
GITEA_LOGIN_FORM: "{{ GITEA_LOGIN_NATIVE | bool or GITEA_LOGIN_LDAP | bool }}"
