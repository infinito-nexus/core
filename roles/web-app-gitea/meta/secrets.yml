---
credentials:
  native_metrics_token:
    description: Bearer token authorizing scrape requests to Gitea's /metrics endpoint.
    algorithm: token
    validation: non_empty_string
  mcp_bearer:
    description: "Bearer an MCP client must present to this role's adapter instance. Distinct from the Gitea access token the adapter presents upstream: gitea-mcp
      answers initialize and tools/list to anyone, so the adapter is what authenticates the caller."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
