---
# nocheck: seaweedfs-playwright — Gitea uses S3 for storage, but its UI login is not automatable here (oauth2-proxy + OIDC account-link / native login both fail; personas are blocked), so a login-dependent storage check cannot run
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
# nocheck: dynamic-flag
# nocheck: playwright-service-flag  carries the managed-field lock of meta/forms.yml on every page; no spec gates on it
javascript:
  bond: 1
  enabled: true
  shared: true
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oidc:
    clients:
      web: gitea-web
  oauth2:
    origin:
      host: gitea
      port: "{{ lookup('config', 'web-app-gitea', 'services.gitea.ports.internal.http') }}"
    acl:
      blacklist:
        - /user/login
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
# nocheck: playwright-service-flag — self-provider
gitea:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  provides: gitea
  image: gitea/gitea
  version: 28.2.0
  custom: true
  builder_image: golang
  builder_version: 1.27.3-alpine
  source_url: &gitea_source_url "https://dl.gitea.com/gitea/{version}/gitea-src-{version}.tar.gz"
  source_sha256: b8ad80f8a79ea42fa5cf52bdc3d5fd3457bb6abd6bd57cfcfab6a5ad4f31c3dc
  update:
    - type: registry_tags
      image: gitea/gitea
      checksum_key: source_sha256
      checksum_url: *gitea_source_url
    - key: builder_version
      type: registry_tags
      image: golang
  replicas: 1 # nocheck: single-replica  single-writer app state on swarm-shared NFS; concurrent multi-node writers corrupt app.ini
  min_storage: 270MB
  backup:
    stop_required: false
  name: gitea
  cpus: 1.0
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
  healthcheck:
    flavor: curl
  configuration:
    oauth2_client:
      enable_auto_registration: true
      account_linking: auto
      username: "{{ OIDC.ATTRIBUTES.USERNAME }}"
    repository:
      enable_push_create_user: true
      default_private: last
      default_push_create_private: true
    git:
      gc_args: "--prune=1.day.ago"
      timeout:
        gc: 1800
        mirror: 3600
    cron:
      git_gc_repos:
        enabled: true
        schedule: "@every 72h"
        timeout: 60m
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-gitea', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-gitea', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-gitea', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-gitea', '2fa') }}"
        enforced: false
      passkey:
        enabled: "{{ lookup('login_method', 'web-app-gitea', 'passkey') }}"
      openid2:
        enabled: "{{ lookup('login_method', 'web-app-gitea', 'openid2') }}"
      registration:
        enabled: "{{ lookup('login_method', 'web-app-gitea', 'registration') }}"
  auth:
    ldap:
      names: [LDAP]
      host: "{{ LDAP.SERVER.DOMAIN }}"
      port: "{{ LDAP.SERVER.PORT }}"
      security_protocol: "{{ LDAP.SERVER.SECURITY | trim or 'unencrypted' }}"
      bind_dn: "{{ LDAP.DN.ADMINISTRATOR.DATA }}"
      user_base: "{{ LDAP.DN.OU.USERS }}"
      filter: "(&(objectClass=inetOrgPerson)({{ LDAP.USER.ATTRIBUTES.ID }}=%s))"
      admin_filter: "({{ LDAP.USER.ATTRIBUTES.MEMBER_OF }}=cn=web-app-gitea-administrator,{{ LDAP.DN.OU.ROLES }})"
      restricted_filter: "({{ LDAP.USER.ATTRIBUTES.MEMBER_OF }}=cn=web-app-gitea-restricted,{{ LDAP.DN.OU.ROLES }})"
      attribute_username: "{{ LDAP.USER.ATTRIBUTES.ID }}"
      attribute_name: "{{ LDAP.USER.ATTRIBUTES.FIRSTNAME }}"
      attribute_surname: "{{ LDAP.USER.ATTRIBUTES.SURNAME }}"
      attribute_mail: "{{ LDAP.USER.ATTRIBUTES.MAIL }}"
      attribute_ssh_public_key: "{{ LDAP.USER.ATTRIBUTES.SSH_PUBLIC_KEY }}"
      attribute_avatar: "{{ LDAP.USER.ATTRIBUTES.PHOTO }}"
      is_sync_enabled: true
    oauth:
      names: [SSO Login]
      provider: openidConnect
      discovery_url: "{{ OIDC.CLIENT.DISCOVERY_DOCUMENT }}"
      scopes: "openid profile email {{ RBAC.GROUP.CLAIM }}"
      group_claim_name: "{{ RBAC.GROUP.CLAIM }}"
      admin_group: "/{{ lookup('rbac_group_path', application_id='web-app-gitea', role='administrator') }}"
      restricted_group: "/{{ lookup('rbac_group_path', application_id='web-app-gitea', role='restricted') }}"
  ports:
    internal:
      http: 3000
      ssh: 22
    local:
      sso: 16488
      sso_onion: 16529
      http: 8002
    public:
      ssh: 2201
    onion:
      # nocheck: onion-flag  git over the onion runs on the HTTP transport the proxy already serves on port 80; a second sshd on the onion would need its own host key policy
      ssh: false
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  garbage_collector:
    type: script
    setting: "[cron.git_gc_repos] and [git] GC_ARGS in templates/env.j2, fed by configuration.cron and configuration.git"
    minutes:
      routine: 1440
      pressure: 120
  workspaces:
    enabled: false
    organization: workspaces
    store:
      username: store
      email: "store@{{ DOMAIN_PRIMARY }}"
      scopes: "write:organization,write:repository,read:user"
      token_prefix: "store-"
# nocheck: playwright-service-flag
# nocheck: dockerfile-custom  the Dockerfile is owned by svc-ai-mcp-adapter and staged per instance, so every adapter-backed provider shares one audited build
# nocheck: dynamic-flag  the sidecar tracks this role's own mcp flag, not another role's presence; a group_names expression would decide its exposure from an unrelated deployment
giteamcp:
  enabled: "{{ lookup('config', 'web-app-gitea', 'mcp.enabled') | bool }}"
  shared: false
  image: python
  # nocheck: docker-version  base of the self-built stdlib adapter, not the served application
  version: "3.13.15-slim"
  custom: true
  name: giteamcp
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 24m
  pids_limit: 64
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 8080
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "3.13.15-slim"
        until: 2026-11-30
# nocheck: playwright-service-flag
# nocheck: dynamic-flag  the vendor server exists only behind the adapter, so it tracks this role's own mcp flag rather than another role's presence
giteamcpupstream:
  enabled: "{{ lookup('config', 'web-app-gitea', 'mcp.enabled') | bool }}"
  shared: false
  image: docker.gitea.com/gitea-mcp-server
  version: "1.13.0"
  update:
    type: registry_tags
    image: docker.gitea.com/gitea-mcp-server
  name: gitea-mcp
  healthcheck:
    test:
      - "CMD"
      - "/app/gitea-mcp"
      - "-healthcheck"
      - "--port"
      - "{{ lookup('config', 'web-app-gitea', 'services.giteamcpupstream.ports.internal.http') | string }}"
  cpus: 0.25
  mem_reservation: 0.1g
  mem_limit: 0.25g
  pids_limit: 256
  ports:
    internal:
      http: 8080
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
redis:
  bond: 1
  backup:
    disabled: true
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-redis' in group_names }}"
  cpus: 0.25
  mem_reservation: 0.2g
  mem_limit: 0.3g
  pids_limit: 512
# nocheck: playwright-service-flag — object store, no Playwright surface
minio:
  enabled: false # nocheck: dynamic-flag
  shared: false # nocheck: dynamic-flag
# nocheck: playwright-service-flag — object store; storage check needs a UI login, but Gitea's personas are blocked (PERSONA_ADMINISTRATOR_BLOCKED/PERSONA_BIBER_BLOCKED), so it has no automatable Playwright login surface
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "{{ SOFTWARE_NAME }} Code Hub"
  slots:
    logo:
      width: 512
      height: 512
    favicon:
      width: 180
      height: 180
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  native_metrics:
    enabled: true
    port: 3000

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, dynamic-flag, semaphore-contract  control plane: it holds the inventory repository Semaphore deploys from, so a run that paused it would cut off the source of every later run
semaphore:
  enabled: false
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
