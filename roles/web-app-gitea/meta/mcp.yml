---
classification: adapter_server
direction: server
source_url: https://pkg.go.dev/gitea.com/gitea/gitea-mcp
minimum_version: "1.24"
transport: streamable_http
exposure: internal
auth: bearer_token
auth_subject: service_account
implementation: adapter
credential:
  owner: mcp-web-app-gitea
  source: credentials
  key: mcp_bearer
adapter:
  type: mcp_passthrough
  upstream_network: giteamcpupstream_net
  specification_path: roles/web-app-gitea/files/mcp/tools.json
  specification_sha256: sha256:d3c8199138ab47974c570ac0045925803eb31f54a2b2934f9339f0920c762ff5
endpoint:
  service_key: giteamcp
  path: /mcp
  port_key: http
limits:
  request_bytes: 65536
  response_bytes: 1048576
  timeout_seconds: 15
  concurrent_requests: 4
  page_size: 100
  result_items: 100
  stream_seconds: 300
tools:
  read_probe:
    tool: get_me
    arguments: {}
  schema_sha256: sha256:8180dd0dba6bc10b986f3500fd3da3f2b2e6b8d5c92408f0089b5b3e1667c876
  allowlist:
    - attachment_read
    - get_commit
    - get_dir_contents
    - get_file_contents
    - get_latest_release
    - get_me
    - get_release
    - get_repository_tree
    - get_tag
    - get_user_orgs
    - issue_read
    - list_branches
    - list_commits
    - list_issues
    - list_my_repos
    - list_org_repos
    - list_pull_requests
    - list_releases
    - list_tags
    - pull_request_read
    - search_issues
    - search_org_teams
    - search_repos
    - search_users
  read_only_default: true
  mutating_tools_enabled: false
