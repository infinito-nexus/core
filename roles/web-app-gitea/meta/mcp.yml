---
enabled: true
shared: true
classification: sidecar_server
direction: server
source_url: https://pkg.go.dev/gitea.com/gitea/gitea-mcp
minimum_version: "1.24"
transport: streamable_http
exposure: internal
auth: bearer_token
auth_subject: service_account
implementation: sidecar
credential:
  owner: mcp-web-app-gitea
  source: token_store
  key: web-app-gitea
allowed_consumers:
  - web-app-openwebui
  - web-app-hermes
  - web-app-openclaw
endpoint:
  service_key: giteamcp
  path: /mcp
  port_key: http
tools:
  allowlist:
    - attachment_read
    - get_commit
    - get_dir_contents
    - get_file_contents
    - get_latest_release
    - get_me
    - get_release
    - get_repository_tree
    - get_tag
    - get_user_orgs
    - issue_read
    - list_branches
    - list_commits
    - list_issues
    - list_my_repos
    - list_org_repos
    - list_pull_requests
    - list_releases
    - list_tags
    - pull_request_read
    - search_issues
    - search_org_teams
    - search_repos
    - search_users
  read_only_default: true
  mutating_tools_enabled: false
