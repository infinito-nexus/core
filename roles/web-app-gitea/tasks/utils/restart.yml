---
- name: "🔄 compose | Restart the Gitea container"
  ansible.builtin.command:
    argv:
      - container
      - restart
      - "{{ GITEA_LOCAL_CID }}"
  changed_when: true
  delegate_to: "{{ GITEA_HOST_NODE }}"
  when: IS_COMPOSE_MODE

- name: "🔄 swarm | Force an update of the Gitea service"
  ansible.builtin.command: "container service update --force {{ lookup('container_service', application_id, entity_name) }}"
  changed_when: true
  timeout: "{{ lookup('timeout', 600) | int }}"
  when: IS_SWARM_MODE

- name: "🔍 Resolve the container the restart left running"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: GITEA
    resolve_compose_cid: "{{ GITEA_CONTAINER_ADDRESS }}"

- name: "⏳ Wait until the restarted Gitea answers"
  ansible.builtin.shell: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ GITEA_LOCAL_CID | quote }}
    {{ 10 | curl(retries=0) }} -fS -o /dev/null {{ GITEA_LOOPBACK_VERSION_URL | quote }}
  delegate_to: "{{ GITEA_HOST_NODE }}"
  register: gitea_restart_ready
  changed_when: false
  until: gitea_restart_ready.rc == 0
  retries: 20
  delay: 5
