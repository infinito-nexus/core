---
- include_tasks: utils/once/flag.yml

- name: "🩹 Stage the Gitea source patches into the build context of {{ application_id }}"
  stack_host_copy:
    src: "patch/{{ item }}"
    dest: "{{ [GITEA_PATCH_DIR_HOST_ABS, item | dirname] | path_join }}/"
    mode: "0644"
  loop: "{{ GITEA_PATCH_FILES }}"
  notify:
    - compose-build
    - compose-up

- name: "🧹 Register the garbage collector of {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-ctl-cln-apps/tasks/utils/install.yml') }}"
  vars:
    garbage_collector_service_key: gitea
    garbage_collector_environment:
      GITEA_GARBAGE_COLLECTOR_MINUTES_ROUTINE: "{{ lookup('config', application_id, 'services.gitea.garbage_collector.minutes.routine') }}"
      GITEA_GARBAGE_COLLECTOR_MINUTES_PRESSURE: "{{ lookup('config', application_id, 'services.gitea.garbage_collector.minutes.pressure') }}"

- name: "🎨 Stage the corporate design overrides of {{ application_id }}"
  include_tasks: utils/design.yml
  when: GITEA_DESIGN_ENABLED | bool

- name: 🚿 Flush handlers to start the Gitea stack
  meta: flush_handlers

- name: "👔 Gitea manager-side operations (file deploys + container exec)"
  include_tasks: 01_manager_ops.yml
  when: IS_STACK_HOST | bool
