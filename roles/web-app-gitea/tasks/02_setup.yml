---
- name: ▶️ Execute OIDC Setup Routine
  include_tasks: setup/oidc.yml
  when: GITEA_OIDC_ENABLED | bool
- name: ▶️ Execute LDAP Setup Routine
  include_tasks: setup/ldap.yml
  when: GITEA_LDAP_ENABLED | bool
- name: ▶️ Execute Theme Setup Routine
  include_tasks: setup/theme.yml
  when: GITEA_DESIGN_ENABLED | bool
- name: ▶️ Execute Theme Removal Routine
  include_tasks: setup/theme_removal.yml
  when: not (GITEA_DESIGN_ENABLED | bool)
