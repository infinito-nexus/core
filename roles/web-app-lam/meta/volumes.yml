---
design_css:
  type: config
  source: "{{ [lookup('container', 'web-app-lam', 'directories.volumes'), '900_infinito.css'] | path_join }}"
  mode: "0444"
  mounts:
    - service: lam
      target: /usr/share/ldap-account-manager/style/900_infinito.css
      when: "{{ lookup('config', 'web-app-lam', 'services.design.enabled') | bool }}"
design_js:
  type: config
  source: "{{ [lookup('container', 'web-app-lam', 'directories.volumes'), '900_infinito.js'] | path_join }}"
  mode: "0444"
  mounts:
    - service: lam
      target: /usr/share/ldap-account-manager/templates/lib/900_infinito.js
      when: "{{ lookup('config', 'web-app-lam', 'services.design.enabled') | bool }}"

php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: lam
      target: /etc/php/8.4/apache2/conf.d/zz-infinito-hardening.ini
