---
# Matrix-deploy variant overrides for this role.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# `ldap` is pinned in `services.yml` (`enabled: true`, `shared: true`)
# because LDAP IS the storage backend for LAM — every variant inherits
# it, so the variant blocks below don't override it.

- services:
    docs:
      enabled: false
      shared: false
    dashboard:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    redis:
      shared: true

    design:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    docs:
      enabled: true
      shared: true
    dashboard:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false
    matomo:
      enabled: false
      shared: false
    sso:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    redis:
      shared: false

    design:
      enabled: false
      shared: false
    tor:
      enabled: true
