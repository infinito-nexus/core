---
# nocheck: garbage-collector-required  the role keeps no growing data of its own; every project's instance is the operator's to remove
showroom:
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  bond: 1
  enabled: true
  shared: true
  min_storage: "20GB"
  cpus: "0.5"
  mem_reservation: "256m"
  mem_limit: "1g"
  pids_limit: 1024
  lifecycle: pre-alpha
  bridge: showroombr0
  storage_pool:
    name: showroom
    driver: dir
  budget:
    memory: 16GiB
  projects: {}

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  the showroom runs on the host Incus daemon; pausing it would stop every customer demo server
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
