---
# nocheck: garbage-collector-required  the role keeps no growing data of its own; every project's instance is the operator's to remove
showroom:
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  bond: 1
  enabled: true
  shared: true
  min_storage: "20GB"
  cpus: "0.5"
  mem_reservation: "256m"
  mem_limit: "1g"
  pids_limit: 1024
  lifecycle: pre-alpha
  bridge: showroombr0
  storage_pool:
    name: showroom
    driver: dir
  budget:
    memory: 16GiB
  projects: {}

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
