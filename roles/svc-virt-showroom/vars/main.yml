---
application_id: "svc-virt-showroom"
system_service_id: "{{ application_id }}"

SHOWROOM_OS_FAMILIES:
  - Archlinux
  - Debian
SHOWROOM_PROJECTS: "{{ lookup('config', application_id, 'services.showroom.projects') }}"
SHOWROOM_BUDGET_MEMORY: "{{ lookup('config', application_id, 'services.showroom.budget.memory') }}"
SHOWROOM_STORAGE_POOL: "{{ lookup('config', application_id, 'services.showroom.storage_pool') }}"
SHOWROOM_BRIDGE: "{{ lookup('config', application_id, 'services.showroom.bridge') }}"
SHOWROOM_SUBNET: "{{ lookup('config', application_id, 'networks.local.subnet') }}"
SHOWROOM_CANONICAL_DOMAINS: "{{ lookup('config', application_id, 'domains.canonical') }}"
SHOWROOM_INSTANCES: "{{ SHOWROOM_PROJECTS | showroom_instances(SHOWROOM_STORAGE_POOL.name, SHOWROOM_BRIDGE) }}"
SHOWROOM_OPERATOR_USER: "{{ lookup('users', 'incus-operator').username }}"
SHOWROOM_BASTION_USER: "{{ lookup('users', 'incus-bastion').username }}"
SHOWROOM_ACCESS_USERS:
  - incus-operator
  - incus-bastion
SHOWROOM_INCUS_BIN: "{{ [DIR_BIN, 'incus'] | path_join }}"
SHOWROOM_BASTION_DROPIN: "{{ [DIR_SSHD_DROPINS, 'showroom-bastion.conf'] | path_join }}"
SHOWROOM_PRESEED:
  networks:
    - name: "{{ SHOWROOM_BRIDGE }}"
      type: bridge
      config:
        ipv4.address: "{{ lookup('subnet_gateway') }}/{{ SHOWROOM_SUBNET.split('/') | last }}"
        ipv4.nat: "true"
        ipv6.address: none
  storage_pools:
    - name: "{{ SHOWROOM_STORAGE_POOL.name }}"
      driver: "{{ SHOWROOM_STORAGE_POOL.driver }}"
