---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: openresty-vhost  web-opt-rdr-domains redirects the domain to web-svc-cdn, the stack renders no vhost for it
# nocheck: playwright-service-flag — self-provider
design:
  modes:
    host:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 128
  min_storage: "1GB"
  lifecycle: beta
  colors:
    base: "#001f3f"
  font:
    import_url: false
    type: 'system-ui, -apple-system, "Segoe UI", Roboto, "Liberation Sans", Arial, sans-serif'
  logo: assets/img/logo.png
  title: true
  bootstrap: false
  slots:
    icon:
      width: 512
      height: 512
    apple-touch-icon:
      width: 180
      height: 180
    header:
      width: 320
      height: 64
    banner:
      width: 960
      height: 160
    wordmark:
      width: 320
      height: 64
      text_only: true
# nocheck: playwright-service-flag — provider role; no consumer surface to gate
# nocheck: dynamic-flag
cdn:
  bond: 1
  enabled: true
  shared: true
# nocheck: playwright-service-flag — provider role; no consumer surface to gate
# nocheck: dynamic-flag
# nocheck: shared-provider a custom role pulled from its own repository registers the key; without it the key resolves to no role and nothing changes
cosmos:
  bond: 0.5
  enabled: true
  shared: true
# nocheck: playwright-service-flag — provider role; no consumer surface to gate
# nocheck: dynamic-flag
matomo:
  enabled: false
  shared: false
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  # nocheck: prometheus-scrape
  scrape: false

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  the role runs no container, so Semaphore has nothing to pause
  status: started
