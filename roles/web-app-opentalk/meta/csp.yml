---
flags:
  style-src-attr:
    unsafe-inline: true # nocheck: csp-unsafe  Reason: historical, TODO: re-verify it is really required and does not open attack surface
  script-src-elem:
    unsafe-inline: true # nocheck: csp-unsafe  Reason: historical, TODO: re-verify it is really required and does not open attack surface
  script-src-attr:
    unsafe-inline: true # nocheck: csp-unsafe  Reason: historical, TODO: re-verify it is really required and does not open attack surface
whitelist:
  connect-src:
    - "{{ lookup('tls', 'web-app-keycloak', 'url.base') }}"
    - "{{ lookup('domain', 'web-app-opencloud') }}"
    - "wss:"
  frame-src:
    - "{{ lookup('tls', 'web-app-keycloak', 'url.base') }}"
  media-src:
    - "blob:"
    - "*"
  worker-src:
    - "blob:"
