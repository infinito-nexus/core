---
- include_tasks: utils/once/flag.yml

- name: "🧩 Internal CDN flavor: stage frontend deps + deploy the build stack"
  when: CDN_FLAVOR == 'internal'
  block:
    - name: "📦 Stage every deployed role's frontend dependencies for the CDN"
      include_tasks: 01_assets.yml
      when: IS_STACK_HOST | bool

    - name: "🧩 Deploy the CDN stack (one-shot npm-mirror build) + front proxy"
      include_role:
        name: sys-stk-full
      vars:
        aca_origin: "* always"

- name: "🧩 Front proxy only (external CDN flavor)"
  include_role:
    name: sys-stk-front-proxy
  when: CDN_FLAVOR != 'internal'
