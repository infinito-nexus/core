---
- name: 📂 Include dependency 'sys-pip'
  include_role:
    name: sys-pip
  when: run_once_sys_pip is not defined

- name: 📦 Install and prefer the highest supported Python as default
  ansible.builtin.script: "{{ role_path }}/files/shell/install.sh"
  environment:
    SKIP_DOCKER_APT_SANITIZER: "1"
    INFINITO_PYTHON_REQUIRES: >-
      {{ lookup('file', lookup('path_absolute', 'pyproject.toml'))
         | regex_search('(?m)^requires-python\s*=\s*"([^"]+)"', '\1')
         | first }}
  become: true

- include_tasks: utils/once/flag.yml
