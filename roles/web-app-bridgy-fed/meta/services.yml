---
# nocheck: dockerfile-custom
# nocheck: dynamic-flag
# nocheck: logout
logout:
  enabled: false
  shared: false
# nocheck: dynamic-flag
# nocheck: oidc
# nocheck: sso
sso:
  enabled: false
  shared: false
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
# nocheck: dynamic-flag
# nocheck: email
# nocheck: playwright-service-flag - email silenced, no Playwright surface
email:
  enabled: false
  shared: false
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
  # nocheck: matomo-track - root serves Werkzeug's default 404 without </head>/<body>, head injection cannot anchor
  track: false
# nocheck: playwright-service-flag - design consumer, no Playwright surface (provider: web-svc-design)
# nocheck: dynamic-flag
# nocheck: design-off  Reason: flask_app serves only federation endpoints; '/' answers Werkzeug's bare 404
design:
  enabled: false
  shared: false
  # nocheck: matomo-track - same 404-without-anchors page, shared CSS <link> cannot inject
  track: false
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  ready_path: robots.txt
bridgy-fed:
  healthcheck:
    flavor: tcp
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: python
  # nocheck: docker-version  upstream's requirements.pinned.txt pins cbor2 6.1.4, which ships wheels up to cp314 and needs Rust >= 1.88 to build from source. TODO: return to 3.15-slim once the pinned upstream ref carries cbor2 >= 6.1.5 (cp315 wheels)
  version: 3.14-slim
  name: web-app-bridgy-fed
  repository: https://github.com/snarfed/bridgy-fed.git
  # nocheck: repository-version -- upstream publishes no tags, so the pin is a commit
  ref: e7c6f80e35330c249e35205ce9e181ebc24531e2
  ports:
    local:
      http: 8053
    internal:
      http: 8080
  lifecycle: beta
  min_storage: 585MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
