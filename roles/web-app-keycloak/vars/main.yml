---
application_id: "web-app-keycloak"
entity_name: "{{ application_id | entity_name }}"
domain: "{{ lookup('domain',application_id) }}"

KEYCLOAK_CONTAINER_HOSTNAME: "{{ entity_name }}"
KEYCLOAK_REALM: "{{ OIDC.CLIENT.REALM }}"
KEYCLOAK_URL: "{{ lookup('tls', application_id, 'url.origin') }}"
KEYCLOAK_REALM_URL: "{{ KEYCLOAK_URL }}/realms/{{ KEYCLOAK_REALM }}"
KEYCLOAK_DEBUG_ENABLED: "{{ MODE_DEBUG }}"
KEYCLOAK_CLIENT_ID: "{{ OIDC.CLIENT.ID }}"
KEYCLOAK_SERVER_INTERNAL_URL: "http://127.0.0.1:8080"

KEYCLOAK_RBAC_GROUP_CLAIM: "{{ RBAC.GROUP.CLAIM }}"
KEYCLOAK_RBAC_GROUP_NAME: "{{ RBAC.GROUP.NAME }}"
KEYCLOAK_RBAC_ALL_APP_IDS: "{{ lookup('deployment').groups | rbac_app_ids }}"
KEYCLOAK_RBAC_RUN_APP_IDS: "{{ lookup('deployment').running | rbac_app_ids }}"

KEYCLOAK_RBAC_WORKERS: "{{ [RESOURCE_HOST_CPUS | int // 2, 1] | max }}"
KEYCLOAK_RBAC_GROUP_LOGIC_DIGEST: "{{ lookup('file', lookup('path_absolute', 'roles/svc-db-openldap/filter_plugins/build_ldap_role_entries.py')) | hash('sha256')
  }}"
KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_PAYLOADS_FILE: "/tmp/kc_per_app_mapper_payloads.txt"
KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_TEMPLATE: >-
  {{
    (KEYCLOAK_DICTIONARY_REALM.components['org.keycloak.storage.UserStorageProvider']
      | selectattr('name','equalto', KEYCLOAK_LDAP_CMP_NAME)
      | list | first
    ).subComponents['org.keycloak.storage.ldap.mappers.LDAPStorageMapper']
    | selectattr('name','equalto','ldap-roles')
    | list | first
  }}
KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_BASE: >-
  {{
    (KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_TEMPLATE
     | dict2items
     | rejectattr('key','in',['subComponents','id','config'])
     | list | items2dict)
    | combine({
        'parentId':     ldap_cmp_id | trim,
        'providerId':   'group-ldap-mapper',
        'providerType': 'org.keycloak.storage.ldap.mappers.LDAPStorageMapper',
        'config': (KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_TEMPLATE.config
                   | dict2items
                   | rejectattr('key','equalto','groups.path.group')
                   | list | items2dict)
                  | combine({
                      'preserve.group.inheritance':            ['false'],
                      'group.name.ldap.attribute':             ['description'],
                      'drop.non.existing.groups.during.sync':  ['true'],
                    }),
      })
  }}
# One `<app_id> <mapper_name> <base64 mapper JSON> <fingerprint>` line per rbac app of the current run that this host deploys.
KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_PAYLOADS: |-
  {% for app_id in KEYCLOAK_RBAC_RUN_APP_IDS | select('in', KEYCLOAK_RBAC_ALL_APP_IDS) -%}
  {%- set mapper = KEYCLOAK_PER_APP_LDAP_ROLES_MAPPER_BASE | combine({
        'name': app_id | kc_per_app_mapper_name,
        'config': {
          'groups.ldap.filter': [app_id | kc_per_app_ldap_filter],
          'groups.path':        ['/' ~ (KEYCLOAK_RBAC_GROUP_NAME | trim('/')) ~ '/' ~ app_id],
        }
      }, recursive=True) -%}
  {%- set app = lookup('applications')[app_id] -%}
  {%- set fingerprint = {
        'mapper': mapper,
        'rbac': app.get('rbac'),
        'domains': app.get('domains'),
        'logic': KEYCLOAK_RBAC_GROUP_LOGIC_DIGEST,
      } | to_json(sort_keys=True) | hash('sha256') -%}
  {{ app_id }} {{ mapper['name'] }} {{ mapper | to_nice_json | b64encode }} {{ fingerprint }}
  {% endfor %}

KEYCLOAK_HEALTH_ENABLED: true

KEYCLOAK_REALM_IMPORT_ENABLED: "{{ lookup('config', application_id, 'services.keycloak.realm.import_enabled') }}"
KEYCLOAK_REALM_IMPORT_DIR_HOST: "{{ [lookup('container', application_id, 'directories.volumes'),'import'] | path_join }}"
KEYCLOAK_REALM_IMPORT_DIR_DOCKER: "{{ lookup('volume', 'web-app-keycloak', 'realm_import').target }}"
KEYCLOAK_REALM_IMPORT_FILE_SRC: "import/realm.json.j2"
KEYCLOAK_REALM_IMPORT_FILENAME: "realm.json"
KEYCLOAK_REALM_IMPORT_FILE_DST: "{{ [KEYCLOAK_REALM_IMPORT_DIR_HOST,KEYCLOAK_REALM_IMPORT_FILENAME] | path_join }}"
KEYCLOAK_REALM_IMPORT_FILE_DOCKER: "{{ [KEYCLOAK_REALM_IMPORT_DIR_DOCKER,KEYCLOAK_REALM_IMPORT_FILENAME] | path_join }}"
KEYCLOAK_REALM_TOTP_ENABLED: "{{ lookup('config', application_id, 'services.keycloak.realm.totp_enabled') | bool }}"

KEYCLOAK_ENV_FILE: "{{ lookup('container', application_id, 'files.env') }}"

KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME: "{{ lookup('users', 'keycloak_bootstrap').username }}"
KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: "{{ lookup('users', 'keycloak_bootstrap').password }}"

KEYCLOAK_PERMANENT_ADMIN_USERNAME: "{{ OIDC.ADMIN.USERNAME }}"
KEYCLOAK_PERMANENT_ADMIN_PASSWORD: "{{ OIDC.ADMIN.PASSWORD }}"

KEYCLOAK_CONTAINER: "{{ lookup('config', application_id, 'services.keycloak.name') }}"
KEYCLOAK_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, entity_name) }}"
KEYCLOAK_TARGET_CONTAINER: "{{ KEYCLOAK_LOCAL_CID | default(KEYCLOAK_CONTAINER_ADDRESS) }}" # nocheck: container-var-name-lookup references the consumer's container, not this role's service
KEYCLOAK_EXEC_CONTAINER: "container exec -i {{ KEYCLOAK_TARGET_CONTAINER }}" # nocheck: container-exec-resolver # nocheck: container-var-name-lookup references the consumer's container, not this role's service
KEYCLOAK_KCADM: "/opt/keycloak/bin/kcadm.sh"
KEYCLOAK_EXEC_KCADM: "{{ KEYCLOAK_EXEC_CONTAINER }} {{ KEYCLOAK_KCADM }}"
KEYCLOAK_IMAGE: "{{ lookup('config', application_id, 'services.keycloak.image') }}"
KEYCLOAK_VERSION: "{{ lookup('config', application_id, 'services.keycloak.version') }}"
KEYCLOAK_REPLICAS: "{{ groups[application_id] | length }}"
KEYCLOAK_REPLICAS_WANT: "{{ KEYCLOAK_REPLICAS }}/{{ KEYCLOAK_REPLICAS }}"
KEYCLOAK_DB_NETWORK_ARG: "{% if lookup('database', application_id, 'shared') | bool %}--network {{ lookup('database', application_id, 'network') | quote }}{% endif
  %}"

KEYCLOAK_FRONTCHANNEL_LOGOUT_URL: "{{ lookup('tls', 'web-svc-logout', 'url.base') }}"
KEYCLOAK_LOGOUT_PANEL_FILE: "{{ lookup('nginx', 'directories.configuration.lua') }}{{ application_id }}-logout-panel.js"
KEYCLOAK_LOGOUT_PANEL_ENABLED: "{{ lookup('config', application_id, 'services.javascript.enabled') | bool }}"
KEYCLOAK_REDIRECT_URIS: "{{ lookup('redirect_uris') }}"
KEYCLOAK_SAML_APPS: >-
  {{ lookup('applications') | dict2items
      | selectattr('value.services', 'defined')
      | selectattr('value.services.sso', 'defined')
      | selectattr('value.services.sso.flavor', 'defined')
      | selectattr('value.services.sso.flavor', 'equalto', 'saml')
      | map(attribute='key')
      | select('in', group_names)
      | list }}
KEYCLOAK_WEB_ORIGINS: >-
  {{ KEYCLOAK_REDIRECT_URIS
      | map('regex_replace','/\\*$','')
      | map('regex_search','^(https?://[^/]+)')
      | select('string')
      | list | unique }}
KEYCLOAK_POST_LOGOUT_URIS: "{{ (['+'] + lookup('network_urls', KEYCLOAK_FRONTCHANNEL_LOGOUT_URL ~ '*')) | join('##') }}"

KEYCLOAK_LDAP_ENABLED: "{{ lookup('config', application_id, 'services.ldap.enabled') }}"
KEYCLOAK_LDAP_SHARED: "{{ lookup('config', application_id, 'services.ldap.shared') }}"
KEYCLOAK_LDAP_CMP_NAME: "{{ LDAP.SERVER.DOMAIN }}" # Name of the LDAP User Federation component in Keycloak (as shown in UI)
KEYCLOAK_LDAP_BIND_DN: "{{ LDAP.DN.ADMINISTRATOR.DATA }}"
KEYCLOAK_LDAP_BIND_PW: "{{ LDAP.BIND_CREDENTIAL }}"
KEYCLOAK_LDAP_URL: "{{ LDAP.SERVER.URI }}"
KEYCLOAK_LDAP_CONNECTION_POOLING: "{{ lookup('config', application_id, 'services.ldap.connection_pooling') | bool }}"
KEYCLOAK_LDAP_SYNC_CHANGES_PERIOD: "{{ lookup('config', application_id, 'services.ldap.sync.period.changes') }}"
KEYCLOAK_LDAP_SYNC_FULL_PERIOD: "{{ lookup('config', application_id, 'services.ldap.sync.period.full') }}"

KEYCLOAK_LDAP_USER_OBJECT_CLASSES: >
  {{
    (
        (LDAP.USER.OBJECTS.STRUCTURAL | reject('equalto','posixAccount') | list)
        + (LDAP.USER.OBJECTS.AUXILIARY | dict2items | map(attribute='value') | list)
      ) | join(', ')
  }}

KEYCLOAK_USER_EMAILS_VERIFIED: "{{ lookup('config', application_id, 'services.keycloak.users.emails_verified') }}"

KEYCLOAK_MOODLE_ENABLED: "{{ 'web-app-moodle' in group_names }}"

KEYCLOAK_DECLARED_CLIENT_APPS: "{{ lookup('applications') | kc_declared_client_apps(lookup('deployment').groups) }}"
KEYCLOAK_DECLARED_CLIENT_IDS: "{{ lookup('applications') | kc_declared_client_ids(lookup('deployment').groups) }}"
KEYCLOAK_SAML_CLIENT_IDS: "{{ KEYCLOAK_DICTIONARY_REALM.clients | selectattr('protocol', 'equalto', 'saml') | map(attribute='clientId') | list }}"
KEYCLOAK_SETTINGS_CLIENT_IDS: "{{ ([KEYCLOAK_CLIENT_ID] + KEYCLOAK_DECLARED_CLIENT_IDS + KEYCLOAK_SAML_CLIENT_IDS) | unique | list }}"
KEYCLOAK_SETTINGS_MISSING_CLIENT_IDS: "{{ KEYCLOAK_SETTINGS_CLIENT_IDS | reject('in', KEYCLOAK_DICTIONARY_REALM.clients | map(attribute='clientId') | list) | list
  }}"
KEYCLOAK_SETTINGS_SPEC:
  clientScopes: "{{ KEYCLOAK_DICTIONARY_REALM.clientScopes }}"
  clients: "{{ KEYCLOAK_DICTIONARY_REALM.clients | selectattr('clientId', 'in', KEYCLOAK_SETTINGS_CLIENT_IDS) | list }}"
  realms:
    - realm: "{{ KEYCLOAK_REALM }}"
      desired:
        smtpServer: "{{ KEYCLOAK_DICTIONARY_REALM.smtpServer }}"
    - realm: master
      desired:
        smtpServer: "{{ KEYCLOAK_DICTIONARY_REALM.smtpServer }}"

KEYCLOAK_RECAPTCHA_ENABLED: "{{ lookup('config', application_id, 'services.recaptcha.enabled') }}"
KEYCLOAK_RECAPTCHA_KEY: "{{ lookup('config', application_id, 'secrets.credentials.recaptcha.key') }}"
KEYCLOAK_RECAPTCHA_SECRET: "{{ lookup('config', application_id, 'secrets.credentials.recaptcha.secret') }}"

KEYCLOAK_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
KEYCLOAK_DESIGN_THEME: "{{ lookup('config', application_id, 'services.keycloak.design.theme') }}"
KEYCLOAK_DESIGN_DARK_CLASS: "design-theme-dark"
KEYCLOAK_DESIGN_DIR: "{{ [lookup('container', application_id, 'directories.volumes'), 'theme'] | path_join }}"
KEYCLOAK_DESIGN_BRAND: "{{ lookup('design', application_id).slots.brand }}"
KEYCLOAK_DESIGN_ON_FRAME: "{{ lookup('design_palette', lookup('config', 'web-svc-design', 'services.design.colors.base')).light['--design-on-frame'] }}"
KEYCLOAK_DESIGN_BRAND_VERSION: >-
  {{ [lookup('design', application_id) | to_json,
      KEYCLOAK_DESIGN_ON_FRAME,
      (lookup('local_mtime_qs', lookup('design', application_id).logo, mode='epoch')
       if lookup('design', application_id).logo is string else '')]
     | join('|') | hash('sha1') | truncate(8, True, '') }}
KEYCLOAK_DESIGN_STYLE_VERSION: "{{ lookup('template', 'theme/theme.css.j2') | hash('sha1') | truncate(8, True, '') }}"
KEYCLOAK_DESIGN_TITLE: "{{ lookup('design', application_id).title if lookup('design', application_id).title is string else '' }}"
KEYCLOAK_DESIGN_TITLE_HTML: >-
  {{ ('<div class="kc-logo-text"><span>' ~ (KEYCLOAK_DESIGN_TITLE | e) ~ '</span></div>')
     if (KEYCLOAK_DESIGN_TITLE | length > 0 and lookup('design', application_id).logo is string) else '' }}

KEYCLOAK_COMMAND_PERMANENT_ADMIN_LOGIN: |-
  {{ KEYCLOAK_EXEC_CONTAINER }} sh -lc '
    set -e
    {{ KEYCLOAK_KCADM }} config credentials \
      --server {{ KEYCLOAK_SERVER_INTERNAL_URL }} \
      --realm master \
      --user "$KEYCLOAK_PERMANENT_ADMIN_USERNAME" \
      --password "$KEYCLOAK_PERMANENT_ADMIN_PASSWORD"
  '
