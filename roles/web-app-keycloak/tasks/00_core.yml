---
- include_tasks: utils/once/flag.yml

- name: "📂 Load cleanup routine for '{{ application_id }}'"
  include_tasks: 01_cleanup.yml
  when: CLEANUP | bool

- name: "📂 Load init routine for '{{ application_id }}'"
  include_tasks: 02_init.yml

- name: "📄 Deploy the logout status panel for '{{ application_id }}'"
  stack_host_template:
    src: logout-panel.js.j2
    dest: "{{ KEYCLOAK_LOGOUT_PANEL_FILE }}"
    mode: "0644"
  when: KEYCLOAK_LOGOUT_PANEL_ENABLED | bool
  notify: reload-openresty

- name: "📄 Deploy the managed client field lock for '{{ application_id }}'"
  stack_host_template:
    src: field-lock.js.j2
    dest: "{{ KEYCLOAK_FIELD_LOCK_FILE }}"
    mode: "0644"
  when: KEYCLOAK_JAVASCRIPT_ENABLED | bool
  notify: reload-openresty

- name: "🎨 Load the corporate theme routine for '{{ application_id }}'"
  include_tasks: utils/theme.yml

- name: "📥 Capture the admin password of the deploy this one replaces"
  include_tasks: utils/capture_previous_admin.yml
  when: IS_STACK_HOST | bool

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "👔 Keycloak manager-side operations (file deploys + container exec)"
  include_tasks: 03_manager_ops.yml
  when: IS_STACK_HOST | bool
