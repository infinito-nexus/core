---
- name: "🔧 Set emailVerified=true for users holding their inventory address in realm '{{ KEYCLOAK_REALM }}'"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/utils/rest_script.yml"
    apply:
      delegate_to: "{{ KEYCLOAK_HOST_NODE }}"
  vars:
    rest_script: email_verified.py
    rest_script_env:
      EMAILS_JSON: "{{ lookup('users_non_reserved') | dict2items | map(attribute='value') | list | items2dict(key_name='username', value_name='email') | to_json }}"
    rest_script_stdin: ""
    rest_script_ok_rcs: [0]
    rest_script_changed: "updated=[1-9]"
    rest_script_register: kc_email_verified

- name: "📊 Report how many users got their email marked verified"
  ansible.builtin.debug:
    msg: "{{ kc_email_verified.stdout_lines | select('match', '^summary ') | list }}"
