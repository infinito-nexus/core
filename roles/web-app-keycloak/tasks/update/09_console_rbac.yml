---
- name: "⬇️ Resolve the RBAC group of '{{ item.key }}'"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} get {{ ('group-by-path/' ~ lookup('rbac_group_path', application_id=application_id, role=item.key)) | quote }}
    -r {{ KEYCLOAK_REALM | quote }} --fields id --format json
  loop: "{{ KEYCLOAK_CONSOLE_ROLE_GRANTS }}"
  loop_control:
    label: "{{ item.key }}"
  register: kc_console_rbac_groups
  retries: 5
  delay: 10
  until: kc_console_rbac_groups.rc == 0
  changed_when: false

- name: "🛂 Grant realm-management roles to '{{ item.item.key }}'"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} add-roles -r {{ KEYCLOAK_REALM | quote }}
    --gid {{ (item.stdout | kcadm_json).id | quote }}
    --cclientid {{ KEYCLOAK_CONSOLE_ROLE_CLIENT | quote }}
    {% for role_name in item.item.value.realm_management %}--rolename {{ role_name | quote }} {% endfor %}
  loop: "{{ kc_console_rbac_groups.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
