---
- name: ⬇️ Read the client scopes of the realm
  shell: "{{ KEYCLOAK_EXEC_KCADM }} get client-scopes -r {{ KEYCLOAK_REALM }} --format json"
  register: kc_realm_client_scopes
  changed_when: false

- name: ✅ Create the client scopes the realm dictionary declares and the realm lacks
  shell: |
    cat <<'JSON' | {{ KEYCLOAK_EXEC_KCADM }} create client-scopes -r {{ KEYCLOAK_REALM }} -f -
    {{ kc_client_scope | to_json }}
    JSON
  loop: >-
    {{ KEYCLOAK_DICTIONARY_REALM.clientScopes
       | rejectattr('name', 'in', kc_realm_client_scopes.stdout | kcadm_json | map(attribute='name') | list)
       | list }}
  loop_control:
    loop_var: kc_client_scope
    label: "{{ kc_client_scope.name }}"
  changed_when: true

- name: "🔄 Update Client settings"
  vars:
    kc_object_kind: "client"
    kc_lookup_value: "{{ KEYCLOAK_CLIENT_ID }}"
    kc_desired: >-
      {{
        KEYCLOAK_DICTIONARY_REALM.clients
          | selectattr('clientId','equalto', KEYCLOAK_CLIENT_ID)
          | list | first
      }}
    kc_force_attrs:
      publicClient: >-
        {{
          (KEYCLOAK_DICTIONARY_REALM.clients
            | selectattr('clientId','equalto', KEYCLOAK_CLIENT_ID)
            | map(attribute='publicClient')
            | first)
        }}
      serviceAccountsEnabled: >-
        {{
          (KEYCLOAK_DICTIONARY_REALM.clients
            | selectattr('clientId','equalto', KEYCLOAK_CLIENT_ID)
            | map(attribute='serviceAccountsEnabled')
            | first )
        }}
      frontchannelLogout: >-
        {{
          (KEYCLOAK_DICTIONARY_REALM.clients
            | selectattr('clientId','equalto', KEYCLOAK_CLIENT_ID)
            | map(attribute='frontchannelLogout')
            | first)
        }}
      attributes: >-
        {{
          ( (KEYCLOAK_DICTIONARY_REALM.clients
              | selectattr('clientId','equalto', KEYCLOAK_CLIENT_ID)
              | list | first | default({}) ).attributes | default({}) )
          | combine({'frontchannel.logout.url': KEYCLOAK_FRONTCHANNEL_LOGOUT_URL}, recursive=True)
        }}
  keycloak_kcadm_update:
    object_kind: "{{ kc_object_kind }}"
    lookup_value: "{{ kc_lookup_value }}"
    desired: "{{ kc_desired }}"
    force_attrs: "{{ kc_force_attrs }}"
    kcadm_exec: "{{ KEYCLOAK_EXEC_KCADM }}"
    realm: "{{ KEYCLOAK_REALM }}"
    assert_mode: "{{ MODE_ASSERT }}"
    cid_resolve_cmd: "{{ KEYCLOAK_CID_RESOLVE_CMD if IS_SWARM_MODE else omit }}"
    current_cid: "{{ KEYCLOAK_LOCAL_CID if IS_SWARM_MODE else omit }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  register: kc_client_update
  changed_when: false
  # rationale: async; reaped in update_routines.yml before 04_rbac reads the client back
  async: "{{ ASYNC_TIME if ASYNC_ENABLED | bool else omit }}"
  poll: "{{ ASYNC_POLL if ASYNC_ENABLED | bool else omit }}"
