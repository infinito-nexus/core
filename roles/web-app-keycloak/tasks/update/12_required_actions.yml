---
- name: "⬇️ Read the required actions of realm '{{ KEYCLOAK_REALM }}'"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} get authentication/required-actions -r {{ KEYCLOAK_REALM }} --format json
  register: kc_required_actions
  changed_when: false

- name: "📤 Pick the reconciled required actions from the realm dictionary"
  ansible.builtin.set_fact:
    kc_required_actions_desired: >-
      {{ KEYCLOAK_DICTIONARY_REALM.requiredActions
         | selectattr('alias', 'in', KEYCLOAK_RECONCILED_REQUIRED_ACTIONS) | list }}

- name: "➕ Register the required actions realm '{{ KEYCLOAK_REALM }}' lacks"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} create authentication/register-required-action -r {{ KEYCLOAK_REALM }}
    -s providerId={{ kc_required_action.providerId | quote }}
    -s name={{ kc_required_action.name | quote }}
  loop: >-
    {{ kc_required_actions_desired
       | rejectattr('alias', 'in', kc_required_actions.stdout | kcadm_json | map(attribute='alias') | list)
       | list }}
  loop_control:
    loop_var: kc_required_action
    label: "{{ kc_required_action.alias }}"
  changed_when: true

- name: "🔄 Converge the reconciled required actions of realm '{{ KEYCLOAK_REALM }}'"
  ansible.builtin.shell: >-
    printf '%s' {{ kc_required_action | to_json | quote }}
    | {{ KEYCLOAK_EXEC_KCADM }} update authentication/required-actions/{{ kc_required_action.alias }}
    -r {{ KEYCLOAK_REALM }} -f -
  loop: "{{ kc_required_actions_desired | kc_drifted_required_actions(kc_required_actions.stdout | kcadm_json) }}"
  loop_control:
    loop_var: kc_required_action
    label: "{{ kc_required_action.alias }}"
  changed_when: true
