---
- name: "📂 Load LDAP Update routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/03_ldap/main.yml"

- name: "📂 Load LDAP profile attribute mapper routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/03_ldap/profile_mappers.yml"

- name: ✅ Assert Keycloak LDAP configuration
  include_tasks: "{{ role_path }}/tasks/assert/01_ldap.yml"
  when:
    - KEYCLOAK_VALIDATE_ENABLED | bool
    - IS_STACK_HOST | bool

- name: "📂 Load per-app group-ldap-mapper routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/03_per_app_mappers.yml"
