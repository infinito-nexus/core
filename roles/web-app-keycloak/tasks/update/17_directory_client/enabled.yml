---
- name: "📝 Upsert the directory client '{{ KEYCLOAK_DIRECTORY_CLIENT_ID }}'"
  keycloak_kcadm_update:
    object_kind: client
    lookup_value: "{{ KEYCLOAK_DIRECTORY_CLIENT_ID }}"
    desired: "{{ KEYCLOAK_DIRECTORY_CLIENT }}"
    kcadm_exec: "{{ KEYCLOAK_EXEC_KCADM }}"
    realm: "{{ KEYCLOAK_REALM }}"
  register: kc_directory_client
  changed_when: not kc_directory_client.object_exists
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "⬇️ Read the realm-management roles of '{{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT }}'"
  ansible.builtin.shell: >
    {{ KEYCLOAK_EXEC_KCADM }} get-roles -r {{ KEYCLOAK_REALM | quote }}
    --uusername {{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT | quote }}
    --cclientid {{ KEYCLOAK_CONSOLE_ROLE_CLIENT | quote }}
  register: kc_directory_roles
  changed_when: false

- name: "🛂 Converge '{{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT }}' to exactly its realm-management roles"
  vars:
    kc_directory_held: "{{ kc_directory_roles.stdout | kcadm_json | map(attribute='name') | list }}"
    kc_directory_grant: "{{ KEYCLOAK_DIRECTORY_CLIENT_ROLES | difference(kc_directory_held) }}"
    kc_directory_revoke: "{{ kc_directory_held | difference(KEYCLOAK_DIRECTORY_CLIENT_ROLES) }}"
  block:
    - name: "🛂 Grant '{{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT }}' its missing realm-management roles"
      ansible.builtin.shell: >
        {{ KEYCLOAK_EXEC_KCADM }} add-roles -r {{ KEYCLOAK_REALM | quote }}
        --uusername {{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT | quote }}
        --cclientid {{ KEYCLOAK_CONSOLE_ROLE_CLIENT | quote }}
        {% for role_name in kc_directory_grant %}--rolename {{ role_name | quote }} {% endfor %}
      when: kc_directory_grant | length > 0
      changed_when: true

    - name: "🧹 Revoke every other realm-management role of '{{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT }}'"
      ansible.builtin.shell: >
        {{ KEYCLOAK_EXEC_KCADM }} remove-roles -r {{ KEYCLOAK_REALM | quote }}
        --uusername {{ KEYCLOAK_DIRECTORY_SERVICE_ACCOUNT | quote }}
        --cclientid {{ KEYCLOAK_CONSOLE_ROLE_CLIENT | quote }}
        {% for role_name in kc_directory_revoke %}--rolename {{ role_name | quote }} {% endfor %}
      when: kc_directory_revoke | length > 0
      changed_when: true
