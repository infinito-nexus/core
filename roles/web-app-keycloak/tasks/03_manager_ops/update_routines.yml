---
- name: "📂 Load client and mail settings routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/01_settings.yml"

- name: "📂 Load RBAC Update routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/02_rbac_client_scope.yml"

- name: "📂 Load web-origins claim routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/07_web_origins_claim.yml"

- name: "📂 Load LDAP shared-federation routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/03_ldap/shared.yml"
  when:
    - KEYCLOAK_LDAP_ENABLED | bool
    - KEYCLOAK_LDAP_SHARED | bool

- name: "🧹 Remove LDAP federation routines for '{{ application_id }}' when LDAP disabled"
  include_tasks: "{{ role_path }}/tasks/update/03_ldap/disabled.yml"
  when: not KEYCLOAK_LDAP_ENABLED | bool

- name: "📂 Load reCAPTCHA Update routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/04_recaptcha.yml"
  when: KEYCLOAK_RECAPTCHA_ENABLED | bool

- name: "📂 Load UserProfile (declarative) Update routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/05_userprofile.yml"

- name: "📂 Load corporate theme selection routines for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/update/08_design.yml"

- name: "📂 Load realm-local user and group provisioning routines"
  when: not KEYCLOAK_LDAP_ENABLED | bool
  block:
    - name: "📂 Load Realm User provisioning routines for '{{ application_id }}'"
      include_tasks: "{{ role_path }}/tasks/update/06_users/realm.yml"

    - name: "📂 Load RBAC realm group provisioning routines for '{{ application_id }}'"
      include_tasks: "{{ role_path }}/tasks/update/06_rbac_groups_realm.yml"

- name: "📂 Load Users Update routines for '{{ application_id }}' (emailVerified)"
  include_tasks: "{{ role_path }}/tasks/update/06_users/email_verified.yml"
  when: KEYCLOAK_USER_EMAILS_VERIFIED | bool
