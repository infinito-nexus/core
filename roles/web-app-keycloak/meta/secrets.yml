---
credentials:
  sso_proxy_cookie_secret:
    description: Cookie secret for the SSO-proxy sidecar (hex string, 32 characters, generated via `openssl rand -hex 16`)
    algorithm: plain
    validation: ^.*$
  oidc_client_secret:
    description: Client secret for the shared OIDC client; consumed by the SSO-proxy sidecar and the Keycloak realm client, and used as the default for
      OIDC.CLIENT.SECRET when the inventory sets none.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  usage_client_secret:
    description: Client secret of the confidential client usage whose service account only reads the users of the application realm; a workspace keeps it as an
      OpenBao reference that only a task of its usage template reads.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  workspace_members_client_secret:
    description: Client secret of the confidential client workspace-members whose service account changes the invitations and memberships of workspace
      organizations; only templates that run the platform inventory read it.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  export_client_secret:
    description: Client secret of the confidential client export whose service account reads the users, organizations and admin events an export checks; the
      deploy hands it to OpenBao at platform/export/keycloak, where only the export task reads it.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  store_fixture_client_secret:
    description: Client secret of the test-only store client the realm holds while services.semaphore.workspaces.invite_client_id of web-app-semaphore names it;
      the Playwright spec reads it through the admin API.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  recaptcha:
    key:
      description: Runtime credential value imported from meta/services.yml for 'key'.
      algorithm: plain
      default: "{{ CAPTCHA.RECAPTCHA.KEY }}"
    secret:
      description: Runtime credential value imported from meta/services.yml for 'secret'.
      algorithm: plain
      default: "{{ CAPTCHA.RECAPTCHA.SECRET }}"
