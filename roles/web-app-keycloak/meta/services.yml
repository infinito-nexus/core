---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-required — object storage not implemented for this role
# nocheck: dynamic-flag
# nocheck: logout
logout:
  enabled: false
  shared: false
# nocheck: dynamic-flag  cluster-wide LDAP federation keys on inventory groups[]; host-scoped group_names is cross-host cache-poisoned for this destructive flag
ldap:
  bond: 1
  enabled: "{{ (groups['svc-db-openldap'] | default([]) | length) > 0 }}"
  shared: "{{ (groups['svc-db-openldap'] | default([]) | length) > 0 }}"
  connection_pooling: false
  sync:
    period:
      changes: 900
      full: 86400
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
  iframe: false
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
# nocheck: dynamic-flag
javascript:
  bond: 1
  enabled: true
  shared: true
# nocheck: playwright-service-flag — self-provider
keycloak:
  healthcheck:
    flavor: http_status
    path: health/ready
    port_key: management
    # nocheck: healthcheck-timing-override  the management endpoint answers from the JVM, which does not reply inside the 5s default while the realm is still importing
    timeout: 15s
    retries: 5
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  provides: sso
  image: quay.io/keycloak/keycloak
  version: "26.8.2"
  name: keycloak
  min_storage: 468MB
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 1024
  realm:
    import_enabled: true
    access_token_lifespan_seconds: 300
    sso_session_idle_timeout_seconds: 1800
    sso_session_max_lifespan_seconds: 36000
    totp_enabled: true
    totp_enforced: true
    otp_policy:
      type: totp
      algorithm: HmacSHA1
      digits: 6
      period: 30
      look_ahead_window: 1
      initial_counter: 0
      code_reusable: false
  users:
    emails_verified: true
  events:
    admin:
      expiration_days: 365
  email:
    policy: external
    switch: false
    secondary_required: true
  design:
    theme: infinito-corporate
  scopes:
    nextcloud: nextcloud
    moodle: moodle
  accounts:
    system:
      username: "{{ SOFTWARE_NAME | replace('.', '_') | lower }}"
  admin:
    allowed_networks: []
  client:
    ids:
      - "{{ OIDC.CLIENT.ID }}"
    redirect_uris: "{{ lookup('redirect_uris') }}"
    web_origins: "{{ lookup('redirect_uris', wildcard='') }}"
    post_logout_redirect_uris: "{{ (['+'] + lookup('network_urls', lookup('tls', 'web-svc-logout', 'url.base') ~ '*')) | join('##') }}"
  usage_client:
    enabled: false
  organizations:
    enabled: false
  ports:
    local:
      http: 8032
    internal:
      http: 8080
      management: 9000
  proxy:
    service_key: keycloak
  run_after:
    - web-app-matomo
    - web-app-email
  lifecycle: beta
# nocheck: dynamic-flag — per-consumer fan-out
# nocheck: playwright-service-flag — sidecar shape, no probe-able surface flag
sso_proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy
  version: "v7.15.6"
  min_storage: 220MB
  configuration_file: oauth2-proxy-keycloak.cfg
  alpha_configuration_file: oauth2-proxy-keycloak-alpha.yml
  error_template_file: oauth2-proxy-error.html
  templates_directory: /templates
  cookie_refresh: 1m
  ports:
    internal:
      http: 4180
  cpus: "0.25"
  mem_reservation: "64m"
  mem_limit: "128m"
  pids_limit: 256
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "{{ SOFTWARE_NAME }}"
  slots:
    brand:
      width: 300
      height: 65
      frame: true
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — captcha backend, infrastructural
recaptcha:
  enabled: "{{ RECAPTCHA_ENABLED | bool }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, dynamic-flag, semaphore-contract  control plane: Semaphore signs its users in through Keycloak, so a run that paused it would lock everyone out of the UI that resumes it
semaphore:
  enabled: false
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  flush: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
