        enabled: true
      organizations:
        enabled: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    ldap:
      shared: true
      enabled: true
    matomo:
      enabled: true
      shared: true
    postgres:
      shared: true
    prometheus:
      enabled: true
      shared: true
    design:
      enabled: true
      shared: true
    tor:
      enabled: true
