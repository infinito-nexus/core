---
- name: "🔁 update (pacman) | make pacman retry transient mirror/egress failures natively"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: "^XferCommand\\s*="
    # nocheck: curl-timeout  pacman package downloads are size-unbounded; a --max-time would truncate large transfers
    line: "XferCommand = /usr/bin/curl -L -C - -f --connect-timeout 5 --retry 3 --retry-all-errors --retry-delay 2 -o %o %u"
    insertafter: "^\\[options\\]"

- name: "🔍 update (pacman) | read pacman.conf for the download sandbox switch"
  ansible.builtin.slurp:
    src: /etc/pacman.conf
  register: update_pacman_conf

- name: "🔓 update (pacman) | run XferCommand as root where the download sandbox is off"
  become: true
  ansible.builtin.replace:
    path: /etc/pacman.conf
    regexp: "^DownloadUser\\s*="
    replace: "#DownloadUser ="
  when: "'DisableSandbox' in (update_pacman_conf.content | b64decode).splitlines()"

- name: "🔄 update (pacman) | refresh pacman cache and upgrade all installed packages"
  community.general.pacman: # nocheck: dynamic-package - full-system upgrade, not a package install
    update_cache: true
    upgrade: true

- name: "🛑 update (pacman) | reboot when the running kernel has no modules on disk"
  ansible.builtin.include_tasks: arch/reboot.yml
  when: not (DOCKER_IN_CONTAINER | bool)
  vars:
    update_module_trees: "{{ update_module_indexes.files | map(attribute='path') | map('dirname') | map('basename') | sort }}"
    update_kernel_modules_missing: >-
      {{ update_proc_modules.stat.exists
         and update_module_trees | length > 0
         and ansible_facts['kernel'] not in update_module_trees }}
    update_mesh_up_in_play: "{{ run_once_svc_net_wireguard is defined }}"
    update_controller_is_target: >-
      {{ ansible_connection in ['local', 'ansible.builtin.local']
         or (update_boot_id.content | b64decode | trim)
            == (lookup('ansible.builtin.file', '/proc/sys/kernel/random/boot_id', errors='ignore') | trim) }}
