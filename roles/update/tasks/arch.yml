---
- name: "📦 update (pacman) | install the downloader that retries transient failures"
  become: true
  ansible.builtin.copy:
    src: shell/pacman_xfer.sh
    dest: "{{ UPDATE_PACMAN_XFER }}"
    owner: root
    group: root
    mode: "0755"

- name: "🔁 update (pacman) | make pacman retry transient mirror/egress failures natively"
  become: true
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: "^XferCommand\\s*="
    line: "XferCommand = {{ UPDATE_PACMAN_XFER }} %o %u"
    insertafter: "^\\[options\\]"

- name: "🔄 update (pacman) | refresh pacman cache and upgrade all installed packages"
  community.general.pacman: # nocheck: dynamic-package - full-system upgrade, not a package install
    update_cache: true
    upgrade: true
