---
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
  # nocheck: matomo-track
  track: false
# nocheck: dynamic-flag
redis:
  backup:
    disabled: true
  enabled: false
  shared: "{{ 'svc-db-redis' in group_names }}"
collabora:
  healthcheck:
    test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: single-replica
  replicas: 1
  bond: 1
  enabled: true
  shared: true
  image: collabora/code
  version: "26.04.5.2.1"
  name: collabora
  min_storage: 734MB
  cpus: 2
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 2048
  ports:
    local:
      http: 8042
    internal:
      http: 9980
  proxy:
    service_key: collabora
  lifecycle: beta
# nocheck: dynamic-flag
# nocheck: design-off  Reason: '/' answers a plain OK, the admin console is off and the editor opens only as a POST from the WOPI host (Nextcloud)
design:
  enabled: false
  shared: false
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  # nocheck: prometheus-scrape
  scrape: false

# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
