---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: FLOWISE
    resolve_compose_cid: "{{ FLOWISE_CONTAINER }}"

- name: "🔑 Mint the scoped Flowise API identity for the MCP registry"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, run_once delegated to the hosting node
      IFS= read -r FLOWISE_ADMIN_PASSWORD && : "${FLOWISE_ADMIN_PASSWORD:?arrived empty on stdin}" && export FLOWISE_ADMIN_PASSWORD && container exec -i
      -e FLOWISE_BASE=http://localhost:{{ FLOWISE_PORT_INTERNAL | quote }}
      -e FLOWISE_ADMIN_EMAIL={{ FLOWISE_API_BOT_USER.email | quote }}
      -e FLOWISE_ADMIN_PASSWORD
      -e FLOWISE_ADMIN_NAME={{ FLOWISE_API_BOT_USER.username | quote }}
      -e FLOWISE_API_KEY_NAME={{ FLOWISE_MCP_API_KEY_NAME | quote }}
      {{ FLOWISE_LOCAL_CID | quote }}
      python3 -
    stdin: |-
      {{ FLOWISE_API_BOT_PASSWORD }}
      {{ lookup('file', 'python/mint_mcp_api_key.py') }}
  register: flowise_mcp_identity
  retries: 30
  delay: 10
  until: flowise_mcp_identity.rc == 0
  changed_when: flowise_mcp_identity.stdout.startswith('CHANGED')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ FLOWISE_HOST_NODE }}"
  run_once: true

- name: "🔌 Reconcile the custom MCP server registry"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, run_once delegated to the hosting node
      IFS= read -r FLOWISE_API_KEY && IFS= read -r FLOWISE_MCP_DESIRED && : "${FLOWISE_API_KEY:?arrived empty on stdin}" && : "${FLOWISE_MCP_DESIRED:?arrived empty
      on stdin}" && export FLOWISE_API_KEY FLOWISE_MCP_DESIRED && container exec -i
      -e FLOWISE_BASE=http://localhost:{{ FLOWISE_PORT_INTERNAL | quote }}
      -e FLOWISE_API_KEY
      -e FLOWISE_WORKSPACE={{ (flowise_mcp_identity.stdout_lines | last | from_json).workspace_id | quote }}
      -e FLOWISE_MCP_DESIRED
      -e FLOWISE_MCP_TRANSPORT={{ FLOWISE_MCP_TRANSPORT | quote }}
      -e FLOWISE_MCP_FIXTURE={{ FLOWISE_MCP_FIXTURE | to_json | quote }}
      {{ FLOWISE_LOCAL_CID | quote }}
      python3 -
    stdin: |-
      {{ (flowise_mcp_identity.stdout_lines | last | from_json).api_key }}
      {{ FLOWISE_MCP_DESIRED | to_json }}
      {{ lookup('file', 'python/reconcile/mcp_servers.py') }}
  register: flowise_mcp_registry
  retries: "{{ 30 if MCP_RECONCILE_STRICT | bool else 0 }}"
  delay: 10
  until: flowise_mcp_registry.rc in [0, 3]
  failed_when: flowise_mcp_registry.rc != 0 and (MCP_RECONCILE_STRICT | bool)
  changed_when: flowise_mcp_registry.stdout.startswith('CHANGED')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ FLOWISE_HOST_NODE }}"
  run_once: true
