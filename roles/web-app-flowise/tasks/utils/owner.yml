---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: FLOWISE
    resolve_compose_cid: "{{ FLOWISE_CONTAINER }}"

- name: "🔍 Resolve the Flowise network namespace for host-side API calls"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns.yml') }}"
  vars:
    netns_output_prefix: FLOWISE

- name: "👤 Register the Flowise instance owner before a visitor can claim it"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
    apply:
      run_once: true
  vars:
    netns_request_argv: "{{ FLOWISE_NETNS_PYTHON }}"
    netns_request_host: "{{ FLOWISE_HOST_NODE }}"
    netns_request_method: POST
    netns_request_url: "{{ FLOWISE_INTERNAL_URL }}/api/v1/account/register"
    netns_request_headers: "{{ {'x-request-from': 'internal'} }}"
    netns_request_body: >-
      {{ {'user': {
        'email': FLOWISE_API_BOT_USER.email,
        'name': FLOWISE_API_BOT_USER.username,
        'credential': FLOWISE_API_BOT_PASSWORD,
      }} | to_json }}
    netns_request_status: [200, 201, 400]
    netns_request_retries: 30
    netns_request_delay: 5
    netns_request_changed: [200, 201]
    netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    netns_request_result: flowise_owner

- name: "✅ Accept a 400 only when Flowise already has its one organization"
  ansible.builtin.assert:
    that: flowise_owner.status != 400 or 'only have one organization' in flowise_owner.content
    fail_msg: "account/register returned {{ flowise_owner.status }}"
    quiet: true
  run_once: true

- name: "🔐 Converge the password of the Flowise instance owner"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - -e
      - "NODE_PATH={{ FLOWISE_NODE_MODULES }}"
      - "{{ FLOWISE_LOCAL_CID }}" # nocheck: container-exec-resolver
      - node
      - "-"
    stdin: >-
      {{ 'process.env.FLOWISE_ADMIN_EMAIL = ' ~ (FLOWISE_API_BOT_USER.email | to_json) ~ ';'
      ~ ' process.env.FLOWISE_ADMIN_PASSWORD = ' ~ (FLOWISE_API_BOT_PASSWORD | to_json) ~ '; '
      ~ lookup('file', 'javascript/reconcile/identity_password.js') }}
  register: flowise_owner_password
  retries: 30
  delay: 10
  until: flowise_owner_password.rc == 0
  changed_when: flowise_owner_password.stdout.startswith('CHANGED')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ FLOWISE_HOST_NODE }}"
  run_once: true
