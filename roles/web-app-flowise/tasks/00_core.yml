---
- include_tasks: utils/once/flag.yml

- name: "📦 Stage the {{ application_id }} build context"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "{{ lookup('path_absolute', 'roles/web-app-flowise/files/Dockerfile') }}"
        dest: "{{ [FLOWISE_BUILD_DIR, 'Dockerfile'] | path_join }}"
        mode: "0644"
        notify: []

- name: "🧩 For '{{ application_id }}': load docker, db and proxy"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: true

- name: "🔌 Reconcile the MCP server registry"
  ansible.builtin.include_tasks: utils/mcp.yml
  when: FLOWISE_MCP_SERVERS | length > 0
