---
application_id: "web-app-flowise"
domain: "{{ lookup('domain',application_id) }}"
http_port: "{{ lookup('config', application_id, 'services.flowise.ports.local.http') }}"

FLOWISE_CONTAINER: "{{ lookup('config', application_id, 'services.flowise.name') }}"
FLOWISE_PORT_INTERNAL: 3000

FLOWISE_LDAP_ENABLED: "{{ lookup('config', application_id, 'services.ldap.enabled') }}"

FLOWISE_LITELLM_URL: "{{ LITELLM_BASE_LOCAL_URL }}"
FLOWISE_LITELLM_API_KEY: "{{ lookup('config', application_id, 'credentials.litellm_api_key') }}"

FLOWISE_QDRANT_INTERNAL_URL: "{{ lookup('engine', 'qdrant', application_id, 'url') }}"
