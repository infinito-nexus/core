---
credentials:
  root_password:
    description: Password for the MariaDB root user
    algorithm: bcrypt
    validation: ^\$2[aby]\$.{56}$
  replication_password:
    description: Password of the MariaDB 'replication' user replicas connect as in the HA form
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  etcd_password:
    description: Password of the etcd user the writer elector uses in the HA form, restricted to its coordination-store prefix
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  elector_password:
    description: Password of the MariaDB 'elector' SQL user the writer elector toggles read_only and replication with
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
