---
- include_tasks: utils/once/flag.yml

- name: "📂 For '{{ application_id }}': own the compose handler topic"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: none.yml
    handlers_from: main

- name: "🥾 For '{{ application_id }}': bootstrap the compose host once"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: 00_core.yml
  when: run_once_sys_svc_compose is not defined

- name: "📄 Lay down the MariaDB health identity init file on the stack host"
  when: IS_STACK_HOST | bool
  block:
    - name: "✅ Ensure MariaDB volumes directory exists"
      ansible.builtin.file:
        path: "{{ MARIADB_VOLUMES_DIR }}"
        state: directory
        mode: "0755"

    - name: "📄 Copy the health identity init file"
      stack_host_copy:
        src: sql/ensure_health_identity.sql
        dest: "{{ MARIADB_HEALTH_IDENTITY_FILE }}"
        mode: "0444"
      notify: compose-up

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true

- name: 📦 Install MySQL Python client library via pip
  include_role:
    name: sys-pip-install
  vars:
    package_name: PyMySQL
    package_state: present
    global_install: true
  when: MARIADB_EXPOSE_LOCAL | bool

- name: "⏳ Wait until MariaDB container {{ MARIADB_NAME }} is running"
  community.docker.docker_container_info: # nocheck: docker-module-uses-container-cli  read-only info module; returns structured container facts the wrapper's raw JSON would need parsed
    name: "{{ MARIADB_NAME }}"
  register: db_info
  until:
    - db_info.container is defined
    - db_info.container is not none
    - db_info.container.State.Running
  retries: 30
  delay: 5
  when: IS_COMPOSE_MODE

- block:
    - name: "🔎 Root password reset | Check login with desired password (inside container)"
      ansible.builtin.shell:
        cmd: >-
          container exec -i {{ MARIADB_CONTAINER_ADDRESS }}
          sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb
          {% if MARIADB_EXPOSE_LOCAL %}-h127.0.0.1 -P3306{% endif %} -uroot'
        stdin: "{{ lookup('file', role_path ~ '/files/sql/health_probe.sql') }}"
      register: mariadb_login_desired
      delegate_to: "{{ STACK_HOST }}"
      run_once: true
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      changed_when: false
      failed_when: false
      retries: 30
      delay: 5
      until: mariadb_login_desired.rc == 0 or 'Access denied' in mariadb_login_desired.stderr

    - name: "✅ Ensure MariaDB root password matches desired value"
      include_tasks: 02_reset_root_password.yml
      when:
        - mariadb_login_desired.rc != 0
        - "'No such container' not in (mariadb_login_desired.stderr | default(''))"

  when: MARIADB_ALLOW_RESET_WITHOUT_PREVIOUS | bool

- name: "⏳ Wait until MariaDB accepts root credentials (inside container)"
  ansible.builtin.shell:
    cmd: >-
      container exec -i {{ MARIADB_CONTAINER_ADDRESS }}
      sh -c 'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" exec mariadb
      {% if MARIADB_EXPOSE_LOCAL %}-h127.0.0.1 -P3306{% endif %} -uroot'
    stdin: "{{ lookup('file', role_path ~ '/files/sql/health_probe.sql') }}"
  register: mariadb_cli
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: false
  retries: 30
  delay: 5
  until: mariadb_cli.rc == 0

- name: "⏳ Wait until MariaDB accepts root credentials (via mariadb_db)"
  ansible.mariadb.mariadb_db:
    name: "{{ MARIADB_HEALTHCHECK_DB }}"
    state: present
    login_user: root
    login_password: "{{ MARIADB_ROOT_PWD }}"
    login_host: "{{ MARIADB_HOST }}"
    login_port: "{{ MARIADB_PORT }}"
    config_file: ""
  register: mariadb_ready
  retries: 30
  delay: 5
  until: mariadb_ready is succeeded
  changed_when: false
  when:
    - IS_COMPOSE_MODE | bool
    - MARIADB_EXPOSE_LOCAL | bool
