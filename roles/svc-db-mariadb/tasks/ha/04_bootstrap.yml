---
- name: "⏳ MariaDB HA | Wait until the bootstrap instance accepts root over its socket"
  ansible.builtin.shell: |
    container exec -i {{ lookup('container_address', application_id, entity_name, instance=_mariadb_ha_bootstrap) }} {{ MARIADB_HA_SQL }}
  args:
    stdin: "{{ lookup('file', role_path ~ '/files/sql/health_probe.sql') }}"
  register: _mariadb_ha_bootstrap_ready
  until: _mariadb_ha_bootstrap_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false

- name: "👤 MariaDB HA | Create HA users before any replica exists"
  ansible.builtin.shell: |
    container exec -i {{ lookup('container_address', application_id, entity_name, instance=_mariadb_ha_bootstrap) }} {{ MARIADB_HA_SQL }}
  args:
    stdin: |
      SET SESSION sql_log_bin = 0;
      SET @replication_pwd := {{ MARIADB_REPLICATION_PWD | mariadb_sql_literal }};
      SET @elector_pwd := {{ MARIADB_ELECTOR_PWD | mariadb_sql_literal }};
      {{ lookup('template', role_path ~ '/templates/sql/ha/users.sql.j2') }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: true

- name: "🏁 MariaDB HA | Let the bootstrap instance's elector compete"
  ansible.builtin.shell: |
    container exec {{ lookup('container_address', application_id, entity_name, instance=_mariadb_ha_bootstrap) }} touch {{ MARIADB_HA_BOOTSTRAP_MARKER | quote }} {{ MARIADB_HA_READY_MARKER | quote }}
  changed_when: true

- name: "⏳ MariaDB HA | Wait until the bootstrap instance holds the writer lease"
  ansible.builtin.command:
    argv:
      - "{{ [DIR_BIN, MARIADB_INSTANCES.ha.probe] | path_join }}"
      - "{{ entity_name }}"
      - "{{ _mariadb_ha_bootstrap.service }}"
  register: _mariadb_ha_bootstrap_writer
  until: _mariadb_ha_bootstrap_writer.rc == 0
  retries: 30
  delay: 5
  changed_when: false
