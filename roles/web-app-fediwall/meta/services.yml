---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: dynamic-flag
# nocheck: logout
logout:
  enabled: false
  shared: false
# nocheck: dynamic-flag
dashboard:
  bond: 1
  enabled: true
  shared: true
# nocheck: dynamic-flag
matomo:
  bond: 1
  enabled: true
  shared: true
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  bootstrap: true
  slots:
    favicon:
      width: 128
      height: 128
# nocheck: dynamic-flag
# nocheck: email
email:
  enabled: false
  shared: false
# nocheck: dynamic-flag
# nocheck: oidc
# nocheck: sso
sso:
  enabled: false
  shared: false
# nocheck: dynamic-flag
prometheus:
  bond: 1
  enabled: true
  shared: true
mastodon:
  bond: 1
  enabled: "{{ 'web-app-mastodon' in group_names }}"
  shared: "{{ 'web-app-mastodon' in group_names }}"
friendica:
  bond: 1
  enabled: "{{ 'web-app-friendica' in group_names }}"
  shared: "{{ 'web-app-friendica' in group_names }}"
fediwall:
  healthcheck:
    flavor: curl
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: nginx
  version: 1.31.10-alpine
  custom: true
  upstream:
    version: "1.4.0"
    tarball_url: "https://github.com/defnull/fediwall/releases/download/v1.4.0/fediwall-1.4.0.tgz"
  fediverse_siblings:
    - web-app-mastodon
    - web-app-pixelfed
    - web-app-friendica
  walls:
    - slug: default
      config:
        servers: "{{ lookup('fediwall_active', 'domains') }}"
        tags: []
        accounts: []
        loadPublic: true
        loadFederated: false
        loadTrends: false
        languages: []
        badWords: []
        hideSensitive: true
        hideBots: true
        hideReplies: true
        hideBoosts: false
        limit: 20
        interval: 10
        title: Fediwall
        theme: auto
        showInfobar: true
        showText: true
        showMedia: true
        playVideos: true
  ports:
    local:
      http: 8074
    internal:
      http: 80
  proxy:
    service_key: fediwall
  lifecycle: beta
  min_storage: 227MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
