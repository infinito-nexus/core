---
- name: "⬇️ XWIKI | Fetch REST session + form token (design write ops)"
  include_tasks: utils/rest_session.yml

- name: "🔎 XWIKI | Read the wiki color theme preference"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_PREFERENCES, 'colorTheme'] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS | combine({'Accept': 'application/json'}) }}"
    xwiki_http_body: ""
    xwiki_http_status: [200]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_color_theme

- name: "🔎 XWIKI | Read the wiki title preference"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_PREFERENCES, 'title'] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS | combine({'Accept': 'application/json'}) }}"
    xwiki_http_body: ""
    xwiki_http_status: [200]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_title

- name: "🔎 XWIKI | Look for the corporate theme page"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ XWIKI_REST_THEME_PAGE }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS }}"
    xwiki_http_body: ""
    xwiki_http_status: [200, 404]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_page

- name: "🔎 XWIKI | Read the preferences the wiki had before the corporate theme"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_THEME_PAGE, 'objects/XWiki.XWikiPreferences/0'] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS | combine({'Accept': 'application/json'}) }}"
    xwiki_http_body: ""
    xwiki_http_status: [200, 404]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_previous

- name: "🎨 XWIKI | Apply the corporate color theme"
  include_tasks: 06_design/apply.yml
  when: XWIKI_DESIGN_ENABLED | bool

- name: "🧹 XWIKI | Remove the corporate color theme"
  include_tasks: 06_design/remove.yml
  vars:
    xwiki_design_former: "{{ (_xwiki_design_previous.content | from_json).properties | items2dict(key_name='name', value_name='value') }}"
  when:
    - not (XWIKI_DESIGN_ENABLED | bool)
    - _xwiki_design_previous.status == 200
