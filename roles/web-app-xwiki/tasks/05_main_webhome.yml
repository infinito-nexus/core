---
- name: "🔎 XWIKI | Check if Main.WebHome exists"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_BASE, 'wikis/xwiki/spaces/Main/pages/WebHome'] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS }}"
    xwiki_http_body: ""
    xwiki_http_status: [200, 404]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _main_webhome_check

- name: "📁 XWIKI | Create Main.WebHome when the probe returned 404"
  when: _main_webhome_check.status == 404
  block:
    - name: "⬇️ XWIKI | Fetch REST session + form token (Main.WebHome write ops)"
      include_tasks: utils/rest_session.yml

    - name: "📁 XWIKI | Create Main.WebHome if missing"
      include_tasks: utils/http.yml
      vars:
        xwiki_http_method: PUT
        xwiki_http_url: "{{ [XWIKI_REST_BASE, 'wikis/xwiki/spaces/Main/pages/WebHome'] | url_join }}"
        xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
        xwiki_http_body: "{{ lookup('template', 'xml/main_webhome_page.xml.j2') }}"
        xwiki_http_status: [200, 201, 202, 204]
        xwiki_http_retry_markers: []
        xwiki_http_retries: 30
        xwiki_http_delay: 2
        xwiki_http_timeout: 30
        xwiki_http_follow_redirects: "safe"
        xwiki_http_result: _main_webhome_created
