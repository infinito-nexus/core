---
- name: "✅ ASSERT | superadmin can authenticate (needed for installer)"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_XWIKI, 'spaces'] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS }}"
    xwiki_http_body: ""
    xwiki_http_status: [200]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 120
    xwiki_http_delay: 5
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _super_check_ext

- block:
    - name: "🐛 DEBUG | superadmin check + pw hash compare (condensed)"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      ansible.builtin.command:
        argv:
          - bash
          - -c
          - "{{ lookup('file', 'shell/debug_superadmin.sh') }}"
          - debug_superadmin.sh
          - "{{ _super_check_ext.status }}"
          - "{{ _super_check_ext.redirected | default('n/a') }}"
          - "{{ _super_check_ext.url | default('n/a') }}"
          - "{{ _super_check_ext.www_authenticate | default(_super_check_ext.headers['www-authenticate'] | default('n/a')) }}"
          - "{{ _super_check_ext.content_type | default(_super_check_ext.headers['content-type'] | default('n/a')) }}"
          - "{{ (_super_check_ext.content | default(''))[:600] | replace('\n','\\n') }}"
          - "{{ XWIKI_CONTAINER }}"
        stdin: "{{ XWIKI_SUPERADMIN_PASSWORD }}"
        expand_argument_vars: false
      register: _dbg_superadmin
      changed_when: false
      failed_when: false

    - name: "🛑 FAIL | superadmin authentication failed (extensions phase)"
      fail:
        msg: |
          superadmin authentication failed (extensions phase)

          superadmin check status={{ _super_check_ext.status }}
          www_authenticate={{
            _super_check_ext.www_authenticate
            | default(_super_check_ext.headers['www-authenticate'] | default('n/a'))
          }}

          debug:
          {{ _dbg_superadmin.stdout | default('') }}

          hint: check xwiki.cfg in image / password / Dockerfile build
  when: _super_check_ext.status != 200

- name: 📂 Load setup procedures for admin
  include_tasks: 03_administrator.yml
  when: not (XWIKI_SSO_ENABLED | bool)

- name: 📂 Load setup procedures for extensions
  include_tasks: 04_extensions.yml

- name: "🫙 XWIKI | Move the blob store to the bucket now the extension exists"
  include_tasks: utils/flush_config.yml
  vars:
    xwiki_oidc_enabled_switch: "{{ (XWIKI_OIDC_ENABLED | bool) and (xwiki_extensions_ready | bool) }}"
    xwiki_ldap_enabled_switch: "{{ (XWIKI_LDAP_ENABLED | bool) and (xwiki_extensions_ready | bool) }}"
    xwiki_blobstore_s3_enabled_switch: "{{ XWIKI_OBJSTORE_ENABLED | bool }}"

- name: "✅ XWIKI | Ensure Main.WebHome exists"
  include_tasks: 05_main_webhome.yml

- name: "🎨 XWIKI | Reconcile the corporate color theme"
  include_tasks: 06_design.yml

- name: "🌐 XWIKI | Name the canonical origin in the main wiki descriptor"
  include_tasks: 07_wiki_descriptor.yml

- name: "🚪 XWIKI | Grant or deny guest self-registration"
  include_tasks: 08_registration.yml

- block:
    - name: "📁 Create Final Docker Compose File"
      stack_host_template:
        src: "compose.yml.j2"
        dest: "{{ lookup('container', application_id, 'files.compose') }}"
        mode: "0640"
      notify: compose-up

    - name: 🚀 Deploy Final Config
      include_tasks: utils/flush_config.yml
  vars:
    xwiki_oidc_enabled_switch: "{{ XWIKI_LOGIN_SSO | bool }}"
    xwiki_ldap_enabled_switch: "{{ XWIKI_LOGIN_LDAP | bool }}"
    xwiki_blobstore_s3_enabled_switch: "{{ XWIKI_OBJSTORE_ENABLED | bool }}"
