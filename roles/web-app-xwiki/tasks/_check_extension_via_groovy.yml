---
# PUT a temporary Groovy page that checks installed extensions, call it, then delete it.

- name: "⬇️ XWIKI | Fetch REST session + form token (extension check write ops)"
  include_tasks: utils/rest_session.yml

- name: "⬆️ XWIKI | PUT checker page XWiki.CheckExtension"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: PUT
    xwiki_http_url: "{{ [XWIKI_REST_XWIKI_PAGES, 'CheckExtension'] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('file', 'xml/check_extension_page.xml') }}"
    xwiki_http_status: [200, 201, 202, 204]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _put_checker

- name: "🔎 XWIKI | Check installed via Groovy for {{ ext_id }}"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ XWIKI_INTERNAL_URL }}/bin/view/XWiki/CheckExtension?xpage=plain&id={{ ext_id | urlencode }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS }}"
    xwiki_http_body: ""
    xwiki_http_status: [200]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _check_output

- name: "💾 XWIKI | Save Groovy check result for {{ ext_id }}"
  set_fact:
    "{{ result_var }}":
      status: "{{ _check_output.content | xwiki_extension_status(ext_version) }}"
      raw: "{{ _check_output.content }}"

- name: "🗑️ XWIKI | Delete checker page"
  include_tasks: utils/http.yml
  vars:
    xwiki_http_method: DELETE
    xwiki_http_url: "{{ [XWIKI_REST_XWIKI_PAGES, 'CheckExtension'] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: ""
    xwiki_http_status: [204, 200, 202, 404]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _delete_checker
