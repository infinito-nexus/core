---
- name: "▶️ XWIKI | Execute installer page"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ XWIKI_INTERNAL_URL }}/bin/view/XWiki/InstallExtensions?xpage=plain"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS }}"
    xwiki_http_body: ""
    xwiki_http_status: [200]
    xwiki_http_retry_markers: ["WARN::"]
    xwiki_http_retries: 12
    xwiki_http_delay: 20
    xwiki_http_timeout: "{{ lookup('timeout', 300) | int }}"
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _exec_page

- name: "✅ XWIKI | Assert installer output has no errors"
  assert:
    that:
      - (_exec_page.content | default('')) is not search('ERROR::')
      - (_exec_page.content | default('')) is not search('INSTALLED_MISSING::')
      - (_exec_page.content | default('')) is not search('WARN::')
    fail_msg: |
      XWiki extension installer reported errors.
      Output:
      {{ _exec_page.content | default('') }}
