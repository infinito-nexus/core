---
- name: "🔎 XWIKI | Read the stock theme the corporate theme derives from"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_XWIKI, 'spaces/FlamingoThemes/pages', XWIKI_DESIGN_STOCK_THEME_PAGE, XWIKI_DESIGN_THEME_OBJECT] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS | combine({'Accept': 'application/json'}) }}"
    xwiki_http_body: ""
    xwiki_http_status: [200]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_stock_theme

- name: "🔎 XWIKI | Read the corporate theme object"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: GET
    xwiki_http_url: "{{ [XWIKI_REST_THEME_PAGE, XWIKI_DESIGN_THEME_OBJECT] | url_join }}"
    xwiki_http_headers: "{{ XWIKI_SUPERADMIN_AUTH_HEADERS | combine({'Accept': 'application/json'}) }}"
    xwiki_http_body: ""
    xwiki_http_status: [200, 404]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_theme_object

- name: "🧮 XWIKI | Derive the corporate theme from the stock theme and the palette"
  ansible.builtin.set_fact:
    xwiki_design_theme_properties: >-
      {{ (_xwiki_design_stock_theme.content | from_json).properties
         | items2dict(key_name='name', value_name='value')
         | combine(XWIKI_DESIGN_THEME_COLORS, {
             'lessCode': XWIKI_DESIGN_LESS_CODE,
             'logo': XWIKI_DESIGN_LOGO_FILE if lookup('design', application_id).logo is string else '',
             'logo-description': lookup('design', application_id).label
           }) }}

- name: "➕ XWIKI | Add the corporate theme object"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: POST
    xwiki_http_url: "{{ [XWIKI_REST_THEME_PAGE, 'objects'] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('template', 'xml/design/theme/object.xml.j2') }}"
    xwiki_http_status: [201]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_theme_object_added
  when: _xwiki_design_theme_object.status == 404

- name: "🎨 XWIKI | Update the corporate theme object"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: PUT
    xwiki_http_url: "{{ [XWIKI_REST_THEME_PAGE, XWIKI_DESIGN_THEME_OBJECT] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('template', 'xml/design/theme/object.xml.j2') }}"
    xwiki_http_status: [202]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_theme_object_updated
  when:
    - _xwiki_design_theme_object.status == 200
    - >-
      ((_xwiki_design_theme_object.content | from_json).properties | items2dict(key_name='name', value_name='value'))
      != xwiki_design_theme_properties
