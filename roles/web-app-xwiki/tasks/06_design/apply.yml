---
- name: "🛑 XWIKI | Refuse a theme page this role did not create"
  ansible.builtin.assert:
    that:
      - _xwiki_design_page.status == 404 or _xwiki_design_previous.status == 200
    fail_msg: >-
      The page {{ XWIKI_DESIGN_THEME_REFERENCE }} exists without the XWiki.XWikiPreferences object
      this role stores on it. Rename or delete that page, then deploy again.

- name: "✅ XWIKI | Assert the theme values are six-digit hex colors"
  ansible.builtin.assert:
    that:
      - XWIKI_DESIGN_THEME_COLORS.values() | reject('match', '^#[0-9a-fA-F]{6}$') | list | length == 0
      - XWIKI_DESIGN_LESS_COLORS.values() | reject('match', '^#[0-9a-fA-F]{6}$') | list | length == 0
    fail_msg: "A value less4j cannot type breaks the whole skin stylesheet."

- name: "📁 XWIKI | Ensure the design directory exists"
  ansible.builtin.file:
    path: "{{ XWIKI_DESIGN_DIR }}"
    state: directory
    mode: "0755"

- name: "🖼️ XWIKI | Render the corporate logo set"
  ansible.builtin.include_role:
    name: sys-front-inj-design
    tasks_from: assets.yml
  vars:
    design_assets_dest: "{{ XWIKI_DESIGN_DIR }}"

- name: "📄 XWIKI | Create the corporate theme page"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: PUT
    xwiki_http_url: "{{ XWIKI_REST_THEME_PAGE }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('template', 'xml/design/theme/page.xml.j2') }}"
    xwiki_http_status: [201]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_page_created
  when: _xwiki_design_page.status == 404

- name: "💾 XWIKI | Remember the preferences the wiki had"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_http_method: POST
    xwiki_http_url: "{{ [XWIKI_REST_THEME_PAGE, 'objects'] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('template', 'xml/design/previous_preferences_object.xml.j2') }}"
    xwiki_http_status: [201]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_previous_stored
  when: _xwiki_design_previous.status == 404

- name: "📂 XWIKI | Write the theme object"
  include_tasks: theme.yml

- name: "📂 XWIKI | Attach the navbar lockup"
  include_tasks: logo.yml
  when: lookup('design', application_id).logo is string

- name: "📌 XWIKI | Make the corporate theme the wiki default"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_property_value: "{{ XWIKI_DESIGN_THEME_REFERENCE }}"
    xwiki_http_method: PUT
    xwiki_http_url: "{{ [XWIKI_REST_PREFERENCES, 'colorTheme'] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('template', 'xml/property.xml.j2') }}"
    xwiki_http_status: [202]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_color_theme_set
  when: (_xwiki_design_color_theme.content | from_json).value != XWIKI_DESIGN_THEME_REFERENCE

- name: "🏷️ XWIKI | Set the wiki title"
  include_tasks: ../utils/http.yml
  vars:
    xwiki_property_value: "{{ XWIKI_DESIGN_TITLE }}"
    xwiki_http_method: PUT
    xwiki_http_url: "{{ [XWIKI_REST_PREFERENCES, 'title'] | url_join }}"
    xwiki_http_headers: "{{ xwiki_rest_headers_write }}"
    xwiki_http_body: "{{ lookup('template', 'xml/property.xml.j2') }}"
    xwiki_http_status: [202]
    xwiki_http_retry_markers: []
    xwiki_http_retries: 30
    xwiki_http_delay: 2
    xwiki_http_timeout: 30
    xwiki_http_follow_redirects: "safe"
    xwiki_http_result: _xwiki_design_title_set
  when:
    - lookup('design', application_id).title is string
    - (_xwiki_design_title.content | from_json).value != XWIKI_DESIGN_TITLE
