---
- name: "⬇️ XWIKI | Fetch REST session + form token (registration right)"
  include_tasks: utils/rest_session.yml

- name: "🔎 XWIKI | List the global rights objects of XWikiPreferences"
  uri_retry:
    url: "{{ XWIKI_REST_GLOBAL_RIGHTS }}"
    method: GET
    url_username: "{{ XWIKI_SUPERADMIN_USERNAME }}"
    url_password: "{{ XWIKI_SUPERADMIN_PASSWORD }}"
    force_basic_auth: true
    status_code: [200]
    headers:
      Accept: application/json
    return_content: true
  register: _xwiki_global_rights
  changed_when: false

- name: "🔎 XWIKI | Read the properties of every global rights object"
  uri_retry:
    url: "{{ [XWIKI_REST_GLOBAL_RIGHTS, xwiki_global_right.number | string] | url_join }}"
    method: GET
    url_username: "{{ XWIKI_SUPERADMIN_USERNAME }}"
    url_password: "{{ XWIKI_SUPERADMIN_PASSWORD }}"
    force_basic_auth: true
    status_code: [200]
    headers:
      Accept: application/json
    return_content: true
  loop: "{{ _xwiki_global_rights.json.objectSummaries }}"
  loop_control:
    loop_var: xwiki_global_right
    label: "{{ xwiki_global_right.number }}"
  register: _xwiki_global_right_objects
  changed_when: false

- name: "🧮 XWIKI | Start an empty list of registration denials"
  ansible.builtin.set_fact:
    _xwiki_registration_denials: []

- name: "🧮 XWIKI | Collect the rights objects that deny the guest registration"
  ansible.builtin.set_fact:
    _xwiki_registration_denials: "{{ _xwiki_registration_denials + [xwiki_rights_object.json.number] }}"
  loop: "{{ _xwiki_global_right_objects.results }}"
  loop_control:
    loop_var: xwiki_rights_object
    label: "{{ xwiki_rights_object.json.number }}"
  vars:
    xwiki_rights_properties: "{{ xwiki_rights_object.json.properties | items2dict(key_name='name', value_name='value') }}"
  when:
    - xwiki_rights_properties.get('users') | string == XWIKI_REGISTRATION_GUEST
    - xwiki_rights_properties.get('levels') | string == 'register'
    - xwiki_rights_properties.get('allow') | string in ['0', 'false']

- name: "🚫 XWIKI | Deny self-registration to the guest"
  uri_retry:
    url: "{{ XWIKI_REST_PREFERENCES_OBJECTS }}"
    method: POST
    url_username: "{{ XWIKI_SUPERADMIN_USERNAME }}"
    url_password: "{{ XWIKI_SUPERADMIN_PASSWORD }}"
    force_basic_auth: true
    status_code: [200, 201]
    headers: "{{ xwiki_rest_headers_write }}"
    body: "{{ lookup('template', 'xml/rights/registration_denial.xml.j2') }}"
  when:
    - not (XWIKI_LOGIN_REGISTRATION | bool)
    - _xwiki_registration_denials | length == 0
  changed_when: true

- name: "✅ XWIKI | Allow self-registration to the guest again"
  uri_retry:
    url: "{{ [XWIKI_REST_GLOBAL_RIGHTS, xwiki_registration_denial | string] | url_join }}"
    method: DELETE
    url_username: "{{ XWIKI_SUPERADMIN_USERNAME }}"
    url_password: "{{ XWIKI_SUPERADMIN_PASSWORD }}"
    force_basic_auth: true
    status_code: [200, 204]
    headers: "{{ xwiki_rest_headers_write }}"
  loop: "{{ _xwiki_registration_denials }}"
  loop_control:
    loop_var: xwiki_registration_denial
  when: XWIKI_LOGIN_REGISTRATION | bool
  changed_when: true
