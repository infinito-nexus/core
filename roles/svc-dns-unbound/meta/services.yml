---
# nocheck: garbage-collector-required  resolver cache lives in memory
unbound:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  engine on-disk state (trust anchors / root hints), node-local in swarm
  placement: manager
  enabled: true
  shared: true
  bond: 1
  image: ghcr.io/mailu/unbound
  name: unbound
  version: "2024.06"
  min_storage: 283MB
  backup:
    disabled: true
  cpus: "0.5"
  mem_reservation: "128m"
  mem_limit: "512m"
  pids_limit: 256
  ports:
    internal:
      unbound: 53
  lifecycle: beta
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "2024.06"
        until: 2026-11-30

# nocheck: dynamic-flag - the resolver state volume is backup-disabled rebuildable cache, the backup consumer stays permanently off
container_backup:
  enabled: false
  shared: true

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  resolver the platform's containers query, so pausing it would cut name resolution for every consumer
  status: started
