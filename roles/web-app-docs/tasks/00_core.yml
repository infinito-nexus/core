---
- include_tasks: utils/once/flag.yml

- name: "🎬 Stage the Sphinx tooling into the build context of '{{ application_id }}'"
  stack_host_copy:
    src: "{{ item }}/"
    dest: "{{ [DOCS_TOOLING_DIR, item] | path_join }}/"
    directory_mode: "0755"
  loop:
    - python
    - javascript
  notify:
    - compose-build
    - compose-up

- name: "📂 Reserve a controller file for the snapshot of '{{ application_id }}'"
  ansible.builtin.tempfile:
    suffix: .tar.zst
  register: docs_snapshot_archive
  delegate_to: localhost
  become: false
  run_once: true

- name: "📸 Archive the deployed working tree for '{{ application_id }}'"
  ansible.builtin.shell: >-
    set -o pipefail &&
    find {{ DOCS_SNAPSHOT_PATHS | join(' ') }}
    -name __pycache__ -prune -o -name node_modules -prune -o -name '*.pyc' -prune -o -print0
    | LC_ALL=C sort -z
    | tar --no-recursion --null --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -T -
    | zstd -q -9 -T2 --long=27 > {{ docs_snapshot_archive.path | quote }}
  args:
    chdir: "{{ lookup('path_absolute', '.') }}"
    executable: /bin/bash
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: "📦 Stage the snapshot into the build context of '{{ application_id }}'"
  stack_host_copy:
    src: "{{ docs_snapshot_archive.path }}"
    dest: "{{ [DOCS_TOOLING_DIR, 'snapshot.tar.zst'] | path_join }}"
  notify:
    - compose-build
    - compose-up

- name: "🧹 Remove the retired gzip snapshot of '{{ application_id }}'"
  when: IS_STACK_HOST | bool
  ansible.builtin.file:
    path: "{{ [DOCS_TOOLING_DIR, 'snapshot.tar.gz'] | path_join }}"
    state: absent

- name: "🧹 Remove the controller snapshot of '{{ application_id }}'"
  ansible.builtin.file:
    path: "{{ docs_snapshot_archive.path }}"
    state: absent
  delegate_to: localhost
  become: false
  run_once: true

- name: "🚿 Flush compose handlers for '{{ application_id }}'"
  ansible.builtin.meta: flush_handlers

- name: "🔍 Resolve the node and container of '{{ application_id }}'"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ DOCS_SERVICE }}"
    resolve_output_prefix: DOCS
    resolve_compose_cid: "{{ DOCS_CONTAINER }}"

- name: "🔍 Resolve the network namespace of '{{ application_id }}' for the build queue"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns.yml') }}"
  vars:
    netns_output_prefix: DOCS

- name: "🔥 Queue the build of the deployed working tree for '{{ application_id }}'"
  ansible.builtin.command:
    argv: "{{ DOCS_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', '') }}"
  environment:
    HTTP_METHOD: GET
    HTTP_URL: "{{ DOCS_NETNS_BASE_URL }}/deployed/{{ item }}"
  loop: "{{ DOCS_I18N_PRELOAD_PATHS }}"
  register: docs_deployed_warm
  until: docs_deployed_warm.rc == 0 and (docs_deployed_warm.stdout | from_json).status in [200, 202]
  retries: 12
  delay: 10
  changed_when: false
  delegate_to: "{{ DOCS_HOST_NODE }}"
  become: true
