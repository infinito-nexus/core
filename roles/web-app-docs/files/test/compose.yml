---
services:
  machine:
    build:
      context: .
      args:
        MACHINE_BASE_IMAGE: ${MACHINE_BASE_IMAGE}
    init: false
    privileged: true
    cgroup: host
    network_mode: bridge
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - engine:/var/lib/docker

volumes:
  engine:
