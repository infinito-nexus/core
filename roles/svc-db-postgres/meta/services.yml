---
postgres:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  the manager placement applies to the standalone form only; HA instances pin per host via the instance model
  placement: manager
  bond: 1
  enabled: true
  shared: true
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
  image: postgres
  name: postgres
  version: "18"
  patroni_version: "4.1.5-2.pgdg13+1"
  update:
    key: patroni_version
    type: http_regex
    url: https://apt.postgresql.org/pub/repos/apt/dists/trixie-pgdg/main/binary-amd64/Packages
    pattern: 'Package: patroni\nVersion: (?P<version>[0-9]+\.[0-9]+\.[0-9]+)-(?P<revision>[0-9]+)\.pgdg13\+(?P<build>[0-9]+)\n'
    template: "{version}-{revision}.pgdg13+{build}"
  custom: true
  min_storage: 419MB
  backup:
    database_routine: true
  cpus: "2.0"
  mem_reservation: 3g
  mem_limit: 6g
  pids_limit: 1024
  exposed: false
  ports:
    local:
      postgres: 5432
    internal:
      postgres: 5432
      patroni: 8008
  ha:
    capable: true
    primary_probe: http
    backup: sql
    endpoint:
      port: postgres
      check: http
      check_port: patroni
      check_path: /primary
      check_timeout: 3
      check_fall: 5
  lifecycle: beta
haproxy:
  cpus: "0.25"
  mem_reservation: 64m
  mem_limit: 128m
  pids_limit: 256
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

# nocheck: playwright-service-flag, dynamic-flag, variants-coverage  Patroni joins the coordination-store overlay only in the HA form, which the instance count selects, not a variant
etcd: # nocheck: bond-baseline coordination store joins by instance count, outside the variant topology
  bond: 1
  enabled: "{{ lookup('db_instances', 'svc-db-postgres').form == 'ha' }}"
  shared: true
  user: patroni
  prefix: /service/

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
