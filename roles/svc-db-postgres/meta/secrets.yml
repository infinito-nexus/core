---
credentials:
  POSTGRES_PASSWORD:
    description: Password for the PostgreSQL superuser 'postgres'
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  POSTGRES_REPLICATION_PASSWORD:
    description: Password of the 'replicator' role Patroni standbys stream with in the HA form
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  POSTGRES_REWIND_PASSWORD:
    description: Password of the 'rewinder' role pg_rewind connects with in the HA form
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  etcd_password:
    description: Password of the etcd user Patroni uses in the HA form, restricted to its coordination-store prefix
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  POSTGRES_PATRONI_RESTAPI_PASSWORD:
    description: Password guarding Patroni's state-changing REST calls and patronictl in the HA form
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
