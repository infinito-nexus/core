---
- name: "🧩 POSTGRES | Load the container runtime the detection talks to"
  ansible.builtin.include_role:
    name: sys-svc-container
    public: false
  when: run_once_sys_svc_container is not defined

- name: "🔍 POSTGRES | Detect the cluster before the deploy"
  ansible.builtin.include_tasks:
    file: detect.yml
    apply:
      run_once: true

- name: "🛑 POSTGRES | Stop: swarm cannot upgrade an older cluster in place"
  ansible.builtin.fail:
    msg: >-
      {{ postgres_cluster.source_path }} holds a PostgreSQL
      {{ postgres_cluster.major }} cluster, but this deploy pins PostgreSQL {{ POSTGRES_VERSION_MAJOR }}.
      The in-place upgrade runs in compose mode only; upgrade the cluster on a compose host
      or restore a dump into PostgreSQL {{ POSTGRES_VERSION_MAJOR }}.
  when:
    - postgres_cluster.state == 'upgrade'
    - DEPLOYMENT_MODE == 'swarm'

- name: "⬆️ POSTGRES | Upgrade the older cluster to the pinned major"
  ansible.builtin.include_tasks:
    file: run.yml
    apply:
      run_once: true
  when: postgres_cluster.state == 'upgrade'
