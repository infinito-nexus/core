---
- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    webserver_extra_configuration: "client_max_body_size 512M;"

- name: "🧱 Render the front nginx override of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "nginx.conf.j2"
        dest: "{{ FUNKWHALE_FRONT_NGINX_HOST }}"
        mode: "0444"
  when: FUNKWHALE_OBJSTORE_ENABLED | bool

- name: "🎨 Render the Django admin template of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "admin_base_site.html.j2"
        dest: "{{ FUNKWHALE_ADMIN_TEMPLATE_HOST }}"
        mode: "0644"
  when: FUNKWHALE_DESIGN_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers

- name: "🏛️ Converge the administrator and the instance theming of {{ application_id }}"
  ansible.builtin.include_tasks: 01_manager.yml
