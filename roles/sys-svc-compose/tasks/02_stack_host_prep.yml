---
- name: "📁 Create sys-svc-compose dirs and probe '{{ application_id }}'"
  compose_instance_prepare:
    directories: "{{ lookup('container', application_id, 'directories').values() | list }}"
    mode: "0755"
    instance: "{{ lookup('container', application_id, 'directories.instance') }}"
    pending_marker: "{{ COMPOSE_UP_PENDING_MARKER }}"
    running_check: "{{ compose_mode == 'compose' }}"
  register: compose_instance_before_files

- name: "📝 Record '{{ application_id }}' as a compose instance of this play"
  ansible.builtin.set_fact:
    compose_prepared_application_ids: "{{ compose_prepared_application_ids | union([application_id]) }}"

- name: "🛡️ Ensure PHP hardening assets are installed"
  ansible.builtin.include_role:
    name: sys-svc-compose-php

- name: "📂 Include git-repo based installation routines for '{{ application_id }}'."
  include_tasks: "03_repository.yml"
  when: compose_repository_pull | bool

- name: "📂 Include file management routines for '{{ application_id }}'."
  include_tasks: "04_files.yml"

- name: "✅ Ensure CA trust assets are installed (only when needed)"
  ansible.builtin.include_role:
    name: sys-svc-compose-ca
