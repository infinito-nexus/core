---
- name: "⏳ Wait until database container for '{{ application_id }}' is healthy"
  ansible.builtin.command: >-
    container inspect --type container
    --format={% raw %}{{.State.Health.Status}}{% endraw %}
    {{ lookup('database', application_id, 'container') }}
  register: _app_db_health
  retries: 60
  delay: 2
  changed_when: false
  until: (_app_db_health.stdout | trim) == 'healthy'
  when:
    - (compose_mode_force | default('') or DEPLOYMENT_MODE) == 'compose'
    - lookup('database', application_id, 'enabled') | bool

- name: "🔑 Realign the password a dedicated postgres kept from its initdb"
  ansible.builtin.script: > # nocheck: container-address-quote script evals the fragment itself
    {{ lookup('path_absolute', 'roles/svc-db-postgres/files/shell/set_postgres_superuser_password.sh') }}
    {{ lookup('database', application_id, 'container') | quote }}
    {{ lookup('database', application_id, 'password') | quote }}
    {{ lookup('database', application_id, 'username') | quote }}
  register: _app_db_realign
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: _app_db_realign.stdout is search('\\[CHANGED\\]')
  failed_when: _app_db_realign.rc != 0 or _app_db_realign.stdout is search('\\[FAIL\\]')
  when:
    - (compose_mode_force | default('') or DEPLOYMENT_MODE) == 'compose'
    - lookup('database', application_id, 'local') | bool
    - lookup('database', application_id, 'type') == 'postgres'

- name: "🔑 Realign the password an app persisted in its own config"
  ansible.builtin.include_tasks: "{{ _app_persisted_credentials }}"
  vars:
    _app_persisted_credentials: "{{ lookup('path_absolute', 'roles/' ~ application_id ~ '/tasks/utils/patch/db_credentials.yml') }}"
  when: _app_persisted_credentials is exists

- name: "⏳ Wait until swarm tasks of '{{ application_id | get_entity_name }}' are running"
  ansible.builtin.script: "{{ lookup('path_absolute', 'roles/sys-svc-compose/files/shell/swarm/stack_ready.sh') }}"
  environment:
    STACK: "{{ application_id | get_entity_name }}"
    FATAL_GRACE: "{{ swarm_stack_fatal_grace }}"
  register: _swarm_tasks_ready
  retries: "{{ swarm_stack_converge_retries }}"
  delay: 2
  changed_when: false
  until: _swarm_tasks_ready.rc in [0, 2]
  when: (compose_mode_force | default('') or DEPLOYMENT_MODE) == 'swarm'
