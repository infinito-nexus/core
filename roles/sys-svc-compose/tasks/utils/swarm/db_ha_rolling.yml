---
# Param: application_id - HA-capable engine role (its meta declares ha.capable)
- name: "🔁 db_ha_rolling | ordered member roll for '{{ application_id }}'"
  ansible.builtin.include_tasks: db_ha_rolling_run.yml
  when:
    - DEPLOYMENT_MODE == 'swarm'
    - _roll_model.form == 'ha'
    - not (DB_HA_MIGRATING.get(application_id, false) | bool)
  vars:
    _roll_stack: "{{ application_id | get_entity_name }}"
    _roll_model: "{{ lookup('db_instances', application_id) }}"
    _roll_instances: "{{ _roll_model.instances | map(attribute='service') | list }}"
    _roll_sidecars: >-
      {{ (_roll_model.instances | map(attribute='host_id')
          | map('regex_replace', '^', _roll_stack ~ '-' ~ _roll_model.ha.sidecar ~ '-') | list)
         if _roll_model.ha.sidecar else [] }}
    _roll_has_primary: "{{ _roll_model.ha.probe is not none }}"
    _roll_backup: "{{ _roll_model.ha.backup is not none and (groups[lookup('db_backup', 'role')] | default([]) | length) > 0 }}"
