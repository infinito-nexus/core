---
# Param: application_id     - HA-capable engine role
# Param: _roll_stack        - swarm stack of the engine
# Param: _roll_instances    - instance service keys
# Param: _roll_sidecars     - per-host sidecar service keys rolled before the instances
# Param: _roll_has_primary  - whether the engine has a primary to hand over from
# Param: _roll_backup       - whether the engine is backed up before members restart
- name: "📄 db_ha_rolling | rendered stack of '{{ application_id }}'"
  ansible.builtin.shell: |
    set -euo pipefail
    docker stack config {{ lookup('compose_file_args', application_id, flag='--compose-file') }}
  args:
    chdir: "{{ lookup('container', application_id, 'directories.instance') }}"
    executable: /bin/bash
  register: _roll_config
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  run_once: true
  delegate_to: "{{ STACK_HOST }}"

- name: "🔍 db_ha_rolling | running spec of every member"
  ansible.builtin.command:
    argv:
      - container
      - service
      - inspect
      - "{{ _roll_stack ~ '_' ~ item }}"
      - --format
      - "{{ '{{json .Spec}}' }}"
  register: _roll_running
  changed_when: false
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  loop: "{{ _roll_sidecars + _roll_instances }}"
  run_once: true
  delegate_to: "{{ STACK_HOST }}"

- name: "🔧 db_ha_rolling | members the stack deploy would restart"
  ansible.builtin.set_fact:
    DB_HA_ROLL_PRIMARY_INSTANCE: ""
    _roll_changed: "{{ _roll_config.stdout | swarm_drifted_members(_roll_stack, _roll_running.results) }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  run_once: true

- name: "🧾 db_ha_rolling | fields that make '{{ application_id }}' roll"
  ansible.builtin.debug:
    msg: "{{ _roll_config.stdout | swarm_drift_report(_roll_stack, _roll_running.results) }}"
  when: _roll_changed | length > 0
  run_once: true

- name: "🔍 db_ha_rolling | probe each member of '{{ application_id }}' for the primary"
  ansible.builtin.command:
    argv:
      - "{{ [DIR_BIN, _roll_model.ha.probe] | path_join }}"
      - "{{ _roll_stack }}"
      - "{{ item.service }}"
  register: _roll_probe
  changed_when: false
  failed_when: false
  delegate_to: "{{ item.host }}"
  loop: "{{ _roll_model.instances }}"
  loop_control:
    label: "{{ item.service }}"
  when:
    - _roll_has_primary | bool
    - (_roll_changed | intersect(_roll_instances)) | length > 0

- name: "🔧 db_ha_rolling | whether a primary answers"
  ansible.builtin.set_fact:
    _roll_primary_answers: >-
      {{ (_roll_probe.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length > 0)
         if (_roll_probe.results is defined) else false }}
  run_once: true

- name: "🔍 db_ha_rolling | current primary of '{{ application_id }}'"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve/primary.yml') }}"
  vars:
    primary_application_id: "{{ application_id }}"
    primary_output_prefix: DB_HA_ROLL
  when: _roll_primary_answers | bool

- name: "🔧 db_ha_rolling | order: sidecars, replicas, then the old primary"
  ansible.builtin.set_fact:
    _roll_primary: "{{ DB_HA_ROLL_PRIMARY_INSTANCE if (_roll_has_primary | bool) else '' }}"
    _roll_first: "{{ _roll_changed | reject('equalto', DB_HA_ROLL_PRIMARY_INSTANCE) | list }}"
  run_once: true

- name: "💾 db_ha_rolling | back up before restarting members of '{{ application_id }}'"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/db/pre_change_backup.yml') }}"
  vars:
    backup_application_id: "{{ application_id }}"
    backup_reason: rolling member restart
  when:
    - _roll_changed | length > 0
    - _roll_backup | bool
    - (_roll_primary_answers | bool) or not (_roll_has_primary | bool)

- name: "🔄 db_ha_rolling | roll one member at a time"
  ansible.builtin.include_tasks: db_ha_rolling_member.yml
  loop: "{{ _roll_first }}"
  loop_control:
    loop_var: roll_member

- name: "🔄 db_ha_rolling | hand over and roll the old primary last"
  when:
    - _roll_primary | length > 0
    - _roll_primary in _roll_changed
  block:
    - name: "🔀 db_ha_rolling | planned handover away from the old primary"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/' ~ application_id ~ '/tasks/utils/handover.yml') }}"
      vars:
        handover_primary: "{{ _roll_primary }}"
      when: lookup('path_absolute', 'roles/' ~ application_id ~ '/tasks/utils/handover.yml') is file

    - name: "🔄 db_ha_rolling | roll the old primary last"
      ansible.builtin.include_tasks: db_ha_rolling_member.yml
      vars:
        roll_member: "{{ _roll_primary }}"
