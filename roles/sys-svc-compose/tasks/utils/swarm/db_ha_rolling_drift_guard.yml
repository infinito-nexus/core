---
# Param: application_id - HA-capable engine role (its meta declares ha.capable)
- name: "🛡️ drift guard | members of '{{ application_id }}' off their rendered spec"
  when:
    - IS_SWARM_MODE | bool
    - _guard_model.form == 'ha'
    - not (DB_HA_MIGRATING.get(application_id, false) | bool)
  vars:
    _guard_stack: "{{ application_id | entity_name }}"
    _guard_model: "{{ lookup('db_instances', application_id) }}"
    _guard_members: >-
      {{ ((_guard_model.instances | map(attribute='host_id')
           | map('regex_replace', '^', _guard_stack ~ '-' ~ _guard_model.ha.sidecar ~ '-') | list)
          if _guard_model.ha.sidecar else [])
         + (_guard_model.instances | map(attribute='service') | list) }}
  run_once: true
  block:
    - name: "📄 drift guard | rendered stack of '{{ application_id }}'"
      ansible.builtin.shell: |
        set -euo pipefail
        docker stack config {{ lookup('compose_file_args', application_id, flag='--compose-file') }}
      args:
        chdir: "{{ lookup('container', application_id, 'directories.instance') }}"
        executable: /bin/bash
      register: _guard_config
      changed_when: false
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      delegate_to: "{{ STACK_HOST }}"

    - name: "🔍 drift guard | running spec of every member"
      ansible.builtin.command:
        argv:
          - container
          - service
          - inspect
          - "{{ _guard_stack ~ '_' ~ item }}"
          - --format
          - "{{ '{{json .Spec}}' }}"
      register: _guard_running
      changed_when: false
      failed_when: false
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      loop: "{{ _guard_members }}"
      delegate_to: "{{ STACK_HOST }}"

    - name: "🛑 drift guard | fail when a member of '{{ application_id }}' kept its spec"
      ansible.builtin.fail:
        msg: >-
          The stack deploy of '{{ application_id }}' converged, but these HA members still run a spec
          that differs from the rendered one, so a changed configuration never reached them:
          {{ _guard_config.stdout | swarm_drift_report(_guard_stack, _guard_running.results) | to_json }}
      when: (_guard_config.stdout | swarm_drifted_members(_guard_stack, _guard_running.results)) | length > 0
