---
- name: "🔍 Check running containers for '{{ application_id }}'"
  ansible.builtin.assert:
    that: >-
      compose_instance_before_files.running.rc == 0
      or compose_instance_before_files.running.stderr
      is search('(no configuration file provided|no such file or directory|env file .* not found)')
    fail_msg: "compose ps exited {{ compose_instance_before_files.running.rc }}: {{ compose_instance_before_files.running.stderr }}"
    quiet: true
  changed_when: (compose_instance_before_files.running.stdout | trim) == ""
  when:
    - compose_instance_before_files.running is not none
    - not (docker_compose_template.changed or env_template.changed or compose_override_template.changed)
  notify: compose-up

- name: "🔔 Resume the compose up a failed run left pending"
  ansible.builtin.debug:
    msg: "{{ COMPOSE_UP_PENDING_MARKER }} is still present, so the last compose up never completed"
  changed_when: true
  notify:
    - compose-build
    - compose-up
  when:
    - compose_mode == 'compose'
    - compose_instance_before_files.pending
    - compose_up_marker is not changed

- name: "🔔 Notify swarm deploy (under DEPLOYMENT_MODE == swarm)"
  ansible.builtin.debug:
    msg: "Triggering swarm stack deploy for {{ application_id }}"
  changed_when: true
  when: compose_mode == 'swarm'
  notify: swarm-deploy

- name: "🏁 Settle the compose deployment of '{{ application_id }}'"
  when: compose_handlers_flush | bool
  block:
    - name: "🔄 Flush compose up handlers for '{{ application_id }}'"
      meta: flush_handlers

    - name: "🚀 Post-deploy steps for '{{ application_id }}'"
      ansible.builtin.include_tasks:
        file: post_deploy.yml
        apply:
          delegate_to: "{{ STACK_HOST }}"
          run_once: true
