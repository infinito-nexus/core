---
- include_tasks: utils/once/flag.yml

- include_role:
    name: sys-svc-container
    public: false
  when: run_once_sys_svc_container is not defined

- name: 🗑️ Remove all compose pull locks
  file:
    path: "{{ DIR_COMPOSE_PULL_LOCK }}"
    state: absent

- name: "♻️ reset (if enabled) for {{ role_name}}"
  include_tasks: 01_reset.yml
  when: MODE_RESET | bool

- name: "📁 create {{ DIR_COMPOSITIONS }}"
  file:
    path: "{{ DIR_COMPOSITIONS }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: 📦 Install compose wrapper
  become: true
  ansible.builtin.copy:
    src: "python/compose.py"
    dest: "{{ BIN_COMPOSE }}"
    mode: "0755"
    owner: root
    group: root

- name: 📦 Install resolve-container-id helper (Swarm task → container ID)
  become: true
  ansible.builtin.copy:
    src: "shell/resolve/container_id.sh"
    dest: "{{ BIN_RESOLVE_CONTAINER_ID }}"
    mode: "0755"
    owner: root
    group: root

- name: 📦 Install resolve-db-primary helper (HA database → primary container ID)
  become: true
  ansible.builtin.copy:
    src: "shell/resolve/db_primary.sh"
    dest: "{{ BIN_RESOLVE_DB_PRIMARY }}"
    mode: "0755"
    owner: root
    group: root

- name: 📦 Install db-client helper (HA database client through the write endpoint)
  become: true
  ansible.builtin.copy:
    src: "shell/resolve/db_client.sh"
    dest: "{{ BIN_DB_CLIENT }}"
    mode: "0755"
    owner: root
    group: root

- name: 📦 Install each HA engine's primary probe next to resolve-db-primary
  become: true
  ansible.builtin.copy:
    src: "{{ lookup('path_absolute', item.src) }}"
    dest: "{{ [DIR_BIN, item.name] | path_join }}"
    mode: "0755"
    owner: root
    group: root
  loop: "{{ lookup('db_instances', primary_probes=true) }}"
  loop_control:
    label: "{{ item.name }}"

- name: "🛡️ Assert the NFS client mount is active on this swarm node"
  ansible.builtin.command: "mountpoint -q {{ DIR_VAR_LIB }}"
  register: _sys_svc_compose_nfs_mounted
  until: _sys_svc_compose_nfs_mounted.rc == 0
  retries: 10
  delay: 3
  changed_when: false
  when:
    - DEPLOYMENT_MODE == 'swarm'
    - (storage.backend | default('local')) == 'nfs'
    - (groups['svc-storage-nfs-server'] | default([])) | length > 0
    - inventory_hostname not in (groups['svc-storage-nfs-server'] | default([]))
