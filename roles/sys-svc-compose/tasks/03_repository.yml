---
- name: 🔧 Set default compose_repository_path
  set_fact:
    compose_repository_path: "{{ [ lookup('container', application_id, 'directories.services'), 'repository/' ] | path_join }}"

- name: ⬇️ Pull docker repository
  git:
    repo: "{{ compose_repository_url }}"
    dest: "{{ compose_repository_path }}"
    version: "{{ compose_repository_ref }}"
    refspec: "{{ COMPOSE_REPOSITORY_REFSPEC or omit }}"
    depth: 1
    update: true
    recursive: "{{ compose_repository_recursive | default(true) }}"
    force: true
    accept_hostkey: true
  register: docker_repo_pull
  retries: 12
  delay: 30
  until: docker_repo_pull is succeeded
  notify:
    - compose-build
    - compose-up
  become: true

- name: "🧱 Read the Dockerfiles the '{{ application_id }}' build takes from the clone"
  ansible.builtin.slurp:
    src: "{{ [compose_repository_path, item.value] | path_join }}"
  loop: "{{ compose_repository_dockerfiles | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: compose_repository_dockerfile_reads
  become: true

- name: "🧱 Refuse a '{{ application_id }}' clone whose FROM lines use undeclared bases"
  ansible.builtin.assert:
    that: compose_repository_foreign_bases | length == 0
    fail_msg: "The clone's FROM lines name {{ compose_repository_foreign_bases | join(', ') }}, outside the bases in services.stack.checkout.build.bases ({{ compose_repository_bases.values()
      | join(', ') }}). Declare the new base there first."
    quiet: true
  vars:
    compose_repository_foreign_bases: "{{ compose_repository_dockerfile_reads.results | map(attribute='content') | map('b64decode') | list | dockerfile_foreign_bases(compose_repository_bases.values()
      | list) }}"
  when: compose_repository_dockerfiles | length > 0
