---
svc-compose:
  lifecycle: beta
  repository: https://github.com/kevinveenbirkenbach/docker-compose-down-all.git
  ref: v1.0.0
  prune:
    free_floor_mib: 30720 # Free MiB on the Docker data root at or above which the storage-constrained prune handler leaves Docker data alone
    repeat_below_percent: 50 # Percent applied twice: a below-floor prune of this run that kept at least this share of the floor lets later prunes skip while free space stays above this share of what it kept; a smaller record never skips
  required_by:
    compose:
      categories: [web]
    swarm:
      categories: [web]
haproxy:
  image: haproxy
  version: 3.2.25-alpine
  backup:
    no_stop_required: true
  cpus: "0.25"
  mem_reservation: 64m
  mem_limit: 128m
  pids_limit: 256
  replicas: 2
  max_replicas_per_node: 1
