---
svc-compose:
  lifecycle: beta
  repository: https://github.com/kevinveenbirkenbach/docker-compose-down-all.git
  ref: v1.0.0
  required_by:
    compose:
      categories: [web]
    swarm:
      categories: [web]
haproxy:
  image: haproxy
  version: 3.2.25-alpine
  backup:
    no_stop_required: true
  cpus: "0.25"
  mem_reservation: 64m
  mem_limit: 128m
  pids_limit: 256
  replicas: 2
  max_replicas_per_node: 1
