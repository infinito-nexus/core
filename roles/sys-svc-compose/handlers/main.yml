---
- name: 🧹 Aggressively prune Docker data (keep networks + in-use images)
  become: true
  ansible.builtin.script:
    cmd: shell/prune.sh
  environment:
    PRUNE_FREE_FLOOR_MIB: "{{ COMPOSE_PRUNE_FREE_FLOOR_MIB }}"
    PRUNE_REPEAT_BELOW_PERCENT: "{{ COMPOSE_PRUNE_REPEAT_BELOW_PERCENT }}"
    PRUNE_LAST_FREE_MIB: "{{ compose_prune_last_free_mib }}"
  register: compose_prune_result
  changed_when: "'prune skipped' not in compose_prune_result.stdout"
  when: STORAGE_CONSTRAINED | bool
  listen:
    - compose-up
    - compose-build

- name: 📝 Record the free space the last prune kept below the floor
  ansible.builtin.set_fact:
    compose_prune_last_free_mib: "{{ compose_prune_result.stdout | regex_findall('kept ([0-9]+) MiB free after the prune') | last | default('') }}"
  when:
    - STORAGE_CONSTRAINED | bool
    - compose_prune_result is changed
  listen:
    - compose-up
    - compose-build

- ansible.builtin.import_tasks: compose.yml
  when: compose_mode == 'compose'

- ansible.builtin.import_tasks: swarm.yml
  when: compose_mode == 'swarm'
