---
- name: 🧹 Aggressively prune Docker data (keep networks + in-use images)
  become: true
  ansible.builtin.script:
    cmd: shell/prune.sh
  environment:
    PRUNE_FREE_FLOOR_MIB: "{{ compose_prune_free_floor_mib }}"
  register: compose_prune_result
  changed_when: "'prune skipped' not in compose_prune_result.stdout"
  when: STORAGE_CONSTRAINED | bool
  listen:
    - compose-up
    - compose-build

- ansible.builtin.import_tasks: compose.yml
  when: compose_mode == 'compose'

- ansible.builtin.import_tasks: swarm.yml
  when: compose_mode == 'swarm'
