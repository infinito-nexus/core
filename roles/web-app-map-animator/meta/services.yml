---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
map-animator:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  backup:
    stop_required: true
  image: ghcr.io/versatiles-org/versatiles-map-animator
  # nocheck: docker-version -- upstream publishes no release tag yet; sha-<commit>-server names one build of the server stage, and the image lookup joins every pin with ':' so a digest pin cannot be expressed
  version: sha-88a98f4-server
  name: map-animator
  healthcheck:
    flavor: http_status
    path: renders/login
  ports:
    internal:
      http: 8080
    local:
      http: 8000
      sso: 16490
      sso_onion: 16551
  lifecycle: alpha
  min_storage: 1GB
  cpus: "2.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
  # nocheck: single-replica the render queue and the login sessions live in the memory of one server process, so a second replica renders the same job twice and rejects the sessions of the first
  replicas: 1
  keep_days: 28
  max_queued_per_user: 10
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oauth2:
    origin:
      host: map-animator
      port: "{{ lookup('config', 'web-app-map-animator', 'services.map-animator.ports.internal.http') }}"
# nocheck: dynamic-flag
# nocheck: logout  upstream keeps its session in server memory and trusts no proxy header, so only its own logout button ends it; a rewrite to the Keycloak end-session endpoint would leave that session alive
logout:
  enabled: false
  shared: false
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
# nocheck: shared-provider a custom role pulled from its own repository registers the key; without it the key resolves to no role and nothing changes
cosmos:
  flavor: colors
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag
container_backup: # nocheck: bond-baseline
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
