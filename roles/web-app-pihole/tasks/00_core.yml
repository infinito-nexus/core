---
- include_tasks: utils/once/flag.yml

- name: "🧩 Load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

# nocheck: swarm-loopback-port unused  web-app-pihole opts out of swarm (meta/services.yml pihole.modes.swarm.enabled: false), so this wait never runs there
- name: "⏳ Wait for Pi-hole HTTP endpoint"
  wait_for:
    host: "{{ DOCKER_REACH_HOST }}"
    port: "{{ lookup('config', application_id, 'services.pihole.ports.local.http') }}"
    delay: 5
    timeout: "{{ lookup('timeout', 300) | int }}"
