---
# General
application_id: "web-app-pihole"
entity_name: "{{ application_id | entity_name }}"
domain: "{{ lookup('domain', application_id) }}"

PIHOLE_CONTAINER: "{{ entity_name }}"
PIHOLE_WEBSERVER: "{{ lookup('form_values', application_id, 'webserver') }}"
PIHOLE_WEBHOME: "{{ PIHOLE_WEBSERVER.webhome }}"
PIHOLE_PASSWORD: "{{ PIHOLE_WEBSERVER.web_login | default('') }}"
