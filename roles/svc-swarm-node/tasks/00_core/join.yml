---
- name: "✅ Install dockerd and the container CLI before the ingress guard"
  ansible.builtin.include_role:
    name: sys-svc-container
    public: false
  when: run_once_sys_svc_container is not defined

- name: "🛡️ Bound the ports the routing mesh publishes before the node joins"
  ansible.builtin.include_tasks: 00_core/ingress_guard.yml

- name: "🥾 Bootstrap docker swarm cluster"
  ansible.builtin.include_tasks: 00_core/bootstrap_cluster.yml

- name: "🛡️ Admit the joined nodes to the bound on every node"
  ansible.builtin.include_tasks: utils/ingress_guard/refresh.yml
