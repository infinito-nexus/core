---
- name: "🔎 Check if LDAP configuration exists"
  database_query:
    mask_values: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    config: "{{ lookup('database', application_id) }}"
    query_file: "{{ role_path }}/files/sql/select/res_company_ldap/exists.sql"
    named_args:
      ldap_server: "{{ ODOO_LDAP_CONFIG.ldap_server }}"
    expect_rows: true
  register: ldap_check

- name: "🔄 Update existing LDAP configuration"
  database_query:
    mask_values: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    config: "{{ lookup('database', application_id) }}"
    query_file: "{{ role_path }}/files/sql/update/res-company-ldap.sql"
    named_args: "{{ ODOO_LDAP_DIRECTORY | combine(ODOO_LDAP_CONFIG) }}"
  when: ldap_check.rows | length > 0

- name: "📁 Create new LDAP configuration"
  database_query:
    mask_values: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    config: "{{ lookup('database', application_id) }}"
    query_file: "{{ role_path }}/files/sql/insert-res-company-ldap.sql"
    named_args: "{{ ODOO_LDAP_DIRECTORY | combine(ODOO_LDAP_CONFIG) }}"
  when: ldap_check.rows | length == 0
