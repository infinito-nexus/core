---
- name: "🚀 Deploy the shared JVM CA trust wrapper for the backend"
  stack_host_copy:
    src: "{{ lookup('path_absolute', 'roles/sys-ca-selfsigned/files/shell/java-with-ca-trust.sh') }}"
    dest: "{{ [ lookup('container', application_id, 'directories.instance'), 'java-with-ca-trust.sh' ] | path_join }}"
    mode: "0755"
  notify: compose-up

- name: "🚿 Flush docker service for '{{ application_id }}'"
  ansible.builtin.meta: flush_handlers

- name: "⏳ Wait until the Penpot backend migrated its schema"
  when: IS_STACK_HOST | bool
  block:
    - name: "🔍 Resolve the node that holds the Penpot backend and its local id"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
      vars:
        resolve_service_key: "{{ PENPOT_BACKEND_SERVICE }}"
        resolve_output_prefix: PENPOT_BACKEND
        resolve_compose_cid: "{{ PENPOT_BACKEND_CONTAINER_ADDRESS }}"

    - name: "⏳ Wait until the Penpot backend serves HTTP after its migrations"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/wait_container_port.yml') }}"
      vars:
        wait_output_prefix: PENPOT_BACKEND
        wait_port: "{{ PENPOT_BACKEND_INTERNAL_PORT }}"
        wait_timeout: "{{ lookup('timeout', 600) | int }}"

- name: "🥾 Bootstrap the Penpot administrator's local account"
  ansible.builtin.include_tasks:
    file: 01_administrator.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      delegate_to: "{{ PENPOT_BACKEND_HOST_NODE }}"
  when:
    - IS_STACK_HOST | bool
    - (PENPOT_LOGIN_NATIVE | bool) or (PENPOT_LOGIN_LDAP | bool)

- name: "👥 Map the role groups onto the shared platform team"
  ansible.builtin.include_tasks: 02_rbac.yml
