---
enabled: "{{ (lookup('config', 'web-app-nextcloud', 'services.openwebui.enabled') | bool) or (lookup('config', 'web-app-nextcloud', 'services.litellm.enabled') |
  bool) or (lookup('config', 'web-app-nextcloud', 'services.flowise.enabled') | bool) }}"
required: true
mechanism: plugin
source: upstream
bridges:
  - openwebui
  - litellm
  - flowise
config:
  plugin_configuration:
    - appid: "integration_openai"
      configkey: "url"
      configvalue: "{{ (lookup('tls', 'web-app-openwebui', 'url.origin') ~ '/api') if ('web-app-openwebui' in group_names) else (LITELLM_BASE_LOCAL_URL ~ '/v1') }}"
    - appid: "integration_openai"
      configkey: "stt_url"
      configvalue: "{{ NEXTCLOUD_SPEECH_TO_TEXT_URL if (NEXTCLOUD_SPEECH_TO_TEXT_ENABLED | bool) else '' }}"
    - appid: "integration_openai"
      configkey: "stt_request_timeout"
      configvalue: "{{ NEXTCLOUD_SPEECH_TO_TEXT_TIMEOUT }}"
    - appid: "integration_openai"
      configkey: "stt_provider_enabled"
      configvalue: "{{ '1' if (NEXTCLOUD_SPEECH_TO_TEXT_ENABLED | bool) else '0' }}"
