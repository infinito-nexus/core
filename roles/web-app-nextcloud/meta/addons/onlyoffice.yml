---
enabled: "{{ lookup('config', 'web-app-nextcloud', 'services.onlyoffice.enabled') | bool }}"
required: true
mechanism: plugin
source: upstream
bridges:
  - onlyoffice
version: "v10.2.1"
update:
  monitored: true
  catalog: github-releases
  upstream_id: ONLYOFFICE/onlyoffice-nextcloud
config:
  archive: "https://github.com/ONLYOFFICE/onlyoffice-nextcloud/releases/download/v10.2.1/onlyoffice.tar.gz"
  incompatible_plugins:
    - richdocuments
    - fileslibreofficeedit
  plugin_configuration:
    - appid: "onlyoffice"
      configkey: "DocumentServerUrl"
      configvalue: "{{ NEXTCLOUD_ONLYOFFICE_URL }}"
    - appid: "onlyoffice"
      configkey: "DocumentServerInternalUrl"
      configvalue: "{{ NEXTCLOUD_ONLYOFFICE_URL }}"
    - appid: "onlyoffice"
      configkey: "StorageUrl"
      configvalue: "{{ NEXTCLOUD_URL }}"
    - appid: "onlyoffice"
      configkey: "jwt_secret"
      configvalue: "{{ lookup('config','web-svc-onlyoffice', 'secrets.credentials.onlyoffice_jwt_secret', '') }}"
    - appid: "onlyoffice"
      configkey: "jwt_header"
      configvalue: "Authorization"
    - appid: "onlyoffice"
      configkey: "verify_peer_off"
      configvalue: "false"
