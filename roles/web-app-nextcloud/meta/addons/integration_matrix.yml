---
enabled: "{{ lookup('config', 'web-app-nextcloud', 'services.matrix.enabled') | bool }}"
required: true
mechanism: plugin
source: upstream
bridges:
  - matrix
config:
  plugin_configuration:
    - appid: "integration_matrix"
      configkey: "oauth_instance_url"
      configvalue: "{{ lookup('canonical_url', 'web-app-matrix', 'synapse') }}"
