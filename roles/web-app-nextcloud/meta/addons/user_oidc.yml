---
enabled: "{{ lookup('sso_oidc_plugin') == 'user_oidc' }}"
required: true
mechanism: plugin
source: upstream
config:
  mandatory: true
  incompatible_plugins:
    - oidc_login
    - sociallogin
  plugin_configuration:
    - appid: "user_oidc"
      configkey: "allow_insecure_http"
      type: boolean
      configvalue: "{{ '1' if NEXTCLOUD_USER_OIDC_ALLOW_INSECURE_HTTP | bool else '0' }}"
