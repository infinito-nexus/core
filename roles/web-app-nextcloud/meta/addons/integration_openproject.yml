---
enabled: "{{ lookup('config', 'web-app-nextcloud', 'services.openproject.enabled') | bool }}"
required: true
mechanism: plugin
source: upstream
bridges:
  - openproject
config:
  rotate_oauth_client: false
  plugin_configuration:
    - appid: "integration_openproject"
      configkey: "openproject_instance_url"
      configvalue: "{{ NEXTCLOUD_OPENPROJECT_URL }}"
    - appid: "integration_openproject"
      configkey: "fresh_project_folder_setup"
      configvalue: "0"
