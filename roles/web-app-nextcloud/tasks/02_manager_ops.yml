---
- name: ⏫ Bring existing Nextcloud data up to the pinned major
  include_tasks: utils/major_upgrade.yml

- name: 🚿 Flush handlers so Nextcloud container is restarted and ready
  meta: flush_handlers

- name: 🔍 Resolve the Nextcloud hosting node and container id
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ NEXTCLOUD_SERVICE }}"
    resolve_output_prefix: NEXTCLOUD
    resolve_compose_cid: "{{ NEXTCLOUD_CONTAINER_ADDRESS }}"

- name: 🔧 Setup config.php
  include_tasks:
    file: 02_manager_ops/01_config.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"

- name: ⏳ Wait for Redis
  include_tasks: 02_manager_ops/02_redis.yml

- name: 🔄 Update\Upgrade Nextcloud
  include_tasks:
    file: 02_manager_ops/03_upgrade.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"

- name: 🔍 Re-resolve the hosting node after the upgrade
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ NEXTCLOUD_SERVICE }}"
    resolve_output_prefix: NEXTCLOUD
    resolve_compose_cid: "{{ NEXTCLOUD_CONTAINER_ADDRESS }}"

- name: 👤 Setup the administrator account
  include_tasks:
    file: 02_manager_ops/04_admin.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"

- name: ⚙️ Apply the system configuration
  include_tasks:
    file: 02_manager_ops/05_system_config.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"

- name: 🔧 Setup Nextcloud Plugins
  include_tasks:
    file: 02_manager_ops/06_plugin.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"
  when: NEXTCLOUD_PLUGINS_ENABLED | bool

- name: 🔧 Reconcile administrator identities after plugin setup
  include_tasks:
    file: 02_manager_ops/07_admin_identities.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"

- name: 🎨 Apply the corporate design
  include_tasks:
    file: 02_manager_ops/08_design.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"
  when: NEXTCLOUD_DESIGN_ENABLED | bool

- name: "🔐 Converge the second-factor enforcement to Nextcloud's own 2fa"
  include_tasks:
    file: 02_manager_ops/09_twofactor.yml
    apply:
      delegate_to: "{{ NEXTCLOUD_HOST_NODE }}"
  vars:
    nextcloud_twofactor_enforced_now: "{{ nextcloud_twofactor_state.stdout is not search('is not enforced') }}"
    nextcloud_twofactor_enforced_for_all_now: "{{ nextcloud_twofactor_state.stdout | trim == NEXTCLOUD_TWOFACTOR_ENFORCED_FOR_ALL }}"
    nextcloud_twofactor_enabled_apps: "{{ (nextcloud_twofactor_apps.stdout | from_json).enabled }}"
    nextcloud_twofactor_app_enabled: "{{ NEXTCLOUD_TWOFACTOR_APP in nextcloud_twofactor_enabled_apps }}"
    nextcloud_twofactor_providers: "{{ (nextcloud_twofactor_enabled_apps | select('match', 'twofactor_') | list + nextcloud_twofactor_enabled_apps | select('in',
      NEXTCLOUD_TWOFACTOR_PROVIDER_APPS) | list) | reject('eq', 'twofactor_backupcodes') | list }}"
    nextcloud_twofactor_owned: "{{ nextcloud_twofactor_owner.stdout | trim == 'yes' }}"

- name: "🔌 Provision the MCP server surface"
  include_tasks: utils/mcp.yml
  when: NEXTCLOUD_MCP_ENABLED | bool
