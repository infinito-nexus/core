---
- name: 🔍 Resolve the name of the Nextcloud storage in OpenProject
  set_fact:
    nextcloud_op_storage_name: "Nextcloud ({{ lookup('domain', 'web-app-nextcloud') }})"
  changed_when: false

- name: 📖 Read the OpenProject coupling state of both sides
  include_tasks: integration_openproject_state.yml

- name: 🔧 Provision the OpenProject coupling when its stamp is stale
  include_tasks: integration_openproject_converge.yml
  when: IS_STACK_HOST | bool
