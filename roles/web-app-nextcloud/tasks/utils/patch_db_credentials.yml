---
- name: "🧭 Resolve the nextcloud_data mountpoint, empty while the volume is absent"
  ansible.builtin.shell:
    cmd: >-
      container volume ls -q -f name=^nextcloud_data$ | grep -q . &&
      container volume inspect --format '{{ "{{" }}.Mountpoint{{ "}}" }}' nextcloud_data || true
  register: nextcloud_data_mountpoint
  changed_when: false

- name: "🔎 Check whether the persisted config exists"
  ansible.builtin.stat:
    path: "{{ [nextcloud_data_mountpoint.stdout | trim, 'config/config.php'] | path_join }}"
  register: nextcloud_config_stat
  when: (nextcloud_data_mountpoint.stdout | trim) != ""

- name: "🔄 Update the database password in the persisted config"
  ansible.builtin.shell:
    cmd: >-
      sed -i "s|'dbpassword' *=> *'.*'|'dbpassword' => '${PATCH_PASSWORD}'|"
      {{ ([nextcloud_data_mountpoint.stdout | trim, 'config/config.php'] | path_join) | quote }}
  environment:
    PATCH_PASSWORD: "{{ lookup('database', application_id, 'password') | sed_escape('|') }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: true
  when: nextcloud_config_stat.stat.exists | default(false)
