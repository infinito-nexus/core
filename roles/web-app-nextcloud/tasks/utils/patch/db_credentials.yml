---
- name: "🔑 Realign the password nextcloud persisted in its config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "nextcloud_data"
    patch_config_rel: "config/config.php"
    patch_expression: "s|'dbpassword' *=> *'.*'|'dbpassword' => '@PASSWORD@'|"
