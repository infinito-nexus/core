---
- include_tasks: utils/once/flag.yml

- name: "🔌 Stage the MCP surface for {{ application_id }}"
  when: NEXTCLOUD_MCP_ENABLED | bool
  block:
    - name: "🚦 Declare the MCP edge limits before the vhost references them"
      include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-webserver-core/tasks/utils/mcp_edge_limits.yml') }}"

- name: 🔧 Setup the full docker stack
  include_tasks: 01_fullstack.yml
  vars:
    domain: "{{ NEXTCLOUD_DOMAIN }}"
    http_port: "{{ NEXTCLOUD_PORT }}"

- name: "🧹 Register the garbage collector of {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-ctl-cln-apps/tasks/utils/install.yml') }}"
  vars:
    garbage_collector_service_key: "{{ NEXTCLOUD_SERVICE }}"
    garbage_collector_environment:
      NEXTCLOUD_GARBAGE_COLLECTOR_USER: "{{ NEXTCLOUD_DOCKER_USER }}"
      NEXTCLOUD_GARBAGE_COLLECTOR_OCC: "{{ NEXTCLOUD_INTERNAL_OCC_COMMAND }}"

- name: "🖥️ Nextcloud stack-host post-deploy (config, occ, plugins, admin)"
  include_tasks: 02_manager_ops.yml
  when: IS_STACK_HOST | bool

- name: "🪪 Keep the directory profiles of the Nextcloud accounts current"
  include_tasks: utils/ldap_refresh.yml
