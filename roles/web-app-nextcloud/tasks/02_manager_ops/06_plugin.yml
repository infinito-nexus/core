---
- name: "📋 Read the apps Nextcloud has installed and enabled"
  ansible.builtin.command:
    cmd: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:list --output=json"
  register: nextcloud_app_list
  changed_when: false

- name: "🧮 Plan which plugins need an install, an enable or only their config"
  ansible.builtin.set_fact:
    nextcloud_plugin_plan: "{{ NEXTCLOUD_PLUGIN_ITEMS | nextcloud_plugin_plan(nextcloud_app_list.stdout | from_json) }}"
    nextcloud_plugin_configure_keys: []

- name: "🔴 Disable the plugins that end up disabled"
  ansible.builtin.command:
    cmd: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:disable {{ nextcloud_plugin_plan.disable | map('quote') | join(' ') }}"
  when: nextcloud_plugin_plan.disable | length > 0
  changed_when: true

- name: "📦 Install and enable the plugins Nextcloud lacks"
  ansible.builtin.include_tasks: 06_plugin/01_install.yml
  loop: "{{ NEXTCLOUD_PLUGIN_ITEMS | selectattr('key', 'in', nextcloud_plugin_plan.install) | list }}"
  loop_control:
    loop_var: plugin_item
    label: "{{ plugin_item.key }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  vars:
    plugin_key: "{{ plugin_item.key }}"
    plugin_value: "{{ plugin_item.value }}"

- name: "🟢 Enable the installed plugins Nextcloud keeps disabled"
  ansible.builtin.include_tasks: 06_plugin/02_enable.yml
  loop: "{{ NEXTCLOUD_PLUGIN_ITEMS | selectattr('key', 'in', nextcloud_plugin_plan.enable) | list }}"
  loop_control:
    loop_var: plugin_item
    label: "{{ plugin_item.key }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  vars:
    plugin_key: "{{ plugin_item.key }}"
    plugin_value: "{{ plugin_item.value }}"

- name: "🧮 Queue the plugins Nextcloud already runs after the enabled ones"
  ansible.builtin.set_fact:
    nextcloud_plugin_configure_keys: "{{ nextcloud_plugin_configure_keys + nextcloud_plugin_plan.configure }}"

- name: "🔧 Configure every queued plugin in one batch"
  ansible.builtin.include_tasks: 06_plugin/03_configure.yml
  when: nextcloud_plugin_configure_keys | length > 0
