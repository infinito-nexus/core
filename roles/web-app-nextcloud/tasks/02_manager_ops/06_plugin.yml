---
- name: "📋 Read the apps Nextcloud has installed and enabled"
  ansible.builtin.command:
    cmd: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:list --output=json"
  register: nextcloud_app_list
  changed_when: false

- name: "🧮 Plan which plugins need an install, an enable or only their config"
  ansible.builtin.set_fact:
    nextcloud_plugin_plan: "{{ NEXTCLOUD_PLUGIN_ITEMS | nextcloud_plugin_plan(nextcloud_app_list.stdout | from_json) }}"
    nextcloud_plugin_configure_keys: []
    nextcloud_plugin_background_jobs: []

- name: "🔎 Read the accounts each OIDC plugin keyed before another one takes over"
  ansible.builtin.command:
    cmd: "{{ NEXTCLOUD_DOCKER_EXEC_INTERACTIVE }} php -- {{ NEXTCLOUD_DOCKER_WORK_DIRECTORY | quote }}"
    stdin: "{{ lookup('file', 'php/utils/sso_accounts.php') }}"
  register: nextcloud_sso_accounts_probe
  changed_when: false
  when:
    - lookup('sso_oidc_plugin') | length > 0
    - lookup('sso_oidc_plugin') not in (nextcloud_app_list.stdout | from_json).enabled

- name: "🛡️ Guard the accounts an OIDC plugin switch rekeys"
  when: nextcloud_sso_accounts_probe is not skipped
  block:
    - name: "🏷️ Give the Keycloak user of each sociallogin account its user id for user_oidc"
      ansible.builtin.include_role:
        name: web-app-keycloak
        tasks_from: utils/user_attributes.yml
      vars:
        keycloak_user_attribute: "{{ OIDC.ATTRIBUTES.NEXTCLOUD_UID }}"
        keycloak_user_attribute_values: >-
          {{ nextcloud_sso_accounts_probe | nextcloud_sociallogin_subjects
             if lookup('sso_oidc_plugin') == 'user_oidc' else [] }}

    - name: "🛑 Refuse an OIDC plugin switch that gives an existing account a new user id"
      ansible.builtin.assert:
        that:
          - nextcloud_sso_rekeyed_accounts | length == 0
        fail_msg: >-
          {{ application_id }}: the switch to {{ lookup('sso_oidc_plugin') }} gives each of these accounts
          a new user id, so its owner meets a second, empty account or none at the next login:
          {{ nextcloud_sso_rekeyed_accounts | join(', ') }}.
          user_oidc keeps its own accounts, LDAP accounts while user_ldap stays on, and each sociallogin
          account whose Keycloak user holds its user id in {{ OIDC.ATTRIBUTES.NEXTCLOUD_UID }}, which the
          switch to user_oidc writes. Clear what each entry names on its Keycloak user, or keep
          services.sso.oidc.plugin at the plugin these accounts came from.
        quiet: true
      vars:
        nextcloud_sso_rekeyed_accounts: >-
          {{ nextcloud_sso_accounts_probe
             | nextcloud_rekeyed_accounts(lookup('sso_oidc_plugin'), NEXTCLOUD_USER_LDAP_ENABLED | bool,
                                          keycloak_user_attribute_results) }}

- name: "🔴 Disable the plugins that end up disabled"
  ansible.builtin.command:
    cmd: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:disable {{ nextcloud_plugin_plan.disable | map('quote') | join(' ') }}"
  when: nextcloud_plugin_plan.disable | length > 0
  changed_when: true

- name: "📦 Install the plugins Nextcloud lacks, the background ones beside the loop"
  block:
    - name: "🛫 Start the installs that run beside the install loop"
      ansible.builtin.include_tasks: 06_plugin/01_background.yml
      loop: "{{ NEXTCLOUD_PLUGIN_ITEMS | selectattr('key', 'in', nextcloud_plugin_plan.background) | list }}"
      loop_control:
        loop_var: plugin_item
        label: "{{ plugin_item.key }}"
      vars:
        plugin_key: "{{ plugin_item.key }}"

    - name: "📦 Install and enable the plugins Nextcloud lacks"
      ansible.builtin.include_tasks: 06_plugin/02_install.yml
      loop: "{{ NEXTCLOUD_PLUGIN_ITEMS | selectattr('key', 'in', nextcloud_plugin_plan.install) | list }}"
      loop_control:
        loop_var: plugin_item
        label: "{{ plugin_item.key }}"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      vars:
        plugin_key: "{{ plugin_item.key }}"
        plugin_value: "{{ plugin_item.value }}"
  always:
    - name: "⏳ Join the background installs"
      ansible.builtin.async_status:
        jid: "{{ item.jid }}"
      loop: "{{ nextcloud_plugin_background_jobs }}"
      loop_control:
        label: "{{ item.key }}"
      register: nextcloud_plugin_background_result
      until: nextcloud_plugin_background_result is finished
      retries: "{{ ((NEXTCLOUD_PLUGIN_BACKGROUND_ASYNC_TIME | int) / 5) | round(0, 'ceil') | int }}"
      delay: 5
      changed_when: (nextcloud_plugin_background_result | nextcloud_install_status).changed
      failed_when: nextcloud_plugin_background_result | nextcloud_background_lost

- name: "📦 Enable and configure the plugins installed in the background"
  ansible.builtin.include_tasks: 06_plugin/02_install.yml
  loop: "{{ NEXTCLOUD_PLUGIN_ITEMS | selectattr('key', 'in', nextcloud_plugin_plan.background) | list }}"
  loop_control:
    loop_var: plugin_item
    label: "{{ plugin_item.key }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  vars:
    plugin_key: "{{ plugin_item.key }}"
    plugin_value: "{{ plugin_item.value }}"

- name: "🟢 Enable the installed plugins Nextcloud keeps disabled"
  ansible.builtin.include_tasks: 06_plugin/03_enable.yml
  loop: "{{ NEXTCLOUD_PLUGIN_ITEMS | selectattr('key', 'in', nextcloud_plugin_plan.enable) | list }}"
  loop_control:
    loop_var: plugin_item
    label: "{{ plugin_item.key }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  vars:
    plugin_key: "{{ plugin_item.key }}"
    plugin_value: "{{ plugin_item.value }}"

- name: "🧮 Queue the plugins Nextcloud already runs after the enabled ones"
  ansible.builtin.set_fact:
    nextcloud_plugin_configure_keys: "{{ nextcloud_plugin_configure_keys + nextcloud_plugin_plan.configure }}"

- name: "🔧 Configure every queued plugin in one batch"
  ansible.builtin.include_tasks: 06_plugin/04_configure.yml
  when: nextcloud_plugin_configure_keys | length > 0
