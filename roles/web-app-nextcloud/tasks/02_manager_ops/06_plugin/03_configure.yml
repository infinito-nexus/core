---
# Loaded via include_vars (not config lookup or lookup('file')) so the role-scoped vars referenced inside the payload render lazily in this task's scope.
- name: "📄 Load {{ plugin_key }} addon spec from meta/addons/{{ plugin_key }}.yml"
  ansible.builtin.include_vars:
    file: "{{ [role_path, 'meta/addons', plugin_key ~ '.yml'] | path_join }}"
    name: addon_spec

- name: "🔧 Set plugin configuration (one exec, occ calls on stdin)"
  ansible.builtin.shell:
    cmd: "{{ NEXTCLOUD_DOCKER_EXEC_INTERACTIVE }} sh -s"
    stdin: |
      set -eu
      {% for item in (addon_spec.config.plugin_configuration | default([])) %}
      {{ NEXTCLOUD_INTERNAL_OCC_COMMAND | quote }} \
        config:app:set {{ item.appid }} {{ item.configkey }}{{ (' --no-interaction --type=' ~ item.type) if item.type is defined else '' }} \
        --value '{{ ( (item.configvalue | to_json) if (item.configvalue is mapping or (item.configvalue is sequence and item.configvalue is not string)) else (item.configvalue | string) )
              | regex_replace("'", "'" ~ '"' ~ "'" ~ '"' ~ "'") }}'
      {% endfor %}
  when: (addon_spec.config.plugin_configuration | default([])) | length > 0
  register: config_set_shell
  changed_when: config_set_shell.stdout is search(' set to ')
  failed_when: config_set_shell.rc != 0
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🔎 Check if {{ plugin_task_path }} exists
  stat:
    path: "{{ plugin_task_path }}"
  delegate_to: localhost
  become: false
  register: plugin_tasks_file

- name: "📂 include {{ plugin_task_path }}"
  include_tasks: "{{ plugin_task_path }}"
  when: plugin_tasks_file.stat.exists
