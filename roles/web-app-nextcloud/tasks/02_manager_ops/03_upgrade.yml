---
- name: ⬆️ Nextcloud | Upgrade
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} upgrade"
  register: occ_upgrade
  changed_when: "'Already up to date' not in occ_upgrade.stdout"
  retries: 3
  delay: 5
  until: occ_upgrade.rc == 0

- name: 🔧 Nextcloud | Maintenance repair
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} maintenance:repair --include-expensive"
  register: occ_repair
  changed_when: "'No repairs needed' not in occ_repair.stdout"
  retries: 3
  delay: 10
  until: occ_repair.rc == 0

- name: 🔄 Nextcloud | App update (retry once)
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:update --all"
  register: occ_app_update
  changed_when: "'No apps found for update' not in occ_app_update.stdout"
  retries: 2
  delay: 3
  until: occ_app_update.rc == 0
  when: NEXTCLOUD_PINNED_PLUGINS | length == 0

- name: 🔍 Nextcloud | List the apps the appstore offers an update for
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:update --all --showonly"
  register: occ_app_updatable
  changed_when: false
  retries: 2
  delay: 3
  until: occ_app_updatable.rc == 0
  when: NEXTCLOUD_PINNED_PLUGINS | length > 0

- name: 🔄 Nextcloud | App update, leaving the pinned releases alone
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} app:update {{ item | quote }}"
  register: occ_app_update_unpinned
  changed_when: "'No apps found for update' not in occ_app_update_unpinned.stdout"
  retries: 2
  delay: 3
  until: occ_app_update_unpinned.rc == 0
  when: NEXTCLOUD_PINNED_PLUGINS | length > 0
  loop: >-
    {{ occ_app_updatable.stdout_lines | default([])
       | select('search', ' new version available')
       | map('regex_replace', ' new version available.*$', '')
       | difference(NEXTCLOUD_PINNED_PLUGINS) }}

- name: ➕ Nextcloud | Add missing columns
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} db:add-missing-columns"
  register: occ_columns
  changed_when: "'No columns found' not in occ_columns.stdout"

- name: ➕ Nextcloud | Add missing indices
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} db:add-missing-indices"
  register: occ_indices
  changed_when: "'No indices found' not in occ_indices.stdout"

- name: ➕ Nextcloud | Add missing primary keys
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} db:add-missing-primary-keys"
  register: occ_pks
  changed_when: "'No primary keys found' not in occ_pks.stdout"

- name: 🔴 Nextcloud | Disable maintenance mode
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} maintenance:mode --off"
  register: occ_maint_off
  changed_when: "'already disabled' not in occ_maint_off.stdout"
  retries: 3
  delay: 5
  until: occ_maint_off.rc == 0
