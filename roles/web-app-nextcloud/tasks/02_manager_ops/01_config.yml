---
- name: "🔍 Resolve the proxy hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ NEXTCLOUD_PROXY_SERVICE }}"
    resolve_output_prefix: NEXTCLOUD_PROXY
    resolve_compose_cid: "{{ NEXTCLOUD_PROXY_CONTAINER }}"

- name: "⏳ Wait until the Nextcloud proxy accepts TCP"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/wait_container_port.yml') }}"
  vars:
    wait_output_prefix: NEXTCLOUD_PROXY
    wait_port: "{{ container_port }}"
    wait_timeout: "{{ lookup('timeout', 120) }}"

- name: ⏳ Wait until Nextcloud is installed (occ status)
  shell: "{{ NEXTCLOUD_DOCKER_EXEC_OCC }} status"
  register: occ_status
  retries: 60
  delay: 5
  until: >
    occ_status.rc == 0 and
    (occ_status.stdout | default('')) is search('installed: true')
  changed_when: false

- name: "📄 Install the infinito additional-config loader into config/"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  NEXTCLOUD_LOCAL_CID resolved at delegate_to runtime; container_address would return a manager-only subshell
      container exec -i -u root {{ NEXTCLOUD_LOCAL_CID | quote }}
      sh -c 'cat > {{ NEXTCLOUD_DOCKER_CONF_LOADER_PATH }}
      && chmod 0444 {{ NEXTCLOUD_DOCKER_CONF_LOADER_PATH }}'
    stdin: "{{ lookup('template', 'include.php.j2') }}"
  changed_when: true
