---
nextcloud_system_config:
  - parameter: "hide_login_form"
    type: "boolean"
    value: "{{ (not lookup('config', application_id, 'services.nextcloud.legacy_login_mask.enabled')) | lower }}"

  - parameter: "auth.webauthn.enabled"
    type: "boolean"
    value: "{{ lookup('config', application_id, 'services.nextcloud.legacy_login_mask.enabled') | lower }}"

  - parameter: "allow_local_remote_servers"
    type: "boolean"
    value: "{{ lookup('config', application_id, 'services.nextcloud.allow_local_remote_servers.enabled') | lower }}"

  - parameter: "maintenance_window_start"
    type: "integer"
    value: "{{ SYS_SCHEDULE_MAINTANANCE_NEXTCLOUD }}"

  - parameter: "default_phone_region"
    value: "{{ HOST_LL | upper }}"

  - parameter: "trusted_domains"
    type: "json"
    value: "{{ (lookup('network_siblings', NEXTCLOUD_DOMAIN) + [NEXTCLOUD_PROXY_SERVICE, NEXTCLOUD_PROXY_DNS_NAME]) | unique | to_json }}"

  - parameter: "overwrite.cli.url"
    value: "{{ NEXTCLOUD_URL }}"

  - parameter: "trusted_proxies"
    type: "json"
    value: "{{ NEXTCLOUD_TRUSTED_PROXIES }}"

  - parameter: "log_type"
    value: "errorlog"

nextcloud_system_config_absent:
  - overwritehost
  - overwriteprotocol
