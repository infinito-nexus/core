---
- name: ✅ Ensure nss-myhostname is installed so *.localhost resolves to loopback
  become: true
  package_install:
    id: nss-myhostname

- name: ✅ Ensure nsswitch resolves hosts via myhostname
  become: true
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: "^(hosts:(?!.*\\bmyhostname\\b).*)$"
    line: "\\1 myhostname"
    backrefs: true

- include_tasks: utils/once/flag.yml
