---
# The API answers POST /v1/systemone and GET /health; its root has no handler.
status_codes:
  default:
    - 404
vhosts:
  default:
    http_port: "{{ lookup('config', 'svc-ai-s1', 'services.s1.ports.local.http') }}"
    internal_port: "{{ lookup('config', 'svc-ai-s1', 'services.s1.ports.internal.http') }}"
