---
- include_tasks: utils/once/flag.yml

- name: "🧩 load the container manager for {{ application_id }}"
  include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: false

- name: "📦 Stage the inference server of {{ application_id }}"
  stack_host_copy:
    src: python/server.py
    dest: "{{ [NLLB_BUILD_DIR, 'server.py'] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "📦 Stage the image build script of {{ application_id }}"
  stack_host_copy:
    src: shell/build.sh
    dest: "{{ [NLLB_BUILD_DIR, 'build.sh'] | path_join }}"
    mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "🔐 Stage the package-cache CA into the build context of {{ application_id }}"
  stack_host_copy:
    content: "{{ lookup('file', NLLB_CACHE_CA_FILE) if NLLB_CACHE_CA_FILE is file else '' }}"
    dest: "{{ [NLLB_BUILD_DIR, 'package-frontend-ca.crt'] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "🔐 Stage the package-cache CA installer of {{ application_id }}"
  stack_host_copy:
    src: "{{ lookup('path_absolute', NLLB_CACHE_CA_INSTALLER) }}"
    dest: "{{ [NLLB_BUILD_DIR, 'package-frontend-ca.sh'] | path_join }}"
    mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true
