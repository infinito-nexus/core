# nocheck: backup-service-flag the volume holds the checkpoint the engine re-downloads from its upstream repository
---
# nocheck: embedded-state-on-nfs content-addressed HuggingFace checkpoint, downloaded once and read-only after
# nocheck: nfs-false-data-loss  Reason: a node that fetched the checkpoint holds the same files every other node would fetch, so nothing written here has to reach another node
nllb_models:
  type: volume
  mounts:
    - service: nllb-engine
      target: /models
