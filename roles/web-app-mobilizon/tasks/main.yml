---
- name: "🖥️ Configure {{ application_id }} on the stack host"
  when: IS_STACK_HOST | bool
  block:
    - name: ➕ add config.exs
      stack_host_template:
        src: "config.exs.j2"
        dest: "{{ mobilizon_host_conf_exs_file }}"
      notify: compose-up

    - name: "🎨 Mobilizon accounts and corporate design"
      ansible.builtin.include_tasks: 01_design.yml

- name: "🛂 Mobilizon roles of the Keycloak accounts"
  ansible.builtin.include_tasks: 03_rbac.yml
