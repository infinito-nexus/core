---
- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "🖥️ Configure {{ application_id }} on the stack host"
  when: IS_STACK_HOST | bool
  block:
    - name: ➕ add config.exs
      stack_host_template:
        src: "config.exs.j2"
        dest: "{{ mobilizon_host_conf_exs_file }}"
      notify: compose-up

    - name: "🎨 Mobilizon administrator and corporate design"
      ansible.builtin.include_tasks: 01_design.yml
