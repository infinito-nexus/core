---
- name: "🔎 Load the Matomo site list once for this host"
  uri_retry:
    url: "{{ matomo_index_php_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      module: API
      method: SitesManager.getSitesWithAtLeastViewAccess
      filter_limit: -1
      format: json
      token_auth: "{{ matomo_effective_token }}"
    return_content: true
    status_code: 200
    validate_certs: true
  register: matomo_site_list
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when: matomo_site_cache is not defined or matomo_site_cache.scope != matomo_site_cache_scope

- name: "🧊 Cache the Matomo site list for the remaining vhosts"
  ansible.builtin.set_fact:
    matomo_site_cache:
      scope: "{{ matomo_site_cache_scope }}"
      sites: "{{ matomo_site_list.json }}"
  when:
    - matomo_site_list.status is defined and matomo_site_list.status == 200
    - matomo_site_list.json is defined and matomo_site_list.json is not mapping

- name: "🔧 Reset the Matomo site ID for '{{ domain }}'"
  ansible.builtin.set_fact:
    matomo_site_id:

- name: "🔧 Take the site ID for '{{ domain }}' from the cached site list"
  ansible.builtin.set_fact:
    matomo_site_id: "{{ matomo_cached_site_ids | min }}"
  vars:
    matomo_cached_site_ids: >-
      {{ matomo_site_cache.sites | selectattr('main_url', 'in', matomo_site_url_variants)
         | map(attribute='idsite') | map('int') | list }}
  when:
    - matomo_site_cache is defined
    - matomo_site_cache.scope == matomo_site_cache_scope
    - matomo_cached_site_ids | length > 0

- name: "🔎 Check if site {{ domain }} is already registered at Matomo"
  uri_retry:
    url: "{{ matomo_index_php_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      module: API
      method: SitesManager.getSitesIdFromSiteUrl
      url: "{{ matomo_site_url }}"
      format: json
      token_auth: "{{ matomo_effective_token }}"
    return_content: true
    status_code: 200
    validate_certs: true
  register: site_check
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when:
    - matomo_site_id is none
    - matomo_site_list is skipped or (matomo_site_list.status is defined and matomo_site_list.status == 200)

- name: "🔧 Take the site ID for '{{ domain }}' from the Matomo lookup"
  ansible.builtin.set_fact:
    matomo_site_id: "{{ site_check.json[0].idsite }}"
  when:
    - site_check is not skipped
    - site_check.status is defined and site_check.status == 200
    - site_check.json is defined and site_check.json is not mapping
    - site_check.json | length > 0

- name: "🔴 Skip Matomo for '{{ domain }}' (API not ready, reapplied later)"
  ansible.builtin.set_fact:
    inj_enabled: "{{ inj_enabled | combine({'matomo': false}) }}"
  when:
    - matomo_site_id is none
    - >-
      site_check is skipped
      or site_check.status is not defined or site_check.status != 200
      or site_check.json is not defined or site_check.json is mapping

- name: "📝 Register site + inject Matomo tracking for '{{ domain }}'"
  ansible.builtin.include_tasks: inject_apply.yml
  when: inj_enabled.matomo | bool
