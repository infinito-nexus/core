---
- name: "🔧 Resolve effective Matomo API token for '{{ domain }}'"
  ansible.builtin.set_fact:
    matomo_effective_token: >-
      {{
        (matomo_token_override | default('') | string | trim)
        if (matomo_token_override | default('') | string | trim) != ''
        else (lookup('users', 'platform_administrator').tokens['web-app-matomo'] | default('') | string | trim)
      }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔧 Start from an unresolved Matomo site id for '{{ domain }}'"
  ansible.builtin.set_fact:
    matomo_site_id: ""

- name: "🔎 Load the Matomo site list once for this host"
  uri_retry:
    url: "{{ matomo_index_php_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      module: API
      method: SitesManager.getSitesWithAtLeastViewAccess
      filter_limit: -1
      format: json
      token_auth: "{{ matomo_effective_token }}"
    return_content: true
    status_code: 200
    validate_certs: true
  register: matomo_site_list
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when:
    - matomo_effective_token != ""
    - matomo_site_cache is not defined or matomo_site_cache.scope != matomo_site_cache_scope

- name: "🧊 Cache the Matomo site list, or its absence, for the remaining vhosts"
  ansible.builtin.set_fact:
    matomo_site_cache:
      scope: "{{ matomo_site_cache_scope }}"
      sites: >-
        {{ matomo_site_list.json
           if matomo_site_list.status is defined and matomo_site_list.status == 200
              and matomo_site_list.json is defined and matomo_site_list.json is not mapping
           else none }}
  when: matomo_site_list is not skipped

- name: "🔧 Take the site ID for '{{ domain }}' from the cached site list"
  ansible.builtin.set_fact:
    matomo_site_id: "{{ matomo_cached_site_ids | min }}"
  vars:
    matomo_cached_site_ids: >-
      {{ matomo_site_cache.sites | selectattr('main_url', 'in', matomo_site_url_variants)
         | map(attribute='idsite') | map('int') | list }}
  when:
    - matomo_site_cache is defined
    - matomo_site_cache.scope == matomo_site_cache_scope
    - matomo_site_cache.sites is not none
    - matomo_cached_site_ids | length > 0

- name: "🔎 Check if site {{ domain }} is already registered at Matomo"
  uri_retry:
    url: "{{ matomo_index_php_url }}"
    method: POST
    body_format: form-urlencoded
    body:
      module: API
      method: SitesManager.getSitesIdFromSiteUrl
      url: "{{ matomo_site_url }}"
      format: json
      token_auth: "{{ matomo_effective_token }}"
    return_content: true
    status_code: 200
    validate_certs: true
  register: site_check
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when:
    - matomo_effective_token != ""
    - matomo_site_id == ""
    - matomo_site_cache.sites is not none

- block:
    - name: "🔧 Set fact for site ID if site already exists"
      ansible.builtin.set_fact:
        matomo_site_id: "{{ site_check.json[0].idsite }}"
      when: (site_check.json | length) > 0
      changed_when: false

    - name: "➕ Register the site at Matomo while its ID is unresolved"
      when: matomo_site_id == ""
      block:
        - name: "➕ Add site to Matomo and get ID if not exists"
          uri_retry:
            url: "{{ matomo_index_php_url }}"
            method: POST
            body_format: form-urlencoded
            body:
              module: API
              method: SitesManager.addSite
              siteName: "{{ matomo_site_domain }}"
              urls: "{{ matomo_site_url }}"
              format: json
              token_auth: "{{ matomo_effective_token }}"
            status_code: 200
            return_content: true
            validate_certs: true
          register: add_site
          failed_when: add_site.json is not defined or add_site.json.value is not defined
          no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

        - name: "🔧 Set fact for site ID if site was added"
          ansible.builtin.set_fact:
            matomo_site_id: "{{ add_site.json.value }}"
          changed_when: false

        - name: "🧊 Add the new site to the cached Matomo site list"
          ansible.builtin.set_fact:
            matomo_site_cache: "{{ matomo_site_cache | combine({'sites': matomo_site_cache.sites + [{'idsite': matomo_site_id, 'main_url': matomo_site_url}]}) }}"
          when:
            - matomo_site_cache is defined
            - matomo_site_cache.scope == matomo_site_cache_scope
          changed_when: false
  when: >-
    site_check is not skipped
    and site_check.status is defined and site_check.status == 200
    and site_check.json is defined and site_check.json is not mapping
