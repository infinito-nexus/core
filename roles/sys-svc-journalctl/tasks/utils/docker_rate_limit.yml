---
- name: 📁 Ensure the docker.service drop-in directory exists
  ansible.builtin.file:
    path: "{{ SYS_SVC_JOURNALCTL_DOCKER_DROPIN_DIR }}"
    state: directory
    mode: "0755"

- name: 📋 Raise the journald rate limit of docker.service
  ansible.builtin.template: # nocheck: stack-host-template (per-host docker.service drop-in, every container host logs through its own journald)
    src: "{{ lookup('path_absolute', 'roles/sys-svc-journalctl/templates/docker-rate-limit.conf.j2') }}"
    dest: "{{ SYS_SVC_JOURNALCTL_DOCKER_DROPIN }}"
    mode: "0644"
  register: sys_svc_journalctl_docker_dropin

- name: 🔄 Reload systemd so the next docker.service start reads the drop-in
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: sys_svc_journalctl_docker_dropin.changed
