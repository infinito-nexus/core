---
- name: 🔄 restart systemd-journald
  listen: restart-systemd-journald
  service: name=systemd-journald state=restarted

- name: 💾 Move the runtime journal to persistent storage
  listen: restart-systemd-journald
  ansible.builtin.command:
    argv:
      - journalctl
      - --flush
  changed_when: true
