---
application_id: "svc-ai-mcp-adapter"
entity_name: "{{ application_id | get_entity_name }}"

MCP_ADAPTER_CONTAINER: "{{ lookup('config', application_id, 'services.mcp-adapter.name') }}"
MCP_ADAPTER_PORT: "{{ lookup('config', application_id, 'services.mcp-adapter.ports.internal.http') }}"
MCP_ADAPTER_BASE_IMAGE: "{{ lookup('config', application_id, 'services.mcp-adapter.image') }}"
MCP_ADAPTER_BASE_VERSION: "{{ lookup('config', application_id, 'services.mcp-adapter.version') }}"
MCP_ADAPTER_BUILD_DIR: "{{ lookup('container', application_id, 'directories.instance') }}"
