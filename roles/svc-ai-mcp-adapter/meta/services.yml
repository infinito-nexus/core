---
mcp-adapter:
  modes:
    compose:
      enabled: false
    swarm:
      enabled: false
  bond: 1
  enabled: true
  shared: true
  image: python
  # nocheck: docker-version  base of a self-built stdlib-only image, not the served application
  version: "3.13.15-slim"
  custom: true
  name: mcp-adapter
  min_storage: 130MB
  cpus: "0.25"
  mem_reservation: 24m
  mem_limit: 48m
  pids_limit: 64
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 8080
  lifecycle: alpha

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
