---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
mcp-adapter:
  modes:
    compose:
      enabled: false
    swarm:
      enabled: false
  bond: 1
  enabled: true
  shared: true
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  name: mcp-adapter
  min_storage: 130MB
  cpus: "0.25"
  mem_reservation: 24m
  mem_limit: 48m
  pids_limit: 64
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 8080
  lifecycle: alpha

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  adapter every MCP provider sidecar is built from, so pausing it would take those sidecars down with it
  status: started
