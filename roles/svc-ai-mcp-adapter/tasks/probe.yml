---
# Prove one provider honours its declared contract, at deploy time.
#
# The check needs the provider's real credential, so it cannot live in a
# Playwright spec: the run would capture the bearer in its trace.
#
# It runs in a throwaway container joined to the provider's own network. The
# endpoint is `expose:`-only, so its service name resolves there and nowhere
# else, and probing from the stack host reaches nothing. Running it inside the
# provider's MCP container instead only works when that container happens to
# ship a python: gitea-mcp is a Go binary in a minimal image and answers 127.
#
# URL and credential are derived from the role's own `mcp` block
# rather than passed in, so a caller cannot probe one endpoint with another's
# token and call the mismatch a pass.
#
# Param: mcp_probe_path_key     path segment for a server that addresses its
#                               session through the URL, or "".
# Param: mcp_probe_bearer       the same variable that renders ADAPTER_BEARER,
#                               so probe and server cannot drift apart.
# Param: mcp_probe_read_tool    tool to invoke for the deterministic read, or "".
# Param: mcp_probe_read_args    arguments for that tool.
# Param: mcp_probe_host         vhost of a provider reached through its own
#                               reverse proxy, or "" when addressed directly.
#
- name: "🐍 Resolve the image the probe runs in"
  ansible.builtin.set_fact:
    MCP_PROBE_IMAGE: >-
      {{ lookup('config', 'svc-ai-mcp-adapter', 'services.mcp-adapter.image')
      }}:{{ lookup('config', 'svc-ai-mcp-adapter', 'services.mcp-adapter.version') }}

- name: "🔑 Resolve the declared MCP endpoint and credential of {{ application_id }}"
  ansible.builtin.set_fact:
    mcp_probe_endpoint: "{{ lookup('config', application_id, 'mcp.endpoint') }}" # nocheck: lookup-config-path  resolved against the including provider, not this role
    mcp_probe_allowlist: "{{ lookup('config', application_id, 'mcp.tools.allowlist', []) }}"
    mcp_probe_serves_declared: "{{ lookup('config', application_id, 'mcp.tools.upstream_serves', '') }}" # nocheck: lookup-config-path  resolved against the including provider, not this role
    mcp_probe_implementation: "{{ lookup('config', application_id, 'mcp.implementation') }}" # nocheck: lookup-config-path  resolved against the including provider, not this role
    mcp_probe_transport: "{{ lookup('config', application_id, 'mcp.transport') }}" # nocheck: lookup-config-path  resolved against the including provider, not this role
    mcp_probe_auth: "{{ lookup('config', application_id, 'mcp.auth') }}" # nocheck: lookup-config-path  resolved against the including provider, not this role
    mcp_declared_owner: "{{ lookup('config', application_id, 'mcp.credential.owner') }}" # nocheck: lookup-config-path  resolved against the including provider, not this role
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "📐 Resolve what the upstream is recorded to serve"
  ansible.builtin.set_fact:
    mcp_probe_upstream_serves: >-
      {{ []
         if mcp_probe_implementation == 'adapter'
         else (mcp_probe_serves_declared
               if (mcp_probe_serves_declared is sequence
                   and mcp_probe_serves_declared is not string)
               else []) }}

- name: "🔐 Render the credential the way a client would present it"
  ansible.builtin.set_fact:
    mcp_probe_authorization: >-
      {{ {'id': application_id,
          'auth': mcp_probe_auth,
          'token': mcp_probe_bearer,
          'owner': mcp_declared_owner} | mcp_authorization }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔗 Build the endpoint URL the same way a client would"
  ansible.builtin.set_fact:
    mcp_probe_url: >-
      http://{{ mcp_probe_endpoint.service_key
      }}:{{ lookup('config', application_id, 'services.' ~ mcp_probe_endpoint.service_key ~ '.ports.internal.' ~ mcp_probe_endpoint.port_key)
      }}{{ mcp_probe_endpoint.path
      }}{{ ('/' ~ mcp_probe_path_key) if mcp_probe_path_key else ''
      }}{{ ('/' ~ mcp_probe_endpoint.suffix)
           if (mcp_probe_path_key and mcp_probe_endpoint.suffix) else '' }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🛑 Refuse to probe a provider whose declared credential does not resolve"
  ansible.builtin.assert:
    that:
      - mcp_probe_bearer | length > 0
    fail_msg: >-
      {{ application_id }} passed an empty MCP bearer. A provider whose
      credential is missing cannot be proven guarded, only unreachable.

- name: "🩺 Prove the MCP contract of {{ application_id }}"
  ansible.builtin.command:
    argv:
      - container
      - run
      - --rm
      - -i
      - --network
      - "{{ application_id | get_entity_name }}"
      - -e
      - "MCP_URL={{ mcp_probe_url }}"
      - -e
      - "MCP_TRANSPORT={{ mcp_probe_transport }}"
      - -e
      - "MCP_PATH_KEY={{ mcp_probe_path_key }}"
      - -e
      - "MCP_AUTH_HEADER={{ mcp_probe_authorization }}"
      - -e
      - "MCP_EXPECTED_TOOLS={{ mcp_probe_allowlist | to_json }}"
      - -e
      - "MCP_UPSTREAM_SERVES={{ mcp_probe_upstream_serves | to_json }}"
      - -e
      - "MCP_READ_TOOL={{ mcp_probe_read_tool }}"
      - -e
      - "MCP_READ_ARGUMENTS={{ mcp_probe_read_args | to_json }}"
      - -e
      - "MCP_HOST_HEADER={{ mcp_probe_host }}"
      - "{{ MCP_PROBE_IMAGE }}"
      - python3
      - "-"
    stdin: "{{ lookup('file', lookup('path_absolute', 'roles/svc-ai-mcp-adapter/files/python/probe/contract.py')) }}"
  register: mcp_contract_probe
  retries: 30
  delay: 10
  until: mcp_contract_probe.rc == 0 or 'REJECTED' in mcp_contract_probe.stderr
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true

- name: "🛑 Refuse a provider whose served surface differs from its contract"
  ansible.builtin.assert:
    that:
      - mcp_contract_probe.rc == 0
    fail_msg: >-
      {{ application_id }} did not honour its MCP contract:
      {{ mcp_contract_probe.stderr | default('no output') }}

- name: "🧱 Prove the {{ application_id }} sidecar reaches only its provider"
  ansible.builtin.include_tasks: isolation.yml
  when: lookup('config', application_id, 'mcp.implementation') == 'adapter' # nocheck: lookup-config-path  resolved against the including provider, not this role
