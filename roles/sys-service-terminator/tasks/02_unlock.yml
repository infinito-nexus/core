---
- name: "🚀 DEPLOY | Collect {{ SOFTWARE_DOMAIN }} timers (unlock phase)"
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-unit-files
      - "*.{{ SOFTWARE_DOMAIN }}.timer"
      - --no-legend
      - --no-pager
  register: deploy_timer_units_unlock
  changed_when: false
  failed_when: false

- name: "🚀 DEPLOY | Build the timer list of this version (unlock phase)"
  ansible.builtin.set_fact:
    deploy_timers_unlock: >-
      {{
        deploy_timer_units_unlock.stdout_lines | default([])
        | reject('search', ' masked')
        | map('split', ' ')
        | map('first')
        | select('search', (SYS_SERVICE_VERSION_SUFFIX ~ '.timer') | regex_escape ~ '$')
        | list
      }}

- name: "🚀 DEPLOY | Enable and start the {{ SOFTWARE_DOMAIN }} timers of this version"
  become: true
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'enable', '--now'] + deploy_timers_unlock }}"
  changed_when: true
  when: deploy_timers_unlock | length > 0
