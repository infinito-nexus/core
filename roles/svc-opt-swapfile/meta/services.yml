---
swapfile:
  modes:
    host:
      enabled: true
  repository: https://github.com/kevinveenbirkenbach/swap-forge.git
  ref: v1.0.0
  swapfile_size: "{{ ansible_facts['memtotal_mb'] | int }}M"
  lifecycle: beta
  min_storage: "50MB"
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "64m"
  pids_limit: 64
