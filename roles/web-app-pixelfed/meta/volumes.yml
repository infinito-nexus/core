---
data:
  type: volume
  name: pixelfed_data
  mounts:
    - service: pixelfed
      target: &var_www_storage_target /var/www/html/storage
    - service: worker
      target: *var_www_storage_target

env:
  type: config
  source: "{{ lookup('container', 'web-app-pixelfed', 'files.env') }}"
  mode: "0444"
  mounts:
    - service: pixelfed
      target: &var_www_env_target /var/www/html/.env
    - service: worker
      target: *var_www_env_target
