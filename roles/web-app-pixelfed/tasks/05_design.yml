---
- name: "🔍 Pixelfed | Resolve hosting node + local container id for the design carriers"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: pixelfed
    resolve_output_prefix: PIXELFED
    resolve_compose_cid: "{{ PIXELFED_CONTAINER }}"

- name: "🎨 Converge the role's custom CSS block and site name in Pixelfed"
  vars:
    pixelfed_design_payload:
      app_dir: "{{ PIXELFED_APP_DIR }}"
      css: "{{ lookup('ansible.builtin.file', [role_path, 'files/custom.css'] | path_join) if PIXELFED_DESIGN_ENABLED | bool else '' }}"
      begin: "{{ PIXELFED_CUSTOM_CSS_BEGIN }}"
      end: "{{ PIXELFED_CUSTOM_CSS_END }}"
      title: "{{ PIXELFED_SETTINGS.get('site_name') if PIXELFED_SETTINGS.get('site_name') is string else '' }}"
    pixelfed_design_script: "{{ lookup('ansible.builtin.file', [role_path, 'files/php/design.php'] | path_join) }}"
    pixelfed_design_state: "{{ pixelfed_design_stored.stdout_lines | last | from_json }}"
  block:
    - name: "🔎 Read the stored Pixelfed site name and whether the design converge writes"
      ansible.builtin.command:
        argv:
          - container
          - exec
          - -i
          - -u
          - "{{ PIXELFED_APP_USER }}"
          - "{{ PIXELFED_LOCAL_CID }}" # nocheck: container-exec-resolver  PIXELFED_LOCAL_CID resolved at delegate_to runtime
          - php
        stdin: "<?php $DESIGN_PAYLOAD = '{{ pixelfed_design_payload | combine({'mode': 'read'}) | to_json | b64encode }}'; ?>{{ pixelfed_design_script }}"
      register: pixelfed_design_stored
      changed_when: false
      delegate_to: "{{ PIXELFED_HOST_NODE }}"

    - name: "🎨 Revert the Pixelfed settings that drifted"
      when: pixelfed_design_state.pending | bool
      block:
        - name: "📣 Report the managed Pixelfed settings the converge reverts"
          ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
          vars:
            forms_drift_current: "{{ {'settings': {'site_name': pixelfed_design_state.site_name}} if pixelfed_design_payload.title | length > 0 else {} }}"

        - name: "🎨 Write the role's custom CSS block and site name into Pixelfed"
          ansible.builtin.command:
            argv:
              - container
              - exec
              - -i
              - -u
              - "{{ PIXELFED_APP_USER }}"
              - "{{ PIXELFED_LOCAL_CID }}" # nocheck: container-exec-resolver  PIXELFED_LOCAL_CID resolved at delegate_to runtime
              - php
            stdin: "<?php $DESIGN_PAYLOAD = '{{ pixelfed_design_payload | combine({'mode': 'converge'}) | to_json | b64encode }}'; ?>{{ pixelfed_design_script }}"
          register: pixelfed_custom_css
          changed_when: "'DESIGN_CHANGED' in pixelfed_custom_css.stdout"
          failed_when: >-
            pixelfed_custom_css.rc != 0
            or ('DESIGN_CHANGED' not in pixelfed_custom_css.stdout and 'DESIGN_UNCHANGED' not in pixelfed_custom_css.stdout)
          delegate_to: "{{ PIXELFED_HOST_NODE }}"
