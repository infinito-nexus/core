---
application_id: "web-app-pixelfed"

swarm_stack_converge_retries: 600

PIXELFED_CONTAINER: "{{ lookup('config', application_id, 'services.pixelfed.name') }}"
PIXELFED_WORKER_CONTAINER: "{{ lookup('config', application_id, 'services.worker.name') }}"
PIXELFED_TITLE: "{{ lookup('design', application_id).label }}"
PIXELFED_URL: "{{ lookup('tls', application_id, 'url.origin') }}"
PIXELFED_OIDC_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') }}"
PIXELFED_LOGIN_SSO: "{{ lookup('config', application_id, 'services.pixelfed.login.method.sso.enabled') | bool }}"
PIXELFED_LOGIN_NATIVE: "{{ lookup('config', application_id, 'services.pixelfed.login.method.native.enabled') | bool }}"
PIXELFED_LOGIN_2FA: "{{ lookup('config', application_id, 'services.pixelfed.login.method.2fa.enabled') | bool }}"
PIXELFED_LOGIN_REGISTRATION: "{{ lookup('config', application_id, 'services.pixelfed.login.method.registration.enabled') | bool }}"
PIXELFED_OIDC_ONION_ISSUER: "{{ (lookup('tls', 'web-app-keycloak', 'domain') | network_of) == 'tor' }}"
PIXELFED_OIDC_SOCKS_PROXY: "{{ lookup('tor_socks_proxy') if PIXELFED_OIDC_ONION_ISSUER | bool else '' }}"
PIXELFED_APP_USER: "33"
PIXELFED_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
PIXELFED_CUSTOM_CSS_BEGIN: "/* infinito-design:begin */"
PIXELFED_CUSTOM_CSS_END: "/* infinito-design:end */"
PIXELFED_SETTINGS: "{{ lookup('form_values', application_id, 'settings') }}"
PIXELFED_ENV_FILE: "{{ lookup('container', application_id, 'files.env') }}"
PIXELFED_STORAGE_DIR: "{{ lookup('volume', application_id, 'data').target }}"
PIXELFED_APP_DIR: "{{ PIXELFED_STORAGE_DIR | dirname }}"
PIXELFED_PUBLIC_STORAGE_SOURCE: "{{ [PIXELFED_STORAGE_DIR, 'app', 'public'] | path_join }}"
PIXELFED_PUBLIC_STORAGE_LINK: "{{ [PIXELFED_STORAGE_DIR | dirname, 'public', 'storage'] | path_join }}"
PIXELFED_INIT_MARKER: "{{ [PIXELFED_STORAGE_DIR, '.docker.init'] | path_join }}"
PIXELFED_DB_NAME: "{{ lookup('database', application_id, 'name') }}"
PIXELFED_ADMIN_USERNAME: "{{ lookup('users', IAM_PLATFORM_ADMIN_USER_KEY).username }}"
PIXELFED_ADMIN_EMAIL: "{{ lookup('users', IAM_PLATFORM_ADMIN_USER_KEY).email }}"
PIXELFED_ADMIN_PASSWORD: "{{ lookup('users', IAM_PLATFORM_ADMIN_USER_KEY).password }}"
PIXELFED_ADMIN_NAME: "{{ (lookup('users', IAM_PLATFORM_ADMIN_USER_KEY).firstname ~ ' ' ~ lookup('users', IAM_PLATFORM_ADMIN_USER_KEY).lastname) | trim }}"
PIXELFED_ADMIN_OIDC_ID: "{{ PIXELFED_ADMIN_USERNAME }}"
PIXELFED_RBAC_ADMIN_GROUP: "/{{ lookup('rbac_group_path', application_id=application_id, role='administrator') }}"
PIXELFED_RBAC_OIDC_LOGIN_HOST: "{{ [lookup('container', application_id, 'directories.config'), 'InfinitoRbacOidcLogin.php'] | path_join }}"
PIXELFED_RBAC_USERINFO_CLIENT_HOST: "{{ [lookup('container', application_id, 'directories.config'), 'InfinitoRbacUserinfoClient.php'] | path_join }}"

design_css_urls:
  landing-bg: "{{ PIXELFED_URL }}/_landing/bg.jpg"
