---
data:
  type: volume
  name: bookwyrm_data
  mounts:
    - service: bookwyrm
      target: &app_data_target /app/data
    - service: worker
      target: *app_data_target
media:
  type: volume
  name: bookwyrm_media
  mounts:
    - service: bookwyrm
      target: &app_media_target /app/media
    - service: worker
      target: *app_media_target
