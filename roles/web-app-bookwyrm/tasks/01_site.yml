---
- name: "📥 Read the corporate logos of {{ application_id }}"
  ansible.builtin.slurp:
    src: "{{ [lookup('design', application_id).dest, item.value] | path_join }}"
  loop: "{{ BOOKWYRM_DESIGN_IMAGES | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: bookwyrm_design_images
  when: BOOKWYRM_DESIGN_LOGO_ENABLED | bool
  delegate_to: "{{ STACK_HOST }}"
  run_once: true

- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "bookwyrm"
    resolve_output_prefix: BOOKWYRM_SITE
    resolve_compose_cid: "{{ BOOKWYRM_CONTAINER }}"

- name: "👤 Converge the BookWyrm administrator, title, logos and corporate theme"
  vars:
    bookwyrm_site_stdin: |-
      {{ lookup('users', 'platform_administrator').password }}
      {{ lookup('file', 'python/site_design.py') }}
    bookwyrm_site_environment:
      ADMIN_USERNAME: "{{ lookup('users', 'platform_administrator').username }}"
      ADMIN_EMAIL: "{{ lookup('users', 'platform_administrator').email }}"
      DESIGN_STATE: "{{ 'present' if BOOKWYRM_DESIGN_ENABLED | bool else 'absent' }}"
      SITE_NAME: "{{ BOOKWYRM_SITE.site_name | default('') }}"
      THEME_NAME: "{{ BOOKWYRM_THEME_NAME }}"
      THEME_PATH: "{{ BOOKWYRM_THEME_PATH }}"
      LOGO_SMALL: "{{ bookwyrm_design_logos['logo_small'] }}"
      LOGO: "{{ bookwyrm_design_logos['logo'] }}"
      FAVICON: "{{ bookwyrm_design_logos['favicon'] }}"
    bookwyrm_design_logos: >-
      {{ dict(bookwyrm_design_images.results | map(attribute='item.key') | zip(bookwyrm_design_images.results | map(attribute='content')))
         if BOOKWYRM_DESIGN_LOGO_ENABLED | bool
         else dict(BOOKWYRM_DESIGN_IMAGES.keys() | product([''])) }}
    bookwyrm_site_state: >-
      {{ bookwyrm_site_stored.stdout | regex_search('(?m)^[{]"pending": .*$') | from_json }}
  block:
    - name: "🔎 Read the stored BookWyrm instance name and whether the site converge writes"
      ansible.builtin.shell:
        cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, run_once delegated to the hosting node
          IFS= read -r ADMIN_PASSWORD && : "${ADMIN_PASSWORD:?arrived empty on stdin}" && export ADMIN_PASSWORD && container exec -i
          -e MODE -e ADMIN_USERNAME -e ADMIN_EMAIL -e ADMIN_PASSWORD -e DESIGN_STATE -e SITE_NAME
          -e THEME_NAME -e THEME_PATH -e LOGO_SMALL -e LOGO -e FAVICON
          {{ BOOKWYRM_SITE_LOCAL_CID | quote }}
          /venv/bin/python manage.py shell --command 'import sys; exec(sys.stdin.read())'
        stdin: "{{ bookwyrm_site_stdin }}"
      environment: "{{ bookwyrm_site_environment | combine({'MODE': 'read'}) }}"
      register: bookwyrm_site_stored
      retries: 10
      delay: 6
      until: >-
        bookwyrm_site_stored.stdout is search('(?m)^[{]"pending": (true|false), ')
      changed_when: false
      failed_when: >-
        bookwyrm_site_stored.stdout is not search('(?m)^[{]"pending": (true|false), ')
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      delegate_to: "{{ BOOKWYRM_SITE_HOST_NODE }}"
      run_once: true

    - name: "👤 Revert the BookWyrm site settings that drifted"
      when: bookwyrm_site_state.pending | bool
      block:
        - name: "📣 Report the managed BookWyrm site settings the converge reverts"
          ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
          vars:
            forms_drift_current: "{{ {'site': {'site_name': bookwyrm_site_state.site_name}} if bookwyrm_site_environment.SITE_NAME | length > 0 else {} }}"

        - name: "👤 Write the BookWyrm administrator, title, logos and corporate theme"
          ansible.builtin.shell:
            cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, run_once delegated to the hosting node
              IFS= read -r ADMIN_PASSWORD && : "${ADMIN_PASSWORD:?arrived empty on stdin}" && export ADMIN_PASSWORD && container exec -i
              -e MODE -e ADMIN_USERNAME -e ADMIN_EMAIL -e ADMIN_PASSWORD -e DESIGN_STATE -e SITE_NAME
              -e THEME_NAME -e THEME_PATH -e LOGO_SMALL -e LOGO -e FAVICON
              {{ BOOKWYRM_SITE_LOCAL_CID | quote }}
              /venv/bin/python manage.py shell --command 'import sys; exec(sys.stdin.read())'
            stdin: "{{ bookwyrm_site_stdin }}"
          environment: "{{ bookwyrm_site_environment | combine({'MODE': 'converge'}) }}"
          register: bookwyrm_site
          retries: 10
          delay: 6
          until: bookwyrm_site.stdout is search('(?m)^BOOKWYRM_RESULT=[A-Z]+$')
          changed_when: bookwyrm_site.stdout is search('(?m)^BOOKWYRM_RESULT=CHANGED$')
          failed_when: bookwyrm_site.stdout is not search('(?m)^BOOKWYRM_RESULT=(UNCHANGED|CHANGED)$')
          no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
          delegate_to: "{{ BOOKWYRM_SITE_HOST_NODE }}"
          run_once: true
