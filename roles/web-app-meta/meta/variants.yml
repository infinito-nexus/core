---
# Matrix-deploy variant overrides for web-app-meta.
# See docs/contributing/artefact/files/role/variants.md for the file format.

- services:
    docs:
      enabled: false
      shared: false
    api:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    redis:
      shared: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    docs:
      enabled: true
      shared: true
    api:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false
    matomo:
      enabled: false
      shared: false
    redis:
      shared: false
    prometheus:
      enabled: false
      shared: false
    tor:
      enabled: true
