---
application_id: "web-app-meta"
entity_name: "{{ application_id | entity_name }}"

META_CONTAINER: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.name') }}"

META_GIT_ROOT: "{{ SOFTWARE_REPOSITORY | regex_replace('^https?://[^/]+/', '') | regex_replace('\\.git$', '') }}"
META_GIT_HOME: "{{ lookup('volume', application_id, 'git').target }}"
META_GIT_FORKS: "auto"
