---
application_id: "web-svc-loki"
entity_name: "{{ application_id | entity_name }}"

LOKI_CONTAINER: "{{ lookup('config', application_id, 'services.loki.name') }}"
LOKI_GATEWAY_CONTAINER: "{{ lookup('config', application_id, 'services.gateway.name') }}"
LOKI_SERVICE_HOST: "loki"

LOKI_CONFIG_DIR: "{{ lookup('container', application_id, 'directories.config') }}"
LOKI_CONFIG_HOST: "{{ [LOKI_CONFIG_DIR, 'loki.yaml'] | path_join }}"
LOKI_RULES_HOST: "{{ [LOKI_CONFIG_DIR, 'rules.yaml'] | path_join }}"
LOKI_GATEWAY_CONFIG_HOST: "{{ [LOKI_CONFIG_DIR, 'gateway.alloy'] | path_join }}"
LOKI_CONFIG_DOCKER: "{{ lookup('volume', application_id, 'config').target }}"
LOKI_GATEWAY_CONFIG_DOCKER: "{{ lookup('volume', application_id, 'gateway').target }}"

LOKI_INTERNAL_PORT: "{{ lookup('config', application_id, 'services.loki.ports.internal.loki') }}"
LOKI_GATEWAY_INTERNAL_PORT: "{{ lookup('config', application_id, 'services.gateway.ports.internal.push') }}"
LOKI_GATEWAY_LOCAL_PORT: "{{ lookup('config', application_id, 'services.gateway.ports.local.push') }}"
LOKI_SERVICE_URL: "http://{{ LOKI_SERVICE_HOST }}:{{ LOKI_INTERNAL_PORT }}"
LOKI_NETNS_URL: "http://127.0.0.1:{{ LOKI_INTERNAL_PORT }}"
LOKI_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, 'loki') }}"

LOKI_TENANT: "{{ lookup('config', application_id, 'services.loki.tenant') }}"
LOKI_PUSH_TOKEN: "{{ lookup('config', application_id, 'secrets.credentials.push_token') }}"
LOKI_PUSH_TOKEN_SHA256: "{{ LOKI_PUSH_TOKEN | hash('sha256') }}"
LOKI_PUSH_PATH: "/loki/api/v1/push"
LOKI_STORE_PUSH_URL: "{{ LOKI_SERVICE_URL }}{{ LOKI_PUSH_PATH }}"

LOKI_RETENTION_LABEL: "log_class"
LOKI_RETENTION: "{{ lookup('config', application_id, 'services.loki.retention') | loki_retention(LOKI_RETENTION_LABEL) }}"
LOKI_INGESTION_RATE_MB: "{{ lookup('config', application_id, 'services.loki.ingestion.rate_mb') }}"
LOKI_INGESTION_BURST_MB: "{{ lookup('config', application_id, 'services.loki.ingestion.burst_mb') }}"
LOKI_WAL_DISK_FULL_THRESHOLD: "{{ lookup('config', application_id, 'services.loki.wal.disk_full_threshold') }}"

LOKI_OBJSTORE_ENABLED: "{{ lookup('objstore', application_id, 'enabled') | bool }}"
LOKI_STORE: "{{ 's3' if LOKI_OBJSTORE_ENABLED | bool else 'filesystem' }}"

LOKI_ALERTING_RULE_NAME: "CriticalApplicationLogLine"
LOKI_DRIFT_RULE_NAME: "ManagedFieldOverwritten"
LOKI_ALERTING_PATTERN: "{{ lookup('config', application_id, 'services.loki.alerting.critical_pattern') }}"
LOKI_ALERTING_WINDOW: "{{ lookup('config', application_id, 'services.loki.alerting.window') }}"
LOKI_ALERTMANAGER_ENABLED: "{{ lookup('config', application_id, 'services.prometheus.enabled') | bool }}"
LOKI_ALERTMANAGER_URL: "{{ ('http://' ~ lookup('scrape_target', 'web-app-prometheus', 'alertmanager')) if LOKI_ALERTMANAGER_ENABLED | bool else '' }}" # nocheck: literal-protocol-lookup  scrape_target names a container-network host:port, which speaks plaintext in compose and swarm
LOKI_PROMETHEUS_NETWORK: "{{ 'web-app-prometheus' | entity_name }}"
