---
- include_tasks: utils/once/flag.yml

- name: "🧩 load docker for {{ application_id }}"
  include_role:
    name: sys-stk-backend
  vars:
    compose_handlers_flush: false

- name: "🕸️ Pre-create the Prometheus network the ruler reaches Alertmanager on"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/create.yml') }}"
  vars:
    network_role_id: web-app-prometheus
  when: LOKI_ALERTMANAGER_ENABLED | bool

- name: "📄 Render the Loki, ruler and ingest gateway configuration (local + swarm peers)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "loki.yaml.j2"
        dest: "{{ LOKI_CONFIG_HOST }}"
        mode: "0644"
      - src: "rules.yaml.j2"
        dest: "{{ LOKI_RULES_HOST }}"
        mode: "0644"
      - src: "gateway.alloy.j2"
        dest: "{{ LOKI_GATEWAY_CONFIG_HOST }}"
        mode: "0644"

- name: "🚿 flush handlers for '{{ application_id }}'"
  meta: flush_handlers

- name: "⏳ Wait until Loki answers /ready"
  uri_retry:
    url: "{{ LOKI_LOCAL_URL }}/ready"
    method: GET
    status_code: 200
  register: loki_ready
  until: loki_ready is succeeded
  retries: 60
  delay: 5
  when: IS_STACK_HOST | bool

- name: "📂 Include front proxy for {{ application_id }}"
  include_role:
    name: sys-stk-front-proxy
  vars:
    domain: "{{ LOKI_DOMAIN }}"
    http_port: "{{ LOKI_GATEWAY_LOCAL_PORT }}"
    proxy_internal_port: "{{ LOKI_GATEWAY_INTERNAL_PORT }}"
    webserver_proxy_service_key: gateway
