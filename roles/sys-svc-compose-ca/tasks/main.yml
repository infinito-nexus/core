---
- name: "🔐 Set up CA trust once per host"
  when: run_once_sys_svc_compose_ca is not defined
  block:
    - name: "🚫 CA trust N/A on this host (no play application needs the self-signed CA)"
      ansible.builtin.debug:
        msg: >-
          Skipping CA trust assets on {{ inventory_hostname }}: no application
          of this play is served over self-signed TLS or declares a ca_client
          service that calls a self-signed peer.
      when: not (_compose_ca_applicable | bool)

    - include_tasks: 00_core.yml
      when: _compose_ca_applicable | bool

    - include_tasks: utils/once/flag.yml
