---
- include_tasks: utils/once/flag.yml

- name: "🧩 Load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "👔 SuiteCRM manager-side operations and corporate design"
  when: IS_STACK_HOST | bool
  block:
    - name: "👔 SuiteCRM manager-side operations (file deploys + container exec)"
      include_tasks: 01_manager_ops.yml

    - name: "🎨 SuiteCRM corporate design (legacy theme, logo, favicon, system name)"
      include_tasks: 02_design.yml
