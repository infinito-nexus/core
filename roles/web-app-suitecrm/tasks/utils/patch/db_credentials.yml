---
- name: "🔑 Realign the password SuiteCRM persisted in its legacy config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "suitecrm_data"
    patch_config_rel: "public/legacy/config.php"
    patch_expression: "s|('db_password'\\s*=>\\s*')[^']*(',)|\\1@PASSWORD@\\2|"
