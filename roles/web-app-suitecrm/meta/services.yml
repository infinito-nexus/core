---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-required — object storage not implemented for this role
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: saml
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
# nocheck: playwright-service-flag — session store behind every request, no Playwright surface of its own
redis:
  bond: 1
  backup:
    disabled: true
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-redis' in group_names }}"
  cpus: "0.25"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
# nocheck: playwright-service-flag — self-provider entry; test_env_services_match.py:28-32 grants the forbidden-self-gate exemption
suitecrm:
  backup:
    stop_required: true
  healthcheck:
    flavor: curl
    # nocheck: healthcheck-timing-override  boots slower than the ten minute window; the value predates this default and has not been measured against it
    start_period: 20m
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  image: php
  # TODO: Make SuiteCRM compatible with PHP 8.5; update currently not possible. Reason: intentional legacy pin.
  # nocheck: docker-version
  version: 8.2-apache
  custom: true
  app_version: 8.10.2
  phpredis_version: 6.3.0
  update:
    - key: app_version
      type: git_tags
      repository: https://github.com/salesagility/SuiteCRM-Core.git
      match: "v"
      strip: true
    - key: phpredis_version
      type: git_tags
      repository: https://github.com/phpredis/phpredis.git
  name: suitecrm
  min_storage: 376MB
  cpus: 1.5
  mem_reservation: 1.2g
  mem_limit: 2g
  pids_limit: 768
  email:
    from_name: Customer Relationship Management (SuiteCRM, {{ DOMAIN_PRIMARY }})
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-suitecrm', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-suitecrm', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-suitecrm', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-suitecrm', '2fa') }}"
        enforced: true
  ports:
    local:
      http: 8062
    internal:
      http: 80
  run_after:
    - web-app-keycloak
    - web-app-email
    - web-app-matomo
  lifecycle: beta
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 368
      height: 80
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: dynamic-flag  gated on the role's own 2fa login method, not on group_names
# nocheck: playwright-service-flag  runtime DOM patch of the two-factor view, asserted by files/playwright/test-login-methods.js
javascript:
  bond: 1
  enabled: "{{ not (lookup('config', 'web-app-suitecrm', 'services.suitecrm.login.method.2fa.enabled') | bool) }}"
  shared: "{{ not (lookup('config', 'web-app-suitecrm', 'services.suitecrm.login.method.2fa.enabled') | bool) }}"

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
