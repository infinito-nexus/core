---
- name: "📄 Render the base decoders and rules for every opted-in tag"
  stack_host_template:
    src: "{{ item.src }}"
    dest: "{{ [ WAZUH_RULESET_DIR_HOST, item.dest ] | path_join }}"
    mode: "0644"
  loop: "{{ WAZUH_RULESET_BASE_FILES }}"
  loop_control:
    label: "{{ item.dest }}"
  register: wazuh_ruleset_base

- name: "📋 Copy the rule files of the opted-in roles"
  ansible.builtin.copy: # nocheck: stack-host-consumer (03_ruleset.yml is included with `when: IS_STACK_HOST | bool`)
    src: "{{ item.src }}"
    dest: "{{ [ WAZUH_RULESET_DIR_HOST, item.kind, item.name ] | path_join }}"
    mode: "0644"
  loop: "{{ WAZUH_RULESET_FILES }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  register: wazuh_ruleset_copy

- name: "🔍 Find the files in the ruleset directories"
  ansible.builtin.find:
    paths: "{{ WAZUH_RULESET_DIRS | map('regex_replace', '^', WAZUH_RULESET_DIR_HOST ~ '/') | list }}"
    file_type: any
    hidden: true
  register: wazuh_ruleset_found

- name: "🗑️ Remove the rule files of roles that no longer opt in"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ wazuh_ruleset_found.files | map(attribute='path')
       | difference(wazuh_ruleset_copy.results | map(attribute='dest'))
       | difference(wazuh_ruleset_base.results | map(attribute='dest')) }}
  register: wazuh_ruleset_stale

- name: "🔐 Check that the wazuh user can read the whole ruleset"
  ansible.builtin.shell:
    cmd: >-
      container exec -u wazuh {{ WAZUH_MANAGER_CONTAINER_ADDRESS }}
      find {{ WAZUH_RULESET_DIR_CONTAINER }} ! -readable
    chdir: "{{ WAZUH_INSTANCE_DIR }}"
  register: wazuh_ruleset_readable
  changed_when: false
  failed_when: wazuh_ruleset_readable.rc != 0 or wazuh_ruleset_readable.stdout | length > 0

- name: "🧪 Test the full ruleset with wazuh-analysisd -t"
  ansible.builtin.shell:
    cmd: "container exec {{ WAZUH_MANAGER_CONTAINER_ADDRESS }} /var/ossec/bin/wazuh-analysisd -t 2>&1"
    chdir: "{{ WAZUH_INSTANCE_DIR }}"
  register: wazuh_ruleset_test
  changed_when: false

- name: "🔄 Restart the Wazuh manager to load the new ruleset"
  ansible.builtin.shell:
    cmd: "container exec {{ WAZUH_MANAGER_CONTAINER_ADDRESS }} /var/ossec/bin/wazuh-control restart 2>&1"
    chdir: "{{ WAZUH_INSTANCE_DIR }}"
  when: wazuh_ruleset_base is changed or wazuh_ruleset_copy is changed or wazuh_ruleset_stale is changed
  register: wazuh_ruleset_restart
  changed_when: true

- name: "⏳ Wait for wazuh-analysisd to run again"
  ansible.builtin.shell:
    cmd: "container exec {{ WAZUH_MANAGER_CONTAINER_ADDRESS }} /var/ossec/bin/wazuh-control status"
    chdir: "{{ WAZUH_INSTANCE_DIR }}"
  when: wazuh_ruleset_restart is changed
  register: wazuh_ruleset_status
  until: "'wazuh-analysisd is running' in wazuh_ruleset_status.stdout"
  retries: 30
  delay: 5
  changed_when: false
  failed_when: "'wazuh-analysisd is running' not in wazuh_ruleset_status.stdout"

- name: "🐤 Run the deploy canary through wazuh-logtest for every tag"
  ansible.builtin.shell:
    cmd: >-
      printf '%s\n' {{ ('Oct 17 00:00:00 ' ~ WAZUH_MANAGER_CONTAINER ~ ' ' ~ item.program ~ '[1]: ' ~ WAZUH_CANARY_MARKER ~ ' deploy') | quote }} |
      container exec -i {{ WAZUH_MANAGER_CONTAINER_ADDRESS }} /var/ossec/bin/wazuh-logtest
      -U {{ WAZUH_CANARY_RULE_ID }}:{{ WAZUH_LOG_ALERT_LEVEL }}:{{ item.decoder }} 2>&1
    chdir: "{{ WAZUH_INSTANCE_DIR }}"
  loop: "{{ WAZUH_CANARY_SOURCES }}"
  loop_control:
    label: "{{ item.program }}"
  register: wazuh_ruleset_canary
  until: wazuh_ruleset_canary.rc == 0
  retries: 6
  delay: 5
  changed_when: false
  failed_when: false

- name: "🛑 Fail when the deploy canary did not fire for a tag"
  ansible.builtin.fail:
    msg: >-
      Canary rule {{ WAZUH_CANARY_RULE_ID }} (level {{ WAZUH_LOG_ALERT_LEVEL }}) did not fire for
      {{ wazuh_ruleset_canary.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.program') | list }}.
      wazuh-logtest output: {{ wazuh_ruleset_canary.results | rejectattr('rc', 'equalto', 0) | map(attribute='stdout') | list }}
  when: wazuh_ruleset_canary.results | rejectattr('rc', 'equalto', 0) | list | length > 0

- name: "🧾 Run every role's sample events through wazuh-logtest"
  ansible.builtin.shell:
    cmd: >-
      printf '%s\n'
      {% for line in item.lines %}{{ ('Oct 17 00:00:00 ' ~ WAZUH_MANAGER_CONTAINER ~ ' ' ~ item.program ~ '[1]: ' ~ line) | quote }} {% endfor %}|
      container exec -i {{ WAZUH_MANAGER_CONTAINER_ADDRESS }} /var/ossec/bin/wazuh-logtest
      -U {{ item.rule }}:{{ item.level }}:{{ item.decoder }} 2>&1
    chdir: "{{ WAZUH_INSTANCE_DIR }}"
  loop: "{{ WAZUH_RULESET_SAMPLES }}"
  loop_control:
    label: "{{ item.role }} → {{ item.rule }}"
  register: wazuh_ruleset_samples
  changed_when: false
  failed_when: false

- name: "🛑 Fail when a sample event does not hit its expected rule"
  ansible.builtin.fail:
    msg: >-
      {% for result in wazuh_ruleset_samples.results | rejectattr('rc', 'equalto', 0) %}
      Role {{ result.item.role }}: sample {{ result.item.lines }} expected rule {{ result.item.rule }}
      at level {{ result.item.level }} with decoder {{ result.item.decoder }}. wazuh-logtest output: {{ result.stdout }}
      {% endfor %}
  when: wazuh_ruleset_samples.results | rejectattr('rc', 'equalto', 0) | list | length > 0
