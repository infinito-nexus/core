---
- name: "🏷️ Name this deploy's app canaries"
  ansible.builtin.set_fact:
    wazuh_app_canary_run: "deploy-{{ now(utc=true, fmt='%Y%m%dT%H%M%S%f') }}"

- name: "🐤 Send the HTTP canary to every opted-in app on its local port"
  uri_retry:
    url: >-
      http://{{ WAZUH_APP_CANARY_HOST }}:{{ lookup('config', item.role, 'services.' ~ item.entity ~ '.ports.local.http') }}/{{ WAZUH_CANARY_MARKER }}%20{{ item.entity }}-{{ wazuh_app_canary_run }}
    headers:
      Host: "{{ lookup('tls', item.role, 'domain') }}"
    follow_redirects: none
    status_code: "{{ range(100, 600) | list }}"
  delegate_to: "{{ groups[item.role][0] }}"
  loop: "{{ WAZUH_CANARY_ENTITIES }}"
  loop_control:
    label: "{{ item.entity }}"
  changed_when: false

- name: "🔎 Wait for every app's canary alert in wazuh-alerts-*"
  uri_retry:
    url: "{{ WAZUH_INDEXER_INTERNAL_API_URL }}/wazuh-alerts-*/_search"
    method: POST
    user: "{{ WAZUH_INDEXER_ADMIN_USERNAME }}"
    password: "{{ WAZUH_INDEXER_ADMIN_PASSWORD }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      query:
        bool:
          filter:
            - term:
                rule.id: "{{ WAZUH_HTTP_CANARY_RULE_ID | string }}"
            - term:
                decoder.name: "{{ item.decoder }}"
            - match_phrase:
                full_log: "{{ WAZUH_CANARY_MARKER }} {{ item.entity }}-{{ wazuh_app_canary_run }}"
    status_code: 200
    return_content: true
  loop: "{{ WAZUH_CANARY_ENTITIES }}"
  loop_control:
    label: "{{ item.entity }}"
  register: wazuh_app_canary_search
  until: >-
    wazuh_app_canary_search.json is defined and
    wazuh_app_canary_search.json.hits.total.value > 0
  retries: "{{ WAZUH_CANARY_WAIT_RETRIES }}"
  delay: "{{ WAZUH_POLL_DELAY }}"
  changed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
