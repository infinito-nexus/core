---
credentials:
  indexer_admin_password:
    description: "Password for the wazuh-indexer's internal 'admin' service account (OpenSearch security plugin). Consumed by manager/dashboard as INDEXER_PASSWORD,
      by Ansible health checks and securityadmin.sh, and hashed into internal_users.yml."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 40
  dashboard_service_password:
    description: "Password for the wazuh-indexer's internal 'kibanaserver' service account. Consumed by wazuh.dashboard as DASHBOARD_PASSWORD and hashed into internal_users.yml."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 40
  wazuh_wui_password:
    description: "Password for the 'wazuh-wui' Wazuh API account. Consumed by wazuh.manager (API_PASSWORD, creates the account) and wazuh.dashboard (WAZUH API connection
      in wazuh.yml)."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 40
  manager_cluster_key:
    description: "wazuh-manager cluster key (ossec.conf <cluster><key>). Clustering is disabled in this single-node deployment, but the key MUST NOT ship as the well-known
      upstream demo value in case clustering is enabled later."
    algorithm: random_hex_16
    validation: "^[a-f0-9]{32}$"
  authd_password:
    description: "Password the manager's enrollment service (wazuh-authd, port 1515) requires (etc/authd.pass). The service stays on because POST /agents/insert registers
      agents through it; the port is reachable only inside the stack, and the password keeps anything there from enrolling an agent without a vault key."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 40
  agent_key:
    description: "Pre-shared key of the host's Wazuh agent (id 001), registered on the manager through POST /agents/insert. Generated at random, never derived from public
      inputs such as the host name. Rotating it and redeploying replaces the registration, which revokes the old key. The manager requires exactly 64 alphanumeric characters."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{64}$"
    length: 64
