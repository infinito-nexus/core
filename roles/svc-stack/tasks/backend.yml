---
- name: "🔍 Resolve backend context for '{{ application_id }}'"
  ansible.builtin.set_fact:
    stack_backend_database_consumer_id: >-
      {{ database_consumer_id | default(application_id) }}
    stack_backend_database_enabled: >-
      {{ lookup('database', application_id, 'enabled') | bool }}
    stack_backend_flush: >-
      {{ lookup('config', application_id, 'services.stack.flush', false) | bool }}
    stack_backend_checkout_url: >-
      {{ lookup('config', application_id, 'services.stack.checkout.url', '') }}
    stack_backend_checkout_ref: >-
      {{ lookup('config', application_id, 'services.stack.checkout.ref', '') }}
    stack_backend_checkout_recursive: >-
      {{ lookup('config', application_id, 'services.stack.checkout.recursive', true) | bool }}
  changed_when: false

- name: "🐛 DEBUG | SVC-STACK | Application context"
  ansible.builtin.debug:
    msg:
      - "application_id={{ application_id }}"
      - "database_consumer_id={{ stack_backend_database_consumer_id }}"
      - "database_enabled={{ stack_backend_database_enabled }}"
      - "sso_proxy_enabled={{ lookup('sso', application_id, 'is_proxy_gated') }}"
  when: lookup('debug', 'svc-stack') | bool

- name: "🧩 For '{{ application_id }}': Load central RDBMS"
  include_role:
    name: sys-svc-rdbms
    public: false
  vars:
    database_consumer_id: "{{ stack_backend_database_consumer_id }}"
  when: stack_backend_database_enabled | bool

- name: "🧩 '{{ application_id }}': load per-consumer central object store"
  include_role:
    name: sys-svc-objstore
    public: false
  vars:
    objstore_consumer_id: "{{ application_id }}"
  when:
    - lookup('objstore', application_id, 'enabled') | bool
    - lookup('objstore', application_id, 'shared') | bool
    - application_id != lookup('objstore', application_id, 'id')

- name: "🧩 For '{{ application_id }}': Load central engines (per-consumer provisioning)"
  include_role:
    name: sys-svc-engine
    public: false
  vars:
    engine_consumer_id: "{{ application_id }}"

- name: "🧩 For '{{ application_id }}': Load sys-svc-compose"
  include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: false
    database_consumer_id: "{{ stack_backend_database_consumer_id }}"
    compose_repository_url: "{{ stack_backend_checkout_url }}"
    compose_repository_ref: "{{ stack_backend_checkout_ref }}"
    compose_repository_recursive: "{{ stack_backend_checkout_recursive }}"

- block:
    - name: "🔧 set sso_proxy_application_id (needed due to lazy-loading issue)"
      set_fact:
        sso_proxy_application_id: "{{ application_id }}"
    - name: "📄 render web-app-keycloak SSO-proxy sidecar config"
      include_tasks: "{{ lookup('path_absolute', 'roles/web-app-keycloak/tasks/sso_proxy.yml') }}"
  when: lookup('sso', application_id, 'is_proxy_gated') | bool

- name: "📂 For '{{ application_id }}': re-own the compose handler topics before the flush"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: none.yml
    handlers_from: main

- name: "🚿 flush compose and SSO proxy"
  meta: flush_handlers
  when: stack_backend_flush | bool

- name: "🔑 For '{{ application_id }}': realign a dedicated postgres"
  include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/realign_dedicated_db.yml') }}"
    apply:
      delegate_to: "{{ STACK_HOST }}"
      run_once: true
