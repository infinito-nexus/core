---
- name: "🧊 Freeze the consumer whose vhosts the stack serves"
  ansible.builtin.set_fact:
    stack_application_id: "{{ ansible_parent_role_names | default([application_id]) | first }}"
  changed_when: false

- name: "🛑 Refuse a stack run outside a consumer role"
  ansible.builtin.assert:
    that:
      - stack_application_id != 'svc-stack'
    fail_msg: "svc-stack resolved no consumer: include it from the consumer role's own tasks."
    quiet: true

- name: "🌐 For '{{ stack_application_id }}': serve the vhosts its meta declares"
  ansible.builtin.include_tasks: proxy.yml
  vars:
    application_id: "{{ stack_application_id }}"
  when:
    - lookup('config', stack_application_id, 'services.openresty.enabled', false) | bool
    - lookup('config', stack_application_id, 'services.openresty.shared', false) | bool
