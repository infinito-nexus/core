---
- name: "🧊 For '{{ application_id }}': freeze the vhosts its meta declares"
  ansible.builtin.set_fact:
    front_proxy_application_id: "{{ application_id }}"
    front_proxy_vhosts: >-
      {{
        lookup('config', application_id, 'server.vhosts', {})
        | stack_vhosts(
            lookup('domain', application_id),
            lookup('domains', application_id, []),
            CURRENT_PLAY_SERVED_DOMAINS | default([])
            | selectattr('application_id', 'equalto', application_id)
            | map(attribute='name')
            | list
          )
      }}
  changed_when: false

- name: "🌐 For '{{ front_proxy_application_id }}': serve every declared vhost"
  ansible.builtin.include_tasks: proxy/domain.yml
  loop: "{{ front_proxy_vhosts }}"
  loop_control:
    loop_var: front_proxy_vhost
    label: "{{ front_proxy_vhost.key }}: {{ front_proxy_vhost.domain }}"
  vars:
    application_id: "{{ front_proxy_application_id }}"
    domain: "{{ front_proxy_vhost.domain }}"
