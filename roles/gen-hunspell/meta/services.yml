---
hunspell:
  modes:
    host:
      enabled: true
  languages:
    - "{{ HOST_LL_CC | lower }}"
  lifecycle: pre-alpha
  min_storage: "100MB"
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "64m"
  pids_limit: 64

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
