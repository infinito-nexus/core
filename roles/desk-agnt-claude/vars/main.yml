---
application_id: desk-agnt-claude
agnt_claude_package: "@anthropic-ai/claude-code"
agnt_claude_home: "/home/{{ lookup('users', WORKSTATION_USER).username }}"
agnt_claude_settings_path: "{{ [agnt_claude_home, '.claude', 'settings.json'] | path_join }}"
agnt_claude_gateway_url: "{{ lookup('config', application_id, 'services.agnt-claude.gateway_url') }}"
agnt_claude_model: "{{ lookup('config', application_id, 'services.agnt-claude.model') }}"
agnt_claude_background_model: "{{ lookup('config', application_id, 'services.agnt-claude.background_model') }}"
agnt_claude_gateway_key: "{{ lookup('config', application_id, 'secrets.credentials.gateway_key') }}"
agnt_claude_configured: "{{ (agnt_claude_gateway_url | length > 0) and (agnt_claude_gateway_key | length > 0) }}"
