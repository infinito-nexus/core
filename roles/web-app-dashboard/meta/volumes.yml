---
config:
  type: config
  source: "{{ [lookup('container', 'web-app-dashboard', 'directories.volumes'), 'config.yaml'] | path_join }}"
  mode: "0444"
  mounts:
    - service: dashboard
      target: /app/config.yaml
i18n_content:
  type: bind
  source: "{{ [lookup('container', 'web-app-dashboard', 'directories.volumes'), 'i18n-content'] | path_join }}"
  mounts:
    - service: dashboard
      target: /app/i18n/content
