---
- name: "🔍 Resolve the {{ dashboard_instance.network }} Dashboard node + container"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ 'dashboard' | labelled(dashboard_instance.label, '-') }}"
    resolve_service_name: "{{ (lookup('container_service', DASHBOARD_APPLICATION_ID, 'dashboard') | labelled(dashboard_instance.label, '-')) if IS_SWARM_MODE else
      '' }}"
    resolve_output_prefix: DASHBOARD
    resolve_compose_cid: "{{ DASHBOARD_CONTAINER | labelled(dashboard_instance.label, '-') }}"

- name: "🔍 Resolve the {{ dashboard_instance.network }} Dashboard network namespace"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns.yml') }}"
  vars:
    netns_output_prefix: DASHBOARD

- name: "⏳ Wait for the {{ dashboard_instance.network }} Dashboard instance"
  ansible.builtin.command:
    argv: "{{ DASHBOARD_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', '') }}"
  environment:
    HTTP_METHOD: GET
    HTTP_URL: "http://127.0.0.1:{{ lookup('config', DASHBOARD_APPLICATION_ID, 'services.dashboard.ports.internal.' ~ ('http' | labelled(dashboard_instance.label,
      '_'))) }}/"
  register: dashboard_http
  retries: 60
  delay: 5
  until: dashboard_http.rc == 0 and (dashboard_http.stdout | from_json).status == 200
  changed_when: false
  delegate_to: "{{ DASHBOARD_HOST_NODE }}"
  become: true
  run_once: true
