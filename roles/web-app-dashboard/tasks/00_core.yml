---
- include_tasks: utils/once/flag.yml

- name: "📂 Include JS routines"
  include_tasks: "01_javascript.yml"
  when: IS_STACK_HOST | bool

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false
    compose_repository_pull: false
    webserver_extra_configuration: "{{ lookup('template', 'nginx/sso.html.conf.j2') }}"

- name: "🌐 Load the port-ui content catalogs from the core translations"
  set_fact:
    dashboard_i18n_content: "{{ lookup('i18n_content', 'role:', 'menu:') }}"
  run_once: true

- name: "📁 Ensure the port-ui content catalog directory exists in the build context"
  ansible.builtin.file:
    path: "{{ DASHBOARD_I18N_CONTENT_DIR }}"
    state: directory
    mode: "0755"
  when: IS_STACK_HOST | bool

- name: "🌐 Render the port-ui content catalogs into the build context"
  stack_host_template:
    src: "i18n-content.yaml.j2"
    dest: "{{ [ DASHBOARD_I18N_CONTENT_DIR, item ~ '.yaml' ] | path_join }}"
  loop: "{{ dashboard_i18n_content | list | sort }}"
  notify:
    - compose-build
    - compose-up
    - container-recreate

- name: "🔎 Find the port-ui content catalogs already in the build context"
  ansible.builtin.find:
    paths: "{{ DASHBOARD_I18N_CONTENT_DIR }}"
    patterns: "*.yaml"
    file_type: file
  register: dashboard_i18n_rendered

- name: "🗑️ Drop the catalog of a language core no longer translates"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ dashboard_i18n_rendered.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename | regex_replace('[.]yaml$', '') not in dashboard_i18n_content
  notify:
    - compose-build
    - compose-up
    - container-recreate

- name: "👔 Dashboard manager-side operations (file deploys + container exec)"
  include_tasks: 02_manager_ops.yml
  when: IS_STACK_HOST | bool
