---
- include_tasks: utils/once/flag.yml

- name: "📂 Include JS routines per network"
  include_tasks: "01_javascript.yml"
  when: IS_STACK_HOST | bool
  loop: "{{ DASHBOARD_INSTANCES }}"
  loop_control:
    loop_var: dashboard_instance
  vars:
    domain: "{{ DASHBOARD_INSTANCE_DOMAIN }}"

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "🌐 Load the port-ui content catalogs from the core translations"
  set_fact:
    dashboard_i18n_content: "{{ lookup('i18n_content', 'role:', 'menu:', 'logout:choice_') }}"
  run_once: true

- name: "🏠 Stack-host side of the dashboard deployment"
  when: IS_STACK_HOST | bool
  block:
    - name: "🌐 Write the port-ui content catalogs into the build context"
      stack_host_files:
        path: "{{ DASHBOARD_I18N_CONTENT_DIR }}"
        documents: "{{ dashboard_i18n_content }}"
      notify:
        - compose-build
        - compose-up
        - container-recreate

    - name: "👔 Dashboard manager-side operations (file deploys + container exec)"
      include_tasks: 02_manager_ops.yml
