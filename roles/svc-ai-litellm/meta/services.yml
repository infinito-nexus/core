---
litellm:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  backup:
    no_stop_required: true
  image: ghcr.io/berriai/litellm
  version: main-v1.77.7-stable
  name: litellm
  max_output_tokens: 512
  upstream_timeout: 240
  router_alias: auto
  router_remote_fallback: false
  # nocheck: dynamic-flag
  router_strategy: "{{ 'system_one' if (lookup('config', 'svc-ai-litellm', 'services.jeff.enabled') | bool) else 'weighted' }}"
  router_weights:
    locality: 1.0
    cost: 0.4
    speed: 0.25
    caching: 0.15
    throughput: 0.1
  router_min_chars_per_token: 2
  router_state_chars: 512
  router_speed_samples: 12
  router_speed_timeout: 60
  router_speed_remeasure: false
  remote_models:
    - alias: openai/gpt-4o-mini
      model: openai/gpt-4o-mini
      provider: openai
    - alias: anthropic/claude-sonnet-4-5
      model: anthropic/claude-sonnet-4-5
      provider: anthropic
    - alias: openrouter/auto
      model: openrouter/openrouter/auto
      provider: openrouter
  min_storage: 1022MB
  cpus: "2.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
  ports:
    local:
      http: 8081
    internal:
      http: 4000
  run_after:
    - svc-db-postgres
  lifecycle: beta

postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag
# nocheck: gateway-backend-registered  Reason: jeff decides which model answers, it is not one; the router hook calls /v1/systemone, no model alias resolves to it
jeff:
  bond: 0.5
  enabled: "{{ 'svc-ai-jeff' in group_names }}"
  shared: "{{ 'svc-ai-jeff' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag
ollama:
  bond: 1
  enabled: "{{ 'svc-ai-ollama' in group_names }}"
  shared: "{{ 'svc-ai-ollama' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag
lmstudio:
  bond: 0.5
  enabled: "{{ 'svc-ai-lmstudio' in group_names }}"
  shared: "{{ 'svc-ai-lmstudio' in group_names }}"
