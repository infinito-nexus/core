---
- include_tasks: utils/once/flag.yml

- name: "🛑 Refuse a gateway on a host that uses another host's gateway"
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} carries svc-ai-litellm but names
      '{{ LITELLM_GATEWAY_HOST }}' as its gateway host in
      applications.svc-ai-litellm.services.litellm.gateway_host. A consuming
      host runs no gateway of its own: remove svc-ai-litellm from the
      inventory of {{ inventory_hostname }} to use the gateway on
      {{ LITELLM_GATEWAY_HOST }}, or clear the value to keep this host's own.
  when: LITELLM_GATEWAY_REMOTE | bool

- name: "🛑 Refuse to serve consuming hosts from a host off the mesh"
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} holds gateway keys for
      {{ LITELLM_HOST_KEYS | list | join(', ') }}, which reach it only over the
      WireGuard mesh, but has no mesh address. Run
      cli.administration.inventory.mesh over every inventory of the deploy
      before cli.administration.inventory.gateway.
  when:
    - LITELLM_SERVES_HOSTS | bool
    - LITELLM_MESH_BIND_HOST | length == 0

- name: "✅ Require a usable FreeLLMAPI upstream configuration"
  when: LITELLM_FREELLMAPI_BACKEND | bool
  block:
    - name: ✅ Require a provisioned FreeLLMAPI key for the shared upstream
      ansible.builtin.assert:
        that:
          - LITELLM_PROVIDER_KEYS.freellmapi | trim | length > 0
          - lookup('config', application_id, 'services.litellm.freellmapi.alias') | length > 0
          - lookup('config', application_id, 'services.litellm.freellmapi.alias') != LITELLM_ROUTER_ALIAS
          - lookup('config', application_id, 'services.litellm.freellmapi.model') | length > 0
        fail_msg: >-
          The token store holds no FreeLLMAPI unified key. Deploy svc-ai-freellmapi
          before svc-ai-litellm so it persists the key its dashboard issued. The
          LiteLLM upstream alias must be nonempty and distinct from its router alias.
        quiet: true

    - name: ✅ Require explicit FreeLLMAPI pool capabilities before automatic routing
      ansible.builtin.assert:
        that:
          - lookup('config', application_id, 'services.litellm.freellmapi.context') is integer
          - lookup('config', application_id, 'services.litellm.freellmapi.context') > 0
          - lookup('config', application_id, 'services.litellm.freellmapi.traits') is mapping
          - lookup('config', application_id, 'services.litellm.freellmapi.traits').get('tools') is boolean
        fail_msg: >-
          Set services.litellm.freellmapi.context and traits.tools to the guaranteed
          capabilities of the configured FreeLLMAPI pool before include_in_auto=true.
      when: lookup('config', application_id, 'services.litellm.freellmapi.include_in_auto') | bool

- include_tasks: utils/load/handlers.yml
  vars:
    handler_role_name: "sys-svc-compose"

- name: "🧩 For '{{ application_id }}': Load central RDBMS"
  include_role:
    name: sys-svc-rdbms
    public: false
  vars:
    database_consumer_id: "{{ application_id }}"
  when: lookup('database', application_id, 'enabled') | bool

- name: "🛑 Refuse a remote model whose provider has no key slot"
  ansible.builtin.assert:
    that:
      - LITELLM_REMOTE_MODELS | map(attribute='provider') | difference((LITELLM_PROVIDER_KEYS | list) + [AI_MOCK_PROVIDER]) | length == 0
    fail_msg: >-
      services.litellm.remote_models names provider(s)
      {{ LITELLM_REMOTE_MODELS | map(attribute='provider') | difference((LITELLM_PROVIDER_KEYS | list) + [AI_MOCK_PROVIDER]) | unique | join(', ') }};
      known providers are {{ ((LITELLM_PROVIDER_KEYS | list) + [AI_MOCK_PROVIDER]) | join(', ') }}. A model served by
      '{{ AI_MOCK_PROVIDER }}' answers from its own declared response and needs no key.
    quiet: true

- name: "🔍 Look for the rates the last deploy measured"
  ansible.builtin.stat:
    path: "{{ LITELLM_SPEED_PATH_HOST }}"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  register: litellm_speed_file

- name: "📥 Read the rates the last deploy measured"
  ansible.builtin.slurp:
    src: "{{ LITELLM_SPEED_PATH_HOST }}"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  register: litellm_speed_stored
  when: litellm_speed_file.stat.exists

- name: "🧮 Rank this render on those rates"
  ansible.builtin.set_fact:
    LITELLM_MEASURED_SPEED: "{{ (litellm_speed_stored.content | b64decode | from_json) if litellm_speed_file.stat.exists else {} }}"

- name: "📁 Create the decider package directory"
  ansible.builtin.file:
    path: "{{ LITELLM_DECIDER_DIR_HOST }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true

- name: "🧩 Stage the decider package beside the router hook"
  stack_host_copy:
    src: "{{ [ LITELLM_DECIDER_SOURCE_DIR, item ] | path_join }}"
    dest: "{{ [ LITELLM_DECIDER_DIR_HOST, item ] | path_join }}"
    mode: "0444"
  loop: "{{ LITELLM_DECIDER_MODULES }}"
  notify:
    - compose-up
    - container-recreate

- name: "📄 Render LiteLLM gateway config (local + swarm peers)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "router_hook.py.j2"
        dest: "{{ LITELLM_ROUTER_HOOK_PATH_HOST }}"
      - src: "config.yaml.j2"
        dest: "{{ LITELLM_CONFIG_PATH_HOST }}"

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true

- name: "✅ Validate remote providers before configuring consumers"
  ansible.builtin.include_tasks: utils/validate/providers.yml
  when:
    - IS_STACK_HOST | bool
    - LITELLM_VALIDATION_ENABLED | bool
    - LITELLM_REMOTE_MODELS | selectattr('provider', 'in', LITELLM_KEYED_PROVIDERS) | list | length > 0

- name: "🔍 Build consumer key list"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  ansible.builtin.set_fact:
    LITELLM_CONSUMER_KEYS: >-
      {%- set out = [] -%}
      {%- for consumer in lookup('roles_with_service', 'litellm', scope='all', include_headless=true) -%}
        {%- set key = lookup('config', consumer.id, 'secrets.credentials.litellm_api_key', '') -%}
        {%- if key -%}
          {%- set _ = out.append({'alias': consumer.id, 'key': key}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out | litellm_gateway_keys(LITELLM_HOST_KEYS) }}

- name: "🔑 Provision consumer keys and validate the FreeLLMAPI upstream"
  when: IS_STACK_HOST | bool
  block:
    - name: "🔑 Provision consumer keys and revoke stale host keys"
      ansible.builtin.include_tasks: 01_keys.yml

    - name: "✅ Validate the FreeLLMAPI upstream protocols through LiteLLM"
      ansible.builtin.include_tasks: utils/validate/freellmapi.yml
      when:
        - LITELLM_VALIDATION_ENABLED | bool
        - LITELLM_FREELLMAPI_BACKEND | bool

- name: "🔁 Publish the current gateway models in Open WebUI"
  ansible.builtin.include_role:
    name: web-app-openwebui
    tasks_from: utils/refresh_model_grants.yml
  vars:
    application_id: web-app-openwebui
  when:
    - "'web-app-openwebui' in group_names"
    - lookup('config', 'web-app-openwebui', 'services.agent-broker.enabled') | bool
