---
intel:
  # nocheck: architecture-pin  Reason: the Intel media driver it installs (intel-media-driver, intel-media-va-driver, libva-intel-media-driver) is built for x86_64 only on every supported distro, so no arm64 package exists
  architectures:
    - amd64
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  min_storage: 0GB
  lifecycle: alpha
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "64m"
  pids_limit: 64

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
