---
intel:
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  min_storage: 0GB
  lifecycle: alpha
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "64m"
  pids_limit: 64

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
