---
# General
application_id: "web-app-fider"

FIDER_CONTAINER: "{{ lookup('config', application_id, 'services.fider.name') }}"

FIDER_OIDC_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') }}"

FIDER_TENANT_BOOTSTRAP_BODY:
  tenantName: "{{ SOFTWARE_NAME }}"
  subdomain: "fider"
  name: "{{ lookup('users', 'administrator').firstname }} {{ lookup('users', 'administrator').lastname }}"
  email: "{{ lookup('users', 'administrator').email }}"
  legalAgreement: true
  token: ""
FIDER_MCP_ENABLED: "{{ lookup('config', application_id, 'services.fidermcp.enabled') | bool }}"
FIDER_MCP_SERVICE_KEY: "fidermcp"
FIDER_MCP_CONTAINER: "{{ lookup('config', application_id, 'services.fidermcp.name') }}"
FIDER_MCP_PORT: "{{ lookup('config', application_id, 'services.fidermcp.ports.internal.http') }}"
FIDER_MCP_BEARER: "{{ lookup('config', application_id, 'secrets.credentials.mcp_bearer') }}"
FIDER_MCP_INSTANCE_DIR: "{{ [lookup('container', application_id, 'directories.instance'), 'mcp'] | path_join }}"
FIDER_MCP_UPSTREAM_HOST: "{{ lookup('config', application_id, 'services.fider.name') }}"
FIDER_MCP_UPSTREAM_PORT: "{{ lookup('config', application_id, 'services.fider.ports.internal.http') }}"
FIDER_MCP_UPSTREAM_URL: "http://{{ FIDER_MCP_UPSTREAM_HOST }}:{{ FIDER_MCP_UPSTREAM_PORT }}"
FIDER_MCP_CONTRACT:
  provider: "{{ application_id }}"
  upstream_url: "{{ FIDER_MCP_UPSTREAM_URL }}"
  auth_subject: "{{ lookup('config', application_id, 'mcp.auth_subject') }}"
  mutating_tools_enabled: "{{ lookup('config', application_id, 'mcp.tools.mutating_tools_enabled') | bool }}"
  tools: "{{ lookup('file', 'mcp/tools.json') | from_json }}"
  limits: "{{ lookup('config', application_id, 'mcp.limits') }}"
  schema_sha256: "{{ lookup('config', application_id, 'mcp.tools.schema_sha256') }}"
FIDER_MCP_UPSTREAM_KEY: ""
