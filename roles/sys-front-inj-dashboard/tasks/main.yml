---
- include_tasks: 00_core.yml
  when: run_once_sys_front_inj_dashboard is not defined

- name: "📄 Load iFrame init code for '{{ application_id }}'"
  set_fact:
    iframe_init_code: "{{ lookup('template_shallow', 'iframe/init_one_liner.js.j2') }}"

- name: "🗜️ Collapse iFrame init code into one-liner for '{{ application_id }}'"
  set_fact:
    iframe_init_code_one_liner: "{{ iframe_init_code | to_one_liner }}"

- name: "➕ Append iFrame init CSP hash for '{{ domain }}'"
  set_fact:
    webserver_csp_hashes_extra_by_vhost: >-
      {{ webserver_csp_hashes_extra_by_vhost
         | add_csp_hash(domain, 'script-src-elem', iframe_init_code_one_liner) }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: false
