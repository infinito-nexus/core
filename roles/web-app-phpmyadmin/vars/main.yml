---
# General
application_id: "web-app-phpmyadmin"
database_host: "{{ lookup('config','svc-db-mariadb', 'services.mariadb.name') if lookup('database', application_id, 'shared') }}"

PHPMYADMIN_CONTAINER: "{{ lookup('config', application_id, 'services.phpmyadmin.name') }}"
PHPMAYADMIN_AUTOLOGIN_ENABLED: "{{ lookup('config', application_id, 'services.phpmyadmin.autologin') | bool }}"

PHPMAYADMIN_ROOT_PASSWORD: "{{ lookup('config','svc-db-mariadb', 'secrets.credentials.root_password') }}"
PHPMAYADMIN_ROOT_USER: "root"
PHPMAYADMIN_DB_HOST: "{{ lookup('config','svc-db-mariadb', 'services.mariadb.name') }}"
