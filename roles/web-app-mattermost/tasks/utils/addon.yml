---
- name: "📦 Mattermost | Install {{ mattermost_addon.key }} from the plugin marketplace"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - "{{ MATTERMOST_LOCAL_CID }}" # nocheck: container-exec-resolver
      - "{{ MATTERMOST_MMCTL }}"
      - --local
      - plugin
      - marketplace
      - install
      - "{{ mattermost_addon.value.config.plugin_id }}"
  register: mattermost_addon_install
  changed_when: mattermost_addon_install.rc == 0
  failed_when: mattermost_addon_install.rc != 0 and (mattermost_addon.value.required | bool)
  delegate_to: "{{ MATTERMOST_HOST_NODE }}"
  when: mattermost_addon.value.source == 'upstream'

- name: "⚠️ Mattermost | Report the skipped {{ mattermost_addon.key }} install"
  ansible.builtin.debug:
    msg: >-
      {{ application_id }}: optional addon '{{ mattermost_addon.key }}' stays absent -
      'mmctl plugin marketplace install {{ mattermost_addon.value.config.plugin_id }}'
      failed, so the plugin is neither installed nor enabled in this run.
  when:
    - mattermost_addon.value.source == 'upstream'
    - (mattermost_addon_install.rc | default(0)) != 0

- name: "🟢 Mattermost | Enable {{ mattermost_addon.key }}"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - "{{ MATTERMOST_LOCAL_CID }}" # nocheck: container-exec-resolver
      - "{{ MATTERMOST_MMCTL }}"
      - --local
      - plugin
      - enable
      - "{{ mattermost_addon.value.config.plugin_id }}"
  register: mattermost_addon_enable
  changed_when: mattermost_addon_enable.rc == 0
  failed_when: mattermost_addon_enable.rc != 0 and (mattermost_addon.value.required | bool)
  delegate_to: "{{ MATTERMOST_HOST_NODE }}"
  when: mattermost_addon.value.source == 'bundled' or (mattermost_addon_install.rc | default(1)) == 0

- name: "🔧 Mattermost | Run the {{ mattermost_addon.key }} integration hook"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/addons/{{ mattermost_addon.key }}.yml"
