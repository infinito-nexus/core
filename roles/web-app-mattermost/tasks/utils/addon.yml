---
- name: "🧮 Mattermost | Resolve the architecture {{ mattermost_addon.key }} would run on"
  ansible.builtin.set_fact:
    mattermost_addon_architecture: "{{ HOST_ARCHITECTURE_BY_KERNEL[hostvars[MATTERMOST_HOST_NODE].ansible_facts['architecture']] }}"

- name: "🧮 Mattermost | Decide whether {{ mattermost_addon.key }} can run here"
  ansible.builtin.set_fact:
    mattermost_addon_runnable: >-
      {{ (mattermost_addon.value.architectures is not defined)
         or mattermost_addon_architecture in mattermost_addon.value.architectures }}

- name: "⏭️ Mattermost | Report {{ mattermost_addon.key }} as out of reach on this node"
  ansible.builtin.debug:
    msg: >-
      {{ application_id }}: {{ mattermost_addon.key }} declares
      architectures={{ mattermost_addon.value.architectures }} and
      {{ MATTERMOST_HOST_NODE }} runs {{ mattermost_addon_architecture }},
      so the plugin is neither installed nor enabled here.
  when: not (mattermost_addon_runnable | bool)

- name: "🧩 Mattermost | Provision {{ mattermost_addon.key }} where its backend can run"
  when: mattermost_addon_runnable | bool
  block:
    - name: "📦 Mattermost | Provision the upstream {{ mattermost_addon.key }} plugin"
      ansible.builtin.include_tasks: addon_upstream.yml
      when: mattermost_addon.value.source == 'upstream'

    - name: "🟢 Mattermost | Enable {{ mattermost_addon.key }}"
      ansible.builtin.command:
        argv:
          - container
          - exec
          - -i
          - "{{ MATTERMOST_LOCAL_CID }}" # nocheck: container-exec-resolver
          - "{{ MATTERMOST_MMCTL }}"
          - --local
          - plugin
          - enable
          - "{{ mattermost_addon.value.config.plugin_id }}"
      register: mattermost_addon_enable
      changed_when: mattermost_addon_enable.rc == 0
      failed_when: mattermost_addon_enable.rc != 0 and (mattermost_addon.value.required | bool)
      delegate_to: "{{ MATTERMOST_HOST_NODE }}"
      when: mattermost_addon.value.source == 'bundled' or (mattermost_addon_install.rc | default(1) | int) == 0

    - name: "🔧 Mattermost | Run the {{ mattermost_addon.key }} integration hook"
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/addons/{{ mattermost_addon.key }}.yml"
