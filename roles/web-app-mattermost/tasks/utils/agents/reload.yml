---
# Exception: the Agents plugin keeps its config in an in-memory atomic pointer
# loaded once in OnActivate, and bots.EnsureBots() (the only path that creates
# the bot account) runs from there and from the config update listener. A write
# straight into agents_confighistory reaches neither, so the plugin must be
# cycled for the merged service and bot to take effect.
- name: "🧩 Mattermost | Deactivate the Agents plugin so it drops its cached config"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - "{{ mattermost_agents_cid }}" # nocheck: container-exec-resolver
      - /mattermost/bin/mmctl
      - --local
      - plugin
      - disable
      - "{{ MATTERMOST_MCP_PLUGIN_ID }}"
  changed_when: true
  delegate_to: "{{ mattermost_agents_node }}"
  run_once: true

- name: "🧩 Mattermost | Reactivate the Agents plugin to ensure its bots"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/utils/agents/enable.yml"
