---
- include_tasks: utils/once/flag.yml

- name: "🛑 Refuse email sign-up beside SSO"
  ansible.builtin.assert:
    that:
      - "not (MATTERMOST_OIDC_ENABLED | bool and MATTERMOST_LOGIN_REGISTRATION | bool)"
    fail_msg: >-
      With SSO on, the native form stays on, and EmailSettings.EnableSignUpWithEmail
      would also open SwitchOAuthToEmail, which turns any Keycloak account,
      the administrator included, into a password account, so
      services.mattermost.login.method.registration.enabled must be false while
      login.method.sso.enabled is true.
    quiet: true

- name: "📣 Report the System Console settings the env file overwrites"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/env.yml') }}"
  vars:
    forms_env_form: settings
    forms_env_fields: "{{ MATTERMOST_SETTINGS }}"

- name: "🥾 Bootstrap the compose host once before staging the build context"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: 00_core.yml
  when: run_once_sys_svc_compose is not defined

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "📁 Create the build context of '{{ application_id }}'"
  ansible.builtin.file:
    path: "{{ MATTERMOST_BUILD_DIR }}"
    state: directory
    mode: "0755"
  when: IS_STACK_HOST | bool

- name: "📦 Stage the Mattermost installer into the build context"
  stack_host_copy:
    src: shell/install.sh
    dest: "{{ [MATTERMOST_BUILD_DIR, 'install.sh'] | path_join }}"
    mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "🗑️ Remove stale nginx config for renamed domain chat.{{ DOMAIN_PRIMARY }}" # nocheck: domain-spot
  ansible.builtin.file:
    path: "{{ [lookup('nginx', 'directories.configuration.servers'), 'https', 'chat.' ~ DOMAIN_PRIMARY ~ '.conf'] | path_join }}"
    state: absent
  notify: restart-openresty

- name: "🚿 Flush compose handlers for '{{ application_id }}'"
  ansible.builtin.meta: flush_handlers

- name: "🖥️ Mattermost stack-host post-deploy"
  include_tasks: 00_core/stack_host.yml
  when: IS_STACK_HOST | bool

- name: "🛂 Reconcile the Mattermost system admins with the administrator role group"
  include_tasks: 05_rbac.yml

- name: "🤖 Bind the native AI surface to the platform gateway"
  include_tasks: utils/ai_gateway.yml
  when: MATTERMOST_LITELLM_ENABLED | bool

- name: "🔌 Provision the MCP server surface"
  include_tasks: utils/mcp.yml
  when: MATTERMOST_MCP_ENABLED | bool
