---
- include_tasks: utils/once/flag.yml

- name: "🥾 Bootstrap the compose host once before staging the build context"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: 00_core.yml
  when: run_once_sys_svc_compose is not defined

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "📁 Create the build context of '{{ application_id }}'"
  ansible.builtin.file:
    path: "{{ MATTERMOST_BUILD_DIR }}"
    state: directory
    mode: "0755"
  when: IS_STACK_HOST | bool

- name: "📦 Stage the Mattermost installer into the build context"
  stack_host_copy:
    src: shell/install.sh
    dest: "{{ [MATTERMOST_BUILD_DIR, 'install.sh'] | path_join }}"
    mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "🔌 Stage the MCP adapter instance for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-mcp-adapter/tasks/instance.yml') }}"
  vars:
    mcp_adapter_instance_dir: "{{ MATTERMOST_MCP_INSTANCE_DIR }}"
    mcp_adapter_upstream_key: true
  when: MATTERMOST_MCP_ENABLED | bool

- name: "🗑️ Remove stale nginx config for renamed domain chat.{{ DOMAIN_PRIMARY }}" # nocheck: domain-spot
  ansible.builtin.file:
    path: "{{ [lookup('nginx', 'directories.configuration.servers'), 'https', 'chat.' ~ DOMAIN_PRIMARY ~ '.conf'] | path_join }}"
    state: absent
  notify: restart-openresty

- name: "🚿 Flush compose handlers for '{{ application_id }}'"
  ansible.builtin.meta: flush_handlers

- name: "🖥️ Mattermost stack-host post-deploy"
  when: IS_STACK_HOST | bool
  block:
    - name: "▶️ Run Mattermost setup routines"
      include_tasks: 01_setup.yml

    - name: "🔧 Configure Keycloak OIDC mappers for Mattermost"
      include_tasks: 02_keycloak.yml
      when: MATTERMOST_OIDC_ENABLED | bool

- name: "🤖 Bind the native AI surface to the platform gateway"
  include_tasks: utils/ai_gateway.yml
  when: MATTERMOST_LITELLM_ENABLED | bool

- name: "🔌 Provision the MCP server surface"
  include_tasks: utils/mcp.yml
  when: MATTERMOST_MCP_ENABLED | bool
