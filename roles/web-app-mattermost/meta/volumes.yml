---
config:
  type: volume
  name: mattermost_config
  mounts:
    - service: mattermost
      target: /mattermost/config

data:
  type: volume
  name: mattermost_data
  mounts:
    - service: mattermost
      target: /mattermost/data

logs:
  type: volume
  name: mattermost_logs
  mounts:
    - service: mattermost
      target: /mattermost/logs

plugins:
  type: volume
  name: mattermost_plugins
  mounts:
    - service: mattermost
      target: /mattermost/plugins

client-plugins:
  type: volume
  name: mattermost_client_plugins
  # nocheck: nfs-false-data-loss  Reason: unpacked from the server-side plugin bundle at every activation; shared, replicas starting at once copy into one directory and the loser then serves 404 on the plugin routes
  nfs: false
  mounts:
    - service: mattermost
      target: /mattermost/client/plugins
