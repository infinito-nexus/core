---
enabled: false
required: false
mechanism: plugin
source: upstream
version: "v0.4.0"
bridges:
  - prometheus
update:
  monitored: true
  catalog: github-releases
  upstream_id: cpanato/mattermost-plugin-alertmanager
config:
  plugin_id: alertmanager
  archive: https://github.com/cpanato/mattermost-plugin-alertmanager/releases/download/v0.4.0/alertmanager-0.4.0.tar.gz
  partner_host: "{{ lookup('container_address', 'web-app-prometheus', 'alertmanager') }}"
  partner_port: "{{ lookup('config', 'web-app-prometheus', 'services.alertmanager.ports.internal.http') }}"
