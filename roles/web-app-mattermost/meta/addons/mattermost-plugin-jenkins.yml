---
# jenkins-1.1.0.tar.gz is the newest release since 2020-06-19 and carries no
# linux/arm64 backend, so mattermost enables the plugin and then logs
# "jenkins: failed to apply option: backend executable not found for
# environment: linux/arm64" and drops it from the active set.
enabled: "{{ lookup('config', 'web-app-mattermost', 'services.jenkins.enabled') | bool }}"
architectures:
  - amd64
required: false
mechanism: plugin
source: upstream
version: "v1.1.0"
bridges:
  - jenkins
update:
  monitored: true
  catalog: github-releases
  upstream_id: mattermost-community/mattermost-plugin-jenkins
config:
  plugin_id: jenkins
  archive: https://github.com/mattermost-community/mattermost-plugin-jenkins/releases/download/v1.1.0/jenkins-1.1.0.tar.gz
  partner_url: "{{ lookup('tls', 'web-app-jenkins', 'url.base') }}"
