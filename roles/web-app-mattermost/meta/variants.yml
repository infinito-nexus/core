---
# Matrix-deploy variant overrides for web-app-mattermost.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — variant 3 exists so jitsi, which is clearnet-only, has
# a round of its own. Every other round keeps the onion on.
#
# nocheck: variant-limit — folding the jitsi round into an existing variant was
# measured and does not work: variant 2 is the only round pinning sso false, which
# is the polarity variants-coverage needs, and every addon spec gates on
# skipUnlessServiceEnabled("sso"), so a jitsi round without sso would deploy jitsi
# and prove nothing. A fourth round is the only way hermes, jenkins, openclaw and
# openwebui reach the onion.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-mattermost.
- services:
    container_backup:
      enabled: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    postgres:
      shared: true
    redis:
      shared: true
    prometheus:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    css:
      enabled: true
      shared: true
    litellm:
      enabled: false
    tor:
      enabled: true
    openwebui:
      enabled: false
      shared: false
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
    gitlab:
      enabled: true
      shared: true
    jenkins:
      enabled: false
      shared: false
    jitsi:
      enabled: false
      shared: false
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
