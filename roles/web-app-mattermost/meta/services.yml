---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
# nocheck: dynamic-flag
ldap:
  enabled: false # nocheck: dynamic-flag
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
mattermost:
  mmctl: /mattermost/bin/mmctl
  healthcheck:
    test: ["CMD", "{{ lookup('config', 'web-app-mattermost', 'services.mattermost.mmctl') }}", "--local", "system", "status"]
    # nocheck: healthcheck-timing-override  mmctl spawns a binary and talks to the local socket, so it does not belong on a 30s steady-state loop
    interval: 1m
    # nocheck: healthcheck-timing-override  spawning that binary does not finish inside the 5s default
    timeout: 10s
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  user_access_token_enabled: "{{ 'web-app-nextcloud' in group_names }}"
  image: debian
  version: 13.8-slim
  custom: true
  repository: https://github.com/mattermost/mattermost.git
  ref: v12.1.0
  min_storage: 659MB
  backup:
    stop_required: false
  name: mattermost
  cpus: "1.0"
  mem_reservation: 512m
  mem_limit: 1g
  pids_limit: 512
  ports:
    local:
      http: 8065
    internal:
      http: 8065
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-mattermost', 'sso') }}"
      native:
        enabled: true
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-mattermost', '2fa') }}"
        enforced: true
      registration:
        enabled: "{{ lookup('login_method', 'web-app-mattermost', 'registration') }}"
  settings:
    site_url: "{{ lookup('tls', 'web-app-mattermost', 'url.base') }}"
    site_name: "{{ lookup('design', 'web-app-mattermost').label[:30] }}"
    plugin_uploads: "{{ lookup('config', 'web-app-mattermost', 'addons') | dict2items | selectattr('value.enabled', 'true') | map(attribute='value') | selectattr('config.archive',
      'defined') | list | length > 0 }}"
    console_level: "{{ 'DEBUG' if lookup('debug', 'web-app-mattermost') | bool else 'INFO' }}"
    metrics_listen_address: ":{{ lookup('config', 'web-app-mattermost', 'services.prometheus.native_metrics.port') }}"
    smtp:
      enabled: "{{ lookup('email', 'web-app-mattermost').enabled | bool }}"
      server: "{{ lookup('email', 'web-app-mattermost').host }}"
      port: "{{ lookup('email', 'web-app-mattermost').port | string }}"
      username: "{{ lookup('email', 'web-app-mattermost').username }}"
      from: "{{ lookup('email', 'web-app-mattermost')['from'] }}"
    s3:
      enabled: "{{ lookup('config', 'web-app-mattermost', 'services.seaweedfs.enabled') | bool or lookup('config', 'web-app-mattermost', 'services.minio.enabled')
        | bool }}"
      bucket: "{{ lookup('objstore', 'web-app-mattermost', 'bucket') }}"
      endpoint: "{{ lookup('objstore', 'web-app-mattermost', 'endpoint') }}"
      region: "{{ lookup('objstore', 'web-app-mattermost', 'region') }}"
    gitlab:
      id: "{{ OIDC.CLIENT.ID }}"
      auth_endpoint: "{{ OIDC.CLIENT.AUTHORIZE_URL }}"
      user_api_endpoint: "{{ OIDC.CLIENT.USER_INFO_URL }}"
      untrusted_internal_connections: "{{ [OIDC.CLIENT.TOKEN_URL | urlsplit('hostname'), OIDC.CLIENT.USER_INFO_URL | urlsplit('hostname')] | unique | join(',') }}"
  run_after:
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
redis:
  backup:
    disabled: true
  enabled: false # nocheck: dynamic-flag
  shared: "{{ 'svc-db-redis' in group_names }}"
# nocheck: playwright-service-flag — object store, no Playwright surface
minio:
  enabled: false # nocheck: dynamic-flag
  shared: false # nocheck: dynamic-flag
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 280
      height: 80
    logo-frame:
      width: 280
      height: 80
      frame: true
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — canonical:cdn alias of static-asset provider
javascript:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
# nocheck: native-metrics — fragment ships prepared; operator flips `native_metrics.enabled` to opt in
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  native_metrics:
    enabled: false
    port: 8067
  communication:
    channel: true

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: dynamic-flag - the gateway is a single shared instance, never deployed per consumer
litellm:
  bond: 0.5
  enabled: "{{ LITELLM_USABLE }}"
  shared: "{{ LITELLM_SHARED }}"
# nocheck: playwright-service-flag  internal adapter sidecar, covered by the role's MCP spec
# nocheck: dockerfile-custom  the Dockerfile is owned by svc-ai-mcp-adapter and staged per instance, so every adapter-backed provider shares one audited build
# nocheck: dynamic-flag  the sidecar tracks this role's own mcp flag, not another role's presence; a group_names expression would decide its exposure from an unrelated deployment
mattermostmcp:
  enabled: "{{ lookup('config', 'web-app-mattermost', 'mcp.enabled') | bool }}"
  shared: false
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  name: mattermostmcp
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 24m
  pids_limit: 64
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 8080
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false
# nocheck: playwright-service-flag: bridged gitlab partner, covered by partner role spec
gitlab:
  bond: 0.5
  enabled: "{{ 'web-app-gitlab' in group_names }}"
  shared: "{{ 'web-app-gitlab' in group_names }}"
# nocheck: playwright-service-flag: bridged jenkins partner, covered by partner role spec
jenkins:
  bond: 0.5
  enabled: "{{ 'web-app-jenkins' in group_names }}"
  shared: "{{ 'web-app-jenkins' in group_names }}"
# nocheck: playwright-service-flag: bridged jira partner, covered by partner role spec
jira:
  enabled: false # nocheck: dynamic-flag - web-app-jira is EOL, no host may bind it
  shared: false # nocheck: dynamic-flag - web-app-jira is EOL, no host may bind it
# nocheck: playwright-service-flag: bridged jitsi partner, covered by partner role spec
jitsi:
  bond: 0.5
  enabled: "{{ 'web-app-jitsi' in group_names }}"
  shared: "{{ 'web-app-jitsi' in group_names }}"

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
