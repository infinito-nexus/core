---
# nocheck: playwright-service-flag - typed classification API without a browser surface
s1:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  # nocheck: dockerfile-custom  upstream ships a pyproject and no image, so the role builds one
  # nocheck: docker-version  base of the self-built server, not the served application
  image: python
  version: "3.12.14-slim"
  custom: true
  name: s1
  model_alias: s1-latest
  request_timeout: 20
  gpu: true
  flavor: laya
  laya:
    checkpoints:
      - name: english
        repo: convaiinnovations/laya
      - name: multilingual
        repo: convaiinnovations/laya-multilingual
  jeff:
    repository: https://github.com/logan-markewich/jeff.git
    # nocheck: semver-ref  upstream publishes no tags, so the pin is a commit
    ref: 34b32f99a727c47b679adde33f4702a001e02979
    model_repo: knowledgator/gliformer-large-v1
  healthcheck:
    flavor: http_status
    path: health
  # nocheck: min-storage-headroom  Reason: the declared image is the Dockerfile base; the built image adds the runtime and the checkpoints the flavor bakes
  min_storage: 4GB
  cpus: "2.0"
  mem_reservation: 3g
  mem_limit: 6g
  pids_limit: 512
  ports:
    internal:
      http: 8000
  lifecycle: beta
