---
- include_tasks: utils/once/flag.yml

- name: "🥾 For '{{ application_id }}': bootstrap the compose host once"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: 00_core.yml
  when: run_once_sys_svc_compose is not defined

- name: "🛑 Refuse a backend flavor the role does not carry"
  ansible.builtin.assert:
    that:
      - S1_FLAVOR in ['laya', 'torch', 'onnx']
    fail_msg: "services.s1.flavor must be 'laya', 'torch' or 'onnx' (got '{{ S1_FLAVOR }}')"
    quiet: true

- name: "📁 Create the node-local model directory of {{ application_id }}"
  ansible.builtin.file:
    path: "{{ S1_MODELS_DIR }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ item }}"
  run_once: true
  loop: "{{ query('node_hosts') }}"

- name: "📦 Stage the System One build context"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "{{ lookup('path_absolute', 'roles/svc-ai-s1/files/shell/build.sh') }}"
        dest: "{{ [S1_BUILD_DIR, 'build.sh'] | path_join }}"
        mode: "0644"
        notify: [compose-build, compose-up]
      - src: "{{ lookup('path_absolute', 'roles/svc-ai-s1/files/shell/entrypoint.sh') }}"
        dest: "{{ [S1_BUILD_DIR, 'entrypoint.sh'] | path_join }}"
        mode: "0644"
        notify: [compose-build, compose-up]

# nocheck: ansible-repeated-when-run  a block guard would be evaluated inside svc-ai-models, whose vars bind its own application_id
- name: "📦 Seed the model store before {{ application_id }} starts"
  ansible.builtin.include_role:
    name: svc-ai-models
  when:
    - S1_STORED | bool
    - run_once_svc_ai_models is not defined

- name: "🛑 Refuse to start {{ application_id }} without its artefacts in the store"
  ansible.builtin.include_role:
    name: svc-ai-models
    tasks_from: utils/require.yml
  vars:
    models_consumer: "{{ application_id }}"
    models_required: "{{ S1_ARTEFACTS }}"
  when: S1_STORED | bool

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true

- name: "🔥 Manager-side model warm-up on the hosting node"
  ansible.builtin.include_tasks: 01_manager_ops.yml
  when: IS_STACK_HOST | bool
