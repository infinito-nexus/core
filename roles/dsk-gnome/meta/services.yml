---
# nocheck: garbage-collector-required  workstation software; its caches belong to the desktop user, not to a server collector
# nocheck: dynamic-flag  the desktop base is the premise of every dsk role, not a per-host option
desktop-base:
  bond: 1
  enabled: true
  shared: true
gnome:
  modes:
    host:
      enabled: true
  repository: https://github.com/kevinveenbirkenbach/cli-gnome-extension-manager.git
  ref: v1.0.0
  lifecycle: pre-alpha
  min_storage: "2GB"
  cpus: "1.0"
  mem_reservation: "512m"
  mem_limit: "1g"
  pids_limit: 1024

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  the role runs no container, so Semaphore has nothing to pause
  status: started
