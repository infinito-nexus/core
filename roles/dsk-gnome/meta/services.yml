---
# nocheck: dynamic-flag  the desktop base is the premise of every dsk role, not a per-host option
desktop-base:
  bond: 1
  enabled: true
  shared: true
gnome:
  modes:
    host:
      enabled: true
  repository: https://github.com/kevinveenbirkenbach/cli-gnome-extension-manager.git
  ref: v1.0.0
  lifecycle: pre-alpha
  min_storage: "2GB"
  cpus: "1.0"
  mem_reservation: "512m"
  mem_limit: "1g"
  pids_limit: 1024

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
