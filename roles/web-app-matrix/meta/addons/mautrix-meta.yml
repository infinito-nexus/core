---
enabled: false
required: false
mechanism: bridge
source: upstream
update:
  monitored: true
  catalog: mautrix
  upstream_id: mautrix-meta
config:
  bridge_name: "meta"
  instagram_version: v0.2610.0 # dock.mau.dev purges old ig- tags, so the MDAD pin's ig-v0.2609.0 is gone and every ansible-flavor pull 404s (run 44198828712)
  upstream_flags:
    - matrix_bridge_mautrix_meta_messenger_enabled
    - matrix_bridge_mautrix_meta_instagram_enabled
  appservice_port: 29319
  database_username: "mautrix_meta_bridge"
  database_name: "mautrix_meta_bridge"
  database_password: "{{ lookup('config', 'web-app-matrix', 'secrets.credentials.mautrix_meta_bridge_database_password', '') }}"
