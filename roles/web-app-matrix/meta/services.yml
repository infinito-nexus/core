---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: dynamic-flag - the gateway is a single shared instance, never deployed per consumer
litellm:
  bond: 0.5
  enabled: "{{ LITELLM_USABLE }}"
  shared: "{{ LITELLM_SHARED }}"
# nocheck: dockerfile-custom
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
  oidc:
    clients:
      web: matrix-synapse
    backchannel_logout_path: /_synapse/client/oidc/backchannel_logout
    backchannel_logout_gate: true
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
  card: element
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
gitlab:
  bond: 0.5
  enabled: "{{ 'web-app-gitlab' in group_names }}"
  shared: "{{ 'web-app-gitlab' in group_names }}"
jira:
  enabled: false # nocheck: dynamic-flag - web-app-jira is EOL, no host may bind it
  shared: false # nocheck: dynamic-flag - web-app-jira is EOL, no host may bind it
n8n:
  bond: 0.5
  enabled: "{{ 'web-app-n8n' in group_names }}"
  shared: "{{ 'web-app-n8n' in group_names }}"
# nocheck: playwright-service-flag — TURN/STUN server, no Playwright surface (provider: web-svc-coturn)
coturn:
  bond: 1
  enabled: "{{ 'web-svc-coturn' in group_names }}"
  shared: "{{ 'web-svc-coturn' in group_names }}"
# nocheck: variants-coverage — the onion gate is a hard invariant; no variant may force Jitsi on a tor node.
jitsi:
  bond: 0.5
  enabled: >- # nocheck: dynamic-flag  Matrix offers Jitsi from the ansible flavor and off tor nodes only
    {{ lookup('config', 'web-app-matrix', 'services.matrix.flavor') == 'ansible' and 'svc-net-tor' not in group_names
    and not ((lookup('config', 'svc-net-tor', 'services.tor.node', '') | length > 0)
    and ((lookup('domain', 'web-app-matrix') | network_of) == 'tor')) }}
  shared: "{{ 'web-app-jitsi' in group_names }}"
  domains:
    - jitsi
  ports:
    internal:
      http: 8000
    local:
      http: 8104
    public:
      media: 10001
livekit:
  enabled: "{{ lookup('config', 'web-app-matrix', 'services.matrix.conferencing.element_call') | bool }}" # nocheck: dynamic-flag — the role renders the LiveKit services only inside its element_call branch
  ports:
    internal:
      websocket: 7880
    local:
      websocket: 4005
    public:
      media: 10002
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 512
livekit_jwt:
  enabled: "{{ lookup('config', 'web-app-matrix', 'services.matrix.conferencing.element_call') | bool }}" # nocheck: dynamic-flag — the role renders the LiveKit services only inside its element_call branch
  ports:
    internal:
      http: 8030
    local:
      http: 8105
  cpus: "0.2"
  mem_reservation: 32m
  mem_limit: 128m
  pids_limit: 64
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag — matrix always needs a database
  shared: "{{ 'svc-db-postgres' in group_names }}"
synapse:
  healthcheck:
    flavor: curl
  version: v1.165.0
  image: matrixdotorg/synapse
  name: matrix-synapse
  backup:
    stop_required: false
  ports:
    internal:
      http: 8008
    local:
      http: 8021
    public:
      federation: 8448
    onion:
      # nocheck: onion-flag  federation is dialled by clearnet homeservers resolving this server_name; serving it on the onion needs an onion server_name, which is a different deployment
      federation: false
  min_storage: 311MB
  cpus: "1.5"
  mem_reservation: "1g"
  mem_limit: "2g"
  pids_limit: 2048
element:
  healthcheck:
    flavor: wget
  version: v1.12.36
  image: vectorim/element-web
  name: matrix-element
  force_verification: true
  ports:
    local:
      http: 8022
    internal:
      http: 80
  min_storage: 263MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
matrix-chatgpt-bot:
  backup:
    stop_required: false
  version: 3.1.5
  image: ghcr.io/matrixgpt/matrix-chatgpt-bot
  min_storage: 307MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "3.1.5"
        until: 2026-11-30
# nocheck: playwright-service-flag — object store, no Playwright surface (provider: web-svc-seaweedfs)
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
  public: true
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 512
      height: 512
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  native_metrics:
    enabled: true # nocheck: dynamic-flag — both flavors publish a scrape target, so no inventory decides this
    port: "{{ 9000 if lookup('config', 'web-app-matrix', 'services.matrix.flavor') == 'compose' else 9100 }}"
    service_key: "{{ 'synapse' if lookup('config', 'web-app-matrix', 'services.matrix.flavor') == 'compose' else 'matrix' }}"
  communication:
    channel: true
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
matrix:
  healthcheck:
    flavor: http_status
    path: _matrix/client/versions
    retries: 10
  ports:
    internal:
      http: 8008
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag — matrix always needs a database
  shared: true
  ca_client: true
  name: matrix
  # nocheck: default-placement-manager  load-bearing only in the compose flavor, where synapse's /data holds the federation signing key and media store, 01_docker.yml provisions that volume with an undelegated chown and reaches the container through `container exec` under IS_STACK_HOST; the ansible flavor sets compose_mode_force to compose, so no deploy block is rendered at all
  placement: manager
  flavor: ansible
  upstream:
    repo: https://github.com/spantaleev/matrix-docker-ansible-deploy
    ref: 40179e6d4a36513eb77c4ef2eff067716ebb1821
    migration_validated_version: v2026.05.18.0
  runner:
    image: infinito/web-app-matrix-mdad-runner:1
    base_image: python
    base_version: 3.13-slim
    docker_cli_image: docker
    docker_cli_version: 28.0.4-cli
  playbook_tags: setup-all,ensure-matrix-users-created,start
  server_name: "{{ DOMAIN_PRIMARY }}"
  plugins:
    appservice_irc: false
    chatgpt: "{{ 'svc-ai-litellm' in group_names }}"
    discord: false
    heisenbridge: true
    hookshot: "{{ 'web-app-gitlab' in group_names or 'web-app-n8n' in group_names }}"
    mautrix_discord: false
    mautrix_signal: false
    mautrix_slack: false
    mautrix_telegram: false
    mautrix_twitter: false
    mautrix_whatsapp: false
  conferencing:
    element_call: true
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-matrix', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-matrix', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-matrix', 'native') }}"
      registration:
        enabled: "{{ lookup('login_method', 'web-app-matrix', 'registration') }}"
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  min_storage: "1GB"
  cpus: "0.5"
  mem_reservation: "128m"
  mem_limit: "512m"
  pids_limit: 256

# nocheck: dynamic-flag  docker.io image the nested MDAD daemon runs; declared so CI pulls it from the GHCR mirror, never deployed as a service of its own
# nocheck: playwright-service-flag  no Playwright surface, the image only runs inside the matrix container
mdad_heisenbridge:
  enabled: false
  shared: false
  image: hif1/heisenbridge
  version: "1.15.4"
# nocheck: dynamic-flag  docker.io image the nested MDAD daemon runs; declared so CI pulls it from the GHCR mirror, never deployed as a service of its own
# nocheck: playwright-service-flag  no Playwright surface, the image only runs inside the matrix container
mdad_static_files:
  enabled: false
  shared: false
  image: joseluisq/static-web-server
  version: "2.44.0-alpine"
# nocheck: dynamic-flag  docker.io image the nested MDAD daemon runs; declared so CI pulls it from the GHCR mirror, never deployed as a service of its own
# nocheck: playwright-service-flag  no Playwright surface, the image only runs inside the matrix container
mdad_livekit_server:
  enabled: false
  shared: false
  image: livekit/livekit-server
  version: "v1.13.7"

# nocheck: playwright-service-flag
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
