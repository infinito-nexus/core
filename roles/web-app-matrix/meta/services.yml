---
# nocheck: dynamic-flag - the gateway is a single shared instance, never deployed per consumer
litellm:
  bond: 0.5
  enabled: "{{ LITELLM_USABLE }}"
  shared: true
# nocheck: dockerfile-custom
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ MAIL_PROVIDER in group_names }}"
  shared: "{{ MAIL_PROVIDER in group_names }}"
gitlab:
  bond: 0.5
  enabled: "{{ 'web-app-gitlab' in group_names }}"
  shared: "{{ 'web-app-gitlab' in group_names }}"
jira:
  enabled: false # nocheck: dynamic-flag - web-app-jira is EOL, no host may bind it
  shared: false # nocheck: dynamic-flag - web-app-jira is EOL, no host may bind it
n8n:
  bond: 0.5
  enabled: "{{ 'web-app-n8n' in group_names }}"
  shared: "{{ 'web-app-n8n' in group_names }}"
jitsi:
  bond: 0.5
  enabled: "{{ 'web-app-jitsi' in group_names }}"
  shared: "{{ 'web-app-jitsi' in group_names }}"
# nocheck: playwright-service-flag — TURN/STUN server, no Playwright surface (provider: web-svc-coturn)
coturn:
  bond: 1
  enabled: "{{ 'web-svc-coturn' in group_names }}"
  shared: "{{ 'web-svc-coturn' in group_names }}"
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag — matrix always needs a database
  shared: "{{ 'svc-db-postgres' in group_names }}"
synapse:
  healthcheck:
    flavor: curl
  version: v1.162.0
  image: matrixdotorg/synapse
  name: matrix-synapse
  backup:
    no_stop_required: true
  ports:
    internal:
      http: 8008
    local:
      http: 8021
    public:
      federation: 8448
    onion:
      # nocheck: onion-flag  federation is dialled by clearnet homeservers resolving this server_name; serving it on the onion needs an onion server_name, which is a different deployment
      federation: false
  min_storage: 311MB
  cpus: "1.5"
  mem_reservation: "1g"
  mem_limit: "2g"
  pids_limit: 2048
element:
  healthcheck:
    flavor: wget
  version: v1.12.30
  image: vectorim/element-web
  name: matrix-element
  ports:
    local:
      http: 8022
    internal:
      http: 80
  min_storage: 263MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
matrix-chatgpt-bot:
  version: 3.1.5
  image: ghcr.io/matrixgpt/matrix-chatgpt-bot
  min_storage: 307MB
  cpus: "0.2"
  mem_reservation: 128m
  mem_limit: 256m
  pids_limit: 256
# nocheck: playwright-service-flag — object store, no Playwright surface (provider: web-svc-seaweedfs)
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
  public: true
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  native_metrics:
    enabled: true # nocheck: dynamic-flag — both flavors publish a scrape target, so no inventory decides this
    port: "{{ 9000 if lookup('config', 'web-app-matrix', 'services.matrix.flavor') == 'compose' else 9100 }}"
    service_key: "{{ 'synapse' if lookup('config', 'web-app-matrix', 'services.matrix.flavor') == 'compose' else 'matrix' }}"
  communication:
    channel: true
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
matrix:
  healthcheck:
    flavor: http_status
    path: _matrix/client/versions
    retries: 10
  ports:
    internal:
      http: 8008
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag — matrix always needs a database
  shared: true
  name: matrix
  # nocheck: default-placement-manager  inner docker-in-docker storage; node-local in swarm
  placement: manager
  flavor: ansible
  upstream:
    repo: https://github.com/spantaleev/matrix-docker-ansible-deploy
    ref: 40179e6d4a36513eb77c4ef2eff067716ebb1821
    migration_validated_version: v2026.05.18.0
  runner:
    image: infinito/web-app-matrix-mdad-runner:1
    base_image: python
    base_version: 3.13-slim
    docker_cli_image: docker
    docker_cli_version: 28.0.4-cli
  playbook_tags: setup-all,start
  server_name: "{{ DOMAIN_PRIMARY }}"
  plugins:
    appservice_irc: false
    chatgpt: "{{ 'svc-ai-litellm' in group_names }}"
    discord: false
    heisenbridge: true
    hookshot: "{{ 'web-app-gitlab' in group_names or 'web-app-n8n' in group_names }}"
    mautrix_discord: false
    mautrix_signal: false
    mautrix_slack: false
    mautrix_telegram: false
    mautrix_twitter: false
    mautrix_whatsapp: false
  conferencing:
    element_call: true
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-stalwart
    - web-app-mailu
  lifecycle: beta
  min_storage: "1GB"
  cpus: "0.5"
  mem_reservation: "128m"
  mem_limit: "512m"
  pids_limit: 256

# nocheck: playwright-service-flag
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
  exclusive: true
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
