---
- name: "🔎 ansible-flavor: read the registry proxy of the stack docker daemon"
  ansible.builtin.script:
    cmd: "{{ role_path }}/files/flavor/ansible/registry_proxy.sh"
  register: matrix_mdad_registry_proxy_probe
  changed_when: false
  delegate_to: "{{ STACK_HOST }}"

- name: "📄 ansible-flavor: render compose.yml + start matrix-mdad via sys-stk-backend"
  ansible.builtin.include_role:
    name: sys-stk-backend
  vars:
    compose_handlers_flush: false

- name: "✅ ansible-flavor: ensure matrix-mdad runner build dir on STACK_HOST"
  ansible.builtin.file:
    path: "{{ MATRIX_MDAD_RUNNER_BUILD_DIR }}"
    state: directory
    mode: "0755"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true

- name: "🎬 ansible-flavor: stage matrix-mdad runner build context on STACK_HOST"
  stack_host_copy:
    src: "flavor/ansible/runner/"
    dest: "{{ MATRIX_MDAD_RUNNER_BUILD_DIR }}/"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "🎬 ansible-flavor: render the inner docker daemon.json from the network SPOT"
  stack_host_copy:
    content: "{{ MATRIX_MDAD_DAEMON_JSON | to_nice_json }}\n"
    dest: "{{ [ MATRIX_MDAD_RUNNER_BUILD_DIR, 'daemon.json' ] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "🎬 ansible-flavor: route the inner docker via the stack's registry proxy"
  stack_host_template:
    src: "flavor/ansible/registry-cache-proxy.conf.j2"
    dest: "{{ MATRIX_MDAD_REGISTRY_PROXY_DROPIN }}"
    mode: "0644"
  notify:
    - compose-up
  when: MATRIX_MDAD_REGISTRY_PROXY.proxy | length > 0

- name: "🔄 ansible-flavor: flush handlers (build runner image + start matrix-mdad)"
  ansible.builtin.meta: flush_handlers
