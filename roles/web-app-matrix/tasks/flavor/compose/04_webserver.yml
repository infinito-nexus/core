- name: "🔀 federation delegation"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/utils/well_known.yml"

- name: "📂 Include role svc-stack for '{{ application_id }}'"
  ansible.builtin.include_role:
    name: svc-stack
    tasks_from: consumer/front.yml
