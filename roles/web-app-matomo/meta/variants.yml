---
# Matrix-deploy variant overrides for web-app-matomo.
# See docs/contributing/artefact/files/role/variants.md for the file format.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-matomo.

- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: true
    design:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    # variant-pin: web-svc-logout#reciprocal
    logout:
      enabled: true
      shared: true
    mariadb:
      shared: true
    redis:
      shared: true
    prometheus:
      enabled: true
      shared: true
    matomo:
      tracking:
        scope: root
    tor:
      enabled: true
- services:
    # variant-pin: web-app-docs#reciprocal
    docs:
      enabled: true
      shared: true
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    redis:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    tor:
      enabled: true
