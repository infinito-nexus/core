---
# Matrix-deploy variant overrides for web-app-matomo.
# See docs/contributing/artefact/files/role/variants.md for the file format.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-matomo.

- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: true
    design:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    # variant-pin: web-svc-logout#reciprocal
    logout:
      enabled: true
      shared: true
    mariadb:
      shared: true
    redis:
      shared: true
    prometheus:
      enabled: true
      shared: true
    # variant-pin: web-app-keycloak#reciprocal
    sso:
      enabled: true
      shared: true
    matomo:
      tracking:
        scope: root
    tor:
      enabled: true
- services:
    matomo:
      login:
        method:
          2fa:
            enforced: false
    docs:
      enabled: true
      shared: true
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    redis:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: false
      shared: false
    tor:
      enabled: true
- services:
    matomo:
      login:
        method:
          2fa:
            # nocheck: login-methods  Reason: test-2fa-enrollment.js proves here that an account without a second factor is sent to setup; the other administrator sign-ins skip in this variant and run in variant 1
            enforced: true
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: true
    redis:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: false
      shared: false
    tor:
      enabled: true
