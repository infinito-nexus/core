---
data:
  type: volume
  name: matomo_data
  mounts:
    - service: matomo
      target: /var/www/html

tmp:
  type: volume
  name: matomo_tmp
  backup: false
  # nocheck: nfs-false-data-loss  Reason: regenerable Twig/session cache; Matomo requires per-server tmp/ and rebuilds it on demand
  nfs: false
  mounts:
    - service: matomo
      target: /var/www/html/tmp

php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: matomo
      target: /usr/local/etc/php/conf.d/zz-infinito-hardening.ini
