---
- name: "🧭 Resolve the matomo_data mountpoint, empty while the volume is absent"
  ansible.builtin.shell:
    cmd: >-
      container volume ls -q -f name=^matomo_data$ | grep -q . &&
      container volume inspect --format '{{ "{{" }}.Mountpoint{{ "}}" }}' matomo_data || true
  register: matomo_data_mountpoint_pre
  changed_when: false

- name: "🔎 Check whether the persisted config exists"
  ansible.builtin.stat:
    path: "{{ [matomo_data_mountpoint_pre.stdout | trim, 'config/config.ini.php'] | path_join }}"
  register: matomo_config_stat_pre
  when: (matomo_data_mountpoint_pre.stdout | trim) != ""

- name: "🔄 Update the database password in the persisted config"
  ansible.builtin.shell:
    cmd: >-
      sed -i "s|^password *=.*|password = ${PATCH_PASSWORD}|"
      {{ ([matomo_data_mountpoint_pre.stdout | trim, 'config/config.ini.php'] | path_join) | quote }}
  environment:
    PATCH_PASSWORD: "{{ lookup('database', application_id, 'password') | sed_escape('|') }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: true
  when: matomo_config_stat_pre.stat.exists | default(false)
