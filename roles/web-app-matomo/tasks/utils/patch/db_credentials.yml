---
- name: "🔑 Realign the password matomo persisted in its config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "matomo_data"
    patch_config_rel: "config/config.ini.php"
    patch_expression: "s|^password *=.*|password = @PASSWORD@|"
