---
- name: "🔍 Resolve the Matomo container that holds the superuser"
  ansible.builtin.include_tasks: utils/resolve/host_cid.yml

- name: "🔑 Converge the superuser password of {{ application_id }}"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  MATOMO_LOCAL_CID resolved at delegate_to runtime; container_address would return a manager-only subshell
      container exec -i --user www-data
      -e MATOMO_CONVERGE_LOGIN -e MATOMO_CONVERGE_PASSWORD
      {{ MATOMO_LOCAL_CID | quote }} php
    stdin: >-
      {{ lookup('file', 'php/converge_admin_password.php') }}
  environment:
    MATOMO_CONVERGE_LOGIN: "{{ MATOMO_ADMIN_USER_NAME }}"
    MATOMO_CONVERGE_PASSWORD: "{{ MATOMO_ADMIN_PASSWORD }}"
  register: matomo_admin_password
  changed_when: "'CHANGED' in matomo_admin_password.stdout"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ MATOMO_HOST_NODE }}"
