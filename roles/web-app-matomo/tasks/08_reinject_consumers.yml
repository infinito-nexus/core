---
- name: "🔎 Matomo | Find the rendered body_filter Lua of the web-svc matomo consumers"
  ansible.builtin.find:
    paths: "{{ lookup('nginx', 'directories.configuration.lua') }}"
    patterns: "{{ matomo_inj_consumer_ids | map('regex_replace', '$', '.lua') | list }}"
  vars:
    matomo_inj_consumer_ids: "{{ lookup('roles_with_service', 'matomo', scope='all') | selectattr('id', 'match', '^web-svc-') | map(attribute='id') | list }}"
  register: matomo_inj_lua
  when: matomo_inj_consumer_ids | length > 0

- name: "📄 Matomo | Re-render injection for deployed web-svc consumers"
  ansible.builtin.include_role:
    name: sys-front-inj-all
  vars:
    application_id: "{{ matomo_inj_consumer_id }}"
    domain: "{{ lookup('domain', matomo_inj_consumer_id) }}"
    matomo_token_override: "{{ matomo_token_value }}"
  loop: "{{ matomo_inj_lua.files | default([]) | map(attribute='path') | map('basename') | map('splitext') | map('first') | list }}"
  loop_control:
    loop_var: matomo_inj_consumer_id
