---
- services:
    docs:
      enabled: true
      shared: true
    container_backup:
      enabled: true
    mock:
      enabled: true # nocheck: variants-static-override  the test upstream must stay literally off in production, so only the matrix round switches it on
    freellmapi:
      # Exception: the CI ceiling sits below production so web-app-gitlab variant 3, which falls back to svc-ai-litellm variant 0 and pulls this round in, stays inside the 64 GB mem_limit budget.
      mem_limit: 512m
