---
credentials:
  unified_api_key:
    description: Existing unified FreeLLMAPI key from its dashboard; required by the LiteLLM upstream integration, never generated independently of FreeLLMAPI
    type: string
    default: ""
    regex: "\\S{20,}"
  encryption_key:
    description: Persistent AES-256-GCM key for FreeLLMAPI provider credentials; retain it with the database across redeploys
    algorithm: random_hex_32
    type: string
    regex: "[0-9a-fA-F]{64}"
