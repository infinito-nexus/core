---
- include_tasks: utils/once/flag.yml

- name: "🔐 Validate the persistent FreeLLMAPI encryption key"
  ansible.builtin.assert:
    that:
      - FREELLMAPI_ENCRYPTION_KEY is match('^[0-9a-fA-F]{64}$')
      - FREELLMAPI_STARTUP_CONFIG is mapping
    fail_msg: >-
      Set applications.svc-ai-freellmapi.secrets.credentials.encryption_key to a vaulted
      64-character hex key and services.freellmapi.startup_config to a mapping.
      Provision the role credentials once and preserve them across updates.
    quiet: true
  no_log: true

- name: "🔐 Validate platform administrator credentials for dashboard setup"
  ansible.builtin.assert:
    that:
      - FREELLMAPI_ADMIN.email is string
      - FREELLMAPI_ADMIN.email is match('^[^@\s]+@[^@\s]+$')
      - FREELLMAPI_ADMIN.password is string
      - FREELLMAPI_ADMIN.password | length >= 8
    fail_msg: >-
      FreeLLMAPI first-account setup requires a platform_administrator email
      and a plaintext password of at least eight characters from the users lookup.
    quiet: true
  no_log: true

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true

- name: "🔐 Reconcile the platform administrator on every deploy"
  ansible.builtin.include_tasks: 01_admin.yml
