---
general:
  path: /wp-admin/options-general.php
  fields:
    blogname:
      source: services.design.title
      when: services.design.enabled
      mode: enforced
      selector: "#blogname"
      type: text
      label: Site Title
    admin_email:
      source: users.platform_administrator.email
      mode: enforced
      selector: "#new_admin_email"
      type: email
      label: Administration Email Address
permalink:
  path: /wp-admin/options-permalink.php
  fields:
    permalink_structure:
      source: services.wordpress.options.permalink_structure
      mode: enforced
      selector: "#permalink_structure"
      type: text
      label: Permalink structure
translate:
  path: /wp-admin/options-general.php?page=freedomtranslate
  fields:
    freedomtranslate_service:
      source: addons.freedomtranslate-wp.config.options.freedomtranslate_service
      when: addons.freedomtranslate-wp.enabled
      mode: enforced
      selector: 'input[name="translation_service"]'
      type: select
      enum: [ollama, libretranslate, google_official, googlehash]
      label: Translation service
    freedomtranslate_api_url:
      source: addons.freedomtranslate-wp.config.options.freedomtranslate_api_url
      when: addons.freedomtranslate-wp.enabled
      mode: enforced
      selector: "#freedomtranslate_api_url"
      type: url
      label: Translation API URL
profile:
  path: /wp-admin/
  fields:
    first_name:
      source: sso.given_name
      mode: enforced
      selector: "body.infinito-sso-managed #your-profile #first_name"
    last_name:
      source: sso.family_name
      mode: enforced
      selector: "body.infinito-sso-managed #your-profile #last_name"
    display_name:
      source: sso.name
      mode: enforced
      selector: "body.infinito-sso-managed #your-profile #display_name"
    email:
      source: sso.email
      mode: enforced
      selector: "body.infinito-sso-managed #your-profile #email"
    website:
      source: sso.website
      mode: enforced
      selector: "body.infinito-sso-managed #your-profile #url"
    language:
      source: sso.locale
      mode: enforced
      selector: "body.infinito-sso-managed #your-profile #locale"
