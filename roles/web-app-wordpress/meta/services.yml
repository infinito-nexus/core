---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: playwright-service-flag, dynamic-flag - shared gateway consumer; inference wiring is covered by the gateway role, and the gateway is a single shared instance
litellm:
  bond: 0.5
  enabled: "{{ LITELLM_USABLE }}"
  shared: "{{ LITELLM_SHARED }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
  profile:
    languages: [en]
# nocheck: dynamic-flag
javascript:
  bond: 1
  enabled: true
  shared: true
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
# nocheck: playwright-service-flag, DB engine, covered by role-local integration tests
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
discourse:
  bond: 1
  enabled: "{{ 'web-app-discourse' in group_names }}"
  shared: "{{ 'web-app-discourse' in group_names }}"
# nocheck: playwright-service-flag: bridged bigbluebutton partner, covered by partner role spec
bigbluebutton:
  bond: 0.5
  enabled: "{{ 'web-app-bigbluebutton' in group_names }}"
  shared: "{{ 'web-app-bigbluebutton' in group_names }}"
# nocheck: playwright-service-flag: bridged listmonk partner, covered by partner role spec
listmonk:
  bond: 0.5
  enabled: "{{ 'web-app-listmonk' in group_names }}"
  shared: "{{ 'web-app-listmonk' in group_names }}"
# nocheck: playwright-service-flag: bridged peertube partner, covered by partner role spec
peertube:
  bond: 0.5
  enabled: "{{ 'web-app-peertube' in group_names }}"
  shared: "{{ 'web-app-peertube' in group_names }}"
# nocheck: playwright-service-flag: bridged translation gateway, covered by the addon's own spec
translate:
  bond: 0.5
  enabled: "{{ 'web-svc-translate' in group_names }}"
  shared: "{{ 'web-svc-translate' in group_names }}"
# nocheck: playwright-service-flag  self-provider
wordpress:
  enabled: true
  shared: true
  bond: 1
  healthcheck:
    flavor: msmtp_curl
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  version: 7.1.5
  image: wordpress
  custom: true
  name: wordpress
  min_storage: 469MB
  backup:
    stop_required: false
  cpus: 1
  mem_reservation: 0.5g
  mem_limit: 1.5g
  pids_limit: 512
  max_upload_size: 256M
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-wordpress', 'sso') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-wordpress', 'native') }}"
      registration:
        enabled: "{{ lookup('login_method', 'web-app-wordpress', 'registration') }}"
  multisite:
    enabled: false
  address: "{{ lookup('tls', 'web-app-wordpress', 'url.origin') }}"
  options: # nocheck: inventory-open-subtree  wordpress_options_checked refuses owned, secret and malformed option names at deploy time
    permalink_structure: "/blog/%year%/%monthnum%/%day%/%postname%/"
  ports:
    local:
      http: 8003
    internal:
      http: 80
  run_after:
    - web-app-keycloak
  lifecycle: beta
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
  public: true
# nocheck: playwright-service-flag, verified by web-svc-design provider spec
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: Blog by {{ service_provider.platform.titel }}
  slots:
    logo:
      width: 240
      height: 240
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
openwebui:
  enabled: false
  shared: false
  mcp_consumer: false
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
