---
# Matrix-deploy variant overrides for this role.
# verification). Variant 0 keeps the canonical Single-Site flow;
# variant 1 flips the role into Multisite mode against three canonical
# domains so the Multisite Playwright scenarios run against a live
# network. The development deploy wrapper purges the WordPress entities
# between rounds whenever the variant changes, so Single-Site state
# cannot bleed into the Multisite run.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: variant-limit — variants 3 to 5 carry the identity, mail and monitoring
# children, the AI children and the discourse chain at full weight, so variant 0
# can pin them light and fit the CI job cap without losing a child variant pair.
#
# nocheck: sso-variant-tor — variant 2 exists so bigbluebutton and peertube,
# which pin tor.enabled to a literal false, have a round of their own. It
# carries nothing else, so dropping the onion there costs no coverage; every
# other round keeps it on. Translate rides variant 0, whose round index pairs it
# with web-svc-translate#0, the LibreTranslate round that keeps the onion, so the
# freedomtranslate-wp addon is deployed and checked over the onion beside SSO;
# web-svc-translate#1 and #2 drop the onion, so neither other round may carry it.

# variant 0: canonical Single-Site deploy.

- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: true
    # variant-pin: web-svc-design#1
    design:
      enabled: true
      shared: true
    # variant-pin: web-app-discourse#3
    discourse:
      enabled: true
      shared: true
    bigbluebutton:
      enabled: false
      shared: false
    listmonk:
      enabled: false
      shared: false
    peertube:
      enabled: false
      shared: false
    # variant-pin: web-app-dashboard#1
    dashboard:
      enabled: true
      shared: true
    # variant-pin: web-app-stalwart#1
    email:
      enabled: true
      shared: true
    # variant-pin: web-svc-logout#1
    logout:
      enabled: true
      shared: true
    mariadb:
      shared: true
    # variant-pin: web-app-matomo#1
    matomo:
      enabled: true
      shared: true
    litellm:
      enabled: true
    # variant-pin: web-app-keycloak#1
    sso:
      enabled: true
      shared: true
    # variant-pin: web-app-prometheus#2
    prometheus:
      enabled: true
      shared: true
    # variant-pin: web-svc-seaweedfs#1
    seaweedfs:
      enabled: true
      shared: true
    # variant-pin: web-svc-translate#3
    translate:
      enabled: true
      shared: true
    tor:
      enabled: true
    # variant-pin: web-app-hermes#1
    hermes:
      enabled: true
      shared: true
    # variant-pin: web-app-openclaw#1
    openclaw:
      enabled: true
      shared: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    wordpress:
      multisite:
        enabled: true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    discourse:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    bigbluebutton:
      enabled: false
      shared: false
    listmonk:
      enabled: true
      shared: true
    peertube:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    litellm:
      enabled: false
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    seaweedfs:
      enabled: false
      shared: false
    translate:
      enabled: false
      shared: false
    tor:
      enabled: true
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
  addons: &wordpress_addons_off
    activitypub:
      enabled: false
  domains:
    canonical:
      - blog.{{ DOMAIN_PRIMARY }}
      - biberblog.{{ DOMAIN_PRIMARY }}
      - biber.blog.{{ DOMAIN_PRIMARY }}

- services:
    docs:
      enabled: true
      shared: true
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override base shared is a static literal and this round joins no backup host
    design:
      enabled: false
      shared: false
    discourse:
      enabled: false
      shared: false
    bigbluebutton:
      enabled: true
      shared: true
    listmonk:
      enabled: false
      shared: false
    peertube:
