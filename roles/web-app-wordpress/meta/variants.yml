---
# Matrix-deploy variant overrides for this role.
# verification). Variant 0 keeps the canonical Single-Site flow;
# variant 1 flips the role into Multisite mode against three canonical
# domains so the Multisite Playwright scenarios run against a live
# network. The development deploy wrapper purges the WordPress entities
# between rounds whenever the variant changes, so Single-Site state
# cannot bleed into the Multisite run.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — variant 2 exists so bigbluebutton and peertube,
# which pin tor.enabled to a literal false, have a round of their own. It
# carries nothing else, so dropping the onion there costs no coverage; every
# other round keeps it on.

# variant 0: canonical Single-Site deploy.

- services:
    container_backup:
      enabled: true
    design:
      enabled: true
      shared: true
    discourse:
      enabled: true
      shared: true
    bigbluebutton:
      enabled: false
      shared: false
    listmonk:
      enabled: false
      shared: false
    peertube:
      enabled: false
      shared: false
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    mariadb:
      shared: true
    matomo:
      enabled: true
      shared: true
    litellm:
      enabled: true
    sso:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    translate:
      enabled: false
      shared: false
    tor:
      enabled: true
    hermes:
      enabled: true
      shared: true
    openclaw:
      enabled: true
      shared: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    wordpress:
      multisite:
        enabled: true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    discourse:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    bigbluebutton:
      enabled: false
      shared: false
    listmonk:
      enabled: true
      shared: true
    peertube:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    litellm:
      enabled: false
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    seaweedfs:
      enabled: false
      shared: false
    translate:
      enabled: true
      shared: true
    tor:
      enabled: true
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
  addons: &wordpress_addons_off
    activitypub:
      enabled: false
  server:
    domains:
      canonical:
        - blog.{{ DOMAIN_PRIMARY }}
        - biberblog.{{ DOMAIN_PRIMARY }}
        - biber.blog.{{ DOMAIN_PRIMARY }}

- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override base shared is a static literal and this round joins no backup host
    design:
      enabled: false
      shared: false
    discourse:
      enabled: false
      shared: false
    bigbluebutton:
      enabled: true
      shared: true
    listmonk:
      enabled: false
      shared: false
    peertube:
      enabled: true
      shared: true
    dashboard:
      enabled: false
      shared: false
    email:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false
    mariadb:
      shared: true
    matomo:
      enabled: false
      shared: false
    litellm:
      enabled: false
    sso:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    seaweedfs:
      enabled: false
      shared: false
    translate:
      enabled: false
      shared: false
    tor:
      enabled: false
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
  addons: *wordpress_addons_off
