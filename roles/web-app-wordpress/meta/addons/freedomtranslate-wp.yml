---
enabled: "{{ lookup('config', 'web-app-wordpress', 'services.translate.enabled') | bool }}"
required: false
mechanism: plugin
source: upstream
bridges:
  - translate
update:
  monitored: true
  catalog: wordpress-org
  upstream_id: freedomtranslate-wp
config:
  options:
    freedomtranslate_service: libretranslate
    freedomtranslate_api_url: "{{ lookup('tls', 'web-svc-translate', 'url.origin') ~ '/translate' }}"
