---
- include_tasks: utils/once/flag.yml

- name: "✅ Assert Multisite runs with domain tenancy"
  ansible.builtin.assert:
    that: WORDPRESS_RBAC_DOMAIN_TENANCY | bool
    fail_msg: >-
      {{ application_id }} enables services.wordpress.multisite but declares no
      domain tenancy: set rbac.tenancy.axis to 'domain', so that every site of
      the network gets its own role groups.
    quiet: true
  when: WORDPRESS_MULTISITE_ENABLED | bool

- name: "✅ Assert every domains.served entry and site owner names a served host"
  ansible.builtin.assert:
    that: WORDPRESS_SITE_OWNER_PROBLEMS | length == 0
    fail_msg: "{{ WORDPRESS_SITE_OWNER_PROBLEMS | join('; ') }}"
    quiet: true

- name: "🚦 Declare the MCP edge limits before the vhost references them"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-webserver-core/tasks/utils/mcp_edge_limits.yml') }}"
  when: WORDPRESS_MCP_ENABLED | bool

- name: "📂 Include role svc-stack for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: "⬆️ Transfering upload.ini to {{ WORDPRESS_CONFIG_UPLD_ABS }}"
  stack_host_template:
    src: upload.ini.j2
    dest: "{{ WORDPRESS_CONFIG_UPLD_ABS }}"
  notify:
    - compose-up
    - compose-build

- name: "📧 Transfering msmtprc to {{ WORDPRESS_MSMTP_ABS }}"
  stack_host_template:
    src: "{{ WORDPRESS_MSMTP_SRC }}"
    dest: "{{ WORDPRESS_MSMTP_ABS }}"
  vars:
    sys_svc_mail_msmtp_in_container: true
  notify: compose-up

- name: 🚿 Flush handlers to make {{ WORDPRESS_CONFIG_FILE }} available before patch
  meta: flush_handlers

- name: "🖥️ WordPress stack-host post-deploy (container exec, plugin install, domain ops)"
  include_tasks: 07_manager_ops.yml
  when: IS_STACK_HOST | bool
