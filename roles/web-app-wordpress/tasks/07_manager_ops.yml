---
- name: "⏳ Wait until the image entrypoint finished seeding the volume and {{ WORDPRESS_CONFIG_FILE }}"
  ansible.builtin.shell: >
    container exec {{ WORDPRESS_CONTAINER_ADDRESS }} cat /proc/1/comm
  register: wordpress_entrypoint_done
  retries: 60
  delay: 2
  changed_when: false
  until: (wordpress_entrypoint_done.stdout | trim) == 'apache2'

- name: "🔒 Hand the managed option values to the infinito-managed-options guard"
  ansible.builtin.shell:
    cmd: >-
      IFS= read -r INFINITO_MANAGED_OPTIONS || :; : "${INFINITO_MANAGED_OPTIONS:?arrived empty on stdin}" && export INFINITO_MANAGED_OPTIONS &&
      container exec -i --user {{ WORDPRESS_USER | quote }}
      -e INFINITO_MANAGED_OPTIONS
      {{ WORDPRESS_CONTAINER_ADDRESS }}
      php -- {{ WORDPRESS_MANAGED_OPTIONS_FILE | quote }}
    stdin: |-
      {{ WORDPRESS_MANAGED_OPTIONS | to_json | b64encode }}
      {{ lookup('file', 'php/managed_options.php') }}
  register: wordpress_managed_options
  changed_when: wordpress_managed_options.stdout_lines | last == 'changed'
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🔎 Check if {{ WORDPRESS_CONFIG_FILE }} exists in WordPress
  shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }} test -f {{ WORDPRESS_CONFIG_PATH }}
  register: wp_config_file_exists
  changed_when: false
  failed_when: false

- name: 🩹 Patch WordPress {{ WORDPRESS_CONFIG_FILE }} with updated DB credentials
  include_tasks: 01_patch_config.yml
  when: wp_config_file_exists.rc == 0

- name: "📦 Install wordpress"
  include_tasks: 02_install.yml

- name: "🔄 Convert to Multisite when opted in"
  include_tasks: 03_multisite.yml
  when: WORDPRESS_MULTISITE_ENABLED | bool

- name: "🛑 Assert every required addon is claimed by an install path"
  ansible.builtin.assert:
    that:
      - WORDPRESS_ADDONS_REQUIRED | difference(WORDPRESS_ADDONS_INSTALLED) | length == 0
    fail_msg: >-
      Required addon(s)
      {{ WORDPRESS_ADDONS_REQUIRED | difference(WORDPRESS_ADDONS_INSTALLED) | join(', ') }}
      are declared in meta/addons/ but no install loop selects them; their
      `mechanism` must be `plugin` or `mu_plugin` to be installed at all.

- name: "📦 Install declared mu-plugins"
  include_tasks: 04_mu_plugins.yml

- name: "🏠 Reserve and archive the own sites of the site-owner members"
  include_tasks: 05_site_owners.yml
  when: WORDPRESS_SITE_OWNER_ENABLED | bool

- name: "🔁 Iterate through WordPress plugins"
  include_tasks: 06_enable_plugin.yml
  loop: "{{ WORDPRESS_PLUGINS }}"
  loop_control:
    loop_var: wordpress_plugin
    label: "{{ wordpress_plugin.key }}"
  vars:
    plugin_name: "{{ wordpress_plugin.key }}"
    plugin_enabled: "{{ wordpress_plugin.value.enabled | bool }}"
    plugin_task_path: "{{ [role_path, 'tasks/addons', plugin_name  ~ '.yml' ] | path_join }}"
  when: plugin_enabled | bool

- name: 🔍 Detect if WordPress is Multisite
  shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp eval 'echo (int) is_multisite();' --path={{ WORDPRESS_DOCKER_HTML_PATH }}
  register: wp_is_multisite
  changed_when: false

- name: "🛑 Refuse a Multisite state the configuration does not declare"
  ansible.builtin.assert:
    that:
      - (wp_is_multisite.stdout | trim) == (WORDPRESS_MULTISITE_ENABLED | bool | ternary('1', '0'))
    fail_msg: >-
      WordPress reports is_multisite() as {{ wp_is_multisite.stdout | trim }}, but
      services.wordpress.multisite.enabled is {{ WORDPRESS_MULTISITE_ENABLED | bool | lower }}.
      The registration fields of meta/forms.yml follow that setting and would write the
      wrong scope, so align services.wordpress.multisite.enabled with the installation.
    quiet: true

- name: "🛑 Refuse a services.wordpress.options pin no field of meta/forms.yml reads"
  ansible.builtin.assert:
    that:
      - WORDPRESS_OPTION_PINS_UNREAD | length == 0
    fail_msg: >-
      services.wordpress.options pins {{ WORDPRESS_OPTION_PINS_UNREAD | join(', ') }},
      but no field of meta/forms.yml reads them. Declare a field with the source
      services.wordpress.options.<name> under applications.web-app-wordpress.forms,
      or drop the pin.
    quiet: true

- name: "⚙️ Converge the managed options of the WordPress site"
  include_tasks: utils/options.yml
  vars:
    wordpress_options: "{{ WORDPRESS_OPTIONS_CHECKED }}"
    wordpress_options_command: option

- name: "⚙️ Converge the managed options of the WordPress network"
  include_tasks: utils/options.yml
  vars:
    wordpress_options: "{{ WORDPRESS_NETWORK_OPTIONS }}"
    wordpress_options_command: site option
  when: WORDPRESS_NETWORK_OPTIONS | length > 0

- name: "🌍 Verify FreedomTranslate posts to the translation gateway"
  when: WORDPRESS_TRANSLATE_ENABLED | bool
  block:
    - name: "🔎 Read the gateway URL back out of WordPress"
      ansible.builtin.shell: >
        container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
        wp option get freedomtranslate_api_url --path={{ WORDPRESS_DOCKER_HTML_PATH }}
      register: wordpress_translate_readback
      changed_when: false

    - name: "🛑 Refuse a plugin that translates somewhere else"
      ansible.builtin.assert:
        that:
          - (wordpress_translate_readback.stdout | trim) == WORDPRESS_TRANSLATE_ENDPOINT
        fail_msg: >-
          freedomtranslate-wp posts to '{{ wordpress_translate_readback.stdout | trim }}'
          instead of {{ WORDPRESS_TRANSLATE_ENDPOINT }}, so the content would be
          translated outside this deployment or not at all.

- name: "🔄 Update Single Side WordPress domain"
  include_tasks: 08_update_domain.yml
  when: (wp_is_multisite.stdout | trim) == '0'

- name: "🎨 Apply or withdraw the corporate design"
  include_tasks: 09_design.yml

- name: "📧 Verify the relay accepted WordPress's startup mail"
  when: lookup('config', application_id, 'services.email.enabled', false) | bool
  block:
    - name: "⏳ Wait for the delivery marker the healthcheck writes"
      shell: >
        container exec {{ WORDPRESS_CONTAINER_ADDRESS }} test -f {{ lookup('container_mail_marker') }}
      register: wordpress_smoke_mail
      changed_when: false
      failed_when: false
      retries: 30
      delay: 5
      until: wordpress_smoke_mail.rc == 0

    - name: "🛑 Report a relay that refused every attempt"
      ansible.builtin.assert:
        that: wordpress_smoke_mail.rc == 0
        fail_msg: >-
          WordPress never delivered its startup mail. The healthcheck writes
          {{ lookup('container_mail_marker') }} only after msmtp exits 0, so
          the relay refused every attempt. Its reason is in the container's
          State.Health.Log; liveness itself is unaffected, which is why the
          stack still converged.
