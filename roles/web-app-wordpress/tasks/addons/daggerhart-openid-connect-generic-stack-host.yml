---
- name: "🛡️ WP OIDC: assert WordPress signs in against the local Keycloak the bind reads"
  ansible.builtin.assert:
    that:
      - OIDC.CLIENT.ISSUER_URL == wordpress_oidc_local_issuer
      - OIDC.CLIENT.TOKEN_URL.startswith(wordpress_oidc_local_issuer ~ '/')
    fail_msg: >-
      WordPress signs in against {{ OIDC.CLIENT.ISSUER_URL }}, not the local
      Keycloak {{ wordpress_oidc_local_issuer }}. The administrator bind reads its
      user id from the local Keycloak, so another issuer sends a different sub and
      locks the administrator out. Drop OIDC_OVERRIDE.URL and the OIDC_OVERRIDE.CLIENT
      issuer and endpoint overrides, or disable the daggerhart-openid-connect-generic addon.
    quiet: true
  vars:
    wordpress_oidc_local_issuer: "{{ lookup('tls', 'web-app-keycloak', 'url.origin') ~ '/realms/' ~ OIDC.CLIENT.REALM }}"

- name: "📌 WP OIDC: delete the stored settings of every site, the container serves them"
  ansible.builtin.shell:
    cmd: >
      container exec -i --user {{ WORDPRESS_USER | quote }}
      {{ WORDPRESS_CONTAINER_ADDRESS }}
      wp eval-file - --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
    stdin: "{{ lookup('file', 'php/oidc/settings.php') }}"
  register: wp_oidc_stored_settings
  changed_when: "'CHANGED' in wp_oidc_stored_settings.stdout"

- name: "🔍 WP OIDC: resolve the Keycloak hosting node and container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: keycloak
    resolve_service_name: "{{ lookup('container_service', 'web-app-keycloak', 'keycloak') }}"
    resolve_output_prefix: WORDPRESS_KEYCLOAK
    resolve_compose_cid: "{{ WORDPRESS_KEYCLOAK_CONTAINER_ADDRESS }}"
    resolve_converge_retries: 60
    resolve_converge_delay: 5
    resolve_cid_filters: "--filter health=healthy"

- name: "🔍 WP OIDC: read the Keycloak user of the administrator"
  ansible.builtin.shell: >- # nocheck: container-exec-resolver  WORDPRESS_KEYCLOAK_LOCAL_CID resolved at delegate_to runtime; container_address would return a manager-only subshell
    container exec -i {{ WORDPRESS_KEYCLOAK_LOCAL_CID | quote }} sh -c '
    /opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:8080 --realm master
    --user "$KEYCLOAK_PERMANENT_ADMIN_USERNAME" --password "$KEYCLOAK_PERMANENT_ADMIN_PASSWORD" >&2
    && exec /opt/keycloak/bin/kcadm.sh get users -r "$1" -q username="$2" -q exact=true --fields id,username' _
    {{ OIDC.CLIENT.REALM | quote }} {{ WORDPRESS_ADMIN_USER | quote }}
  register: wordpress_keycloak_admin_users
  changed_when: false
  retries: 6
  delay: 10
  until: wordpress_keycloak_admin_users.rc == 0
  delegate_to: "{{ WORDPRESS_KEYCLOAK_HOST_NODE }}"

- name: "🔗 WP OIDC: pick the Keycloak user id of the administrator"
  ansible.builtin.set_fact:
    wordpress_oidc_admin_subject: "{{ wordpress_keycloak_admin_users.stdout | keycloak_user_id(WORDPRESS_ADMIN_USER) }}"

- name: "🔍 WP OIDC: list the administrator's meta keys"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta list {{ WORDPRESS_ADMIN_USER | quote }} --fields=meta_key --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  register: wordpress_oidc_admin_meta_keys
  changed_when: false

- name: "🔗 WP OIDC: pick the administrator's subject identity keys"
  ansible.builtin.set_fact:
    wordpress_oidc_admin_identity_keys: "{{ (['openid-connect-generic-subject-identity'] + (wordpress_oidc_admin_meta_keys.stdout | from_json | map(attribute='meta_key')
      | select('search', 'openid-connect-generic-subject-identity$') | list)) | unique }}"

- name: "🔍 WP OIDC: read the administrator's subject identities before the bind"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta list {{ WORDPRESS_ADMIN_USER | quote }}
    --keys={{ wordpress_oidc_admin_identity_keys | join(',') | quote }}
    --fields=meta_key,meta_value --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  register: wordpress_oidc_admin_prior_identities
  changed_when: false

- name: "🛡️ WP OIDC: refuse to overwrite a foreign identity on the administrator"
  ansible.builtin.assert:
    that:
      - wordpress_oidc_admin_foreign_keys == []
    fail_msg: >-
      The administrator {{ WORDPRESS_ADMIN_USER }} already holds another subject identity
      under {{ wordpress_oidc_admin_foreign_keys | join(', ') }}, so the deploy stops before
      it overwrites that binding. Check which Keycloak user the stored value belongs to, then
      clear each key with wp user meta delete {{ WORDPRESS_ADMIN_USER }} <key> and deploy again.
    quiet: true
  vars:
    wordpress_oidc_admin_foreign_keys: "{{ wordpress_oidc_admin_prior_identities.stdout | from_json | rejectattr('meta_value', 'equalto', wordpress_oidc_admin_subject)
      | map(attribute='meta_key') | list }}"

- name: "🔗 WP OIDC: store the Keycloak user id as the administrator's subject identity"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta update {{ WORDPRESS_ADMIN_USER | quote }} openid-connect-generic-subject-identity
    {{ wordpress_oidc_admin_subject | quote }}
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  register: wordpress_oidc_admin_bound
  changed_when: "'is unchanged' not in wordpress_oidc_admin_bound.stdout"

- name: "🔍 WP OIDC: assert every administrator subject identity is its Keycloak id"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta list {{ WORDPRESS_ADMIN_USER | quote }}
    --keys={{ wordpress_oidc_admin_identity_keys | join(',') | quote }}
    --fields=meta_key,meta_value --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  register: wordpress_oidc_admin_identities
  changed_when: false
  failed_when: >-
    wordpress_oidc_admin_identities.rc != 0
    or (wordpress_oidc_admin_identities.stdout | from_json | rejectattr('meta_value', 'equalto', wordpress_oidc_admin_subject) | list) != []
    or (wordpress_oidc_admin_identities.stdout | from_json | selectattr('meta_key', 'equalto', 'openid-connect-generic-subject-identity') | list) == []

- name: "🔍 WP OIDC: list every account bound to the administrator's Keycloak user"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user list --blog_id=0 --meta_key=openid-connect-generic-subject-identity --meta_compare_key=LIKE
    --meta_value={{ wordpress_oidc_admin_subject | quote }} --fields=ID,user_login --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  register: wordpress_oidc_subject_holders
  changed_when: false

- name: "🔍 WP OIDC: list the meta keys of every other account bound to it"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta list {{ item.ID | quote }} --fields=meta_key --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  loop: "{{ wordpress_oidc_subject_holders.stdout | from_json | rejectattr('user_login', 'match', '^' ~ (WORDPRESS_ADMIN_USER | regex_escape) ~ '$', ignorecase=true)
    | list }}"
  loop_control:
    label: "{{ item.user_login }}"
  register: wordpress_oidc_stray_keys
  changed_when: false

- name: "🔍 WP OIDC: read the subject identities of every other account bound to it"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta list {{ item.item.ID | quote }}
    --keys={{ (['openid-connect-generic-subject-identity'] + (item.stdout | from_json | map(attribute='meta_key') | select('search', 'openid-connect-generic-subject-identity$')
    | list)) | unique | join(',') | quote }}
    --fields=meta_key,meta_value --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  loop: "{{ wordpress_oidc_stray_keys.results }}"
  loop_control:
    label: "{{ item.item.user_login }}"
  register: wordpress_oidc_stray_identities
  changed_when: false

- name: "🧹 WP OIDC: unbind the administrator's Keycloak user from every other account"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user meta delete {{ item.ID | quote }} {{ item.meta_key | quote }}
    {{ wordpress_oidc_admin_subject | quote }}
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  loop: "{{ wordpress_oidc_stray_identities.results | oidc_subject_strays(wordpress_oidc_admin_subject) }}"
  loop_control:
    label: "{{ item.user_login }} {{ item.meta_key }}"
  changed_when: true

- name: "🔍 WP OIDC: assert only the administrator holds its Keycloak id on any site"
  ansible.builtin.shell: >
    container exec -u {{ WORDPRESS_USER }} {{ WORDPRESS_CONTAINER_ADDRESS }}
    wp user list --blog_id=0 --meta_key=openid-connect-generic-subject-identity --meta_compare_key=LIKE
    --meta_value={{ wordpress_oidc_admin_subject | quote }} --fields=user_login --format=json
    --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
  register: wordpress_oidc_subject_owners
  changed_when: false
  failed_when: >-
    wordpress_oidc_subject_owners.rc != 0
    or (wordpress_oidc_subject_owners.stdout | from_json | map(attribute='user_login') | map('lower') | list) != [WORDPRESS_ADMIN_USER | lower]
