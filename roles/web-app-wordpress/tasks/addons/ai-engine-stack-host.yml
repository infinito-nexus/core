---
- name: "🔐 Verify the gateway contract for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-litellm/tasks/utils/consumer_contract.yml') }}"

- name: "🔎 Read the managed AI Engine settings the configuration is about to overwrite"
  ansible.builtin.shell:
    cmd: >
      container exec -i --user {{ WORDPRESS_USER | quote }}
      -e {{ ('AI_ENGINE_ENV_ID=' ~ WORDPRESS_LITELLM_ENV_ID) | quote }}
      {{ WORDPRESS_CONTAINER_ADDRESS }}
      wp eval-file - --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
    stdin: "{{ lookup('file', 'php/ai_engine/endpoint.php') }}"
  register: wordpress_ai_held
  changed_when: false

- name: "📣 Report the managed AI Engine settings the configuration overwrites"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    forms_drift_current: "{{ {'ai_engine': wordpress_ai_held.stdout | from_json} }}"

- name: "📌 Point the AI Engine default environment at the platform gateway"
  ansible.builtin.shell:
    cmd: >
      IFS= read -r AI_ENGINE_PAYLOAD && : "${AI_ENGINE_PAYLOAD:?arrived empty on stdin}" && export AI_ENGINE_PAYLOAD &&
      container exec -i --user {{ WORDPRESS_USER | quote }}
      -e AI_ENGINE_PAYLOAD
      {{ WORDPRESS_CONTAINER_ADDRESS }}
      wp eval-file - --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
    stdin: |-
      {{ {'environment': WORDPRESS_AI_ENGINE_ENVIRONMENT, 'default_model': WORDPRESS_AI_ENGINE.ai_default_model} | to_json | b64encode }}
      {{ lookup('file', 'php/ai_engine/configure.php') }}
  changed_when: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔒 Disable the AI Engine MCP module and its bearer token on every non-main site"
  when: WORDPRESS_MULTISITE_ENABLED | bool
  ansible.builtin.shell:
    cmd: >
      container exec -i --user {{ WORDPRESS_USER | quote }}
      {{ WORDPRESS_CONTAINER_ADDRESS }}
      wp eval-file - --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
    stdin: "{{ lookup('file', 'php/ai_engine/network_mcp.php') }}"
  register: wordpress_ai_network_mcp
  changed_when: "'CHANGED' in wordpress_ai_network_mcp.stdout"

- name: "🔎 Read back the configured AI Engine endpoint"
  ansible.builtin.shell:
    cmd: >
      container exec -i --user {{ WORDPRESS_USER | quote }}
      -e {{ ('AI_ENGINE_ENV_ID=' ~ WORDPRESS_LITELLM_ENV_ID) | quote }}
      {{ WORDPRESS_CONTAINER_ADDRESS }}
      wp eval-file - --path={{ WORDPRESS_DOCKER_HTML_PATH | quote }}
    stdin: "{{ lookup('file', 'php/ai_engine/endpoint.php') }}"
  register: wordpress_ai_endpoint
  changed_when: false

- name: "🛑 Refuse an AI Engine environment that does not answer through the gateway"
  ansible.builtin.assert:
    that:
      - (wordpress_ai_endpoint.stdout | from_json).endpoint == LITELLM_OPENAI_BASE_LOCAL_URL
    fail_msg: >-
      The AI Engine environment '{{ WORDPRESS_LITELLM_ENV_ID }}' still resolves to
      '{{ (wordpress_ai_endpoint.stdout | from_json).endpoint }}' instead of
      {{ LITELLM_OPENAI_BASE_LOCAL_URL }}, so prompts would leave the deployment.
