---
- name: "🖥️ WP Discourse: wait for Discourse, then run the stack-host container ops"
  when: IS_STACK_HOST | bool
  block:
    - name: ⏳ Wait for Discourse API
      ansible.builtin.command:
        argv:
          - container
          - exec
          - "{{ WORDPRESS_DISCOURSE_CONTAINER_ADDRESS }}" # nocheck: container-exec-resolver  discourse is a launcher-managed container named literally in both modes
          - bash
          - -c
          - "exec 3<>/dev/tcp/127.0.0.1/{{ lookup('config', 'web-app-discourse', 'services.discourse.ports.internal.http') }}"
      register: wp_discourse_api_wait
      until: wp_discourse_api_wait.rc == 0
      retries: "{{ (lookup('timeout', 600) | int) // 5 }}"
      delay: 5
      changed_when: false

    - name: "🖥️ WP Discourse: stack-host container ops against Discourse"
      include_tasks: wp-discourse-stack-host.yml

- name: "📄 Load WP Discourse addon spec from meta/addons/wp-discourse.yml"
  ansible.builtin.include_vars:
    file: "{{ [role_path, 'meta/addons', 'wp-discourse.yml'] | path_join }}"
    name: wp_discourse_addon
- name: "🔍 Resolve WP Discourse settings"
  set_fact:
    discourse_settings: "{{ wp_discourse_addon.config.discourse_settings | default([]) }}"
  changed_when: false

- name: "🖥️ WP Discourse: install and configure the plugin on the stack host"
  when: IS_STACK_HOST | bool
  block:
    - name: "📦 Install WP Discourse plugin"
      ansible.builtin.include_tasks: ../utils/install/plugin.yml
      vars:
        plugin_name: wp-discourse

    - name: "🔧 Configure WP Discourse settings"
      loop: "{{ discourse_settings | map(attribute='name') | unique | list }}"
      loop_control:
        label: "{{ item }}"
      vars:
        option_name: "{{ item }}"

        option_items: >-
          {{ discourse_settings
             | selectattr('name', 'equalto', option_name)
             | list
          }}

        option_kv: >-
          {{ dict(
               option_items | map(attribute='key')
               | zip(option_items | map(attribute='value'))
             ) }}

        option_json_b64: "{{ option_kv | to_json | b64encode }}"

      ansible.builtin.shell: >
        IFS= read -r WP_OPTION_JSON_B64 || :; : "${WP_OPTION_JSON_B64:?arrived empty on stdin}" && export WP_OPTION_JSON_B64 &&
        container exec -u {{ WORDPRESS_USER }} -e WP_OPTION_JSON_B64 {{ WORDPRESS_CONTAINER_ADDRESS }} bash -lc
        "wp eval \"update_option(
        '{{ option_name }}',
        json_decode(
        base64_decode(getenv('WP_OPTION_JSON_B64')),
        true
        )
        );\" --path={{ WORDPRESS_DOCKER_HTML_PATH }}"
      args:
        stdin: "{{ option_json_b64 }}"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
