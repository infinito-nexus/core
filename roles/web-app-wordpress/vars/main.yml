---
application_id: "web-app-wordpress"
entity_name: "{{ application_id | entity_name }}"

WORDPRESS_URL: "{{ lookup('tls', application_id, 'url.base') }}"
WORDPRESS_TITLE: "{{ lookup('design', application_id).label }}"
WORDPRESS_MAX_UPLOAD_SIZE: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.max_upload_size') }}"
WORDPRESS_MULTISITE_ENABLED: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.multisite.enabled') | bool }}"
WORDPRESS_PHP_MEMORY_LIMIT: "{{ lookup('service_memory_mb', application_id, entity_name, 0.25) }}M"
WORDPRESS_DOCKER_HTML_PATH: "{{ lookup('volume', 'web-app-wordpress', 'data').target }}"
WORDPRESS_DOCKER_CONF_PATH: "{{ WORDPRESS_CONFIG_PATH }}"
WORDPRESS_VERSION: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.version') }}"
WORDPRESS_IMAGE: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.image') }}"
WORDPRESS_CONTAINER: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.name') }}"
WORDPRESS_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, entity_name) }}"
WORDPRESS_DISCOURSE_CONTAINER_ADDRESS: "{{ lookup('config', 'web-app-discourse', 'services.discourse.name') }}"
WORDPRESS_DOMAINS: "{{ lookup('domains', application_id) }}"
WORDPRESS_PLUGINS: "{{ lookup('config', application_id, 'addons') | dict2items | selectattr('value.mechanism', 'equalto', 'plugin') | list }}"
WORDPRESS_MU_PLUGINS: "{{ lookup('config', application_id, 'addons') | dict2items | selectattr('value.mechanism', 'equalto', 'mu_plugin') | list }}"
WORDPRESS_ADDONS_INSTALLED: "{{ (WORDPRESS_PLUGINS + WORDPRESS_MU_PLUGINS) | map(attribute='key') | list }}"
WORDPRESS_ADDONS_REQUIRED: "{{ lookup('config', application_id, 'addons') | dict2items | selectattr('value.required', 'defined') | selectattr('value.required') |
  map(attribute='key') | list }}"
WORDPRESS_USER: "www-data"
WORDPRESS_LITELLM_ENV_ID: "{{ lookup('config', application_id, 'addons.ai-engine.config.environment.id') }}"
WORDPRESS_MCP_ENABLED: "{{ lookup('config', application_id, 'mcp.enabled') }}"
WORDPRESS_MCP_SERVICE_KEY: "{{ lookup('config', application_id, 'mcp.endpoint.service_key') }}"
WORDPRESS_MCP_ACCOUNT: "{{ lookup('users', 'mcp-web-app-wordpress') }}"
WORDPRESS_MCP_USERNAME: "{{ WORDPRESS_MCP_ACCOUNT.username }}"
WORDPRESS_MCP_EMAIL: "{{ WORDPRESS_MCP_ACCOUNT.email }}"
WORDPRESS_MCP_ROLE: "subscriber"
WORDPRESS_MCP_APP_PASSWORD_NAME: "mcp"
WORDPRESS_MCP_USER_PASSWORD: "{{ WORDPRESS_MCP_ACCOUNT.password }}"

WORDPRESS_MSMTP_SRC: "{{ lookup('path_absolute', 'roles/sys-svc-mail-msmtp/templates/msmtprc.conf.j2') }}"
WORDPRESS_MSMTP_ABS: "{{ [ lookup('container', application_id, 'directories.config'), 'msmtprc.conf'] | path_join }}"

WORDPRESS_CONFIG_FILE: "wp-config.php"
WORDPRESS_CONFIG_PATH: "{{ [WORDPRESS_DOCKER_HTML_PATH, WORDPRESS_CONFIG_FILE] | path_join }}"
WORDPRESS_CONFIG_UPLD_REL: "config/upload.ini"
WORDPRESS_CONFIG_UPLD_ABS: "{{ [lookup('container', application_id, 'directories.instance'), WORDPRESS_CONFIG_UPLD_REL ] | path_join }}"

WORDPRESS_MU_PLUGINS_DIR: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content/mu-plugins'] | path_join }}"
WORDPRESS_PLUGINS_DIR: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content/plugins'] | path_join }}"
WORDPRESS_BBB_API_URL: >-
  {{ lookup('config', application_id, 'addons.video-conferencing-with-bbb.config.bbb_settings.api_url')
  if (lookup('config', application_id, 'addons.video-conferencing-with-bbb.enabled') | bool) else '' }}
WORDPRESS_BBB_API_SECRET: >-
  {{ lookup('config', application_id, 'addons.video-conferencing-with-bbb.config.bbb_settings.api_secret')
  if (lookup('config', application_id, 'addons.video-conferencing-with-bbb.enabled') | bool) else '' }}
WORDPRESS_LISTMONK_API_URL: >-
  {{ lookup('config', application_id, 'addons.integration-for-listmonk-mailing-list-and-newsletter-manager.config.listmonk_settings.api_url')
  if (lookup('config', application_id, 'addons.integration-for-listmonk-mailing-list-and-newsletter-manager.enabled') | bool) else '' }}
WORDPRESS_PEERTUBE_INSTANCE_URL: >-
  {{ lookup('config', application_id, 'addons.video-manager-for-peertube.config.peertube_settings.instance_url')
  if (lookup('config', application_id, 'addons.video-manager-for-peertube.enabled') | bool) else '' }}
WORDPRESS_S3_UPLOADS_ARCHIVE: >-
  {{ lookup('config', application_id, 'addons.s3-uploads.config.archive')
  if (lookup('config', application_id, 'addons.s3-uploads.enabled') | bool) else '' }}
WORDPRESS_TRANSLATE_OPTIONS: >-
  {{ lookup('config', application_id, 'addons.freedomtranslate-wp.config.options')
  if (lookup('config', application_id, 'addons.freedomtranslate-wp.enabled') | bool) else [] }}
WORDPRESS_TRANSLATE_ENDPOINT: >-
  {{ (WORDPRESS_TRANSLATE_OPTIONS | selectattr('name', 'equalto', 'freedomtranslate_api_url')
  | map(attribute='value') | first) | default('', true) }}
WORDPRESS_S3_UPLOADS_SRC: "/usr/src/s3-uploads"
WORDPRESS_S3_UPLOADS_DIR: "{{ [WORDPRESS_PLUGINS_DIR, 's3-uploads'] | path_join }}"
WORDPRESS_PERMALINK_STRUCTURE: "/%postname%/"

WORDPRESS_ADMIN_EMAIL: "{{ lookup('config', application_id, 'users.platform_administrator.email') }}"
WORDPRESS_ADMIN_USER: "{{ lookup('users', 'platform_administrator').username }}"
WORDPRESS_ADMIN_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
