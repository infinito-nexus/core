---
application_id: "web-app-wordpress"
entity_name: "{{ application_id | entity_name }}"

WORDPRESS_URL: "{{ lookup('tls', application_id, 'url.base') }}"
WORDPRESS_TITLE: "{{ lookup('design', application_id).label }}"
WORDPRESS_MAX_UPLOAD_SIZE: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.max_upload_size') }}"
WORDPRESS_MULTISITE_ENABLED: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.multisite.enabled') | bool }}"
WORDPRESS_PHP_MEMORY_LIMIT: "{{ lookup('service_memory_mb', application_id, entity_name, 0.25) }}M"
WORDPRESS_DOCKER_HTML_PATH: "{{ lookup('volume', 'web-app-wordpress', 'data').target }}"
WORDPRESS_DOCKER_CONF_PATH: "{{ WORDPRESS_CONFIG_PATH }}"
WORDPRESS_VERSION: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.version') }}"
WORDPRESS_IMAGE: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.image') }}"
WORDPRESS_CONTAINER: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.name') }}"
WORDPRESS_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, entity_name) }}"
WORDPRESS_DISCOURSE_CONTAINER_ADDRESS: "{{ lookup('config', 'web-app-discourse', 'services.discourse.name') }}"
WORDPRESS_KEYCLOAK_CONTAINER_ADDRESS: "{{ lookup('container_address', 'web-app-keycloak', 'keycloak') }}"
WORDPRESS_DOMAINS: "{{ lookup('domains', application_id) }}"
WORDPRESS_SITE_DOMAINS: "{{ WORDPRESS_DOMAINS | in_network(WORDPRESS_DOMAINS | first | network_of) }}"
WORDPRESS_NETWORK_BASE_URLS: >-
  {% for site_domain in WORDPRESS_SITE_DOMAINS %}{{ lookup('network_urls', lookup('tls', site_domain, 'url.base')) | join(',') }}{{ '' if loop.last else ';' }}{%
  endfor %}
WORDPRESS_SITE_URLS: "{{ WORDPRESS_NETWORK_BASE_URLS.split(';') | map('split', ',') | map('first') | list }}"
WORDPRESS_PLUGINS: "{{ lookup('config', application_id, 'addons') | dict2items | selectattr('value.mechanism', 'equalto', 'plugin') | list }}"
WORDPRESS_MU_PLUGINS: "{{ lookup('config', application_id, 'addons') | dict2items | selectattr('value.mechanism', 'equalto', 'mu_plugin') | list }}"
WORDPRESS_ADDONS_INSTALLED: "{{ (WORDPRESS_PLUGINS + WORDPRESS_MU_PLUGINS) | map(attribute='key') | list }}"
WORDPRESS_ADDONS_REQUIRED: "{{ lookup('config', application_id, 'addons') | dict2items | selectattr('value.required', 'defined') | selectattr('value.required') |
  map(attribute='key') | list }}"
WORDPRESS_USER: "www-data"
WORDPRESS_LITELLM_ENV_ID: "{{ lookup('config', application_id, 'addons.ai-engine.config.environment.id') }}"
WORDPRESS_MCP_ENABLED: "{{ lookup('config', application_id, 'mcp.enabled') }}"
WORDPRESS_MCP_SERVICE_KEY: "{{ lookup('config', application_id, 'mcp.endpoint.service_key') }}"
WORDPRESS_MCP_ACCOUNT: "{{ lookup('users', 'mcp-web-app-wordpress') }}"
WORDPRESS_MCP_USERNAME: "{{ WORDPRESS_MCP_ACCOUNT.username }}"
WORDPRESS_MCP_EMAIL: "{{ WORDPRESS_MCP_ACCOUNT.email }}"
WORDPRESS_MCP_ROLE: "subscriber"
WORDPRESS_MCP_APP_PASSWORD_NAME: "mcp"
WORDPRESS_MCP_USER_PASSWORD: "{{ WORDPRESS_MCP_ACCOUNT.password }}"

WORDPRESS_MSMTP_SRC: "{{ lookup('path_absolute', 'roles/sys-svc-mail-msmtp/templates/msmtprc.conf.j2') }}"
WORDPRESS_MSMTP_ABS: "{{ [ lookup('container', application_id, 'directories.config'), 'msmtprc.conf'] | path_join }}"

WORDPRESS_CONFIG_FILE: "wp-config.php"
WORDPRESS_CONFIG_PATH: "{{ [WORDPRESS_DOCKER_HTML_PATH, WORDPRESS_CONFIG_FILE] | path_join }}"
WORDPRESS_CONFIG_UPLD_REL: "config/upload.ini"
WORDPRESS_CONFIG_UPLD_ABS: "{{ [lookup('container', application_id, 'directories.instance'), WORDPRESS_CONFIG_UPLD_REL ] | path_join }}"

WORDPRESS_MU_PLUGINS_DIR: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content/mu-plugins'] | path_join }}"
WORDPRESS_SUNRISE_PATH: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content/sunrise.php'] | path_join }}"
WORDPRESS_PLUGINS_DIR: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content/plugins'] | path_join }}"
WORDPRESS_BBB_API_URL: >-
  {{ lookup('config', application_id, 'addons.video-conferencing-with-bbb.config.bbb_settings.api_url')
  if (lookup('config', application_id, 'addons.video-conferencing-with-bbb.enabled') | bool) else '' }}
WORDPRESS_BBB_API_SECRET: >-
  {{ lookup('config', application_id, 'addons.video-conferencing-with-bbb.config.bbb_settings.api_secret')
  if (lookup('config', application_id, 'addons.video-conferencing-with-bbb.enabled') | bool) else '' }}
WORDPRESS_LISTMONK_API_URL: >-
  {{ lookup('config', application_id, 'addons.integration-for-listmonk-mailing-list-and-newsletter-manager.config.listmonk_settings.api_url')
  if (lookup('config', application_id, 'addons.integration-for-listmonk-mailing-list-and-newsletter-manager.enabled') | bool) else '' }}
WORDPRESS_PEERTUBE_INSTANCE_URL: >-
  {{ lookup('config', application_id, 'addons.video-manager-for-peertube.config.peertube_settings.instance_url')
  if (lookup('config', application_id, 'addons.video-manager-for-peertube.enabled') | bool) else '' }}
WORDPRESS_S3_UPLOADS_VERSION: >-
  {{ lookup('config', application_id, 'addons.s3-uploads.version')
  if (lookup('config', application_id, 'addons.s3-uploads.enabled') | bool) else '' }}
WORDPRESS_TRANSLATE_ENABLED: "{{ lookup('config', application_id, 'addons.freedomtranslate-wp.enabled') | bool }}"
WORDPRESS_TRANSLATE_ENDPOINT: "{{ WORDPRESS_OPTIONS.freedomtranslate_api_url }}"
WORDPRESS_S3_UPLOADS_SRC: "/usr/src/s3-uploads"
WORDPRESS_S3_UPLOADS_DIR: "{{ [WORDPRESS_PLUGINS_DIR, 's3-uploads'] | path_join }}"
WORDPRESS_OPTIONS_OWNED_ELSEWHERE: >-
  {{ ['home', 'siteurl', 'active_plugins', 'rewrite_rules', 'openid_connect_generic_settings', 'mwai_options']
  + (lookup('config', application_id, 'addons.wp-discourse.config.discourse_settings') | map(attribute='name') | list)
  + (WORDPRESS_DESIGN_LOGOS.keys() | list) }}
WORDPRESS_OPTIONS: >-
  {{ lookup('form_values', application_id, 'general')
  | combine(lookup('form_values', application_id, 'permalink'))
  | combine(lookup('form_values', application_id, 'translate')) }}
WORDPRESS_NETWORK_OPTIONS: "{{ lookup('form_values', application_id, 'network') }}"
WORDPRESS_ADDRESS: "{{ lookup('form_values', application_id, 'address') }}"
WORDPRESS_MANAGED_OPTIONS_FILE: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content/infinito-managed-options.php'] | path_join }}"
WORDPRESS_OPTIONS_CHECKED: "{{ WORDPRESS_OPTIONS | wordpress_options_checked(WORDPRESS_OPTIONS_OWNED_ELSEWHERE) }}"
WORDPRESS_AI_ENGINE: "{{ lookup('form_values', application_id, 'ai_engine') }}"
WORDPRESS_AI_ENGINE_ENVIRONMENT: >-
  {{ lookup('config', application_id, 'addons.ai-engine.config.environment')
  | combine({'id': WORDPRESS_AI_ENGINE.ai_default_env, 'endpoint': WORDPRESS_AI_ENGINE.endpoint, 'apikey': WORDPRESS_AI_ENGINE.apikey}) }}
WORDPRESS_MANAGED_OPTIONS:
  option: "{{ WORDPRESS_OPTIONS_CHECKED | combine(WORDPRESS_ADDRESS) }}"
  site_option: "{{ WORDPRESS_NETWORK_OPTIONS }}"
  merge: >-
    {{ {'mwai_options': {
         'keys': {'ai_default_env': WORDPRESS_AI_ENGINE.ai_default_env, 'ai_default_model': WORDPRESS_AI_ENGINE.ai_default_model},
         'records': {'ai_envs': WORDPRESS_AI_ENGINE_ENVIRONMENT}}}
       if WORDPRESS_AI_ENGINE else {} }}
WORDPRESS_OPTION_PINS_UNREAD: >-
  {{ lookup('config', application_id, 'services.' ~ entity_name ~ '.options')
  | wordpress_options_unread(lookup('config', application_id, 'forms')) }}

WORDPRESS_RBAC_SITE_ROLES: ["administrator", "editor", "author", "contributor", "subscriber"]
WORDPRESS_RBAC_NETWORK_ADMIN_ROLE: "network-administrator"
WORDPRESS_RBAC_SITE_OWNER_ROLE: "site-owner"
WORDPRESS_RBAC_CONFIG: "{{ lookup('config', application_id, 'rbac') }}"
WORDPRESS_RBAC_DOMAIN_TENANCY: "{{ 'tenancy' in WORDPRESS_RBAC_CONFIG and WORDPRESS_RBAC_CONFIG.tenancy.axis == 'domain' }}"
WORDPRESS_DOMAINS_CONFIG: "{{ lookup('config', application_id, 'domains') }}"
WORDPRESS_SITE_OWNER_DECLARATIONS: "{{ (WORDPRESS_DOMAINS_CONFIG.served if 'served' in WORDPRESS_DOMAINS_CONFIG else []) | selectattr('role', 'equalto', WORDPRESS_RBAC_SITE_OWNER_ROLE)
  | list }}"
WORDPRESS_SITE_OWNER_ENABLED: "{{ (WORDPRESS_MULTISITE_ENABLED | bool) and (WORDPRESS_SITE_OWNER_DECLARATIONS | length > 0) }}"
WORDPRESS_SITE_OWNER_RESOLVED: "{{ lookup('served_domains', application_ids=[application_id]) }}"
WORDPRESS_SITE_OWNER_PARENT_DOMAIN: "{{ (WORDPRESS_SITE_OWNER_RESOLVED.parents | selectattr('role', 'equalto', WORDPRESS_RBAC_SITE_OWNER_ROLE) | first).parent }}"
WORDPRESS_SITE_OWNER_BASE_URL: "{{ lookup('tls', application_id, 'protocols.web') }}://{{ WORDPRESS_SITE_OWNER_PARENT_DOMAIN }}"
WORDPRESS_SITE_OWNER_SERVED: "{{ CURRENT_PLAY_SERVED_DOMAINS | selectattr('application_id', 'equalto', application_id) | list }}"
WORDPRESS_SITE_OWNER_DOMAINS: "{{ WORDPRESS_SITE_OWNER_SERVED | map(attribute='name') | list }}"
WORDPRESS_SITE_OWNER_LOGINS: "{{ WORDPRESS_SITE_OWNER_SERVED | rejectattr('name', 'match', '[*][.]') | map(attribute='members') | flatten | list }}"
WORDPRESS_SITE_OWNER_MEMBERS: "{{ WORDPRESS_SITE_OWNER_SERVED | map(attribute='members') | flatten | unique | list }}"
WORDPRESS_SITE_OWNER_PROBLEMS: "{{ WORDPRESS_SITE_OWNER_RESOLVED.problems }}"
WORDPRESS_OIDC_SETTINGS: "{{ lookup('config', application_id, 'addons.daggerhart-openid-connect-generic.config.oidc_settings') }}"
WORDPRESS_RBAC_GROUP_MAP: "{{ lookup('template', lookup('path_absolute', 'roles', application_id, 'templates/rbac_group_map.json.j2')) | from_json }}"
WORDPRESS_ADMIN_EMAIL: "{{ lookup('config', application_id, 'users.platform_administrator.email') }}"
WORDPRESS_ADMIN_USER: "{{ lookup('users', 'platform_administrator').username }}"
WORDPRESS_ADMIN_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"

WORDPRESS_LOGIN_SSO: "{{ lookup('config', application_id, 'services.wordpress.login.method.sso.enabled') | bool }}"
WORDPRESS_LOGIN_NATIVE: "{{ lookup('config', application_id, 'services.wordpress.login.method.native.enabled') | bool }}"
WORDPRESS_LOGIN_REGISTRATION: "{{ lookup('config', application_id, 'services.wordpress.login.method.registration.enabled') | bool }}"

WORDPRESS_DESIGN: "{{ lookup('design', application_id) }}"
WORDPRESS_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
WORDPRESS_DESIGN_HOST_DIR: "{{ [lookup('container', application_id, 'directories.config'), 'design'] | path_join }}"
WORDPRESS_DESIGN_DIRECTORY: "infinito-design"
WORDPRESS_DESIGN_PATH: "{{ [WORDPRESS_DOCKER_HTML_PATH, 'wp-content', WORDPRESS_DESIGN_DIRECTORY] | path_join }}"
WORDPRESS_DESIGN_STYLESHEETS: ["admin.css", "admin-bar.css", "extras.css", "editor.css", "login.css"]
WORDPRESS_DESIGN_LOGOS:
  site_icon: "icon.png"
  site_logo: "logo.png"
WORDPRESS_DESIGN_PALETTE: "{{ lookup('design_palette', lookup('config', 'web-svc-design', 'services.design.colors.base')).light }}"
WORDPRESS_DESIGN_SYNC: >-
  mkdir -p "$(dirname "$1")" && cat > "$1.new" &&
  if cmp -s "$1.new" "$1"; then rm "$1.new"; else mv "$1.new" "$1" && echo CHANGED; fi
WORDPRESS_DESIGN_CONFIG:
  enabled: "{{ WORDPRESS_DESIGN_ENABLED | string | lower }}"
  directory: "{{ WORDPRESS_DESIGN_DIRECTORY }}"
  logos: "{{ WORDPRESS_DESIGN_LOGOS if WORDPRESS_DESIGN.logo is string else {} }}"
  stylesheets: "{{ WORDPRESS_DESIGN_STYLESHEETS }}"
  global_styles:
    twentytwentyfive: "{{ lookup('file', [role_path, 'files/json/global-styles.twentytwentyfive.json'] | path_join) | from_json }}"
  scheme:
    name: "{{ service_provider.platform.titel }}"
    colors:
      - "{{ WORDPRESS_DESIGN_PALETTE['--design-frame'] }}"
      - "{{ WORDPRESS_DESIGN_PALETTE['--design-frame-active'] }}"
      - "{{ WORDPRESS_DESIGN_PALETTE['--design-primary'] }}"
      - "{{ WORDPRESS_DESIGN_PALETTE['--design-surface-1'] }}"
    icons:
      base: "{{ WORDPRESS_DESIGN_PALETTE['--design-on-frame'] }}"
      focus: "{{ WORDPRESS_DESIGN_PALETTE['--design-on-frame'] }}"
      current: "{{ WORDPRESS_DESIGN_PALETTE['--design-on-frame'] }}"
  tokens:
    - "{{ lookup('cdn', 'web-svc-cdn').relative_urls.shared.css }}/default.css"
