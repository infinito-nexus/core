---
- include_tasks: utils/once/flag.yml

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: "📁 Create shared object-store network for '{{ application_id }}'"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/create.yml') }}"
  vars:
    network_role_id: "{{ application_id }}"

- name: "▶️ Start the MinIO stack"
  ansible.builtin.meta: flush_handlers

- name: "📂 Include role svc-stack for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml

- name: "🔧 Configure MinIO OIDC (Keycloak as named IdP + policy)"
  ansible.builtin.include_tasks:
    file: 01_oidc.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when: MINIO_LOGIN_SSO | bool

- name: "🔗 Bind the MinIO RBAC policies to the LDAP role groups (LDAP variant)"
  ansible.builtin.include_tasks:
    file: 02_ldap.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when: MINIO_LOGIN_LDAP | bool
