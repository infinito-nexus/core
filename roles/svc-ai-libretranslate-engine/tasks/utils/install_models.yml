---
- name: "📥 Install the Argos models into {{ application_id }}"
  when: IS_STACK_HOST | bool
  ansible.builtin.shell:
    cmd: >- # nocheck: raw-docker, container-exec-resolver  the models belong to the served container's own interpreter and land in its mounted model directory, which no other host has
      container exec {{ LIBRETRANSLATE_ENGINE_CONTAINER_ADDRESS }}
      sh -c 'PYTHONPATH=. REQUESTS_CA_BUNDLE={{ LIBRETRANSLATE_ENGINE_CA_BUNDLE }}
      ./venv/bin/python scripts/prefetch_models.py
      --directions {{ LIBRETRANSLATE_ENGINE_DIRECTIONS }}
      {{ ("--load_only_lang_codes " ~ LIBRETRANSLATE_ENGINE_LOAD_ONLY) if LIBRETRANSLATE_ENGINE_LOAD_ONLY else "" }}'
  register: libretranslate_engine_install
  changed_when: "'Installed' in libretranslate_engine_install.stdout"
