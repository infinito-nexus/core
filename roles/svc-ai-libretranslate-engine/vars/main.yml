---
application_id: svc-ai-libretranslate-engine

entity_name: "{{ application_id | get_entity_name }}"

LIBRETRANSLATE_ENGINE_SERVICE: "{{ entity_name }}"
LIBRETRANSLATE_ENGINE_IMAGE: "{{ lookup('config', application_id, 'services.libretranslate-engine.image') }}"
LIBRETRANSLATE_ENGINE_GPU: "{{ lookup('applications') | resource_filter(application_id, 'gpu', 'libretranslate-engine', false) }}"
LIBRETRANSLATE_ENGINE_VERSION: "{{ lookup('config', application_id, 'services.libretranslate-engine.version') ~ ('-cuda' if LIBRETRANSLATE_ENGINE_GPU | bool else
  '') }}"
LIBRETRANSLATE_ENGINE_LOAD_ONLY: "{{ lookup('config', application_id, 'services.libretranslate-engine.load_only') | join(',') }}"
LIBRETRANSLATE_ENGINE_DIRECTIONS: "{{ lookup('config', application_id, 'services.libretranslate-engine.directions') }}"
LIBRETRANSLATE_ENGINE_PREFETCH_TIMEOUT: "{{ lookup('config', application_id, 'services.libretranslate-engine.prefetch_timeout_seconds') }}"
LIBRETRANSLATE_ENGINE_PREFETCH_RETRIES: "{{ lookup('config', application_id, 'services.libretranslate-engine.prefetch_retries') }}"
LIBRETRANSLATE_ENGINE_APP_USER: "{{ 'root' if LIBRETRANSLATE_ENGINE_GPU | bool else 'libretranslate' }}"
LIBRETRANSLATE_ENGINE_LOADING_MODEL: "{{ lookup('config', application_id, 'services.libretranslate-engine.loading_model') }}"
LIBRETRANSLATE_ENGINE_CA_BUNDLE: "{{ CA_BUNDLE_CANDIDATES | first }}"
LIBRETRANSLATE_ENGINE_MODELS_DIR: "{{ lookup('config', application_id, 'services.libretranslate-engine.models_dir') }}"
LIBRETRANSLATE_ENGINE_UID: "{{ 0 if LIBRETRANSLATE_ENGINE_APP_USER == 'root' else 1032 }}"
LIBRETRANSLATE_ENGINE_THREADS: "{{ [(lookup('cpus', application_id, 'libretranslate-engine') | float) | round(0, 'ceil') | int, 1] | max }}"
LIBRETRANSLATE_ENGINE_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, 'libretranslate-engine') }}"

LIBRETRANSLATE_ENGINE_CACHE_CA_FILE: /opt/package-frontend-ca.crt
LIBRETRANSLATE_ENGINE_CACHE_CA_INSTALLER: roles/svc-cache-package/files/shell/ca.sh
