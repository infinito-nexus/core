---
- name: ✅ Ensure the pass reports dir exists, kept for the earlier variant-* slots
  ansible.builtin.file:
    path: "{{ _playwright_pass_reports_dir }}"
    state: directory
    mode: "0755"

- name: 🧹 Remove the outputs an earlier run left unarchived, never a variant-* slot
  ansible.builtin.file:
    path: "{{ playwright_stale_output }}"
    state: absent
  loop: "{{ ['playwright-junit.xml', 'playwright-report', 'test-results', 'run-parallel'] | map('regex_replace', '^', _playwright_pass_reports_dir ~ '/') | list }}"
  loop_control:
    loop_var: playwright_stale_output

- name: 📄 Render .env from templates/playwright.env.j2
  ansible.builtin.copy:
    dest: "{{ _playwright_stage_dir }}/.env"
    mode: "0644"
    content: |
      {% set _env = lookup('template', _playwright_env_template, template_vars={'domain': _playwright_pass_domain}) %}
      {% if _playwright_pass_domain == _playwright_passes[0] %}
      {{ _env }}
      {% else %}
      {% for line in _env.splitlines() %}
      {{ line if not line.startswith('CANONICAL_DOMAIN=')
         else 'CANONICAL_DOMAIN=' ~ (lookup('network_siblings', line.split('=', 1)[1] | replace('"', ''))
           | in_network(_playwright_pass_domain | network_of) | first | dotenv_quote) }}
      {% endfor %}
      {% endif %}
      {% for name, value in TEST_E2E_PLAYWRIGHT_CONFIG_TIMEOUTS.items() if name is match('PLAYWRIGHT_[A-Z]+_TIMEOUT$') %}
      {{ name }}={{ value | int }}
      {% endfor %}
      PLAYWRIGHT_NETWORK_LEAK={{ (_playwright_passes | length > 1) | string | lower }}
      PLAYWRIGHT_NETWORK_SUFFIXES={{ _playwright_passes | map('network_of') | network_suffixes | to_json }}
      PLAYWRIGHT_NETWORK_ALLOWED_HOSTS={{ OIDC.URL | urlsplit('hostname') }}
      {% set _bypass = lookup('browser_proxy_bypass', _playwright_pass_domain | network_of, OIDC.URL | urlsplit('hostname')) %}
      {% if _bypass %}
      PLAYWRIGHT_PROXY_BYPASS={{ _bypass | join(',') }}
      {% endif %}
  vars:
    application_id: "{{ application_id }}"
    domains: "{{ lookup('domains') }}"

- name: 🧾 Stage the env keys and CA trust words a run with spec secrets checks
  when: _playwright_secrets_template_stat.stat.exists
  block:
    - name: 📇 List the env template's keys, the only role keys a spec secrets run takes
      ansible.builtin.copy:
        dest: "{{ _playwright_stage_dir }}/.env.keys"
        mode: "0644"
        content: |
          {% for key in lookup('file', _playwright_env_template) | regex_findall('(?m)^([A-Z][A-Z0-9_]*)=') | unique %}
          {{ key }}
          {% endfor %}

    - name: 🔐 List the CA trust words of a run with spec secrets, one per line
      ansible.builtin.copy:
        dest: "{{ _playwright_stage_dir }}/.ca-trust"
        mode: "0644"
        content: |
          {% for word in (_playwright_ca_argv if (_playwright_ca_required | bool) else []) %}
          {{ word }}
          {% endfor %}

- name: ⏳ Wait until application is ready (any non-error response)
  uri_retry:
    url: "{{ lookup('tls', _playwright_pass_domain, 'url.base') }}"
    status_code: "{{ range(100, 500) | list }}"
    validate_certs: false
    follow_redirects: none
  register: _wait_result
  retries: "{{ test_e2e_playwright_wait_retries }}"
  delay: "{{ test_e2e_playwright_wait_delay }}"
  until: >-
    _wait_result.status is defined and
    _wait_result.status | int >= 100 and
    _wait_result.status | int < 500
  when:
    - TEST_E2E_PLAYWRIGHT_WAIT_ENABLED | bool
    - not (TEST_E2E_PLAYWRIGHT_IS_ONION | bool)
    - lookup('config', application_id, 'services.frontend.enabled', true) | bool

- name: ⏳ Wait until the onion answers over Tor (recreate circuits on exhaustion)
  ansible.builtin.script: >-
    {{ role_path }}/files/wait_onion_reachable.sh
    {{ lookup('tor_socks') | quote }}
    {{ _playwright_pass_domain | quote }}
    {{ TEST_E2E_PLAYWRIGHT_ONION_PROBE_RETRIES | int }}
    {{ TEST_E2E_PLAYWRIGHT_ONION_PROBE_DELAY | int }}
    {{ TEST_E2E_PLAYWRIGHT_ONION_PROBE_MAX_TIME | int }}
    {{ lookup('container', 'svc-net-tor', 'directories.instance') | quote }}
    {{ (TEST_E2E_PLAYWRIGHT_TOR_LOCK if (_playwright_dispatch | bool) else '') | quote }}
  register: _playwright_probe
  changed_when: false
  failed_when: _playwright_probe.rc != 0 and not (_playwright_dispatch | bool)
  become: true
  when: TEST_E2E_PLAYWRIGHT_IS_ONION | bool

- name: 🏃 Run the Playwright container in this play and report it
  when: not (_playwright_dispatch | bool)
  block:
    - name: 🔐 Write the role's spec secrets for this run
      ansible.builtin.include_tasks: 03_run_pass/spec_secrets.yml
      when: _playwright_secrets_template_stat.stat.exists

    - name: ▶️ Run Playwright container
      ansible.builtin.command:
        argv: &playwright_argv >-
          {{
            (['python3', '-I', '-B', TEST_E2E_PLAYWRIGHT_TOOLS_DIR ~ '/spec_secrets.py', 'guard'] if (_playwright_secrets_template_stat.stat.exists | bool) else [])
            + TEST_E2E_PLAYWRIGHT_MASK_ARGV
            + [('docker' if (_playwright_secrets_template_stat.stat.exists | bool) else 'container'), 'run', '--rm', '--ipc=host', '--shm-size=1g', '--ulimit=core=0']
            + (
                ['--network', 'host']
                if IS_SWARM_MODE
                else (
                  ['--add-host=host.docker.internal:host-gateway']
                  + (
                      ['--add-host=' ~ lookup('tls', 'web-app-keycloak', 'domain') ~ ':host-gateway']
                      if 'web-app-keycloak' in group_names
                      else []
                    )
                )
              )
            + ['--env-file', _playwright_stage_dir ~ '/.env']
            + ['-e', 'INFINITO_PLAYWRIGHT_KEEP=' ~ test_e2e_playwright_keep]
            + ['-e', 'INFINITO_PLAYWRIGHT_GLOBAL_TIMEOUT_MS=' ~ TEST_E2E_PLAYWRIGHT_GLOBAL_TIMEOUT_MS]
            + ['-e', 'PLAYWRIGHT_PROXY=' ~ TEST_E2E_PLAYWRIGHT_PROXY]
            + ['-e', 'PLAYWRIGHT_WORKERS=' ~ test_e2e_playwright_workers]
            + ['-e', 'PLAYWRIGHT_FULLY_PARALLEL=' ~ TEST_E2E_PLAYWRIGHT_FULLY_PARALLEL]
            + ['-e', 'PLAYWRIGHT_TIMEOUT_FACTOR=' ~ TIMEOUT_FACTOR]
            + (['-e', 'PLAYWRIGHT_ONION_TIMEOUT_MULTIPLIER=' ~ TEST_E2E_PLAYWRIGHT_ONION_TIMEOUT_MULTIPLIER] if (TEST_E2E_PLAYWRIGHT_IS_ONION | bool) else [])
            + ['-v', _playwright_stage_dir ~ ':/e2e' ~ (':ro' if (_playwright_secrets_template_stat.stat.exists | bool) else '')]
            + ['-v', _playwright_stage_dir ~ '/volume:/volume' ~ (':ro' if (_playwright_secrets_template_stat.stat.exists | bool) else '')]
            + ['-v', (([_playwright_spec_secrets_path, 'reports'] | path_join) if (_playwright_secrets_template_stat.stat.exists | bool) else _playwright_pass_reports_dir) ~ ':/reports']
            + ['-v', TEST_E2E_PLAYWRIGHT_SHARED_NODE_MODULES ~ ':/e2e/node_modules:ro']
            + ['-v', TEST_E2E_PLAYWRIGHT_SHARED_PERSONAS ~ ':/e2e/tests/personas:ro']
            + (['--mount', 'type=bind,src=' ~ _playwright_spec_secrets_path ~ ',dst=/run/spec-secrets,readonly', '-e', 'INFINITO_PLAYWRIGHT_NO_CAPTURE=true']
               + ['-e', 'NO_COLOR=1', '-e', 'FORCE_COLOR=0', '--log-driver=none', '--cidfile=' ~ _playwright_spec_secrets_path ~ '/.cid']
               if (_playwright_secrets_template_stat.stat.exists | bool) else [])
            + (_playwright_ca_argv if (_playwright_secrets_template_stat.stat.exists | bool) and (_playwright_ca_required | bool) else [])
            + ['-w', '/e2e']
            + [TEST_E2E_PLAYWRIGHT_IMAGE]
            + ((['--'] + TEST_E2E_PLAYWRIGHT_ARGUMENTS) if (_playwright_secrets_template_stat.stat.exists | bool)
               else ['/bin/bash', '-lc', TEST_E2E_PLAYWRIGHT_COMMAND])
          }}
      timeout: "{{ lookup('timeout', TEST_E2E_PLAYWRIGHT_RUN_TIMEOUT_EFFECTIVE) | int }}"
      environment: &playwright_environment >-
        {{
          {
            'CA_TRUST_CERT_HOST': _playwright_ca_cert_host,
            'CA_TRUST_WRAPPER_HOST': _playwright_ca_wrapper_host,
            'CA_TRUST_NAME': _playwright_ca_trust_name
          } if (_playwright_ca_required | bool) else {}
        }}
      register: _playwright_run
      changed_when: false
      failed_when: false
  always:
    - name: 🫥 Mask and remove this run's spec secrets
      when:
        - _playwright_secrets_template_stat.stat.exists
        - _playwright_spec_secrets_path | default('') | length > 0
      block:
        - name: 🫥 Remove the run's container, then mask the spec secrets in its files
          ansible.builtin.command:
            argv:
              - python3
              - -I
              - -B
              - "{{ TEST_E2E_PLAYWRIGHT_MASKER }}"
              - scrub
              - "{{ _playwright_spec_secrets_path }}"
              - "{{ _playwright_pass_reports_dir }}"
              - container
          register: _playwright_spec_secrets_scrub
          changed_when: false
          ignore_errors: true

        - name: 🧹 Remove this run's spec secrets
          ansible.builtin.file:
            path: "{{ _playwright_spec_secrets_path }}"
            state: absent

        - name: 🛑 Fail the pass when its container or reports could not be masked
          ansible.builtin.fail:
            msg: >-
              Masking the spec secrets of {{ application_id }} failed (run rc {{ _playwright_run.rc | default('absent') }}), {{ _playwright_pass_reports_dir }} may hold only part of its reports, all of them masked,
              and the pass is not retried:
              {{ _playwright_spec_secrets_scrub.stderr | default('') }}
          when: _playwright_spec_secrets_scrub is failed

- name: 📝 Report and archive the Playwright run, its reports masked
  when: not (_playwright_dispatch | bool)
  ansible.builtin.include_tasks: 04_collect.yml

- name: 📬 Queue the Playwright run for the parallel scheduler
  when: _playwright_dispatch | bool
  ansible.builtin.include_tasks: 03_run_pass/queue.yml
  vars:
    _playwright_argv: *playwright_argv
    _playwright_environment: *playwright_environment
