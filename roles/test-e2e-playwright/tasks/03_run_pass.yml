---
- name: ✅ Ensure the pass reports dir exists
  ansible.builtin.file:
    path: "{{ _playwright_pass_reports_dir }}"
    state: directory
    mode: "0755"

- name: 📄 Render .env from templates/playwright.env.j2
  ansible.builtin.copy:
    dest: "{{ _playwright_stage_dir }}/.env"
    mode: "0644"
    content: |
      {% set _env = lookup('template', _playwright_env_template, template_vars={'domain': _playwright_pass_domain}) %}
      {% if _playwright_pass_domain == _playwright_passes[0] %}
      {{ _env }}
      {% else %}
      {% for line in _env.splitlines() %}
      {{ line if not line.startswith('CANONICAL_DOMAIN=')
         else 'CANONICAL_DOMAIN=' ~ (lookup('network_siblings', line.split('=', 1)[1] | replace('"', ''))
           | in_network(_playwright_pass_domain | network_of) | first | dotenv_quote) }}
      {% endfor %}
      {% endif %}
      {% for name, value in TEST_E2E_PLAYWRIGHT_CONFIG_TIMEOUTS.items() %}
      {{ name }}={{ value }}
      {% endfor %}
      PLAYWRIGHT_NETWORK_LEAK={{ (_playwright_passes | length > 1) | string | lower }}
      PLAYWRIGHT_NETWORK_SUFFIXES={{ _playwright_passes | map('network_of') | network_suffixes | to_json }}
      PLAYWRIGHT_NETWORK_ALLOWED_HOSTS={{ OIDC.URL | urlsplit('hostname') }}
  vars:
    application_id: "{{ application_id }}"
    domains: "{{ lookup('domains') }}"

- name: ⏳ Wait until application is ready (any non-error response)
  uri_retry:
    url: "{{ lookup('tls', _playwright_pass_domain, 'url.base') }}"
    status_code: "{{ range(100, 500) | list }}"
    validate_certs: false
    follow_redirects: none
  register: _wait_result
  retries: "{{ test_e2e_playwright_wait_retries }}"
  delay: "{{ test_e2e_playwright_wait_delay }}"
  until: >-
    _wait_result.status is defined and
    _wait_result.status | int >= 100 and
    _wait_result.status | int < 500
  when:
    - TEST_E2E_PLAYWRIGHT_WAIT_ENABLED | bool
    - not (TEST_E2E_PLAYWRIGHT_IS_ONION | bool)
    - lookup('config', application_id, 'services.frontend.enabled', true) | bool

- name: ⏳ Wait until the onion answers over Tor (recreate circuits on exhaustion)
  ansible.builtin.script: >-
    {{ role_path }}/files/wait_onion_reachable.sh
    {{ lookup('tor_socks') | quote }}
    {{ _playwright_pass_domain | quote }}
    {{ TEST_E2E_PLAYWRIGHT_ONION_PROBE_RETRIES | int }}
    {{ TEST_E2E_PLAYWRIGHT_ONION_PROBE_DELAY | int }}
    {{ lookup('container', 'svc-net-tor', 'directories.instance') | quote }}
  changed_when: false
  become: true
  when: TEST_E2E_PLAYWRIGHT_IS_ONION | bool

- name: ▶️ Run Playwright container
  ansible.builtin.command:
    argv: >-
      {{
        ['container', 'run', '--rm', '--ipc=host', '--shm-size=1g']
        + (
            ['--network', 'host']
            if DEPLOYMENT_MODE == 'swarm'
            else (
              ['--add-host=host.docker.internal:host-gateway']
              + (
                  ['--add-host=' ~ lookup('tls', 'web-app-keycloak', 'domain') ~ ':host-gateway']
                  if 'web-app-keycloak' in group_names
                  else []
                )
            )
          )
        + ['--env-file', _playwright_stage_dir ~ '/.env']
        + ['-e', 'INFINITO_PLAYWRIGHT_KEEP=' ~ test_e2e_playwright_keep]
        + ['-e', 'INFINITO_PLAYWRIGHT_GLOBAL_TIMEOUT_MS=' ~ TEST_E2E_PLAYWRIGHT_GLOBAL_TIMEOUT_MS]
        + ['-e', 'PLAYWRIGHT_PROXY=' ~ TEST_E2E_PLAYWRIGHT_PROXY]
        + (
            ['-e', 'PLAYWRIGHT_PROXY_BYPASS=' ~ (OIDC.URL | urlsplit('hostname'))]
            if (OIDC.URL | urlsplit('hostname') | network_of) != (_playwright_pass_domain | network_of)
            else []
          )
        + ['-e', 'PLAYWRIGHT_WORKERS=' ~ test_e2e_playwright_workers]
        + ['-e', 'PLAYWRIGHT_FULLY_PARALLEL=' ~ TEST_E2E_PLAYWRIGHT_FULLY_PARALLEL]
        + ['-e', 'PLAYWRIGHT_TIMEOUT_FACTOR=' ~ TIMEOUT_FACTOR]
        + (['-e', 'PLAYWRIGHT_ONION_TIMEOUT_MULTIPLIER=' ~ TEST_E2E_PLAYWRIGHT_ONION_TIMEOUT_MULTIPLIER] if (TEST_E2E_PLAYWRIGHT_IS_ONION | bool) else [])
        + ['-v', _playwright_stage_dir ~ ':/e2e']
        + ['-v', _playwright_stage_dir ~ '/volume:/volume']
        + ['-v', _playwright_pass_reports_dir ~ ':/reports']
        + ['-v', TEST_E2E_PLAYWRIGHT_SHARED_NODE_MODULES ~ ':/e2e/node_modules:ro']
        + ['-v', TEST_E2E_PLAYWRIGHT_SHARED_PERSONAS ~ ':/e2e/tests/personas:ro']
        + ['-w', '/e2e']
        + [TEST_E2E_PLAYWRIGHT_IMAGE]
        + ['/bin/bash', '-lc', TEST_E2E_PLAYWRIGHT_COMMAND]
      }}
  timeout: "{{ lookup('timeout', TEST_E2E_PLAYWRIGHT_RUN_TIMEOUT_EFFECTIVE) | int }}"
  environment: >-
    {{
      {
        'CA_TRUST_CERT_HOST': _playwright_ca_cert_host,
        'CA_TRUST_WRAPPER_HOST': _playwright_ca_wrapper_host,
        'CA_TRUST_NAME': _playwright_ca_trust_name
      } if (_playwright_ca_required | bool) else {}
    }}
  register: _playwright_run
  changed_when: false
  failed_when: false

- name: 💬 Print Playwright output (on failure)
  ansible.builtin.debug:
    msg: |
      rc: {{ _playwright_run.rc | default('<absent: run was aborted>') }}

      stdout:
      {{ _playwright_run.stdout | default('') }}

      stderr:
      {{ _playwright_run.stderr | default(_playwright_run.msg | default('')) }}
  when: (_playwright_run.rc | default(1)) != 0
  changed_when: false

- name: 📝 Record failure
  ansible.builtin.set_fact:
    _playwright_failures: "{{ (_playwright_failures | default([])) + [application_id] }}"
  when: (_playwright_run.rc | default(1)) != 0

- name: 🗄️ Archive Playwright reports for this variant + pass
  ansible.builtin.script: >-
    {{ role_path }}/files/archive_playwright_reports.sh
    {{ _playwright_pass_reports_dir | quote }}
    {{ VARIANT_INDEX | int }}
    {{ ASYNC_ENABLED | bool | string | lower }}
  changed_when: true
