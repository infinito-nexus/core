---
- name: 📌 Start the pass without a spec secrets directory to clean up
  ansible.builtin.set_fact:
    _playwright_spec_secrets_path: ""

- name: 📋 Ship the matcher the masker finds the values with
  ansible.builtin.copy:
    src: "{{ role_path }}/files/spec_secrets_match.py"
    dest: "{{ TEST_E2E_PLAYWRIGHT_TOOLS_DIR }}/spec_secrets_match.py"
    mode: "0644"

- name: 📋 Ship the file operations the masker uses to read, rewrite and publish reports
  ansible.builtin.copy:
    src: "{{ role_path }}/files/spec_secrets_files.py"
    dest: "{{ TEST_E2E_PLAYWRIGHT_TOOLS_DIR }}/spec_secrets_files.py"
    mode: "0644"

- name: 📋 Ship the masker that masks the run's output and reports on the host
  ansible.builtin.copy:
    src: "{{ role_path }}/files/spec_secrets_mask.py"
    dest: "{{ TEST_E2E_PLAYWRIGHT_MASKER }}"
    mode: "0755"

- name: ✅ Refuse Playwright arguments outside the allowlist before a directory exists
  ansible.builtin.command:
    # nocheck: task-argv-secret Reason: the match is the helper file name spec_secrets.py, and the arguments are the operator's Playwright options, already on the ansible-playbook argv, which this task checks against the allowlist, never a value
    argv: "{{ ['python3', '-I', '-B', TEST_E2E_PLAYWRIGHT_TOOLS_DIR ~ '/spec_secrets.py', 'arguments'] + TEST_E2E_PLAYWRIGHT_ARGUMENTS }}"
  changed_when: false

- name: 📁 Create a fresh spec secrets directory owned by the login user
  ansible.builtin.command:
    argv: [python3, -I, -B, "{{ TEST_E2E_PLAYWRIGHT_TOOLS_DIR }}/spec_secrets.py", create]
  become: false
  register: _playwright_spec_secrets_created
  changed_when: true

- name: 📌 Point the mount, the masking and the cleanup at the fresh directory
  ansible.builtin.set_fact:
    _playwright_spec_secrets_path: "{{ _playwright_spec_secrets_created.stdout | trim }}"

- name: 📝 Leave the directory to the scrub after the scheduler has drained
  ansible.builtin.set_fact:
    _playwright_spec_secrets_runs: "{{ _playwright_spec_secrets_runs + [[_playwright_spec_secrets_path, _playwright_pass_reports_dir]] }}"
  when: _playwright_dispatch | bool

- name: ✅ Assert no Ansible temp copy of the template outlives its task
  ansible.builtin.assert:
    that:
      - not (lookup('ansible.builtin.config', 'DEFAULT_KEEP_REMOTE_FILES') | bool)
    fail_msg: ANSIBLE_KEEP_REMOTE_FILES would keep a copy of the rendered spec secrets in the run directory the container mounts; unset it.
    quiet: true

- name: 🔑 Hand the salted templates/playwright.secrets.j2 to the run directory
  ansible.builtin.copy:
    content: "#{{ (2 ** 128) | random }}\n{{ lookup('template', _playwright_secrets_template, template_vars={'domain': _playwright_pass_domain}) }}"
    dest: "{{ _playwright_spec_secrets_path }}/.rendered"
    mode: "0400"
  diff: false
  vars:
    application_id: "{{ application_id }}"
    domains: "{{ lookup('domains') }}"
    ansible_remote_tmp: "{{ _playwright_spec_secrets_path }}"

- name: 🔑 Split the handed template into one 0400 file per key
  ansible.builtin.command:
    argv:
      - python3
      - -I
      - -B
      - "{{ TEST_E2E_PLAYWRIGHT_TOOLS_DIR }}/spec_secrets.py"
      - split
      - "{{ _playwright_spec_secrets_path }}"
  changed_when: true
