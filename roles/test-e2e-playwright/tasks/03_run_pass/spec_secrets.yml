---
- name: 📋 Ship the helper the masker reads the run directory with
  ansible.builtin.copy:
    src: "{{ role_path }}/files/spec_secrets.py"
    dest: "{{ TEST_E2E_PLAYWRIGHT_SHARED_DIR }}/spec_secrets.py"
    mode: "0755"

- name: 📋 Ship the matcher the masker finds the values with
  ansible.builtin.copy:
    src: "{{ role_path }}/files/spec_secrets_match.py"
    dest: "{{ TEST_E2E_PLAYWRIGHT_SHARED_DIR }}/spec_secrets_match.py"
    mode: "0644"

- name: 📋 Ship the masker that masks the run's output and files on the host
  ansible.builtin.copy:
    src: "{{ role_path }}/files/spec_secrets_mask.py"
    dest: "{{ TEST_E2E_PLAYWRIGHT_MASKER }}"
    mode: "0755"

- name: 🧾 Keep the digests of the fresh stage dir, the only stage files a rerun trusts
  ansible.builtin.command:
    argv:
      - python3
      - "{{ TEST_E2E_PLAYWRIGHT_MASKER }}"
      - baseline
      - "{{ _playwright_stage_dir }}"
  changed_when: true

- name: 📁 Create a fresh spec secrets directory, locked while the play lives
  ansible.builtin.script: >-
    {{ role_path }}/files/spec_secrets.py create
    {{ ((TEST_E2E_PLAYWRIGHT_PARALLEL_BUDGET if (_playwright_dispatch | bool)
        else lookup('timeout', TEST_E2E_PLAYWRIGHT_RUN_TIMEOUT_EFFECTIVE)) | int)
       + (TEST_E2E_PLAYWRIGHT_MASK_GRACE_SECONDS | int) }}
    {{ TEST_E2E_PLAYWRIGHT_PLAY_PID | int }}
  register: _playwright_spec_secrets_created
  changed_when: true

- name: 📌 Point the mount, the masking and the cleanup at the fresh directory
  ansible.builtin.set_fact:
    _playwright_spec_secrets_path: "{{ _playwright_spec_secrets_created.stdout | trim }}"
    _playwright_spec_secrets_runs: >-
      {{ (_playwright_spec_secrets_runs | default([]))
         + [[_playwright_spec_secrets_created.stdout | trim, _playwright_stage_dir, _playwright_pass_reports_dir]] }}

- name: 📄 Render templates/playwright.secrets.j2 behind a random salt line
  ansible.builtin.copy:
    dest: "{{ _playwright_spec_secrets_path }}/.rendered"
    owner: root
    group: root
    mode: "0400"
    content: |
      {{ '#' ~ ((2 ** 256) | random) }}
      {{ lookup('template', _playwright_secrets_template, template_vars={'domain': _playwright_pass_domain}) }}
  diff: false
  vars:
    application_id: "{{ application_id }}"
    domains: "{{ lookup('domains') }}"

- name: 🔑 Split the rendered spec secrets into one 0400 file per key
  ansible.builtin.script: >-
    {{ role_path }}/files/spec_secrets.py split
    {{ _playwright_spec_secrets_path | quote }}
  changed_when: true
