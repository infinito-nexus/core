---
- name: ✅ Create the staging base dir with mkdir, which never follows a link nor touches a dir another user made
  ansible.builtin.command:
    argv: [mkdir, -m, "0755", "{{ TEST_E2E_PLAYWRIGHT_STAGE_BASE_DIR }}"]
    creates: "{{ TEST_E2E_PLAYWRIGHT_STAGE_BASE_DIR }}"

- name: 🔍 Read who owns the stage base, the shared Playwright project dir and the tools dir
  ansible.builtin.stat:
    path: "{{ playwright_owned_dir }}"
    follow: false
  loop:
    - "{{ TEST_E2E_PLAYWRIGHT_STAGE_BASE_DIR }}"
    - "{{ TEST_E2E_PLAYWRIGHT_SHARED_DIR }}"
    - "{{ TEST_E2E_PLAYWRIGHT_TOOLS_DIR }}"
  loop_control:
    loop_var: playwright_owned_dir
  register: _playwright_owned_dirs

- name: ✅ Refuse a stage base, shared or tools dir another user created or may write
  ansible.builtin.assert:
    that:
      - not playwright_owned.stat.exists or (playwright_owned.stat.isdir and not playwright_owned.stat.islnk
        and playwright_owned.stat.uid == 0 and not playwright_owned.stat.wgrp and not playwright_owned.stat.woth)
    fail_msg: >-
      {{ playwright_owned.playwright_owned_dir }} is a link, not root's or writable by others, so the masker, its helpers
      or node_modules there could be swapped; remove it.
    quiet: true
  loop: "{{ _playwright_owned_dirs.results }}"
  loop_control:
    loop_var: playwright_owned
    label: "{{ playwright_owned.playwright_owned_dir }}"

- name: ✅ Ensure reports base dir exists
  ansible.builtin.file:
    path: "{{ TEST_E2E_PLAYWRIGHT_REPORTS_BASE_DIR }}"
    state: directory
    mode: "0755"

- name: 🧰 Prepare shared @playwright/test install
  ansible.builtin.include_tasks: 01_setup.yml

- name: 🧹 Remove the spec secrets a killed run left behind
  ansible.builtin.command:
    argv: [python3, -I, -B, "{{ TEST_E2E_PLAYWRIGHT_TOOLS_DIR }}/spec_secrets.py", prune]
  register: _playwright_spec_secrets_pruned
  changed_when: "'removed:' in (_playwright_spec_secrets_pruned.stdout | default(''))"
  failed_when: false

- name: ✅ Check the CA and central templates every role's run shares
  ansible.builtin.include_tasks: 01_setup/shared_checks.yml

- name: 🎲 Start the run without a network pick
  ansible.builtin.set_fact:
    _playwright_network_picks: {}

- name: ▶️ Run Playwright for each detected role
  ansible.builtin.include_tasks: 02_run_one.yml
  vars:
    application_id: "{{ playwright_role_id }}"
    _playwright_dispatch: false
  loop: "{{ TEST_E2E_PLAYWRIGHT_APPS }}"
  loop_control:
    loop_var: playwright_role_id
    label: "{{ playwright_role_id }}"
  when: TEST_E2E_PLAYWRIGHT_PARALLEL | int == 1

- name: 🔀 Run the round's Playwright containers in parallel
  ansible.builtin.include_tasks: 01_setup/parallel.yml
  when: TEST_E2E_PLAYWRIGHT_PARALLEL | int > 1

- name: ▶️ Run the roles left to the serial runner, in round order, before the retry
  ansible.builtin.include_tasks: 02_run_one.yml
  vars:
    application_id: "{{ playwright_role_id }}"
    _playwright_dispatch: false
  loop: "{{ TEST_E2E_PLAYWRIGHT_APPS | select('in', _playwright_serial_roles | default([])) | list }}"
  loop_control:
    loop_var: playwright_role_id
    label: "{{ playwright_role_id }}"

- name: 🔁 Stash first-pass failures for one flake retry
  ansible.builtin.set_fact:
    _playwright_retry_roles: "{{ _playwright_failures | difference(_budget_timeouts) }}"
    _playwright_failures: "{{ _playwright_failures | intersect(_budget_timeouts) }}"
  vars:
    _budget_timeouts: "{{ _playwright_budget_timeouts | default([]) }}"
  when: (_playwright_failures | default([])) | length > 0

- name: 🔁 Retry failed roles once on rotated Tor circuits
  ansible.builtin.include_tasks: 02_run_one.yml
  vars:
    application_id: "{{ playwright_role_id }}"
    _playwright_dispatch: false
  loop: "{{ _playwright_retry_roles | default([]) }}"
  loop_control:
    loop_var: playwright_role_id
    label: "{{ playwright_role_id }} (retry)"

- name: 🛑 Fail if there were Playwright failures
  ansible.builtin.fail:
    msg: "Playwright failed for roles: {{ _playwright_failures }}"
  when: (_playwright_failures | default([])) | length > 0
