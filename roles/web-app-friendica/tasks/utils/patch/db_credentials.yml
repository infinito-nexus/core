---
- name: "🔑 Realign the password friendica persisted in its config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "friendica_html"
    patch_config_rel: "config/local.config.php"
    patch_expression: "s|('password'\\s*=>\\s*')[^']*(',)|\\1@PASSWORD@\\2|"
