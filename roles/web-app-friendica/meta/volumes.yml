---
html:
  type: volume
  name: friendica_html
  mounts:
    - service: friendica
      target: /var/www/html
data:
  type: volume
  name: friendica_data
  mounts:
    - service: friendica
      target: /var/www/data
ldapauth_config:
  type: config
  source: "{{ [lookup('container', 'web-app-friendica', 'directories.volumes'), 'ldapauth.config.php'] | path_join }}"
  mode: "0444"
  mounts:
    - service: friendica
      target: /var/www/html/config/ldapauth.config.php
      when: "{{ lookup('config', 'web-app-friendica', 'services.ldap.enabled') | bool }}"
design_config:
  type: config
  source: "{{ [lookup('container', 'web-app-friendica', 'directories.volumes'), 'design.config.php'] | path_join }}"
  mode: "0444"
  mounts:
    - service: friendica
      target: /var/www/html/config/zz-infinito-design.config.php
      when: "{{ lookup('config', 'web-app-friendica', 'services.design.enabled') | bool }}"

php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: friendica
      target: /usr/local/etc/php/conf.d/zz-infinito-hardening.ini
