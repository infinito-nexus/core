---
credentials:
  REDIS_PASSWORD:
    description: Password for the Redis 'default' (admin) user used to administer ACLs
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  REDIS_SENTINEL_PASSWORD:
    description: Password for the 'sentinel' ACL user the HA form's Sentinels log in as
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  REDIS_REPLICA_PASSWORD:
    description: Password for the 'replica' ACL user the HA form's replicas authenticate to the master as
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  REDIS_HAPROXY_CHECK_PASSWORD:
    description: Password for the 'haproxy-check' ACL user the HA write endpoint's health check logs in as
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
