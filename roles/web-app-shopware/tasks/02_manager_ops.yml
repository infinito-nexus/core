---
- name: "🚀 Deploy {{ SHOPWARE_INIT_HOST }}"
  copy:
    src: shell/init.sh
    dest: "{{ SHOPWARE_INIT_HOST }}"
    mode: "0755"
  notify:
    - compose-up
    - compose-build

- name: "📄 Render framework.yaml (trusted proxies/headers/hosts)"
  copy:
    src: "framework.yaml"
    dest: "{{ SHOPWARE_FRAMEWORK_HOST }}"
    mode: "0644"
  notify:
    - compose-up

- name: "📄 Render adminopenauth.yaml (protocols follow the internal hop's scheme)"
  stack_host_template:
    src: "adminopenauth.yaml.j2"
    dest: "{{ SHOPWARE_ADMINOPENAUTH_HOST }}"
    mode: "0644"
  notify:
    - compose-up

- name: "📄 Render shopware.yaml (SeaweedFS S3 filesystem)"
  stack_host_template:
    src: "shopware.yaml.j2"
    dest: "{{ SHOPWARE_FILESYSTEM_HOST }}"
    mode: "0644"
  when: SHOPWARE_OBJSTORE_ENABLED | bool
  notify:
    - compose-up
    - compose-build

- name: "🚿 Flush compose handlers"
  meta: flush_handlers

- name: "🔍 Resolve Shopware web hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: web
    resolve_output_prefix: SHOPWARE_WEB
    resolve_compose_cid: "{{ SHOPWARE_WEB_CONTAINER_ADDRESS }}"
    resolve_converge_retries: 120
    resolve_converge_delay: 5

- name: ⏳ Wait for Shopware HTTP endpoint
  ansible.builtin.shell: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ SHOPWARE_WEB_LOCAL_CID | quote }}
    sh -c 'timeout "$2" wget -q --spider "$1/robots.txt" || timeout "$2" wget -q --spider "$1/"'
    _ {{ SHOPWARE_API_BASE | quote }} {{ lookup('timeout', 10) | int }}
  delegate_to: "{{ SHOPWARE_WEB_HOST_NODE }}"
  register: shopware_http_ready
  changed_when: false
  retries: "{{ ((lookup('timeout', 300) | int) / 5) | round(0, 'ceil') | int }}"
  delay: 5
  until: shopware_http_ready.rc == 0

- name: "✅ Ensure admin user exists with correct password"
  ansible.builtin.include_tasks:
    file: 01_admin.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      delegate_to: "{{ SHOPWARE_WEB_HOST_NODE }}"

- name: "🔐 Install & configure the enabled admin auth plugins"
  ansible.builtin.include_tasks:
    file: 03_setup.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      delegate_to: "{{ SHOPWARE_WEB_HOST_NODE }}"

- name: "🧹 Remove the admin auth plugins that are disabled"
  ansible.builtin.include_tasks:
    file: 04_cleanup.yml
    apply:
      delegate_to: "{{ SHOPWARE_WEB_HOST_NODE }}"
