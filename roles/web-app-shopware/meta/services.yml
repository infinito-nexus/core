---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-playwright - the object store is reached only through the Flysystem amazon-s3 public/private/theme/sitemap adapters; Shopware exposes no object-browser surface to script
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
# nocheck: dynamic-flag
# nocheck: oidc
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
init:
  name: shopware-init
  # nocheck: single-replica
  replicas: 1
  cpus: 1.0
  mem_reservation: 1g
  mem_limit: 2g
  min_storage: 1GB
  pids_limit: 256
shopware:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: composer
  version: "2.11"
  custom: true
  min_storage: 278MB
  package:
    name: shopware/production
    version: 6.7.13.0
  proxy:
    service_key: web
  ports:
    internal:
      http: 8000
    local:
      http: 8060
  run_after:
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  admin_auto_redirect: false
  oidc_client:
    display_name: Keycloak
    active: true
    connect: true
    store_user_session: true
    keep_user_updated: true
    discovery_url: ""
    authorize_url: "{{ OIDC.CLIENT.AUTHORIZE_URL }}"
    internal_origin: "http://{{ lookup('container_service', 'web-app-keycloak', 'keycloak') }}:{{ lookup('config', 'web-app-keycloak', 'services.keycloak.ports.internal.http')
      }}" # nocheck: literal-protocol-lookup  container-to-container hop that must bypass the canonical URL, because cURL refuses the .onion name the tls lookup returns
    exchange_url: "{{ lookup('config', 'web-app-shopware', 'services.shopware.oidc_client.internal_origin') }}/realms/{{ OIDC.CLIENT.REALM }}/protocol/openid-connect/token"
    user_info_url: "{{ lookup('config', 'web-app-shopware', 'services.shopware.oidc_client.internal_origin') }}/realms/{{ OIDC.CLIENT.REALM }}/protocol/openid-connect/userinfo"
    client_id: "{{ OIDC.CLIENT.ID }}"
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-shopware', 'sso') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-shopware', 'native') }}"
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "2.11"
        until: 2026-11-30
php:
  image: ghcr.io/shopware/docker-base
  version: "8.3.36-caddy"
  min_storage: 295MB
  cpus: "0.5"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 512
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "8.3.36-caddy"
        until: 2026-11-30
web:
  name: shopware-web
  cpus: 1.0
  mem_reservation: 1g
  mem_limit: 2g
  ports:
    internal:
      http: 8000
  min_storage: 5GB
  pids_limit: 512
worker:
  healthcheck:
    test: ["CMD", "php", "-v"]
  name: shopware-worker
  entrypoint:
    - php
    - bin/console
    - messenger:consume
    - async
    - low_priority
    - --time-limit=300
  cpus: 1.0
  mem_reservation: 1g
  mem_limit: 2g
  min_storage: 5GB
  pids_limit: 512
scheduler:
  healthcheck:
    test: ["CMD", "php", "-v"]
  name: shopware-scheduler
  # nocheck: single-replica
  replicas: 1
  entrypoint:
    - php
    - bin/console
    - scheduled-task:run
  cpus: 0.5
  mem_reservation: 512m
  mem_limit: 1g
  min_storage: 1GB
  pids_limit: 256
# nocheck: shared
# nocheck: dynamic-flag
redis:
  bond: 1
  backup:
    disabled: true
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-redis' in group_names }}"
  image: redis
  version: 8-alpine
  cpus: 0.25
  mem_reservation: 256m
  mem_limit: 512m
  min_storage: 238MB
  pids_limit: 256
# nocheck: shared
# nocheck: dynamic-flag
opensearch:
  enabled: true # nocheck: dynamic-flag
  # nocheck: single-replica
  replicas: 1
  image: opensearchproject/opensearch
  version: 3.10.0
  name: shopware-opensearch
  ports:
    internal:
      http: 9200
  cpus: 1.0
  mem_reservation: 2g
  mem_limit: 4g
  min_storage: 1332MB
  pids_limit: 1024
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
  public: true
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "{{ ORGANIZATION }} Shop"
  bootstrap: true
  slots:
    logo:
      width: 300
      height: 60
    favicon:
      width: 96
      height: 96
    menu-logo:
      width: 34
      height: 34
      frame: true
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
