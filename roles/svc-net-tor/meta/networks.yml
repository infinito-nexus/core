---
# Tor runs with network_mode: host and has no vhost of its own, but the compose
# role contract still requires a local network entry (see
# test_compose_roles_have_local_network). Kept minimal; not used at runtime.
local:
  subnet: 192.168.74.0/24
overlay:
  modes: [swarm]
  topology: shared_net
  aliases: [tor]
  consumer:
    kind: onion_sso
    key: sso
    provider: web-app-keycloak
    provider_key: tor
