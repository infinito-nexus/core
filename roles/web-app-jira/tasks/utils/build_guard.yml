---
- name: "🔍 Look for Jira data in volume '{{ JIRA_VOLUME }}'"
  ansible.builtin.command:
    argv:
      - container
      - volume
      - ls
      - --quiet
      - --filter
      - "name=^{{ JIRA_VOLUME }}$"
  register: jira_volume_lookup
  changed_when: false

- name: "🛡️ Check the Jira data against the pinned image"
  ansible.builtin.include_tasks: "utils/build_guard_check.yml"
  when: JIRA_VOLUME in jira_volume_lookup.stdout_lines
