---
# include-gated: when: IS_STACK_HOST | bool
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: mediawiki
    resolve_output_prefix: MEDIAWIKI
    resolve_compose_cid: "{{ MEDIAWIKI_CONTAINER }}"

- name: "♻️ Reseed the extensions volume when the MediaWiki version changed"
  include_tasks:
    file: "{{ role_path }}/tasks/utils/refresh_extensions.yml"
    apply:
      delegate_to: "{{ MEDIAWIKI_HOST_NODE }}"

- name: "📂 Load extensions procedures for '{{ application_id }}'"
  include_tasks:
    file: "{{ role_path }}/tasks/02_extensions.yml"
    apply:
      delegate_to: "{{ MEDIAWIKI_HOST_NODE }}"
  when: MEDIAWIKI_EXT_ENABLED | length > 0

- name: "📂 Load update procedures for '{{ application_id }}'"
  include_tasks: "{{ role_path }}/tasks/03_install.yml"
  when: >-
    (mediawiki_extensions_refresh is changed) or
    (_role_templates_render.changed | default(false)) or
    (_install_results.changed | default(false)) or
    (_ext_composer.changed | default(false)) or
    (_vendor.changed | default(false))

- name: "🧩 Run the integration hook of every enabled addon"
  include_tasks: "{{ [role_path, 'tasks/addons', mediawiki_addon.key ~ '.yml'] | path_join }}"
  loop: "{{ MEDIAWIKI_EXT_ENABLED }}"
  loop_control:
    loop_var: mediawiki_addon
    label: "{{ mediawiki_addon.key }}"
