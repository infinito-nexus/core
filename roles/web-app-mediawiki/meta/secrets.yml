---
credentials:
  litellm_api_key:
    description: Per-consumer virtual key for the shared svc-ai-litellm gateway
    algorithm: sk_prefixed
    validation:
      min_length: 50
  secret_key:
    description: MediaWiki $wgSecretKey (hex-encoded 32 random bytes)
    algorithm: random_hex_32
    validation: ^[a-f0-9]{64}$
  logout_gate_key:
    description: "Key the logout gate presents on the MediaWiki back-channel logout receiver. The vhost keeps only its SHA-256 and refuses a request without it."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
