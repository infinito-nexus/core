---
# Matrix-deploy variant overrides for web-app-mediawiki.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — variant 1 exists so peertube, which is clearnet-only,
# has a round of its own. It carries nothing else; libretranslate moved to
# variant 2, which keeps the onion, so the MachineTranslation extension is now
# proven over it. Variant 0 pairs the onion with SSO.

- services:
    container_backup:
      enabled: true
    css:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    discourse:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    libretranslate:
      enabled: false
      shared: false
    peertube:
      enabled: false
      shared: false
    logout:
      enabled: true
      shared: true
    mariadb:
      shared: true
    matomo:
      enabled: true
      shared: true
    litellm:
      enabled: true
    sso:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    css:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    discourse:
      enabled: false
      shared: false
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    libretranslate:
      enabled: false
      shared: false
    peertube:
      enabled: true
      shared: true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    litellm:
      enabled: false
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    seaweedfs:
      enabled: false
      shared: false
    tor:
      enabled: false

- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    css:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    discourse:
      enabled: false
      shared: false
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    libretranslate:
      enabled: true
      shared: true
    peertube:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    mariadb:
      shared: true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    litellm:
      enabled: false
    sso:
      enabled: false
