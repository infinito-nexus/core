---
- name: "✅ ensure jitsi bind-mount source dirs exist (swarm needs bind source)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ JITSI_PROSODY_PLUGINS_HOST_PATH }}"
    - "{{ JITSI_PROSODY_CONFIG_HOST_PATH }}"
    - "{{ JITSI_PROSODY_CONFIG_HOST_PATH }}/conf.d"
    - "{{ [lookup('container', 'web-app-jitsi', 'directories.volumes'), 'jicofo'] | path_join }}"
    - "{{ [lookup('container', 'web-app-jitsi', 'directories.volumes'), 'jvb'] | path_join }}"
    - "{{ [lookup('container', 'web-app-jitsi', 'directories.volumes'), 'config'] | path_join }}"
    - "{{ [lookup('container', 'web-app-jitsi', 'directories.volumes'), 'config', 'nginx-custom'] | path_join }}"
    - "{{ [lookup('container', 'web-app-jitsi', 'directories.volumes'), 'transcripts'] | path_join }}"

- name: "🧹 Remove the prosody LDAP override that has no module in the image"
  ansible.builtin.file:
    path: "{{ JITSI_PROSODY_CONFIG_HOST_PATH }}/conf.d/ldap.cfg.lua"
    state: absent
  notify: compose-up

- name: "🎨 Converge the corporate design of {{ application_id }}"
  ansible.builtin.include_tasks: 02_design.yml

- name: "🚿 flush handlers so Jitsi containers start with rendered env"
  meta: flush_handlers
