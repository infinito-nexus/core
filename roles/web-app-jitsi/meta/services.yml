---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oauth2:
    origin:
      host: web
      port: 80
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag - email not used by Jitsi room flow
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "Jitsi"
  slots:
    logo:
      width: 142
      height: 64
# nocheck: dynamic-flag - gated on services.sso.enabled, not on group_names
# nocheck: playwright-service-flag - runtime DOM patch, no probe-able surface flag
javascript:
  bond: 1
  enabled: "{{ lookup('config', 'web-app-jitsi', 'services.sso.enabled') | bool }}"
  shared: "{{ lookup('config', 'web-app-jitsi', 'services.sso.enabled') | bool }}"
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
jitsi:
  bond: 1
  enabled: true
  shared: true
  healthcheck:
    flavor: tcp
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: jitsi/web
  version: "stable-11031"
  min_storage: 315MB
  # nocheck: default-placement-manager  meta/volumes.yml uses type:bind config dirs staged on the stack host; a worker-scheduled task lacks the source paths (unpinning requires migrating them to nfs-backed named volumes)
  placement: manager
  ports:
    local:
      http: 8084
      sso: 16505
      sso_onion: 16531
    public:
      media: 10000
    internal:
      http: 80
  proxy:
    service_key: web
  run_after:
    - web-app-keycloak
  lifecycle: beta
  cpus: "2.0"
  mem_reservation: 1g
  mem_limit: 3g
  pids_limit: 2048
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "stable-11031"
        until: 2026-11-30
web:
  name: jitsi-web
  cpus: "0.5"
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512
# nocheck: playwright-service-flag - internal sub-component (XMPP server, not a user-facing surface)
prosody:
  healthcheck:
    flavor: tcp
    port_key: http
  name: jitsi-prosody
  image: jitsi/prosody
  version: "stable-11031"
  ports:
    internal:
      xmpp: 5222
      component: 5347
      http: 5280
  cpus: "1.0"
  mem_reservation: 512m
  mem_limit: 1g
  pids_limit: 1024
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "stable-11031"
        until: 2026-11-30
# nocheck: playwright-service-flag - internal sub-component (conference focus)
# nocheck: image-healthcheck  XMPP component, no internal port declared
jicofo:
  name: jitsi-jicofo
  image: jitsi/jicofo
  version: "stable-11031"
  cpus: "1.0"
  mem_reservation: 512m
  mem_limit: 1g
  pids_limit: 1024
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "stable-11031"
        until: 2026-11-30
# nocheck: playwright-service-flag - internal sub-component (video bridge, media plane)
# nocheck: image-healthcheck  media bridge on UDP, no internal port declared
jvb:
  name: jitsi-jvb
  image: jitsi/jvb
  version: "stable-11031"
  cpus: "2.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 2048
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "stable-11031"
        until: 2026-11-30
# nocheck: dynamic-flag  operator switch for the JWT moderator path; vars/main.yml also requires services.sso.enabled, so the adapter never runs without Keycloak
# nocheck: dockerfile-custom  built from the upstream nordeck/jitsi-keycloak-adapter sources at `ref` on the multi-arch Deno image, because the published ghcr.io image is amd64-only and its stock context.ts issues a moderator token to every realm user
keycloak_adapter:
  enabled: false
  shared: false
  name: jitsi-keycloak-adapter
  image: denoland/deno
  version: "2.8.3"
  custom: true
  repository: https://github.com/nordeck/jitsi-keycloak-adapter.git
  ref: v20260623
  update:
    - key: ref
      type: git_tags
      repository: https://github.com/nordeck/jitsi-keycloak-adapter.git
      match: "v"
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 9000
  cpus: "0.25"
  mem_reservation: 64m
  mem_limit: 256m
  pids_limit: 128

# nocheck: playwright-service-flag
tor:
  enabled: false # nocheck: dynamic-flag
  shared: false # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
