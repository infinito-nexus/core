---
application_id: "web-app-joomla"
entity_name: "{{ application_id | entity_name }}"

JOOMLA_VERSION: "{{ lookup('config', application_id, 'services.joomla.version') }}"
JOOMLA_IMAGE: "{{ lookup('config', application_id, 'services.joomla.image') }}"
JOOMLA_CONTAINER: "{{ lookup('config', application_id, 'services.joomla.name') }}"
JOOMLA_CONTAINER_ADDRESS: "{{ lookup('container_address', application_id, entity_name) }}"
JOOMLA_DOMAINS: "{{ lookup('domains', application_id) }}"
JOOMLA_SITE_NAME: "{{ lookup('design', application_id).label }}"
JOOMLA_DB_CONNECTOR: "{{ 'pgsql' if lookup('database', application_id, 'type') == 'postgres' else 'mysqli' }}"
JOOMLA_CONFIG_FILE: "/var/www/html/configuration.php"
JOOMLA_INSTALLER_CLI_FILE: "/var/www/html/installation/joomla.php"
JOOMLA_CLI_FILE: "/var/www/html/cli/joomla.php"
JOOMLA_INIT_READY_FILE: "/var/www/html/.infinito-init.ready"

JOOMLA_ENTRYPOINT_SCRIPT_FILE: "docker-entrypoint-joomla.sh"
JOOMLA_ENTRYPOINT_SCRIPT_HOST_ABS: "{{ [ lookup('container', application_id, 'directories.volumes'), JOOMLA_ENTRYPOINT_SCRIPT_FILE ] | path_join }}"
JOOMLA_ENTRYPOINT_SCRIPT_HOST_REL: "volumes/{{ JOOMLA_ENTRYPOINT_SCRIPT_FILE }}"
JOOMLA_ENTRYPOINT_SCRIPT_DOCKER: "{{ [ '/usr/local/bin/', JOOMLA_ENTRYPOINT_SCRIPT_FILE ] | path_join }}"

JOOMLA_UPLOAD_CONFIG: "{{ [ lookup('container', application_id, 'directories.instance'), 'php-upload.ini' ] | path_join }}"
JOOMLA_UPLOAD_SIZE: "{{ lookup('config', application_id, 'services.joomla.upload.size_mb') }}"
JOOMLA_UPLOAD_MAX_FILESIZE: "{{ (JOOMLA_UPLOAD_SIZE | int) }}M"
JOOMLA_POST_MAX_SIZE: "{{ ((JOOMLA_UPLOAD_SIZE | int) * 12 // 10) }}M"
JOOMLA_PHP_MEMORY_LIMIT: "{{ lookup('service_memory_mb', application_id, entity_name, 0.5) }}M"

JOOMLA_USER_NAME: "{{ lookup('users', 'platform_administrator').username }}"
JOOMLA_USER: "{{ JOOMLA_USER_NAME | capitalize }}"
JOOMLA_USER_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
JOOMLA_USER_EMAIL: "{{ lookup('users', 'platform_administrator').email }}"
JOOMLA_WEB_USER: "www-data"

JOOMLA_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
JOOMLA_DESIGN_LOGO_ENABLED: "{{ JOOMLA_DESIGN_ENABLED | bool and lookup('design', application_id).logo is string }}"
JOOMLA_DESIGN_ASSETS_DIR: "{{ lookup('design', application_id).dest }}"
JOOMLA_DESIGN_PALETTE: "{{ lookup('design_palette', lookup('config', 'web-svc-design', 'services.design.colors.base')) }}"
JOOMLA_DESIGN_ROOT: "{{ lookup('volume', application_id, 'data').target }}"
JOOMLA_DESIGN_MEDIA: "images/infinito-design"
JOOMLA_DESIGN_COLOR_FILE: "custom_infinito"
JOOMLA_DESIGN_STYLESHEETS:
  - dest: "media/templates/administrator/atum/css/user.css"
    src: "design/atum.css.j2"
  - dest: "media/templates/site/cassiopeia/css/user.css"
    src: "design/cassiopeia.css.j2"
  - dest: "media/templates/site/cassiopeia/css/global/{{ JOOMLA_DESIGN_COLOR_FILE }}.css"
    src: "design/colors.css.j2"
JOOMLA_DESIGN_IMAGES:
  - dest: "{{ JOOMLA_DESIGN_MEDIA }}/site-brand.svg"
    src: "site-brand.svg"
  - dest: "{{ JOOMLA_DESIGN_MEDIA }}/admin-brand.svg"
    src: "admin-brand.svg"
  - dest: "{{ JOOMLA_DESIGN_MEDIA }}/admin-symbol.svg"
    src: "icon.svg"
  - dest: "{{ JOOMLA_DESIGN_MEDIA }}/admin-login.svg"
    src: "admin-login.svg"
  - dest: "media/templates/site/cassiopeia/images/joomla-favicon.svg"
    src: "icon.svg"
  - dest: "media/templates/site/cassiopeia/images/favicon.ico"
    src: "favicon.ico"
  - dest: "media/templates/administrator/atum/images/joomla-favicon.svg"
    src: "icon.svg"
  - dest: "media/templates/administrator/atum/images/favicon.ico"
    src: "favicon.ico"
JOOMLA_DESIGN_ATUM_COLORS:
  hue: "{{ JOOMLA_DESIGN_PALETTE.light['--design-frame'] }}"
  bg-light: "{{ JOOMLA_DESIGN_PALETTE.light['--design-surface-1'] }}"
  text-dark: "{{ JOOMLA_DESIGN_PALETTE.light['--design-text'] }}"
  text-light: "{{ JOOMLA_DESIGN_PALETTE.light['--design-on-frame'] }}"
  link-color: "{{ JOOMLA_DESIGN_PALETTE.light['--design-link'] }}"
  link-color-dark: "{{ JOOMLA_DESIGN_PALETTE.dark['--design-link'] }}"
  special-color: "{{ JOOMLA_DESIGN_PALETTE.light['--design-text'] }}"
JOOMLA_DESIGN_ATUM_LOGOS:
  logoBrandLarge: "{{ JOOMLA_DESIGN_MEDIA }}/admin-brand.svg"
  logoBrandLargeAlt: "{{ JOOMLA_SITE_NAME }}"
  logoBrandSmall: "{{ JOOMLA_DESIGN_MEDIA }}/admin-symbol.svg"
  logoBrandSmallAlt: "{{ JOOMLA_SITE_NAME }}"
  loginLogo: "{{ JOOMLA_DESIGN_MEDIA }}/admin-login.svg"
  loginLogoAlt: "{{ JOOMLA_SITE_NAME }}"
JOOMLA_DESIGN_CASSIOPEIA_COLORS:
  colorName: "{{ JOOMLA_DESIGN_COLOR_FILE }}"
JOOMLA_DESIGN_CASSIOPEIA_LOGOS:
  logoFile: "{{ JOOMLA_DESIGN_MEDIA }}/site-brand.svg"
JOOMLA_DESIGN_STYLES:
  atum: "{{ JOOMLA_DESIGN_ATUM_COLORS | combine(JOOMLA_DESIGN_ATUM_LOGOS if JOOMLA_DESIGN_LOGO_ENABLED | bool else {}) }}"
  cassiopeia: "{{ JOOMLA_DESIGN_CASSIOPEIA_COLORS | combine(JOOMLA_DESIGN_CASSIOPEIA_LOGOS if JOOMLA_DESIGN_LOGO_ENABLED | bool else {}) }}"
