---
# Immediately after a fresh install, `user:reset-password` can transiently
# report "The user <name> does not exist!" even though the user has been
# created and is queryable via `user:list` — observed consistently in CI.
# Joomla's CLI bootstraps a fresh session per invocation but Symfony's
# service container + autoloader warm-up plus the recent DB commit appear
# to race on first post-install invocation.
- name: "🔎 List the Joomla accounts until a Super User shows up"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ JOOMLA_LOCAL_CID | quote }}
    php "{{ JOOMLA_CLI_FILE }}" user:list --no-interaction
  register: joomla_user_list
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: false
  retries: 6
  delay: 5
  until: joomla_user_list.rc == 0 and 'Super Users' in joomla_user_list.stdout
  delegate_to: "{{ JOOMLA_HOST_NODE }}"

- name: "🧭 Decide whether the Joomla administrator is added or realigned"
  ansible.builtin.set_fact:
    joomla_admin_plan: >-
      {{ joomla_user_list.stdout | joomla_user_accounts
         | platform_admin_plan(JOOMLA_USER_NAME, JOOMLA_USER_EMAIL, 'Joomla', false) }}

- name: "➕ Add the Joomla administrator next to the existing Super Users"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec -e J_USERNAME -e J_NAME -e J_EMAIL -e J_PASSWORD {{ JOOMLA_LOCAL_CID | quote }}
    sh -lc 'php "{{ JOOMLA_CLI_FILE }}" user:add
    --username="$J_USERNAME" --name="$J_NAME" --email="$J_EMAIL"
    --password="$J_PASSWORD" --usergroup="Super Users" --no-interaction'
  environment:
    J_USERNAME: "{{ JOOMLA_USER_NAME }}"
    J_NAME: "{{ JOOMLA_USER }}"
    J_EMAIL: "{{ JOOMLA_USER_EMAIL }}"
    J_PASSWORD: "{{ JOOMLA_USER_PASSWORD }}"
  register: j_user_add
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: j_user_add.rc == 0
  failed_when: >-
    j_user_add.rc != 0
    and (j_user_add.stdout ~ j_user_add.stderr) | joomla_user_add_conflict(JOOMLA_USER_NAME, JOOMLA_USER_EMAIL) == ''
  when: joomla_admin_plan == 'create'
  delegate_to: "{{ JOOMLA_HOST_NODE }}"

- name: "🛑 Name the group-less Joomla account that user:list does not show"
  ansible.builtin.fail:
    msg: "{{ (j_user_add.stdout ~ j_user_add.stderr) | joomla_user_add_conflict(JOOMLA_USER_NAME, JOOMLA_USER_EMAIL) }}"
  when:
    - joomla_admin_plan == 'create'
    - j_user_add.rc != 0

- name: "♻️ Reset Joomla admin password (non-interactive CLI)"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec -e JOOMLA_USER_PASSWORD {{ JOOMLA_LOCAL_CID | quote }}
    sh -lc 'php "{{ JOOMLA_CLI_FILE }}"
    user:reset-password
    --username "{{ JOOMLA_USER_NAME }}"
    --password="$JOOMLA_USER_PASSWORD"'
  environment:
    JOOMLA_USER_PASSWORD: "{{ JOOMLA_USER_PASSWORD }}"
  register: j_password_reset
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: j_password_reset.rc == 0
  retries: 6
  delay: 5
  until: j_password_reset.rc == 0
  delegate_to: "{{ JOOMLA_HOST_NODE }}"
