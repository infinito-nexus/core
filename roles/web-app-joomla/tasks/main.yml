---
- name: "📂 Include role svc-stack for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: 📂 Include PHP Config tasks
  include_tasks: 01_config.yml

- name: 🚿 flush docker service
  meta: flush_handlers

- name: "👔 Joomla manager-side operations (install, assert, reset admin, OIDC plugin)"
  include_tasks: 02_manager_ops.yml
  when: IS_STACK_HOST | bool
