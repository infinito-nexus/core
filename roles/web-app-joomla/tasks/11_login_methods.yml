---
- name: "🚪 Converge the sign-in methods of {{ application_id }}"
  ansible.builtin.shell: >
    container exec -i
    --user {{ JOOMLA_WEB_USER | quote }}
    -e J_ROOT={{ JOOMLA_DOCROOT | quote }}
    -e J_LOGIN_PLUGINS={{ JOOMLA_LOGIN_PLUGINS | to_json | quote }}
    -e J_LOGIN_REGISTRATION={{ JOOMLA_LOGIN_REGISTRATION | bool | ternary('1', '0') }}
    -e J_LOGIN_2FA={{ JOOMLA_LOGIN_2FA | bool | ternary('1', '0') }}
    -e J_LOGIN_2FA_ENFORCED={{ JOOMLA_LOGIN_2FA_ENFORCED | bool | ternary('1', '0') }}
    -e J_LOGIN_2FA_ROOT_GROUP={{ JOOMLA_ROOT_USER_GROUP | quote }}
    {{ JOOMLA_LOCAL_CID | quote }} php --
  args:
    stdin: "{{ lookup('file', role_path ~ '/files/php/login_methods.php') }}"
  register: joomla_login_methods
  changed_when: (joomla_login_methods.stdout | trim) == "changed"
  failed_when: joomla_login_methods.rc != 0 or (joomla_login_methods.stdout | trim) not in ['changed', 'ok']

- name: "🧹 Clear the Joomla cache after a sign-in method change"
  ansible.builtin.shell: >
    container exec
    --user {{ JOOMLA_WEB_USER | quote }}
    {{ JOOMLA_LOCAL_CID | quote }}
    php {{ JOOMLA_CLI_FILE | quote }} cache:clean
  when: joomla_login_methods is changed
  changed_when: true
