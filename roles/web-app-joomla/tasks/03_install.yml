---
- name: "⏳ Wait for Joomla files to exist"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ JOOMLA_LOCAL_CID | quote }} test -f /var/www/html/plugins/actionlog/joomla/joomla.xml
  register: joomla_files
  changed_when: false
  retries: 60
  delay: 2
  until: joomla_files.rc == 0
  delegate_to: "{{ JOOMLA_HOST_NODE }}"

- name: "⏳ Wait for the image entrypoint to finish its own install"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ JOOMLA_LOCAL_CID | quote }}
    sh -c 'test -e {{ JOOMLA_INIT_READY_FILE }} || test -e {{ JOOMLA_CONFIG_FILE }}'
  register: joomla_entrypoint_done
  changed_when: false
  failed_when: false
  retries: 60
  delay: 5
  until: joomla_entrypoint_done.rc == 0
  delegate_to: "{{ JOOMLA_HOST_NODE }}"

- name: "🔎 Check for CLI installer"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ JOOMLA_LOCAL_CID | quote }} test -f {{ JOOMLA_INSTALLER_CLI_FILE }}
  register: has_installer
  changed_when: false
  failed_when: false
  delegate_to: "{{ JOOMLA_HOST_NODE }}"

- name: "🔎 Check if Joomla is already installed"
  shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ JOOMLA_LOCAL_CID | quote }} test -f {{ JOOMLA_CONFIG_FILE }}
  register: joomla_installed
  changed_when: false
  failed_when: false
  delegate_to: "{{ JOOMLA_HOST_NODE }}"

- name: "📦 Run the Joomla CLI installer and clear its stub"
  when:
    - joomla_installed.rc != 0
    - has_installer.rc == 0
  block:
    - name: "📦 Joomla CLI install (rm stub + install in one retry loop for image-init race)"
      ansible.builtin.command:
        argv:
          - bash
          - -lc
          - |
            set -o pipefail
            container exec {{ JOOMLA_LOCAL_CID | quote }} rm -f "{{ JOOMLA_CONFIG_FILE }}" # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
            exec container exec --user "{{ JOOMLA_WEB_USER }}" \
              -e J_CLI -e J_DB_TYPE -e J_DB_HOST -e J_DB_USER -e J_DB_PASSWORD \
              -e J_DB_NAME -e J_ADMIN_USER -e J_ADMIN_USERNAME -e J_ADMIN_PASSWORD \
              -e J_ADMIN_EMAIL -e J_SITE_NAME \
              {{ JOOMLA_LOCAL_CID | quote }} sh -lc '
                php "$J_CLI" install \
                  "--db-type=$J_DB_TYPE" \
                  "--db-host=$J_DB_HOST" \
                  "--db-user=$J_DB_USER" \
                  "--db-pass=$J_DB_PASSWORD" \
                  "--db-name=$J_DB_NAME" \
                  "--admin-user=$J_ADMIN_USER" \
                  "--admin-username=$J_ADMIN_USERNAME" \
                  "--admin-password=$J_ADMIN_PASSWORD" \
                  "--admin-email=$J_ADMIN_EMAIL" \
                  --no-interaction \
                  "--site-name=$J_SITE_NAME"'
      environment:
        J_CLI: "{{ JOOMLA_INSTALLER_CLI_FILE }}"
        J_DB_TYPE: "{{ JOOMLA_DB_CONNECTOR }}"
        J_DB_HOST: "{{ lookup('database', application_id, 'host') }}"
        J_DB_USER: "{{ lookup('database', application_id, 'username') }}"
        J_DB_PASSWORD: "{{ lookup('database', application_id, 'password') }}"
        J_DB_NAME: "{{ lookup('database', application_id, 'name') }}"
        J_ADMIN_USER: "{{ JOOMLA_USER }}"
        J_ADMIN_USERNAME: "{{ JOOMLA_USER_NAME }}"
        J_ADMIN_PASSWORD: "{{ JOOMLA_USER_PASSWORD }}"
        J_ADMIN_EMAIL: "{{ JOOMLA_USER_EMAIL }}"
        J_SITE_NAME: "{{ JOOMLA_SITE_NAME }}"
      register: j_install
      retries: 5
      delay: 5
      vars:
        _joomla_install_soft_success: >-
          {{
            j_install.rc == 0
            or (j_install.stdout | default('') is search('Unable to delete installation folder'))
            or (j_install.stderr | default('') is search('deleteInstallationFolder'))
          }}
        _joomla_install_git_tree_refusal: >-
          {{ j_install.stdout | default('') is search('trying to run Joomla! from our git repository') }}
      until: _joomla_install_soft_success | bool
      changed_when: _joomla_install_soft_success | bool
      failed_when: >-
        (
          j_install.rc is defined
          and j_install.rc != 0
          and not (_joomla_install_soft_success | bool)
        )
        or (_joomla_install_git_tree_refusal | bool)
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      delegate_to: "{{ JOOMLA_HOST_NODE }}"

    - name: "💪 Force-remove installation folder (root)"
      shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
        container exec {{ JOOMLA_LOCAL_CID | quote }} rm -rf /var/www/html/installation
      changed_when: false
      delegate_to: "{{ JOOMLA_HOST_NODE }}"
