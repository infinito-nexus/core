---
- name: "🔑 Realign the password Joomla persisted in its config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "joomla_data"
    patch_config_rel: "configuration.php"
    patch_expression: "s|(public \\$password\\s*=\\s*')[^']*(';)|\\1@PASSWORD@\\2|"
