---
home:
  type: volume
  name: ejabberd_home
  backup: false
  # nocheck: nfs-false-data-loss  Reason: carries only what the image seeds into /opt/ejabberd - the bin symlink, the ejabberd-contrib sources and the erlang cookie ejabberdctl regenerates; every path holding deployment state is a child volume of its own, and a fresh node reseeds this one from the image
  nfs: false
  mounts:
    - service: ejabberd
      target: /opt/ejabberd
data:
  type: volume
  name: ejabberd_data
  nfs:
    uid: "9000"
    gid: "9000"
    mode: "0770"
  mounts:
    - service: ejabberd
      target: /opt/ejabberd/database
conf:
  type: volume
  name: ejabberd_conf
  nfs:
    uid: "9000"
    gid: "9000"
    mode: "0770"
  mounts:
    - service: ejabberd
      target: /opt/ejabberd/conf
upload:
  type: volume
  name: ejabberd_upload
  backup: false
  nfs:
    uid: "9000"
    gid: "9000"
    mode: "0770"
  mounts:
    - service: ejabberd
      target: /opt/ejabberd/upload
logs:
  type: volume
  name: ejabberd_logs
  nfs:
    uid: "9000"
    gid: "9000"
    mode: "0770"
  mounts:
    - service: ejabberd
      target: /opt/ejabberd/logs
ejabberd_yml:
  type: config
  source: "{{ [lookup('container', 'web-svc-xmpp', 'directories.instance'), 'ejabberd.yml'] | path_join }}"
  mode: "0444"
  mounts:
    - service: ejabberd
      target: /opt/ejabberd/conf/ejabberd.yml
