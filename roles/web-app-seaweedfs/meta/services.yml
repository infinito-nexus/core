---
# nocheck: seaweedfs-playwright — the console stores no objects of its own; this flag exists to join
# the engine's shared_net (meta/networks.yml consumer key), and files/playwright/test-storage-buckets.js
# already asserts every consumer bucket through the filer it serves.
# nocheck: playwright-service-flag — engine provider, covered by the web-svc-seaweedfs CLI test
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oauth2:
    origin:
      host: seaweedfs-console
      port: "80"
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-seaweedfs', role='administrator') }}"
# nocheck: dynamic-flag — LDAP is disabled for this role; the literal false is intentional, not group-gated.
ldap:
  enabled: false
  shared: false
# nocheck: variants-coverage — the onion gate is a hard invariant; no variant may force this consumer on a tor node.
# nocheck: bond-baseline — same reason: variant 0 must not pin this consumer on.
logout:
  bond: 1
  enabled: "{{ ('web-svc-logout' in group_names) and ('svc-net-tor' not in group_names) }}"
  shared: "{{ ('web-svc-logout' in group_names) and ('svc-net-tor' not in group_names) }}"
# nocheck: variants-coverage — the onion gate is a hard invariant; no variant may force this consumer on a tor node.
# nocheck: bond-baseline — same reason: variant 0 must not pin this consumer on.
dashboard:
  bond: 1
  enabled: "{{ ('web-app-dashboard' in group_names) and ('svc-net-tor' not in group_names) }}"
  shared: "{{ ('web-app-dashboard' in group_names) and ('svc-net-tor' not in group_names) }}"
# nocheck: variants-coverage — the onion gate is a hard invariant; no variant may force this consumer on a tor node.
# nocheck: bond-baseline — same reason: variant 0 must not pin this consumer on.
prometheus:
  bond: 1
  enabled: "{{ ('web-app-prometheus' in group_names) and ('svc-net-tor' not in group_names) }}"
  shared: "{{ ('web-app-prometheus' in group_names) and ('svc-net-tor' not in group_names) }}"
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: image-healthcheck  no internal port declared, so no probe can address it
# nocheck: dynamic-flag — the role's own console container, not a partner integration.
# nocheck: playwright-service-flag — self-provider
seaweedfs-console:
  name: seaweedfs-console
  image: nginx
  version: 1.31-alpine
  enabled: true
  shared: false
  domains:
    - filer
    - master
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  ports:
    local:
      sso: 16507
    internal:
      http: 80
  healthcheck:
    flavor: http
  min_storage: 128MB
  cpus: "0.2"
  mem_reservation: 64m
  mem_limit: 128m
  pids_limit: 128
  run_after:
    - web-svc-seaweedfs
    - web-app-keycloak
  lifecycle: beta
