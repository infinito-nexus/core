---
# nocheck: sso-variant-tor — meta/services.yml gates sso on
# lookup('network_served', 'clearnet'): the frontend is off on a tor-only node by design, so
# there is no SSO-over-onion flow to exercise.
- services:
    container_backup:
      enabled: true
    sso:
      enabled: "{{ lookup('network_served', 'clearnet') }}"
      shared: "{{ lookup('network_served', 'clearnet') }}"
    logout:
      enabled: "{{ lookup('network_served', 'clearnet') }}"
      shared: "{{ lookup('network_served', 'clearnet') }}"
    dashboard:
      enabled: "{{ lookup('network_served', 'clearnet') }}"
      shared: "{{ lookup('network_served', 'clearnet') }}"
    prometheus:
      enabled: "{{ lookup('network_served', 'clearnet') }}"
      shared: "{{ lookup('network_served', 'clearnet') }}"
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
