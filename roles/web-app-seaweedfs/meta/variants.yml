---
- services:
    seaweedfs:
      enabled: true
      shared: true
    sso:
      enabled: "{{ 'svc-net-tor' not in group_names }}"
      shared: "{{ 'svc-net-tor' not in group_names }}"
    logout:
      enabled: "{{ 'svc-net-tor' not in group_names }}"
      shared: "{{ 'svc-net-tor' not in group_names }}"
    dashboard:
      enabled: "{{ 'svc-net-tor' not in group_names }}"
      shared: "{{ 'svc-net-tor' not in group_names }}"
    prometheus:
      enabled: "{{ 'svc-net-tor' not in group_names }}"
      shared: "{{ 'svc-net-tor' not in group_names }}"
    design:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    seaweedfs:
      enabled: false
      shared: false
    sso:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    design:
      enabled: false
      shared: false
    tor:
      enabled: true
