---
- include_tasks: utils/once/flag.yml

- name: "🧩 For '{{ application_id }}': load docker and compose"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: "✅ Ensure volumes directory exists"
  ansible.builtin.file:
    path: "{{ lookup('container', application_id, 'directories.volumes') }}"
    state: directory
    mode: "0755"

- name: "📄 Render the console proxy nginx config"
  stack_host_template:
    src: nginx.conf.j2
    dest: "{{ SEAWEEDFS_NGINX_CONF_PATH }}"
  notify: compose-up

- name: "▶️ Start the SeaweedFS console stack"
  ansible.builtin.meta: flush_handlers

- name: "📂 Include role svc-stack for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml
