---
application_id: "web-app-seaweedfs"
entity_name: seaweedfs-console

SEAWEEDFS_ENGINE_ID: "web-svc-seaweedfs"
SEAWEEDFS_ENGINE_HOST: "{{ lookup('config', SEAWEEDFS_ENGINE_ID, 'services.seaweedfs.name') }}"

SEAWEEDFS_ENGINE_FILER_PORT: "{{ lookup('config', SEAWEEDFS_ENGINE_ID, 'services.seaweedfs.ports.internal.filer') }}"
SEAWEEDFS_ENGINE_MASTER_PORT: "{{ lookup('config', SEAWEEDFS_ENGINE_ID, 'services.seaweedfs.ports.internal.master') }}"

SEAWEEDFS_CONSOLE_CONTAINER: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.name') }}"
SEAWEEDFS_SSO_PORT_PUBLIC: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.ports.local.sso') }}"

SEAWEEDFS_FILER_DOMAIN: "{{ lookup('domains', application_id).filer }}"
SEAWEEDFS_MASTER_DOMAIN: "{{ lookup('domains', application_id).master }}"

SEAWEEDFS_NGINX_CONF_PATH: "{{ [ lookup('container', application_id, 'directories.volumes'), 'nginx.conf' ] | path_join }}"
