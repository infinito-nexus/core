---
application_id: "svc-net-wireguard"

WIREGUARD_CONFIG_DIR: "/etc/wireguard"

# Rationale: the meshes this host belongs to, already resolved by
# cli.administration.inventory.mesh. The role never plans a mesh; it renders
# what the inventory was handed, so a host can only configure peers the single
# cross-host writer agreed on.
WIREGUARD_HOST_MESHES: "{{ lookup('config', application_id, 'meshes', {}) }}"

# Rationale: meta/meshes.yml declares every mesh so the inventory validator
# accepts the generated block, which means a host sees all of them whether or
# not it is a member. Only an entry the writer filled in has an address, so
# that is what separates a real membership from the declared shape.
WIREGUARD_ACTIVE_MESHES: >-
  {{ WIREGUARD_HOST_MESHES | dict2items
     | selectattr('value.address') | items2dict }}

WIREGUARD_MESH_NAMES: "{{ WIREGUARD_ACTIVE_MESHES.keys() | list | sort }}"

# Rationale: only a spoke can prove a handshake. The hub never initiates, so it
# would be waiting on peers that have not been deployed yet.
WIREGUARD_SPOKE_MESH_NAMES: >-
  {{ WIREGUARD_ACTIVE_MESHES | dict2items
     | rejectattr('value.is_hub')
     | map(attribute='key') | list | sort }}

WIREGUARD_PING_BINARY: "/bin/ping"

WIREGUARD_PRIVATE_KEY: "{{ lookup('config', application_id, 'secrets.credentials.mesh_private_key', '') }}"

# Rationale: the hub is the only member with peers in both planes, so it is the
# only host that has to forward between them.
WIREGUARD_IS_HUB: >-
  {{ WIREGUARD_ACTIVE_MESHES.values() | map(attribute='is_hub') | select | list | length > 0 }}

# Rationale: only the peers this host can actually initiate to, which in
# hub-and-spoke means the hub. A spoke carries the hub's Endpoint; the hub
# carries none for its spokes and learns their addresses when they dial in, so
# a hub that gated on reaching its spokes would be racing them. The backup host
# makes that unarguable: it is deployed in a later play, so its interface
# cannot exist while the cluster play runs.
#
# Nothing is lost. A spoke that cannot reach the hub is exactly the broken mesh
# this gate exists to catch, and the hub's own view converges as spokes arrive.
WIREGUARD_EXPECTED_PEERS: >-
  {{ WIREGUARD_ACTIVE_MESHES.values()
     | map(attribute='peers')
     | flatten
     | selectattr('is_hub')
     | map(attribute='address')
     | list }}

WIREGUARD_HEADER_BYTES: 60
WIREGUARD_VXLAN_HEADER_BYTES: 50

WIREGUARD_PMTU_TARGETS: >-
  {{ (WIREGUARD_ACTIVE_MESHES.values()
      | map(attribute='peers') | flatten
      | selectattr('is_hub')
      | map(attribute='host') | list)
     | default(NETWORK_PUBLIC_DNS_RESOLVERS, true) }}
