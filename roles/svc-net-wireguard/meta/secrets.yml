---
credentials:
  mesh_private_key:
    description: Curve25519 private key identifying this host on every mesh it belongs to, minted by cli.administration.inventory.mesh rather than by the
      per-host credential generator, because its public half has to appear in a different host's peer list. Declared plain so the generator leaves it to that
      cross-host pass.
    algorithm: plain
    validation: non_empty_string
    rotatable: false
