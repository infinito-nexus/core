---
- name: 📂 Include dependency 'sys-svc-webserver-https'
  include_role:
    name: sys-svc-webserver-https
  when: run_once_sys_svc_webserver_https is not defined

- name: "📥 Load Alias integration"
  include_tasks: "utils/load/app.yml"
  vars:
    load_app_id: web-opt-rdr-domains
  when: CURRENT_PLAY_REDIRECT_DOMAINS | length > 0

- include_tasks: utils/once/flag.yml
