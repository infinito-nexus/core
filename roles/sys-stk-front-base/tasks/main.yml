---
- name: "🥾 Prepare the frontend base of this host once"
  include_tasks: once.yml
  when: run_once_sys_stk_front_base is not defined

- include_tasks: "01_cloudflare.yml"
  when:
    - DNS_PROVIDER == "cloudflare"
    - (domain | network_of) == 'clearnet'

- name: "🎛️ Reinitialize OpenResty Handler"
  include_tasks: utils/load/handlers.yml
  vars:
    handler_role_name: "svc-prx-openresty"
