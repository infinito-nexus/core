---
# nocheck: run-once  runs once per vhost of a caller that does not write the body_filter Lua itself.
- name: "📂 Build the injection for '{{ domain }}'"
  ansible.builtin.include_tasks: main.yml

- name: "📄 Render body_filter Lua for '{{ domain }}'"
  stack_host_template:
    src: body_filter.lua.j2
    dest: "{{ lookup('nginx', 'files.lua', domain) }}"
    mode: "0644"
  notify: reload-openresty
