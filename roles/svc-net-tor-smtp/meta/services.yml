---
# nocheck: garbage-collector-required  host network configuration; holds no growing application data
# nocheck: dockerfile-custom
# nocheck: playwright-service-flag — SMTP egress daemon, no browser surface
tor-smtp: # nocheck: category-modes
  primary: true
  bond: 1
  enabled: true
  shared: true
  custom: true
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  relay of Stalwart, the manager-pinned mail edge, so the mail it carries stays on the manager tier; Tor does not pin it, as it dials the SOCKS listener of its own node and every node runs one
  placement: manager
  image: python
  version: 3.15-slim
  name: tor-smtp
  ports:
    internal:
      smtp: 1525
  healthcheck:
    test: ["CMD", "python", "-c", "import os,socket; socket.create_connection(('127.0.0.1', int(os.environ['TOR_SMTP_LISTEN_PORT'])), 3).close()"]
  min_storage: 100MB
  cpus: "0.25"
  mem_reservation: 64m
  mem_limit: 128m
  pids_limit: 64
  lifecycle: alpha

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started
