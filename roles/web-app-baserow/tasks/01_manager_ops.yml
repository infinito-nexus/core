---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ BASEROW_SERVICE_NAME }}"
    resolve_output_prefix: BASEROW
    resolve_compose_cid: "{{ BASEROW_CONTAINER }}"

- name: "▶️ Run Baserow Django migrations before bootstrapping users"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - -e
      - "DJANGO_SETTINGS_MODULE={{ BASEROW_DJANGO_SETTINGS_MODULE }}"
      - "{{ BASEROW_LOCAL_CID }}" # nocheck: container-exec-resolver  BASEROW_LOCAL_CID resolved at delegate_to runtime
      - "{{ BASEROW_PYTHON }}"
      - "{{ BASEROW_MANAGE_PY }}"
      - locked_migrate
      - --noinput
  register: baserow_migrate_result
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: >
    'No migrations to apply' not in
    ((baserow_migrate_result.stdout | default('')) ~ (baserow_migrate_result.stderr | default('')))
  failed_when: baserow_migrate_result.rc != 0
  timeout: "{{ lookup('timeout', 600) | int }}"
  retries: 60
  delay: 5
  until: baserow_migrate_result.rc == 0
  delegate_to: "{{ BASEROW_HOST_NODE }}"
  run_once: true

- name: "🔄 Restart Baserow once the migrations changed something"
  when: baserow_migrate_result.changed
  block:
    - name: "🔄 Restart Baserow application after applying migrations (compose mode)"
      ansible.builtin.command: "container restart {{ BASEROW_LOCAL_CID | quote }}" # nocheck: container-exec-resolver  runtime-resolved CID
      register: baserow_restart_after_migrate
      changed_when: baserow_restart_after_migrate.rc == 0
      when: IS_COMPOSE_MODE

    - name: "🔄 Restart Baserow application after applying migrations (swarm mode)"
      ansible.builtin.command: "container service update --force {{ lookup('container_service', application_id, BASEROW_SERVICE_NAME) }}"
      register: baserow_swarm_restart
      changed_when: baserow_swarm_restart.rc == 0
      timeout: "{{ lookup('timeout', 600) | int }}"
      when: IS_SWARM_MODE

    - name: "🔍 Re-resolve the container the restart replaced"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
      vars:
        resolve_service_key: "{{ BASEROW_SERVICE_NAME }}"
        resolve_output_prefix: BASEROW
        resolve_compose_cid: "{{ BASEROW_CONTAINER }}"

- name: "🎬 Bootstrap Baserow superuser '{{ BASEROW_BOOTSTRAP_ADMIN_USERNAME }}'"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  BASEROW_LOCAL_CID resolved at delegate_to runtime, run_once on the hosting node
      IFS= read -r BOOTSTRAP_ADMIN_PASSWORD || :; : "${BOOTSTRAP_ADMIN_PASSWORD:?arrived empty on stdin}" && export BOOTSTRAP_ADMIN_PASSWORD && container exec -i
      -e DJANGO_SETTINGS_MODULE={{ BASEROW_DJANGO_SETTINGS_MODULE | quote }}
      -e BOOTSTRAP_ADMIN_USERNAME={{ BASEROW_BOOTSTRAP_ADMIN_USERNAME | quote }}
      -e BOOTSTRAP_ADMIN_EMAIL={{ BASEROW_BOOTSTRAP_ADMIN_EMAIL | quote }}
      -e BOOTSTRAP_ADMIN_PASSWORD
      {{ BASEROW_LOCAL_CID | quote }}
      {{ BASEROW_PYTHON | quote }} {{ BASEROW_MANAGE_PY | quote }} shell
      -c {{ lookup('file', role_path ~ '/files/python/bootstrap_admin.py') | quote }}
    stdin: "{{ BASEROW_BOOTSTRAP_ADMIN_PASSWORD }}"
  register: baserow_bootstrap_admin_result
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: "'BOOTSTRAP_STATE=changed' in baserow_bootstrap_admin_result.stdout"
  failed_when: baserow_bootstrap_admin_result.rc != 0
  timeout: "{{ lookup('timeout', 600) | int }}"
  retries: 60
  delay: 5
  until: baserow_bootstrap_admin_result.rc == 0
  delegate_to: "{{ BASEROW_HOST_NODE }}"
  run_once: true

- name: "🔗 Bind the existing Baserow accounts to their Keycloak username"
  when: BASEROW_SSO_PROXY_GATED | bool
  block:
    - name: "🔑 Read the Keycloak directory users"
      ansible.builtin.include_role:
        name: web-app-keycloak
        tasks_from: utils/directory_users.yml
      vars:
        keycloak_directory_usernames: []

    - name: "🔗 Store the SSO subject of each account matching a verified Keycloak email"
      ansible.builtin.command:
        argv:
          - container
          - exec
          - -i
          - -e
          - "DJANGO_SETTINGS_MODULE={{ BASEROW_DJANGO_SETTINGS_MODULE }}"
          - -e
          - "BOOTSTRAP_ADMIN_USERNAME={{ BASEROW_BOOTSTRAP_ADMIN_USERNAME }}"
          - -e
          - "BOOTSTRAP_ADMIN_EMAIL={{ BASEROW_BOOTSTRAP_ADMIN_EMAIL }}"
          - -e
          - BASEROW_SSO_DIRECTORY_USERS
          - "{{ BASEROW_LOCAL_CID }}" # nocheck: container-exec-resolver  BASEROW_LOCAL_CID resolved at delegate_to runtime
          - "{{ BASEROW_PYTHON }}"
          - "{{ BASEROW_MANAGE_PY }}"
          - shell
          - -c
          - "{{ lookup('file', role_path ~ '/files/python/bind_sso_subjects.py') }}"
      environment:
        BASEROW_SSO_DIRECTORY_USERS: "{{ keycloak_directory_users | to_json }}"
      register: baserow_sso_subjects
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      changed_when: "'BIND_STATE=changed' in baserow_sso_subjects.stdout"
      delegate_to: "{{ BASEROW_HOST_NODE }}"
      run_once: true

    - name: "📋 Report the accounts left unbound"
      ansible.builtin.debug:
        msg: "{{ baserow_sso_subjects.stdout_lines | select('match', '^skipped ') | list }}"
      when: baserow_sso_subjects.stdout_lines | select('match', '^skipped ') | list | length > 0
