---
credentials:
  secret_key:
    description: Django SECRET_KEY for Baserow
    algorithm: alphanumeric
    validation:
      min_length: 50
  mcp_bearer:
    description: Bearer an MCP client presents to the Baserow adapter sidecar. Distinct from the endpoint key the sidecar presents upstream, because reaching
      Baserow says nothing about who called the adapter.
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
  mcp_endpoint_key:
    description: URL-path secret of the MCP endpoint, stored in MCPEndpoint.key (varchar 32)
    algorithm: random_hex_16
    validation: "^[a-f0-9]{32}$"
