---
# nocheck: variant-limit — variants 2 and 3 carry the identity, mail and monitoring
# children and the AI children at full weight, so variant 0 can pin them light and
# fit the CI job cap without losing a child variant pair.
# nocheck: variants-duplicate — variants 0 and 3 differ only in their variant pins,
# which hold the AI children light in variant 0 and at full weight in variant 3.
# Matrix-deploy variant overrides for this role. The SSO variant rides the
# `web-app-keycloak` SSO-proxy sidecar (flavor: oauth2) in front of Baserow.

# variant 0: OIDC variant (canonical default).

- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: true
    # variant-pin: web-app-dashboard#1
    dashboard:
      enabled: true
      shared: true
    # variant-pin: web-app-stalwart#1
    email:
      enabled: true
      shared: true
    # variant-pin: web-svc-logout#1
    logout:
      enabled: true
      shared: true
    # variant-pin: web-app-matomo#1
    matomo:
      enabled: true
      shared: true
    # variant-pin: web-app-keycloak#1
    sso:
      enabled: true
      shared: true
    postgres:
      shared: true
    redis:
      shared: true
    # variant-pin: web-app-prometheus#2
    prometheus:
      enabled: true
      shared: true
    # variant-pin: web-svc-seaweedfs#1
    seaweedfs:
      enabled: true
      shared: true
    # variant-pin: web-svc-design#1
    design:
      enabled: true
      shared: true
    tor:
      enabled: true
    # variant-pin: web-app-openwebui#1
    openwebui:
      enabled: true
      shared: true
    # variant-pin: web-app-hermes#1
    hermes:
      enabled: true
      shared: true
    # variant-pin: web-app-openclaw#1
    openclaw:
      enabled: true
      shared: true
- services:
    docs:
      enabled: true
      shared: true
    container_backup:
