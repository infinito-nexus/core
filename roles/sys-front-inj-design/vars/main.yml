---
# Constants
CSS_FILES: ["layer.css", "default.css", "bootstrap.css"]
CSS_BASE_COLOR: "{{ lookup('config', 'web-svc-design', 'services.design.colors.base') }}"
CSS_FONT: "{{ lookup('config', 'web-svc-design', 'services.design.font') }}"

# Variables
css_app_label: "{{ lookup('domains', application_id) | vhost_label(domain) }}"
# The label leads the name: Playwright specs find the role sheet by `[href*='style.css']`.
css_app_file: "{{ (css_app_label ~ '-' if css_app_label else '') ~ 'style.css' }}"
css_app_dst: "{{ [lookup('cdn', application_id).role.release.css, css_app_file] | path_join }}"
