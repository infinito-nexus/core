---
- name: "🎨 Render the design files of '{{ application_id }}'"
  include_tasks: main.yml

- name: "🔍 Resolve optional design script of '{{ application_id }}' for '{{ domain }}'"
  vars:
    _design_js_src: >-
      {{ lookup('first_found', {
           'files': ['templates/design.js.j2','templates/design.js'],
           'paths': [lookup('path_absolute', 'roles', application_id)]
         }, errors='ignore') | default('', true) }}
    _design_compose_src: "{{ lookup('path_absolute', 'roles', 'sys-front-inj-design', 'templates', 'js', 'design.js.j2') }}"
    _design_config_src: "{{ lookup('path_absolute', 'roles', 'sys-front-inj-design', 'templates', 'js', 'design-config.json.j2') }}"
    design_body_js: "{{ (lookup('template_shallow', _design_js_src) | trim) if _design_js_src | length > 0 else '' }}"
    _design_js: >-
      {{ (lookup('template_shallow', _design_compose_src, template_vars={'design_body_js': design_body_js}) | trim)
         if 'INFINITO_DESIGN' in design_body_js else design_body_js }}
  set_fact:
    design_config_json: "{{ (lookup('template_shallow', _design_config_src) | trim) if 'INFINITO_DESIGN' in design_body_js else '' }}"
    design_js_one_liner: "{{ _design_js | to_one_liner }}"

- name: "➕ Append design script CSP hash for '{{ domain }}'"
  when: design_js_one_liner | length > 0
  set_fact:
    webserver_csp_hashes_extra_by_vhost: >-
      {{ webserver_csp_hashes_extra_by_vhost
         | add_csp_hash(domain, 'script-src-elem', design_js_one_liner) }}
  changed_when: false
