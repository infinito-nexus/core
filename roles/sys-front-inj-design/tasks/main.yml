---
- include_tasks: 00_core.yml
  when: run_once_sys_front_inj_design is not defined

- name: "🔍 Resolve optional app style.css source for '{{ application_id }}'"
  vars:
    app_role_dir: "{{ lookup('path_absolute', 'roles', application_id) }}"
    _app_style_src: >-
      {{ lookup('first_found', {
           'files': ['templates/style.css.j2','files/style.css'],
           'paths': [app_role_dir]
         }, errors='ignore') | default('', true) }}
    _app_logo_src: >-
      {{ lookup('first_found', {
           'files': ['files/logo.css'],
           'paths': [app_role_dir]
         }, errors='ignore') | default('', true) }}
    _app_cosmos_src: >-
      {{ (lookup('first_found', {
            'files': ['templates/cosmos.css.j2'],
            'paths': [app_role_dir]
          }, errors='ignore') | default('', true))
         if lookup('design', application_id).cosmos_sheet else '' }}
    app_body_css: "{{ (lookup('template_shallow', _app_style_src) | trim) if _app_style_src | length > 0 else '' }}"
    app_logo_css: "{{ (lookup('template_shallow', _app_logo_src) | trim) if _app_logo_src | length > 0 else '' }}"
    app_cosmos_css: "{{ (lookup('template_shallow', _app_cosmos_src) | trim) if _app_cosmos_src | length > 0 else '' }}"
    _app_compose_src: "{{ lookup('path_absolute', 'roles', 'sys-front-inj-design', 'templates', 'css', 'app.css.j2') }}"
    _cdn_root: "{{ lookup('cdn', application_id).urls.root }}"
    _cdn_origin: "{{ _cdn_root | urlsplit('scheme') }}://{{ _cdn_root | urlsplit('netloc') }}/"
    _app_style_css: >-
      {{ (lookup('template_shallow', _app_compose_src,
                 template_vars={'app_body_css': app_body_css, 'app_logo_css': app_logo_css, 'app_cosmos_css': app_cosmos_css})
          | trim | replace(_cdn_origin, '/'))
         if (app_body_css ~ app_logo_css ~ app_cosmos_css) | length > 0 else '' }}
  set_fact:
    app_style_src: "{{ _app_style_src }}"
    app_style_file: "{{ css_app_file }}"
    app_style_css: "{{ _app_style_css }}"
    app_style_present: "{{ (app_body_css ~ app_logo_css ~ app_cosmos_css) | length > 0 }}"

- name: "🚀 Deploy per-app '{{ app_style_src }}' to '{{ css_app_dst }}'"
  when:
    - app_style_present | bool
    - design_css_states.get(css_app_state_key) != css_app_state
  stack_host_copy:
    content: "{{ app_style_css }}"
    dest: "{{ css_app_dst }}"
    mode: "0644"

- name: "🧹 Remove the per-app stylesheet '{{ css_app_dst }}' a role no longer ships"
  when:
    - not (app_style_present | bool)
    - IS_STACK_HOST | bool
    - design_css_states.get(css_app_state_key) != css_app_state
  ansible.builtin.file:
    path: "{{ css_app_dst }}"
    state: absent

- name: "🖼️ Publish corporate branding assets of '{{ application_id }}' on the CDN"
  include_tasks: assets.yml
  when: application_id not in design_assets_published
  vars:
    design_assets_dest: "{{ lookup('design', application_id).dest }}"

- name: "📒 Record the stylesheet state of '{{ application_id }}'"
  set_fact:
    design_css_states: "{{ design_css_states | combine({css_app_state_key: css_app_state}) }}"
