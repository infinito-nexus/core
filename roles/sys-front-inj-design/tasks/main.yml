---
- include_tasks: 00_core.yml
  when: run_once_sys_front_inj_design is not defined

- name: "🔍 Resolve optional app style.css source for '{{ application_id }}'"
  vars:
    app_role_dir: "{{ lookup('path_absolute', 'roles', application_id) }}"
    _app_style_src: >-
      {{ lookup('first_found', {
           'files': ['templates/style.css.j2','files/style.css'],
           'paths': [app_role_dir]
         }, errors='ignore') | default('', true) }}
    _app_style_css: "{{ (lookup('template', _app_style_src) | trim) if _app_style_src | length > 0 else '' }}"
  set_fact:
    app_style_src: "{{ _app_style_src }}"
    app_style_css: "{{ _app_style_css }}"
    app_style_present: "{{ _app_style_css | length > 0 }}"

- name: "🚀 Deploy per-app '{{ app_style_src }}' to '{{ css_app_dst }}'"
  when: app_style_present | bool
  copy:
    content: "{{ app_style_css }}"
    dest: "{{ css_app_dst }}"
    mode: "0644"

- name: "🧹 Remove the per-app stylesheet '{{ css_app_dst }}' a role no longer ships"
  when: not (app_style_present | bool)
  ansible.builtin.file:
    path: "{{ css_app_dst }}"
    state: absent

- name: "🖼️ Publish corporate branding assets of '{{ application_id }}' on the CDN"
  include_tasks: assets.yml
  vars:
    design_assets_dest: "{{ lookup('design', application_id).dest }}"

- name: "🔍 Resolve optional design script for '{{ application_id }}'"
  vars:
    _design_js_src: >-
      {{ lookup('first_found', {
           'files': ['templates/design.js.j2'],
           'paths': [lookup('path_absolute', 'roles', application_id)]
         }, errors='ignore') | default('', true) }}
    _design_js: "{{ (lookup('template', _design_js_src) | trim) if _design_js_src | length > 0 else '' }}"
  set_fact:
    design_js_one_liner: "{{ (_design_js | to_one_liner) if _design_js | length > 0 else '' }}"

- name: "➕ Append design script CSP hash for '{{ application_id }}'"
  when: design_js_one_liner | length > 0
  set_fact:
    webserver_csp_hashes_extra_by_app: >-
      {{ webserver_csp_hashes_extra_by_app | default({})
         | add_csp_hash(application_id, 'script-src-elem', design_js_one_liner) }}
  changed_when: false
