---
- include_tasks: utils/once/flag.yml

- name: "🛑 Refuse a host that also runs the identity, gateway or vault role"
  ansible.builtin.assert:
    that:
      - (PROXMOX_COHOSTED_PEERS | length == 0) or (PROXMOX_SHARED_HOST | bool)
    fail_msg: >-
      {{ inventory_hostname }} also runs {{ PROXMOX_COHOSTED_PEERS | join(', ') }}.
      A VM escape out of Proxmox VE would land next to the identity provider,
      the model gateway keys or the vault. Move web-app-proxmox to its own
      host, or accept the shared host by setting
      applications.web-app-proxmox.services.proxmox.shared_host to true.
    quiet: true

- name: "🛑 Refuse to serve the hypervisor UI without the SSO group gate"
  ansible.builtin.assert:
    that:
      - PROXMOX_SSO_ENABLED | bool
    fail_msg: >-
      services.sso.enabled resolves to false for {{ inventory_hostname }}: no
      web-app-keycloak host is in the inventory, so no OAuth2 proxy would stand
      in front of the Proxmox VE web UI. Deploy web-app-keycloak in the same
      inventory first.
    quiet: true

- name: "🛑 Refuse to publish the hypervisor UI on an onion address"
  ansible.builtin.assert:
    that:
      - not (PROXMOX_TOR_ENABLED | bool)
    fail_msg: >-
      services.tor.enabled resolves to true for {{ inventory_hostname }}: the
      Proxmox VE web UI would get an onion address outside the front proxy's
      clearnet gate. Set applications.web-app-proxmox.services.tor.enabled to
      false for this host.
    quiet: true

- name: "🛡️ Prove hardware virtualization for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-virt-kata/tasks/utils/assert/kvm.yml') }}"
  vars:
    assert_kvm_consumer: "{{ application_id }}"

- name: "🧩 Load docker and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "🔍 Read where the container engine keeps the VM disk volume"
  ansible.builtin.command: >-
    container info --format {{ '{{.DockerRootDir}}' }}
  register: web_app_proxmox_data_root
  changed_when: false

- name: "🧮 Prove the container limits of {{ application_id }} hold its agent VMs"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-agent-broker/tasks/utils/vm/capacity.yml') }}"
  vars:
    vm_capacity_kind: proxmox
    vm_capacity_warm_pool: "{{ PROXMOX_AGENTS.warm_pool }}"
    vm_capacity_reserve: "{{ PROXMOX_AGENTS.reserve }}"
    vm_capacity_running_memory: 0
    vm_capacity_storage_path: "{{ web_app_proxmox_data_root.stdout | trim }}"
    vm_capacity_pool_size: ""
    vm_capacity_pool_used: 0
    vm_capacity_overhead: "{{ PROXMOX_AGENTS.overhead }}"
    vm_capacity_limits: "{{ PROXMOX_LIMITS }}"

- name: "🚿 Flush compose for {{ application_id }}"
  meta: flush_handlers

- name: "🪪 Converge the OpenID realm and admin group of {{ application_id }}"
  ansible.builtin.include_tasks: 01_access.yml
  when: IS_STACK_HOST | bool

- name: "🛂 Sync the administrator accounts of {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/rbac/sync.yml') }}"
  vars:
    rbac_sync_application_id: "{{ application_id }}"
    rbac_sync_enabled: "{{ PROXMOX_SSO_ENABLED | bool }}"
    rbac_sync_mode: "{{ DEPLOYMENT_MODE }}"
    rbac_sync_skip_unchanged: true
    rbac_sync_roles: [administrator]
    rbac_sync_service_key: proxmox
    rbac_sync_service_name: ""
    rbac_sync_container: "{{ PROXMOX_CONTAINER }}"
    rbac_sync_kind: container
    rbac_sync_user: ""
    rbac_sync_argv: [perl, "-"]
    rbac_sync_script: "{{ lookup('file', role_path ~ '/files/perl/rbac.pl') }}"
    rbac_sync_modules: []
    rbac_sync_env:
      PROXMOX_REALM: "{{ PROXMOX_REALM }}"
      PROXMOX_GROUP: "{{ PROXMOX_ADMIN_GROUP }}"
    rbac_sync_members_env:
      - { name: PROXMOX_RBAC_ADMINISTRATORS, role: administrator, field: "" }
