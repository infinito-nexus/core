---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: playwright-service-flag  self-provider
proxmox:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: false
  bond: 1
  enabled: true
  shared: true
  backup:
    stop_required: true
  image: debian
  version: 13.7-slim
  custom: true
  name: proxmox
  # nocheck: min-storage-headroom  Reason: the declared image is only the Dockerfile base; the built image adds the Proxmox VE packages with QEMU, and the proxmox_templates and proxmox_vm_disks volumes hold the ISO and container templates, the base disks of the agent VM templates and the disks of the running agent VMs
  min_storage: 20GB
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 4096
  lifecycle: pre-alpha
  ports:
    local:
      http: 7992
      sso: 16503
    internal:
      http: 8006
  upstream_scheme: https
  realm:
    id: keycloak
    comment: Keycloak
  ve:
    repository: http://download.proxmox.com/debian/pve
    keyring: https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
    keyring_sha512: "90eb7f053a54ba0d57f67838a522151449a02e6db245b2becb3338dd7f812b516ff77f95a2ade433f8d90f183570be7efade93b23211d2091eeb7ef21fdc918a"
    suite: trixie
    packages:
      pve-manager: "9.2.26"
      pve-cluster: "9.1.9"
      pve-qemu-kvm: "11.1.3-1"
      qemu-server: "9.2.15"
  shared_host: false
  agents:
    warm_pool: 1
    reserve:
      memory: 4GiB
      disk: 50GiB
    overhead:
      cpus: 1
      memory: 2GiB
  vm_network:
    bridge: vmbr1
    subnet: 192.168.242.0/24

sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names or (groups.get('web-app-keycloak') or []) | length > 0 }}"
  shared: "{{ 'web-app-keycloak' in group_names or (groups.get('web-app-keycloak') or []) | length > 0 }}"
  flavor: oauth2
  oauth2:
    origin:
      host: proxmox
      port: 8006
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-proxmox', role='administrator') }}"

logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"

dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"

design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "Proxmox VE"

prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
# nocheck: dynamic-flag, sso-variant-tor  the Proxmox VE UI stays behind the front proxy's clearnet gate, so the role has no onion
tor:
  enabled: false
  shared: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
