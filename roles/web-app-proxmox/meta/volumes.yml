---
proxmox_config:
  type: volume
  mounts:
    - service: proxmox
      target: /var/lib/pve-cluster

proxmox_templates:
  type: volume
  mounts:
    - service: proxmox
      target: /var/lib/vz/template

proxmox_vm_disks:
  type: volume
  backup: false
  mounts:
    - service: proxmox
      target: /var/lib/vz/images
