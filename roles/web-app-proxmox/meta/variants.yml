---
- services:
    proxmox:
      flavor: vm
      api:
        enabled: true
        allowed_sources:
          - "{{ NETWORK_PRIVATE_CIDRS.class_a }}"
          - "{{ NETWORK_PRIVATE_CIDRS.class_b }}"
          - "{{ NETWORK_PRIVATE_CIDRS.class_c }}"
    docs:
      enabled: false
      shared: false
    sso:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    design:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    container_backup:
      enabled: true
    semaphore:
      enabled: true
      shared: true
- services:
    proxmox:
      flavor: container
      api:
        enabled: true
        allowed_sources:
          - "{{ NETWORK_PRIVATE_CIDRS.class_a }}"
          - "{{ NETWORK_PRIVATE_CIDRS.class_b }}"
          - "{{ NETWORK_PRIVATE_CIDRS.class_c }}"
    docs:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    logout:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false
    design:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    semaphore:
      enabled: false
      shared: false
