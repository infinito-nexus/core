---
application_id: "web-app-proxmox"
entity_name: "{{ application_id | entity_name }}"
domain: "{{ lookup('domain', application_id) }}"
http_port: "{{ lookup('config', application_id, 'services.proxmox.ports.local.http') }}"

PROXMOX_CONTAINER: "{{ lookup('config', application_id, 'services.proxmox.name') }}"
PROXMOX_BASE_IMAGE: "{{ lookup('config', application_id, 'services.proxmox.image') }}"
PROXMOX_BASE_VERSION: "{{ lookup('config', application_id, 'services.proxmox.version') }}"
PROXMOX_VE: "{{ lookup('config', application_id, 'services.proxmox.ve') }}"
PROXMOX_PACKAGE_PINS: "{{ PROXMOX_VE.packages | proxmox_package_pins }}"
PROXMOX_AGENTS: "{{ lookup('config', application_id, 'services.proxmox.agents') }}"
PROXMOX_SHARED_HOST: "{{ lookup('config', application_id, 'services.proxmox.shared_host') }}"
PROXMOX_LIMITS:
  cpus: "{{ lookup('config', application_id, 'services.proxmox.cpus') }}"
  mem_limit: "{{ lookup('config', application_id, 'services.proxmox.mem_limit') }}"

PROXMOX_EXCLUSIVE_PEERS:
  - web-app-keycloak
  - svc-ai-litellm
  - web-app-openbao
PROXMOX_COHOSTED_PEERS: "{{ PROXMOX_EXCLUSIVE_PEERS | proxmox_cohosted(inventory_hostname, groups, hostvars) }}"
PROXMOX_SSO_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') }}"
PROXMOX_TOR_ENABLED: "{{ lookup('config', application_id, 'services.tor.enabled') }}"
PROXMOX_INTERNAL_PORT: "{{ lookup('config', application_id, 'services.proxmox.ports.internal.http') }}"

PROXMOX_REALM: "{{ lookup('config', application_id, 'services.proxmox.realm.id') }}"
PROXMOX_REALM_CONFIG:
  issuer-url: "{{ OIDC.CLIENT.ISSUER_URL }}"
  client-id: "{{ OIDC.CLIENT.ID }}"
  username-claim: "{{ OIDC.ATTRIBUTES.USERNAME }}"
  autocreate: 1
  default: 1
  comment: "{{ lookup('config', application_id, 'services.proxmox.realm.comment') }}"
PROXMOX_OIDC_CLIENT_SECRET: "{{ OIDC.CLIENT.SECRET }}"
PROXMOX_ADMIN_ROLE: Administrator
PROXMOX_ADMIN_GROUP: "{{ application_id }}-administrator"
PROXMOX_ADMIN_GROUP_COMMENT: "Members of {{ lookup('rbac_group_path', application_id=application_id, role='administrator') }}, reconciled by Infinito.Nexus"
