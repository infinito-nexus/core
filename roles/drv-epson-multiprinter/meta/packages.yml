---
epson-multiprinter:
  Archlinux:
    source: aur
    names:
      - epson-inkjet-printer-escpr
      - epson-inkjet-printer-escpr2
      - epson-printer-utility
      - imagescan
      - imagescan-plugin-networkscan
  Debian:
    - printer-driver-escpr
  RedHat: [] # nocheck: empty - no fetchable source exists: Fedora, CentOS Stream 10 and EPEL 10 carry none of Epson's packages, and Epson serves its own rpms only from support.epson.net, which answers a non-browser request with 403, so a pinned download would fail on the target
