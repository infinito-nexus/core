  button-primary__active__color: on-primary
  button-primary__hover__background: primary-hover
  button-primary__active__background: primary-active
  header-panel__background-color: frame
  header-panel__text-color: on-frame
  copyright__background-color: frame
  form-element-input__border-color: border-strong
  form-element-input-placeholder__color: text-muted
MAGENTO_DESIGN_THEME_BORDER_TOKENS:
  button__border: border-strong
  button-primary__hover__border: primary-hover
  button-primary__active__border: primary-active
  select__border: border-strong
MAGENTO_DESIGN_THEME_VARIABLES: >-
  {{ dict(MAGENTO_DESIGN_THEME_COLOR_TOKENS.keys()
       | zip(MAGENTO_DESIGN_THEME_COLOR_TOKENS.values() | map('regex_replace', '^', '--design-') | map('extract', MAGENTO_DESIGN_PALETTE)))
     | combine(dict(MAGENTO_DESIGN_THEME_BORDER_TOKENS.keys()
       | zip(MAGENTO_DESIGN_THEME_BORDER_TOKENS.values() | map('regex_replace', '^', '--design-') | map('extract', MAGENTO_DESIGN_PALETTE)
             | map('regex_replace', '^', '1px solid ')))) }}
MAGENTO_DESIGN_THEME:
  path: "frontend/{{ MAGENTO_DESIGN_THEME_NAME }}"
  title: "Corporate Design"
  parent: "Magento/luma"
  variables: "{{ MAGENTO_DESIGN_THEME_VARIABLES }}"
