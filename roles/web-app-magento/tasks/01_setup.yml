---
- name: "🧭 Resolve the Magento data volume's mountpoint on this node"
  ansible.builtin.command: >-
    container volume inspect --format '{{ "{{.Mountpoint}}" }}'
    {{ MAGENTO_VOLUME | quote }}
  register: magento_volume_mountpoint
  changed_when: false

- name: "🥾 Bootstrap Magento {{ MAGENTO_COMPOSER_VERSION }} source"
  shell: >
    container exec
    -e COMPOSER_HOME=/tmp/composer
    -e COMPOSER_CACHE_DIR=/tmp/composer/cache
    --user {{ MAGENTO_USER }}
    {{ MAGENTO_PHP_CONTAINER_ADDRESS }} bash -lc 'set -e
      mkdir -p /tmp/composer/cache
      cd /var/www/html
      composer create-project --no-interaction --no-progress --no-install --repository-url={{ MAGENTO_COMPOSER_REPOSITORY }} {{ MAGENTO_COMPOSER_SPEC }} .
      cp nginx.conf.sample nginx.conf
      mkdir -p var pub/static pub/media app/etc
      chmod -R 775 var pub/static pub/media app/etc
    '
  args:
    creates: "{{ [ magento_volume_mountpoint.stdout | trim, 'html/composer.json' ] | path_join }}"

- name: "📦 Install Magento dependencies"
  ansible.builtin.shell: >
    container exec
    -e COMPOSER_HOME=/tmp/composer
    -e COMPOSER_CACHE_DIR=/tmp/composer/cache
    --user {{ MAGENTO_USER }}
    -w /var/www/html
    {{ MAGENTO_PHP_CONTAINER_ADDRESS }} composer install --no-interaction --no-progress
  args:
    creates: "{{ [ magento_volume_mountpoint.stdout | trim, 'html/bin/magento' ] | path_join }}"
  register: magento_composer_install
  retries: 3
  delay: 5
  until: magento_composer_install is succeeded

- name: "▶️ Run Magento setup:install (in container)"
  shell: >
    container exec --user {{ MAGENTO_USER }} {{ MAGENTO_PHP_CONTAINER_ADDRESS }} bash -lc "
    cd /var/www/html && bin/magento setup:install \
      --base-url='{{ MAGENTO_URL }}/' \
      --db-host=\"\$MYSQL_HOST\" \
      --db-name=\"\$MYSQL_DATABASE\" \
      --db-user=\"\$MYSQL_USER\" \
      --db-password=\"\$MYSQL_PASSWORD\" \
      --skip-db-validation \
      --db-engine=mysql \
      --search-engine='opensearch' \
      --opensearch-host=\"\$OPENSEARCH_HOST\" \
      --opensearch-port=\"\$OPENSEARCH_PORT_NUMBER\" \
    {% if lookup('objstore', application_id, 'enabled') | bool %} \
      --remote-storage-driver=\"\$MAGENTO_REMOTE_STORAGE_DRIVER\" \
      --remote-storage-bucket=\"\$MAGENTO_REMOTE_STORAGE_BUCKET\" \
      --remote-storage-region=\"\$MAGENTO_REMOTE_STORAGE_REGION\" \
      --remote-storage-key=\"\$MAGENTO_REMOTE_STORAGE_KEY\" \
      --remote-storage-secret=\"\$MAGENTO_REMOTE_STORAGE_SECRET\" \
      --remote-storage-endpoint=\"\$MAGENTO_REMOTE_STORAGE_ENDPOINT\" \
      --remote-storage-path-style=\"\$MAGENTO_REMOTE_STORAGE_PATH_STYLE\" \
    {% endif %} \
      --admin-firstname=\"\$MAGENTO_ADMIN_FIRSTNAME\" \
      --admin-lastname=\"\$MAGENTO_ADMIN_LASTNAME\" \
      --admin-email=\"\$MAGENTO_ADMIN_EMAIL\" \
      --admin-user=\"\$MAGENTO_ADMIN_USERNAME\" \
      --admin-password=\"\$MAGENTO_ADMIN_PASSWORD\""
  args:
    creates: "{{ [ magento_volume_mountpoint.stdout | trim, 'html/app/etc/env.php' ] | path_join }}"
  register: magento_install
  changed_when: >
    (magento_install.stdout is defined and
     ('Magento installation complete' in magento_install.stdout
      or 'successfully installed' in magento_install.stdout))

- name: "🔄 Restart nginx so it picks up Magento's vhost (compose)"
  ansible.builtin.command: "container restart {{ MAGENTO_NGINX_CONTAINER | quote }}"
  register: magento_nginx_restart_compose
  changed_when: magento_nginx_restart_compose.rc == 0
  when: DEPLOYMENT_MODE == 'compose'

- name: "🔄 Restart nginx so it picks up Magento's vhost (swarm)"
  ansible.builtin.command: >-
    container service update --force
    {{ lookup('container_service', application_id, 'nginx') | quote }}
  register: magento_nginx_restart_swarm
  changed_when: magento_nginx_restart_swarm.rc == 0
  timeout: "{{ lookup('timeout', 600) | int }}"
  when: DEPLOYMENT_MODE == 'swarm'
