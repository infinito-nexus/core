---
application_id: "svc-ai-ollama"
entity_name: "{{ application_id | entity_name }}"

OLLAMA_CONTAINER: "{{ lookup('config', application_id, 'services.ollama.name') }}"
OLLAMA_PORT: "{{ lookup('config', application_id, 'services.ollama.ports.internal.http') }}"
OLLAMA_PRELOAD_MODELS: "{{ lookup('config', application_id, 'services.ollama.preload_models') }}"
OLLAMA_KEEP_ALIVE: "{{ lookup('config', application_id, 'services.ollama.keep_alive') }}"
OLLAMA_IMPORT_DIR: "{{ [lookup('volume', application_id, 'ollama_models').target, 'import'] | path_join }}"
OLLAMA_BLOBS_DIR: "{{ [lookup('volume', application_id, 'ollama_models').target, 'blobs'] | path_join }}"
OLLAMA_STORE_MOUNT: "{{ AI_MODELS_STORE_PATH }}:{{ AI_MODELS_STORE_PATH }}:ro"
