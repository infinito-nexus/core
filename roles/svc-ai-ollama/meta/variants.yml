---
# Matrix-deploy variant overrides for this role. Each list entry is
# one variant deep-merged on top of `meta/services.yml`. The development
# deploy wrapper iterates the global round count (max variants across
# all primary apps) and runs cleanup between rounds for any app whose
# variant changed. Apps with fewer variants stay on variant 0 in the
# extra rounds.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# Variant 0 runs the round that every other role's variant 0 runs with, so it
# preloads nothing: the gateway then serves its deterministic mock and no row
# pays for pulling or running a model. Variant 1 preloads for real and is the
# round that proves this role actually serves.

- services:
    container_backup:
      enabled: true
    ollama:
      mem_reservation: 1g
      mem_limit: 2g
      preload_models: []

- services:
    container_backup:
      enabled: true
    ollama:
      mem_reservation: 1g
      mem_limit: 2g
