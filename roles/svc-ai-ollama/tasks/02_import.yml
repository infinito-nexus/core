---
- name: "📥 Create the missing models from {{ ollama_file.url | basename }}"
  block:
    - name: "🧩 Link the store file and create its models"
      ansible.builtin.include_tasks: 03_create.yml
  always:
    - name: "🧹 Remove the Modelfile from the Ollama container"
      ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
        container exec {{ OLLAMA_LOCAL_CID | quote }} rm -f {{ ollama_modelfile | quote }}
      changed_when: true
      delegate_to: "{{ OLLAMA_HOST_NODE }}"
