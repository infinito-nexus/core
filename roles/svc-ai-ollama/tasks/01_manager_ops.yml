---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: OLLAMA
    resolve_compose_cid: "{{ OLLAMA_CONTAINER }}"

- name: "🛑 Refuse a preload model that is not pinned to one file"
  ansible.builtin.assert:
    that:
      - (model | local_model_refusal) | length == 0
    fail_msg: "{{ model.alias | default(model) }}: {{ model | local_model_refusal }}"
    quiet: true
  loop: "{{ OLLAMA_PRELOAD_MODELS }}"
  loop_control:
    loop_var: model
    label: "{{ model.alias | default(model) }}"

- name: "🔍 Read the file Ollama holds each preload model at"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ OLLAMA_LOCAL_CID | quote }} ollama show {{ model.alias | quote }} --modelfile
  register: ollama_held
  changed_when: false
  failed_when: false
  loop: "{{ OLLAMA_PRELOAD_MODELS }}"
  loop_control:
    loop_var: model
    label: "{{ model.alias }}"
  delegate_to: "{{ OLLAMA_HOST_NODE }}"

- name: "📥 Create the preload models Ollama does not hold at their pinned file"
  ansible.builtin.include_tasks: 02_import.yml
  loop: "{{ ollama_held.results | local_models_missing | unique(attribute='sha256') }}"
  loop_control:
    loop_var: ollama_file
    label: "{{ ollama_file.url | basename }}"
  vars:
    ollama_models: "{{ ollama_held.results | local_models_missing | selectattr('sha256', 'equalto', ollama_file.sha256) | list }}"
    ollama_handed: "{{ [AI_MODELS_STORE_PATH, ollama_file.sha256] | path_join }}"
    ollama_blob: "{{ [OLLAMA_BLOBS_DIR, 'sha256-' ~ ollama_file.sha256] | path_join }}"
    ollama_modelfile: "{{ [OLLAMA_IMPORT_DIR, ollama_file.sha256 ~ '.Modelfile'] | path_join }}"
