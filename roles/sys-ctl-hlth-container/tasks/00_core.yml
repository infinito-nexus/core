---
- name: 📂 Include dependency 'sys-ctl-alm-compose'
  include_role:
    name: sys-ctl-alm-compose
  when: run_once_sys_ctl_alm_compose is not defined

- name: 📂 Include dependency 'sys-ctl-rpr-container-soft'
  include_role:
    name: sys-ctl-rpr-container-soft
  when: run_once_sys_ctl_rpr_container_soft is not defined

- name: 📁 Ensure the script directory of {{ system_service_id }} exists
  ansible.builtin.file:
    path: "{{ SYS_CTL_HLTH_CONTAINER_SCRIPT_DIR }}"
    state: directory
    mode: "0755"

- name: 📋 Deploy the log excerpt redactor of {{ system_service_id }}
  ansible.builtin.copy:
    src: python/redact.py
    dest: "{{ [SYS_CTL_HLTH_CONTAINER_SCRIPT_DIR, 'redact.py'] | path_join }}"
    mode: "0755"

- name: 📋 Deploy the shared redaction rules of {{ system_service_id }}
  ansible.builtin.copy:
    content: "{{ {'replacement': LOG_REDACTION_REPLACEMENT, 'rules': LOG_REDACTION_RULES} | to_nice_json }}\n"
    dest: "{{ [SYS_CTL_HLTH_CONTAINER_SCRIPT_DIR, 'redaction.json'] | path_join }}"
    mode: "0644"

- include_role:
    name: sys-service
  vars:
    system_service_timer_enabled: true
    system_service_on_calendar: "{{ SYS_SCHEDULE_HEALTH_CONTAINER }}"
    system_service_tpl_on_failure: "{{ SYS_SERVICE_ON_FAILURE_COMPOSE }} {{ SYS_SERVICE_REPAIR_CONTAINER_SOFT }}"
    system_service_force_flush_final: true

- include_tasks: utils/once/flag.yml
