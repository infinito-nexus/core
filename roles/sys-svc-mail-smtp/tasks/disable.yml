---
- block:
    - name: 🔎 Check whether postfix is installed
      ansible.builtin.stat:
        path: /usr/sbin/postfix
      register: sys_svc_mail_smtp_postfix_binary

    - name: ⏹️ Stop and disable postfix (avoid port 25 conflicts)
      service:
        name: postfix
        state: stopped
        enabled: false
      when: sys_svc_mail_smtp_postfix_binary.stat.exists

    - name: 🗑️ Remove postfix when external SMTP is used (conflicts with msmtp-mta)
      package_install: # nocheck: package-install removes postfix, the batch only installs
        id: postfix
        state: absent
  when: lookup('email').external | bool
