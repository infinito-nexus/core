---
- name: 📂 Include dependencies
  include_role:
    name: "{{ dependency_role }}"
  loop:
    - sys-ctl-alm-compose
    - sys-daemon
  loop_control:
    loop_var: dependency_role

- name: 📦 Install certreap system-wide via pip
  include_role:
    name: sys-pip-install
  vars:
    package_name: certreap
    global_install: true

- include_role:
    name: sys-service
  vars:
    system_service_timer_enabled: true
    system_service_on_calendar: "{{ SYS_SCHEDULE_CLEANUP_CERTS }}"
    system_service_copy_files: false
    system_service_force_linear_sync: false

- include_tasks: utils/once/flag.yml
