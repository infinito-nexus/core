---
# nocheck: dynamic-flag
legal:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
    host:
      enabled: false
  enabled: false
  shared: false
  lifecycle: beta
  min_storage: "50MB"
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "64m"
  pids_limit: 64
# nocheck: dynamic-flag
html:
  bond: 1
  enabled: true
  shared: true
# nocheck: dynamic-flag
# nocheck: design-off  Reason: renders the imprint into web-svc-html's web root, where web-svc-html's design applies and its design spec covers the page
design:
  enabled: false
  shared: false
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
