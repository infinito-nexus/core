---
application_id: "web-app-homeassistant"
entity_name: "{{ application_id | get_entity_name }}"
domain: "{{ lookup('domain', application_id) }}"
http_port: "{{ lookup('config', application_id, 'services.homeassistant.ports.local.http') }}"

HOMEASSISTANT_CONTAINER: "{{ lookup('config', application_id, 'services.homeassistant.name') }}"
HOMEASSISTANT_CONFIG_PATH_HOST: "{{ [ lookup('container', application_id, 'directories.config'), 'configuration.yaml' ] | path_join }}"
HOMEASSISTANT_PORT_INTERNAL: "{{ lookup('config', application_id, 'services.homeassistant.ports.internal.http') }}"
HOMEASSISTANT_MCP_ENABLED: "{{ lookup('config', application_id, 'mcp.enabled') }}"
HOMEASSISTANT_ADMIN_USERNAME: "{{ lookup('users', 'administrator').username }}"
HOMEASSISTANT_ADMIN_PASSWORD: "{{ lookup('config', application_id, 'secrets.credentials.administrator_password') }}"
HOMEASSISTANT_TOKEN_CLIENT_NAME: "infinito-mcp"
HOMEASSISTANT_CONFIG_DIR: "{{ lookup('volume', application_id, 'homeassistant_config').target }}"
HOMEASSISTANT_LOGIN_REFUSED: "home assistant refused the login of"
HOMEASSISTANT_MCP_ACCOUNT: "{{ lookup('users', 'mcp-web-app-homeassistant') }}"
HOMEASSISTANT_MCP_ACCOUNT_USERNAME: "{{ HOMEASSISTANT_MCP_ACCOUNT.username }}"
HOMEASSISTANT_MCP_ACCOUNT_NAME: "Infinito MCP"
HOMEASSISTANT_MCP_ACCOUNT_GROUP: "system-read-only"
HOMEASSISTANT_MCP_ACCOUNT_PASSWORD: "{{ HOMEASSISTANT_MCP_ACCOUNT.password }}"
HOMEASSISTANT_OWNER_ENVIRONMENT:
  HA_PORT: "{{ HOMEASSISTANT_PORT_INTERNAL | string }}"
  HA_USERNAME: "{{ HOMEASSISTANT_ADMIN_USERNAME }}"
  HA_PASSWORD: "{{ HOMEASSISTANT_ADMIN_PASSWORD }}"
  HA_OWNER_ONLY: "1"
  HA_LOCATION_NAME: "{{ HOMEASSISTANT_LOCATION_NAME }}"
HOMEASSISTANT_OWNER_PASSWORD_ARGUMENTS:
  - auth
  - --config
  - "{{ HOMEASSISTANT_CONFIG_DIR }}"
  - change_password
  - "{{ HOMEASSISTANT_ADMIN_USERNAME }}"
  - "{{ HOMEASSISTANT_ADMIN_PASSWORD }}"
HOMEASSISTANT_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool }}"
HOMEASSISTANT_LOCATION_NAME: "{{ lookup('design', application_id).title if (HOMEASSISTANT_DESIGN_ENABLED | bool) and lookup('design', application_id).title is string
  else '' }}"
HOMEASSISTANT_DESIGN_THEME: "{{ SOFTWARE_NAME }}"
HOMEASSISTANT_DESIGN_PRIMARY: "{{ lookup('design_palette', lookup('config', 'web-svc-design', 'services.design.colors.base')).light['--design-primary'] }}"
HOMEASSISTANT_DESIGN_VARIABLES:
  primary-background-color: "var(--design-surface-1)"
  card-background-color: "var(--design-surface-2)"
  secondary-background-color: "var(--design-surface-3)"
  clear-background-color: "var(--design-surface-2)"
  primary-text-color: "var(--design-text)"
  secondary-text-color: "var(--design-text-muted)"
  text-primary-color: "var(--design-surface-1)"
  text-light-primary-color: "var(--design-text)"
  disabled-text-color: "var(--design-border-strong)"
  primary-color: "var(--design-link)"
