---
# nocheck: playwright-service-flag
homeassistant:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  backup:
    no_stop_required: true
  image: ghcr.io/home-assistant/home-assistant
  version: "2026.7"
  name: homeassistant
  min_storage: 10GB
  cpus: "2.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 2048
  # nocheck: single-replica Home Assistant guards its config directory with a PID lock, so a second replica on the shared volume aborts with "Another Home Assistant instance is already running" and crash-loops; upstream supports no multi-instance mode
  replicas: 1
  ports:
    local:
      http: 8091
    internal:
      http: 8123
  lifecycle: beta
  proxy:
    service_key: homeassistant

# nocheck: playwright-service-flag
mcp:
  bond: 1
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
  direction: server
  transport: streamable_http
  exposure: internal
  auth: bearer_token
  auth_subject: user
  implementation: native
  endpoint:
    service_key: homeassistant
    path: /mcp_server/sse
    port_key: http
  tools:
    read_only_default: true
    mutating_tools_enabled: false

# nocheck: sso, dynamic-flag, playwright-service-flag
sso:
  enabled: false
  shared: false

# nocheck: logout, dynamic-flag, playwright-service-flag
logout:
  enabled: false
  shared: false

# nocheck: playwright-service-flag
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"

# nocheck: playwright-service-flag
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag
container_backup: # nocheck: bond-baseline
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
