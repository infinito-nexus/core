---
- name: "🧩 Load docker service required for the 'run' command"
  include_role:
    name: sys-svc-container
    public: false
  when: run_once_sys_svc_container is not defined

- name: 📂 Include dependency 'sys-ctl-alm-compose'
  include_role:
    name: sys-ctl-alm-compose
  when: run_once_sys_ctl_alm_compose is not defined

- name: 📁 Create the vulnerability cache
  ansible.builtin.file:
    path: "{{ HEALTH_RUNTIME_CACHE_DIR }}"
    state: directory
    mode: "0700"

- name: ⬇️ Pull the vulnerability engine images (with retries)
  ansible.builtin.command:
    argv:
      - container
      - pull
      - "{{ item }}"
  loop: "{{ HEALTH_RUNTIME_IMAGES.values() | list }}"
  register: health_runtime_pull
  changed_when: false
  retries: 6
  delay: 20
  until: health_runtime_pull.rc == 0

- include_role:
    name: sys-service
  vars:
    system_service_on_calendar: "{{ SYS_SCHEDULE_HEALTH_RUNTIME }}"
    system_service_timer_enabled: true
    system_service_tpl_on_failure: "{{ SYS_SERVICE_ON_FAILURE_COMPOSE }}"
    system_service_tpl_exec_start: >-
      {{ system_service_script_exec }}
      --hardened '{{ HEALTH_RUNTIME_PHP_HARDENED | to_json }}'
      --scan '{{ HEALTH_RUNTIME_SCAN | to_json }}'
      --images '{{ HEALTH_RUNTIME_IMAGES | to_json }}'
      --suppressions '{{ HEALTH_RUNTIME_SUPPRESSIONS | to_json }}'
      --cache-dir '{{ HEALTH_RUNTIME_CACHE_DIR }}'
      --database-dir '{{ HEALTH_RUNTIME_DATABASE_DIR }}'
      --host-excludes '{{ HEALTH_RUNTIME_HOST_EXCLUDES | to_json }}'
    system_service_force_flush_final: true
    system_service_run_once: true

- include_tasks: utils/once/flag.yml
