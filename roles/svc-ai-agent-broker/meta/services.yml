---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
agent-broker:
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  joins each agent's attachable overlay through the manager engine the socket proxy fronts
  placement: manager
  bond: 1
  enabled: true
  shared: true
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  ca_client: true
  name: agent-broker
  min_storage: 130MB
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 256m
  pids_limit: 256
  healthcheck:
    flavor: http_status
    path: health
  ports:
    internal:
      http: 8080
  request_timeout: 1800
  agents:
    model: "{{ AI_AGENT_MODEL }}"
    idle_stop: true
    idle_minutes: 30
    max_running: 20
    start_timeout: 900
  run_after:
    - svc-ai-litellm
  guide_companions:
    - svc-ai-ollama
  lifecycle: beta

# nocheck: shared
# nocheck: dynamic-flag
socket-proxy:
  backup:
    stop_required: false
  bond: 1
  enabled: true
  image: wollomatic/socket-proxy
  version: 1.14.0
  name: agent-socket-proxy
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 64m
  pids_limit: 128
  healthcheck:
    test: ["CMD", "./healthcheck"]
# nocheck: playwright-service-flag, dynamic-flag  every agent call is relayed through the gateway, so the broker never runs without it
litellm:
  bond: 1
  enabled: true
  shared: "{{ LITELLM_SHARED }}"
# nocheck: playwright-service-flag, dynamic-flag  the broker authorizes every request against Keycloak group paths and has no LDAP or no-auth path, so a group_names gate would only defer the failure to runtime
sso: # nocheck: login-methods  Reason: an API service without a sign-in page; it authorizes each request by the caller's Keycloak groups that Open WebUI forwards, so no browser ever picks a login method here
  bond: 1
  enabled: true
  shared: true
  flavor: oidc
# nocheck: playwright-service-flag, dynamic-flag
hermes:
  bond: 1
  enabled: true
  shared: true
# nocheck: playwright-service-flag, dynamic-flag
openclaw:
  bond: 1
  enabled: true
  shared: true

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started
