---
credentials:
  api_key:
    description: Bearer key Open WebUI presents to the agent broker
    algorithm: alphanumeric
    validation:
      min_length: 32
  litellm_api_key:
    description: The broker's own virtual key for the shared svc-ai-litellm gateway, used for every agent call it relays
    algorithm: sk_prefixed
    validation:
      min_length: 50
