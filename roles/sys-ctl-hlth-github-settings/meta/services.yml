# nocheck: required-by-coverage — included by web-svc-github-webhook, which holds its token, not through the service loader
github-settings:
  lifecycle: alpha
  # Exception: the timer schedule lives with the one role that runs it, not in group_vars/all/07_schedule.yml, so the check owns its own cadence (SRP) and an inventory overrides it under applications.sys-ctl-hlth-github-settings.services.github-settings.schedule.
  schedule: "*-*-* *:30:00"
