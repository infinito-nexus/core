---
openldap:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  the manager placement applies to the standalone form only; HA instances pin per host via the instance model
  placement: manager
  bond: 1
  enabled: true
  shared: true
  provides: ldap
  image: debian
  version: 13.7-slim
  custom: true
  name: openldap
  min_storage: 229MB
  cpus: 1.25
  mem_reservation: 1g
  mem_limit: 1.5g
  pids_limit: 1024
  network:
    local: true
    compose: true
    public: false
  provision:
    configuration: true
    credentials: true
    schemas: true
    users: true
    groups: true
    update: true
  exposed: false
  ports:
    internal:
      ldap: 389
      instance: 1389
      writer: 8009
    local:
      ldap: 389
    public:
      ldaps: 636
  ha:
    capable: true
    primary_probe: http
    backup: files
    endpoint:
      port: ldap
      backend_port: instance
      check: http
      check_port: writer
      check_path: /writer
  lifecycle: beta
# nocheck: playwright-service-flag, dynamic-flag, variants-coverage  the writer elector joins the coordination-store overlay only in the HA form, which the instance count selects, not a variant
etcd: # nocheck: bond-baseline coordination store joins by instance count, outside the variant topology
  bond: 1
  enabled: "{{ lookup('db_instances', 'svc-db-openldap').form == 'ha' }}"
  shared: true
  user: openldap-elector
  prefix: /infinito/openldap/
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
