---
credentials:
  administrator_password:
    description: Initial password for the LDAP administrator (e.g. cn=admin,dc=example,dc=com)
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
  etcd_password:
    description: Password of the etcd user the writer elector uses in the HA form, restricted to its coordination-store prefix
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  administrator_database_password:
    description: Password used internally for the database-backed directory admin
    algorithm: bcrypt
    validation: ^\$2[aby]\$.{56}$
