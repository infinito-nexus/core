---
- include_tasks: utils/once/flag.yml

- include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/db/ha/prepare.yml') }}"

- name: "📁 Create LDIF dirs {{ OPENLDAP_LDIF_PATH_HOST }} before swarm bind-mount"
  directory_batch:
    paths: "{{ [OPENLDAP_LDIF_PATH_HOST] | product(OPENLDAP_LDIF_TYPES) | map('join') | list }}"
    mode: "0755"
  when: not OPENLDAP_HA | bool

- name: 🎬 Initialize docker
  include_tasks: 01_docker.yml

- name: 📄 Render {{ lookup('domain',application_id) }}.conf if LDAP is public
  stack_host_template:
    src: "nginx.stream.conf.j2"
    dest: "{{ lookup('nginx','directories.configuration.streams') }}{{ lookup('domain',application_id) }}.conf"
  vars:
    domain: "{{ lookup('domain', application_id) }}"
  notify: restart-openresty
  when: OPENLDAP_NETWORK_SWITCH_PUBLIC | bool

- name: 🧹 Remove {{ lookup('domain',application_id) }}.conf if LDAP not public
  file:
    path: "{{ lookup('nginx','directories.configuration.streams') }}{{ lookup('domain',application_id) }}.conf"
    state: absent
  when: not OPENLDAP_NETWORK_SWITCH_PUBLIC | bool

- name: "📂 Provision the HA form through the writer"
  include_tasks: ha/03_provision.yml
  when: OPENLDAP_HA | bool

- name: "📂 Provision the standalone form"
  include_tasks: 06_standalone.yml
  when: not OPENLDAP_HA | bool

- include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/db/ha/health_gate.yml') }}"
