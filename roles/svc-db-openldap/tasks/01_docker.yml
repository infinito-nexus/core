---
- name: "📂 include sys-svc-compose role"
  include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: false
    compose_repository_pull: false
    application_id: "svc-db-openldap"

- name: 📁 Create container network
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/create.yml') }}"
  vars:
    network_role_id: "{{ application_id }}"

- name: 📋 Copy OpenLDAP image files to instance dir
  stack_host_copy:
    src: "{{ item.src }}"
    dest: "{{ [ lookup('container', application_id, 'directories.instance'), item.dest ] | path_join }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "shell/entrypoint.sh", dest: "entrypoint.sh", mode: "0755" }
    - { src: "shell/healthcheck.sh", dest: "healthcheck.sh", mode: "0755" }
  loop_control:
    label: "{{ item.dest }}"

- name: 📋 Copy the writer elector package into the image build context
  stack_host_copy:
    src: "{{ lookup('path_absolute', 'files/db-elector/infinito_elector') }}"
    dest: "{{ lookup('container', application_id, 'directories.instance') }}"
    mode: "0644"
    directory_mode: "0755"
  when: OPENLDAP_HA | bool

- name: "📄 Render the HA per-instance cn=config and elector credentials"
  include_tasks: ha/01_config.yml
  when:
    - OPENLDAP_HA | bool
    - IS_STACK_HOST | bool

- name: "📄 Render the HAProxy write endpoint config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/db/endpoint.yml') }}"

- name: "🚿 Flush compose handlers"
  meta: flush_handlers

- name: "⏳ Wait for openldap stack to converge (swarm only)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/post_deploy.yml') }}"
    apply:
      delegate_to: "{{ STACK_HOST }}"
      run_once: true
