---
- name: "🔍 Read cn=config of a still-running standalone slapd"
  ansible.builtin.shell: |
    set -o pipefail
    container exec {{ OPENLDAP_CONTAINER_ADDRESS }} ldapsearch -Q -LLL -o ldif-wrap=no -Y EXTERNAL -H ldapi:/// -b cn=config
  args:
    executable: /bin/bash
  register: openldap_ha_legacy_config
  changed_when: false
  failed_when: false
  delegate_to: "{{ (OPENLDAP_DB.instances | selectattr('legacy') | first).host }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🧭 Migrate the still-running standalone slapd"
  when: openldap_ha_legacy_config.rc == 0
  block:
    - name: "🛡️ Refuse to migrate when the rendered cn=config would drop a live schema"
      vars:
        _live_schemas: >-
          {{ openldap_ha_legacy_config.stdout_lines
             | select('match', '^dn: cn=[^,]+,cn=schema,cn=config$')
             | map('regex_replace', '^dn: ', '')
             | list }}
        _rendered: >-
          {{ OPENLDAP_HA_HOST_IDS[0] | openldap_cn_config(
               OPENLDAP_HA_HOST_IDS, 'ldap://' ~ OPENLDAP_HA_PEER_TEMPLATE,
               LDAP.DN.ROOT, OPENLDAP_BIND_DN, OPENLDAP_SCHEMAS) }}
        _dropped: "{{ _live_schemas | openldap_schema_drops(_rendered) }}"
      ansible.builtin.assert:
        that: _dropped | length == 0
        fail_msg: |-
          OpenLDAP refuses to migrate to the HA form: the live cn=config holds schemas the rendered configuration would drop.
          --- live cn=schema,cn=config
          +++ rendered cn-config.ldif
          {% for name in _dropped %}
          - {{ name }}
          {% endfor %}
          Add them to OPENLDAP_SCHEMAS (roles/svc-db-openldap/vars/main.yml) or remove them from the live server, then re-run.

    - name: "🛡️ Refuse to migrate while ppolicy or olcLastBind is enabled"
      ansible.builtin.assert:
        that: (openldap_ha_legacy_config.stdout | openldap_forbidden_bind_writes) | length == 0
        fail_msg: >-
          {{ openldap_ha_legacy_config.stdout | openldap_forbidden_bind_writes | join(', ') }}
          turn binds into writes that bypass olcReadOnly; disable them before running more than one OpenLDAP instance.

    - name: "🛑 Stop the standalone slapd before its volume becomes the first provider"
      ansible.builtin.command: >-
        container service scale --detach=false {{ entity_name }}_{{ OPENLDAP_SERVICE }}=0
      changed_when: true
      delegate_to: "{{ STACK_HOST }}"
