---
# ##############################################################################
#
# Purpose:
# - Ensure base LDAP tree exists (suffix + OUs)
# - Ensure LDAP user entries exist (without setting userPassword here)
# - Set user passwords:
#   * default: on every deploy
#   * optional per-user override: set once on create via password_update: false
# - Keep the objectClass list up to date; seed mail only on entries that hold none,
#   or apply the mailbox layout when no Keycloak realm owns the email policy
# ##############################################################################

# ##############################################################################
# 0) Ensure base tree exists (suffix + OUs)
# ##############################################################################
- name: ✅ Ensure LDAP root (suffix) entry exists
  community.general.ldap_entry:
    dn: "{{ LDAP.DN.ROOT }}"
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    objectClass:
      - top
      - dcObject
      - organization
    attributes:
      dc: "{{ (LDAP.DN.ROOT | regex_search('dc=([^,]+)', '\\1')) | first | default('infinito') }}"
      o: "{{ (LDAP.DN.ROOT | regex_search('dc=([^,]+)', '\\1')) | first | default('infinito') }}"
    state: present

- name: ✅ Ensure people OU exists
  community.general.ldap_entry:
    dn: "{{ LDAP.DN.OU.USERS }}"
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    objectClass:
      - top
      - organizationalUnit
    attributes:
      ou: users
      description: "Users container"
    state: present

- name: ✅ Ensure groups OU exists
  community.general.ldap_entry:
    dn: "{{ LDAP.DN.OU.GROUPS }}"
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    objectClass:
      - top
      - organizationalUnit
    attributes:
      ou: groups
      description: "Groups container"
    state: present

- name: ✅ Ensure roles OU exists
  community.general.ldap_entry:
    dn: "{{ LDAP.DN.OU.ROLES }}"
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    objectClass:
      - top
      - organizationalUnit
    attributes:
      ou: roles
      description: "Container for application access profiles"
    state: present

- name: 🚚 Move the user entries still named by their inventory key before any entry is created
  ansible.builtin.include_tasks:
    file: _user_renames.yml
    apply:
      run_once: true
      delegate_to: "{{ STACK_HOST }}"

- name: ✅ Ensure LDAP users exist
  ldap_entries:
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    state: create
    entries: >-
      {{ OPENLDAP_USERS | openldap_user_entries(LDAP.USER.ATTRIBUTES.ID,
                                                LDAP.DN.OU.USERS,
                                                LDAP.USER.OBJECTS.STRUCTURAL) }}
  register: openldap_users_created
  changed_when: false
  throttle: 1
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🚚 Repoint the group values whose username-named entry exists only now
  ansible.builtin.include_tasks:
    file: _user_renames.yml
    apply:
      run_once: true
      delegate_to: "{{ STACK_HOST }}"

- name: 🔑 Leave every user entry its username as its only login
  ldap_entries:
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    state: exact
    entries: >-
      {{ OPENLDAP_USERS | openldap_user_login_entries(LDAP.USER.ATTRIBUTES.ID,
                                                      LDAP.DN.OU.USERS) }}
  throttle: 1

- name: 🔧 Set LDAP user passwords (per-user update policy)
  ldap_passwords:
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    entries: >-
      {{ OPENLDAP_USERS | openldap_user_passwords(LDAP.USER.ATTRIBUTES.ID,
                                                  LDAP.DN.OU.USERS,
                                                  openldap_users_created.changed_dns) }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: ✅ Ensure required objectClass values are present
  ldap_entries:
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    state: "{{ 'exact' if CLEANUP | bool else 'present' }}"
    entries: >-
      {{ OPENLDAP_USERS | openldap_user_class_entries(LDAP.USER.ATTRIBUTES.ID,
                                                      LDAP.DN.OU.USERS,
                                                      LDAP.USER.OBJECTS.STRUCTURAL) }}
  changed_when: false
  throttle: 1
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: ✉️ Seed the mail address of every user entry that holds none
  ldap_entries:
    server_uri: "{{ OPENLDAP_SERVER_URI }}"
    bind_dn: "{{ OPENLDAP_BIND_DN }}"
    bind_pw: "{{ OPENLDAP_BIND_PW }}"
    state: missing
    entries: >-
      {{ OPENLDAP_USERS | openldap_user_mail_entries(LDAP.USER.ATTRIBUTES.ID,
                                                     LDAP.DN.OU.USERS,
                                                     LDAP.USER.OBJECTS.STRUCTURAL) }}
  when: not (OPENLDAP_EMAIL_MAILBOX | bool)
  changed_when: false
  throttle: 1
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 📮 Apply the mailbox layout when no Keycloak realm owns the policy
  ansible.builtin.include_tasks: 06_mailbox.yml
  vars:
    openldap_mailbox_secondaries: "{{ OPENLDAP_SECONDARY_ADDRESSES }}"
  when:
    - OPENLDAP_EMAIL_MAILBOX | bool
    - not (OPENLDAP_KEYCLOAK_DEPLOYED | bool)
