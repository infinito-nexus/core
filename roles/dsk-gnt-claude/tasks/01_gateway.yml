---
- name: 📁 Ensure the agent's configuration directory exists
  ansible.builtin.file:
    path: "{{ agnt_claude_settings_path | dirname }}"
    state: directory
    owner: "{{ agnt_claude_user }}"
    group: "{{ agnt_claude_user }}"
    mode: "0700"

- name: 🔎 Look for settings the user already keeps
  ansible.builtin.stat:
    path: "{{ agnt_claude_settings_path }}"
  register: agnt_claude_settings_stat

- name: 📖 Read the settings the user already keeps
  ansible.builtin.slurp:
    src: "{{ agnt_claude_settings_path }}"
  register: agnt_claude_settings_slurp
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when: agnt_claude_settings_stat.stat.exists

- name: 🧊 Carry the user's settings into the template
  ansible.builtin.set_fact:
    agnt_claude_existing_settings: "{{ (agnt_claude_settings_slurp.content | b64decode | from_json) if agnt_claude_settings_stat.stat.exists else {} }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🔐 Write the merged settings
  ansible.builtin.template: # nocheck: stack-host-template (workstation role; the file belongs to the local user and there is no compose stack to gate on)
    src: settings.json.j2
    dest: "{{ agnt_claude_settings_path }}"
    owner: "{{ agnt_claude_user }}"
    group: "{{ agnt_claude_user }}"
    mode: "0600"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
