---
- name: 📁 Ensure the gateway settings directory exists
  ansible.builtin.file:
    path: "{{ agnt_claude_env_path | dirname }}"
    state: directory
    owner: "{{ agnt_claude_user }}"
    group: "{{ agnt_claude_user }}"
    mode: "0700"

- name: 🔐 Write the gateway settings the launcher reads
  ansible.builtin.template: # nocheck: stack-host-template (workstation role; the settings belong to the local user and there is no compose stack to gate on)
    src: claude-gateway.env.j2
    dest: "{{ agnt_claude_env_path }}"
    owner: "{{ agnt_claude_user }}"
    group: "{{ agnt_claude_user }}"
    mode: "0600"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🚀 Install the claude-gateway launcher
  ansible.builtin.copy:
    src: shell/claude-gateway.sh
    dest: "{{ agnt_claude_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"
