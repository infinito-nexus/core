---
- name: 🔐 Write the claude-gateway launcher
  ansible.builtin.template: # nocheck: stack-host-template (workstation role; the launcher belongs to the local user and there is no compose stack to gate on)
    src: claude-gateway.sh.j2
    dest: "{{ agnt_claude_wrapper_path }}"
    owner: "{{ agnt_claude_user }}"
    group: "{{ agnt_claude_user }}"
    mode: "0700"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
