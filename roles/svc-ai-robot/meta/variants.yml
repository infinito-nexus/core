---
# Matrix-deploy variant overrides for this role.
# See docs/contributing/artefact/files/role/variants.md for the file format.

- services:
    docs:
      enabled: true
      shared: true
    hermes:
      enabled: true
    openclaw:
      enabled: false

# nocheck: variants-explicit-disables shared stays true for both agents by contract; enabled alone selects the embodied one
- services:
    docs:
      enabled: false
      shared: false
    hermes:
      enabled: false
    openclaw:
      enabled: true
