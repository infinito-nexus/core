---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
robot:
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  min_storage: "100MB"
  cpus: "0.2"
  mem_reservation: "64m"
  mem_limit: "256m"
  pids_limit: 256
  lifecycle: pre-alpha

# nocheck: playwright-service-flag the embodied agent is the deployed workload of this role
hermes:
  bond: 1
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: true # nocheck: dynamic-flag the selected agent is always the shared workload of the device

# nocheck: playwright-service-flag the embodied agent is the deployed workload of this role
openclaw:
  bond: 0.1
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: true # nocheck: dynamic-flag the selected agent is always the shared workload of the device

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
# nocheck: robot-admission-guard  Semaphore is the platform controller, not an agent the robot can embody
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  the role runs no container, so Semaphore has nothing to pause
  status: started
