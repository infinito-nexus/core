---
# n8n owner setup: probe whether the owner account exists by attempting a
# single login with the alphanumeric break-glass owner_password. This
# replaces the deprecated /api/v1/owner/pre-setup probe (removed in n8n 1.x,
# always returns 404) and avoids two n8n class-validator false-positives:
# 1. @NoXss() on password: escapeHtml turns special chars (e.g. single quotes)
#    to HTML entities, so the system admin password fails the check. Fix: use a
#    dedicated alphanumeric owner_password (meta/secrets.yml).
# 2. @NoUrl() on firstName/lastName: regex /(\.[\p{L}\d-]+)/iu flags ANY dot
#    followed by letters — including org names like "Infinito.Nexus". Fix:
#    replace dots with spaces before sending (see firstName/lastName below).
# Normal users authenticate via SSO/Keycloak; this password is break-glass only.
#
# A single probe avoids triggering n8n's rate limiter. If a retry is still
# needed (e.g. n8n not fully up yet), keep well under n8n's default login
# rate limit of 5 attempts per 5-minute window: delay=30s/retries=4 caps this
# task at 5 attempts total, spanning 120s, so it never crosses the window.
- name: "🔎 Probe n8n owner account via single login attempt"
  ansible.builtin.command:
    argv: "{{ N8N_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', {'emailOrLdapLoginId': N8N_OWNER_EMAIL, 'password': N8N_OWNER_PASSWORD} | to_json) }}"
  environment:
    HTTP_METHOD: POST
    HTTP_URL: "{{ N8N_NETNS_API_URL }}/rest/login"
  register: n8n_owner_probe
  until: n8n_owner_probe.rc == 0 and 'json' in (n8n_owner_probe.stdout | from_json).content_type
  retries: 4
  delay: 30
  changed_when: false
  failed_when: n8n_owner_probe.rc != 0 or (n8n_owner_probe.stdout | from_json).status not in [200, 401, 403]
  delegate_to: "{{ N8N_HOST_NODE }}"
  become: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔧 Keep the owner probe status"
  ansible.builtin.set_fact:
    n8n_owner_probe_status: "{{ (n8n_owner_probe.stdout | from_json).status }}"

- name: "🔧 Initialise n8n owner account (first-time only)"
  ansible.builtin.command:
    argv: "{{ N8N_NETNS_PYTHON }}"
    stdin: >-
      {{ lookup('http_request_program', {
        'email': N8N_OWNER_EMAIL,
        'firstName': lookup('users', 'platform_administrator').firstname | replace('.', ' ') | trim,
        'lastName': lookup('users', 'platform_administrator').lastname | replace('.', ' ') | trim,
        'password': N8N_OWNER_PASSWORD,
      } | to_json) }}
  environment:
    HTTP_METHOD: POST
    HTTP_URL: "{{ N8N_NETNS_API_URL }}/rest/owner/setup"
  register: n8n_owner_setup
  changed_when: n8n_owner_setup.rc == 0 and (n8n_owner_setup.stdout | from_json).status in [200, 201]
  failed_when: n8n_owner_setup.rc != 0 or (n8n_owner_setup.stdout | from_json).status not in [200, 201, 400]
  delegate_to: "{{ N8N_HOST_NODE }}"
  become: true
  when: n8n_owner_probe_status | int != 200
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "✅ Check the n8n owner setup answer"
  when: n8n_owner_setup is not skipped
  block:
    - name: "🔧 Keep the owner setup answer"
      ansible.builtin.set_fact:
        n8n_owner_setup_answer: "{{ n8n_owner_setup.stdout | from_json }}"

    - name: "✅ Assert n8n owner setup succeeded or was already done"
      ansible.builtin.assert:
        that:
          - >-
            (n8n_owner_setup_answer.status in [200, 201])
            or ('already setup' in n8n_owner_setup_answer.content)
        fail_msg: "n8n owner setup returned {{ n8n_owner_setup_answer.status }}: {{ n8n_owner_setup_answer.content }}"

- name: "🔐 Converge a rotated owner password n8n still rejects"
  when:
    - n8n_owner_probe_status | int in [401, 403]
    - n8n_owner_setup is not skipped
    - "'already setup' in n8n_owner_setup_answer.content"
  block:
    - name: "🔐 Write the deployed owner password into n8n's user row"
      ansible.builtin.shell:
        cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
          IFS= read -r N8N_OWNER_PASSWORD && : "${N8N_OWNER_PASSWORD:?arrived empty on stdin}" && export N8N_OWNER_PASSWORD && container exec -i
          -e NODE_PATH={{ N8N_NODE_MODULES | quote }}
          -e N8N_OWNER_EMAIL={{ N8N_OWNER_EMAIL | quote }}
          -e N8N_OWNER_PASSWORD
          {{ N8N_LOCAL_CID | quote }}
          node -
        stdin: |-
          {{ N8N_OWNER_PASSWORD }}
          {{ lookup('file', 'javascript/reconcile/owner_password.js') }}
      register: n8n_owner_password
      retries: 30
      delay: 10
      until: n8n_owner_password.rc == 0
      changed_when: n8n_owner_password.stdout.startswith('CHANGED')
      delegate_to: "{{ N8N_HOST_NODE }}"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

    - name: "🔎 Confirm the owner signs in with the deployed password"
      ansible.builtin.command:
        argv: "{{ N8N_NETNS_PYTHON }}"
        stdin: "{{ lookup('http_request_program', {'emailOrLdapLoginId': N8N_OWNER_EMAIL, 'password': N8N_OWNER_PASSWORD} | to_json) }}"
      environment:
        HTTP_METHOD: POST
        HTTP_URL: "{{ N8N_NETNS_API_URL }}/rest/login"
      register: n8n_owner_confirm
      changed_when: false
      failed_when: n8n_owner_confirm.rc != 0 or (n8n_owner_confirm.stdout | from_json).status != 200
      delegate_to: "{{ N8N_HOST_NODE }}"
      become: true
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
