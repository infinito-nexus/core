---
- include_tasks: utils/once/flag.yml

- name: "🧩 Load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "🪝 Stage n8n SSO auto-provisioning hook on stack host and swarm peers"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "{{ lookup('path_absolute', 'roles/web-app-n8n/files/javascript/hooks.js') }}"
        dest: "{{ N8N_HOOKS_FILE_HOST }}"
        mode: "0644"
        notify: ["compose-up"]
  when: N8N_SSO_ENABLED | bool

- name: "🚿 Flush handlers so '{{ N8N_CONTAINER }}' restarts with the SSO hook mounted"
  meta: flush_handlers

- name: "🔍 Resolve the n8n container and its network namespace"
  ansible.builtin.include_tasks: utils/resolve.yml

- name: "🔎 Wait for n8n health check to pass"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - "{{ N8N_LOCAL_CID }}" # nocheck: container-exec-resolver
      - wget
      - -q
      - -O
      - /dev/null
      - "{{ N8N_NETNS_API_URL }}/healthz/readiness"
  register: n8n_health
  until: n8n_health.rc == 0
  retries: 60
  delay: 5
  changed_when: false
  delegate_to: "{{ N8N_HOST_NODE }}"

- name: "👤 Bootstrap n8n owner account"
  include_tasks:
    file: 01_bootstrap.yml
    apply:
      run_once: true

- name: "🔗 Bind the existing n8n accounts to their Keycloak subject"
  include_tasks: 02_sso.yml
  when:
    - N8N_SSO_ENABLED | bool
    - IS_STACK_HOST | bool

- name: "🤖 Bind the native AI surface to the platform gateway"
  include_tasks:
    file: utils/ai_gateway.yml
  when: N8N_LITELLM_ENABLED | bool

- name: "🔌 Provision the MCP surface"
  include_tasks:
    file: utils/mcp.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when: N8N_MCP_ENABLED | bool
