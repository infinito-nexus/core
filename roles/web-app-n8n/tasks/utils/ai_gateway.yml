---
- name: "🤖 Provision the managed OpenAI credential against the gateway"
  ansible.builtin.shell:
    cmd: >-
      IFS= read -r N8N_OWNER_PASSWORD && IFS= read -r N8N_AI_API_KEY &&
      : "${N8N_OWNER_PASSWORD:?arrived empty on stdin}" && : "${N8N_AI_API_KEY:?arrived empty on stdin}" &&
      export N8N_OWNER_PASSWORD N8N_AI_API_KEY && exec {{ N8N_NETNS_PYTHON | map('quote') | join(' ') }}
    stdin: |-
      {{ N8N_OWNER_PASSWORD }}
      {{ N8N_LITELLM_API_KEY }}
      {{ lookup('file', 'python/provision/ai.py') }}
  environment:
    N8N_BASE: "{{ N8N_NETNS_API_URL }}"
    NO_PROXY: "{{ NETWORK_LOOPBACK_HOSTS | join(',') }}"
    N8N_OWNER_EMAIL: "{{ N8N_OWNER_EMAIL }}"
    N8N_AI_CREDENTIAL: "{{ N8N_LITELLM_CREDENTIAL_NAME }}"
    N8N_AI_BASE_URL: "{{ N8N_LITELLM_BASE_URL }}"
  register: n8n_ai_provision
  retries: 30
  delay: 10
  until: n8n_ai_provision.rc == 0
  changed_when: n8n_ai_provision.stdout.startswith('CHANGED')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ N8N_HOST_NODE }}"
  become: true
  run_once: true
