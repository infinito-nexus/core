---
# Matrix-deploy variant overrides for web-app-opencloud.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: sso-variant-tor — the SSO-less variants run OpenCloud's built-in IDP,
# and lico rejects a non-https iss (bootstrap.go: "invalid iss value, URL must
# start with https://"). An onion has no TLS, so OC_URL is http and the whole
# single-binary runtime crash-loops. Variant 0 carries the onion.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-opencloud.
- services:
    container_backup:
      enabled: true
    design:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    ldap:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: true

- services:
    docs:
      enabled: true
      shared: true
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    ldap:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    # nocheck: variant-tor-collateral docs rides the smallest round of each role because the README replay is the costliest partner in the matrix; the guide serves over the onion in both web-app-docs variants, which is where that is proven
    tor: # nocheck: variant-tor-off without Keycloak OpenCloud runs its built-in lico IDP, which refuses a non-https issuer, and an onion has no TLS
      enabled: false

- services:
    docs:
      enabled: false
      shared: false
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    ldap:
      enabled: true
      shared: true
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    tor: # nocheck: variant-tor-off without Keycloak OpenCloud runs its built-in lico IDP, which refuses a non-https issuer, and an onion has no TLS
      enabled: false
