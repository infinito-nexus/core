---
# nocheck: run-once

# -----------------------------
# Mode: letsencrypt
# -----------------------------
- name: "✅ TLS | (letsencrypt) ensure certs and set paths"
  ansible.builtin.include_role:
    name: sys-front-tls-letsencrypt
  when: tls_mode_effective == 'letsencrypt'

- name: "✅ TLS | (self_signed) ensure certs and set paths"
  ansible.builtin.include_role:
    name: sys-front-tls-selfsigned
  when: tls_mode_effective == 'self_signed'

- name: 📂 Include dependency 'sys-ctl-mtn-cert-renew'
  include_role:
    name: sys-ctl-mtn-cert-renew
  when:
    - run_once_sys_ctl_mtn_cert_renew is not defined
    - lookup('tls', domain, 'enabled') | bool
    - tls_mode_effective == 'letsencrypt'
