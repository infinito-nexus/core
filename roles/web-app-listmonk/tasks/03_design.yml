---
- name: "🎨 Carry the corporate design in the Listmonk appearance and branding settings"
  ansible.builtin.shell:
    cmd: "{{ LISTMONK_EXEC_DATABASE }} -v ON_ERROR_STOP=1"
    stdin: "{{ lookup('template', 'design/appearance.sql.j2') }}"
  register: listmonk_design_settings
  changed_when: "'UPDATE 1' in listmonk_design_settings.stdout"
  failed_when: >-
    listmonk_design_settings.rc != 0
    or listmonk_design_settings.stdout is search('\[FAIL\]')
  notify: container-recreate
