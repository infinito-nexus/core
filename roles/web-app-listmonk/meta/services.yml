---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-playwright  the bucket write happens in the admin Media view (upload.provider=s3, services.listmonk.upload), but this role blocks BOTH authenticated personas (PERSONA_ADMINISTRATOR_BLOCKED / PERSONA_BIBER_BLOCKED = true in templates/playwright.env.j2), so no Playwright session can reach that view; see TODO.md
asset:
  bond: 1
  enabled: "{{ 'web-svc-asset' in group_names }}"
  shared: "{{ 'web-svc-asset' in group_names }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"
# nocheck: playwright-service-flag  self-provider
listmonk:
  enabled: true
  shared: true
  bond: 1
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: single-replica
  replicas: 1
  cpus: 1.0
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 1024
  min_storage: 215MB
  image: listmonk/listmonk
  version: "v6.2.0"
  backup:
    stop_required: false
  name: listmonk
  ports:
    internal:
      http: 9000
    local:
      http: 8019
  healthcheck:
    flavor: wget
    path: health
  public_api_activated: false
  settings:
    root_url: "{{ lookup('tls', 'web-app-listmonk', 'url.base') }}"
    from_email: "{{ service_provider.company.titel }} Newsletter <{{ lookup('users', 'newsletter').email }}>"
    lang: "{{ HOST_LL }}"
    check_updates: true
    enable_public_archive_rss_content: true
    site_name: "{{ lookup('design', 'web-app-listmonk').label if lookup('config', 'web-app-listmonk', 'services.design.enabled') | bool else service_provider.company.titel
      ~ ' Mailing list' }}"
    logo_url: "{{ lookup('design', 'web-app-listmonk').urls.header.svg if lookup('config', 'web-app-listmonk', 'services.design.enabled') | bool else service_provider.platform.logo
      }}"
    favicon_url: "{{ lookup('design', 'web-app-listmonk').urls.favicon_ico if lookup('config', 'web-app-listmonk', 'services.design.enabled') | bool else service_provider.platform.favicon
      }}"
  upload:
    provider: s3
    s3:
      enabled: "{{ lookup('objstore', 'web-app-listmonk', 'enabled') | bool }}"
      aws_default_region: "{{ lookup('objstore', 'web-app-listmonk', 'region') }}"
      bucket: "{{ lookup('objstore', 'web-app-listmonk', 'bucket') }}"
      bucket_type: public
      url: "{{ lookup('objstore', 'web-app-listmonk', 'url') }}"
      public_url: "{{ lookup('objstore', 'web-app-listmonk', 'public_url') }}"
  bounce:
    enabled: true
  oidc:
    provider_url: "{{ OIDC.CLIENT.ISSUER_URL }}"
    client_id: "{{ OIDC.CLIENT.ID }}"
    auto_create_users: false
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-listmonk', 'sso') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-listmonk', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-listmonk', '2fa') }}"
        enforced: true
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "v6.2.0"
        until: 2026-11-30
# nocheck: playwright-service-flag — object store, no Playwright surface
minio:
  enabled: false # nocheck: dynamic-flag
  shared: false # nocheck: dynamic-flag
  public: true
# nocheck: playwright-service-flag — object store, no Playwright surface
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
  public: true
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 182
      height: 34
# nocheck: dynamic-flag
# nocheck: playwright-service-flag
javascript:
  bond: 1
  enabled: true
  shared: true
# nocheck: dynamic-flag
hcaptcha:
  enabled: "{{ HCAPTCHA_ENABLED | bool }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag  internal adapter sidecar, covered by the role's MCP guest spec
# nocheck: dockerfile-custom  the Dockerfile is owned by svc-ai-mcp-adapter and staged per instance, so every adapter-backed provider shares one audited build
# nocheck: dynamic-flag  the sidecar tracks this role's own mcp flag, not another role's presence; a group_names expression would decide its exposure from an unrelated deployment
listmonkmcp:
  enabled: "{{ lookup('config', 'web-app-listmonk', 'mcp.enabled') | bool }}"
  shared: false
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  name: listmonkmcp
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 24m
  pids_limit: 64
  ports:
    internal:
      http: 8080

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
