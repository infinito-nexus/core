---
- name: "📁 Create the app-control directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ APP_CONTROL_LIB_DIR }}"
    - "{{ FILE_APP_CONTROL_CONFIG | dirname }}"
    - "{{ lookup('nginx', 'directories.data.paused_apps') }}"
    - "{{ lookup('nginx', 'directories.data.paused_pages') }}"

- name: "📦 Install the app-control modules into {{ APP_CONTROL_LIB_DIR }}"
  ansible.builtin.copy:
    src: "python/{{ item.file }}"
    dest: "{{ [ APP_CONTROL_LIB_DIR, item.file ] | path_join }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ APP_CONTROL_MODULES }}"
  loop_control:
    label: "{{ item.file }}"

- name: "🔗 Link {{ BIN_APP_CONTROL }} to the installed app-control"
  ansible.builtin.file:
    src: "{{ [ APP_CONTROL_LIB_DIR, 'app_control.py' ] | path_join }}"
    dest: "{{ BIN_APP_CONTROL }}"
    state: link
    force: true
    owner: root
    group: root

- name: "🧾 Write the app-control configuration"
  ansible.builtin.copy:
    content: "{{ APP_CONTROL_CONFIG | to_nice_json }}\n"
    dest: "{{ FILE_APP_CONTROL_CONFIG }}"
    owner: root
    group: root
    mode: "0644"

- include_tasks: 01_pages.yml

- include_tasks: 02_ssh.yml
  when: "'web-app-semaphore' in group_names"

- include_tasks: utils/once/flag.yml
