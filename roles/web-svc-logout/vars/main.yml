---
application_id: "web-svc-logout"
container_port: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.ports.internal.http') }}"
http_port: "{{ lookup('config', application_id, 'services.logout.ports.local.http') }}"
entity_name: "{{ application_id | entity_name }}"

LOGOUT_INSTANCES: "{{ lookup('domains')[application_id] | network_instances }}"
LOGOUT_CONTAINER: "{{ lookup('config', application_id, 'services.' ~ entity_name ~ '.name') }}"
LOGOUT_GATE_APPS: "{{ lookup('applications') | logout_gate_apps(group_names) }}"
LOGOUT_CONDUCTOR_BOOTSTRAP_UPSTREAM: "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/" # nocheck: external-cdn,url  the conductor of the pinned universal-logout image hardcodes this prefix; proxy.conf.j2 rewrites it to the internal asset
