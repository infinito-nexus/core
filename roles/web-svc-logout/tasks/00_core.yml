---
- include_tasks: utils/once/flag.yml

- name: "➕ Add logout domains to CSP connect-src"
  set_fact:
    webserver_csp_whitelist_extra_by_app: >-
      {{
        (webserver_csp_whitelist_extra_by_app | default({}))
        | combine(
          {
            application_id: (
              ((webserver_csp_whitelist_extra_by_app | default({})).get(application_id, {}))
              | combine(
                  {
                    'connect-src': LOGOUT_CONNECT_SRC_NEW
                  },
                  recursive=True
                )
            )
          },
          recursive=True
        )
      }}

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml
