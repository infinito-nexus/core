---
# nocheck: run-once

- name: 🧊 Freeze front proxy context before nested role loads
  ansible.builtin.set_fact:
    front_proxy_application_id: "{{ application_id }}"
    front_proxy_vhost_domains: "{{ lookup('network_siblings', domain | default(lookup('domain', application_id))) }}"
    front_proxy_service_key: >-
      {{
        webserver_proxy_service_key
        | default(
            lookup('config', application_id,
              'services.' ~ (application_id | get_entity_name) ~ '.proxy.service_key',
              application_id | get_entity_name
            )
          )
      }}
    front_proxy_http_port: >-
      {{
        http_port
        | default(
            lookup('config', application_id,
              'services.' ~ (application_id | get_entity_name) ~ '.ports.local.http',
              ''
            )
          )
      }}
    front_proxy_internal_port: >-
      {{
        proxy_internal_port
        | default(
            lookup('config', application_id,
              'services.' ~ (application_id | get_entity_name) ~ '.proxy.internal_port',
              ''
            )
          )
      }}
  changed_when: false

- name: 📂 Include dependencies
  include_role:
    name: "sys-svc-nss"
  when: not (run_once_sys_svc_nss | default(false) | bool)

- name: 🥾 Bootstrap Frontend Base
  ansible.builtin.include_role:
    name: sys-stk-front-base

- name: "🌐 Serve every network sibling of the vhost"
  ansible.builtin.include_tasks: vhost.yml
  loop: "{{ front_proxy_vhost_domains }}"
  loop_control:
    loop_var: front_proxy_domain
