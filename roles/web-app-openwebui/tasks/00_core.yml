---
- include_tasks: utils/once/flag.yml

- name: "🔐 Verify the gateway contract for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-litellm/tasks/utils/consumer_contract.yml') }}"
  when: OPENWEBUI_LITELLM_ENABLED | bool

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: sys-stk-full
  vars:
    compose_repository_pull: false

- name: "🎨 Render the in-house custom.css of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "custom.css.j2"
        dest: "{{ OPENWEBUI_CUSTOM_CSS_HOST }}"
        mode: "0644"
  when: OPENWEBUI_DESIGN_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers

- name: "👤 Converge the native administrator of {{ application_id }}"
  ansible.builtin.include_tasks: utils/admin.yml
  when:
    - not (OPENWEBUI_OIDC_ENABLED | bool)
    - not (OPENWEBUI_LDAP_ENABLED | bool)

- name: "🔌 Provision MCP tool-server access grants"
  ansible.builtin.include_tasks: utils/mcp.yml
  when: OPENWEBUI_MCP_SERVERS | length > 0
