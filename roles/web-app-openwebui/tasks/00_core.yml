---
- include_tasks: utils/once/flag.yml

- name: "🛑 Refuse the grant steps while Open WebUI refuses API keys"
  ansible.builtin.assert:
    that:
      - "(OPENWEBUI_ENABLE_API_KEYS | bool) or not (OPENWEBUI_API_KEY_NEEDED | bool)"
    fail_msg: >-
      The model grants (on with the LiteLLM gateway or svc-ai-agent-broker) and the
      MCP tool-server grants sign in with an administrator API key, which Open WebUI
      answers with HTTP 403 while ENABLE_API_KEYS is off, so
      applications.web-app-openwebui.services.openwebui.enable_api_keys must be true
      in the inventory (default true in roles/web-app-openwebui/meta/services.yml).
    quiet: true

- name: "📣 Report the managed Open WebUI settings the env file render overwrites"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/env.yml') }}"
  vars:
    forms_env_form: settings
    forms_env_fields: "{{ OPENWEBUI_SETTINGS }}"

- name: "🔎 Read the MCP tool servers the env file of {{ application_id }} holds"
  ansible.builtin.command:
    argv:
      - python3
      - -I
      - -c
      - "{{ lookup('file', 'python/tool_servers_held.py') }}"
      - "{{ lookup('container', application_id, 'files.env') }}"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  register: openwebui_tool_servers_held
  changed_when: false
  when: "'servers' in OPENWEBUI_MCP_CONFIG"

- name: "📣 Report the MCP tool servers the env file render overwrites"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    openwebui_tool_servers_current: "{{ openwebui_tool_servers_held.stdout | from_json }}"
    forms_drift_current: "{{ {'tools': {'servers': OPENWEBUI_MCP_CONFIG.servers | mcp_held(openwebui_tool_servers_current, '-')}} }}"
  when:
    - openwebui_tool_servers_held is not skipped
    - openwebui_tool_servers_held.stdout != 'null'

# nocheck: ansible-repeated-when-run  a block guard would be evaluated inside svc-ai-models, whose vars bind its own application_id
- name: "📦 Seed the model store before {{ application_id }} starts"
  ansible.builtin.include_role:
    name: svc-ai-models
  when:
    - OPENWEBUI_STORED | bool
    - run_once_svc_ai_models is not defined

- name: "🛑 Refuse to start {{ application_id }} without its artefacts in the store"
  ansible.builtin.include_role:
    name: svc-ai-models
    tasks_from: utils/require.yml
  vars:
    models_consumer: "{{ application_id }}"
    models_required: "{{ OPENWEBUI_ARTEFACTS }}"
  when: OPENWEBUI_STORED | bool

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "🎨 Render the in-house custom.css of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "custom.css.j2"
        dest: "{{ OPENWEBUI_CUSTOM_CSS_HOST }}"
        mode: "0644"
  when: OPENWEBUI_DESIGN_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers

- name: "👤 Converge the platform administrator of {{ application_id }} before any grant step"
  ansible.builtin.include_tasks: utils/admin.yml
  when: not (OPENWEBUI_OIDC_ENABLED | bool)

- name: "🔌 Provision MCP tool-server access grants"
  ansible.builtin.include_tasks: utils/mcp.yml
  when: OPENWEBUI_MCP_SERVERS | length > 0

- name: "🤖 Grant the gateway models to all users and each agent model to its group"
  ansible.builtin.include_tasks: utils/agent_models.yml
  when: OPENWEBUI_MODEL_GRANTS_ENABLED | bool
