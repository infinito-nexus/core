---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: OPENWEBUI
    resolve_compose_cid: "{{ OPENWEBUI_CONTAINER }}"

- name: "🔑 Publish the gateway models and bind each agent model to its group"
  ansible.builtin.shell:
    cmd: >- # nocheck: container-exec-resolver  runtime-resolved CID, run_once delegated to the hosting node
      IFS= read -r OPENWEBUI_ADMIN_PASSWORD && IFS= read -r OPENWEBUI_GATEWAY_KEY &&
      : "${OPENWEBUI_ADMIN_PASSWORD:?arrived empty on stdin}" {% if OPENWEBUI_LITELLM_ENABLED | bool %}&& : "${OPENWEBUI_GATEWAY_KEY:?arrived empty on stdin}" {% endif %}&&
      export OPENWEBUI_ADMIN_PASSWORD OPENWEBUI_GATEWAY_KEY && container exec -i
      -e OPENWEBUI_BASE=http://localhost:{{ OPENWEBUI_INTERNAL_HTTP_PORT | quote }}
      -e OPENWEBUI_ADMIN_EMAIL={{ OPENWEBUI_API_BOT_USER.email | quote }}
      -e OPENWEBUI_ADMIN_NAME={{ OPENWEBUI_API_BOT_USER.username | quote }}
      -e OPENWEBUI_ADMIN_PASSWORD
      -e OPENWEBUI_GATEWAY_URL={{ (LITELLM_BASE_LOCAL_URL if (OPENWEBUI_LITELLM_ENABLED | bool) else '') | quote }}
      -e OPENWEBUI_GATEWAY_KEY
      -e OPENWEBUI_AGENT_MODELS={{ OPENWEBUI_AGENT_MODELS | to_json | quote }}
      {{ OPENWEBUI_LOCAL_CID | quote }}
      python3 -
    stdin: |-
      {{ OPENWEBUI_API_BOT_USER.password }}
      {{ OPENWEBUI_LITELLM_API_KEY if (OPENWEBUI_LITELLM_ENABLED | bool) else '' }}
      {{ lookup('file', 'python/agent_model_grants.py') }}
  register: openwebui_model_grants
  retries: 30
  delay: 10
  until: openwebui_model_grants.rc == 0
  changed_when: openwebui_model_grants.stdout.startswith('CHANGED')
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  delegate_to: "{{ OPENWEBUI_HOST_NODE }}"
  run_once: true
