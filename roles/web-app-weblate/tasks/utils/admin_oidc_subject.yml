---
# include-gated: when: WEBLATE_OIDC_ENABLED | bool
- name: "🛡️ Assert Weblate signs in against the local Keycloak the bind reads"
  ansible.builtin.assert:
    that:
      - OIDC.CLIENT.ISSUER_URL == weblate_oidc_local_issuer
    fail_msg: >-
      Weblate signs in against {{ OIDC.CLIENT.ISSUER_URL }}, not the local
      Keycloak {{ weblate_oidc_local_issuer }}. The administrator bind reads its
      user id from the local Keycloak, so another issuer sends a different sub and
      locks the administrator out. Drop OIDC_OVERRIDE.URL and the OIDC_OVERRIDE.CLIENT
      issuer override, or disable SSO for Weblate.
    quiet: true
  vars:
    weblate_oidc_local_issuer: "{{ lookup('tls', 'web-app-keycloak', 'url.origin') ~ '/realms/' ~ OIDC.CLIENT.REALM }}"

- name: "🔍 Resolve the Keycloak hosting node and container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve/host_cid.yml') }}"
  vars:
    resolve_service_key: keycloak
    resolve_service_name: "{{ lookup('container_service', 'web-app-keycloak', 'keycloak') }}"
    resolve_output_prefix: WEBLATE_KEYCLOAK
    resolve_compose_cid: "{{ WEBLATE_KEYCLOAK_CONTAINER_ADDRESS }}"
    resolve_converge_retries: 60
    resolve_converge_delay: 5
    resolve_cid_filters: "--filter health=healthy"

- name: "🔍 Read the Keycloak user of the administrator"
  ansible.builtin.shell: >- # nocheck: container-exec-resolver  WEBLATE_KEYCLOAK_LOCAL_CID resolved at delegate_to runtime; container_address would return a manager-only subshell
    container exec -i {{ WEBLATE_KEYCLOAK_LOCAL_CID | quote }} sh -c '
    /opt/keycloak/bin/kcadm.sh config credentials --server http://127.0.0.1:8080 --realm master
    --user "$KEYCLOAK_PERMANENT_ADMIN_USERNAME" --password "$KEYCLOAK_PERMANENT_ADMIN_PASSWORD" >&2
    && exec /opt/keycloak/bin/kcadm.sh get users -r "$1" -q username="$2" -q exact=true
    --fields id,username --format csv --noquotes' _
    {{ OIDC.CLIENT.REALM | quote }} {{ WEBLATE_ADMIN_USERNAME | quote }}
  register: weblate_keycloak_admin_users
  changed_when: false
  retries: 6
  delay: 10
  until: weblate_keycloak_admin_users.rc == 0
  delegate_to: "{{ WEBLATE_KEYCLOAK_HOST_NODE }}"
  run_once: true

- name: "🔗 Pick the Keycloak user id of the administrator"
  ansible.builtin.set_fact:
    weblate_admin_oidc_subjects: "{{ weblate_keycloak_admin_users.stdout_lines | map('trim') | select('match', '[^,]+,' ~ (WEBLATE_ADMIN_USERNAME | lower | regex_escape)
      ~ '$') | map('regex_replace', ',.*$', '') | list }}"

- name: "🛑 Refuse anything but exactly one Keycloak user for the administrator"
  ansible.builtin.assert:
    that:
      - weblate_admin_oidc_subjects | length == 1
    fail_msg: >-
      Keycloak realm {{ OIDC.CLIENT.REALM }} returned {{ weblate_admin_oidc_subjects | length }}
      users named '{{ WEBLATE_ADMIN_USERNAME }}', so the administrator cannot be bound
      to its single sign-on identity and Weblate would refuse its login as email_in_use.
    quiet: true
