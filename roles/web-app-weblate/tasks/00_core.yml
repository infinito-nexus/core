---
- include_tasks: utils/once/flag.yml

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "📋 Stage the settings override that keeps Weblate from linking SSO logins by e-mail"
  stack_host_copy:
    src: python/settings_override.py
    dest: "{{ WEBLATE_SETTINGS_OVERRIDE_FILE }}"
    mode: "0644"
  notify: compose-up
  when: WEBLATE_OIDC_ENABLED | bool

- name: "🚿 flush handlers for '{{ application_id }}'"
  meta: flush_handlers

- name: "🔑 Hand the gateway the token it reads the memory with"
  ansible.builtin.include_tasks: utils/token.yml
  when: IS_STACK_HOST | bool

- name: "👥 Map the role groups onto superusers and site teams"
  ansible.builtin.include_tasks: utils/rbac.yml
