---
# Matrix-deploy variant overrides for web-app-weblate.
# See docs/contributing/artefact/files/role/variants.md for the file format.

- services:
    translate:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    css:
      enabled: true
      shared: true
    postgres:
      shared: true
    redis:
      shared: true
    container_backup:
      enabled: true
    tor:
      enabled: true

- services:
    translate:
      enabled: false
      shared: false
    sso:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false
    matomo:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    email:
      enabled: false
      shared: false
    css:
      enabled: false
      shared: false
    postgres:
      shared: false
    redis:
      shared: false
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override the base flag is a literal true and this round joins no backup host
    tor:
      enabled: true
