---
data:
  type: volume
  name: weblate_data
  mounts:
    - service: weblate
      target: &app_data_target /app/data
    - service: beat
      target: *app_data_target
    - service: worker
      target: *app_data_target
cache:
  type: volume
  name: weblate_cache
  nfs:
    uid: "1000"
    gid: "0"
    mode: "0770"
  mounts:
    - service: weblate
      target: &app_cache_target /app/cache
    - service: beat
      target: *app_cache_target
    - service: worker
      target: *app_cache_target
static:
  type: tmpfs
  mounts:
    - service: weblate
      target: &app_static_target /app/cache/static
      mode: &app_static_mode "1777"
    - service: beat
      target: *app_static_target
      mode: *app_static_mode
    - service: worker
      target: *app_static_target
      mode: *app_static_mode
