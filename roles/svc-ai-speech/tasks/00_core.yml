---
- include_tasks: utils/once/flag.yml

- name: "🧩 load the container manager for {{ application_id }}"
  include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: false

- name: "📦 Stage the synthesis server of {{ application_id }}"
  stack_host_copy:
    src: python/server.py
    dest: "{{ [PIPER_BUILD_DIR, 'server.py'] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "📦 Stage the hash-pinned piper wheels of {{ application_id }}"
  stack_host_copy:
    src: python/requirements.txt
    dest: "{{ [PIPER_BUILD_DIR, 'requirements.txt'] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "🔐 Stage the package-cache CA into the build context of {{ application_id }}"
  stack_host_copy:
    content: "{{ lookup('file', PIPER_CACHE_CA_FILE) if PIPER_CACHE_CA_FILE is file else '' }}"
    dest: "{{ [PIPER_BUILD_DIR, 'package-frontend-ca.crt'] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "🔐 Stage the package-cache CA installer of {{ application_id }}"
  stack_host_copy:
    src: "{{ lookup('path_absolute', PIPER_CACHE_CA_INSTALLER) }}"
    dest: "{{ [PIPER_BUILD_DIR, 'package-frontend-ca.sh'] | path_join }}"
    mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "📦 Seed the model store before {{ application_id }} starts"
  ansible.builtin.include_role:
    name: svc-ai-models
  when: run_once_svc_ai_models is not defined

- name: "🛑 Refuse to start {{ application_id }} without its models in the store"
  ansible.builtin.include_role:
    name: svc-ai-models
    tasks_from: utils/require.yml
  vars:
    models_consumer: "{{ application_id }}"
    models_required: "{{ SPEECH_ARTEFACTS }}"

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true
