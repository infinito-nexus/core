---
# nocheck: run-once

- name: ✅ Assert token
  ansible.builtin.assert:
    that: ["lookup('api', 'cloudflare.api_token') | length > 0"]
  no_log: "{{ cloudflare_no_log | bool }}"
  when: MODE_ASSERT | bool

- name: 🗂️ Queue every Cloudflare record for the first attempt
  ansible.builtin.set_fact:
    _cf_pending: "{{ cloudflare_records }}"
    _cf_retry: []

- name: 🔁 Apply the Cloudflare records, retrying only hung and transiently failed ones
  ansible.builtin.include_tasks:
    file: attempt.yml
    apply:
      delegate_to: localhost
      become: false
  loop: "{{ range(1, (cloudflare_attempts | int) + 1) | list }}"
  loop_control:
    loop_var: cloudflare_attempt

- name: 🛑 Fail for every Cloudflare record still failing after its last attempt
  ansible.builtin.fail:
    msg: >-
      Cloudflare records: {{ _cf_retry | length }} record(s) still failed after
      {{ cloudflare_attempts }} attempt(s) of at most {{ cloudflare_attempt_timeout }} s each:
      {% for r in _cf_retry %}{{ r.item.type }} {{ r.item.name }} ({{ r.item.zone }}): {{ r.error }}{{ ' || ' if not loop.last }}{% endfor %}
  when: _cf_retry | length > 0
