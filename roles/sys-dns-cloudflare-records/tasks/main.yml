---
# nocheck: run-once

- name: ✅ Assert token
  ansible.builtin.assert:
    that: ["lookup('api', 'cloudflare.api_token') | length > 0"]
  no_log: "{{ cloudflare_no_log | bool }}"
  when: MODE_ASSERT | bool

- name: 📌 Apply A/AAAA
  community.general.cloudflare_dns:
    api_token: "{{ lookup('api', 'cloudflare.api_token') }}"
    zone: "{{ item.zone }}"
    type: "{{ item.type }}"
    name: "{{ item.name }}"
    content: "{{ item.content }}"
    proxied: "{{ item.proxied | default(false) }}"
    ttl: "{{ item.ttl | default(1) }}"
    state: "{{ item.state | default('present') }}"
    solo: "{{ item.solo | default(false) }}"
  loop: "{{ cloudflare_records | selectattr('type','in',['A','AAAA']) | list }}"
  loop_control: { label: "{{ item.type }} {{ item.name }} -> {{ item.content }}" }
  delegate_to: localhost
  become: false
  # rationale: async; the jobs run on the controller and are reaped there below, before SRV and the rest of the play
  async: "{{ ASYNC_TIME }}"
  poll: "{{ ASYNC_POLL }}"
  no_log: "{{ cloudflare_no_log | bool }}"
  register: _cf_a
  changed_when: false
  failed_when:
    - _cf_a.failed
    - _cf_a.msg is not search('An identical record already exists|81058')

- name: 📌 Apply CNAME/MX/TXT
  community.general.cloudflare_dns:
    api_token: "{{ lookup('api', 'cloudflare.api_token') }}"
    zone: "{{ item.zone }}"
    type: "{{ item.type }}"
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    ttl: "{{ item.ttl | default(1) }}"
    priority: "{{ (item.type == 'MX') | ternary(item.priority | default(10), omit) }}"
    state: "{{ item.state | default('present') }}"
    solo: "{{ item.solo | default(false) }}"
  loop: "{{ cloudflare_records | selectattr('type','in',['CNAME','MX','TXT']) | list }}"
  loop_control: { label: "{{ item.type }} {{ item.name }} -> {{ item.value }}" }
  delegate_to: localhost
  become: false
  # rationale: async; the jobs run on the controller and are reaped there below, before SRV and the rest of the play
  async: "{{ ASYNC_TIME }}"
  poll: "{{ ASYNC_POLL }}"
  no_log: "{{ cloudflare_no_log | bool }}"
  register: _cf_cname
  changed_when: false
  failed_when:
    - _cf_cname.failed
    - _cf_cname.msg is not search('An identical record already exists|81058')

- name: ⏳ Reap the Cloudflare record jobs on the controller
  ansible.builtin.include_tasks:
    file: utils/async/reap.yml
    apply:
      delegate_to: localhost
      become: false
  vars:
    async_reap_jobs: "{{ _cf_a.results + _cf_cname.results }}"
    async_reap_label: "Cloudflare records"
    async_reap_tolerate:
      - "An identical record already exists"
      - "81058"

- name: 📌 Apply SRV
  community.general.cloudflare_dns:
    api_token: "{{ lookup('api', 'cloudflare.api_token') }}"
    zone: "{{ item.zone }}"
    type: SRV
    service: "{{ item.service }}"
    proto: "{{ item.proto }}"
    name: "{{ item.name }}"
    priority: "{{ item.priority }}"
    weight: "{{ item.weight }}"
    port: "{{ item.port }}"
    value: "{{ item.value }}"
    ttl: "{{ item.ttl | default(1) }}"
    state: "{{ item.state | default('present') }}"
    solo: "{{ item.solo | default(false) }}"
  loop: "{{ cloudflare_records | selectattr('type','equalto','SRV') | list }}"
  loop_control: { label: "SRV {{ item.service }}.{{ item.proto }} {{ item.name }} -> {{ item.value }}:{{ item.port }}" }
  ignore_errors: "{{ item.ignore_errors | default(true) }}"
  delegate_to: localhost
  become: false
  no_log: "{{ cloudflare_no_log | bool }}"
  changed_when: false
