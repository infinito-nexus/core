---
- include_tasks: utils/once/flag.yml

- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "🎬 Stage the service into the build context of '{{ application_id }}'"
  stack_host_copy:
    src: "python/"
    dest: "{{ [ACCESS_REQUEST_BUILD_DIR, 'python'] | path_join }}/"
    directory_mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: "📄 Render the role catalogue and settings of '{{ application_id }}'"
  stack_host_template:
    src: "config.json.j2"
    dest: "{{ ACCESS_REQUEST_CONFIG_HOST }}"
    mode: "0644"
  notify:
    - compose-up

- name: "🚿 Flush compose handlers for '{{ application_id }}'"
  ansible.builtin.meta: flush_handlers
