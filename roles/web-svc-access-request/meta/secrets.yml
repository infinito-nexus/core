---
credentials:
  zammad_api_token:
    description: "API token of the Zammad agent the service files access-request tickets as; web-app-zammad pins it on that agent."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 64
  sso_proxy_client_secret:
    description: "Client secret of the service's own oauth2-proxy client services.sso.oauth2.client; web-app-keycloak renders the client, the gate signs in with it."
    algorithm: sha256
    validation: "^[a-f0-9]{64}$"
