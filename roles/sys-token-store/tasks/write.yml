---
# REQUIRED:
#   sys_token_store_user_key
#   sys_token_store_app
#   sys_token_store_token  # must be non-empty

- name: "💾 Persist the token as a one-entry batch"
  ansible.builtin.import_tasks: write_many.yml
  vars:
    sys_token_store_entries:
      - user_key: "{{ sys_token_store_user_key }}"
        app: "{{ sys_token_store_app }}"
        token: "{{ sys_token_store_token }}"
