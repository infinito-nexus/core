---
# REQUIRED:
#   sys_token_store_entries  # list of {user_key, app, token}; every token must be non-empty

- name: "✅ Ensure store exists"
  ansible.builtin.import_tasks: 00_core.yml

- name: "🛑 Abort if a token is empty (do not persist empties)"
  ansible.builtin.assert:
    that:
      - sys_token_store_empty | length == 0
    fail_msg: "Refusing to persist the empty tokens of {{ sys_token_store_empty }}."
  vars:
    sys_token_store_empty: >-
      {%- set empty = [] -%}
      {%- for entry in sys_token_store_entries if (entry.token | string | trim) == '' -%}
      {%-   set _ = empty.append(entry.user_key ~ '/' ~ entry.app) -%}
      {%- endfor -%}
      {{ empty }}

- name: "🔨 Build merged structure"
  ansible.builtin.set_fact:
    sys_token_store_users_merged: >-
      {%- set layers = [] -%}
      {%- for entry in sys_token_store_entries -%}
      {%-   set _ = layers.append({entry.user_key: {'tokens': {entry.app: entry.token | string | trim}}}) -%}
      {%- endfor -%}
      {{ sys_token_store_users | combine(layers, recursive=True) }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "💾 Persist store (idempotent, single-writer via STACK_HOST)"
  ansible.builtin.copy:
    dest: "{{ FILE_TOKENS }}"
    owner: "{{ SYS_TOKEN_STORE_OWNER }}"
    group: "{{ SYS_TOKEN_STORE_GROUP }}"
    mode: "{{ SYS_TOKEN_STORE_FILE_MODE }}"
    content: "{{ {'users': sys_token_store_users_merged} | to_nice_yaml(indent=2, width=9999) }}"
  when: sys_token_store_users_merged != sys_token_store_users
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  become: true
  register: sys_token_store_persisted

- name: "🪞 Mirror the store onto the controller, where every users lookup reads"
  ansible.builtin.copy:
    dest: "{{ FILE_TOKENS }}"
    mode: "{{ SYS_TOKEN_STORE_FILE_MODE }}"
    content: "{{ {'users': sys_token_store_users_merged} | to_nice_yaml(indent=2, width=9999) }}"
  when:
    - sys_token_store_users_merged != sys_token_store_users
    - DEPLOYMENT_MODE == 'swarm'
  delegate_to: localhost # nocheck: localhost-become  FILE_TOKENS sits below the root-owned DIR_SECRETS
  run_once: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  register: sys_token_store_mirrored

- name: "🔄 Hand the written store to the lookups of the rest of the play"
  ansible.builtin.set_fact:
    sys_token_store_users: "{{ sys_token_store_users_merged }}"
  when: sys_token_store_users_merged != sys_token_store_users
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🧊 Re-render the users SPOT the new tokens invalidated
  applications_carrier: {}
  when: sys_token_store_persisted is changed or sys_token_store_mirrored is changed
