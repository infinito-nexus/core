---
- block:
    - name: 📦 Install sudo (Arch/Manjaro)
      package_install: # nocheck: package-install user-root needs sudo before the update role and the batch run
        id: sudo
    - name: ▶️ run the sudo tasks once
      set_fact:
        run_once_sys_sudo: true
  when: run_once_sys_sudo is not defined
