---
# Param: patch_volume      - docker volume the app persists its config in
# Param: patch_config_rel  - config path relative to that volume's mountpoint
# Param: patch_expression  - sed expression, with @PASSWORD@ where the value goes
- name: "🔑 Realign the persisted database password wherever {{ patch_volume }} lives"
  ansible.builtin.script: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/files/shell/patch_persisted_password.sh') }}"
  environment:
    PATCH_VOLUME: "{{ patch_volume }}"
    PATCH_CONFIG_REL: "{{ patch_config_rel }}"
    PATCH_EXPRESSION: "{{ patch_expression }}"
    PATCH_PASSWORD: "{{ lookup('database', application_id, 'password') | sed_escape('|') }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  register: patch_persisted
  changed_when: "'PATCHED' in patch_persisted.stdout"
  delegate_to: "{{ item }}"
  loop: "{{ (groups['svc-swarm-node'] | default([])) or [inventory_hostname] }}"
