---
# nocheck: garbage-collector-required  shared storage plumbing; the data belongs to the applications that mount it
nfs-server:
  enabled: "{{ 'svc-storage-nfs-server' in group_names }}"
  shared: "{{ 'svc-storage-nfs-server' in group_names }}"
  bond: 1
nfs-client:
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  name: nfs-client
  # nocheck: unwatched-version  Reason: the NFS protocol generation the client mounts with, not a release of a product
  nfs_version: 4
  lifecycle: beta
  min_storage: "50MB"
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "128m"
  pids_limit: 128
  run_after:
    - svc-storage-nfs-server

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  the role runs no container, so Semaphore has nothing to pause
  status: started
