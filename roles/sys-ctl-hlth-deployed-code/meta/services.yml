---
# nocheck: required-by-coverage — included by sys-svc-wazuh-agent on every host that runs an agent, not through the service loader
deployed-code:
  lifecycle: beta
  # Exception: the timer schedule lives with the one role that runs it, not in group_vars/all/07_schedule.yml, so the check owns its own cadence (SRP) and an inventory overrides it under applications.sys-ctl-hlth-deployed-code.services.deployed-code.schedule.
  schedule: "*-*-* *:40:00"
  # Exception: the checkout list lives in this role, not in group_vars/all, because only this check and the Wazuh agent's FIM read it, and both read it from here (SPOT).
  # Param checkouts: the Infinito.Nexus git working copies this host deploys from, each a mapping of its absolute `path` and the `provider` its origin lives on (github, gitea or gitlab, a key of providers). For each one, the hourly check (and one run at the end of every deploy) alerts when a tracked file differs from HEAD, when HEAD is not on the origin default branch, or when that provider does not report HEAD as verified, and a failing check is its own alert; the Wazuh agent watches the same paths in real time, without .git, so tampering shows up at once instead of at the next run. Empty, the default: no timer and no FIM change. A development checkout that runs feature branches does not belong here, because every run would alert.
  checkouts: []
  # Exception: the proof checkout lives in this role because it is one of its checkouts, used only by the Wazuh CLI test in dev and CI (SPOT).
  # Param proof_checkout: a throwaway checkout the Wazuh CLI test may wipe and rebuild to prove each rule; it must also be listed in checkouts. Empty outside dev and CI.
  proof_checkout: ""
  # Exception: the API base URLs live in this role's config, not in defaults/main.yml, so the config lookup is the one place an inventory overrides them, per provider, under applications.sys-ctl-hlth-deployed-code.services.deployed-code.providers.<provider>.api_url (SPOT).
  # Param providers: per git provider, the REST API base URL the signature check asks. Gitea and GitLab default to this deployment's own web-app-gitea and web-app-gitlab when a host runs them, and are empty otherwise.
  providers:
    github:
      api_url: "https://api.github.com"
    gitea:
      api_url: "{{ (lookup('tls', 'web-app-gitea', 'url.base') ~ '/api/v1') if (groups['web-app-gitea'] | default([]) | length > 0) else '' }}"
    gitlab:
      api_url: "{{ (lookup('tls', 'web-app-gitlab', 'url.base') ~ '/api/v4') if (groups['web-app-gitlab'] | default([]) | length > 0) else '' }}"
