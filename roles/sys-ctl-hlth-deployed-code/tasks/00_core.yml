---
- name: 📂 Include dependency 'sys-ctl-alm-compose'
  include_role:
    name: sys-ctl-alm-compose
  when: run_once_sys_ctl_alm_compose is not defined

- name: 📦 Install git
  package_install:
    id: git

- name: "📁 Create {{ HLTH_DEPLOYED_CODE_DIR }}"
  file:
    path: "{{ HLTH_DEPLOYED_CODE_DIR }}"
    state: directory
    mode: "0755"

- name: "🔑 Store the read-only {{ item.key }} token for the signature check"
  copy:
    content: "{{ item.value }}"
    dest: "{{ HLTH_DEPLOYED_CODE_TOKEN_FILES[item.key] }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ HLTH_DEPLOYED_CODE_TOKENS | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

# Exception: include_tasks, not include_role, because inside the settings role system_service_id names that role, so HLTH_DEPLOYED_CODE_DIR would resolve to the settings check's directory.
- name: 📋 Copy the git provider clients next to the check
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-ctl-hlth-git-settings/tasks/utils/clients.yml') }}"
  vars:
    git_clients_dest: "{{ HLTH_DEPLOYED_CODE_DIR }}"

- name: 📄 Store the checkouts and their providers
  copy:
    content: "{{ HLTH_DEPLOYED_CODE_CONFIG | to_nice_json }}"
    dest: "{{ HLTH_DEPLOYED_CODE_CONFIG_FILE }}"
    mode: "0644"

- include_role:
    name: sys-service
  vars:
    system_service_on_calendar: "{{ HLTH_DEPLOYED_CODE_SCHEDULE }}"
    system_service_timer_enabled: true
    system_service_tpl_exec_start: >-
      {{ system_service_script_exec }}
      --config {{ HLTH_DEPLOYED_CODE_CONFIG_FILE }}
      --tag {{ HLTH_DEPLOYED_CODE_TAG }}
      --timeout {{ HLTH_DEPLOYED_CODE_TIMEOUT }}
    system_service_tpl_on_failure: "{{ SYS_SERVICE_ON_FAILURE_COMPOSE }}"
    system_service_force_flush_final: true

- include_tasks: utils/once/flag.yml
