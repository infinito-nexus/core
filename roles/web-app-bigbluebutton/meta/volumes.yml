---
bigbluebutton:
  type: volume
  name: bigbluebutton_bigbluebutton
  mounts:
    - service: bbb-web
      target: &var_bigbluebutton_target /var/bigbluebutton
    - service: nginx
      target: *var_bigbluebutton_target
    - service: bbb-export-annotations
      target: *var_bigbluebutton_target
    - service: periodic
      target: *var_bigbluebutton_target
    - service: prometheus-exporter
      target: *var_bigbluebutton_target
      read_only: true
    - service: recordings
      target: *var_bigbluebutton_target
freeswitch:
  type: volume
  name: bigbluebutton_freeswitch
  mounts:
    - service: bbb-web
      target: &var_freeswitch_meetings_target /var/freeswitch/meetings
    - service: freeswitch
      target: *var_freeswitch_meetings_target
    - service: apps-akka
      target: *var_freeswitch_meetings_target
    - service: recordings
      target: *var_freeswitch_meetings_target
mediasoup:
  type: volume
  name: bigbluebutton_mediasoup
  mounts:
    - service: webrtc-sfu
      target: &var_mediasoup_target /var/mediasoup
    - service: periodic
      target: *var_mediasoup_target
    - service: recordings
      target: *var_mediasoup_target
redis:
  type: volume
  name: bigbluebutton_redis
  mounts:
    - service: redis
      target: /data
database:
  type: volume
  name: bigbluebutton_database
  mounts:
    - service: postgres
      target: /var/lib/postgresql/data
greenlight:
  type: volume
  name: bigbluebutton_greenlight
  mounts:
    - service: greenlight
      target: /usr/src/app/storage
coturn:
  type: volume
  name: bigbluebutton_coturn
  mounts:
    - service: coturn
      target: /var/lib/coturn
# nocheck: meta-volume-file-bind-should-be-config  Reason: compose_mode_force role, and the upstream compose binds this target, which only a volume entry replaces
html5_settings:
  type: bind
  source: "{{ [lookup('container', 'web-app-bigbluebutton', 'directories.instance'), 'bbb-html5.yml'] | path_join }}"
  read_only: true
  mounts:
    - service: apps-akka
      target: /etc/bigbluebutton/bbb-html5.yml
