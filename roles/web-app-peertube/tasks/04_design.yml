---
- name: "🔑 PEERTUBE | Obtain an API token for root"
  ansible.builtin.command:
    argv: "{{ PEERTUBE_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', PEERTUBE_ROOT_TOKEN_FORM, headers=PEERTUBE_TOKEN_HEADERS) }}"
  environment:
    HTTP_METHOD: POST
    HTTP_URL: "{{ PEERTUBE_NETNS_URL }}/api/v1/users/token"
  register: peertube_design_token
  retries: 30
  delay: 2
  until: peertube_design_token.rc == 0 and (peertube_design_token.stdout | from_json).status == 200
  changed_when: false
  delegate_to: "{{ PEERTUBE_HOST_NODE }}"
  become: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔑 PEERTUBE | Keep the API headers of root"
  ansible.builtin.set_fact:
    peertube_design_headers:
      Host: "{{ PEERTUBE_HOSTNAME }}"
      Authorization: "Bearer {{ ((peertube_design_token.stdout | from_json).content | from_json).access_token }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔍 PEERTUBE | Read the logos PeerTube serves"
  ansible.builtin.command:
    argv: "{{ PEERTUBE_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', '', headers=PEERTUBE_API_HEADERS) }}"
  environment:
    HTTP_METHOD: GET
    HTTP_URL: "{{ PEERTUBE_NETNS_URL }}/api/v1/config"
  register: peertube_design_config
  retries: 30
  delay: 2
  until: peertube_design_config.rc == 0 and (peertube_design_config.stdout | from_json).status == 200
  changed_when: false
  delegate_to: "{{ PEERTUBE_HOST_NODE }}"
  become: true

- name: "🔍 PEERTUBE | Keep the logos PeerTube serves"
  ansible.builtin.set_fact:
    peertube_design_served: "{{ ((peertube_design_config.stdout | from_json).content | from_json).instance.logo }}"

- name: "🎨 PEERTUBE | Apply the corporate logos"
  ansible.builtin.include_tasks: design/apply.yml
  when:
    - PEERTUBE_DESIGN_ENABLED | bool
    - PEERTUBE_DESIGN.logo is string

- name: "🧹 PEERTUBE | Remove the corporate logos the role uploaded"
  ansible.builtin.include_tasks: design/remove.yml
  when: not (PEERTUBE_DESIGN_ENABLED | bool and PEERTUBE_DESIGN.logo is string)
