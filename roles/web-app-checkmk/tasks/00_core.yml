---
- include_tasks: utils/once/flag.yml

- name: "🔧 Run Checkmk manager-side operations"
  include_tasks: 01_manager_ops.yml
  when: IS_STACK_HOST | bool

- name: "🔌 Serve MCP from {{ application_id }}"
  ansible.builtin.include_tasks: utils/mcp.yml
  when: CHECKMK_MCP_ENABLED | bool

- name: "📊 Monitor the runner pool of the infra runner from {{ application_id }}"
  ansible.builtin.include_tasks: utils/pool.yml
  when:
    - CHECKMK_POOL_ENABLED | bool
    - IS_STACK_HOST | bool
