---
- name: "📁 ETCD | Ensure secrets directory"
  ansible.builtin.file:
    path: "{{ ETCD_SECRETS_DIR }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "📖 ETCD | Read the root password the running cluster was given"
  ansible.builtin.slurp:
    src: "{{ [ETCD_SECRETS_DIR, 'root'] | path_join }}"
  register: etcd_previous_root
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔧 ETCD | Remember it for authenticating a rotation"
  ansible.builtin.set_fact:
    etcd_previous_root_password: "{{ (etcd_previous_root.content | b64decode) if (etcd_previous_root.content is defined) else ETCD_ROOT_PASSWORD }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔑 ETCD | Write the root password file a later rotation authenticates with"
  ansible.builtin.copy:
    content: "{{ ETCD_ROOT_PASSWORD }}"
    dest: "{{ [ETCD_SECRETS_DIR, 'root'] | path_join }}"
    owner: root
    group: root
    mode: "0400"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
