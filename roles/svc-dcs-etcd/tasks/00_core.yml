---
- include_tasks: utils/once/flag.yml

- name: "🔐 ETCD | Mint TLS material and password files on the stack host"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  block:
    - name: "🔐 ETCD | TLS from the coordination-store CA"
      ansible.builtin.include_tasks: 01_tls.yml

    - name: "🔑 ETCD | Password files delivered as swarm secrets"
      ansible.builtin.include_tasks: 02_secrets.yml

- name: "➕ ETCD | Register replacement members of a running cluster"
  ansible.builtin.include_tasks:
    file: 04_join.yml
    apply:
      run_once: true
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔧 Setup container network for {{ application_id }}"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/routine.yml') }}"
  vars:
    compose_handlers_flush: true
    application_id: "svc-dcs-etcd"
    database_consumer_id: "svc-dcs-etcd"

- name: "👤 ETCD | Users, prefix roles and authentication"
  ansible.builtin.include_tasks:
    file: 03_auth.yml
    apply:
      run_once: true
