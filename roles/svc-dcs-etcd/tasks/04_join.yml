---
- name: "🔍 ETCD | Ask each running member for the member list"
  ansible.builtin.shell: >
    container exec -e ETCDCTL_USER
    {{ lookup('container_address', application_id, entity_name, instance=item) }}
    {{ ETCDCTL }} member list -w simple
  environment:
    ETCDCTL_USER: "root:{{ ETCD_ROOT_PASSWORD }}"
  register: etcd_join_probe
  delegate_to: "{{ item.host }}"
  loop: "{{ ETCD_INSTANCES.instances }}"
  loop_control:
    label: "{{ item.service }}"
  changed_when: false
  failed_when: false

- name: "🔍 ETCD | Ask again with the root password from before a rotation"
  ansible.builtin.shell: >
    container exec -e ETCDCTL_USER
    {{ lookup('container_address', application_id, entity_name, instance=item) }}
    {{ ETCDCTL }} member list -w simple
  environment:
    ETCDCTL_USER: "root:{{ etcd_previous_root_password }}"
  register: etcd_join_probe_previous
  delegate_to: "{{ item.host }}"
  loop: "{{ ETCD_INSTANCES.instances }}"
  loop_control:
    label: "{{ item.service }}"
  changed_when: false
  failed_when: false
  when:
    - etcd_join_probe.results | selectattr('rc', 'equalto', 0) | list | length == 0
    - etcd_previous_root_password != ETCD_ROOT_PASSWORD

- name: "🤔 ETCD | Pick a live member and the declared members it does not know"
  ansible.builtin.set_fact:
    etcd_join_live: "{{ _live }}"
    ETCD_JOINING_MEMBERS: >-
      {{ ETCD_MEMBERS
         | reject('in', _known_members) | list if _live else [] }}
    etcd_cluster_root_password: "{{ etcd_previous_root_password if _by_previous | length > 0 else ETCD_ROOT_PASSWORD }}"
  vars:
    _by_current: "{{ etcd_join_probe.results | selectattr('rc', 'equalto', 0) | list }}"
    _by_previous: "{{ (etcd_join_probe_previous.results | default([])) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list }}"
    _answered: "{{ _by_current + _by_previous }}"
    _live: "{{ _answered | first | default({}) }}"
    _known_peer_urls: >-
      {{ (_live.stdout_lines | default([]))
         | map('split', ', ') | map(attribute=3) | list }}
    _known_members: "{{ _known_peer_urls | map('urlsplit', 'hostname') | list }}"

- name: "➕ ETCD | Register each replacement member before it starts"
  ansible.builtin.shell: >
    container exec -e ETCDCTL_USER
    {{ lookup('container_address', application_id, entity_name, instance=etcd_join_live.item) }}
    {{ ETCDCTL }} member add {{ item | quote }}
    --peer-urls={{ ('https://' ~ item ~ ':' ~ ETCD_PEER_PORT) | quote }}
  environment:
    ETCDCTL_USER: "root:{{ etcd_cluster_root_password }}"
  delegate_to: "{{ etcd_join_live.item.host }}"
  loop: "{{ ETCD_JOINING_MEMBERS }}"
