---
application_id: svc-dcs-etcd
entity_name: "{{ application_id | get_entity_name }}"

ETCD_INSTANCES: "{{ lookup('db_instances', application_id) }}"
ETCD_MEMBERS: "{{ ETCD_INSTANCES.instances | map(attribute='service') | list }}"
ETCD_CLIENT_PORT: "{{ lookup('config', application_id, 'services.etcd.ports.internal.client') }}"
ETCD_PEER_PORT: "{{ lookup('config', application_id, 'services.etcd.ports.internal.peer') }}"
ETCD_INITIAL_CLUSTER: "{{ ETCD_MEMBERS | map('regex_replace', '^(.*)$', '\\1=https://\\1:' ~ ETCD_PEER_PORT) | join(',') }}"
ETCD_CLUSTER_TOKEN: "infinito-{{ entity_name }}"
ETCD_JOINING_MEMBERS: []
ETCD_IMAGE: "{{ lookup('config', application_id, 'services.etcd.image') }}"
ETCD_VERSION: "{{ lookup('config', application_id, 'services.etcd.version') }}"
ETCD_UID: "{{ lookup('volume', application_id, 'tls_key').uid }}"

ETCD_CONFIG_DIR: "{{ lookup('container', application_id, 'directories.config') }}"
ETCD_TLS_CA_CERT: "{{ lookup('volume', application_id, 'tls_ca', field='source') }}"
ETCD_TLS_CERT: "{{ lookup('volume', application_id, 'tls_cert', field='source') }}"
ETCD_TLS_KEY: "{{ lookup('volume', application_id, 'tls_key', field='source') }}"
ETCD_TLS_DIR: "{{ ETCD_TLS_CA_CERT | dirname }}"
ETCD_SECRETS_DIR: "{{ [ETCD_CONFIG_DIR, 'secrets'] | path_join }}"
ETCD_TLS_CA_KEY: "{{ [ETCD_TLS_DIR, 'ca.key'] | path_join }}"
ETCD_TLS_CSR: "{{ [ETCD_TLS_DIR, 'etcd.csr'] | path_join }}"
ETCD_TLS_CONF: "{{ [ETCD_TLS_DIR, 'etcd.cnf'] | path_join }}"
ETCD_TLS_DAYS: 3650
ETCD_TLS_KEY_BITS: 4096

ETCD_ROOT_PASSWORD: "{{ lookup('config', application_id, 'secrets.credentials.ETCD_ROOT_PASSWORD') }}"
ETCD_CONSUMER_CREDENTIAL: etcd_password
ETCD_CONSUMERS: >-
  {%- set out = [] -%}
  {%- for role_id, app in lookup('applications') | dictsort -%}
    {%- set etcd = app.get('services', {}).get('etcd', {}) -%}
    {%- if etcd.get('user') and (lookup('config', role_id, 'services.etcd.enabled') | bool) -%}
      {%- set _ = out.append({
        'user': etcd.user,
        'prefix': etcd.prefix,
        'password': lookup('config', role_id, 'secrets.credentials.' ~ ETCD_CONSUMER_CREDENTIAL)}) -%}
    {%- endif -%}
  {%- endfor -%}
  {{ out }}

ETCD_EXEC_INSTANCE: "{{ ETCD_INSTANCES.instances | first }}"
ETCD_EXEC_HOST: "{{ ETCD_EXEC_INSTANCE.host or STACK_HOST }}"
ETCD_EXEC_ADDRESS: "{{ lookup('container_address', application_id, entity_name, instance=ETCD_EXEC_INSTANCE) }}"
ETCD_DATA_TARGET: "{{ lookup('volume', application_id, 'data').target }}"
ETCD_CA_TARGET: "{{ lookup('volume', application_id, 'tls_ca').target }}"
ETCD_CERT_TARGET: "{{ lookup('volume', application_id, 'tls_cert').target }}"
ETCD_KEY_TARGET: "{{ lookup('volume', application_id, 'tls_key').target }}"
ETCDCTL: >-
  etcdctl --endpoints=https://127.0.0.1:{{ ETCD_CLIENT_PORT }}
  --cacert={{ ETCD_CA_TARGET }}
ETCD_AUTH_REQUIRED_ERROR: "user name is empty"
ETCD_AUTH_FAILED_ERROR: "authentication failed"
ETCD_RETRIES: 30
ETCD_DELAY: 5
