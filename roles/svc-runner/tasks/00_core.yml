---
- include_tasks: utils/once/flag.yml

- name: 🧭 Validate the runner flavor
  ansible.builtin.assert:
    that:
      - RUNNER_FLAVOR in RUNNER_FLAVORS
    fail_msg: >-
      services.runner.flavor '{{ RUNNER_FLAVOR }}' must be one of
      {{ RUNNER_FLAVORS | list | join(', ') }}
    quiet: true

- name: 🧭 Validate the checkout, image and user of the pool runners
  ansible.builtin.assert:
    that:
      - RUNNER_SRC_DIR | length > 0
      - RUNNER_TOOLCHAIN_IMAGE | length > 0
      - RUNNER_OPERATOR_UID | string is match('[1-9][0-9]*$')
      - RUNNER_OPERATOR_GID | string is match('[1-9][0-9]*$')
    fail_msg: >-
      the {{ RUNNER_FLAVOR }} flavor runs its pool loop from
      services.runner.src_dir in services.runner.toolchain_image as
      services.runner.operator_uid:operator_gid, a user other than root;
      make infra-update sets them from INFINITO_RUNNER_SRC_DIR (export the
      checkout whose code the pool runs, below a worktree root, in .env or
      the environment), INFINITO_IMAGE and the invoking user
      (got {{ [RUNNER_SRC_DIR, RUNNER_TOOLCHAIN_IMAGE, RUNNER_OPERATOR_UID,
      RUNNER_OPERATOR_GID] | to_json }})
    quiet: true
  when: RUNNER_TAKES_LOCAL_JOBS | bool

- name: 🧭 Validate the worktree roots the runner flavor mounts
  ansible.builtin.assert:
    that:
      - >-
        RUNNER_WORKTREE_ROOTS is sequence
        and RUNNER_WORKTREE_ROOTS is not string
        and RUNNER_WORKTREE_ROOTS is not mapping
        and RUNNER_WORKTREE_ROOTS | length > 0
        and RUNNER_WORKTREE_ROOTS | reject('string') | list | length == 0
        and RUNNER_WORKTREE_ROOTS | reject('match', '/[^/]') | list | length == 0
        and RUNNER_WORKTREE_ROOTS | select('search', '(^|/)[.][.]?(/|$)')
        | list | length == 0
        and RUNNER_WORKTREE_ROOTS | select('search', ':') | list | length == 0
        and RUNNER_WORKTREE_ROOTS | map('regex_replace', '/+', '/')
        | map('regex_replace', '/$', '')
        | select('match', '/(root|home(/[^/]+)?|Users(/[^/]+)?|var(/home(/[^/]+)?)?)$')
        | list | length == 0
      - >-
        RUNNER_SRC_DIR is match('/[^/]')
        and RUNNER_SRC_DIR is not search('(^|/)[.][.]?(/|$)')
        and RUNNER_SRC_DIR is match('(' ~
        (RUNNER_WORKTREE_ROOTS | map('regex_replace', '/+$', '')
        | map('regex_escape') | join('|')) ~ ')(/|$)')
    fail_msg: >-
      the {{ RUNNER_FLAVOR }} flavor mounts its worktree roots and needs
      services.runner.worktree_roots as a list of absolute directories other
      than /, without ':' and neither a home directory nor a parent of one,
      that holds its checkout {{ RUNNER_SRC_DIR }}
      (roots: {{ RUNNER_WORKTREE_ROOTS | to_json }})
    quiet: true
  when: RUNNER_MOUNTS_WORKTREES | bool

- name: 🧭 Validate the job queue the runner flavor takes its jobs from
  ansible.builtin.assert:
    that:
      - >-
        RUNNER_QUEUE_DIR is string
        and RUNNER_QUEUE_DIR is match('/[^/]')
        and RUNNER_QUEUE_DIR is not search('(^|/)[.][.]?(/|$)')
        and RUNNER_QUEUE_DIR is not search(':')
    fail_msg: >-
      the {{ RUNNER_FLAVOR }} flavor takes its jobs from a local queue and
      needs services.runner.queue_dir as an absolute directory other than /,
      without ':' (got {{ RUNNER_QUEUE_DIR | to_json }})
    quiet: true
  when: RUNNER_TAKES_LOCAL_JOBS | bool

- name: 🐳 Ensure Docker is installed and running
  ansible.builtin.include_role:
    name: sys-svc-container
    tasks_from: 00_core.yml
  when: run_once_sys_svc_container is not defined

- name: 🔧 Tune the runner-host kernel limits for parallel DiD containers
  ansible.builtin.include_role:
    name: sys-sysctl
  vars:
    sys_sysctl_owner: "{{ RUNNER_SYSCTL_OWNER }}"
    sys_sysctl_parameters: "{{ RUNNER_SYSCTL_PARAMETERS }}"

- name: 👥 Create GitHub Actions runner system group
  group:
    name: "{{ RUNNER_USER }}"
    gid: "{{ RUNNER_GID }}"
    system: true

- name: 👤 Create GitHub Actions runner system user
  user:
    name: "{{ RUNNER_USER }}"
    uid: "{{ RUNNER_UID }}"
    group: "{{ RUNNER_USER }}"
    groups: docker
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ RUNNER_INSTALL_DIR }}"
    create_home: true

- name: 🔑 Grant passwordless sudo for CI cleanup operations
  template: # nocheck: stack-host-template (writes host /etc/sudoers.d, gated per-host on DOCKER_IN_CONTAINER)
    src: sudoers.j2
    dest: "/etc/sudoers.d/{{ RUNNER_USER }}"
    mode: "0440"
    validate: visudo -cf %s
  when: not (DOCKER_IN_CONTAINER | bool)

- name: 📂 Create runner base directory
  file:
    path: "{{ RUNNER_INSTALL_DIR }}"
    state: directory
    owner: "{{ RUNNER_USER }}"
    group: "{{ RUNNER_USER }}"
    mode: "0755"

- name: 📂 Provide the local job queue and its Docker socket for the queue group
  include_tasks: 01_queue.yml
  when: RUNNER_TAKES_LOCAL_JOBS | bool

- name: 📦 Provide the GitHub Actions runner binary
  when: RUNNER_REGISTERS_WITH_GITHUB | bool
  block:
    - name: 🔍 Fetch latest GitHub Actions runner version tag
      uri_retry:
        url: https://api.github.com/repos/actions/runner/releases/latest
        return_content: true
      register: _runner_latest_release
      delegate_to: localhost
      become: false
      changed_when: false

    - name: 🏷️ Set resolved runner version
      set_fact:
        runner_resolved_version: "{{ _runner_latest_release.json.tag_name | regex_replace('^v', '') }}"

    - name: ⬇️ Download GitHub Actions runner binary
      get_url_retry:
        url: "https://github.com/actions/runner/releases/download/v{{ runner_resolved_version }}/actions-runner-linux-x64-{{ runner_resolved_version }}.tar.gz"
        dest: "{{ RUNNER_INSTALL_DIR }}/actions-runner.tar.gz"
        owner: "{{ RUNNER_USER }}"
        group: "{{ RUNNER_USER }}"
        mode: "0644"

- name: 🔍 Find existing runner instance directories
  find:
    paths: "{{ RUNNER_INSTALL_DIR }}"
    file_type: directory
    patterns: "^[0-9]+$"
    use_regex: true
  register: _existing_runner_dirs

- name: 🧮 Determine runner instances to remove
  set_fact:
    _runners_to_remove: >-
      {{ _existing_runner_dirs.files
         | map(attribute='path')
         | map('basename')
         | map('int')
         | select('gt', RUNNER_COUNT | int)
         | list }}

- name: 🗑️ Remove runner instances beyond RUNNER_COUNT
  include_tasks: 02_cleanup_instance.yml
  loop: "{{ _runners_to_remove }}"
  loop_control:
    loop_var: runner_instance
  when: _runners_to_remove | length > 0

- name: 🔍 Gather all containers for orphan detection
  community.docker.docker_host_info: # nocheck: docker-module-uses-container-cli  read-only info module; returns structured container facts the wrapper's raw JSON would need parsed
    containers: true
  register: _all_containers_info
  changed_when: false

- name: 🗑️ Remove orphaned runner containers (beyond RUNNER_COUNT)
  ansible.builtin.command: "container rm -f {{ (item.Names | default([item.Name]))[0] | regex_replace('^/', '') }}"
  vars:
    _project: "{{ (item.Labels | default({}))['com.docker.compose.project'] | default('') }}"
    _instance_num: "{{ _project | regex_replace('^' ~ RUNNER_PROJECT_PREFIX ~ '-', '') }}"
  loop: "{{ _all_containers_info.containers }}"
  loop_control:
    label: "{{ (item.Names | default([item.Name]))[0] }}"
  when:
    - _project is match('^' ~ RUNNER_PROJECT_PREFIX ~ '-[0-9]+$')
    - _instance_num | int > RUNNER_COUNT | int
  changed_when: true
  failed_when: false

- name: 🚿 Unmount tmpfs from orphaned Docker volume dirs (beyond RUNNER_COUNT)
  ansible.builtin.mount:
    path: "{{ RUNNER_DOCKER_BASE }}/{{ item }}"
    state: unmounted
  loop: "{{ range(RUNNER_COUNT | int + 1, RUNNER_COUNT | int + 50) | list }}"
  failed_when: false
  changed_when: false

- name: 🗑️ Remove orphaned Docker volume dirs (beyond RUNNER_COUNT)
  ansible.builtin.file:
    path: "{{ RUNNER_DOCKER_BASE }}/{{ item }}"
    state: absent
  loop: "{{ range(RUNNER_COUNT | int + 1, RUNNER_COUNT | int + 50) | list }}"

- name: 🚿 Unmount any existing tmpfs from inner Docker volume directories
  ansible.builtin.mount:
    path: "{{ RUNNER_DOCKER_BASE }}/{{ item }}"
    state: unmounted
  loop: "{{ range(1, RUNNER_COUNT | int + 1) | list }}"
  failed_when: false
  changed_when: false

- name: 📂 Create inner Docker volume directories for runners
  file:
    path: "{{ RUNNER_DOCKER_BASE }}/{{ item }}"
    state: directory
    owner: "{{ RUNNER_USER }}"
    group: "{{ RUNNER_USER }}"
    mode: "0755"
  loop: "{{ range(1, RUNNER_COUNT | int + 1) | list }}"

- name: 🔍 Look up docker group GID
  ansible.builtin.command: getent group docker
  register: _docker_group_entry
  changed_when: false
  failed_when: false

- name: 🏷️ Set docker GID fact
  ansible.builtin.set_fact:
    _runner_docker_gid: "{{ (_docker_group_entry.stdout | split(':'))[2] | default(RUNNER_DOCKER_GID_FALLBACK) }}"

- name: 🧩 Load the compose flow of the runner stack
  ansible.builtin.include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: false

- name: 📄 Stage the runner entrypoint into the build context
  stack_host_copy:
    src: "{{ RUNNER_ENTRYPOINT }}"
    dest: "{{ [lookup('container', application_id, 'directories.instance'), 'entrypoint.sh'] | path_join }}"
    mode: "0755"
  notify:
    - compose-build
    - compose-up

- name: 🚀 Provision runner instances
  include_tasks: 03_instance.yml
  loop: "{{ range(1, RUNNER_COUNT | int + 1) | list }}"
  loop_control:
    loop_var: runner_instance

- name: 📦 Build and publish the runner image to the swarm registry
  include_tasks: 04_image.yml
  when:
    - IS_SWARM_MODE | bool
    - IS_STACK_HOST | bool

- name: 📥 Pull runner image from the swarm registry
  ansible.builtin.command:
    argv:
      - container
      - pull
      - "{{ RUNNER_IMAGE_REF }}"
  changed_when: true
  when: (SWARM_REGISTRY_PREFIX | length > 0) and not (IS_STACK_HOST | bool)

- name: 🖥️ Prepare the node-local runner stack on a swarm worker
  include_tasks: 05_node.yml
  when: not (IS_STACK_HOST | bool)

- name: 📌 Recreate the runner stack when the registry image of this node changed
  when: SWARM_REGISTRY_PREFIX | length > 0
  block:
    - name: 🔍 Read the registry image id of the runner on this node
      ansible.builtin.command:
        argv:
          - container
          - image
          - inspect
          - "--format={% raw %}{{.Id}}{% endraw %}"
          - "{{ RUNNER_IMAGE_REF }}"
      register: _runner_image_id
      changed_when: false

    - name: 📌 Record the registry image id of the runner on this node
      ansible.builtin.copy: # nocheck: stack-host-copy, stack-host-consumer (node-local runner: every swarm node records the image it runs)
        content: "{{ _runner_image_id.stdout }}\n"
        dest: "{{ [lookup('container', application_id, 'directories.instance'), '.image-id'] | path_join }}"
        mode: "0640"
      notify: compose-up

- name: 🚿 Flush the compose handlers of the runner stack
  ansible.builtin.meta: flush_handlers

- name: 🧹 Remove the runner stack files the default instance dir replaced
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ [RUNNER_INSTALL_DIR, 'compose.yml'] | path_join }}"
    - "{{ [RUNNER_INSTALL_DIR, 'build'] | path_join }}"
    - /etc/sysctl.d/99-github-runner.conf
