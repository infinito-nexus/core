---
# nocheck: dockerfile-custom
# nocheck: image-healthcheck  CI runner, no service port; readiness is the runner's own registration
runner:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  lifecycle: beta
  proxy:
    service_key: runner-1
  github_owner: infinito-nexus
  github_repo: core
  docker_base: /mnt/docker
  image: ubuntu
  # nocheck: docker-version
  version: "26.04"
  docker_gid_fallback: 999
  project_prefix: runner
  sysctl_conf: /etc/sysctl.d/99-github-runner.conf
  image_name: infinito-runner
  image_tag: latest
  install_dir: /opt/github-runner
  cpus: 2

# nocheck: dynamic-flag
buildkit:
  enabled: false
  shared: false
  image: moby/buildkit
  version: "v0.34.1"
# nocheck: dynamic-flag
act-runner:
  enabled: false
  shared: false
  image: catthehacker/ubuntu
  # nocheck: docker-version
  version: "act-latest"

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
