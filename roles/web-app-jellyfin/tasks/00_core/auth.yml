---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: jellyfin
    resolve_output_prefix: JELLYFIN
    resolve_compose_cid: "{{ JELLYFIN_NAME }}"

- name: "⏳ Jellyfin auth | Wait until Jellyfin is healthy before driving the wizard"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container inspect --type container --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ JELLYFIN_LOCAL_CID }}
  register: jellyfin_auth_health
  until: jellyfin_auth_health.stdout | trim == "healthy"
  retries: 60
  delay: 5
  changed_when: false
  delegate_to: "{{ JELLYFIN_HOST_NODE }}"

- name: "🔐 Jellyfin auth | Wizard + plugin install on the hosting node"
  ansible.builtin.shell:
    cmd: "{{ lookup('file', role_path ~ '/files/shell/configure-auth.sh') }}"
    executable: /bin/bash
    stdin: "{{ jellyfin_auth_stdin }}"
  environment: "{{ jellyfin_auth_env | combine({'JELLYFIN_PHASE': 'install', 'JELLYFIN_CT': JELLYFIN_LOCAL_CID}) }}"
  delegate_to: "{{ JELLYFIN_HOST_NODE }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: true

- name: "♻️ Jellyfin auth | Restart to load installed plugins (compose)"
  ansible.builtin.command: container restart {{ JELLYFIN_NAME }}
  changed_when: true
  when: IS_COMPOSE_MODE

- name: "♻️ Jellyfin auth | Restart to load installed plugins (swarm)"
  ansible.builtin.command: "container service update --force {{ lookup('container_service', application_id, 'jellyfin') }}"
  changed_when: true
  timeout: "{{ lookup('timeout', 600) | int }}"
  when: IS_SWARM_MODE

- name: "🔍 Re-resolve hosting node + container id after plugin restart"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: jellyfin
    resolve_output_prefix: JELLYFIN
    resolve_compose_cid: "{{ JELLYFIN_NAME }}"

- name: "🔐 Jellyfin auth | LDAP/SSO configuration on the hosting node"
  ansible.builtin.shell:
    cmd: "{{ lookup('file', role_path ~ '/files/shell/configure-auth.sh') }}"
    executable: /bin/bash
    stdin: "{{ jellyfin_auth_stdin }}"
  environment: "{{ jellyfin_auth_env | combine({'JELLYFIN_PHASE': 'configure', 'JELLYFIN_CT': JELLYFIN_LOCAL_CID}) }}"
  delegate_to: "{{ JELLYFIN_HOST_NODE }}"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  changed_when: true

- name: "🔍 Resolve the {{ application_id }} network namespace for host-side API calls"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns.yml') }}"
  vars:
    netns_output_prefix: JELLYFIN

- name: "🛂 Jellyfin auth | Trust the forwarded headers of the front proxy"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  vars:
    jellyfin_proxy_headers:
      Authorization: 'MediaBrowser Token="{{ (jellyfin_proxy_session.content | from_json).AccessToken }}"'
    jellyfin_network: "{{ jellyfin_network_answer.content | from_json }}"
  block:
    - name: "🔑 Sign in to {{ application_id }} for its network configuration"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
      vars:
        netns_request_argv: "{{ JELLYFIN_NETNS_PYTHON }}"
        netns_request_host: "{{ JELLYFIN_HOST_NODE }}"
        netns_request_method: POST
        netns_request_url: "{{ JELLYFIN_API }}/Users/AuthenticateByName"
        netns_request_headers: "{{ {'X-Emby-Authorization': JELLYFIN_API_CLIENT} }}"
        netns_request_body: "{{ {'Username': JELLYFIN_ADMIN_USERNAME, 'Pw': JELLYFIN_ADMIN_PASSWORD} | to_json }}"
        netns_request_status: [200]
        netns_request_retries: 60
        netns_request_delay: 5
        netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
        netns_request_result: jellyfin_proxy_session

    - name: "📖 Read the network configuration of {{ application_id }}"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
      vars:
        netns_request_argv: "{{ JELLYFIN_NETNS_PYTHON }}"
        netns_request_host: "{{ JELLYFIN_HOST_NODE }}"
        netns_request_method: GET
        netns_request_url: "{{ JELLYFIN_API }}/System/Configuration/network"
        netns_request_headers: "{{ jellyfin_proxy_headers }}"
        netns_request_status: [200]
        netns_request_retries: 30
        netns_request_delay: 2
        netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
        netns_request_result: jellyfin_network_answer

    - name: "🛂 Trust X-Forwarded-* from the private proxy networks"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns_request.yml') }}"
      vars:
        netns_request_argv: "{{ JELLYFIN_NETNS_PYTHON }}"
        netns_request_host: "{{ JELLYFIN_HOST_NODE }}"
        netns_request_method: POST
        netns_request_url: "{{ JELLYFIN_API }}/System/Configuration/network"
        netns_request_headers: "{{ jellyfin_proxy_headers }}"
        netns_request_body: "{{ jellyfin_network | combine({'KnownProxies': NETWORK_TRUSTED_PROXY_CIDRS}) | to_json }}"
        netns_request_status: [200, 204]
        netns_request_retries: 0
        netns_request_delay: 0
        netns_request_changed: [200, 204]
        netns_request_skip: "{{ jellyfin_network.KnownProxies == NETWORK_TRUSTED_PROXY_CIDRS }}"
        netns_request_no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
        netns_request_result: jellyfin_network_written

- name: "♻️ Jellyfin auth | Final restart to apply auth configuration (compose)"
  ansible.builtin.command: container restart {{ JELLYFIN_NAME }}
  changed_when: true
  when: IS_COMPOSE_MODE

- name: "♻️ Jellyfin auth | Final restart to apply auth configuration (swarm)"
  ansible.builtin.command: "container service update --force {{ lookup('container_service', application_id, 'jellyfin') }}"
  changed_when: true
  timeout: "{{ lookup('timeout', 600) | int }}"
  when: IS_SWARM_MODE

- name: "🔍 Wait for {{ application_id }} to reconverge after the final restart"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: jellyfin
    resolve_output_prefix: JELLYFIN
    resolve_compose_cid: "{{ JELLYFIN_NAME }}"
