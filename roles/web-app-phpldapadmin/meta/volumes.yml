---
php_hardening:
  type: config
  source: "{{ FILE_PHP_HARDENING_INI }}"
  mode: "0444"
  mounts:
    - service: phpldapadmin
      target: /usr/local/etc/php/conf.d/zz-infinito-hardening.ini

php_memory_unlimited:
  type: config
  source: "{{ FILE_PHP_MEMORY_UNLIMITED_INI }}"
  mode: "0444"
  mounts:
    - service: phpldapadmin
      target: /usr/local/etc/php/conf.d/zz-infinito-memory-unlimited.ini
