---
credentials:
  cookie_secret:
    description: Signing secret of atmo's OAuth session cookies.
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
  client_assertion_key:
    description: P-256 private scalar of the ES256 key atmo signs its OAuth client assertions with; the public half is served at /oauth/jwks.json.
    algorithm: vapid_private
  cron_secret:
    description: Shared secret the cron sidecar sends to atmo's /api/cron endpoint.
    algorithm: alphanumeric
    validation: ^[A-Za-z0-9]{64}$
