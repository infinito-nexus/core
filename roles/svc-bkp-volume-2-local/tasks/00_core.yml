---
- include_tasks: utils/once/flag.yml

- name: 📂 Include dependencies
  include_role:
    name: "{{ svc_bkp_volume_2_local_dependency }}"
  loop:
    - sys-svc-container
    - sys-lock
    - user-backup
    - sys-ctl-alm-compose
    - sys-ctl-cln-bkps
  loop_control:
    loop_var: svc_bkp_volume_2_local_dependency

- include_tasks: 01_install.yml
  when: run_once_svc_bkp_volume_2_local_install is not defined

- name: "♻️ reset (if enabled) for {{ role_name}}"
  include_tasks: 02_reset.yml
  when: RESET | bool

- name: ✅ Ensure databases.csv exists (root only)
  ansible.builtin.file:
    path: "{{ FILE_DATABASE_SECRETS }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: ✅ Ensure compositions dir exists (baudolo scans it; absent on fresh host)
  ansible.builtin.file:
    path: "{{ DIR_COMPOSITIONS }}"
    state: directory

- name: ✅ Assert the configured snapshot_mode names a snapshot mode
  ansible.builtin.assert:
    that:
      - BKP_VOLUME_2_LOCAL_SNAPSHOT_MODE in BKP_VOLUME_2_LOCAL_SNAPSHOT_MODES
    fail_msg: >-
      services.volume-2-local.snapshot_mode is '{{ BKP_VOLUME_2_LOCAL_SNAPSHOT_MODE_RAW }}', which
      resolves to '{{ BKP_VOLUME_2_LOCAL_SNAPSHOT_MODE }}' and is not one of
      {{ BKP_VOLUME_2_LOCAL_SNAPSHOT_MODES | join(', ') }}. Quote the value: YAML reads a bare
      on/yes/true as a boolean.
    quiet: true

- name: 📦 Install the btrfs tools the snapshot launcher shells out to
  become: true
  package_install: # nocheck: package-install only on hosts with a btrfs mount
    id: btrfs-tools
  when: ansible_facts.mounts | selectattr('fstype', 'equalto', 'btrfs') | list | length > 0

- include_tasks: 04_snapshot_subject.yml
  when: BKP_VOLUME_2_LOCAL_SNAPSHOT_MODE != 'never'

- name: "📁 create {{ BKP_VOLUME_2_LOCAL_SNAPSHOT_DIR }}"
  ansible.builtin.file:
    path: "{{ BKP_VOLUME_2_LOCAL_SNAPSHOT_DIR }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "📁 create the launcher modules in {{ BKP_VOLUME_2_LOCAL_SNAPSHOT_DIR }}"
  ansible.builtin.copy:
    src: "python/baudolo/{{ svc_bkp_volume_2_local_snapshot_module.key }}"
    dest: "{{ [BKP_VOLUME_2_LOCAL_SNAPSHOT_DIR, svc_bkp_volume_2_local_snapshot_module.key] | path_join }}"
    owner: root
    group: root
    mode: "{{ svc_bkp_volume_2_local_snapshot_module.value }}"
  loop: "{{ BKP_VOLUME_2_LOCAL_SNAPSHOT_MODULES | dict2items }}"
  loop_control:
    loop_var: svc_bkp_volume_2_local_snapshot_module
    label: "{{ svc_bkp_volume_2_local_snapshot_module.key }}"

- name: "🔗 link {{ BKP_VOLUME_2_LOCAL_SNAPSHOT_BIN }} to the launcher"
  ansible.builtin.file:
    src: "{{ [BKP_VOLUME_2_LOCAL_SNAPSHOT_DIR, 'snapshot.py'] | path_join }}"
    dest: "{{ BKP_VOLUME_2_LOCAL_SNAPSHOT_BIN }}"
    state: link
    force: true

- name: "📁 create {{ BKP_VOLUME_2_LOCAL_MAINTENANCE_BIN }}"
  ansible.builtin.copy:
    src: python/baudolo/maintenance.py
    dest: "{{ BKP_VOLUME_2_LOCAL_MAINTENANCE_BIN }}"
    owner: root
    group: root
    mode: "0755"

- name: "📁 Recreate {{ DIR_MAINTENANCE }} at every boot"
  ansible.builtin.copy:
    content: "d {{ DIR_MAINTENANCE }} 0755 root root -\n"
    dest: "{{ BKP_VOLUME_2_LOCAL_MAINTENANCE_TMPFILES }}"
    owner: root
    group: root
    mode: "0644"

- name: "📁 Ensure {{ DIR_MAINTENANCE }} exists"
  ansible.builtin.file:
    path: "{{ DIR_MAINTENANCE }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "▶️ Execute system service setup for '{{ system_service_id }}'"
  include_role:
    name: sys-service
  vars:
    system_service_copy_files: false
    system_service_timer_enabled: true
    system_service_force_linear_sync: true
    system_service_force_flush_instant: "{{ BACKUP | bool }}"
    system_service_force_flush_final: false
    system_service_state: "{{ 'started' if BACKUP | bool else omit }}"
    system_service_on_calendar: "{{ SYS_SCHEDULE_BACKUP_CONTAINER_TO_LOCAL }}"
    system_service_tpl_exec_start_pre: '{{ BIN_LOCK }} {{ SYS_SERVICE_GROUP_MANIPULATION | join(" ")  }} --ignore {{ SYS_SERVICE_BACKUP_VOLUME_2_LOCAL }} --timeout
      "{{ SYS_TIMEOUT_BACKUP_SERVICES }}"'
    system_service_tpl_exec_start: "/bin/sh -c '{{ BKP_VOLUME_2_LOCAL_EXEC }}'"
    system_service_tpl_exec_start_post: "{{ BKP_VOLUME_2_LOCAL_MAINTENANCE_CLEAR }}"
    system_service_tpl_exec_stop_post: "{{ BKP_VOLUME_2_LOCAL_MAINTENANCE_CLEAR }}"
    system_service_tpl_on_failure: "{{ SYS_SERVICE_ON_FAILURE_COMPOSE }}"
