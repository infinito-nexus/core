---
# nocheck: garbage-collector-required  backup generations; sys-ctl-cln-bkps owns their retention
volume-2-local:
  modes:
    host:
      enabled: true
    compose:
      enabled: false
    swarm:
      enabled: false
  bond: 1
  enabled: true
  shared: true
  provides: container_backup
  lifecycle: beta
  snapshot_mode: auto
  min_storage: 0GB
  cpus: "0.5"
  mem_reservation: "256m"
  mem_limit: "512m"
  pids_limit: 256

# nocheck: dynamic-flag
test:
  enabled: false
  shared: false
  image: alpine
  version: "3.24"
  workspace_order:
    SALES_ORDER: DRILL
    LINE: "1"
    PROVIDER_TOKEN: platform

# nocheck: dynamic-flag - host secrets must be captured unconditionally wherever container backups run
secrets_backup:
  bond: 1
  enabled: true
  shared: true

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  the role runs no container, so Semaphore has nothing to pause
  status: started
