---
# Matrix-deploy variant overrides for web-app-prometheus.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: variant-pin-required — the scrape-admission pairs with flowise,
# hermes, openclaw and openwebui exercise their two directions in different
# rounds, and the guard's premise that no clone detection covers that is false
# here: the complexity model puts every one of those rows in one dna group
# elected to svc-net-tor v0, so the sweep already cuts them. Aligning the
# rounds was measured and both ways lose. Moving the consumers into v1 trips
# test_order, whose v>0-subset-of-v0 rule has no exemption, and demands six
# bond-baseline markers each contradicting the bond: 1 on the line above.
# Moving the admissions into v0 puts 105 variants over budget, worst
# web-app-nextcloud v6 at 37.3 GB against the 32 GB reservation cap, which no
# marker waives.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-prometheus.

- services:
    container_backup:
      enabled: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    design:
      enabled: true
      shared: true
    tor:
      enabled: true
    openwebui:
      enabled: false
      shared: false
    hermes:
      enabled: false
      shared: false
    openclaw:
      enabled: false
      shared: false
    flowise:
      enabled: false
      shared: false
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: true
      shared: true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    tor:
      enabled: true
    openwebui:
      enabled: true
      shared: true
    hermes:
      enabled: true
      shared: true
    openclaw:
      enabled: true
      shared: true
    flowise:
      enabled: true
      shared: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    tor:
      enabled: true
    openwebui:
      enabled: false
      shared: false
    hermes:
