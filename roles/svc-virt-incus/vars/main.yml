---
application_id: "svc-virt-incus"

INCUS_OS_FAMILIES:
  - Archlinux
  - Debian
  - RedHat
INCUS_COW_DRIVERS:
  - btrfs
  - zfs
  - lvm
INCUS_STORAGE_POOL: "{{ lookup('config', application_id, 'services.incus.storage_pool') }}"
INCUS_NETWORK: "{{ lookup('config', application_id, 'services.incus.network') }}"
INCUS_AGENTS: "{{ lookup('config', application_id, 'services.incus.agents') }}"
INCUS_PROJECT: "agents-{{ DOMAIN_PRIMARY | replace('.', '-') }}"
INCUS_STORAGE_PATH: /var/lib/incus
INCUS_MAX_RUNNING: "{{ lookup('config', 'svc-ai-agent-broker', 'services.agent-broker.agents.max_running') }}"
INCUS_PROJECT_CONFIG:
  restricted: "true"
  restricted.containers.privilege: unprivileged
  restricted.containers.nesting: block
  restricted.devices.disk: managed
  restricted.devices.nic: managed
  restricted.networks.access: "{{ INCUS_NETWORK.name }}"
  restricted.virtual-machines.lowlevel: block
  limits.instances: "{{ (INCUS_MAX_RUNNING | int) + (INCUS_AGENTS.warm_pool | int) }}"
  limits.disk: "{{ INCUS_STORAGE_POOL.size }}"
INCUS_PRESEED:
  networks:
    - name: "{{ INCUS_NETWORK.name }}"
      type: bridge
      config:
        ipv4.address: "{{ INCUS_NETWORK.ipv4 }}"
        ipv4.nat: "false"
        ipv6.address: none
  storage_pools:
    - name: "{{ INCUS_STORAGE_POOL.name }}"
      driver: "{{ INCUS_STORAGE_POOL.driver }}"
      config:
        size: "{{ INCUS_STORAGE_POOL.size }}"
