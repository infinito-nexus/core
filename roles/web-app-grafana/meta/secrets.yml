---
credentials:
  breakglass_password:
    description: "Password of the local Grafana administrator web-app-grafana-breakglass, the only account that signs in without Keycloak. Applied with 'grafana cli
      admin reset-admin-password' on every deploy."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 40
