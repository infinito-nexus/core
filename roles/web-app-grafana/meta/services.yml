---
# nocheck: email, dynamic-flag, playwright-service-flag
email:
  enabled: false
  shared: false
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
# nocheck: playwright-service-flag  dashboard-tile reachability is owned by web-app-dashboard/files/playwright/playwright.spec.js, not consumer roles.
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
loki:
  bond: 1
  enabled: "{{ 'web-svc-loki' in group_names }}"
  shared: "{{ 'web-svc-loki' in group_names }}"
# nocheck: dynamic-flag
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
# nocheck: design-off  Reason: Grafana renders its own React theme, which the shared stylesheet and logo slots are not mapped onto yet
design:
  enabled: false
  shared: false
grafana:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  the SQLite database lives on the node-local data volume, which cannot move to NFS
  placement: manager
  image: grafana/grafana
  version: "13.3.0"
  name: grafana
  min_storage: 1GB
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 512
  backup:
    stop_required: true
  healthcheck:
    flavor: wget
    path: api/health
    port_key: grafana
  ports:
    internal:
      grafana: 3000
    local:
      grafana: 3300
    onion:
      # nocheck: onion-flag  the UI reaches the node onion through the front proxy vhost, so the raw application port stays off it
      grafana: false
  run_after:
    - web-app-keycloak
    - web-app-prometheus
  lifecycle: alpha

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
# nocheck: playwright-service-flag  Semaphore control is proven by the web-app-semaphore spec, not by a per-consumer gate
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started
