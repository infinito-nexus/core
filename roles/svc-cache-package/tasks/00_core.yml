---
- include_tasks: utils/once/flag.yml

- include_tasks: utils/load/handlers.yml
  vars:
    handler_role_name: "sys-svc-compose"

- name: "🐳 Prepare the compose stack before anything can flush its handlers"
  ansible.builtin.include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: false
  when: run_once_sys_svc_compose is not defined

- name: "📄 Render the frontend map for '{{ application_id }}'"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "upstreams.conf.j2"
        dest: "{{ CACHE_PACKAGE_FRONTEND_CONF_HOST }}"
        mode: "0644"

- name: "📁 Create the frontend's CA and certificate directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ CACHE_PACKAGE_CA_DIR_HOST }}"
    - "{{ CACHE_PACKAGE_CERTS_DIR_HOST }}"

- name: "📁 Hand the bound Nexus data directory to the image's nexus user"
  when: CACHE_PACKAGE_DATA_PATH | length > 0
  block:
    - name: "📁 Create the Nexus data directory for the nexus user"
      ansible.builtin.file:
        path: "{{ CACHE_PACKAGE_DATA_PATH }}"
        state: directory
        owner: "{{ CACHE_PACKAGE_DOCKER_USER_ID }}"
        group: "{{ CACHE_PACKAGE_DOCKER_USER_ID }}"
        mode: "0755"

    - name: "📁 Hand every entry a legacy root-run cache left to the nexus user"
      ansible.builtin.file:
        path: "{{ CACHE_PACKAGE_DATA_PATH }}"
        state: directory
        recurse: true
        follow: false
        owner: "{{ CACHE_PACKAGE_DOCKER_USER_ID }}"
        group: "{{ CACHE_PACKAGE_DOCKER_USER_ID }}"

- name: "📜 Install the bootstrap the stack re-runs whenever Nexus starts"
  ansible.builtin.copy:
    src: "shell/bootstrap.sh"
    dest: "{{ CACHE_PACKAGE_BOOTSTRAP_SCRIPT_HOST }}"
    mode: "0444"
  notify: compose-up

- name: "🔐 Issue the frontend CA and one leaf per TLS host"
  ansible.builtin.command:
    cmd: "{{ [CACHE_PACKAGE_SHELL_DIR, 'certs.sh'] | path_join }}"
  environment: "{{ lookup('template', 'environment/certs.j2') | from_yaml }}"
  register: cache_package_certs
  changed_when: "'Generating' in cache_package_certs.stderr"

- include_role:
    name: sys-svc-compose
  vars:
    compose_handlers_flush: true

- name: "📦 Bootstrap the proxy repositories once the sidecar is done"
  when: CACHE_PACKAGE_BOOTSTRAP_ENABLED | bool
  block:
    - name: "⏳ Wait for the bootstrap sidecar before the deploy runs the same bootstrap"
      ansible.builtin.command:
        argv:
          - container
          - wait
          - "{{ CACHE_PACKAGE_BOOTSTRAP_CONTAINER }}"
      register: cache_package_bootstrap_sidecar
      changed_when: false
      failed_when:
        - cache_package_bootstrap_sidecar.rc != 0
        - "'No such container' not in cache_package_bootstrap_sidecar.stderr"
      when: not (IS_SWARM_MODE | bool)

    - name: "📦 Create the proxy repositories the frontend maps onto"
      ansible.builtin.shell:
        cmd: >-
          IFS= read -r INFINITO_CACHE_PACKAGE_ADMIN_PASSWORD || :;
          : "${INFINITO_CACHE_PACKAGE_ADMIN_PASSWORD:?arrived empty on stdin}" &&
          export INFINITO_CACHE_PACKAGE_ADMIN_PASSWORD &&
          exec {{ [CACHE_PACKAGE_SHELL_DIR, 'bootstrap.sh'] | path_join | quote }}
        stdin: "{{ CACHE_PACKAGE_ADMIN_PASSWORD }}"
      environment: "{{ lookup('template', 'environment/bootstrap.j2') | from_yaml }}"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      register: cache_package_bootstrap
      changed_when: "'created' in cache_package_bootstrap.stderr"
