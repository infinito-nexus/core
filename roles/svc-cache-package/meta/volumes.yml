# nocheck: backup-service-flag proxied package content is re-fetchable from its upstream; the volume is backup-disabled and the consumer permanently off
---
data:
  type: volume
  name: package_cache_data
  backup: false
  # nocheck: nfs-false-data-loss  Reason: every blob is a proxy copy of an upstream artefact, so a drain costs a re-fetch and loses nothing; the service is pinned to the manager and disabled in swarm
  nfs: false
  mounts:
    - service: package
      target: &nexus_data /nexus-data
      when: &named_data "{{ lookup('config', 'svc-cache-package', 'services.package.data_path') | length == 0 }}"
    - service: bootstrap
      target: *nexus_data
      when: *named_data
data_host:
  type: bind
  source: "{{ lookup('config', 'svc-cache-package', 'services.package.data_path') }}"
  mounts:
    - service: package
      target: *nexus_data
      when: &host_data "{{ lookup('config', 'svc-cache-package', 'services.package.data_path') | length > 0 }}"
    - service: bootstrap
      target: *nexus_data
      when: *host_data
bootstrap_script:
  type: config
  source: "{{ [lookup('container', 'svc-cache-package', 'directories.config'), 'bootstrap.sh'] | path_join }}"
  mode: "0444"
  mounts:
    - service: bootstrap
      target: /etc/infinito/bootstrap.sh
frontend_ca:
  type: bind
  source: "{{ lookup('config', 'svc-cache-package', 'services.frontend.ca_path') }}"
  read_only: true
  mounts:
    - service: frontend
      target: /etc/nginx/ca
frontend_certs:
  type: bind
  source: "{{ lookup('config', 'svc-cache-package', 'services.frontend.certs_path') }}"
  read_only: true
  mounts:
    - service: frontend
      target: /etc/nginx/certs
frontend_conf:
  type: config
  source: "{{ [lookup('container', 'svc-cache-package', 'directories.config'), 'upstreams.conf'] | path_join }}"
  mode: "0444"
  mounts:
    - service: frontend
      target: /etc/nginx/conf.d/upstreams.conf
