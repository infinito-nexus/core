---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
# nocheck: dynamic-flag
# nocheck: playwright-service-flag
javascript:
  bond: 1
  enabled: true
  shared: true
ldap:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true # nocheck: dynamic-flag — LDAP IS the storage backend, never local
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  header_trust:
    proxy_secret: sso_proxy_secret
    switch: "lookup('sso', application_id, 'is_proxy_gated')"
    files: [meta/services.yml]
  oauth2:
    origin:
      host: fusiondirectory
      port: 80
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-fusiondirectory', role='administrator') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-fusiondirectory', role='user-manager') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-fusiondirectory', role='self-service') }}"
# nocheck: playwright-service-flag  self-provider
fusiondirectory:
  enabled: false
  backup:
    stop_required: false
  healthcheck:
    flavor: curl
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: nfrastack/fusiondirectory
  version: "1.5"
  config:
    login_method: "{{ 'LoginHTTPHeader' if (lookup('config', 'web-app-fusiondirectory', 'services.sso.enabled') | bool and lookup('config', 'web-app-fusiondirectory',
      'services.sso.flavor') == 'oauth2') else 'LoginPost' }}"
    http_header: X_FORWARDED_PREFERRED_USERNAME
    theme: breezy
    timezone: "{{ HOST_TIMEZONE }}"
    user_rdn: "{{ LDAP.DN.OU.USERS | regex_replace(',.*$', '') }}"
    group_rdn: "{{ LDAP.DN.OU.GROUPS | regex_replace(',.*$', '') }}"
  # nocheck: single-replica  PHP stores its sessions in container-local files and the 1.5 image carries no redis or memcached extension to move them to a shared store; lifting this pin needs the image rebuilt on upstream's php8 release, see TODO.md
  replicas: 1
  name: fusiondirectory
  ports:
    local:
      sso: 16487
      sso_onion: 16528
      http: 8038
    internal:
      http: 80
  proxy:
    service_key: fusiondirectory
  run_after:
    - web-app-matomo
    - web-app-keycloak
    - web-app-email
    - svc-db-openldap
  lifecycle: eol
  min_storage: 379MB
  cpus: "0.5"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 512
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 156
      height: 44

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true # nocheck: dynamic-flag — LDAP IS the storage backend, never local

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
