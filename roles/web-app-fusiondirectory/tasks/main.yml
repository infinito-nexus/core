---
- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full

- name: "🎨 Render the in-house theme.css of {{ application_id }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "theme.css.j2"
        dest: "{{ FUSIONDIRECTORY_THEME_CSS_HOST }}"
        mode: "0644"
  when: FUSIONDIRECTORY_DESIGN_ENABLED | bool

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers

- name: "📇 Bootstrap the FusionDirectory tree in LDAP for {{ application_id }}"
  ansible.builtin.include_tasks: 01_ldap.yml
  when: IS_STACK_HOST | bool
