---
credentials:
  gateway_key:
    description: Virtual key the gateway minted for this workstation. The gateway deploys from a different inventory than the workstation, so the operator
      carries the key over by hand. A workstation that runs the gateway itself leaves this empty and uses litellm_api_key instead.
    algorithm: plain
    validation: ^.*$
  litellm_api_key:
    description: Per-consumer virtual key for the shared svc-ai-litellm gateway, minted with the deployment when the workstation runs the gateway itself
    algorithm: sk_prefixed
    validation:
      min_length: 50
