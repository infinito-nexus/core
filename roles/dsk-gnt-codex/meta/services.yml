---
# nocheck: dynamic-flag  the desktop base is the premise of every dsk role, not a per-host option
desktop-base:
  bond: 1
  enabled: true
  shared: true
codex:
  modes:
    host:
      enabled: true
  lifecycle: alpha
  bond: 1
  enabled: true
  shared: true
  gateway_url: ""
  model: ""
  min_storage: "500MB"
  cpus: "1.0"
  mem_reservation: "256m"
  mem_limit: "1g"
  pids_limit: 512
# nocheck: playwright-service-flag, dynamic-flag  AI backend, infrastructural, and a single shared instance
litellm:
  bond: 1
  enabled: "{{ LITELLM_USABLE }}"
  shared: true

# nocheck: variants-coverage the role has a single variant, and the guide edge is not a dimension of it: a second round would differ only by the README replay
docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"
