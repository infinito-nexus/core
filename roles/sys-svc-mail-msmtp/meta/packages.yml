---
msmtp:
  Archlinux:
    - msmtp
  Debian:
    - msmtp
  RedHat:
    - msmtp
  centos:
    names:
      - msmtp
    repo:
      bootstrap_package: epel-release

msmtp-mta:
  Archlinux:
    - msmtp-mta
  Debian:
    - msmtp-mta
  RedHat: [] # nocheck: empty - neither the EL base repositories nor EPEL ship msmtp-mta, so the role links /usr/bin/sendmail to msmtp instead
