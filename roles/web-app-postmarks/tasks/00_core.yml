---
- name: "🎬 Stage the build-context patches for {{ application_id }}"
  stack_host_copy:
    src: "{{ item.src }}"
    dest: "{{ [ lookup('container', application_id, 'directories.instance'), item.dest ] | path_join }}"
    mode: "0644"
  loop:
    - { src: "sso/header_auth.js", dest: "header_auth.js" }
    - { src: "sso/patch_server.js", dest: "patch_server.js" }
    - { src: "javascript/patch_site_name.js", dest: "patch_site_name.js" }
  notify:
    - compose-build
    - compose-up

- include_tasks: utils/once/flag.yml
