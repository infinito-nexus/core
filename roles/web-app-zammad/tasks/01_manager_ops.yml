---
- name: "⏳ Transferring search_allocation_precheck.sh to {{ ZAMMAD_SEARCH_PRECHECK_ABS }}"
  stack_host_copy:
    src: shell/search_allocation_precheck.sh
    dest: "{{ ZAMMAD_SEARCH_PRECHECK_ABS }}"
    mode: "0555"
  notify: compose-up

- name: "🔐 grant CREATEDB to Zammad PostgreSQL role (init runs rake db:create)"
  database_query:
    mask_values: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
    config: >-
      {{ lookup('database', application_id) | combine({
        'username': 'postgres',
        'name': 'postgres',
        'password': lookup('config', 'svc-db-postgres', 'secrets.credentials.POSTGRES_PASSWORD'),
      }) }}
    # nocheck: database-query-raw
    query: "{{ lookup('template', role_path ~ '/templates/sql/grant_createdb.sql.j2') }}"
  when: lookup('config', application_id, 'services.postgres.shared') | bool

- name: "🔄 flush handlers so Zammad init starts with auto_wizard.json bind-mounted"
  meta: flush_handlers

- name: "⏳ wait for Zammad init (seeds + pk-sequence reset) to finish"
  ansible.builtin.shell: |
    set -eo pipefail
    container exec {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
      bundle exec rails r '
        raise unless Setting.any?
        raise unless ActiveRecord::Base.connection.select_value("SELECT is_called FROM users_id_seq")
      '
  register: zammad_rails_ready
  changed_when: false
  retries: 60
  delay: 5
  until: zammad_rails_ready.rc == 0

- name: "⏳ wait for the current Zammad init task to complete"
  ansible.builtin.script: "{{ lookup('path_absolute', 'roles/sys-svc-compose/files/shell/swarm/job_state.sh') }}"
  environment:
    JOB: "{{ lookup('container_service', application_id, ZAMMAD_INIT_SERVICE) }}"
  register: zammad_init_state
  changed_when: false
  retries: 60
  delay: 5
  until: zammad_init_state.rc != 1
  failed_when: zammad_init_state.rc != 0
  when: IS_SWARM_MODE

- name: "▶️ process auto_wizard.json if Zammad setup wizard incomplete (idempotent)"
  ansible.builtin.shell: |
    set -euo pipefail
    container exec -i {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} bundle exec rails r '
      if !Setting.get("system_init_done")
        raise "AutoWizard data missing (auto_wizard.json not mounted in rails container)" unless AutoWizard.enabled?
        AutoWizard.setup
      end
    '
  register: zammad_auto_wizard_setup
  changed_when: false

- name: "🗄️ point Zammad's attachment store at the S3 bucket"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      container exec -i \
        {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
        bundle exec rails r -
    stdin: "{{ lookup('file', 'ruby/apply/storage_provider.rb') }}"
  register: zammad_storage_provider_apply
  changed_when: false
  when: ZAMMAD_OBJSTORE_ENABLED | bool

- name: "✅ ensure API-bot user in Zammad (Basic-auth REST API; all variants, no-auth too)"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      IFS= read -r API_BOT_PASSWORD
      export API_BOT_PASSWORD
      container exec -i \
        -e API_BOT_LOGIN -e API_BOT_EMAIL -e API_BOT_FIRSTNAME -e API_BOT_LASTNAME -e API_BOT_PASSWORD \
        {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
        bundle exec rails r -
    stdin: |-
      {{ ZAMMAD_API_BOT_PASSWORD }}
      {{ lookup('file', 'ruby/apply/api_bot.rb') }}
  environment:
    API_BOT_LOGIN: "{{ ZAMMAD_API_BOT_USER.username }}"
    API_BOT_EMAIL: "{{ ZAMMAD_API_BOT_USER.email }}"
    API_BOT_FIRSTNAME: "{{ ZAMMAD_API_BOT_USER.firstname }}"
    API_BOT_LASTNAME: "{{ ZAMMAD_API_BOT_USER.lastname }}"
  register: zammad_api_bot_apply
  changed_when: false

- name: "👑 ensure the platform administrator in Zammad while sso is off"
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      IFS= read -r ADMIN_PASSWORD
      export ADMIN_PASSWORD
      container exec -i \
        -e ADMIN_LOGIN -e ADMIN_EMAIL -e ADMIN_FIRSTNAME -e ADMIN_LASTNAME -e ADMIN_PASSWORD \
        {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
        bundle exec rails r -
    stdin: |-
      {{ ZAMMAD_ADMINISTRATOR.password }}
      {{ lookup('file', 'ruby/apply/administrator.rb') }}
  environment:
    ADMIN_LOGIN: "{{ ZAMMAD_ADMINISTRATOR.username }}"
    ADMIN_EMAIL: "{{ ZAMMAD_ADMINISTRATOR.email }}"
    ADMIN_FIRSTNAME: "{{ ZAMMAD_ADMINISTRATOR.firstname }}"
    ADMIN_LASTNAME: "{{ ZAMMAD_ADMINISTRATOR.lastname }}"
  register: zammad_administrator_apply
  changed_when: "'administrator: changed' in zammad_administrator_apply.stdout"
  when: not (ZAMMAD_OIDC_ENABLED | bool)

- name: "🎨 Converge the corporate design of {{ application_id }}"
  ansible.builtin.include_tasks: 02_design.yml

- name: "🔑 ensure the read-only MCP agent and its API token in Zammad"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      IFS= read -r MCP_BOT_PASSWORD
      IFS= read -r MCP_API_TOKEN
      export MCP_BOT_PASSWORD MCP_API_TOKEN
      container exec -i \
        -e MCP_BOT_LOGIN -e MCP_BOT_EMAIL -e MCP_BOT_FIRSTNAME -e MCP_BOT_LASTNAME \
        -e MCP_BOT_PASSWORD -e MCP_API_TOKEN -e MCP_TOKEN_LABEL \
        {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
        bundle exec rails r -
    stdin: |-
      {{ ZAMMAD_MCP_UPSTREAM_PASSWORD }}
      {{ ZAMMAD_MCP_UPSTREAM_KEY }}
      {{ lookup('file', 'ruby/apply/mcp_bot.rb') }}
  environment:
    MCP_BOT_LOGIN: "{{ ZAMMAD_MCP_UPSTREAM_USER }}"
    MCP_BOT_EMAIL: "{{ ZAMMAD_MCP_UPSTREAM_EMAIL }}"
    MCP_BOT_FIRSTNAME: "MCP"
    MCP_BOT_LASTNAME: "Adapter"
    MCP_TOKEN_LABEL: "{{ ZAMMAD_MCP_UPSTREAM_TOKEN_LABEL }}"
  register: zammad_mcp_bot_apply
  changed_when: false
  when: ZAMMAD_MCP_ENABLED | bool
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🎫 ensure the access-request agent and its API token in Zammad"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      IFS= read -r ACCESS_REQUEST_BOT_PASSWORD
      IFS= read -r ACCESS_REQUEST_API_TOKEN
      export ACCESS_REQUEST_BOT_PASSWORD ACCESS_REQUEST_API_TOKEN
      container exec -i \
        -e ACCESS_REQUEST_BOT_LOGIN -e ACCESS_REQUEST_BOT_EMAIL -e ACCESS_REQUEST_BOT_PASSWORD \
        -e ACCESS_REQUEST_GROUP -e ACCESS_REQUEST_API_TOKEN -e ACCESS_REQUEST_TOKEN_LABEL \
        {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
        bundle exec rails r -
    stdin: |-
      {{ ZAMMAD_ACCESS_REQUEST_ACCOUNT.password }}
      {{ ZAMMAD_ACCESS_REQUEST_TOKEN }}
      {{ lookup('file', 'ruby/apply/access_request_bot.rb') }}
  environment:
    ACCESS_REQUEST_BOT_LOGIN: "{{ ZAMMAD_ACCESS_REQUEST_ACCOUNT.username }}"
    ACCESS_REQUEST_BOT_EMAIL: "{{ ZAMMAD_ACCESS_REQUEST_ACCOUNT.email }}"
    ACCESS_REQUEST_GROUP: "{{ ZAMMAD_ACCESS_REQUEST_GROUP }}"
    ACCESS_REQUEST_TOKEN_LABEL: "{{ ZAMMAD_ACCESS_REQUEST_TOKEN_LABEL }}"
  register: zammad_access_request_bot_apply
  changed_when: false
  when: ZAMMAD_ACCESS_REQUEST_ENABLED | bool
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔐 Apply the OIDC settings and bind the Zammad accounts to Keycloak"
  ansible.builtin.include_tasks: 01_manager_ops/oidc.yml
  when: ZAMMAD_OIDC_ENABLED

- name: "🔧 Converge the Zammad LDAP source while LDAP is on"
  when: ZAMMAD_LDAP_ENABLED
  block:
    - name: "⬇️ Read the managed LDAP source fields Zammad holds"
      database_query:
        config: "{{ lookup('database', application_id) }}"
        query_file: "{{ [role_path, 'files/sql/select/ldap-source.sql'] | path_join }}"
        named_args:
          name: "{{ ZAMMAD_LDAP_SOURCE_NAME }}"
        expect_rows: true
      register: zammad_ldap_source_stored
      changed_when: false

    - name: "📣 Report the managed LDAP source fields the write reverts"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
      vars:
        forms_drift_current:
          ldap: "{{ zammad_ldap_source_stored.rows[0][0] | default('{}', true) | from_json }}"

    - name: "🔧 configure Zammad LdapSource vs svc-db-openldap (post-bootstrap; idempotent)"
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          IFS= read -r LDAP_BIND_PW
          export LDAP_BIND_PW
          container exec -i \
            -e LDAP_NAME -e LDAP_HOST -e LDAP_PORT -e LDAP_BASE_DN \
            -e LDAP_BIND_DN -e LDAP_BIND_PW -e LDAP_UID_ATTR \
            -e LDAP_USER_FILTER -e LDAP_USER_ATTRIBUTES \
            -e LDAP_GROUP_FILTER -e LDAP_GROUP_ROLE_MAP \
            {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
            bundle exec rails r -
        stdin: |-
          {{ LDAP.BIND_CREDENTIAL }}
          {{ lookup('file', 'ruby/apply/ldap_source.rb') }}
      environment:
        LDAP_NAME: "{{ ZAMMAD_LDAP_SOURCE_NAME }}"
        LDAP_HOST: "{{ ZAMMAD_LDAP_SOURCE.host }}"
        LDAP_PORT: "{{ ZAMMAD_LDAP_SOURCE.port }}"
        LDAP_BASE_DN: "{{ LDAP.DN.ROOT }}"
        LDAP_BIND_DN: "{{ LDAP.DN.ADMINISTRATOR.DATA }}"
        LDAP_UID_ATTR: "{{ LDAP.USER.ATTRIBUTES.ID }}"
        LDAP_USER_FILTER: "{{ LDAP.FILTERS.USERS.ALL }}"
        LDAP_USER_ATTRIBUTES: "{{ ZAMMAD_LDAP_USER_ATTRIBUTES | to_json }}"
        LDAP_GROUP_FILTER: "{{ ZAMMAD_LDAP_GROUP_FILTER }}"
        LDAP_GROUP_ROLE_MAP: "{{ ZAMMAD_LDAP_GROUP_ROLE_MAP | to_json }}"
      register: zammad_ldap_apply
      changed_when: false

- name: "⬇️ Read the managed security settings Zammad holds"
  database_query:
    config: "{{ lookup('database', application_id) }}"
    query_file: "{{ [role_path, 'files/sql/select/settings.sql'] | path_join }}"
    named_args:
      fields: "{{ ZAMMAD_SECURITY | list | to_json }}"
    expect_rows: true
  register: zammad_security_stored
  changed_when: false

- name: "📣 Report the managed security settings the write reverts"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    forms_drift_current:
      security: "{{ zammad_security_stored.rows[0][0] | default('{}', true) | from_json }}"

- name: "🚪 apply the login methods of the sign-in page in Zammad (idempotent)"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      container exec -i \
        -e ZAMMAD_SECURITY -e LOGIN_2FA -e LOGIN_2FA_ENFORCED \
        {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
        bundle exec rails r -
    stdin: "{{ lookup('file', 'ruby/apply/login_methods.rb') }}"
  environment:
    ZAMMAD_SECURITY: "{{ ZAMMAD_SECURITY | to_json }}"
    LOGIN_2FA: "{{ ZAMMAD_LOGIN_2FA | string | lower }}"
    LOGIN_2FA_ENFORCED: "{{ ZAMMAD_LOGIN_2FA_ENFORCED | string | lower }}"
  register: zammad_login_methods_apply
  changed_when: false

- name: "🤖 Wire Zammad Smart Assist to the platform LLM gateway"
  when: ZAMMAD_LITELLM_ENABLED | bool
  block:
    - name: "🤖 Point Zammad Smart Assist at the platform gateway"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          IFS= read -r AI_TOKEN
          export AI_TOKEN
          container exec -i \
            -e AI_URL -e AI_MODEL -e AI_TOKEN \
            {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
            bundle exec rails r -
        stdin: |-
          {{ ZAMMAD_LITELLM_API_KEY }}
          {{ lookup('file', 'ruby/apply/ai_provider.rb') }}
      environment:
        AI_URL: "{{ ZAMMAD_LITELLM_BASE_URL }}"
        AI_MODEL: "{{ ZAMMAD_LITELLM_MODEL }}"
      register: zammad_ai_apply
      changed_when: false
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔧 Converge the Zammad email channel against Mailu"
  when: ZAMMAD_EMAIL_ENABLED and (ZAMMAD_HELPDESK_EMAIL | length > 0)
  block:
    - name: "⬇️ Read the managed email channel fields Zammad holds"
      database_query:
        config: "{{ lookup('database', application_id) }}"
        query_file: "{{ [role_path, 'files/sql/select/email-channel.sql'] | path_join }}"
        named_args:
          group: "{{ ZAMMAD_MAIL_GROUP_NAME }}"
        expect_rows: true
      register: zammad_email_channel_stored
      changed_when: false

    - name: "📣 Report the managed email channel fields the write reverts"
      ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
      vars:
        forms_drift_current:
          email: "{{ zammad_email_channel_stored.rows[0][0] | default('{}', true) | from_json }}"

    - name: "🔧 configure Zammad's Email channel (inbound IMAP + outbound SMTP) against Mailu"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          IFS= read -r IMAP_PASS
          IFS= read -r SMTP_PASS
          export IMAP_PASS SMTP_PASS
          container exec -i \
            -e MAIL_GROUP_NAME -e MAIL_FROM_NAME -e MAIL_FROM_ADDRESS \
            -e IMAP_HOST -e IMAP_PORT -e IMAP_USER -e IMAP_PASS \
            -e SMTP_HOST -e SMTP_PORT -e SMTP_USER -e SMTP_PASS \
            {{ ZAMMAD_RAILS_CONTAINER_ADDRESS }} \
            bundle exec rails r -
        stdin: |-
          {{ ZAMMAD_HELPDESK_PASS }}
          {{ ZAMMAD_HELPDESK_PASS }}
          {{ lookup('file', 'ruby/apply/email_channel.rb') }}
      environment:
        MAIL_GROUP_NAME: "{{ ZAMMAD_MAIL_GROUP_NAME }}"
        MAIL_FROM_NAME: "{{ ORGANIZATION }} Helpdesk"
        MAIL_FROM_ADDRESS: "{{ ZAMMAD_HELPDESK_EMAIL }}"
        IMAP_HOST: "{{ ZAMMAD_EMAIL_CHANNEL.inbound_host }}"
        IMAP_PORT: "{{ ZAMMAD_EMAIL_CHANNEL.inbound_port }}"
        IMAP_USER: "{{ ZAMMAD_HELPDESK_EMAIL }}"
        SMTP_HOST: "{{ ZAMMAD_EMAIL_CHANNEL.outbound_host }}"
        SMTP_PORT: "{{ ZAMMAD_EMAIL_CHANNEL.outbound_port }}"
        SMTP_USER: "{{ ZAMMAD_HELPDESK_EMAIL }}"
      register: zammad_email_apply
      changed_when: false
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
