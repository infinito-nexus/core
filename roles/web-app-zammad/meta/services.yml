---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: dynamic-flag - the gateway is a single shared instance, never deployed per consumer
litellm:
  bond: 0.5
  enabled: "{{ LITELLM_USABLE }}"
  shared: "{{ LITELLM_SHARED }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
  oidc:
    clients:
      web: zammad-web
    backchannel_logout_path: /auth/openid_connect/backchannel_logout
    backchannel_logout_gate: true
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
# nocheck: playwright-service-flag - design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 126
      height: 108
      frame: true
    brand:
      width: 300
      height: 90
    apple-touch-icon:
      width: 180
      height: 180
# nocheck: dynamic-flag
# nocheck: playwright-service-flag
javascript:
  bond: 1
  enabled: true
  shared: true
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true
  shared: "{{ 'svc-db-postgres' in group_names }}"
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
redis:
  bond: 1
  enabled: true
  shared: "{{ 'svc-db-redis' in group_names }}"
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
memcached:
  bond: 1
  enabled: true
  shared: "{{ 'svc-db-memcached' in group_names }}"
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
zammad:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  # nocheck: default-placement-manager  embedded elasticsearch engine state; node-local in swarm
  placement: manager
  image: ghcr.io/zammad/zammad
  version: "7.1.2"
  name: zammad-railsserver
  min_storage: 520MB
  proxy:
    service_key: nginx
  ports:
    internal:
      http: 8080
    local:
      http: 8077
  run_after:
    - web-app-keycloak
    - web-app-email
    - web-svc-seaweedfs
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-zammad', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-zammad', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-zammad', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-zammad', '2fa') }}"
        enforced: true
      registration:
        enabled: "{{ lookup('login_method', 'web-app-zammad', 'registration') }}"
    password_form: >-
      {{ lookup('config', 'web-app-zammad', 'services.zammad.login.method.native.enabled') | bool
         or lookup('config', 'web-app-zammad', 'services.zammad.login.method.ldap.enabled') | bool }}
  ldap_source:
    host: "{{ LDAP.SERVER.DOMAIN }}"
    port: "{{ LDAP.SERVER.PORT | int }}"
  email_channel:
    inbound_host: "{{ lookup('config', 'web-app-zammad', 'services.zammad.email_channel.outbound_host') }}"
    inbound_port: 143
    outbound_host: >-
      {{ lookup('email', 'web-app-zammad', key='host')
         if lookup('config', 'web-app-zammad', 'services.email.enabled') | bool else '' }}
    outbound_port: >-
      {{ lookup('email', 'web-app-zammad', key='port') | int
         if lookup('config', 'web-app-zammad', 'services.email.enabled') | bool else 0 }}
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "7.1.2"
        until: 2026-11-30
railsserver:
  healthcheck:
    flavor: connect
  name: zammad-railsserver
  ports:
    internal:
      http: 3000
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
websocket:
  name: zammad-websocket
  ports:
    internal:
      http: 6042
  cpus: "0.5"
  mem_reservation: 256m
  mem_limit: 512m
  pids_limit: 512
# nocheck: playwright-service-flag - internal sub-component (bundled search)
search:
  image: docker.elastic.co/elasticsearch/elasticsearch
  version: "9.5.7"
  update:
    type: registry_tags
    image: docker.elastic.co/elasticsearch/elasticsearch
  min_storage: 839MB
  watermark:
    low: "85%"
    high: "90%"
    flood_stage: "95%"
    max_headroom:
      low: 200gb
      high: 150gb
      flood_stage: 100gb
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 512
elasticsearch:
  name: zammad-elasticsearch
  ports:
    internal:
      http: 9200
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 512
precheck:
  name: zammad-search-precheck
  cpus: "0.2"
  mem_reservation: 32m
  mem_limit: 128m
  pids_limit: 64
init:
  name: zammad-init
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 1g
  pids_limit: 1024
  # nocheck: single-replica one-shot zammad-init migrates the database; the swarm wait reads one task
  replicas: 1
scheduler:
  name: zammad-scheduler
  cpus: "1.0"
  mem_reservation: 256m
  mem_limit: 1536m
  pids_limit: 1024
  # nocheck: single-replica zammad background scheduler; one instance enqueues recurring jobs
  replicas: 1
nginx:
  name: zammad-nginx
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 512m
  pids_limit: 512

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
# nocheck: playwright-service-flag  internal adapter sidecar, covered by the role's MCP guest spec
# nocheck: dockerfile-custom  the Dockerfile is owned by svc-ai-mcp-adapter and staged per instance, so every adapter-backed provider shares one audited build
# nocheck: dynamic-flag  the sidecar tracks this role's own mcp flag, not another role's presence; a group_names expression would decide its exposure from an unrelated deployment
zammadmcp:
  enabled: "{{ lookup('config', 'web-app-zammad', 'mcp.enabled') | bool }}"
  shared: false
  image: python
  version: "3.13.18-slim"
  follow: requires-python
  custom: true
  name: zammadmcp
  cpus: "0.25"
  mem_reservation: 16m
  mem_limit: 24m
  pids_limit: 64
  ports:
    internal:
      http: 8080
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openwebui:
  bond: 0.5
  enabled: "{{ 'web-app-openwebui' in group_names }}"
  shared: "{{ 'web-app-openwebui' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
hermes:
  bond: 0.5
  enabled: "{{ 'web-app-hermes' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
openclaw:
  bond: 0.5
  enabled: "{{ 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-openclaw' in group_names }}"
# nocheck: playwright-service-flag  MCP pairing is proven by the role's own MCP spec, not by a per-consumer gate
# nocheck: dynamic-flag  the entry refuses this client, so the link is off on every host and no group_names gate can decide it
flowise:
  enabled: false
  shared: false
  mcp_consumer: false

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
