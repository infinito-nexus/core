---
credentials:
  postgres_password:
    description: "Password for the Zammad PostgreSQL user (used against the central svc-db-postgres or any provider compatible with it)."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{16,}$"
    length: 32
  secret_key_base:
    description: "Rails `secret_key_base` for Zammad (sessions, encrypted cookies). Stable across deploys to avoid invalidating sessions."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{64,}$"
    length: 128
  initial_admin_password:
    description: "Password seeded into Zammad on first start for the bootstrap administrator account. Used once to bypass the setup wizard."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{16,}$"
    length: 32
  api_bot_password:
    description: "Local password for the role-internal `zammad-api-bot` user that backs Basic-auth REST-API calls (Playwright). Also reused as the wizard-bypass admin's
      local password. Alphanumeric on purpose — `lookup('users', 'administrator').password` carries `'$tr0ng€xampl3PW!`-style chars that get mangled by the Ansible→bash→`container
      exec -e`→Ruby ENV.fetch chain (see roles/web-app-joomla/tasks/03_install.yml:55-61 for the same class of bug)."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
  api_token:
    description: "Long-lived Zammad API token pinned on the read-only MCP agent, which the MCP adapter presents to Zammad."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 64
  mcp_bearer:
    description: "Bearer an MCP client must present to this role's adapter instance. Distinct from the upstream credential the adapter presents, because authenticating
      to the application says nothing about who called the adapter."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
  mcp_upstream_token:
    description: "Password of the read-only Zammad agent the MCP adapter's API token belongs to. Distinct from api_token, which is the token itself."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
