---
- name: "🔎 Read the managed settings the next start of {{ application_id }} overwrites"
  ansible.builtin.shell:
    cmd: "container exec {{ HERMES_CONTAINER_ADDRESS }} cat {{ HERMES_CONFIG_CONTAINER_PATH | quote }}"
  register: hermes_config_held
  changed_when: false
  failed_when: false
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when:
    - IS_STACK_HOST | bool
    - (HERMES_DASHBOARD_CONFIG | length > 0) or (HERMES_MCP_CONFIG | length > 0)

- name: "📣 Report the managed settings the next start of {{ application_id }} reverts"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    hermes_config_current: "{{ hermes_config_held.stdout | from_yaml }}"
    forms_drift_current: "{{ {'dashboard': hermes_config_current.dashboard | default({}, true) | dict2items | selectattr('key', 'in', HERMES_DASHBOARD_CONFIG) | items2dict,
      'mcp': ({'servers': HERMES_MCP_CONFIG.servers | mcp_held(hermes_config_current.mcp_servers | default({}, true), '_')} if 'servers' in HERMES_MCP_CONFIG else
      {})} }}"
  when:
    - hermes_config_held is not skipped
    - hermes_config_held.rc == 0

- name: "📄 Render the Hermes agent config from the current discovery"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "env.j2"
        dest: "{{ lookup('container', application_id, 'files.env') }}"
      - src: "config.yaml.j2"
        dest: "{{ HERMES_CONFIG_PATH_HOST }}"
        owner: "{{ HERMES_DOCKER_USER_ID }}"
        group: "{{ HERMES_DOCKER_USER_ID }}"
      - src: "{{ lookup('path_absolute', 'roles/web-app-hermes/files/shell/config-seed.sh') }}"
        dest: "{{ HERMES_CONFIG_SEED_HOOK_PATH_HOST }}"
        mode: "0755"
      - src: "dashboard-theme.yaml.j2"
        dest: "{{ HERMES_DESIGN_THEME_PATH_HOST }}"
        owner: "{{ HERMES_DOCKER_USER_ID }}"
        group: "{{ HERMES_DOCKER_USER_ID }}"
        condition: "{{ HERMES_DESIGN_THEME_ENABLED }}"

- name: "🔄 Start the stack so the agent reads the config"
  ansible.builtin.meta: flush_handlers
