---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: HERMES
    resolve_compose_cid: "{{ HERMES_CONTAINER }}"

- name: "🔌 Probe every MCP server Hermes is configured against"
  ansible.builtin.command:
    argv:
      - container
      - exec
      - -i
      - "{{ HERMES_LOCAL_CID }}" # nocheck: container-exec-resolver
      - hermes
      - mcp
      - test
      - "{{ item.id | replace('-', '_') }}"
  loop: "{{ HERMES_MCP_SERVERS }}"
  register: hermes_mcp_probe
  changed_when: false
  failed_when: false
  retries: 20
  delay: 6
  until:
    - hermes_mcp_probe.rc == 0
    - "'Tools discovered:' in hermes_mcp_probe.stdout"
  delegate_to: "{{ HERMES_HOST_NODE }}"

- name: "🛑 Refuse an MCP client that cannot reach its servers"
  ansible.builtin.assert:
    that:
      - "'Connection failed' not in item.stdout"
      - "'Tools discovered:' in item.stdout"
    fail_msg: "Hermes could not connect to a configured MCP server: {{ item.stdout }}"
  loop: "{{ hermes_mcp_probe.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: MCP_RECONCILE_STRICT | bool
