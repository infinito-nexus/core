---
- include_tasks: utils/once/flag.yml

- name: "🤖 Admit embodied mode for {{ application_id }}"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-robot/tasks/utils/admit.yml') }}"
  vars:
    admit_agent_role: "{{ application_id }}"
  when: "'svc-ai-robot' in group_names"

- name: "🧩 load docker and db for {{ application_id }}"
  include_role:
    name: sys-stk-full

- name: "📄 Render the Hermes agent config (discovered MCP servers)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "config.yaml.j2"
        dest: "{{ HERMES_CONFIG_PATH_HOST }}"

- name: "🔄 Start the stack before reading its runtime"
  ansible.builtin.meta: flush_handlers

- name: "🔌 Prove the configured MCP servers answer"
  ansible.builtin.include_tasks: 01_mcp_assert.yml
  when: HERMES_MCP_SERVERS | length > 0

- name: "🛡️ Prove the isolation {{ application_id }} promises"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-virt-kata/tasks/utils/assert_isolated.yml') }}"
  vars:
    assert_isolated_container: "{{ HERMES_CONTAINER }}"
  when:
    - DEPLOYMENT_MODE == 'compose'
    - "'svc-ai-robot' not in group_names"
    - lookup('config', application_id, 'services.kata.enabled') | bool
