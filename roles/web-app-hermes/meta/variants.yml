---
# Matrix-deploy variant overrides for this role.
# See docs/contributing/artefact/files/role/variants.md for the file format.

- services:
    container_backup:
      enabled: true
    sso:
      enabled: true
      shared: true
    litellm:
      enabled: true
    dashboard:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    design:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: true
    webui:
      enabled: true # nocheck: variants-static-override the web UI is off by default and this variant is the one round that exercises it
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    sso:
      enabled: true
      shared: true
    litellm:
      enabled: false
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    design:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    tor:
      enabled: true
    webui:
      enabled: false # nocheck: variants-static-override variant pins a literal off-switch
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    litellm:
      enabled: false
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    design:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    prometheus:
      enabled: false
      shared: false # nocheck: variants-static-override variant pins a literal off-switch
    tor:
      enabled: true
    webui:
      enabled: false # nocheck: variants-static-override variant pins a literal off-switch
