---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: playwright-service-flag
hermes:
  mcp_consumer: true
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: single-replica the agent keeps its kanban board in one embedded SQLite file on the shared volume, and its runtime turns WAL off on a network filesystem because the shared-memory index WAL coordinates writers through is per-host and not coherent between nodes
  replicas: 1
  bond: 1
  enabled: true
  shared: true
  backup:
    stop_required: false
  image: nousresearch/hermes-agent
  version: "v2026.9.24"
  name: hermes
  agent_runtime:
    name: hermes
    host: broker
  min_context: 64000
  min_storage: 1146MB
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 2048
  ports:
    local:
      http: 8092
      sso: 16512
      agent: 8501
      sso_onion: 16530
    internal:
      http: 8642
      agent: 9119
    onion:
      # nocheck: onion-flag  this port carries the web UI, which answers on the root of the proxy vhost that the node onion already forwards; a direct forward would bypass the proxy, its sign-in gate and its CSP
      agent: false
  lifecycle: beta
  proxy:
    service_key: hermes
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "v2026.9.24"
        until: 2026-11-30
  dashboard:
    theme: "{{ 'corporate' if (lookup('config', 'web-app-hermes', 'services.design.enabled') | bool) else false }}"
    trusted_proxies: "{{ NETWORK_TRUSTED_PROXY_CIDRS }}"
  mcp_servers:
    selected: "{{ lookup('mcp_servers', credentials=false).selected }}"

# nocheck: dynamic-flag - the web UI is a role-local off-switch; no provider role exists whose group membership could decide it
webui:
  enabled: false

# nocheck: playwright-service-flag, dynamic-flag
kata:
  bond: 1
  enabled: true
  shared: true

sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oauth2:
    origin:
      host: hermes
      port: "{{ lookup('config', 'web-app-hermes', 'services.hermes.ports.internal.' ~ ('agent' if lookup('config', 'web-app-hermes', 'services.webui.enabled') |
        bool else 'http')) }}"
    acl:
      whitelist:
        - /v1/
        - /health
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-hermes', role='administrator') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-hermes', role='mcp') }}"

# nocheck: logout, dynamic-flag, playwright-service-flag
logout:
  enabled: false
  shared: false

# nocheck: playwright-service-flag, dynamic-flag - the gateway is a single shared instance, never deployed per consumer
litellm:
  bond: 1
  enabled: "{{ LITELLM_USABLE }}"
  shared: "{{ LITELLM_SHARED }}"

dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "{{ SOFTWARE_NAME }} Agent"
  slots:
    brand:
      width: 320
      height: 64
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  ready_path: health

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

# nocheck: playwright-service-flag, dynamic-flag
container_backup: # nocheck: bond-baseline
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
