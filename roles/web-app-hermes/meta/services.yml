---
# nocheck: playwright-service-flag
hermes:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  backup:
    no_stop_required: true
  image: nousresearch/hermes-agent
  version: "v2026.7.20"
  name: hermes
  min_storage: 10GB
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 2048
  ports:
    local:
      http: 8089
    internal:
      http: 8642
  lifecycle: beta
  proxy:
    service_key: hermes

# nocheck: playwright-service-flag, dynamic-flag
kata:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag
sso:
  bond: 1
  enabled: false
  shared: false

# nocheck: dynamic-flag
logout:
  bond: 1
  enabled: false
  shared: false

# nocheck: playwright-service-flag
litellm:
  bond: 1
  enabled: "{{ 'svc-ai-litellm' in group_names }}"
  shared: "{{ 'svc-ai-litellm' in group_names }}"

# nocheck: shared-provider
mcp:
  bond: 1
  enabled: "{{ 'web-app-homeassistant' in group_names }}"
  shared: "{{ 'web-app-homeassistant' in group_names }}"
  direction: client
  transport: streamable_http
  exposure: internal
  auth: bearer_token
  auth_subject: user
  implementation: native
  tools:
    read_only_default: true
    mutating_tools_enabled: false

dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
css:
  bond: 1
  enabled: "{{ 'web-svc-css' in group_names }}"
  shared: "{{ 'web-svc-css' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag
container_backup: # nocheck: bond-baseline
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
