---
application_id: "web-app-hermes"
entity_name: "{{ application_id | entity_name }}"
domain: "{{ lookup('domain', application_id) }}"
http_port: "{{ lookup('config', application_id, 'services.hermes.ports.local.http') }}"

HERMES_URL: "{{ lookup('tls', application_id, 'url.base') }}"
HERMES_CONTAINER: "{{ lookup('config', application_id, 'services.hermes.name') }}"
HERMES_PORT_INTERNAL: "{{ lookup('config', application_id, 'services.hermes.ports.internal.http') }}"
HERMES_API_SERVER_KEY: "{{ lookup('config', application_id, 'secrets.credentials.api_server_key') }}"
HERMES_WEBUI_ENABLED: "{{ lookup('config', application_id, 'services.webui.enabled') | bool }}"
HERMES_WEBUI_PORT_LOCAL: "{{ lookup('config', application_id, 'services.hermes.ports.local.agent') }}"
HERMES_WEBUI_PORT_INTERNAL: "{{ lookup('config', application_id, 'services.hermes.ports.internal.agent') }}"
HERMES_WEBUI_PASSWORD: "{{ lookup('config', application_id, 'secrets.credentials.webui_password') }}"
HERMES_SSO_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') | bool }}"
HERMES_LITELLM_ENABLED: "{{ lookup('config', application_id, 'services.litellm.enabled') }}"
HERMES_LITELLM_API_KEY: "{{ lookup('config', application_id, 'secrets.credentials.litellm_api_key') }}"
HERMES_CONFIG_PATH_HOST: "{{ [ lookup('container', application_id, 'directories.config'), 'config.yaml' ] | path_join }}"
HERMES_DESIGN_THEME_ENABLED: "{{ HERMES_WEBUI_ENABLED | bool and lookup('config', application_id, 'services.design.enabled') | bool }}"
HERMES_DESIGN_THEME: "corporate"
HERMES_DESIGN_THEME_PATH_HOST: "{{ [ lookup('container', application_id, 'directories.config'), 'dashboard-theme.yaml' ] | path_join }}"
HERMES_DOCKER_USER_ID: 10000
HERMES_MCP_SERVERS: "{{ MCP_DISCOVERED_SERVERS if (lookup('config', application_id, 'mcp.enabled') | bool) else [] }}"
