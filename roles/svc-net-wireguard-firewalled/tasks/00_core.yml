---
- name: "🧱 Accept forwarded traffic from the wireguard client"
  become: true
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ WIREGUARD_CLIENT_INTERFACE }}"
    jump: ACCEPT
    state: present

- name: "🧱 Masquerade the client behind the uplink address"
  become: true
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ WIREGUARD_UPLINK_INTERFACE }}"
    jump: MASQUERADE
    state: present

- include_tasks: utils/once/flag.yml
