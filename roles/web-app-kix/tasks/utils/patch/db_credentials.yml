---
- name: "🔑 Realign the password KIX persisted in its config"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-rdbms/tasks/utils/patch_persisted_password.yml') }}"
  vars:
    patch_volume: "kix_kix_config"
    patch_config_rel: "01main"
    patch_expression: "s|('DatabasePw'\\s*=>\\s*')[^']*(',)|\\1@PASSWORD@\\2|"
