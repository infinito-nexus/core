---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-required
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  oauth2:
    origin:
      host: proxy
      port: "80"
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-kix', role='administrator') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-kix', role='user') }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  bootstrap: true
  slots:
    logo:
      width: 180
      height: 90
    favicon:
      width: 64
      height: 64
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true
  shared: "{{ 'svc-db-postgres' in group_names }}"
  extensions:
    - pg_trgm
# nocheck: shared
# nocheck: dynamic-flag
# nocheck: playwright-service-flag - DB engine, covered by role-local integration tests
redis:
  bond: 1
  name: kix-redis
  enabled: true
  shared: false
kix:
  # nocheck: architecture-pin  Reason: docker-registry.kixdesk.com serves proxy, backend and frontend as single manifest.v2+json images whose config declares amd64, and the public sources carry no build recipe to reach arm64 with: kix-on-premise ships a compose file and no Dockerfile, and kix-backend and kix-frontend publish neither tags nor releases, so a source build could not be pinned to the version the registry serves
  architectures:
    - amd64
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: docker-registry.kixdesk.com/public/proxy
  version: stable
  min_storage: 227MB
  proxy:
    service_key: proxy
  ports:
    internal:
      http: 80
    local:
      http: 8083
      sso: 16500
      sso_onion: 16532
  ldap:
    host: "{{ LDAP.SERVER.DOMAIN }}"
    port: "{{ LDAP.SERVER.PORT | int }}"
    base_dn: "{{ LDAP.DN.OU.USERS }}"
    search_user_dn: "{{ LDAP.DN.ADMINISTRATOR.DATA }}"
    uid: "{{ LDAP.USER.ATTRIBUTES.ID }}"
    access_attr: "{{ LDAP.RBAC.MEMBER_ATTRIBUTE }}"
    administrator_group_dn: "cn=web-app-kix-administrator,{{ LDAP.DN.OU.ROLES }}"
    user_group_dn: "cn=web-app-kix-user,{{ LDAP.DN.OU.ROLES }}"
    contact_sync:
      Email: "{{ LDAP.USER.ATTRIBUTES.MAIL }}"
      Firstname: "{{ LDAP.USER.ATTRIBUTES.FIRSTNAME }}"
      Lastname: "{{ LDAP.USER.ATTRIBUTES.SURNAME }}"
      UserLogin: "{{ LDAP.USER.ATTRIBUTES.ID }}"
      Title: "{{ LDAP.USER.ATTRIBUTES.TITLE }}"
      Phone: "{{ LDAP.USER.ATTRIBUTES.PHONE }}"
      Mobile: "{{ LDAP.USER.ATTRIBUTES.MOBILE }}"
      Street: "{{ LDAP.USER.ATTRIBUTES.STREET }}"
      Zip: "{{ LDAP.USER.ATTRIBUTES.POSTAL_CODE }}"
      City: "{{ LDAP.USER.ATTRIBUTES.LOCALITY }}"
      Country: "{{ LDAP.USER.ATTRIBUTES.COUNTRY }}"
      Comment: "{{ LDAP.USER.ATTRIBUTES.DESCRIPTION }}"
      PrimaryOrganisationID: "SET:1"
  run_after:
    - web-app-keycloak
  lifecycle: beta
  cpus: "0.5"
  mem_reservation: 512m
  mem_limit: 1g
  pids_limit: 512
proxy:
  name: kix-proxy
  cpus: "0.5"
  mem_reservation: 64m
  mem_limit: 512m
  pids_limit: 512
backend:
  backup:
    stop_required: true
  # nocheck: single-replica
  replicas: 1
  name: kix-backend
  image: docker-registry.kixdesk.com/public/backend
  version: stable
  min_storage: 409MB
  ports:
    internal:
      http: 8080
  cpus: "1.5"
  mem_reservation: 2g
  mem_limit: 4g
  pids_limit: 1024
frontend:
  backup:
    stop_required: true
  # nocheck: single-replica
  replicas: 1
  name: kix-frontend
  image: docker-registry.kixdesk.com/public/frontend
  version: stable
  min_storage: 362MB
  ports:
    internal:
      http: 3000
  cpus: "0.5"
  mem_reservation: 512m
  mem_limit: 1g
  pids_limit: 512

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
