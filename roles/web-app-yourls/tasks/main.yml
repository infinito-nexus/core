---
- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: sys-stk-full
  vars:
    application_id: web-app-yourls
    compose_handlers_flush: false
    webserver_extra_configuration: "{{ lookup('template', 'redirect.conf.j2') }}"

- name: "🎬 Stage the user/cache.php drop-in build context for {{ application_id }}"
  stack_host_copy:
    src: "sso/infinito_sso.php"
    dest: "{{ [ lookup('container', application_id, 'directories.instance'), 'infinito_sso.php' ] | path_join }}"
    mode: "0644"
  notify:
    - compose-build
    - compose-up

- name: "🚿 Flush compose handlers for {{ application_id }}"
  ansible.builtin.meta: flush_handlers

- name: "📦 Install the YOURLS database schema for {{ application_id }}"
  ansible.builtin.include_tasks: install.yml
  when: IS_STACK_HOST | bool
