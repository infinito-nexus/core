---
pds_data:
  type: volume
  mounts:
    - service: pds
      target: /opt/pds

broker_data:
  type: volume
  nfs:
    uid: "1000"
    gid: "1000"
    mode: "0700"
  mounts:
    - service: broker
      target: /data

pdsadmin:
  type: bind
  source: "{{ [lookup('container', 'web-app-bluesky', 'directories.volumes'), 'pdsadmin', 'pdsadmin'] | path_join }}"
  mounts:
    - service: pds
      target: /usr/local/bin/pdsadmin
      read_only: true
