---
- include_tasks: utils/once/flag.yml

- name: "🛡️ Refuse a pinned PDS that is older than its data"
  ansible.builtin.include_tasks: "utils/pds_guard.yml"
  when: IS_STACK_HOST | bool

- name: "🧱 Rebuild the stack when the pre-compose staging changed a build context"
  ansible.builtin.debug:
    msg: "Pre-compose build context changed for {{ application_id }}"
  changed_when: true
  notify:
    - compose-build
    - compose-up
  when: >-
    (BLUESKY_WEB_ENABLED | bool
     and (bluesky_social_app_clone is changed
          or bluesky_social_app_theme is changed
          or bluesky_social_app_design_patches is changed
          or bluesky_social_app_title_module is changed
          or bluesky_social_app_title_patches is changed
          or bluesky_social_app_logotype is changed
          or bluesky_login_broker_copy is changed))
    or bluesky_pdsadmin_download is changed

- name: "📂 Re-own the compose handler topics before the flush"
  ansible.builtin.include_role:
    name: sys-svc-compose
    tasks_from: none.yml
    handlers_from: main

- name: "🚿 Flush the compose handlers while they still point at '{{ application_id }}'"
  meta: flush_handlers

- name: "📁 Create native PDS administrator (oauth2 disabled, no broker auto-provision)"
  ansible.builtin.include_tasks: "04_native_admin.yml"
  when:
    - BLUESKY_WEB_ENABLED | bool
    - not (lookup('config', application_id, 'services.sso.enabled') | bool)

- name: "🌐 DNS for Bluesky"
  include_tasks: "05_dns.yml"
  when: DNS_PROVIDER | lower == 'cloudflare'

- name: 🔍 Resolve the redirect mappings now (before include_role)
  set_fact:
    BLUESKY_REDIRECT_DOMAIN_MAPPINGS: >-
      {{
        ( (BLUESKY_WEB_ENABLED  | bool) | ternary([], [ {'source': BLUESKY_WEB_DOMAIN,  'target': BLUESKY_API_DOMAIN } ]) )
        + ( (BLUESKY_VIEW_ENABLED | bool) | ternary([], [ {'source': BLUESKY_VIEW_DOMAIN_LOCAL, 'target': BLUESKY_API_DOMAIN } ]) )
      }}

- name: "🛠️ Redirect deactivated BlueSky Services to {{ BLUESKY_API_DOMAIN }}"
  include_tasks: "utils/load/app.yml"
  vars:
    load_app_id: "web-opt-rdr-domains"
    web_opt_rdr_domains_mappings: "{{ BLUESKY_REDIRECT_DOMAIN_MAPPINGS }}"
    web_opt_rdr_domains_logout_enabled: true

- name: "🚿 Flush handlers for '{{ role_name }}'"
  meta: flush_handlers
