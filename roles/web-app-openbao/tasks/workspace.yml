---
# Param: WORKSPACE                 the workspace id, a lowercase UUID (102 decision 3).
# Param: WORKSPACE_ACTION          `apply` or `destroy`.
# Param: workspace_semaphore       apply only: the Semaphore ids of the workspace, all integers:
#                                  project_id, provision_project_id,
#                                  provider_templates.<provider>.{provision,destroy} for each provider,
#                                  unlock_template_id, dns_template_id, zone_template_id, export_project_id,
#                                  export_template_id.
# Param: workspace_owner_group     apply only: the Keycloak id of the workspace's pinned Owner group (113 decision 8),
#                                  which the workspace apply of web-app-keycloak hands to every host.
# Param: workspace_dns             apply only: the zone fact of the DNS flavor; the provision policies read the
#                                  Cloudflare token of workspace_dns.zone alone, so a zone change needs a re-apply.
# Param: WORKSPACE_PLATFORM_TOKENS apply only: the store's switch, a boolean; false denies every provider role of the
#                                  workspace the platform secrets of its provider, so only PROVIDER_TOKEN=workspace runs.
# Param: workspace_state_objects   destroy only: the number of OpenTofu state objects the workspace still holds;
#                                  destroy removes nothing while it is not 0.
- name: "✅ Validate the workspace operation of {{ application_id }}"
  ansible.builtin.assert:
    that:
      - OPENBAO_WORKSPACES_ENABLED | bool
      - WORKSPACE is string
      - WORKSPACE is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - WORKSPACE_ACTION in ['apply', 'destroy']
    fail_msg: >-
      web-app-openbao/tasks/workspace.yml needs a deployed Semaphore, WORKSPACE as a
      lowercase UUID and WORKSPACE_ACTION apply or destroy.
    quiet: true

- name: "🏢 Run the workspace operation on the OpenBao node"
  when: IS_STACK_HOST | bool
  block:
    - name: "🔐 Log in to the OpenBao node with the Ansible AppRole"
      ansible.builtin.include_tasks: workspace/login.yml

    - name: "🏗 Apply or destroy the OpenBao resources of ws-{{ WORKSPACE }}"
      ansible.builtin.include_tasks:
        file: "workspace/{{ WORKSPACE_ACTION }}.yml"
        apply:
          delegate_to: "{{ OPENBAO_HOST_NODE }}"

  always:
    - name: "🧹 Drop the stored workspace token from the container"
      ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
        container exec {{ OPENBAO_LOCAL_CID | quote }}
        sh -c 'bao token revoke -self >/dev/null 2>&1; rm -f ~/.bao-token'
      changed_when: false
      delegate_to: "{{ OPENBAO_HOST_NODE }}"
      when: OPENBAO_LOCAL_CID is defined
