---
- include_tasks: utils/once/flag.yml

- name: "🔍 Read the credentials the previous deploy applied"
  ansible.builtin.slurp:
    src: "{{ OPENBAO_APPLIED_STATE_HOST }}"
  register: openbao_applied_raw
  failed_when: false
  changed_when: false
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🔧 Keep the previously applied credentials for the rotation path"
  ansible.builtin.set_fact:
    openbao_applied_state: >-
      {{ (openbao_applied_raw.content | b64decode | from_json)
         if (openbao_applied_raw.content is defined)
         else {} }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "🧩 load docker for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: "📄 Render the OpenBao server config and RBAC policies (local + swarm peers)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/render_replicated_templates.yml') }}"
  vars:
    role_templates:
      - src: "openbao.hcl.j2"
        dest: "{{ OPENBAO_CONFIG_HOST }}"
        mode: "0644"
      - src: "plugins.hcl.j2"
        dest: "{{ OPENBAO_PLUGINS_CONFIG_HOST }}"
        mode: "0644"
      - src: "policies/ansible-admin.hcl.j2"
        dest: "{{ [OPENBAO_POLICY_DIR_HOST, 'ansible-admin.hcl'] | path_join }}"
        mode: "0644"
      - src: "policies/administrator.hcl.j2"
        dest: "{{ [OPENBAO_POLICY_DIR_HOST, 'administrator.hcl'] | path_join }}"
        mode: "0644"
      - src: "policies/operator.hcl.j2"
        dest: "{{ [OPENBAO_POLICY_DIR_HOST, 'operator.hcl'] | path_join }}"
        mode: "0644"
      - src: "policies/reader.hcl.j2"
        dest: "{{ [OPENBAO_POLICY_DIR_HOST, 'reader.hcl'] | path_join }}"
        mode: "0644"

- name: "🚿 flush handlers for '{{ application_id }}'"
  meta: flush_handlers

- name: "📂 Include role svc-stack for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml

- name: "🔐 Initialise, bootstrap and configure OpenBao for {{ application_id }}"
  include_tasks: 01_init.yml
  when: IS_STACK_HOST | bool
