---
# nocheck: garbage-collector-required  raft compacts its own log in the data volume; the only other files, the workspace raft snapshots under DIR_BACKUPS, are backups that tasks/workspace/apply.yml prunes to workspaces.raft_snapshots where it writes them
# nocheck: seaweedfs-required - OpenBao keeps every secret, policy and PKI object in its own encrypted raft store on {{ lookup('volume', 'web-app-openbao', 'data').target }}; it has no S3/object-store surface.
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
  oidc:
    clients:
      web: openbao-web
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
# nocheck: dynamic-flag  the UI logout must revoke the token on every deployment, with or without a co-deployed logout role
# nocheck: playwright-service-flag  runtime logout hook without a probe-able surface flag, asserted by test-logout.js
javascript:
  bond: 1
  enabled: true
  shared: true
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  title: "{{ SOFTWARE_NAME }} Secrets"
  slots:
    logo:
      width: 128
      height: 128
# nocheck: email, dynamic-flag - OpenBao has no outbound mail surface: it notifies nothing and owns no user mailboxes; audit trails leave through the logging stack.
email:
  bond: 0
  enabled: false
  shared: false
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
  native_metrics:
    enabled: true
    port: 8200
# nocheck: playwright-service-flag  self-provider
openbao:
  # nocheck: default-placement-manager  raft keeps its BoltDB store mmap'd with fsync durability, so it cannot live on NFS; the node is pinned in swarm to stay with its volume
  placement: manager
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  cpus: 0.5
  mem_reservation: 128m
  mem_limit: 512m
  pids_limit: 512
  min_storage: 60MB
  image: openbao/openbao
  version: "2.7.3"
  custom: true
  backup:
    stop_required: true
  # nocheck: single-replica  single-node raft: a second replica would need a real raft join/bootstrap flow, and two tasks against one BoltDB directory corrupt the store
  replicas: 1
  name: openbao
  pki:
    enabled: false
  log_level: info
  ports:
    internal:
      http: 8200
    local:
      http: 8093
  healthcheck:
    flavor: wget
    path: "v1/sys/health?uninitcode=200&sealedcode=200&standbyok=true"
  run_after:
    - web-app-keycloak
    - svc-db-openldap
    - web-app-semaphore
  workspaces:
    audience: openbao
    raft_snapshots: 3
    token_ttl:
      deploy: 4h
      provision: 4h
      export: 1h
    store:
      secret_id_ttl: 720h
      token_ttl: 1h
      token_max_ttl: 4h
    playwright:
      secret_id_ttl: 168h
      token_ttl: 15m
      token_max_ttl: 30m
      mount: platform
      logins:
        semaphore: playwright/semaphore
        store: playwright/store
    dns_broker:
      secret_id_ttl: 0s
      token_ttl: 5m
      token_max_ttl: 10m
  lifecycle: beta
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-openbao', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-openbao', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-openbao', 'native') }}"
# nocheck: playwright-service-flag  build-stage image of the LDAP auth plugin binary, never deployed as a container
# nocheck: dynamic-flag  build-stage image, not group-gated
auth-ldap:
  image: ghcr.io/openbao/openbao-plugin-auth-ldap
  version: "v0.2.0"
  enabled: false

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology; the workspace mounts gated on this flag need a deployed Semaphore that no variant round of this role deploys, so only the false polarity runs here
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
