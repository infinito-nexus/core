---
credentials:
  seal_key:
    description: 32-byte AES-256-GCM-96 key for the OpenBao static seal, injected as env://OPENBAO_SEAL_KEY. Every backup of the raft volume is undecryptable
      without it; its authoritative home is the encrypted inventory.
    algorithm: random_hex_32
    validation: non_empty_string
  approle_role_id:
    description: RoleID of the Ansible AppRole, written to auth/approle/role/ansible/role-id at bootstrap so later deploys authenticate without a stored root
      token.
    algorithm: alphanumeric
    validation: non_empty_string
  approle_secret_id:
    description: SecretID of the Ansible AppRole, written to auth/approle/role/ansible/custom-secret-id at bootstrap.
    algorithm: alphanumeric
    validation: non_empty_string
