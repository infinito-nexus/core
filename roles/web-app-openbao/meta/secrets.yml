---
credentials:
  seal_key:
    description: 32-byte AES-256-GCM-96 key for the OpenBao static seal, injected as env://OPENBAO_SEAL_KEY. Every backup of the raft volume is undecryptable
      without it; its authoritative home is the encrypted inventory. Pinned because the static seal carries only one generation, so a deploy that skips a
      generation, or dies between the two AppRole pins, puts the store outside that window and leaves it recoverable only from a volume backup plus the key that
      wraps it. Rotate it deliberately by changing the inventory value; openbao.hcl.j2 still renders the previous_key pair for that.
    algorithm: random_hex_32
    validation: non_empty_string
    rotatable: false
  approle_role_id:
    description: RoleID of the Ansible AppRole, written to auth/approle/role/ansible/role-id at bootstrap so later deploys authenticate without a stored root
      token.
    algorithm: alphanumeric
    validation: non_empty_string
  approle_secret_id:
    description: SecretID of the Ansible AppRole, written to auth/approle/role/ansible/custom-secret-id at bootstrap.
    algorithm: alphanumeric
    validation: non_empty_string
  store_approle_role_id:
    description: RoleID of the store AppRole, pinned to auth/approle/role/store/role-id on every deploy while Semaphore is deployed. Pinned because the store
      logs in with it between deploys.
    algorithm: alphanumeric
    validation: non_empty_string
    rotatable: false
  store_approle_secret_id:
    description: First SecretID of the store AppRole, written through custom-secret-id only while the role holds no SecretID. The store rotates it on its own
      within the 720 h SecretID TTL and destroys this one, so a later deploy never writes it again.
    algorithm: alphanumeric
    validation: non_empty_string
    rotatable: false
  playwright_approle_role_id:
    description: RoleID of the Playwright AppRole, pinned to auth/approle/role/playwright/role-id only while the deploy runs the test runner. The Playwright env
      files carry this pair instead of the Ansible AppRole, the store AppRole or the Semaphore break-glass login.
    algorithm: alphanumeric
    validation: non_empty_string
  playwright_approle_secret_id:
    description: SecretID of the Playwright AppRole, registered through custom-secret-id while the role holds none. A deploy whose pair OpenBao refuses drops
      the role and registers this one again; a deploy outside the test runtimes drops the role.
    algorithm: alphanumeric
    validation: non_empty_string
  oidc_client_secret:
    description: Client secret of OpenBao's own confidential Keycloak client openbao-web, rendered into the realm import and written to auth/oidc/config.
    algorithm: sha256
    validation: ^[a-f0-9]{64}$
