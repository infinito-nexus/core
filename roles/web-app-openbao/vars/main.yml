---
application_id: "web-app-openbao"
container_port: "{{ lookup('config', application_id, 'services.openbao.ports.internal.http') }}"

OPENBAO_NAME: "{{ lookup('config', application_id, 'services.openbao.name') }}"
OPENBAO_IMAGE: "{{ lookup('config', application_id, 'services.openbao.image') }}"
OPENBAO_VERSION: "{{ lookup('config', application_id, 'services.openbao.version') }}"

OPENBAO_LDAP_PLUGIN_IMAGE: "{{ lookup('config', application_id, 'services.auth-ldap.image') }}"
OPENBAO_LDAP_PLUGIN_VERSION: "{{ lookup('config', application_id, 'services.auth-ldap.version') }}"
OPENBAO_LDAP_PLUGIN_BINARY: "openbao-plugin-auth-ldap"
OPENBAO_PLUGIN_DIR_DOCKER: "/opt/openbao/plugins"
OPENBAO_IMAGE_TAG: "{{ OPENBAO_VERSION }}-auth-ldap-{{ OPENBAO_LDAP_PLUGIN_VERSION }}"

OPENBAO_SSO_ENABLED: "{{ lookup('config', application_id, 'services.sso.enabled') }}"
OPENBAO_LDAP_ENABLED: "{{ lookup('config', application_id, 'services.ldap.enabled') }}"
OPENBAO_PKI_ENABLED: "{{ lookup('config', application_id, 'services.openbao.pki.enabled') }}"
OPENBAO_LOG_LEVEL: "{{ lookup('config', application_id, 'services.openbao.log_level') }}"

OPENBAO_BASE_URL: "{{ lookup('tls', application_id, 'url.origin') }}"

OPENBAO_CONFIG_HOST: "{{ [lookup('container', application_id, 'directories.config'), 'openbao.hcl'] | path_join }}"
OPENBAO_PLUGINS_CONFIG_HOST: "{{ [lookup('container', application_id, 'directories.config'), 'plugins.hcl'] | path_join }}"
OPENBAO_POLICY_DIR_HOST: "{{ [lookup('container', application_id, 'directories.config'), 'policies'] | path_join }}"
OPENBAO_POLICY_DIR_DOCKER: "/openbao/policies"
OPENBAO_DATA_DOCKER: "{{ lookup('volume', application_id, 'data').target }}"

OPENBAO_SEAL_KEY: "{{ lookup('config', application_id, 'secrets.credentials.seal_key') }}"
OPENBAO_APPROLE_ROLE_ID: "{{ lookup('config', application_id, 'secrets.credentials.approle_role_id') }}"
OPENBAO_APPROLE_SECRET_ID: "{{ lookup('config', application_id, 'secrets.credentials.approle_secret_id') }}"

OPENBAO_SEAL_KEY_ID: "{{ (OPENBAO_SEAL_KEY | hash('sha256'))[:16] }}"

OPENBAO_APPLIED_STATE_HOST: "{{ [lookup('container', application_id, 'directories.instance'), '.applied.json'] | path_join }}"
OPENBAO_APPLIED: "{{ openbao_applied_state | default({}, true) }}"
OPENBAO_SEAL_KEY_PREVIOUS: "{{ OPENBAO_APPLIED.seal_key | default('', true) }}"
OPENBAO_SEAL_KEY_PREVIOUS_ID: "{{ (OPENBAO_SEAL_KEY_PREVIOUS | hash('sha256'))[:16] if OPENBAO_SEAL_KEY_PREVIOUS else '' }}"
OPENBAO_SEAL_ROTATING: "{{ (OPENBAO_SEAL_KEY_PREVIOUS | length > 0) and (OPENBAO_SEAL_KEY_PREVIOUS != OPENBAO_SEAL_KEY) }}"

OPENBAO_RECOVERY_TOKEN_APP: "{{ application_id }}-recovery"
OPENBAO_RECOVERY_KEY: >-
  {{ (sys_token_store_users | default({}, true))
     .get(IAM_PLATFORM_ADMIN_USER_KEY, {})
     .get('tokens', {})
     .get(OPENBAO_RECOVERY_TOKEN_APP, '') }}
OPENBAO_RECOVERY_LEGACY_SLOT: "administrator"
OPENBAO_RECOVERY_KEY_LEGACY: >-
  {{ (sys_token_store_users | default({}, true))
     .get(OPENBAO_RECOVERY_LEGACY_SLOT, {})
     .get('tokens', {})
     .get(OPENBAO_RECOVERY_TOKEN_APP, '') }}

OPENBAO_SECRET_ID_REGISTERED: "{{ openbao_secret_id_registered | default('', true) }}"
OPENBAO_SECRET_ID_ROTATING: "{{ (OPENBAO_SECRET_ID_REGISTERED | length > 0) and (OPENBAO_SECRET_ID_REGISTERED != OPENBAO_APPROLE_SECRET_ID) }}"
OPENBAO_KV_MOUNT: "infinito"
OPENBAO_AUDIT_PATH: "stdout"
OPENBAO_AUDIT_PROBE: "audit-probe"
OPENBAO_ANSIBLE_APPROLE: "ansible"
OPENBAO_PKI_MOUNT: "pki"
OPENBAO_PKI_ISSUING_ROLE: "internal"
OPENBAO_PKI_ISSUING_URL: "{{ OPENBAO_BASE_URL }}/v1/{{ OPENBAO_PKI_MOUNT }}/ca"
OPENBAO_PKI_CRL_URL: "{{ OPENBAO_BASE_URL }}/v1/{{ OPENBAO_PKI_MOUNT }}/crl"

OPENBAO_OIDC_ISSUER: "{{ OIDC.CLIENT.ISSUER_URL }}"
OPENBAO_OIDC_CLIENT_ID: "{{ lookup('config', application_id, 'services.sso.oidc.clients.web') }}"
OPENBAO_OIDC_CLIENT_SECRET: "{{ lookup('config', application_id, 'secrets.credentials.oidc_client_secret') }}"
OPENBAO_OIDC_USER_CLAIM: "{{ OIDC.ATTRIBUTES.USERNAME }}"
OPENBAO_OIDC_GROUPS_CLAIM: "{{ RBAC.GROUP.CLAIM }}"
OPENBAO_OIDC_CLAIM_MAPPINGS:
  - "{{ OIDC.ATTRIBUTES.EMAIL }}={{ OIDC.ATTRIBUTES.EMAIL }}"
  - "{{ OIDC.ATTRIBUTES.NAME }}={{ OIDC.ATTRIBUTES.NAME }}"
OPENBAO_OIDC_DEFAULT_ROLE: "default"
OPENBAO_OIDC_TOKEN_TTL: "{{ lookup('config', 'web-app-keycloak', 'services.keycloak.realm.sso_session_idle_timeout_seconds') }}"
OPENBAO_OIDC_TOKEN_MAX_TTL: "{{ lookup('config', 'web-app-keycloak', 'services.keycloak.realm.sso_session_max_lifespan_seconds') }}"
OPENBAO_OIDC_LISTING_VISIBILITY: "{{ 'unauth' if OPENBAO_LOGIN_SSO | bool else 'hidden' }}"

OPENBAO_OIDC_REDIRECT_URIS: >-
  {{ lookup('network_urls', OPENBAO_BASE_URL)
     | product(['/v1/auth/oidc/callback', '/ui/vault/auth/oidc/oidc/callback'])
     | map('join') | join(',') }}

OPENBAO_LDAP_URL: "ldap://{{ LDAP.SERVER.DOMAIN }}:{{ LDAP.SERVER.PORT }}"
OPENBAO_LDAP_USER_ATTR: "{{ LDAP.USER.ATTRIBUTES.ID }}"

OPENBAO_LOGIN_SSO: "{{ lookup('config', application_id, 'services.openbao.login.method.sso.enabled') | bool }}"
OPENBAO_LOGIN_LDAP: "{{ (OPENBAO_LDAP_ENABLED | bool) and (lookup('config', application_id, 'services.openbao.login.method.ldap.enabled') | bool) }}"
OPENBAO_USERPASS_ENABLED: "{{ lookup('config', application_id, 'services.openbao.login.method.native.enabled') | bool }}"
OPENBAO_USERPASS_MOUNT: "userpass"
OPENBAO_USERPASS_MARKER: "infinito-nexus-managed"
OPENBAO_USERPASS_USERNAME: "{{ lookup('users', 'platform_administrator').username }}"
OPENBAO_USERPASS_PASSWORD: "{{ lookup('users', 'platform_administrator').password }}"
OPENBAO_USERPASS_POLICY: "administrator"
OPENBAO_PASSWORD_AUTH_MOUNT: "{{ 'ldap' if OPENBAO_LOGIN_LDAP | bool else (OPENBAO_USERPASS_MOUNT if OPENBAO_USERPASS_ENABLED | bool else '') }}"

OPENBAO_RBAC_ROLES: "{{ lookup('config', application_id, 'rbac.roles') | list }}"

OPENBAO_WORKSPACES_ENABLED: "{{ lookup('config', application_id, 'services.semaphore.enabled') | bool }}"
OPENBAO_TENANT_MOUNT: "tenant"
OPENBAO_TENANT_MAX_VERSIONS: 1
OPENBAO_PLATFORM_MOUNT: "platform"
OPENBAO_TRANSIT_MOUNT: "transit"
OPENBAO_KV_TENANCY_MOUNTS:
  - "{{ OPENBAO_TENANT_MOUNT }}"
  - "{{ OPENBAO_PLATFORM_MOUNT }}"
OPENBAO_JWT_MOUNT: "jwt"
OPENBAO_JWT_EXPORT_MOUNT: "jwt-export"
OPENBAO_JWT_MOUNTS:
  - "{{ OPENBAO_JWT_MOUNT }}"
  - "{{ OPENBAO_JWT_EXPORT_MOUNT }}"
OPENBAO_JWT_AUDIENCE: "{{ lookup('config', application_id, 'services.openbao.workspaces.audience') }}"
OPENBAO_JWT_ISSUER: "{{ lookup('tls', 'web-app-semaphore', 'url.origin') }}"
OPENBAO_JWT_JWKS_URL: "{{ OPENBAO_JWT_ISSUER }}/.well-known/jwks.json"
OPENBAO_JWT_CA_REQUIRED: "{{ (TLS_MODE | lower) == 'self_signed' }}"
OPENBAO_JWT_CONFIG:
  jwks_url: "{{ OPENBAO_JWT_JWKS_URL }}"
  bound_issuer: "{{ OPENBAO_JWT_ISSUER }}"
  jwks_ca_pem: "{{ (openbao_jwt_ca.content | b64decode) if (OPENBAO_JWT_CA_REQUIRED | bool) else '' }}"
OPENBAO_JWT_TOKEN_TTL: "{{ lookup('config', application_id, 'services.openbao.workspaces.token_ttl') }}"
OPENBAO_TENANCY_POLICIES:
  - tenant
  - store
  - tenant-export
  - export-shared
  - members
  - store-credentials
  - task-entities
  - dns-broker
OPENBAO_STORE_CREDENTIALS_ROLE: "store-credentials"
OPENBAO_TASK_ENTITIES_ROLE: "task-entities"
OPENBAO_FIXTURE_POLICY: "fixture"
OPENBAO_FIXTURE_ROLE: "workspace-fixture"
OPENBAO_FIXTURE_PREFIX: "fixture"
OPENBAO_FIXTURE_WORKSPACE_KEY: "workspace-ssh"
OPENBAO_EXPORT_SCHEDULE_ROLES:
  announce-owners: "announce owners"
  prune-exports: "prune exports"
OPENBAO_STORE_SEMAPHORE_PATH: "store/semaphore"
OPENBAO_STORE_GITEA_PATH: "store/gitea"
OPENBAO_STORE_APPROLE: "store"
OPENBAO_STORE_APPROLE_CONFIG: "{{ lookup('config', application_id, 'services.openbao.workspaces.store') }}"
OPENBAO_STORE_ROLE_ID: "{{ lookup('config', application_id, 'secrets.credentials.store_approle_role_id') }}"
OPENBAO_STORE_SECRET_ID: "{{ lookup('config', application_id, 'secrets.credentials.store_approle_secret_id') }}"
OPENBAO_STORE_WORKSPACES_PATH: "store/semaphore/workspaces"
OPENBAO_PLAYWRIGHT_APPROLE: "playwright"
OPENBAO_PLAYWRIGHT_ENABLED: "{{ RUNTIME in ['dev', 'act', 'github'] and OPENBAO_WORKSPACES_ENABLED | bool }}"
OPENBAO_PLAYWRIGHT_CONFIG: "{{ lookup('config', application_id, 'services.openbao.workspaces.playwright') }}"
OPENBAO_PLAYWRIGHT_ROLE_ID: "{{ lookup('config', application_id, 'secrets.credentials.playwright_approle_role_id') }}"
OPENBAO_PLAYWRIGHT_SECRET_ID: "{{ lookup('config', application_id, 'secrets.credentials.playwright_approle_secret_id') }}"
OPENBAO_PLAYWRIGHT_LOGINS:
  semaphore:
    username: "{{ lookup('users', 'web-app-semaphore-breakglass').username }}"
    password: "{{ lookup('users', 'web-app-semaphore-breakglass').password }}"
  store:
    role_id: "{{ OPENBAO_STORE_ROLE_ID }}"
    secret_id: "{{ OPENBAO_STORE_SECRET_ID }}"
OPENBAO_DNS_BROKER_APPROLE: "dns-broker"
OPENBAO_DNS_BROKER_CONFIG: "{{ lookup('config', application_id, 'services.openbao.workspaces.dns_broker') }}"
OPENBAO_DNS_BROKER_ROLE_ID: "{{ lookup('config', application_id, 'secrets.credentials.dns_broker_approle_role_id') }}"
OPENBAO_DNS_BROKER_SECRET_ID: "{{ lookup('config', application_id, 'secrets.credentials.dns_broker_approle_secret_id') }}"
OPENBAO_RAFT_SNAPSHOT_DIR: "{{ [DIR_BACKUPS, application_id, 'raft'] | path_join }}"
OPENBAO_RAFT_SNAPSHOT_KEEP: "{{ lookup('config', application_id, 'services.openbao.workspaces.raft_snapshots') }}"
OPENBAO_TRANSIT_RECORD_PREFIX: "provision/transit"
OPENBAO_ZONE_TOKEN_PATH: "provision/cloudflare-zones"
OPENBAO_OWNER_RECORD_PREFIX: "export/owners"
OPENBAO_DNS_SCOPE_PREFIX: "provision/dns-scope"
OPENBAO_PROVISION_SECRETS:
  hetzner:
    platform:
      - "{{ OPENBAO_PLATFORM_MOUNT }}/data/provision/hetzner"
    workspace:
      - "{{ OPENBAO_TENANT_MOUNT }}/data/{workspace}-provision/providers/hetzner"
  ionos:
    platform:
      - "{{ OPENBAO_PLATFORM_MOUNT }}/data/provision/ionos"
    workspace:
      - "{{ OPENBAO_TENANT_MOUNT }}/data/{workspace}-provision/providers/ionos"
  scs:
    platform:
      - "{{ OPENBAO_TENANT_MOUNT }}/data/{workspace}-provision/scs"
    workspace:
      - "{{ OPENBAO_TENANT_MOUNT }}/data/{workspace}-provision/providers/scs"
  proxmox:
    platform:
      - "{{ OPENBAO_PLATFORM_MOUNT }}/data/provision/proxmox-*"
      - "{{ OPENBAO_TENANT_MOUNT }}/data/{workspace}-provision/proxmox"
    workspace: []
  incus:
    platform:
      - "{{ OPENBAO_PLATFORM_MOUNT }}/data/provision/incus-*"
      - "{{ OPENBAO_TENANT_MOUNT }}/data/{workspace}-provision/incus"
    workspace: []
OPENBAO_PROVISION_PROVIDER_NAMES: "{{ OPENBAO_PROVISION_SECRETS | list }}"
