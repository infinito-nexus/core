---
credentials:
  relay_shared_secret:
    description: RELAY_SHARED_SECRET that authenticates every non-public request of the dashboard to the AIS relay
    algorithm: random_hex_32
    validation: "^[0-9a-f]{64}$"
  relay_key:
    description: WORLDMONITOR_RELAY_KEY the relay sends and the dashboard API accepts on the feed digest it classifies
    algorithm: random_hex_32
    validation: "^[0-9a-f]{64}$"
  redis_password:
    description: REDIS_PASSWORD, the requirepass of the in-stack Redis that the REST proxy connects with
    algorithm: random_hex_32
    validation: "^[0-9a-f]{64}$"
  redis_token:
    description: REDIS_TOKEN, the bearer token the in-stack Redis REST proxy requires from the app, the relay and the seeder
    algorithm: random_hex_32
    validation: "^[0-9a-f]{64}$"
  session_secret:
    description: WM_SESSION_SECRET that signs the anonymous wms_ browser session of the self-hosted API routes
    algorithm: random_hex_32
    validation: "^[0-9a-f]{64}$"
  litellm_api_key:
    description: Per-consumer virtual key for the shared svc-ai-litellm gateway
    algorithm: sk_prefixed
    validation:
      min_length: 50
  finnhub_api_key:
    description: FINNHUB_API_KEY for equity quotes and search; empty leaves the feed unseeded
    default: ""
  alpha_vantage_api_key:
    description: ALPHA_VANTAGE_API_KEY, the equity fallback of the seeders; empty leaves it out
    default: ""
  fred_api_key:
    description: FRED_API_KEY for the economic series; empty leaves the feed unseeded
    default: ""
  eia_api_key:
    description: EIA_API_KEY for the energy data; empty leaves the feed unseeded
    default: ""
  acled_email:
    description: ACLED_EMAIL of the ACLED OAuth flow for conflict and unrest events; empty leaves the feed unseeded
    default: ""
  acled_password:
    description: ACLED_PASSWORD of the ACLED OAuth flow; empty leaves the feed unseeded
    default: ""
  acled_access_token:
    description: ACLED_ACCESS_TOKEN, a static ACLED token used instead of the OAuth flow; empty leaves it out
    default: ""
  nasa_firms_api_key:
    description: NASA_FIRMS_API_KEY for the wildfire detections; empty leaves the feed unseeded
    default: ""
  aviationstack_api:
    description: AVIATIONSTACK_API key for the aviation data; empty leaves the feed unseeded
    default: ""
  travelpayouts_api_token:
    description: TRAVELPAYOUTS_API_TOKEN for the flight price search; empty leaves it out
    default: ""
  aisstream_api_key:
    description: AISSTREAM_API_KEY for the live vessel tracking of the app and the AIS relay; empty leaves the vessel layer empty
    default: ""
  cloudflare_api_token:
    description: CLOUDFLARE_API_TOKEN with Cloudflare Radar read access for the internet outage layer; keep it apart from the DNS token of the platform; empty
      leaves the layer empty
    default: ""
