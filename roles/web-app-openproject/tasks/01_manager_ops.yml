---
- name: "📁 Create {{ OPENPROJECT_PLUGINS_FOLDER }}"
  file:
    path: "{{ OPENPROJECT_PLUGINS_FOLDER }}"
    state: directory
    mode: "0755"

- name: "📁 Transferring Gemfile to {{ OPENPROJECT_PLUGINS_FOLDER }} as Gemfile.plugins"
  copy:
    src: Gemfile
    dest: "{{ [OPENPROJECT_PLUGINS_FOLDER,'Gemfile.plugins'] | path_join }}"
  notify:
    - compose-up
    - compose-build

- name: "⏳ Transferring await_migrations.sh to {{ OPENPROJECT_AWAIT_MIGRATIONS_ABS }}"
  stack_host_copy:
    src: shell/await_migrations.sh
    dest: "{{ OPENPROJECT_AWAIT_MIGRATIONS_ABS }}"
    mode: "0555"
  notify: compose-up

- name: "📁 create {{ OPENPROJECT_DUMMY_DIR }}"
  file:
    path: "{{ OPENPROJECT_DUMMY_DIR }}"
    state: directory
    mode: "0755"

- name: "⬆️ Step an older schema through the majors before the pinned one"
  include_tasks: upgrade/main.yml
  when: IS_COMPOSE_MODE

- name: 🚿 flush docker service
  meta: flush_handlers

- name: ⏳ Wait until the seeder has committed the seed (swarm)
  ansible.builtin.script: "{{ lookup('path_absolute', 'roles/sys-svc-compose/files/shell/swarm/job_state.sh') }}"
  environment:
    JOB: "{{ lookup('container_service', application_id, OPENPROJECT_SEEDER_SERVICE) }}"
  register: openproject_seeder_state
  changed_when: false
  retries: 120
  delay: 10
  until: openproject_seeder_state.rc != 1
  failed_when: openproject_seeder_state.rc != 0
  when: DEPLOYMENT_MODE == 'swarm'

- name: ▶️ Migrate the OpenProject database
  include_tasks: 02_migrate.yml

- name: 🔧 Setup LDAP
  include_tasks: 03_ldap.yml
  when: OPENPROJECT_LDAP_ENABLED | bool

- name: 🔧 Apply settings and the OpenProject administrator
  include_tasks: 04_admin.yml

- name: "🧩 Provision the OpenProject addons"
  include_tasks: 05_addons.yml
  when: OPENPROJECT_ADDONS_ENABLED | length > 0
