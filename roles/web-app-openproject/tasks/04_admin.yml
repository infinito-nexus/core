---
- name: 📖 Read the settings, administrator and LDAP link OpenProject holds
  include_tasks:
    file: 04_admin/state.yml
    apply:
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: 🔍 Find the stamp of the last settings and administrator run
  ansible.builtin.stat:
    path: "{{ OPENPROJECT_ADMIN_STAMP_FILE }}"
  register: openproject_admin_stamp_file

- name: 📖 Read the stamp of the last settings and administrator run
  ansible.builtin.slurp:
    src: "{{ OPENPROJECT_ADMIN_STAMP_FILE }}"
  register: openproject_admin_stamp
  when: openproject_admin_stamp_file.stat.exists

- name: 🧮 Decide whether the settings and administrator need a run
  ansible.builtin.set_fact:
    openproject_admin_due: >-
      {{ (OPENPROJECT_ADMIN_FORCE | bool)
         or openproject_admin_stamp is skipped
         or (openproject_admin_stamp.content | b64decode | trim) != openproject_admin_digest }}

- name: 🔧 Run the settings and administrator step and stamp what it left
  when: openproject_admin_due | bool
  block:
    - name: 🔧 Apply settings, ensure the administrator and link it to LDAP
      include_tasks: 04_admin/provision.yml

    - name: 📖 Read the settings, administrator and LDAP link the run left
      include_tasks:
        file: 04_admin/state.yml
        apply:
          no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

    - name: 📝 Stamp the settings, administrator and LDAP link the run left
      stack_host_copy:
        content: "{{ openproject_admin_digest }}\n"
        dest: "{{ OPENPROJECT_ADMIN_STAMP_FILE }}"
        mode: "0600"
