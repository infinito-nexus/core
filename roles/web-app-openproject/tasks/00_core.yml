---
- include_tasks: utils/once/flag.yml

- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "👔 OpenProject manager-side operations (file deploys + container exec)"
  include_tasks: 01_manager_ops.yml
  when: IS_STACK_HOST | bool

- name: "👑 Reconcile OpenProject administrators with the administrator role group"
  include_tasks: 06_rbac.yml
