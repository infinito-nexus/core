---
- name: ⏳ Wait until OpenProject web container is running (compose)
  shell: >
    container inspect --type container
    -f '{{"{{"}}.State.Status{{"}}"}}' {{ OPENPROJECT_WEB_CONTAINER_ADDRESS }}
  register: openproject_web_state
  retries: 60
  delay: 5
  until: openproject_web_state.stdout.strip() == "running"
  changed_when: false
  when: DEPLOYMENT_MODE == 'compose'

- name: ⏳ Wait until OpenProject web service converged (swarm)
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/wait_converged.yml') }}"
  vars:
    wait_service_key: "{{ OPENPROJECT_WEB_SERVICE }}"

- name: "🔍 Resolve the OpenProject web hosting node and container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ OPENPROJECT_WEB_SERVICE }}"
    resolve_service_name: "{{ lookup('container_service', application_id, OPENPROJECT_WEB_SERVICE) }}"
    resolve_output_prefix: OPENPROJECT_WEB
    resolve_compose_cid: "{{ OPENPROJECT_WEB_CONTAINER_ADDRESS }}"
    resolve_converge_retries: 120
    resolve_converge_delay: 5

- name: 🔍 Read the image of the OpenProject web container
  ansible.builtin.command:
    argv:
      - container
      - inspect
      - --type
      - container
      - --format
      - "{{ '{{.Image}}' }}"
      - "{{ OPENPROJECT_WEB_LOCAL_CID }}" # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
  delegate_to: "{{ OPENPROJECT_WEB_HOST_NODE }}"
  register: openproject_web_image
  changed_when: false

- name: 🔍 Read the image that last migrated the schema
  database_query:
    mask_values: false
    config: "{{ lookup('database', application_id) }}"
    query_file: "{{ role_path }}/files/sql/migration-stamp/read.sql"
    expect_rows: true
  register: openproject_migration_stamp
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: ▶️ Migrate the schema for an image that has not migrated it yet
  include_tasks: 02_migrate/run.yml
  when: openproject_migration_stamp.stdout | openproject_migrations_pending(openproject_web_image.stdout)
