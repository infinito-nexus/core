---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
# nocheck: seaweedfs-playwright — S3 backs work-package attachments (embedded FOG storage); no standalone object-browser surface to script, consistent with the playwright-service-flag exemption on the seaweedfs key.
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
# nocheck: playwright-service-flag — DB engine, covered by role-local integration tests
postgres:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-postgres' in group_names }}"
# nocheck: playwright-service-flag — object store, no Playwright surface
minio:
  enabled: false # nocheck: dynamic-flag
  shared: false # nocheck: dynamic-flag
# nocheck: playwright-service-flag — object store, no Playwright surface
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
web:
  name: openproject-web
  healthcheck:
    flavor: curl
    path: health_checks/default
  ports:
    internal:
      http: 8080
  image: openproject/openproject
  version: "17"
  custom: true
  backup:
    stop_required: false
  cpus: "3.0"
  mem_reservation: 3g
  mem_limit: 6g
  pids_limit: 2048
  min_storage: 1076MB
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "17"
        until: 2026-11-30
seeder:
  name: openproject-seeder
  cpus: "0.3"
  mem_reservation: 256m
  mem_limit: 512m
  pids_limit: 256
  min_storage: 1GB
  # nocheck: single-replica run-once seeder. Concurrent replicas race on one Postgres (duplicate-key) and never converge; the seeder migrates/seeds once then exits.
  replicas: 1
cron:
  name: openproject-cron
  cpus: "0.3"
  mem_reservation: 256m
  mem_limit: 512m
  pids_limit: 256
  min_storage: 1GB
  # nocheck: single-replica GoodJob scheduler. Concurrent cron replicas race to enqueue the same recurring jobs and collide on the (cron_key, cron_at) unique index; one scheduler is enough.
  replicas: 1
worker:
  name: openproject-worker
  cpus: "2.0"
  mem_reservation: 2g
  mem_limit: 3g
  pids_limit: 2048
  min_storage: 5GB
proxy:
  name: openproject-proxy
  cpus: "0.3"
  mem_reservation: 256m
  mem_limit: 512m
  pids_limit: 256
  min_storage: 1GB
cache:
  # nocheck: single-replica  memcached does not replicate, and OpenProject keeps the session here: a second replica answers requests that carry a session it never stored, so the API returns 401 on every hop the login did not land on
  replicas: 1
  name: openproject-cache
  cpus: "0.3"
  mem_reservation: 512m
  mem_limit: 512m
  pids_limit: 256
  min_storage: 1GB
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oauth2
  header_trust:
    proxy_secret: auth_source_sso_secret
    switch: "lookup('sso', application_id, 'is_proxy_gated') and services.ldap.enabled"
    files: [templates/env.j2]
  oauth2:
    origin:
      host: proxy
      port: "80"
    acl:
      whitelist:
        - /users/me
        - /api/
        - /oauth/token
    allowed_groups:
      - "{{ lookup('rbac_group_path', application_id='web-app-openproject', role='administrator') }}"
      - "{{ lookup('rbac_group_path', application_id='web-app-openproject', role='user') }}"
# nocheck: playwright-service-flag — design consumer, no Playwright surface (provider: web-svc-design)
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 260
      height: 94
      frame: true
    icon:
      width: 66
      height: 66
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: playwright-service-flag: shared provider entity; the app itself is covered by this role's own Playwright spec
openproject:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: true
  repository: https://github.com/opf/openproject-deploy
  ref: "stable/{{ lookup('config', 'web-app-openproject', 'services.web.version') }}"
  ref_kind: branch
  ldap:
    filters:
      administrators: true
      users: true
  admin:
    force: false
  app_title: "{{ lookup('design', 'web-app-openproject').label }}"
  host_name: "{{ lookup('domain', 'web-app-openproject') }}"
  https: "{{ lookup('tls', 'web-app-openproject', 'enabled') }}"
  user_default_theme: sync_with_os
  ports:
    local:
      sso: 16483
      sso_onion: 16537
      http: 8023
    internal:
      http: 80
  proxy:
    service_key: web
    internal_port: 8080
  run_after:
    - web-app-keycloak
  lifecycle: beta
  min_storage: 10GB
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
# nocheck: playwright-service-flag: bridged gitlab partner, covered by partner role spec
gitlab:
  bond: 0.5
  enabled: "{{ 'web-app-gitlab' in group_names }}"
  shared: "{{ 'web-app-gitlab' in group_names }}"
# nocheck: playwright-service-flag: bridged nextcloud partner, covered by partner role spec
nextcloud:
  bond: 0.5
  enabled: "{{ 'web-app-nextcloud' in group_names }}"
  shared: "{{ 'web-app-nextcloud' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: false # nocheck: semaphore-contract  shared provider other roles consume, so pausing it would take its consumers down with it
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  checkout:
    ref: "{{ lookup('config', 'web-app-openproject', 'services.openproject.ref') }}"
    url: "{{ lookup('config', 'web-app-openproject', 'services.openproject.repository') }}"
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
