---
# Matrix-deploy variant overrides for web-app-openproject.
# See docs/contributing/artefact/files/role/variants.md for the file format.
#
# nocheck: variant-limit: folding the nextcloud round into variant 2 next to
# gitlab was measured and does not fit, at 35.58 GB reservation against the
# 32 GB cap and 76.02 GB limit against the 64 GB cap. The storages addon needs
# a round of its own, and it has to be the last one: a role with fewer variants
# falls back to variant 0 in a later round, so putting the heavier gitlab round
# at index 3 instead pushed both web-app-openproject and web-app-nextcloud over
# the cap there (37.61 GB and 37.93 GB).

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-openproject.
- services:
    container_backup:
      enabled: true
    design:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    email:
      enabled: true
      shared: true
    gitlab:
      enabled: false
      shared: false
    nextcloud:
      enabled: false
      shared: false
    ldap:
      shared: true
      enabled: true
    logout:
      enabled: true
      shared: true
    matomo:
      enabled: true
      shared: true
    sso:
      enabled: true
      shared: true
    postgres:
      shared: true
    prometheus:
      enabled: true
      shared: true
    seaweedfs:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    design:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    dashboard:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    email:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    gitlab:
      enabled: false
      shared: false
    nextcloud:
      enabled: false
      shared: false
    ldap:
      shared: false # nocheck: variants-static-override backup shared stays literally true
      enabled: false
    logout:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    matomo:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    sso:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    postgres:
