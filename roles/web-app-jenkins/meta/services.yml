---
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
jenkins:
  healthcheck:
    flavor: curl
    path: login
    start_period: 10m
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: single-replica
  replicas: 1
  image: jenkins/jenkins
  version: lts
  custom: true
  name: jenkins
  ports:
    local:
      http: 8070
    internal:
      http: 8080
  run_after:
    - web-app-keycloak
    - web-app-matomo
  lifecycle: beta
  min_storage: 490MB
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 1024
mcp:
  bond: 1
  enabled: "{{ 'web-app-hermes' in group_names or 'web-app-openclaw' in group_names }}"
  shared: "{{ 'web-app-hermes' in group_names or 'web-app-openclaw' in group_names }}"
  direction: server
  source_url: https://plugins.jenkins.io/mcp-server/
  minimum_version: "2.462"
  notes: Plugin based; pinned like every other Jenkins plugin.
  transport: streamable_http
  exposure: internal
  auth: basic_auth
  auth_subject: administrator
  implementation: plugin
  endpoint:
    service_key: jenkins
    path: /mcp-server/mcp
    port_key: http
  tools:
    read_only_default: true
    mutating_tools_enabled: false
# nocheck: playwright-service-flag — css consumer, no Playwright surface (provider: web-svc-css)
css:
  bond: 1
  enabled: "{{ 'web-svc-css' in group_names }}"
  shared: "{{ 'web-svc-css' in group_names }}"

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
