---
credentials:
  mcp_bearer:
    description: "Bearer an MCP client must present to this role's adapter instance. Distinct from the Jenkins API token the adapter presents upstream: the controller
      serves its MCP endpoint to anonymous callers, so the adapter is what authenticates the caller."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{32,}$"
    length: 48
