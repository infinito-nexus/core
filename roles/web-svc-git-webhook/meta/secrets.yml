---
credentials:
  webhook_secret:
    description: "Secret GitHub signs every webhook delivery with (X-Hub-Signature-256). Paste the same value into the webhook's 'Secret' field on GitHub."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{40,}$"
    length: 48
  github_webhook_token:
    description: "Fine-grained GitHub token of a dedicated bot account, with an expiry date and read-only Contents, Metadata and Pull requests, that the receiver uses to
      look up whether a commit pushed to a default branch came through a merged pull request. Provided by the organization owner; empty or expired, every lookup raises
      rule 101114."
    algorithm: plain
    validation: "^.*$"
  github_settings_token:
    description: "Fine-grained GitHub token of a dedicated bot account, with an expiry date and read-only Administration, Metadata, Contents, Secret scanning alerts,
      Dependabot alerts and Organization members, that sys-ctl-hlth-git-settings uses to compare the organization and repository settings with their expected
      state. Provided by the organization owner; empty, expired or lacking a permission, the check raises rule 100163 instead of reporting no drift."
    algorithm: plain
    validation: "^.*$"
  gitea_webhook_secret:
    description: "Secret Gitea signs every webhook delivery with (X-Gitea-Signature). Paste the same value into the organization webhook's 'Secret' field in Gitea;
      the receiver serves /gitea only while it is set."
    algorithm: alphanumeric
    validation: "^[A-Za-z0-9]{40,}$"
    length: 48
  gitlab_webhook_secret:
    description: "Signing token GitLab (19.0 or later) generates for the group webhook, starting with whsec_. Provided by the GitLab administrator; the receiver
      serves /gitlab only while it is set, and refuses deliveries that carry only the plain X-Gitlab-Token."
    algorithm: plain
    validation: "^(whsec_[A-Za-z0-9+/=]+)?$"
  gitea_token:
    description: "Gitea access token of a dedicated bot account, with an expiry date and only the read:repository, read:organization and read:user scopes, that the
      deployed code check and sys-ctl-hlth-git-settings use against the Gitea API. Provided by the Gitea administrator; empty, a Gitea checkout or repository raises
      its check's failure rule instead of passing."
    algorithm: plain
    validation: "^.*$"
  gitlab_token:
    description: "GitLab personal or group access token of a dedicated bot account, with an expiry date and only the read_api scope, that the deployed code check and
      sys-ctl-hlth-git-settings use against the GitLab API. Provided by the GitLab administrator; empty, a GitLab checkout or project raises its check's failure
      rule instead of passing."
    algorithm: plain
    validation: "^.*$"
