---
data:
  type: volume
  name: espocrm_data
  mounts:
    - service: espocrm
      target: &var_www_html_data_target /var/www/html/data
    - service: daemon
      target: *var_www_html_data_target
    - service: websocket
      target: *var_www_html_data_target

custom:
  type: volume
  name: espocrm_custom
  mounts:
    - service: espocrm
      target: &var_www_html_custom_target /var/www/html/custom
    - service: daemon
      target: *var_www_html_custom_target
    - service: websocket
      target: *var_www_html_custom_target

client_custom:
  type: volume
  name: espocrm_client_custom
  mounts:
    - service: espocrm
      target: &var_www_html_client_custom_target /var/www/html/client/custom
    - service: daemon
      target: *var_www_html_client_custom_target
    - service: websocket
      target: *var_www_html_client_custom_target
