---
# nocheck: garbage-collector-required  no app-specific leftovers known; not yet audited for native housekeeping
sso:
  bond: 1
  enabled: "{{ 'web-app-keycloak' in group_names }}"
  shared: "{{ 'web-app-keycloak' in group_names }}"
  flavor: oidc
ldap:
  bond: 1
  enabled: "{{ 'svc-db-openldap' in group_names }}"
  shared: "{{ 'svc-db-openldap' in group_names }}"
  autocreate: true
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
matomo:
  bond: 1
  enabled: "{{ 'web-app-matomo' in group_names }}"
  shared: "{{ 'web-app-matomo' in group_names }}"
email:
  bond: 1
  enabled: "{{ 'web-app-email' in group_names }}"
  shared: "{{ 'web-app-email' in group_names }}"
mariadb:
  bond: 1
  enabled: true # nocheck: dynamic-flag
  shared: "{{ 'svc-db-mariadb' in group_names }}"
espocrm:
  backup:
    stop_required: false
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  image: espocrm/espocrm
  version: "10.1.4"
  custom: true
  name: espocrm
  min_storage: 470MB
  cpus: 1.5
  mem_reservation: 1.2g
  mem_limit: 2g
  pids_limit: 768
  email:
    from_name: Customer Relationship Management ({{ DOMAIN_PRIMARY }})
  authentication_method: >-
    {{ 'Oidc' if lookup('config', 'web-app-espocrm', 'services.espocrm.login.method.sso.enabled') | bool
       else ('LDAP' if lookup('config', 'web-app-espocrm', 'services.espocrm.login.method.ldap.enabled') | bool else 'Espo') }}
  second_factor_forced: >-
    {{ lookup('config', 'web-app-espocrm', 'services.espocrm.login.method.2fa.enabled') | bool
       and lookup('config', 'web-app-espocrm', 'services.espocrm.login.method.2fa.enforced') | bool }}
  login:
    method:
      sso:
        enabled: "{{ lookup('login_method', 'web-app-espocrm', 'sso') }}"
      ldap:
        enabled: "{{ lookup('login_method', 'web-app-espocrm', 'ldap') }}"
      native:
        enabled: "{{ lookup('login_method', 'web-app-espocrm', 'native') }}"
      2fa:
        enabled: "{{ lookup('login_method', 'web-app-espocrm', '2fa') }}"
        enforced: true
  maintenance_mode: false
  ports:
    internal:
      http: 80
      websocket: 8080
    local:
      websocket: 4002
      http: 8040
  healthcheck:
    flavor: curl
    # nocheck: healthcheck-timing-override  boots slower than the ten minute window; the value predates this default and has not been measured against it
    start_period: 15m
  run_after:
    - web-app-keycloak
    - web-app-email
  lifecycle: beta
daemon:
  healthcheck:
    test: ["CMD-SHELL", "test -f /var/www/html/bootstrap.php && php -r \"require '/var/www/html/bootstrap.php'; echo 'OK';\""]
    retries: 5
  # nocheck: single-replica
  replicas: 1
  cpus: 0.5
  mem_reservation: 0.25g
  mem_limit: 0.5g
  pids_limit: 384
websocket:
  # nocheck: single-replica
  replicas: 1
  cpus: 0.5
  mem_reservation: 0.25g
  mem_limit: 0.5g
  pids_limit: 384
seaweedfs:
  bond: 1
  enabled: "{{ 'web-svc-seaweedfs' in group_names }}"
  shared: "{{ 'web-svc-seaweedfs' in group_names }}"
design:
  bond: 1
  enabled: "{{ 'web-svc-design' in group_names }}"
  shared: "{{ 'web-svc-design' in group_names }}"
  slots:
    logo:
      width: 182
      height: 40
      frame: true
    favicon:
      width: 180
      height: 180
# nocheck: dynamic-flag
recaptcha:
  enabled: "{{ RECAPTCHA_ENABLED | bool }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag
# nocheck: dynamic-flag
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true

docs:
  bond: 0.5
  enabled: "{{ 'web-app-docs' in group_names }}"
  shared: "{{ 'web-app-docs' in group_names }}"

# nocheck: bond-baseline, variants-coverage  Semaphore controls the role from outside the variant topology and no task of the role branches on this flag, so no variant round has a polarity to exercise
semaphore:
  bond: 0.5
  enabled: "{{ 'web-app-semaphore' in group_names }}"
  shared: "{{ 'web-app-semaphore' in group_names }}"
  control: true
  status: started

# nocheck: dynamic-flag, playwright-service-flag  every role with a compose project or a vhost declares the stack literally (045 decision 2); no spec gates on it
stack:
  bond: 1
  enabled: true
  shared: true

# nocheck: dynamic-flag, playwright-service-flag  the role serves a vhost and declares it literally (045 decision 3); no spec gates on it
openresty:
  bond: 1
  enabled: true
  shared: true
