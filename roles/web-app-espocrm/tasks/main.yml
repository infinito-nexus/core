---
- name: "🧩 load docker, db and proxy for {{ application_id }}"
  include_role:
    name: svc-stack
    tasks_from: consumer.yml

- name: "👔 EspoCRM manager-side operations (file deploys + container exec)"
  include_tasks: 02_manager_ops.yml
  when: IS_STACK_HOST | bool

- name: "🛂 Reconcile the RBAC roles of {{ application_id }}"
  include_tasks: 03_rbac.yml
