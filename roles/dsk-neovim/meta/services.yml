---
# nocheck: dynamic-flag  the desktop base is the premise of every dsk role, not a per-host option
desktop-base:
  bond: 1
  enabled: true
  shared: true
neovim:
  modes:
    host:
      enabled: true
  lifecycle: pre-alpha
  min_storage: "50MB"
  cpus: "0.1"
  mem_reservation: "32m"
  mem_limit: "128m"
  pids_limit: 64
