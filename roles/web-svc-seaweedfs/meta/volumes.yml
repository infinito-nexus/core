---
data:
  type: volume
  name: seaweedfs_data
  mounts:
    - service: seaweedfs
      target: /data
s3_config:
  type: bind
  source: "{{ [ lookup('container', 'web-svc-seaweedfs', 'directories.volumes'), 's3' ] | path_join }}"
  read_only: true
  mounts:
    - service: seaweedfs
      target: /etc/seaweedfs/s3
