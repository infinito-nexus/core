---
- services:
    container_backup:
      enabled: true
    prometheus:
      enabled: "{{ 'svc-net-tor' not in group_names }}"
      shared: "{{ 'svc-net-tor' not in group_names }}"
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    prometheus:
      enabled: false
      shared: false
