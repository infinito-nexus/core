---
# nocheck: tor-contract — object-storage backend; consumed server-side over the
# internal network (matrix S3 media etc.), never a Tor-browser surface, so it
# rides no node onion. The browser consoles live in web-app-seaweedfs-console.
# nocheck: playwright-service-flag — central object-store provider entity
seaweedfs:
  healthcheck:
    flavor: curl
    path: status
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  /data IS the storage engine: leveldb2 filer LSM, master raft metadata, needle blob volumes; all NFS-unsafe, so the central provider stays node-local like the svc-db-* engines
  placement: manager
  # nocheck: single-replica
  replicas: 1
  bond: 1
  enabled: true
  shared: true
  image: chrislusf/seaweedfs
  version: "4.47"
  name: seaweedfs
  api_port: 8333
  region: us-east-1
  min_storage: 304MB
  cpus: "1.0"
  mem_reservation: 1g
  mem_limit: 2g
  pids_limit: 2048
  lifecycle: beta
  ports:
    local:
      http: 8085
    internal:
      http: 8333
      filer: 8888
      master: 9333
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
