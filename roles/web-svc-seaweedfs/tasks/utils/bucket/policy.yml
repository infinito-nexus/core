---
# Param: seaweedfs_bucket_policy_bucket - bucket name; the bucket MUST already exist
# Param: seaweedfs_bucket_policy_public - true when anonymous reads of the bucket are wanted
- name: "🔐 Converge the bucket policy of '{{ seaweedfs_bucket_policy_bucket }}'"
  vars:
    _seaweedfs_bucket_policy_url: "{{ SEAWEEDFS_S3_LOCAL_URL }}/{{ seaweedfs_bucket_policy_bucket }}?policy"
    _seaweedfs_bucket_policy_stored: "{{ _seaweedfs_bucket_policy_read.stdout | seaweedfs_stored_bucket_policy }}"
    _seaweedfs_bucket_policy_target: >-
      {{ _seaweedfs_bucket_policy_stored | seaweedfs_bucket_policy_target(
           seaweedfs_bucket_policy_bucket,
           seaweedfs_bucket_policy_public | bool) }}
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  block:
    - name: "🔍 Read the bucket policy of '{{ seaweedfs_bucket_policy_bucket }}'"
      ansible.builtin.shell: >-
        {{ SEAWEEDFS_S3_SIGNED_CURL }} -w '\n%{http_code}' {{ _seaweedfs_bucket_policy_url | quote }}
      args:
        executable: /bin/bash
        stdin: "{{ SEAWEEDFS_ADMIN_CREDENTIALS }}"
      register: _seaweedfs_bucket_policy_read
      changed_when: false
      check_mode: false
      failed_when: >-
        _seaweedfs_bucket_policy_read.rc != 0
        or (_seaweedfs_bucket_policy_read.stdout | seaweedfs_stored_bucket_policy) is none
      timeout: "{{ lookup('timeout', 60) | int }}"
      retries: 3
      delay: 10
      until: _seaweedfs_bucket_policy_read is succeeded

    - name: "🔒 Put the target bucket policy on '{{ seaweedfs_bucket_policy_bucket }}'"
      ansible.builtin.shell: >-
        {{ SEAWEEDFS_S3_SIGNED_CURL }} -f -X PUT --data-binary @- {{ _seaweedfs_bucket_policy_url | quote }}
      args:
        executable: /bin/bash
        stdin: |-
          {{ SEAWEEDFS_ADMIN_CREDENTIALS }}
          {{ _seaweedfs_bucket_policy_target | to_json }}
      register: _seaweedfs_bucket_policy_put
      changed_when: true
      timeout: "{{ lookup('timeout', 60) | int }}"
      retries: 3
      delay: 10
      until: _seaweedfs_bucket_policy_put is succeeded
      when: >-
        _seaweedfs_bucket_policy_target | length > 0
        and _seaweedfs_bucket_policy_target != _seaweedfs_bucket_policy_stored

    - name: "🔓 Delete the bucket policy of '{{ seaweedfs_bucket_policy_bucket }}'"
      ansible.builtin.shell: >-
        {{ SEAWEEDFS_S3_SIGNED_CURL }} -f -X DELETE {{ _seaweedfs_bucket_policy_url | quote }}
      args:
        executable: /bin/bash
        stdin: "{{ SEAWEEDFS_ADMIN_CREDENTIALS }}"
      register: _seaweedfs_bucket_policy_delete
      changed_when: true
      timeout: "{{ lookup('timeout', 60) | int }}"
      retries: 3
      delay: 10
      until: _seaweedfs_bucket_policy_delete is succeeded
      when: >-
        _seaweedfs_bucket_policy_target | length == 0
        and _seaweedfs_bucket_policy_stored | length > 0
