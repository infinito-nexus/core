---
- include_tasks: utils/once/flag.yml

- name: "🧩 For '{{ application_id }}': load docker and compose"
  include_role:
    name: svc-stack
    tasks_from: consumer/back.yml

- name: "✅ Ensure volumes directory exists"
  ansible.builtin.file:
    path: "{{ lookup('container', application_id, 'directories.volumes') }}"
    state: directory
    mode: "0755"

- name: "📁 Create shared object-store network for '{{ application_id }}'"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/network/create.yml') }}"
  vars:
    network_role_id: "{{ application_id }}"

- name: "✅ Require the keys of the export identity while Semaphore exports"
  ansible.builtin.assert:
    that:
      - SEAWEEDFS_EXPORT.access_key | length > 0
      - SEAWEEDFS_EXPORT.secret_key | length > 0
    fail_msg: >-
      {{ SEAWEEDFS_EXPORT_OWNER }} runs exports, but its inventory holds no
      secrets.credentials.export_s3_access_key and export_s3_secret_key.
    quiet: true
  when: SEAWEEDFS_EXPORT.enabled | bool
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"

- name: "📄 Assemble the SeaweedFS S3 identities config"
  include_tasks: utils/s3_config/render.yml
  when: IS_STACK_HOST | bool

- name: "▶️ Start the SeaweedFS stack"
  ansible.builtin.meta: flush_handlers

- name: "📂 Include role svc-stack for '{{ application_id }}'"
  include_role:
    name: svc-stack
    tasks_from: consumer/front.yml

- name: "🔐 Converge every consumer bucket's policy once the S3 gateway answers"
  include_tasks: utils/bucket/policies.yml
  when: IS_STACK_HOST | bool
