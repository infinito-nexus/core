---
application_id: "web-app-hugo"
entity_name: "{{ application_id | get_entity_name }}"

HUGO_CONTAINER: "{{ entity_name }}"
HUGO_SERVICE: "{{ entity_name }}"

HUGO_NGINX_IMAGE: "{{ lookup('config', application_id, 'services.hugo.image') }}"
HUGO_NGINX_VERSION: "{{ lookup('config', application_id, 'services.hugo.version') }}"
HUGO_BUILDER_IMAGE: "{{ lookup('config', application_id, 'services.hugo.builder_image') }}"
HUGO_BUILDER_VERSION: "{{ lookup('config', application_id, 'services.hugo.builder_version') }}"

HUGO_SOURCE_REPO: "{{ lookup('config', 'web-app-hugo', 'services.hugo.source_repository') }}"
HUGO_SOURCE_REF: "{{ lookup('config', 'web-app-hugo', 'services.hugo.source_version') }}"

HUGO_BASE_URL: "{{ lookup('tls', application_id, 'url.base') }}"
HUGO_ENVIRONMENT: "{{ lookup('config', application_id, 'services.hugo.hugo_environment') }}"
HUGO_MINIFY: "{{ lookup('config', application_id, 'services.hugo.hugo_minify') }}"

HUGO_DOCS_SOURCE: "{{ 'gohugoio/hugoDocs' in HUGO_SOURCE_REPO }}"
HUGO_DESIGN_ENABLED: "{{ lookup('config', application_id, 'services.design.enabled') | bool and HUGO_DOCS_SOURCE | bool }}"
HUGO_DESIGN: "{{ lookup('design', application_id) }}"
HUGO_DESIGN_DIR: "{{ [lookup('container', application_id, 'directories.services'), 'design'] | path_join }}"
HUGO_DESIGN_ASSETS_DIR: "{{ [HUGO_DESIGN_DIR, 'generated'] | path_join }}"
HUGO_DESIGN_LOGO: "{{ HUGO_DESIGN_ENABLED | bool and HUGO_DESIGN.logo is string }}"
HUGO_DESIGN_TITLE: "{{ HUGO_DESIGN_ENABLED | bool and HUGO_DESIGN.title is string }}"
HUGO_DESIGN_OVERLAY:
  - src: logo.svg
    dest: static/images/hugo-logo-wide.svg
  - src: logo-frame.svg
    dest: static/images/design-logo-frame.svg
  - src: favicon.png
    dest: static/favicon-32x32.png
  - src: favicon-16.png
    dest: static/favicon-16x16.png
  - src: apple-touch-icon.png
    dest: static/apple-touch-icon.png
  - src: favicon.ico
    dest: static/favicon.ico
