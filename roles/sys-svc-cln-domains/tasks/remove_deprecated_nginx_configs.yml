---
- name: 🔍 Find matching nginx configs for {{ domain }}
  ansible.builtin.find:
    paths: "{{ lookup('nginx','directories.configuration.servers') }}"
    recurse: true
    patterns:
      - "{{ domain }}.conf"
      - "*.{{ domain }}.conf"
  register: find_result

- name: 🗑️ Remove the nginx configs of {{ domain }} and its subdomains
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ find_result.files | default([]) }}"
  when: item is defined
  notify: restart-openresty
