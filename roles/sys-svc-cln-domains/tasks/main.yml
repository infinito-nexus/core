---
- block:
    - name: 📂 Include dependencies
      include_role:
        name: "{{ dependency_role }}"
      loop:
        - sys-svc-webserver-core
      loop_control:
        loop_var: dependency_role

    - name: 📂 Include task to remove deprecated and unserved nginx configs
      include_tasks: nginx_configs.yml
      when:
        - MODE_CLEANUP | bool

    - include_tasks: utils/once/flag.yml
  when: run_once_sys_svc_cln_domains is not defined
