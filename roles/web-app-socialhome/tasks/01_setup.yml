---
# Exception: upstream provisions the admin from SH_ADMIN_PASSWORD in
# platform/standalone/adapter.py on_startup but never calls mark_complete(), so the SPA keeps
# rendering the setup wizard. Re-posting the same credentials is a no-op for provision_admin()
# and flips the setup flag; 409 means a previous run already did it.

- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: SOCIALHOME
    resolve_compose_cid: "{{ SOCIALHOME_CONTAINER }}"

- name: "🔍 Resolve the Social Home network namespace for host-side API calls"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/netns.yml') }}"
  vars:
    netns_output_prefix: SOCIALHOME

- name: "⏳ Wait for Social Home at {{ SOCIALHOME_INTERNAL_URL }}/healthz"
  ansible.builtin.command:
    argv: "{{ SOCIALHOME_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', '') }}"
  environment:
    HTTP_METHOD: GET
    HTTP_URL: "{{ SOCIALHOME_INTERNAL_URL }}/healthz"
  register: socialhome_health
  retries: 30
  delay: 5
  until: socialhome_health.rc == 0 and (socialhome_health.stdout | from_json).status == 200
  changed_when: false
  delegate_to: "{{ SOCIALHOME_HOST_NODE }}"
  become: true

- name: "🔐 Mark the standalone first-boot setup complete"
  ansible.builtin.command:
    argv: "{{ SOCIALHOME_NETNS_PYTHON }}"
    stdin: "{{ lookup('http_request_program', {'username': SOCIALHOME_ADMIN_USERNAME, 'password': SOCIALHOME_ADMIN_PASSWORD} | to_json) }}"
  environment:
    HTTP_METHOD: POST
    HTTP_URL: "{{ SOCIALHOME_INTERNAL_URL }}/api/setup/standalone"
  register: socialhome_setup
  retries: 30
  delay: 2
  until: socialhome_setup.rc == 0 and (socialhome_setup.stdout | from_json).status in [201, 409]
  changed_when: socialhome_setup.rc == 0 and (socialhome_setup.stdout | from_json).status == 201
  delegate_to: "{{ SOCIALHOME_HOST_NODE }}"
  become: true
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
