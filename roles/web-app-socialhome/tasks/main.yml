---
- name: "🧩 load docker, proxy for '{{ application_id }}'"
  include_role:
    name: sys-stk-full
  vars:
    compose_handlers_flush: false

- name: "📄 Render socialhome.toml for '{{ application_id }}'"
  stack_host_template:
    src: socialhome.toml.j2
    dest: "{{ SOCIALHOME_CONFIG_HOST_FILE }}"
    mode: "0444"
  notify: compose-up

- name: "🐳 Finalize compose deploy for '{{ application_id }}'"
  include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/finalize.yml') }}"

- name: "🔐 Configure Social Home through its API for '{{ application_id }}'"
  when: IS_STACK_HOST | bool
  run_once: true
  block:
    - name: "🔐 Complete the standalone first-boot setup for '{{ application_id }}'"
      include_tasks: 01_setup.yml

    - name: "🎨 Converge the household theme for '{{ application_id }}'"
      include_tasks: 02_design.yml
