---
socialhome:
  healthcheck:
    flavor: http_status
    path: healthz
  modes:
    host:
      enabled: false
    compose:
      enabled: true
    swarm:
      enabled: true
  # nocheck: default-placement-manager  embedded sqlite in a node-local volume; no clustered storage
  placement: manager
  image: ghcr.io/social-home-io/socialhome
  version: "2026.6.16"
  ports:
    local:
      http: 8089
    internal:
      http: 8099
  lifecycle: alpha
  # nocheck: min-storage-headroom  Reason: the SQLite database plus the household media volume, whose cap SH_MAX_STORAGE_BYTES sets to 4 GiB
  min_storage: "5GB"
  cpus: "0.5"
  mem_reservation: "256m"
  mem_limit: "1g"
  pids_limit: 512
# nocheck: playwright-service-flag — TURN/STUN server, no Playwright surface (provider: web-svc-coturn)
coturn:
  bond: 1
  enabled: "{{ 'web-svc-coturn' in group_names }}"
  shared: "{{ 'web-svc-coturn' in group_names }}"
prometheus:
  bond: 1
  enabled: "{{ 'web-app-prometheus' in group_names }}"
  shared: "{{ 'web-app-prometheus' in group_names }}"
logout:
  bond: 1
  enabled: "{{ 'web-svc-logout' in group_names }}"
  shared: "{{ 'web-svc-logout' in group_names }}"
dashboard:
  bond: 1
  enabled: "{{ 'web-app-dashboard' in group_names }}"
  shared: "{{ 'web-app-dashboard' in group_names }}"
# nocheck: dynamic-flag
# nocheck: oidc
# nocheck: sso
sso:
  enabled: false
  shared: false

# nocheck: playwright-service-flag
# nocheck: variants-coverage — sso-variant-tor requires the onion on in every variant, so the false polarity has no variant left to live in
tor:
  bond: 0.5
  enabled: "{{ 'svc-net-tor' in group_names }}"
  shared: true # nocheck: dynamic-flag

# nocheck: playwright-service-flag, dynamic-flag infrastructure backup consumer
container_backup: # nocheck: bond-baseline backup host joins outside the variant topology
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
