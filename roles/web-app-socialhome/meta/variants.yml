---
# Matrix-deploy variant overrides for web-app-socialhome.
# See docs/contributing/artefact/files/role/variants.md for the file format.

# variant pinning every dynamic services.yml flag to true so the
# matrix exercises the in-group_names branch of web-app-socialhome.
- services:
    container_backup:
      enabled: true
    coturn:
      enabled: true
      shared: true
    dashboard:
      enabled: true
      shared: true
    logout:
      enabled: true
      shared: true
    prometheus:
      enabled: true
      shared: true
    tor:
      enabled: true
- services:
    container_backup:
      enabled: false
      shared: false # nocheck: variants-static-override backup shared stays literally true
    coturn:
      enabled: false
      shared: false
    dashboard:
      enabled: false
      shared: false
    logout:
      enabled: false
      shared: false
    prometheus:
      enabled: false
      shared: false
    tor:
      enabled: true
