---
- name: 🔄 Reload the systemd units before the Docker daemon restart
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: container-manager-restart

- name: 🔄 Restart the Docker daemon one host at a time and wait until it settled
  ansible.builtin.script: "{{ role_path }}/files/shell/restart_daemon.sh"
  args:
    executable: /bin/bash
  environment:
    SWARM_NODE: "{{ (IS_SWARM_MODE | bool) | string | lower }}"
    SETTLE_TIMEOUT: "{{ lookup('timeout', 600) | int }}"
  throttle: 1
  changed_when: true
  listen: container-manager-restart

- name: 💬 Ensure Docker-In-Docker DNS works
  ansible.builtin.script: "{{ role_path }}/files/shell/test-dns.sh"
  register: docker_in_docker_dns_check
  until: docker_in_docker_dns_check is succeeded
  retries: 7
  delay: 20
  listen: container-manager-restart
  when:
    - DOCKER_IN_CONTAINER | bool
    - networks.internet.dns | length > 0
  environment:
    BUSYBOX_IMAGE: "{{ lookup('config', 'sys-svc-container', 'services.busybox.image') }}:{{ lookup('config', 'sys-svc-container', 'services.busybox.version') }}"
    NODE_IMAGE: "{{ '' if IS_SWARM_MODE else lookup('config', 'sys-svc-container', 'services.node.image') ~ ':' ~ lookup('config', 'sys-svc-container', 'services.node.version')
      }}"
    DOMAIN: "{{ DOMAIN_PRIMARY }}"
    CA_CONTAINER_ENABLED: "0"
