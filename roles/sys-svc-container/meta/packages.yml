---
docker-cli:
  Archlinux:
    - docker
    - docker-buildx
    - docker-compose
  Debian:
    names:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    repo:
      managed_externally: sys-svc-container configures the download.docker.com repository per distro before installing
  RedHat:
    names:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    repo:
      managed_externally: sys-svc-container configures the download.docker.com repository per distro before installing

nvidia-container-toolkit:
  Archlinux:
    - nvidia-container-toolkit
  Debian:
    names:
      - nvidia-container-toolkit
    repo:
      managed_externally: sys-svc-container configures the nvidia.github.io repository before installing
  RedHat:
    names:
      - nvidia-container-toolkit
    repo:
      managed_externally: sys-svc-container configures the nvidia.github.io repository before installing

iproute:
