---
svc-container:
  lifecycle: beta
  required_by:
    compose:
      categories: [web]
    swarm:
      categories: [web]
# nocheck: image-healthcheck  utility image run as a one-shot, no long-running process
busybox:
  image: busybox
  version: "1.38"
# nocheck: image-healthcheck  build-time image run as a one-shot, no service port
node:
  image: node
  version: "26-alpine"
