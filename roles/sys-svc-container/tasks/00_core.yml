---
- name: 🔧 Setup Docker repository on Debian and Ubuntu
  include_tasks: 00_core/debian.yml
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: 🔧 Setup Docker repository and SDK prerequisites on RedHat family
  include_tasks: 00_core/redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: 📦 Install Docker packages
  package_install:
    id: docker-cli
  register: sys_svc_container_packages_install
  retries: 5
  delay: 15
  until: sys_svc_container_packages_install is succeeded
  notify: container-manager-restart

- name: 📦 Install Docker Python SDK dependencies via pip
  include_role:
    name: sys-pip-install
  vars:
    package_name:
      - docker
      - requests
    package_state: present
    global_install: true

- name: 📦 Install container wrapper (container)
  become: true
  ansible.builtin.copy:
    src: python/container.py
    dest: "{{ BIN_CONTAINER }}"
    mode: "0755"
    owner: root
    group: root

- name: "✅ Assert that required services are available"
  include_tasks: "01_assert_requirements.yml"
  when: MODE_ASSERT | bool

- name: "🧩 Load docker in docker procedures"
  include_tasks: "02_docker_in_docker.yml"
  when: DOCKER_IN_CONTAINER | bool

- name: 🔄 Restart and enable docker service
  meta: flush_handlers

- name: ✅ Ensure docker service is enabled and running
  ansible.builtin.service:
    name: docker.service
    state: started
    enabled: true

- name: "🔧 Resync dockerd when containerd restarted underneath it"
  become: true
  ansible.builtin.script: shell/reconcile_runtime.sh
  register: sys_svc_container_runtime_reconcile
  changed_when: "'RECONCILED:' in sys_svc_container_runtime_reconcile.stdout"
  throttle: 1

- name: ⏳ Wait for docker socket to be available
  ansible.builtin.wait_for:
    path: /var/run/docker.sock
    state: present
    timeout: "{{ lookup('timeout', 60) | int }}"

- name: "✏️ Overwrite when DOCKER_IN_CONTAINER is true"
  block:
    - name: ⬇️ Get docker bridge gateway
      docker_bridge_gateway:
      register: gw
      changed_when: false

    - name: "🔧 Set docker bridge gateway fact to '{{ gw.gateway }}'"
      set_fact:
        DOCKER_REACH_HOST: "{{ gw.gateway }}"
      changed_when: false
  when: DOCKER_IN_CONTAINER | bool

- name: 🔧 Setup Swapfile to prevent OOM Failures
  include_tasks: "utils/load/app.yml"
  vars:
    load_app_id: "svc-opt-swapfile"
  when: run_once_svc_opt_swapfile is not defined

- name: "📂 Load reset tasks when MODE_RESET is enabled"
  include_tasks: "03_reset.yml"
  when: MODE_RESET | bool

- include_tasks: utils/once/flag.yml
