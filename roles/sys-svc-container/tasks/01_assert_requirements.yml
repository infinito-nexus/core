---
- name: 📊 Query the docker unit
  ansible.builtin.systemd_service:
    name: docker.service
  register: sys_svc_container_docker_unit
  failed_when: false

- name: 🔎 Check docker socket
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: docker_sock

- name: ✅ Assert docker service exists
  ansible.builtin.assert:
    that:
      - sys_svc_container_docker_unit.status is defined
      - sys_svc_container_docker_unit.status.LoadState != 'not-found'
    fail_msg: >
      docker.service is not registered in systemd.
      Docker engine does not appear to be installed.
