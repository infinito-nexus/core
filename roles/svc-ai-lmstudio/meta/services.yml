---
lmstudio:
  modes:
    compose:
      enabled: true
    swarm:
      enabled: true
  bond: 1
  enabled: true
  shared: true
  backup:
    no_stop_required: true
  image: lmstudio/llmster-preview
  # nocheck: docker-version -- the repository publishes 2 tags and neither is a version; 'cpu' selects the backend, not a release
  version: cpu
  name: lmstudio
  platform_arch: x86_64
  min_storage: 588MB
  cpus: "4.0"
  mem_reservation: 6g
  mem_limit: 8g
  pids_limit: 2048
  ports:
    internal:
      http: 1234
  preload_models: "{{ AI_LOCAL_MODELS }}"
  preload_async_time: 3600
  preload_floor_seconds: 600
  preload_min_bytes_per_second: 1000000
  lifecycle: beta
  security:
    suppressions:
      # nocheck: cve upstream tag ships fixable CRITICAL CVEs; lift it once a rebuilt tag lands
      - image_tag: "cpu"
        until: 2026-12-03

# nocheck: playwright-service-flag, dynamic-flag
container_backup: # nocheck: bond-baseline
  bond: 1
  enabled: "{{ 'svc-bkp-volume-2-local' in group_names }}"
  shared: true
