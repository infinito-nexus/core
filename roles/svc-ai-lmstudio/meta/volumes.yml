---
lmstudio_data:
  type: volume
  name: lmstudio_data
  # nocheck: nfs-false-data-loss  Reason: per-daemon state LM Studio rewrites in place (lms-key-2, settings.json, extensions/plugins, bin/lms, server-logs), regenerated on every start; the models it indexes live in lmstudio_models
  nfs: false
  mounts:
    - service: lmstudio
      target: /root/.lmstudio

# nocheck: embedded-state-on-nfs links into the read-only svc-ai-models store only; every writer sets the same link to the same store file, so concurrent writers write identical entries
lmstudio_models:
  type: volume
  name: lmstudio_models
  mounts:
    - service: lmstudio
      target: /root/.lmstudio/models
