---
- name: "🔍 Resolve {{ application_id }} hosting node + container id"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/sys-svc-compose/tasks/utils/swarm/resolve_host_cid.yml') }}"
  vars:
    resolve_service_key: "{{ entity_name }}"
    resolve_output_prefix: LMSTUDIO
    resolve_compose_cid: "{{ LMSTUDIO_CONTAINER }}"

- name: "🌱 Seed the models from the node cache before preloading"
  ansible.builtin.include_tasks:
    file: utils/seed.yml
    apply:
      delegate_to: "{{ LMSTUDIO_HOST_NODE }}"

- name: "⬇️ Preload the LM Studio models"
  block:
    - name: "⬇️ Preload the LM Studio models (first pass)"
      ansible.builtin.include_tasks: utils/preload.yml
  rescue:
    - name: "🐝 Re-raise the preload failure unchanged in swarm" # nocheck: rescue-recovery a timed-out transfer leaves the daemon reporting 0.00% for every further pull, and only restarting the container it owns clears that, which the generic capture cannot do; swarm re-raises here instead, because under any_errors_fatal a rescued host keeps running while every other host is already marked failed, and compose ends the block by preloading again so an unrecovered failure still re-raises
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('LM Studio preload failed') }}"
      when: DEPLOYMENT_MODE == 'swarm'

    - name: "♻️ Recover the wedged transfer and preload again"
      ansible.builtin.include_tasks: utils/recover.yml
