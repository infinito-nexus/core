---
- name: "🔍 Resolve the container before preloading on '{{ lmstudio_node }}'"
  ansible.builtin.include_tasks: utils/cid.yml

- name: "⏳ Wait until the LM Studio daemon has finished starting on '{{ lmstudio_node }}'"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ LMSTUDIO_LOCAL_CID | quote }} {{ 10 | curl(retries=0) }} -fS -o /dev/null http://127.0.0.1:{{ LMSTUDIO_PORT }}/lmstudio-greeting
  register: lmstudio_daemon_ready
  changed_when: false
  retries: 60
  delay: 5
  until: lmstudio_daemon_ready.rc == 0
  delegate_to: "{{ lmstudio_node }}"

- name: "⬇️ Preload the LM Studio models into the volume on '{{ lmstudio_node }}'"
  when: not (LMSTUDIO_PRESEED_ENABLED | bool)
  block:
    - name: "🧭 Resolve the model volume's mountpoint on '{{ lmstudio_node }}'"
      ansible.builtin.command: >-
        container volume inspect --format '{{ "{{" }}.Mountpoint{{ "}}" }}'
        {{ lookup('volume', application_id, 'lmstudio_models').name | quote }}
      register: lmstudio_models_mountpoint
      changed_when: false
      delegate_to: "{{ lmstudio_node }}"

    - name: "⬇️ Fetch the LM Studio models from their declared sources on '{{ lmstudio_node }}'"
      ansible.builtin.include_tasks:
        file: utils/fetch.yml
        apply:
          delegate_to: "{{ lmstudio_node }}"
      vars:
        lmstudio_fetch_store: "{{ lmstudio_models_mountpoint.stdout | trim }}"
        lmstudio_fetch_staging: "{{ [lmstudio_models_mountpoint.stdout | trim, '.staging'] | path_join }}"
        lmstudio_fetch_node: "{{ lmstudio_node }}"
