---
- name: "🔍 Resolve the container before preloading on '{{ lmstudio_node }}'"
  ansible.builtin.include_tasks: utils/cid.yml

- name: "⏳ Wait until the LM Studio daemon has finished starting on '{{ lmstudio_node }}'"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ LMSTUDIO_LOCAL_CID | quote }} {{ 10 | curl(retries=0) }} -fS -o /dev/null http://127.0.0.1:{{ LMSTUDIO_PORT }}/lmstudio-greeting
  register: lmstudio_daemon_ready
  changed_when: false
  retries: 60
  delay: 5
  until: lmstudio_daemon_ready.rc == 0
  delegate_to: "{{ lmstudio_node }}"

- name: "🔗 Link each preload model on '{{ lmstudio_node }}' to its store file"
  ansible.builtin.shell: > # nocheck: container-exec-resolver  runtime-resolved CID, delegated to the hosting node
    container exec {{ LMSTUDIO_LOCAL_CID | quote }}
    sh -c {{ ('mkdir -p ' ~ ([LMSTUDIO_MODELS_TARGET, model.repo] | path_join | quote)
              ~ ' && ln -sfn ' ~ ([AI_MODELS_STORE_PATH, model.sha256] | path_join | quote)
              ~ ' ' ~ ([LMSTUDIO_MODELS_TARGET, model.repo, model.file] | path_join | quote)) | quote }}
  changed_when: true
  loop: "{{ LMSTUDIO_PRELOAD_MODELS }}"
  loop_control:
    loop_var: model
    label: "{{ model.alias }}"
  delegate_to: "{{ lmstudio_node }}"
