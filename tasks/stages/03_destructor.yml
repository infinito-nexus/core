---
- name: "⏳ Reap the image pre-pull of a host without a server stage"
  ansible.builtin.include_role:
    name: sys-svc-container
    tasks_from: utils/prepull/reap.yml

- name: "🧩 Load destruction roles"
  include_tasks: ./tasks/utils/setup/group.yml
  loop: "{{ lookup('stage_groups', 'destructor') }}"
  loop_control:
    loop_var: role_group
    label: "{{ role_group }}"

- name: "🧹 Purge the Cloudflare cache once per deployed zone"
  include_role:
    name: sys-stk-front-base
    tasks_from: cloudflare/02_cleanup.yml
  when: cf_zones_to_purge is defined

- name: "🛠️ Decommission, finalize and test while the timers are still locked"
  block:
    - name: "🧹 Decommission what roles no longer active on this host left behind"
      when:
        - CLEANUP | bool
        - lookup('deployment').whitelist | length == 0
      block:
        - name: "🧹 Decommission the compose stacks of roles no longer active on this host"
          include_role:
            name: sys-svc-compose
            tasks_from: decommission.yml
          when: IS_COMPOSE_MODE | bool

        - name: "🧹 Drop the garbage collector manifests of roles no longer active on this host"
          include_role:
            name: sys-ctl-cln-apps
            tasks_from: decommission.yml

    - name: "🛠️ Finalize services"
      include_role:
        name: sys-service-terminator

    - name: 🧪 Run CLI tests for deployed roles
      include_role:
        name: test-e2e-cli
      when: RUNTIME in ['dev', 'act', 'github']
  always:
    - name: "🔓 Unlock all timers"
      include_role:
        name: sys-service-terminator
        tasks_from: 02_unlock.yml

- name: "⏯️ Apply the persisted pause state of every application as the last step"
  include_role:
    name: sys-svc-app-control
  when:
    - IS_STACK_HOST | bool
    - run_once_sys_svc_compose is defined

- name: "🗂️ Sync Semaphore's stop and start templates with the apps app-control holds"
  include_role:
    name: web-app-semaphore
    tasks_from: utils/project.yml
  vars:
    application_id: web-app-semaphore
  when:
    - IS_STACK_HOST | bool
    - run_once_sys_svc_compose is defined
    - "'web-app-semaphore' in group_names"
