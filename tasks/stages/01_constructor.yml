---
- name: 🔍 Detect container environment (systemd-detect-virt)
  ansible.builtin.command: systemd-detect-virt --container
  register: systemd_detect_virt_container
  changed_when: false
  failed_when: false

- name: 📐 Normalize DOCKER_IN_CONTAINER from runtime detection
  ansible.builtin.set_fact:
    DOCKER_IN_CONTAINER: "{{ (systemd_detect_virt_container.rc | default(1) | int) == 0 }}"

- name: "🔓 Get apt ready before the first apt task"
  ansible.builtin.include_tasks: "./tasks/utils/apt/ready.yml"
  when: ansible_facts['os_family'] == 'Debian'

- name: 🔎 Check DNS resolution for test domain
  ansible.builtin.command: "getent hosts {{ DOMAIN_TEST }}"
  register: dns_check
  changed_when: false
  failed_when: dns_check.rc != 0
  when:
    - VALIDATE | bool
    - (DOMAIN_PRIMARY | network_of) != 'tor'

- name: 🔀 Merge variables
  ansible.builtin.include_tasks: ./tasks/utils/constructor/variables.yml

- name: "💾 Persist {{ SOFTWARE_NAME }} version"
  ansible.builtin.include_role:
    name: sys-version

- name: 🎬 init root user
  ansible.builtin.include_role:
    name: user-root

- name: "🥾 Bootstrap svc-net-wireguard"
  when: "'svc-net-wireguard' | application_allowed(group_names, lookup('deployment').whitelist)"
  block:
    - name: 🧊 Carry the applications SPOT through the mesh bootstrap
      applications_carrier: {}

    - name: "🔌 Load svc-net-wireguard"
      ansible.builtin.include_role:
        name: svc-net-wireguard

    - name: 🧊 Drop the mesh-bootstrap carrier so later stages re-render
      applications_carrier:
        clear: true

- name: "✅ Ensure correct timezone is '{{ HOST_TIMEZONE }}'"
  community.general.timezone:
    name: "{{ HOST_TIMEZONE }}"
  when: not DOCKER_IN_CONTAINER | bool

- name: "🔧 Apply the host-wide kernel parameters"
  ansible.builtin.include_role:
    name: sys-sysctl

- name: 🧹 System Cleanup
  ansible.builtin.include_role:
    name: sys-cleanup
  when:
    - CLEANUP | bool
    - DOCKER_IN_CONTAINER | bool

- name: "📍 Place the shared services and the proxy on their hosts"
  ansible.builtin.include_tasks: ./tasks/utils/constructor/placement.yml

- name: 🧊 Render the applications SPOT once for the bootstrap section
  applications_carrier: {}

- name: "🧅 Evaluate the onion backends from the parked applications SPOT"
  ansible.builtin.include_tasks: ./tasks/utils/constructor/onion_backends.yml

- name: 🔄 update device
  ansible.builtin.include_role:
    name: update

- name: "🛫 Pre-flight checks"
  ansible.builtin.include_role:
    name: sys-preflight
  when: VALIDATE | bool

- name: "📦 Install the packages of every role this host may run, in one run"
  package_install:
    id: "{{ _package_batch_ids }}"
  vars:
    _package_batch_inventory: "{{ PACKAGES | default([]) }}"
    _package_batch_ids: >-
      {{
        (
          lookup('package_batch', group_names)
          + ([_package_batch_inventory] if _package_batch_inventory is string else _package_batch_inventory)
        ) | unique
      }}
  when: _package_batch_ids | length > 0

- name: "📂 Open service-loader preload context BEFORE Bootstrap"
  ansible.builtin.set_fact:
    service_loader_post_run: []
    service_loader_preloading: true
  changed_when: false

- name: "🥾 Bootstrap svc-swarm-node"
  ansible.builtin.include_role:
    name: svc-swarm-node
  when: "'svc-swarm-node' | application_allowed(group_names, lookup('deployment').whitelist)"

- name: "🛡️ Load the onion backend drop before any stack publishes it"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-swarm-node/tasks/utils/ingress_guard/refresh.yml') }}"
  when:
    - IS_SWARM_MODE | bool
    - run_once_svc_swarm_node is not defined

- name: "🥾 Bootstrap storage + cache + registry + runtimes (MUST precede Preload)"
  ansible.builtin.include_tasks: ./tasks/utils/setup/group.yml
  loop:
    - svc-storage
    - svc-cache
    - svc-registry
    - svc-virt
  loop_control:
    loop_var: role_group
    label: "{{ role_group }}"

- name: 📂 Include Token Store
  ansible.builtin.include_role:
    name: sys-token-store
  when: run_once_sys_token_store is not defined

- name: 🧊 Render the applications SPOT once and carry it into every task's worker
  applications_carrier:
    provider_view: true

- name: "📥 Pre-pull the images of this deploy in the background"
  ansible.builtin.include_role:
    name: sys-svc-container
    tasks_from: utils/prepull/start.yml
  vars:
    sys_svc_container_prepull_extra: >-
      {{ [lookup('config', 'test-e2e-playwright', 'services.playwright.image') ~ ':' ~ lookup('config', 'test-e2e-playwright', 'services.playwright.version')]
         if RUNTIME in ['dev', 'act', 'github'] and 'server' in (group_names | get_deployment_types_from_groups) else [] }}

- name: "🛰️ Prove the gateway host serves this host before any consumer is configured"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'roles/svc-ai-litellm/tasks/utils/remote_gateway.yml') }}"
  when: LITELLM_GATEWAY_REMOTE | bool

- name: 🛠️ Preload shared services
  ansible.builtin.include_role:
    name: sys-service-loader

- name: "📂 Close the service-loader preload context"
  ansible.builtin.set_fact:
    service_loader_preloading: false
  changed_when: false

- name: "🔍 Probe the shared-service vhosts before any app role calls them"
  ansible.builtin.include_role:
    name: svc-stack
    tasks_from: deferred_probe.yml
  vars:
    front_proxy_probe_phases: [entered, preload]

- name: "🧩 Load base roles"
  ansible.builtin.include_tasks: ./tasks/utils/setup/group.yml
  loop: "{{ lookup('stage_groups', 'constructor') }}"
  loop_control:
    loop_var: role_group
    label: "{{ role_group }}"
