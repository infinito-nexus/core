---
- name: 🔍 Detect container environment (systemd-detect-virt)
  ansible.builtin.command: systemd-detect-virt --container
  register: systemd_detect_virt_container
  changed_when: false
  failed_when: false

- name: 📐 Normalize DOCKER_IN_CONTAINER from runtime detection
  ansible.builtin.set_fact:
    DOCKER_IN_CONTAINER: "{{ (systemd_detect_virt_container.rc | default(1) | int) == 0 }}"

- name: "🔓 Get apt ready before the first apt task"
  ansible.builtin.include_tasks: "./tasks/utils/apt/ready.yml"
  when: ansible_facts['os_family'] == 'Debian'

- name: 🔎 Check DNS resolution for test domain
  ansible.builtin.command: "getent hosts {{ DOMAIN_TEST }}"
  register: dns_check
  changed_when: false
  failed_when: dns_check.rc != 0
  when:
    - MODE_ASSERT | bool
    - not (DOMAIN_PRIMARY is search('\.onion$'))

- name: 🔀 Merge variables
  ansible.builtin.include_tasks: ./tasks/utils/constructor/variables.yml

- name: "💾 Persist {{ SOFTWARE_NAME }} version"
  ansible.builtin.include_role:
    name: sys-version

- name: 🎬 init root user
  ansible.builtin.include_role:
    name: user-root

- name: 🔄 update device
  ansible.builtin.include_role:
    name: update

- name: "✅ Ensure correct timezone is '{{ HOST_TIMEZONE }}'"
  community.general.timezone:
    name: "{{ HOST_TIMEZONE }}"
  when: not DOCKER_IN_CONTAINER | bool

- name: 🧹 System Cleanup
  ansible.builtin.include_role:
    name: sys-cleanup
  when:
    - MODE_CLEANUP | bool
    - DOCKER_IN_CONTAINER | bool

- name: "📍 Place the shared services and the proxy on their hosts"
  ansible.builtin.include_tasks: ./tasks/utils/constructor/placement.yml

- name: "🥾 Bootstrap svc-swarm-node"
  ansible.builtin.include_role:
    name: svc-swarm-node
  when: "'svc-swarm-node' | application_allowed(group_names, lookup('deployment').whitelist)"

- name: "📂 Open service-loader preload context BEFORE Bootstrap"
  ansible.builtin.set_fact:
    service_loader_post_run: []
    service_loader_preloading: true
  changed_when: false

- name: "🥾 Bootstrap NFS clients + registry + sandbox runtimes (MUST precede Preload)"
  ansible.builtin.include_tasks: ./tasks/utils/setup/group.yml
  loop:
    - svc-storage
    - svc-registry
    - svc-virt
  loop_control:
    loop_var: role_group
    label: "{{ role_group }}"

- name: 📂 Include Token Store
  ansible.builtin.include_role:
    name: sys-token-store
  when: run_once_sys_token_store is not defined

- name: 🧊 Render the applications SPOT once and carry it into every task's worker
  applications_carrier: {}

- name: 🛠️ Preload shared services
  ansible.builtin.include_role:
    name: sys-service-loader

- name: "📂 Close the service-loader preload context"
  ansible.builtin.set_fact:
    service_loader_preloading: false
  changed_when: false

- name: "🧩 Load base roles"
  ansible.builtin.include_tasks: ./tasks/utils/setup/group.yml
  loop: "{{ lookup('stage_groups', 'constructor') }}"
  loop_control:
    loop_var: role_group
    label: "{{ role_group }}"

- name: 📦 Install inventory-defined packages
  package_install:
    id: "{{ PACKAGES }}"
  when: PACKAGES | default([]) | length > 0
