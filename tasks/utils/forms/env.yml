---
# Param forms_env_form: the form of the role's meta/forms.yml the env file carries. Its field keys stay lower snake_case, each the upper-cased name of its env variable: dotenv_names fails on any other key, since a camelCase key would read another variable. No key or source of the form is a secret (tests/lint/ansible/roles/meta/test_env_forms.py), so only non-secret lines are ever read.
# Param forms_env_fields: the form's sink, the fields the env file render is about to write.

- name: "📥 Read only the managed settings the env file of {{ application_id }} holds"
  ansible.builtin.command:
    argv:
      - grep
      - -sE
      - "^[[:space:]]*({{ forms_env_fields | dotenv_names | join('|') }})="
      - "{{ lookup('container', application_id, 'files.env') }}"
  delegate_to: "{{ STACK_HOST }}"
  run_once: true
  register: forms_env_held
  changed_when: false
  failed_when: forms_env_held.rc > 2
  no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
  when: forms_env_fields | length > 0

- name: "📣 Report the managed settings the env file render overwrites"
  ansible.builtin.include_tasks: "{{ lookup('path_absolute', 'tasks/utils/forms/drift.yml') }}"
  vars:
    forms_drift_current: "{{ {forms_env_form: forms_env_held.stdout | dotenv_fields(forms_env_fields)} }}"
  when: forms_env_held.rc | default(2) in [0, 1]
