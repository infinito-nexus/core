---
# Webserver Configuration

# Effective CPUs (float) across proxy and the current app
WEBSERVER_CPUS_EFFECTIVE: >-
  {{
    [
      (lookup('applications') | resource_filter('svc-prx-openresty',  'cpus', service_name | default(''), RESOURCE_CPUS)) | float,
      (lookup('applications') | resource_filter(application_id,       'cpus', service_name | default(''), RESOURCE_CPUS)) | float
    ] | min
  }}

WEBSERVER_WORKER_PROCESSES: >-
  {{
    1 if (WEBSERVER_CPUS_EFFECTIVE | float) < 1
    else (WEBSERVER_CPUS_EFFECTIVE | float | int)
  }}

# worker_connections from pids_limit (use the smaller one), with correct key/defaults
WEBSERVER_WORKER_CONNECTIONS: >-
  {{
    [
      (lookup('applications') | resource_filter('svc-prx-openresty', 'pids_limit', service_name | default(''), RESOURCE_PIDS_LIMIT)) | int,
      (lookup('applications') | resource_filter(application_id,      'pids_limit', service_name | default(''), RESOURCE_PIDS_LIMIT)) | int
    ] | min
  }}
