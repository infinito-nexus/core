---
# Webserver Configuration

WEBSERVER_CPUS_EFFECTIVE: "{{ lookup('webserver_resource', 'cpus') }}"

WEBSERVER_WORKER_PROCESSES: >-
  {{
    1 if (WEBSERVER_CPUS_EFFECTIVE | float) < 1
    else (WEBSERVER_CPUS_EFFECTIVE | float | int)
  }}

WEBSERVER_WORKER_CONNECTIONS: "{{ lookup('webserver_resource', 'pids_limit') }}"

# Not WEBSERVER_WORKER_*: their application_id is whichever role loaded the shared proxy first, whose limits then cap every vhost.
WEBSERVER_PROXY_WORKER_PROCESSES: >-
  {{
    [
      (lookup('applications') | resource_filter('svc-prx-openresty', 'cpus', '', RESOURCE_CPUS)) | float | int,
      1
    ] | max
  }}

WEBSERVER_PROXY_WORKER_CONNECTIONS: >-
  {{ lookup('applications') | resource_filter('svc-prx-openresty', 'pids_limit', '', RESOURCE_PIDS_LIMIT) | int }}

# Response security headers of every vhost; an app overrides any key under `security_headers` in its meta/server.yml.
WEBSERVER_SECURITY_HEADERS:
  nosniff: false # X-Content-Type-Options: nosniff
  referrer_policy: "" # Referrer-Policy, sent only when the upstream sends none; "" sends none
  permissions_policy: "" # Permissions-Policy on HTML documents; "" sends none
  hsts:
    max_age: 31536000 # Strict-Transport-Security max-age in seconds
    include_subdomains: false # adds includeSubDomains, which covers every subdomain of the vhost
    preload: false # adds preload; requires include_subdomains and a max_age of one year
