---
# URL of Local Ollama Container
OLLAMA_BASE_LOCAL_URL: "http://{{ lookup('config','svc-ai-ollama', 'services.ollama.name') }}:{{ lookup('config','svc-ai-ollama', 'services.ollama.ports.internal.http')
  }}"

LITELLM_BASE_LOCAL_URL: "http://{{ lookup('config','svc-ai-litellm', 'services.litellm.name') }}:{{ lookup('config','svc-ai-litellm', 'services.litellm.ports.internal.http')
  }}"

LMSTUDIO_BASE_LOCAL_URL: "http://{{ lookup('config','svc-ai-lmstudio', 'services.lmstudio.name') }}:{{ lookup('config','svc-ai-lmstudio', 'services.lmstudio.ports.internal.http')
  }}"

LITELLM_OPENAI_BASE_LOCAL_URL: "{{ LITELLM_BASE_LOCAL_URL }}/v1"

LITELLM_BACKEND_ROLES: "{{ lookup('deployment').inventory }}"

LITELLM_OLLAMA_BACKEND: >-
  {{ (lookup('config', 'svc-ai-litellm', 'services.ollama.enabled') | bool)
     and (lookup('config', 'svc-ai-litellm', 'services.ollama.shared') | bool) }}

LITELLM_LMSTUDIO_BACKEND: >-
  {{ (lookup('config', 'svc-ai-litellm', 'services.lmstudio.enabled') | bool)
     and (lookup('config', 'svc-ai-litellm', 'services.lmstudio.shared') | bool) }}

AI_LOCAL_MODELS:
  - alias: qwen2.5:0.5b
    context: 32768
    name: qwen2.5-0.5b-instruct
    repo: lmstudio-community/Qwen2.5-0.5B-Instruct-GGUF
    url: https://huggingface.co/lmstudio-community/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q8_0.gguf
    source: https://huggingface.co/lmstudio-community/Qwen2.5-0.5B-Instruct-GGUF
    file: Qwen2.5-0.5B-Instruct-Q8_0.gguf
    sha256: "1d96e30253a76970864323987e3e77eeaf170312952fd61d18d343c25cfd6e52"
    bytes: 531068224

AI_MODEL_CONTEXTS: >-
  {{ (AI_LOCAL_MODELS + (lookup('config', 'svc-ai-litellm', 'services.litellm.remote_models')))
     | selectattr('context', 'defined') | list | items2dict(key_name='alias', value_name='context') }}

AI_REMOTE_ALIASES: >-
  {{ lookup('config', 'svc-ai-litellm', 'services.litellm.remote_models')
     | selectattr('provider', 'in',
         ['openai'] * (lookup('api_enabled', 'openai') | int)
         + ['anthropic'] * (lookup('api_enabled', 'anthropic') | int)
         + ['openrouter'] * (lookup('api_enabled', 'openrouter') | int))
     | map(attribute='alias') | list }}

LITELLM_CHAT_MODEL: "{{ (lookup('config', 'svc-ai-ollama', 'services.ollama.preload_models') | map(attribute='alias') | reject('search', 'embed') | list | first |
  default('')) if 'svc-ai-ollama' in LITELLM_BACKEND_ROLES else ((lookup('config', 'svc-ai-lmstudio', 'services.lmstudio.preload_models') | map(attribute='alias')
  | reject('search', 'embed') | list | first | default('')) if 'svc-ai-lmstudio' in LITELLM_BACKEND_ROLES else (AI_REMOTE_ALIASES | first | default(''))) }}"

LITELLM_CHAT_MODEL_SERVED: >-
  {{ ((LITELLM_OLLAMA_BACKEND | bool)
      and ((lookup('config', 'svc-ai-ollama', 'services.ollama.preload_models')
            | map(attribute='alias') | reject('search', 'embed') | list) | length > 0))
     or ((LITELLM_LMSTUDIO_BACKEND | bool)
         and ((lookup('config', 'svc-ai-lmstudio', 'services.lmstudio.preload_models')
               | map(attribute='alias') | reject('search', 'embed') | list) | length > 0))
     or ((AI_REMOTE_ALIASES | length) > 0) }}

LITELLM_USABLE: "{{ ('svc-ai-litellm' in group_names) and (LITELLM_CHAT_MODEL_SERVED | bool) }}"

MCP_DISCOVERY: "{{ lookup('mcp_servers') }}"
MCP_DISCOVERED_SERVERS: "{{ MCP_DISCOVERY.selected }}"
MCP_RECONCILE_STRICT: false
