---
# URL of Local Ollama Container
OLLAMA_BASE_LOCAL_URL: "http://{{ lookup('config','svc-ai-ollama', 'services.ollama.name') }}:{{ lookup('config','svc-ai-ollama', 'services.ollama.ports.internal.http')
  }}"

LITELLM_GATEWAY_HOST: "{{ lookup('config', 'svc-ai-litellm', 'services.litellm.gateway_host') }}"

LITELLM_GATEWAY_REMOTE: "{{ LITELLM_GATEWAY_HOST | length > 0 }}"

LITELLM_GATEWAY_URL: "{{ lookup('config', 'svc-ai-litellm', 'services.litellm.gateway_url') }}"

LITELLM_GATEWAY_KEY: "{{ lookup('config', 'svc-ai-litellm', 'secrets.credentials.gateway_key') }}"

LITELLM_GATEWAY_MESH_ADDRESS: "{{ lookup('mesh_address', inventory_hostname, peer=LITELLM_GATEWAY_HOST) if (LITELLM_GATEWAY_REMOTE | bool) else '' }}"

LITELLM_SHARED: "{{ not (LITELLM_GATEWAY_REMOTE | bool) }}"

LITELLM_BASE_CONTAINER_URL: "http://{{ lookup('config','svc-ai-litellm', 'services.litellm.name') }}:{{ lookup('config','svc-ai-litellm', 'services.litellm.ports.internal.http')
  }}"

LITELLM_BASE_LOCAL_URL: "{{ LITELLM_GATEWAY_URL if (LITELLM_GATEWAY_REMOTE | bool) else LITELLM_BASE_CONTAINER_URL }}"

LMSTUDIO_BASE_LOCAL_URL: "http://{{ lookup('config','svc-ai-lmstudio', 'services.lmstudio.name') }}:{{ lookup('config','svc-ai-lmstudio', 'services.lmstudio.ports.internal.http')
  }}"

S1_BASE_LOCAL_URL: "http://{{ lookup('config','svc-ai-s1', 'services.s1.name') }}:{{ lookup('config','svc-ai-s1', 'services.s1.ports.internal.http') }}"

LITELLM_OPENAI_BASE_LOCAL_URL: "{{ LITELLM_BASE_LOCAL_URL }}/v1"

LITELLM_LOOPBACK_HOSTS: "{{ NETWORK_LOOPBACK_HOSTS }}"

# nocheck: swarm-loopback-port open  host consumers (the desktop agents' gateway URL) reach LiteLLM on this published loopback port, which swarm drops; 074 :28 tracks it
LITELLM_BASE_HOST_URL: "http://{{ LITELLM_LOOPBACK_HOSTS | first }}:{{ lookup('config','svc-ai-litellm', 'services.litellm.ports.local.http') }}"

LITELLM_BASE_LOOPBACK_URL: "{{ LITELLM_GATEWAY_URL if (LITELLM_GATEWAY_REMOTE | bool) else LITELLM_BASE_HOST_URL }}"

LITELLM_OPENAI_BASE_LOOPBACK_URL: "{{ LITELLM_BASE_LOOPBACK_URL }}/v1"

LITELLM_BACKEND_ROLES: "{{ lookup('deployment').inventory }}"

LITELLM_OLLAMA_BACKEND: >-
  {{ (lookup('config', 'svc-ai-litellm', 'services.ollama.enabled') | bool)
     and (lookup('config', 'svc-ai-litellm', 'services.ollama.shared') | bool) }}

LITELLM_LMSTUDIO_BACKEND: >-
  {{ (lookup('config', 'svc-ai-litellm', 'services.lmstudio.enabled') | bool)
     and (lookup('config', 'svc-ai-litellm', 'services.lmstudio.shared') | bool) }}

LITELLM_FREELLMAPI_BACKEND: >-
  {{ (lookup('config', 'svc-ai-litellm', 'services.freellmapi.enabled') | bool)
     and (lookup('config', 'svc-ai-litellm', 'services.freellmapi.shared') | bool) }}

AI_FREELLMAPI_MODELS: >-
  {{ [{
      'alias': lookup('config', 'svc-ai-litellm', 'services.litellm.freellmapi.alias'),
      'model': 'openai/' ~ lookup('config', 'svc-ai-litellm', 'services.litellm.freellmapi.model'),
      'provider': 'freellmapi',
      'api_base': lookup('container_url', 'svc-ai-freellmapi', 'freellmapi') ~ '/v1',
      'context': lookup('config', 'svc-ai-litellm', 'services.litellm.freellmapi.context'),
      'traits': lookup('config', 'svc-ai-litellm', 'services.litellm.freellmapi.traits')
        | combine({'local': false, 'auto': lookup('config', 'svc-ai-litellm', 'services.litellm.freellmapi.include_in_auto') | bool})
     }] if LITELLM_FREELLMAPI_BACKEND | bool else [] }}

AI_MODELS_STORE_PATH: "{{ [DIR_CACHE, 'models'] | path_join }}"

AI_TORCH_VERSION: "2.9.1"

AI_LOCAL_MODEL_DECLARATIONS:
  - alias: llama3.2:1b
    context: 65536
    name: llama-3.2-1b-instruct
    artefact: llama-3.2-1b-instruct
    repo: lmstudio-community/Llama-3.2-1B-Instruct-GGUF
    source: https://huggingface.co/lmstudio-community/Llama-3.2-1B-Instruct-GGUF
    quant: q4_k_m
    file: Llama-3.2-1B-Instruct-Q4_K_M.gguf

AI_LOCAL_MODELS: "{{ AI_LOCAL_MODEL_DECLARATIONS | local_models_pinned(lookup('cache_artefacts', 'svc-ai-models')) }}"

AI_MODEL_CONTEXTS: >-
  {{ (AI_LOCAL_MODELS + (lookup('config', 'svc-ai-litellm', 'services.litellm.remote_models')) + AI_FREELLMAPI_MODELS)
     | selectattr('context', 'defined') | selectattr('context') | list | items2dict(key_name='alias', value_name='context') }}

AI_MOCK_PROVIDER: mock

AI_REMOTE_ALIASES: >-
  {{ (lookup('config', 'svc-ai-litellm', 'services.litellm.remote_models')
     | selectattr('provider', 'in',
         [AI_MOCK_PROVIDER]
         + ['openai'] * (lookup('api_enabled', 'openai') | int)
         + ['anthropic'] * (lookup('api_enabled', 'anthropic') | int)
         + ['openrouter'] * (lookup('api_enabled', 'openrouter') | int))
     | map(attribute='alias') | list) + (AI_FREELLMAPI_MODELS | map(attribute='alias') | list) }}

AI_MOCK_ALIASES: >-
  {{ lookup('config', 'svc-ai-litellm', 'services.litellm.remote_models')
     | selectattr('provider', 'eq', AI_MOCK_PROVIDER) | map(attribute='alias') | list }}

LITELLM_CHAT_MODEL: "{{ LITELLM_GATEWAY_MODEL if (LITELLM_GATEWAY_REMOTE | bool) else LITELLM_LOCAL_CHAT_MODEL }}"

LITELLM_GATEWAY_MODEL: "{{ lookup('config', 'svc-ai-litellm', 'services.litellm.gateway_model') }}"

LITELLM_LOCAL_CHAT_MODEL: "{{ (((lookup('config', 'svc-ai-ollama', 'services.ollama.preload_models') | map(attribute='alias') | reject('search', 'embed') | list)
  if 'svc-ai-ollama' in LITELLM_BACKEND_ROLES else []) + ((lookup('config', 'svc-ai-lmstudio', 'services.lmstudio.preload_models') | map(attribute='alias') | reject('search',
  'embed') | list) if 'svc-ai-lmstudio' in LITELLM_BACKEND_ROLES else []) + AI_REMOTE_ALIASES) | first | default('') }}"

AI_AGENT_MODEL: "{{ AI_MOCK_ALIASES | first | default(LITELLM_CHAT_MODEL, true) }}"

LITELLM_CHAT_MODEL_SERVED: >-
  {{ ((LITELLM_OLLAMA_BACKEND | bool)
      and ((lookup('config', 'svc-ai-ollama', 'services.ollama.preload_models')
            | map(attribute='alias') | reject('search', 'embed') | list) | length > 0))
     or ((LITELLM_LMSTUDIO_BACKEND | bool)
         and ((lookup('config', 'svc-ai-lmstudio', 'services.lmstudio.preload_models')
               | map(attribute='alias') | reject('search', 'embed') | list) | length > 0))
     or ((AI_REMOTE_ALIASES | length) > 0) }}

LITELLM_USABLE: "{{ ((LITELLM_GATEWAY_URL | length > 0) and (LITELLM_GATEWAY_KEY | length > 0) and (LITELLM_GATEWAY_MODEL | length > 0)) if (LITELLM_GATEWAY_REMOTE
  | bool) else (('svc-ai-litellm' in group_names) and (LITELLM_CHAT_MODEL_SERVED | bool)) }}"

MCP_DISCOVERY: "{{ lookup('mcp_servers') }}"
MCP_DISCOVERED_SERVERS: "{{ MCP_DISCOVERY.selected }}"
MCP_RECONCILE_STRICT: false
