---
# Central SPOT for proprietary / external (non-self-hosted) API credentials.
# Each entry is empty by default. Override per provider in the (vault-
# encrypted) inventory; read ONLY via lookup('api', '<provider>.<key>') and
# gate ONLY on lookup('api_enabled', '<provider>') (see utils/api.py).
# nocheck: unused-var: consumed by the api lookup plugins (plugins/lookup/api.py, plugins/lookup/api_enabled.py) via lookup('api', ...), not referenced directly in YAML/Jinja.
API:
  anthropic:
    api_key: ""
  cloudflare:
    api_token: ""
  openai:
    api_key: ""
  openrouter:
    api_key: ""
  telegram:
    bot_token: ""
    api_id: ""
    api_hash: ""
  github:
    client_id: ""
    client_secret: ""
  google:
    client_id: ""
    client_secret: ""
  jira:
    client_id: ""
    client_secret: ""
