---
# Mode

# The following modes can be combined with each other
DUMMY: false # Executes dummy/test routines instead of productive routines
DEBUG: false # This enables debugging in ansible and in the apps, You SHOULD NOT enable this on production servers
RESET: false # Cleans up all Infinito.Nexus files. It's necessary to run to whole playbook and not particial roles when using this function.
CLEANUP: true # Cleanup unused files and configurations
VALIDATE: "{{ DEBUG  | bool }}" # Executes validation tasks during the run.
BACKUP: true # Executes the Backup before the deployment
DEMO: false # Seeds the upstream demo data of roles that ship it on every deploy, replacing their data and adding demo accounts with known passwords; never enable on production servers
