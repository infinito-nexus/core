---
- name: night
  schedule: "0 23 * * *"
  routine: translate
  action: start
- name: night-end
  schedule: "0 7 * * *"
  routine: translate
  action: pause
- name: day-load
  schedule: "*/10 7-22 * * *"
  routine: translate
  condition: host-load-below-30
  action: start
- name: day-busy
  schedule: "*/10 7-22 * * *"
  routine: translate
  condition: host-load-above-95
  action: pause
