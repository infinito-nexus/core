name: "🧪 Test"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INFINITO_TEST_RUNNER: host
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🔧 Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: ▶️ Run the full test suite via make
        shell: bash
        run: |
          set -euo pipefail
          make test 2>&1 | tee /tmp/test-output.txt

      - name: 📊 Per-test summary from junit reports
        if: always()
        shell: bash
        run: |
          python3 utils/github/pytest_summary.py build/test-reports >> "$GITHUB_STEP_SUMMARY"

      - name: 🔨 Build step summary from annotations
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m utils.annotations.summarize /tmp/test-output.txt "Test Annotation Summary"
