name: "🧪 Test"

on:
  workflow_call:
    inputs:
      role_skeleton:
        description: "True renders the role skeleton sample roles into roles/ before the suite runs."
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      INFINITO_TEST_RUNNER: host
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🔧 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 🤖 Install the pinned Codex CLI
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: make install-codex

      - name: 🧩 Render the role skeleton sample roles
        if: ${{ inputs.role_skeleton }}
        shell: bash
        run: make role-skeleton-samples

      - name: ▶️ Run the full test suite via make
        timeout-minutes: 38
        shell: bash
        run: |
          set -euo pipefail
          vmstat -w 15 &
          monitor_pid=$!
          trap 'kill "${monitor_pid}" 2>/dev/null || :' EXIT
          make test 2>&1 | tee /tmp/test-output.txt

      - name: 📊 Per-test summary from junit reports
        if: always()
        shell: bash
        run: |
          python3 utils/github/pytest_summary.py build/test-reports >> "$GITHUB_STEP_SUMMARY"

      - name: 🔨 Build step summary from annotations
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m utils.annotations.summarize /tmp/test-output.txt "Test Annotation Summary"

      - name: 📦 Keep the test output and junit reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-output
          path: |
            /tmp/test-output.txt
            build/test-reports
          if-no-files-found: ignore
