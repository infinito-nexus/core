name: "⏰ Rerun: Cancelled Branch Runs"

concurrency:
  group: rerun-cancelled
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    name: 🔁 Rerun the failed jobs of cancelled runs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7.0.0

      - name: ⏱️ Decide whether this hour is due
        id: due
        if: ${{ github.event_name == 'schedule' }}
        shell: bash
        env:
          INTERVAL_MINUTES: ${{ vars.CI_RERUN_INTERVAL_MINUTES || '60' }}
        run: bash scripts/github/rerun/due.sh

      - name: 🔁 Restart the failed jobs per branch
        if: ${{ steps.due.outputs.due != 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          MAX_ATTEMPTS: ${{ vars.CI_RERUN_MAX_ATTEMPTS || '0' }}
          MAX_AGE_HOURS: ${{ vars.CI_RERUN_MAX_AGE_HOURS || '24' }}
        run: bash scripts/github/rerun/cancelled_branch_runs.sh
