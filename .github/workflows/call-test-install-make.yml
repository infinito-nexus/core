name: "📦 Test: Install Make"

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  test-install-make:
    name: 🛠️ Makefile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIX_CONFIG: |
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🔍 Resolve paths from default.env
        run: |
          for key in INFINITO_SRC_DIR INFINITO_VENV_DIR; do
            value="$(awk -F= -v k="^${key}=" '$0 ~ k {print $2; exit}' default.env)"
            test -n "${value}" || { echo "${key} not found in default.env" >&2; exit 1; }
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: 📦 Install & test in every pkgmgr virgin container (parallel)
        run: ./scripts/tests/install/make.sh
