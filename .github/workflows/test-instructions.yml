name: "📖 Test: Instructions"

on:
  workflow_call:
    inputs:
      distros:
        description: "Space-separated distro list"
        required: true
        type: string
      role:
        description: "Role to test; empty picks one at random"
        required: false
        type: string
        default: ""
      priority:
        description: "Space-separated app ids; a random one is preferred over whitelist"
        required: false
        type: string
        default: ""
      whitelist:
        description: "Space-separated app ids; a random one is used when no role or priority is given"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      distros:
        description: "Space-separated distro list"
        required: true
        type: string
      role:
        description: "Role to test; empty picks one at random"
        required: false
        type: string
        default: ""
      priority:
        description: "Space-separated app ids; a random one is preferred over whitelist"
        required: false
        type: string
        default: ""
      whitelist:
        description: "Space-separated app ids; a random one is used when no role or priority is given"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: 📖 Instructions
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      INFINITO_IMAGE_TAG: ci-${{ github.sha }}
      INFINITO_DISTROS: ${{ inputs.distros }}
    steps:
      - if: ${{ !env.ACT }}
        uses: actions/checkout@v7.0.0

      - name: "📥 Load rescue-diagnostics SPOT into job env"
        shell: bash
        run: grep '^INFINITO_RESCUE_DIAGNOSTICS_BASE=' default.env >> "$GITHUB_ENV"

      - name: 🐍 Install instructions + compose deps (Act runner only)
        if: ${{ env.ACT }}
        shell: bash
        run: |
          pip install --quiet --break-system-packages pyyaml
          apt-get update -qq && apt-get install -y -qq gettext-base jq

      - name: 🎲 Select the role and deploy mode
        shell: bash
        run: |
          set -euo pipefail
          python3 -m cli.meta.ci.guide_select \
            --role "${{ inputs.role }}" \
            --priority "${{ inputs.priority }}" \
            --whitelist "${{ inputs.whitelist }}" | tee -a "$GITHUB_ENV"

      - name: 🔑 Login to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📖 Replay the instructions across ${{ inputs.distros }}
        shell: bash
        run: ./scripts/tests/deploy/distros.sh scripts/github/guide/one.sh

      - name: ⬆️ Upload rescue diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: rescue-diagnostics-instructions-${{ env.GUIDE_ROLE }}
          path: ${{ env.INFINITO_RESCUE_DIAGNOSTICS_BASE }}/
          if-no-files-found: ignore
