name: "🎵 CI: Orchestrator"
on:
  workflow_call:
    inputs:
      distros:
        description: "Space-separated distro list"
        required: true
        type: string
      whitelist:
        description: "Optional space-separated whitelist of app ids"
        required: false
        type: string
        default: ""
      lifecycles:
        description: "Lifecycle envelope for test-deploy discovery (comma/space-separated)."
        required: false
        type: string
        default: ""
      modes:
        description: "Deploy modes to run (space-separated: 'swarm compose host'). Only listed modes run their deploy job."
        required: false
        type: string
        default: "swarm compose host"
      priority:
        description: "Optional space-separated app ids for the priority line: deployed first in every mode; the regular line runs the remaining roles only after every priority job succeeded."
        required: false
        type: string
        default: ""
      sequencing:
        description: "🐛 Deploy-mode order per line. 'serial': swarm, then compose, then host. 'parallel': all at once. 'auto': serial above the job threshold."
        required: false
        type: string
        default: "auto"
      mode_fail_fast:
        description: "🛑 Stop a serial line at its first failed mode. Off: keep deploying the remaining modes."
        required: false
        type: boolean
        default: true
      filesystem:
        description: "🗄️ Space-separated filesystems the per-distro pick draws from (ext4, btrfs, zfs). Empty: all three."
        required: false
        type: string
        default: ""
      image_wait_attempts:
        description: "Polling attempts for waiting on prebuilt or mirrored images"
        required: false
        type: string
        default: "1980"
      image_wait_sleep_seconds:
        description: "Polling interval in seconds for waiting on prebuilt or mirrored images"
        required: false
        type: string
        default: "10"
      workspace:
        description: "Run the workspace test (dev-runtime image matrix). 'auto' runs it on a global scope only, 'true'/'false' force it."
        required: false
        type: string
        default: "auto"
      instructions:
        description: "Run the instructions test (role README Production command). 'auto' runs it on a global scope only, 'true'/'false' force it."
        required: false
        type: string
        default: "auto"
      trusted_pr:
        description: "True when the PR carries the maintainer '🛡️ Trusted' label; skips the fork-prereq wait."
        required: false
        type: boolean
        default: false
      force_cancel_in_progress:
        description: "When true, a new run always cancels the running orchestrator on the same ref, ignoring the CI_CANCEL_IN_PROGRESS repository variable."
        required: false
        type: boolean
        default: false

concurrency:
  group: infinito-test-${{ github.ref }}
  cancel-in-progress: ${{ inputs.force_cancel_in_progress || vars.CI_CANCEL_IN_PROGRESS != 'false' }}

permissions:
  actions: write
  contents: read
  packages: write
  security-events: write
  issues: write

jobs:
  wait-fork-prereq-run:
    name: ⏳ Wait for fork run
    runs-on: ubuntu-latest
    env:
      WAIT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && !inputs.trusted_pr }}
    steps:
      - name: 🏷️ Mark fork prerequisites as ready outside fork PRs or for trusted PRs
        if: ${{ env.WAIT_REQUIRED != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Fork prerequisites are implicitly ready (non-fork PR or '🛡️ Trusted' label)."

      - name: ⬇️ Checkout trusted workflow repo (helpers)
        if: ${{ env.WAIT_REQUIRED == 'true' }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: 🔑 Login to GHCR for CI image checks
        if: ${{ env.WAIT_REQUIRED == 'true' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏳ Wait for privileged fork CI images
        if: ${{ env.WAIT_REQUIRED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: entry-pr-change-orchestrate.yml
          TARGET_EVENT: pull_request_target
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
          INFINITO_DISTROS: "arch debian ubuntu fedora centos"
          IMAGE_TAG: ci-${{ github.sha }}
          WAIT_ATTEMPTS: ${{ inputs.image_wait_attempts }}
          WAIT_SLEEP_SECONDS: ${{ inputs.image_wait_sleep_seconds }}
        run: ./scripts/meta/wait/images.sh

  fork-prereqs-ready:
    name: 🚦 Gate Dependencies
    needs: wait-fork-prereq-run
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: ✅ Assert privileged prerequisites are ready
        shell: bash
        env:
          RESULT: ${{ needs.wait-fork-prereq-run.result }}
        run: ./scripts/github/gate/fork_prereqs.sh

  security-codeql:
    uses: ./.github/workflows/cron-security-codeql.yml

  lint:
    uses: ./.github/workflows/call-lint.yml

  test:
    uses: ./.github/workflows/call-test.yml

  build-ci-images:
    uses: ./.github/workflows/call-images-build-ci.yml
    with:
      distros: "arch debian ubuntu fedora centos"
      concurrency_channel: ci-orchestrator-build-consumer
    secrets: inherit
  
  test-dns:
    needs: 
      - build-ci-images
    uses: ./.github/workflows/call-test-dns.yml
    with:
      distros: "arch debian ubuntu fedora centos"
  
  images-mirror-missing:
    uses: ./.github/workflows/call-images-mirror-missing.yml
    with:
      concurrency_channel: ci-orchestrator-mirror-consumer
      image_wait_attempts: ${{ inputs.image_wait_attempts }}
      image_wait_sleep_seconds: ${{ inputs.image_wait_sleep_seconds }}
    secrets: inherit

  sequencing:
    name: 🐛 Sequencing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      priority: ${{ steps.priority.outputs.sequencing }}
      regular: ${{ steps.regular.outputs.sequencing }}
    env:
      INFINITO_APP_DISCOVERY_RUNNER: host
      INFINITO_LIFECYCLES: ${{ inputs.lifecycles }}
      INFINITO_HOST_EXCLUDE_COMPOSE: ${{ contains(inputs.modes, 'compose') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: 🔧 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 📦 Install project (host venv)
        shell: bash
        run: make install

      - name: 🔍 Resolve effective whitelist (diff vs origin/main)
        id: resolve_wl
        shell: bash
        env:
          INPUT_WHITELIST: ${{ inputs.whitelist }}
        run: ./scripts/github/resolve/effective_whitelist.sh

      - name: ⭐ Decide the priority line
        id: priority
        if: ${{ inputs.priority != '' }}
        shell: bash
        run: |
          source scripts/meta/env/load.sh
          "${PYTHON}" -m cli.meta.ci.sequencing \
            --modes "${{ inputs.modes }}" \
            --whitelist "${{ inputs.priority }}" \
            --lifecycles "${{ inputs.lifecycles }}" \
            --choice "${{ inputs.sequencing }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: 🔁 Decide the regular line
        id: regular
        shell: bash
        run: |
          source scripts/meta/env/load.sh
          "${PYTHON}" -m cli.meta.ci.sequencing \
            --modes "${{ inputs.modes }}" \
            --whitelist "${{ steps.resolve_wl.outputs.whitelist }}" \
            --blacklist "${{ inputs.priority }}" \
            --lifecycles "${{ inputs.lifecycles }}" \
            --choice "${{ inputs.sequencing }}" \
            | tee -a "$GITHUB_OUTPUT"

  test-deploy-swarm-priority:
    name: ⭐ Priority · swarm
    if: ${{ inputs.priority != '' && contains(inputs.modes, 'swarm') }}
    needs:
      - lint
      - test
      - build-ci-images
      - images-mirror-missing
    uses: ./.github/workflows/call-test-deploy-swarm.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      marker: " ⭐"

  test-deploy-single-node-priority:
    name: ⭐ Priority · single-node
    if: >-
      ${{ inputs.priority != ''
          && needs.sequencing.outputs.priority == 'parallel'
          && (contains(inputs.modes, 'compose') || contains(inputs.modes, 'host')) }}
    needs:
      - test-dns
      - images-mirror-missing
      - lint
      - test
      - sequencing
    uses: ./.github/workflows/call-test-deploy-single-node.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      modes: ${{ inputs.modes }}
      marker: " ⭐"

  test-deploy-compose-priority:
    name: ⭐ Priority · compose
    if: >-
      ${{ always()
          && inputs.priority != ''
          && needs.sequencing.outputs.priority == 'serial'
          && contains(inputs.modes, 'compose')
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.test-dns.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && (!inputs.mode_fail_fast
              || contains(fromJSON('["success","skipped"]'), needs.test-deploy-swarm-priority.result)) }}
    needs:
      - test-dns
      - images-mirror-missing
      - lint
      - test
      - sequencing
      - test-deploy-swarm-priority
    uses: ./.github/workflows/call-test-deploy-compose.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      marker: " ⭐"

  test-deploy-host-priority:
    name: ⭐ Priority · host
    if: >-
      ${{ always()
          && inputs.priority != ''
          && needs.sequencing.outputs.priority == 'serial'
          && contains(inputs.modes, 'host')
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.test-dns.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && (!inputs.mode_fail_fast
              || contains(fromJSON('["success","skipped"]'), needs.test-deploy-compose-priority.result)) }}
    needs:
      - test-dns
      - images-mirror-missing
      - lint
      - test
      - sequencing
      - test-deploy-compose-priority
    uses: ./.github/workflows/call-test-deploy-host.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.priority }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      marker: " ⭐"
      exclude_compose_covered: ${{ contains(inputs.modes, 'compose') && 'true' || 'false' }}

  test-deploy-swarm:
    name: 🔁 Regular · swarm
    if: >-
      ${{ always()
          && contains(inputs.modes, 'swarm')
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.build-ci-images.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-single-node-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-compose-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-host-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-swarm-priority.result) }}
    needs:
      - build-ci-images
      - images-mirror-missing
      - test-deploy-single-node-priority
      - test-deploy-compose-priority
      - test-deploy-host-priority
      - test-deploy-swarm-priority
      - lint
      - test
    uses: ./.github/workflows/call-test-deploy-swarm.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.whitelist }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      blacklist: ${{ inputs.priority }}

  test-deploy-single-node:
    name: 🔁 Regular · single-node
    if: >-
      ${{ always()
          && needs.sequencing.outputs.regular == 'parallel'
          && (contains(inputs.modes, 'compose') || contains(inputs.modes, 'host'))
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.test-dns.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-single-node-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-compose-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-host-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-swarm-priority.result) }}
    needs:
      - test-dns
      - images-mirror-missing
      - sequencing
      - test-deploy-single-node-priority
      - test-deploy-compose-priority
      - test-deploy-host-priority
      - test-deploy-swarm-priority
      - lint
      - test
    uses: ./.github/workflows/call-test-deploy-single-node.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.whitelist }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      modes: ${{ inputs.modes }}
      blacklist: ${{ inputs.priority }}

  test-deploy-compose:
    name: 🔁 Regular · compose
    if: >-
      ${{ always()
          && needs.sequencing.outputs.regular == 'serial'
          && contains(inputs.modes, 'compose')
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.test-dns.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-single-node-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-compose-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-host-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-swarm-priority.result)
          && (!inputs.mode_fail_fast
              || contains(fromJSON('["success","skipped"]'), needs.test-deploy-swarm.result)) }}
    needs:
      - test-dns
      - images-mirror-missing
      - sequencing
      - test-deploy-single-node-priority
      - test-deploy-compose-priority
      - test-deploy-host-priority
      - test-deploy-swarm-priority
      - test-deploy-swarm
      - lint
      - test
    uses: ./.github/workflows/call-test-deploy-compose.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.whitelist }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      blacklist: ${{ inputs.priority }}

  test-deploy-host:
    name: 🔁 Regular · host
    if: >-
      ${{ always()
          && needs.sequencing.outputs.regular == 'serial'
          && contains(inputs.modes, 'host')
          && needs.lint.result == 'success'
          && needs.test.result == 'success'
          && needs.test-dns.result == 'success'
          && needs.images-mirror-missing.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-single-node-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-compose-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-host-priority.result)
          && contains(fromJSON('["success","skipped"]'), needs.test-deploy-swarm-priority.result)
          && (!inputs.mode_fail_fast
              || contains(fromJSON('["success","skipped"]'), needs.test-deploy-compose.result)) }}
    needs:
      - test-dns
      - images-mirror-missing
      - sequencing
      - test-deploy-single-node-priority
      - test-deploy-compose-priority
      - test-deploy-host-priority
      - test-deploy-swarm-priority
      - test-deploy-compose
      - lint
      - test
    uses: ./.github/workflows/call-test-deploy-host.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.whitelist }}
      lifecycles: ${{ inputs.lifecycles }}
      filesystem: ${{ inputs.filesystem }}
      blacklist: ${{ inputs.priority }}
      exclude_compose_covered: ${{ contains(inputs.modes, 'compose') && 'true' || 'false' }}

  test-runner-smoke:
    needs:
      - test-deploy-swarm
    if: ${{ always() && vars.CI_SELF_HOSTED_RUNNER_COUNT != '0' && vars.CI_SELF_HOSTED_RUNNER_COUNT != '' && (needs.test-deploy-swarm.result == 'success' || needs.test-deploy-swarm.result == 'failure') }}
    uses: ./.github/workflows/call-test-runner-smoke.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  test-install-make:
    uses: ./.github/workflows/call-test-install-make.yml
  test-install-pkgmgr:
    uses: ./.github/workflows/call-test-install-pkgmgr.yml

  test-workspace:
    if: ${{ inputs.workspace == 'true' || (inputs.workspace == 'auto' && (inputs.whitelist == '' || inputs.whitelist == '__ALL__')) }}
    uses: ./.github/workflows/call-test-workspace.yml
    needs:
      - images-mirror-missing
      - lint
      - test
    secrets: inherit

  test-instructions:
    if: ${{ inputs.instructions == 'true' || (inputs.instructions == 'auto' && (inputs.whitelist == '' || inputs.whitelist == '__ALL__')) }}
    uses: ./.github/workflows/call-test-instructions.yml
    needs:
      - images-mirror-missing
      - build-ci-images
      - lint
      - test
    with:
      distros: ${{ inputs.distros }}
    secrets: inherit

  report-main-failures:
    name: 🐞 Report main role failures
    needs:
      - test-deploy-single-node-priority
      - test-deploy-compose-priority
      - test-deploy-host-priority
      - test-deploy-swarm-priority
      - test-deploy-single-node
      - test-deploy-compose
      - test-deploy-host
      - test-deploy-swarm
    if: ${{ always() && github.ref == 'refs/heads/main' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - name: 🐞 Open or append issues for failed roles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m cli.meta.ci.report_failures --run-id "${{ github.run_id }}" --repo "${{ github.repository }}"

  done:
    name: 🏁 Finish pipeline
    needs:
      - wait-fork-prereq-run
      - fork-prereqs-ready
      - build-ci-images
      - images-mirror-missing
      - test-dns
      - test-install-make
      - test-install-pkgmgr
      - sequencing
      - test-deploy-single-node-priority
      - test-deploy-compose-priority
      - test-deploy-host-priority
      - test-deploy-swarm-priority
      - test-deploy-single-node
      - test-deploy-compose
      - test-deploy-host
      - test-deploy-swarm
      - test-runner-smoke
      - test-workspace
      - test-instructions
      - test
      - lint
      - security-codeql
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 🛑 Fail if any upstream job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Pipeline failed: at least one upstream job failed or was cancelled." >&2
          exit 1
      - name: ✅ Done
        run: echo "All checks passed."
