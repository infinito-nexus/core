name: "📦 Test: Install Package Manager"

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  test-install-pkgmgr:
    name: 📦 PKGMGR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIX_CONFIG: |
        access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: ⬇️ Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 🔍 Resolve INFINITO_VENV_DIR from default.env
        run: |
          venv_dir="$(awk -F= '/^INFINITO_VENV_DIR=/{print $2; exit}' default.env)"
          test -n "${venv_dir}" || { echo "INFINITO_VENV_DIR not found in default.env" >&2; exit 1; }
          echo "INFINITO_VENV_DIR=${venv_dir}" >> "$GITHUB_ENV"

      - name: 📦 Install & test in every pkgmgr virgin container (parallel)
        run: ./scripts/tests/install/pkgmgr.sh
