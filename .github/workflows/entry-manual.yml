name: "⚡ CI: Manual"
run-name: "Manual CI triggered: ${{ inputs.distros }}; ${{ inputs.priority != '' && format('{0} ⭐; ', inputs.priority) || '' }}${{ inputs.whitelist != '' && inputs.whitelist || 'diff-derived (origin/main)' }}"

concurrency:
  group: global-ci-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      distros:
        description: "🐧 Distros to sweep. Example: 'arch debian'"
        required: false
        default: "debian"
        type: string
      priority:
        description: "⭐ Roles to deploy first. The rest waits until they are green."
        required: false
        default: ""
        type: string
      whitelist:
        description: "🎯 Roles to deploy. Empty: diff vs origin/main. '__ALL__': every role."
        required: false
        default: ""
        type: string
      lifecycles:
        description: "♻️ Lifecycle envelope for test-deploy discovery (comma/space-separated)."
        required: false
        default: ""
        type: string
      modes:
        description: "🚀 Deploy modes to test. Only the listed ones run their deploy job."
        required: false
        default: "swarm compose host"
        type: string
      filesystem:
        description: "🗄️ Filesystem the docker data root runs on. 'auto' picks one at random per deploy mode; btrfs and zfs are what engage the backup snapshot mode."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "ext4"
          - "btrfs"
          - "zfs"
      workspace:
        description: "🧑‍💻 Run the workspace test (dev-runtime image matrix). 'auto' runs it on a global scope only."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"
      instructions:
        description: "📖 Run the instructions test (role README Production command). 'auto' runs it on a global scope only."
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "true"
          - "false"

permissions:
  contents: read
  packages: write
  security-events: write
  actions: write
  issues: write

jobs:
  ci-orchestrator:
    name: 🎛️ Orchestrate CI (manual)
    uses: ./.github/workflows/ci-orchestrator.yml
    with:
      distros: ${{ inputs.distros }}
      whitelist: ${{ inputs.whitelist }}
      lifecycles: ${{ inputs.lifecycles }}
      modes: ${{ inputs.modes }}
      priority: ${{ inputs.priority }}
      filesystem: ${{ inputs.filesystem }}
      workspace: ${{ inputs.workspace }}
      instructions: ${{ inputs.instructions }}
      force_cancel_in_progress: true
    secrets: inherit
