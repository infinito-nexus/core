name: "🧹 Lint"

on:
  workflow_call:
    inputs:
      role_skeleton:
        description: "True renders the role skeleton sample roles into roles/ before the lint checks run."
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      INFINITO_LINT_RUNNER: host
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: ⬇️ Fetch the upstream main lint-quality diffs against
        shell: bash
        env:
          CI_SYNC_MAIN_SOURCE_REPOSITORY_DEFAULT: infinito-nexus/core
          CI_SYNC_MAIN_SOURCE_REPOSITORY: ${{ vars.CI_SYNC_MAIN_SOURCE_REPOSITORY }}
          CI_SYNC_MAIN_SOURCE_REPOSITORY_IS_SET: ${{ contains(toJSON(vars), '"CI_SYNC_MAIN_SOURCE_REPOSITORY"') }}
        run: |
          set -euo pipefail
          git fetch "$(./scripts/meta/resolve/baseline_remote.sh)" main:refs/remotes/origin/main --force

      - name: 🔧 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 🧩 Render the role skeleton sample roles
        if: ${{ inputs.role_skeleton }}
        shell: bash
        run: make role-skeleton-samples

      - name: 🧰 Install the lint tools ahead of make lint
        id: install-lint
        continue-on-error: true
        shell: bash
        run: make install-lint

      - name: 🔑 Fingerprint what ansible-lint reads
        id: ansible-lint-key
        if: ${{ steps.install-lint.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          source scripts/lint/ansible/stamp.sh
          fingerprint="$(ansible_lint_fingerprint all)"
          echo "key=ansible-lint-stamp-${fingerprint}" >> "$GITHUB_OUTPUT"

      - name: ♻️ Restore the ansible-lint stamp of these inputs
        id: ansible-lint-restore
        if: ${{ steps.ansible-lint-key.outputs.key != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ansible-lint.stamp
          key: ${{ steps.ansible-lint-key.outputs.key }}

      - name: 🧹 Run all lint checks via make
        shell: bash
        run: |
          set -euo pipefail
          make lint 2>&1 | tee /tmp/lint-output.txt

      - name: 💾 Save the ansible-lint stamp of a green run
        if: >-
          ${{ !cancelled()
              && steps.ansible-lint-key.outputs.key != ''
              && steps.ansible-lint-restore.outputs.cache-hit != 'true'
              && hashFiles('build/ansible-lint.stamp') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ansible-lint.stamp
          key: ${{ steps.ansible-lint-key.outputs.key }}

      - name: 🔨 Build step summary from annotations
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m utils.annotations.summarize /tmp/lint-output.txt "Lint Annotation Summary"
