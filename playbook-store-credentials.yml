---
# Param: gitea_store_token_now        - moment of the rotation run, RFC 3339 with a numeric offset in UTC
# Param: gitea_store_token_expires_at - moment the rotation revokes the new token, RFC 3339 with a numeric offset in UTC
# Param: gitea_store_token_file       - absolute path the playbook leaves the minted token at for the runner
- name: "Mint the store's Gitea token for rotate store credentials"
  hosts: all
  any_errors_fatal: true
  become: true
  environment:
    CONTAINER_EXEC_TIMEOUT: "{{ SYS_TIMEOUT_CONTAINER_EXEC }}"
  tasks:
    - name: ✅ Assert the plan store-credentials.sh handed over
      ansible.builtin.assert:
        that:
          - gitea_store_token_now | length > 0
          - gitea_store_token_expires_at | length > 0
          - gitea_store_token_file is match('^/')
          - MASK_CREDENTIALS_IN_LOGS | bool
        fail_msg: "Run store-credentials.sh: it hands over the plan of rotate_store_credentials.py and masks every credential"
        quiet: true

    - name: 🔀 Merge variables
      ansible.builtin.include_tasks: tasks/utils/constructor/variables.yml

    - name: 🧊 Render the applications SPOT once and carry it into every task's worker
      applications_carrier: {}

    - name: "🔑 Mint the store token and revoke the expired ones in Gitea"
      ansible.builtin.include_role:
        name: web-app-gitea
        tasks_from: utils/store_token
      when: "'web-app-gitea' in group_names"

    - name: "📤 Hand the store token to the runner, readable by its task alone"
      ansible.builtin.copy:
        content: "{{ gitea_store_token.token }}"
        dest: "{{ gitea_store_token_file }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: "{{ MASK_CREDENTIALS_IN_LOGS | bool }}"
      when: gitea_store_token is defined
